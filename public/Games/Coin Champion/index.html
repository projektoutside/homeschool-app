<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#22163e">
<meta name="description" content="A coin carnival for curious minds. Count U.S. coins, make exact amounts, solve change challenges, and collect adventure stars.">
<title>Coin Champ · The Coin Carnival</title><link rel="icon" href="thumb.svg" type="image/svg+xml">
<link rel="preload" href="assets/fredoka.ttf" as="font" type="font/ttf" crossorigin><link rel="preload" href="assets/coin-carnival.webp" as="image">
<link rel="stylesheet" href="game.css"><link rel="stylesheet" href="kid-friendly.css"><link rel="stylesheet" href="coin-visuals.css"><link rel="stylesheet" href="mini-games.css"><script src="../shared/lahsPointsBridge.js" defer></script><script src="game.js" type="module"></script>
</head>
<body>
<div class="world" aria-hidden="true"></div>
<div class="app" id="app" data-skin="sunrise">
<header class="topbar">
<button class="icon-button back-button" id="exit-button" type="button" aria-label="Back to Games"></button>
<button class="brand" id="brand-button" type="button" aria-label="Coin Champ main menu"><span class="brand-coin" aria-hidden="true">C</span><span>COIN CHAMP</span></button>
<div class="topbar-right"><span class="score-pill" id="score-pill" hidden><span id="score-value">0</span><span>points</span></span>
<button class="ticket-pill" id="tickets-button" type="button" aria-label="Open Prize booth"><span id="ticket-icon" aria-hidden="true"></span><span id="ticket-count">0</span></button>
<button class="icon-button" id="sound-button" type="button" aria-label="Mute sound" aria-pressed="false"></button><button class="icon-button" id="help-button" type="button" aria-label="Coin guide and help"></button></div>
</header>
<main id="main" tabindex="-1" aria-label="Coin Champ"></main>
<footer class="app-footer"><span id="save-status">Saved on this device</span><button id="settings-button" type="button">Play settings</button></footer>
</div>
<dialog id="game-dialog" aria-labelledby="dialog-title"></dialog><div id="celebration" class="celebration" aria-hidden="true"></div>
<div class="sr-only" id="live" role="status" aria-live="polite" aria-atomic="true"></div>
<noscript>This coin adventure needs JavaScript. Enable it in your browser to play.</noscript>
</body>
</html>
