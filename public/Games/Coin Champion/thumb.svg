<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Coin Champ thumbnail</title>
  <desc id="desc">A warm illustrated badge with shiny coins and the title Coin Champ.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4dd" />
      <stop offset="50%" stop-color="#d8f0e0" />
      <stop offset="100%" stop-color="#b6d9f7" />
    </linearGradient>
    <linearGradient id="coinSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefefe" />
      <stop offset="45%" stop-color="#dde4ef" />
      <stop offset="100%" stop-color="#adb7c7" />
    </linearGradient>
    <linearGradient id="coinCopper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7c9aa" />
      <stop offset="45%" stop-color="#d18656" />
      <stop offset="100%" stop-color="#8e4b28" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#7a6d58" flood-opacity="0.24" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#bg)" />
  <g opacity="0.7">
    <circle cx="98" cy="92" r="70" fill="#ffffff" opacity="0.45" />
    <circle cx="438" cy="118" r="56" fill="#fff7df" opacity="0.42" />
    <circle cx="428" cy="420" r="72" fill="#f7fff8" opacity="0.38" />
  </g>

  <g filter="url(#shadow)">
    <rect x="52" y="64" width="408" height="384" rx="78" fill="#ffffff" fill-opacity="0.72" />
  </g>

  <g transform="translate(0 18)">
    <g transform="translate(116 186)">
      <circle cx="0" cy="0" r="84" fill="url(#coinCopper)" stroke="#f7e6d7" stroke-width="10" />
      <circle cx="0" cy="0" r="60" fill="none" stroke="#f9dbc8" stroke-width="7" opacity="0.8" />
      <text x="0" y="-8" text-anchor="middle" font-size="28" font-family="Trebuchet MS, Segoe UI, sans-serif" fill="#fff7ef" font-weight="700">PENNY</text>
      <text x="0" y="28" text-anchor="middle" font-size="40" font-family="Trebuchet MS, Segoe UI, sans-serif" fill="#fff7ef" font-weight="800">1¢</text>
    </g>

    <g transform="translate(268 146)">
      <circle cx="0" cy="0" r="72" fill="url(#coinSilver)" stroke="#f7fbff" stroke-width="10" />
      <circle cx="0" cy="0" r="52" fill="none" stroke="#eef4fa" stroke-width="7" opacity="0.9" />
      <text x="0" y="-8" text-anchor="middle" font-size="24" font-family="Trebuchet MS, Segoe UI, sans-serif" fill="#5d6f87" font-weight="700">DIME</text>
      <text x="0" y="26" text-anchor="middle" font-size="36" font-family="Trebuchet MS, Segoe UI, sans-serif" fill="#4a5f76" font-weight="800">10¢</text>
    </g>

    <g transform="translate(346 252)">
      <circle cx="0" cy="0" r="94" fill="url(#coinSilver)" stroke="#f8fbff" stroke-width="12" />
      <circle cx="0" cy="0" r="68" fill="none" stroke="#ecf2f8" stroke-width="8" opacity="0.92" />
      <text x="0" y="-10" text-anchor="middle" font-size="29" font-family="Trebuchet MS, Segoe UI, sans-serif" fill="#58697f" font-weight="700">QUARTER</text>
      <text x="0" y="30" text-anchor="middle" font-size="44" font-family="Trebuchet MS, Segoe UI, sans-serif" fill="#46586e" font-weight="800">25¢</text>
    </g>
  </g>

  <g transform="translate(256 414)">
    <rect x="-148" y="-42" width="296" height="84" rx="42" fill="#5f7b64" opacity="0.14" />
    <text x="0" y="-4" text-anchor="middle" font-size="52" font-family="Trebuchet MS, Segoe UI, sans-serif" fill="#31503b" font-weight="800">Coin Champ</text>
    <text x="0" y="28" text-anchor="middle" font-size="22" font-family="Trebuchet MS, Segoe UI, sans-serif" fill="#587068" font-weight="700">Count coins with confidence</text>
  </g>
</svg>
