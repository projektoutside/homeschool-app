<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f3f0e3">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23f0d8b6'/%3E%3Ccircle cx='24' cy='25' r='12' fill='%23c98a55'/%3E%3Ccircle cx='37' cy='35' r='15' fill='%23f6eddc'/%3E%3Ccircle cx='42' cy='25' r='4' fill='%232b241d'/%3E%3Cpath d='M46 26l10 3-10 4z' fill='%236e5a4a'/%3E%3C/svg%3E">
  <title>Many Birds One Stone</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preload" href="assets/fonts/fredoka.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/woodland-v2.webp" as="image">
  <link rel="preload" href="assets/birds/EnemyBird16-strip.png" as="image">
</head>
<body>
  <div id="app">
    <div id="shell">
      <header class="hud">
        <div class="game-brand"><svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true"><path d="M11 36c-4-12 1-25 18-28 6-1 10 0 10 0s1 4 0 10C36 35 23 40 11 36Z"/><path d="m7 41 23-24M12 35l1-11m5 5 12-1m-6-5 1-9"/></svg><h1><span>Many Birds</span> <span>One Stone</span></h1><p>A little ink. A clever path.<br>One wonderfully satisfying drop.</p></div>
        <div class="hud-cluster">
          <button class="hud-button" id="homeButton" type="button" aria-label="Back to Games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9"/></svg><span class="button-label">Games</span></button>
          <button class="hud-button" id="restartButton" type="button" aria-label="Restart level"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2 8M3 3v7h7"/></svg><span class="button-label">Retry</span></button>
          <button class="hud-button" id="soundButton" type="button" aria-label="Mute sound" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4Z"/><path class="sound-waves" d="M17 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg></button>
        </div>
        <div class="hud-card level-card">
          <button class="mini-button" id="prevLevelButton" type="button" aria-label="Previous level">‹</button>
          <div class="level-main">
            <div class="level-label" id="levelCount">Level 1</div>
            <div class="level-value" id="levelValue">Breeze Bowl</div>
          </div>
          <button class="mini-button" id="nextLevelButton" type="button" aria-label="Next level">›</button>
        </div>
        <div class="hud-card meter-card">
          <div class="meter-label-row">
            <span>Ink</span>
            <span id="inkLabel">100%</span>
          </div>
          <div class="meter-track">
            <div class="meter-fill" id="inkFill"></div>
          </div>
        </div>
        <div class="flock-progress" aria-live="polite"><span class="bird-token"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12c0 5 4 8 9 6l6-4 3-4-5 1c0-6-6-7-8-3L2 5l2 7Z"/><path d="m8 12 5 2m3-5h.01"/></svg></span><span class="bird-token"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12c0 5 4 8 9 6l6-4 3-4-5 1c0-6-6-7-8-3L2 5l2 7Z"/><path d="m8 12 5 2m3-5h.01"/></svg></span><span class="bird-token"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12c0 5 4 8 9 6l6-4 3-4-5 1c0-6-6-7-8-3L2 5l2 7Z"/><path d="m8 12 5 2m3-5h.01"/></svg></span><span id="birdProgress">0 / 1 bird</span></div>
      </header>

      <main class="stage-panel">
        <div class="stage-frame">
          <canvas id="gameCanvas" width="360" height="640" tabindex="0" aria-label="Many Birds One Stone playfield. Draw paths by dragging, move the claw with A and D, and press Space to drop."></canvas>
          <div class="canvas-shine"></div>
          <div class="overlay" id="overlay" aria-live="polite" aria-hidden="true">
            <div class="overlay-card" role="dialog" aria-modal="true" aria-labelledby="overlayTitle" aria-describedby="overlayBody" tabindex="-1">
              <div class="overlay-content" tabindex="0" aria-label="Instructions and results">
              <div class="overlay-emblem"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M11 36c-4-12 1-25 18-28 6-1 10 0 10 0s1 4 0 10C36 35 23 40 11 36Z"/><path d="m7 41 23-24M12 35l1-11m5 5 12-1m-6-5 1-9"/></svg></div>
              <div class="reward-stars"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z"/></svg></div>
              <h1 class="overlay-title" id="overlayTitle">Many Birds One Stone</h1>
              <p class="overlay-body" id="overlayBody"></p>
              <div class="overlay-stats" id="overlayStats"></div>
              </div>
              <div class="overlay-actions">
                <button class="overlay-button" id="overlaySecondary" type="button">Games</button>
                <button class="overlay-button overlay-button--primary" id="overlayPrimary" type="button">Begin</button>
              </div>
            </div>
          </div>
        </div>
      </main>

      <footer class="controls">
        <div class="status-card">
          <div class="status-title">Your flight plan</div>
          <div class="status-copy" id="statusCopy"></div>
        </div>
        <div class="action-row">
          <button class="control-button" id="hintButton" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6m-6 3h6M8 14a6 6 0 1 1 8 0l-1 3H9Z"/></svg>Hint</button>
          <button class="control-button" id="clearButton" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 15 9-11 7 6-9 11H8Zm7 6h10M8 10l7 6"/></svg>Clear lines</button>
          <button class="control-button control-button--primary" id="dropButton" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v14m-6-6 6 6 6-6M4 21h16"/></svg>Drop stone <small>Space</small></button>
        </div>
      </footer>
    </div>

    <div class="rotate-notice" id="rotateNotice" aria-hidden="true">
      <div class="rotate-card">
        <h2>Rotate back to portrait</h2>
        <p>Turn your device upright for the full woodland playfield. Your game is paused and your lines are safe.</p><button id="rotateHomeButton" class="hud-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9"/></svg>Back to Games</button>
      </div>
    </div>

    <div class="sr-only" id="srStatus" aria-live="polite"></div>
  </div>
  <script src="../shared/lahsPointsBridge.js"></script>
  <script src="audio.js"></script>
  <script src="drop-mechanism.js"></script>
  <script src="runways.js"></script>
  <script src="birds.js"></script>
  <script src="physics.js"></script>
  <script src="campaign.js"></script>
  <script>
    (() => {
      'use strict';

      const GAME_ID = 'many-birds-one-stone';
      const STORAGE_KEY = 'lahs-many-birds-one-stone-v1';
      const LEGACY_BACKUP_KEY = `${STORAGE_KEY}:before-starter-levels`;
      const CAMPAIGN_VERSION = 2;
      const INTRO_LEVEL_COUNT = 6;
      const HOST_LIFECYCLE_MESSAGE = 'LAHS_HOST_LIFECYCLE';
      const GAME_EXIT_TO_HOME_MESSAGE = 'LAHS_GAME_EXIT_TO_HOME';
      const SOUND_SETTINGS_MESSAGE = 'APP_SOUND_SETTINGS_UPDATE';
      const WORLD_W = 360;
      const WORLD_H = 640;
      const FLOOR_Y = WORLD_H - 14;
      const DRAW_TOP = 110;
      const DRAW_BOTTOM = 522;
      const DRAW_LEFT = 22;
      const DRAW_RIGHT = WORLD_W - 22;
      const STONE_RADIUS = 12;
      const STONE_DROP_TAP_RADIUS = STONE_RADIUS + 18;
      const CLAW_CONTROL_RADIUS = STONE_DROP_TAP_RADIUS + 10;
      const CLAW_MIN_X = 54;
      const CLAW_MAX_X = WORLD_W - 54;
      const CLAW_DRAG_THRESHOLD = 8;
      const DRAWN_LINE_WIDTH = 11;
      const STATIC_LINE_WIDTH = 14;
      const GRAVITY = 980;
      const STEP = 1 / 60;
      const FAIL_SLEEP_SPEED = 22;
      const FAIL_SLEEP_MS = 1050;
      const FAIL_MAX_TIME_MS = 16500;
      const CLEAR_BASE_POINTS = 100;
      const CLEAR_NO_HINT_BONUS = 25;
      const CLEAR_INK_BONUS = 25;
      const COLLISION_SUBSTEPS = 3;
      const TOUCH_ROTATE_BREAKPOINT = 1024;
      const DEFAULT_SOUND = { muted: false, sfxVolume: 0.75 };
      const TARGET_ORIGIN = window.location.origin && window.location.origin !== 'null' && !window.location.origin.startsWith('file:')
        ? window.location.origin
        : '*';

      const dom = {
        canvas: document.getElementById('gameCanvas'),
        levelValue: document.getElementById('levelValue'),
        prevLevelButton: document.getElementById('prevLevelButton'),
        nextLevelButton: document.getElementById('nextLevelButton'),
        restartButton: document.getElementById('restartButton'),
        homeButton: document.getElementById('homeButton'),
        hintButton: document.getElementById('hintButton'),
        clearButton: document.getElementById('clearButton'),
        dropButton: document.getElementById('dropButton'),
        inkLabel: document.getElementById('inkLabel'),
        inkFill: document.getElementById('inkFill'),
        statusCopy: document.getElementById('statusCopy'),
        overlay: document.getElementById('overlay'),
        soundButton: document.getElementById('soundButton'),
        levelCount: document.getElementById('levelCount'),
        birdProgress: document.getElementById('birdProgress'),
        overlayTitle: document.getElementById('overlayTitle'),
        overlayBody: document.getElementById('overlayBody'),
        overlayStats: document.getElementById('overlayStats'),
        overlayPrimary: document.getElementById('overlayPrimary'),
        overlaySecondary: document.getElementById('overlaySecondary'),
        rotateNotice: document.getElementById('rotateNotice'),
        srStatus: document.getElementById('srStatus'),
      };

      const ctx = dom.canvas.getContext('2d');
      const woodlandAudio = new WoodlandAudio();
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const dropMechanism = new WoodlandDropMechanism({ width: WORLD_W, radius: STONE_RADIUS, reducedMotion });
      const runways = new WoodlandRunways(WORLD_W, WORLD_H, FLOOR_Y);
      const scenery = new Image();
      scenery.src = './assets/woodland-v2.webp';
      const woodlandBirds = new WoodlandBirds({ reducedMotion });

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function lerp(start, end, amount) {
        return start + (end - start) * amount;
      }

      function distance(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        return Math.hypot(dx, dy);
      }

      function seg(x1, y1, x2, y2, kind, radius) {
        return {
          x1,
          y1,
          x2,
          y2,
          kind: kind || 'blocker',
          radius: radius || STATIC_LINE_WIDTH / 2,
        };
      }

      const LEVELS = window.WoodlandCampaign.levels;

      const WORLD_COLLIDERS = [
        createStaticCollider(seg(10, 96, 10, WORLD_H + 24, 'wall', 10)),
        createStaticCollider(seg(WORLD_W - 10, 96, WORLD_W - 10, WORLD_H + 24, 'wall', 10)),
        { ax: 10, ay: FLOOR_Y, bx: WORLD_W - 10, by: FLOOR_Y, radius: 0, kind: 'floor' },
      ];

      function createStone() {
        return {
          x: WORLD_W / 2,
          y: 92,
          vx: 0,
          vy: 0,
          radius: STONE_RADIUS,
          rotation: 0,
          attached: true,
          active: false,
          onFloor: false,
          supported: false,
          floorHit: false,
          sleepMs: 0,
          hitPulse: 0,
        };
      }

      function defaultProgress() {
        return {
          campaignVersion: CAMPAIGN_VERSION,
          highestUnlocked: 1,
          selectedLevel: 1,
          bestStats: {},
          onboarded: false,
        };
      }

      function loadProgress() {
        let raw = null;
        try {
          raw = window.localStorage.getItem(STORAGE_KEY);
          if (!raw) return defaultProgress();
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return { ...defaultProgress(), legacyBackup: raw };
          const bestStats = parsed.bestStats && typeof parsed.bestStats === 'object' && !Array.isArray(parsed.bestStats) ? parsed.bestStats : {};
          const legacy = (Number(parsed.campaignVersion) || 1) < CAMPAIGN_VERSION;
          const oldCount = LEVELS.length - INTRO_LEVEL_COUNT;
          const priorUnlocked = clamp(Math.floor(Number(parsed.highestUnlocked)) || 1, 1, legacy ? oldCount : LEVELS.length);
          const priorSelected = clamp(Math.floor(Number(parsed.selectedLevel)) || 1, 1, legacy ? oldCount : LEVELS.length);
          const hasPlayed = Boolean(parsed.onboarded) || priorUnlocked > 1 || Object.keys(bestStats).length > 0;
          const offset = legacy && hasPlayed ? INTRO_LEVEL_COUNT : 0;
          return {
            campaignVersion: CAMPAIGN_VERSION,
            highestUnlocked: priorUnlocked + offset,
            selectedLevel: priorSelected + offset,
            bestStats: offset ? Object.fromEntries(Object.entries(bestStats).map(([key, stats]) => [
              /^([1-9]|1[0-2])$/.test(key) ? String(Number(key) + offset) : key, stats,
            ])) : bestStats,
            onboarded: Boolean(parsed.onboarded),
            legacyBackup: legacy ? raw : null,
          };
        } catch (_error) {
          return { ...defaultProgress(), legacyBackup: raw };
        }
      }

      const storedProgress = loadProgress();
      const state = {
        levelIndex: clamp(storedProgress.selectedLevel - 1, 0, LEVELS.length - 1),
        highestUnlocked: clamp(storedProgress.highestUnlocked || 1, 1, LEVELS.length),
        bestStats: storedProgress.bestStats || {},
        onboardingPending: !storedProgress.onboarded,
        overlayVisible: false,
        overlayPrimaryAction: 'begin',
        overlaySecondaryAction: 'home',
        level: null,
        staticColliders: [],
        drawnStrokes: [],
        drawnColliders: [],
        particles: [],
        stoneTrail: [],
        pointer: {
          active: false,
          pointerId: null,
          points: [],
          inkUsedDuringStroke: 0,
        },
        inkUsed: 0,
        hintUsed: false,
        hintVisibleUntil: 0,
        autoDropAt: null,
        runStartAt: performance.now(),
        runReleasedAt: null,
        runEnded: false,
        outcome: 'ready',
        pendingResult: null,
        currentAttemptId: 0,
        awardedForAttempt: false,
        statusText: '',
        linePreviewPulse: 0,
        elapsed: 0,
        lastFrame: performance.now(),
        accumulator: 0,
        hostPaused: false,
        hiddenPause: false,
        rotatePaused: false,
        clawBaseX: WORLD_W / 2,
        clawControl: {
          active: false,
          pointerId: null,
          startPoint: null,
          startBaseX: WORLD_W / 2,
          moved: false,
          tapEligible: false,
        },
        stone: createStone(),
        audio: {
          muted: DEFAULT_SOUND.muted,
          sfxVolume: DEFAULT_SOUND.sfxVolume,
          context: null,
        },
        pointsContext: null,
      };

      function saveProgress() {
        try {
          if (storedProgress.legacyBackup && !window.localStorage.getItem(LEGACY_BACKUP_KEY)) {
            window.localStorage.setItem(LEGACY_BACKUP_KEY, storedProgress.legacyBackup);
          }
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify({
            campaignVersion: CAMPAIGN_VERSION,
            highestUnlocked: state.highestUnlocked,
            selectedLevel: state.levelIndex + 1,
            bestStats: state.bestStats,
            onboarded: !state.onboardingPending,
          }));
        } catch (_error) {
          // Ignore storage failures in standalone/offline contexts.
        }
      }

      function resetClawControl() {
        state.clawControl.active = false;
        state.clawControl.pointerId = null;
        state.clawControl.startPoint = null;
        state.clawControl.startBaseX = state.clawBaseX;
        state.clawControl.moved = false;
        state.clawControl.tapEligible = false;
      }

      function setClawBaseX(nextX) {
        state.clawBaseX = clamp(nextX, CLAW_MIN_X, CLAW_MAX_X);
        if (state.stone.attached) {
          const clawPose = getClawPose();
          state.stone.x = clawPose.x;
          state.stone.y = clawPose.stoneY;
        }
      }

      function announce(text) {
        dom.srStatus.textContent = '';
        window.requestAnimationFrame(() => {
          dom.srStatus.textContent = text;
        });
      }

      function setStatus(text) {
        state.statusText = text;
        dom.statusCopy.textContent = text;
      }

      function fmtPercent(value) {
        return `${Math.round(value * 100)}%`;
      }

      function fmtSeconds(ms) {
        return `${(ms / 1000).toFixed(1)}s`;
      }

      function isTouchLandscape() {
        const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        if (!coarse) return false;
        return window.innerWidth > window.innerHeight;
      }

      function shouldForcePortrait() {
        return isTouchLandscape() && Math.max(window.innerWidth, window.innerHeight) <= TOUCH_ROTATE_BREAKPOINT * 1.5;
      }

      function syncPauseState() {
        const paused = state.hostPaused || state.hiddenPause || state.rotatePaused;
        woodlandAudio.setPaused(paused);
        if (!paused && state.audio.context && state.audio.context.state === 'suspended' && !state.audio.muted) {
          state.audio.context.resume().catch(() => {});
        }
        if (paused && state.audio.context && state.audio.context.state === 'running') {
          state.audio.context.suspend().catch(() => {});
        }
      }

      function updateRotateNotice() {
        const shouldRotate = shouldForcePortrait();
        state.rotatePaused = shouldRotate;
        dom.rotateNotice.classList.toggle('is-visible', shouldRotate);
        dom.rotateNotice.setAttribute('aria-hidden', String(!shouldRotate));
        syncPauseState();
        refreshButtons();
      }

      function setAudioMuted(muted) {
        state.audio.muted = Boolean(muted);
        woodlandAudio.setMuted(state.audio.muted);
        dom.soundButton.setAttribute('aria-pressed', String(state.audio.muted));
        dom.soundButton.setAttribute('aria-label', state.audio.muted ? 'Unmute sound' : 'Mute sound');
        syncPauseState();
      }

      function setSfxVolume(volume) {
        state.audio.sfxVolume = clamp(Number(volume) || 0, 0, 1);
        woodlandAudio.setVolume(state.audio.sfxVolume);
      }

      function ensureAudioContext() {
        woodlandAudio.setMuted(state.audio.muted);
        woodlandAudio.setVolume(state.audio.sfxVolume);
        state.audio.context = woodlandAudio.unlock();
        return state.audio.muted ? null : state.audio.context;
      }

      function playTone(kind) {
        if (woodlandAudio.play(kind)) return;
        const audioContext = ensureAudioContext();
        if (!audioContext) return;

        const presets = {
          tap: [520, 0.06, 'triangle', 0.07],
          drop: [240, 0.12, 'sine', 0.08],
          bird: [720, 0.14, 'triangle', 0.09],
          win: [840, 0.24, 'sine', 0.12],
          lose: [180, 0.22, 'sawtooth', 0.07],
        };
        const [frequency, duration, wave, gainValue] = presets[kind] || presets.tap;
        const now = audioContext.currentTime;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = wave;
        oscillator.frequency.setValueAtTime(frequency, now);
        if (kind === 'win') {
          oscillator.frequency.linearRampToValueAtTime(frequency * 1.22, now + duration * 0.7);
        } else if (kind === 'lose') {
          oscillator.frequency.linearRampToValueAtTime(frequency * 0.65, now + duration);
        } else if (kind === 'bird') {
          oscillator.frequency.linearRampToValueAtTime(frequency * 0.88, now + duration);
        }
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, gainValue * state.audio.sfxVolume), now + 0.016);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start(now);
        oscillator.stop(now + duration + 0.03);
      }

      function showOverlay(config) {
        state.overlayVisible = true;
        state.overlayPrimaryAction = config.primaryAction || 'begin';
        state.overlaySecondaryAction = config.secondaryAction || 'home';
        dom.overlay.dataset.outcome = state.outcome;
        const stars = 1 + Number(!state.hintUsed) + Number(remainingInkRatio() >= 0.4);
        dom.overlay.querySelectorAll('.reward-stars svg').forEach((star, index) => star.classList.toggle('is-earned', index < stars));
        dom.overlayTitle.textContent = config.title || '';
        dom.overlayBody.textContent = config.body || '';
        dom.overlayPrimary.textContent = config.primaryLabel || 'Continue';
        if (config.secondaryLabel) {
          dom.overlaySecondary.hidden = false;
          dom.overlaySecondary.textContent = config.secondaryLabel;
        } else {
          dom.overlaySecondary.hidden = true;
        }
        if (config.stats && config.stats.length) {
          dom.overlayStats.innerHTML = config.stats
            .map((item) => `<div class="overlay-stat-row"><span>${item.label}</span><strong>${item.value}</strong></div>`)
            .join('');
        } else {
          dom.overlayStats.innerHTML = '';
        }
        dom.overlay.classList.add('is-visible');
        dom.overlay.setAttribute('aria-hidden', 'false');
        dom.overlayPrimary.focus({ preventScroll: true });
        refreshButtons();
      }

      function hideOverlay() {
        const active = document.activeElement;
        if (active instanceof HTMLElement && dom.overlay.contains(active)) {
          active.blur();
        }
        state.overlayVisible = false;
        dom.overlay.classList.remove('is-visible');
        dom.overlay.setAttribute('aria-hidden', 'true');
        refreshButtons();
        const nextFocusTarget = !dom.dropButton.disabled ? dom.dropButton : dom.homeButton;
        nextFocusTarget.focus({ preventScroll: true });
        refreshButtons();
      }

      function createStaticCollider(raw) {
        return {
          ax: raw.x1,
          ay: raw.y1,
          bx: raw.x2,
          by: raw.y2,
          radius: raw.radius || STATIC_LINE_WIDTH / 2,
          kind: raw.kind || 'blocker',
        };
      }

      function hydrateLevel(levelIndex) {
        const base = LEVELS[levelIndex];
        const hintSegments = base.hint.map(stroke => stroke.map(p => ({ ...p })));
        const staticLines = base.blockers.map(line => ({ ...line }));
        const laneYs = base.birdLaneYs;

        const birds = laneYs.map((laneY, index) => {
          const range = base.birdRanges[index];
          const sampledX = base.birdXs[index];
          const baseX = clamp(sampledX, 56 + range, WORLD_W - 56 - range);
          return {
            index,
            baseX,
            x: baseX,
            prevX: baseX,
            y: laneY,
            laneY,
            range,
            speed: base.birdSpeeds[index],
            phase: base.birdPhases[index],
            bobAmp: 8 + index * 1.5,
            bodyRadius: 11,
            alive: true,
            tint: index === 0 ? ['#c96f5e', '#7f3d35'] : index === 1 ? ['#8c6b86', '#56394e'] : ['#ad815e', '#6a4732'],
            facing: Math.cos(base.birdPhases[index]) >= 0 ? 1 : -1,
          };
        });

        return {
          id: levelIndex + 1,
          title: base.title,
          note: base.note,
          inkBudget: base.inkBudget,
          chapter: base.chapter,
          skill: base.skill,
          hintAim: base.hintAim,
          hintSegments,
          staticLines,
          birds,
        };
      }

      function updateBirdPositions(level, elapsed) {
        level.birds.forEach((bird) => {
          if (!bird.alive) return;
          const nextX = clamp(
            bird.baseX + Math.sin(elapsed * bird.speed + bird.phase) * bird.range,
            42,
            WORLD_W - 42
          );
          bird.prevX = bird.x;
          bird.x = nextX;
          bird.facing = Math.cos(elapsed * bird.speed + bird.phase) >= 0 ? 1 : -1;
          bird.y = bird.laneY + Math.sin(elapsed * bird.speed * 1.42 + bird.phase * 1.8) * bird.bobAmp;
        });
      }

      function remainingInkRatio() {
        return clamp((state.level.inkBudget - state.inkUsed) / state.level.inkBudget, 0, 1);
      }

      function birdLabel(count) {
        return `${count} ${count === 1 ? 'bird' : 'birds'}`;
      }

      function refreshHud() {
        dom.levelValue.textContent = state.level.title;
        dom.levelCount.textContent = `Level ${state.level.id} of ${LEVELS.length}`;
        const cleared = state.level.birds.filter((bird) => !bird.alive).length;
        dom.birdProgress.textContent = `${cleared} / ${birdLabel(state.level.birds.length)}`;
        document.querySelectorAll('.bird-token').forEach((token, index) => {
          token.hidden = index >= state.level.birds.length;
          token.classList.toggle('is-cleared', index < cleared);
        });
        dom.inkLabel.textContent = fmtPercent(remainingInkRatio());
        dom.inkFill.style.transform = `scaleX(${remainingInkRatio().toFixed(3)})`;
      }

      function refreshButtons() {
        const levelLockedNext = state.levelIndex + 1 >= state.highestUnlocked;
        const attached = state.stone.attached;
        dom.prevLevelButton.disabled = state.levelIndex <= 0 || state.overlayVisible;
        dom.nextLevelButton.disabled = state.levelIndex >= LEVELS.length - 1 || levelLockedNext || state.overlayVisible;
        dom.hintButton.disabled = state.overlayVisible || state.rotatePaused || !attached;
        dom.clearButton.disabled = state.overlayVisible || state.rotatePaused || !attached || (state.drawnStrokes.length === 0 && !state.pointer.active);
        dom.dropButton.disabled = state.overlayVisible || state.rotatePaused || !attached;
      }

      function resetStone() {
        dropMechanism.reset(state.clawBaseX);
        state.stoneTrail = [];
        state.stone = createStone();
        const clawPose = getClawPose();
        state.stone.x = clawPose.x;
        state.stone.y = clawPose.stoneY;
      }

      function rebuildDrawnColliders() {
        state.drawnColliders = state.drawnStrokes.map(stroke =>
          window.WoodlandPhysics.createStroke(stroke.points, DRAWN_LINE_WIDTH / 2));
      }

      function beginAttempt(clearLines, preserveHintState) {
        if (clearLines) {
          state.drawnStrokes = [];
          state.drawnColliders = [];
          state.inkUsed = 0;
          state.pointer.points = [];
          state.pointer.inkUsedDuringStroke = 0;
          if (!preserveHintState) {
            state.hintUsed = false;
            state.hintVisibleUntil = 0;
          }
        }
        state.elapsed = 0;
        state.level = hydrateLevel(state.levelIndex);
        state.staticColliders = state.level.staticLines.map(createStaticCollider);
        resetClawControl();
        setClawBaseX(WORLD_W / 2);
        resetStone();
        state.pointer.active = false;
        state.pointer.pointerId = null;
        state.pointer.points = [];
        state.pointer.inkUsedDuringStroke = 0;
        state.autoDropAt = null;
        state.runStartAt = performance.now();
        state.runReleasedAt = null;
        state.runEnded = false;
        state.outcome = 'ready';
        state.pendingResult = null;
        state.currentAttemptId += 1;
        state.awardedForAttempt = false;
        state.linePreviewPulse = 0;
        state.particles = [];
        updateBirdPositions(state.level, state.elapsed);
        refreshHud();
        refreshButtons();
        setStatus(state.level.note);
      }

      function goToLevel(levelIndex) {
        const target = clamp(levelIndex, 0, LEVELS.length - 1);
        if (target > state.highestUnlocked - 1) return;
        state.levelIndex = target;
        saveProgress();
        hideOverlay();
        beginAttempt(true, false);
        announce(`Level ${target + 1}. ${state.level.title}.`);
      }

      function unlockAudio() {
        ensureAudioContext();
      }

      function pointAllowed(p) {
        return p.x >= DRAW_LEFT && p.x <= DRAW_RIGHT && p.y >= DRAW_TOP && p.y <= DRAW_BOTTOM;
      }

      function clampPointToDrawZone(p) {
        return {
          x: clamp(p.x, DRAW_LEFT, DRAW_RIGHT),
          y: clamp(p.y, DRAW_TOP, DRAW_BOTTOM),
        };
      }

      function pointerToWorld(event) {
        const rect = dom.canvas.getBoundingClientRect();
        return {
          x: ((event.clientX - rect.left) / rect.width) * WORLD_W,
          y: ((event.clientY - rect.top) / rect.height) * WORLD_H,
        };
      }

      function pointHitsStoneDropTarget(point) {
        if (!state.stone.attached) return false;
        return distance(point, state.stone) <= STONE_DROP_TAP_RADIUS;
      }

      function pointHitsClawControl(point) {
        if (!state.stone.attached) return false;
        const clawPose = getClawPose();
        const inStoneZone = distance(point, state.stone) <= CLAW_CONTROL_RADIUS;
        const inCarriageZone = Math.abs(point.x - clawPose.x) <= 40
          && point.y >= clawPose.y - 28
          && point.y <= clawPose.stoneY + 18;
        return inStoneZone || inCarriageZone;
      }

      function beginClawControl(event, rawPoint) {
        if (state.overlayVisible || state.rotatePaused || !state.stone.attached || state.runEnded || state.pointer.active) return;
        state.clawControl.active = true;
        state.clawControl.pointerId = event.pointerId;
        state.clawControl.startPoint = rawPoint;
        state.clawControl.startBaseX = state.clawBaseX;
        state.clawControl.moved = false;
        state.clawControl.tapEligible = pointHitsStoneDropTarget(rawPoint);
        dom.canvas.setPointerCapture(event.pointerId);
        setStatus(state.drawnStrokes.length
          ? 'Slide the claw for a better angle, then tap the stone or Drop.'
          : 'Slide the claw left or right, sketch your route, then tap the stone or Drop.');
        refreshButtons();
      }

      function updateClawControl(event) {
        if (!state.clawControl.active || state.clawControl.pointerId !== event.pointerId) return false;
        const rawPoint = pointerToWorld(event);
        const dx = rawPoint.x - state.clawControl.startPoint.x;
        if (Math.abs(dx) > CLAW_DRAG_THRESHOLD) {
          state.clawControl.moved = true;
        }
        setClawBaseX(state.clawControl.startBaseX + dx);
        state.linePreviewPulse = 1;
        return true;
      }

      function endClawControl(event) {
        if (!state.clawControl.active) return false;
        if (event && event.pointerId != null && state.clawControl.pointerId !== event.pointerId) return false;
        const shouldDrop = state.clawControl.tapEligible
          && !state.clawControl.moved
          && state.stone.attached
          && !state.overlayVisible
          && !state.rotatePaused
          && !state.runEnded;
        resetClawControl();
        refreshButtons();
        if (shouldDrop) {
          releaseStone();
        } else if (state.stone.attached) {
          setStatus(state.drawnStrokes.length
            ? 'Angle set. Add another line or tap the stone or Drop.'
            : 'Angle set. Draw your route, then tap the stone or Drop.');
        }
        return true;
      }

      function startStroke(event, rawPoint = pointerToWorld(event)) {
        if (state.overlayVisible || state.rotatePaused || !state.stone.attached || state.runEnded || state.clawControl.active) return;
        if (!pointAllowed(rawPoint)) return;
        state.pointer.active = true;
        state.pointer.pointerId = event.pointerId;
        state.pointer.points = [clampPointToDrawZone(rawPoint)];
        state.pointer.inkUsedDuringStroke = 0;
        state.autoDropAt = null;
        state.linePreviewPulse = 1;
        dom.canvas.setPointerCapture(event.pointerId);
        refreshButtons();
      }

      function extendStroke(event) {
        if (!state.pointer.active || state.pointer.pointerId !== event.pointerId) return;
        const next = clampPointToDrawZone(pointerToWorld(event));
        const points = state.pointer.points;
        const last = points[points.length - 1];
        const segmentLength = distance(last, next);
        if (segmentLength < 4) return;
        const remainingInk = Math.max(0, state.level.inkBudget - state.inkUsed);
        if (remainingInk <= 0) {
          finishStroke();
          return;
        }
        let endPoint = next;
        let usedLength = segmentLength;
        if (segmentLength > remainingInk) {
          const t = remainingInk / segmentLength;
          endPoint = {
            x: lerp(last.x, next.x, t),
            y: lerp(last.y, next.y, t),
          };
          usedLength = remainingInk;
        }
        points.push(endPoint);
        state.inkUsed = clamp(state.inkUsed + usedLength, 0, state.level.inkBudget);
        state.pointer.inkUsedDuringStroke += usedLength;
        state.linePreviewPulse = 1;
        refreshHud();
        if (state.inkUsed >= state.level.inkBudget - 0.5) {
          setStatus('Ink spent. Tap the stone or Drop, or clear a line.');
          finishStroke();
        }
      }

      function finishStroke(event) {
        if (!state.pointer.active) return;
        if (event && event.pointerId != null && state.pointer.pointerId !== event.pointerId) return;
        if (state.pointer.points.length >= 2) {
          state.drawnStrokes.push({
            points: state.pointer.points.slice(),
            width: DRAWN_LINE_WIDTH,
          });
          rebuildDrawnColliders();
          playTone('draw');
          if (state.stone.attached) {
            setStatus('Path set. Add another line, slide the claw, then tap the stone or Drop.');
          }
        } else {
          state.inkUsed = clamp(state.inkUsed - state.pointer.inkUsedDuringStroke, 0, state.level.inkBudget);
          refreshHud();
        }
        state.pointer.active = false;
        state.pointer.pointerId = null;
        state.pointer.points = [];
        state.pointer.inkUsedDuringStroke = 0;
        refreshButtons();
      }

      function handleCanvasPointerDown(event) {
        if (state.overlayVisible || state.rotatePaused || !state.stone.attached || state.runEnded || state.pointer.active || state.clawControl.active) return;
        unlockAudio();
        const rawPoint = pointerToWorld(event);
        const shouldGrabClaw = pointHitsStoneDropTarget(rawPoint)
          || (rawPoint.y < DRAW_TOP && pointHitsClawControl(rawPoint));
        if (shouldGrabClaw) {
          beginClawControl(event, rawPoint);
          return;
        }
        startStroke(event, rawPoint);
      }

      function handleCanvasPointerMove(event) {
        if (updateClawControl(event)) return;
        extendStroke(event);
      }

      function handleCanvasPointerFinish(event) {
        if (endClawControl(event)) return;
        finishStroke(event);
      }

      function clearLines() {
        if (!state.stone.attached || state.overlayVisible) return;
        state.drawnStrokes = [];
        state.drawnColliders = [];
        state.pointer.active = false;
        state.pointer.points = [];
        state.pointer.pointerId = null;
        state.pointer.inkUsedDuringStroke = 0;
        resetClawControl();
        state.inkUsed = 0;
        state.autoDropAt = null;
        refreshHud();
        refreshButtons();
        setStatus('Lines cleared. Slide the claw for a fresh angle and try a cleaner route.');
        playTone('tap');
      }

      function releaseStone() {
        if (!state.stone.attached || state.overlayVisible || state.rotatePaused) return;
        resetClawControl();
        dropMechanism.release();
        state.hintVisibleUntil = 0;
        state.stone.attached = false;
        state.stone.active = true;
        state.stone.vx = 0;
        state.stone.vy = 14;
        state.stone.sleepMs = 0;
        state.runReleasedAt = performance.now();
        state.outcome = 'running';
        state.autoDropAt = null;
        refreshButtons();
        setStatus('One stone only. Let the runway do the work.');
        playTone('drop');
        announce('Stone released.');
      }

      function resolveStoneAgainstWorld(dt) {
        const contacts = window.WoodlandPhysics.solve(state.stone,
          [...WORLD_COLLIDERS, ...state.staticColliders, ...state.drawnColliders], dt);
        let bounced = false;
        for (const contact of contacts) {
          if (contact.kind === 'floor' && contact.ny < -.5 && !state.stone.floorHit) {
            state.stone.floorHit = true;
            if (!reducedMotion) createParticles(state.stone.x, FLOOR_Y - 1, 7, ['#c8b985', '#a09e6e', '#e2d5a6']);
          }
          if (contact.normalVelocity < -70 && contact.kind !== 'floor') state.stone.hitPulse = 1;
          if (contact.normalVelocity < -100) bounced = true;
        }
        if (bounced) playTone('bounce');
      }

      function createParticles(x, y, count, colors) {
        for (let i = 0; i < count; i += 1) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 22 + Math.random() * 70;
          const tone = colors[i % colors.length];
          state.particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 20,
            life: 0,
            maxLife: 0.45 + Math.random() * 0.38,
            size: 2 + Math.random() * 5,
            color: tone,
          });
        }
      }

      function withAlpha(hexColor, alpha) {
        const hex = hexColor.replace('#', '');
        const value = hex.length === 3
          ? hex.split('').map((char) => parseInt(char + char, 16))
          : [parseInt(hex.slice(0, 2), 16), parseInt(hex.slice(2, 4), 16), parseInt(hex.slice(4, 6), 16)];
        return `rgba(${value[0]}, ${value[1]}, ${value[2]}, ${alpha})`;
      }

      function updateParticles(dt) {
        state.particles = state.particles.filter((particle) => {
          particle.life += dt;
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particle.vy += 140 * dt;
          particle.vx *= 0.99;
          return particle.life < particle.maxLife;
        });
      }

      function getClawPose() {
        return dropMechanism.pose();
      }

      function awardPointsForClear(summary) {
        if (state.awardedForAttempt) return;
        const bridge = window.LAHSPointsBridge;
        if (!bridge || typeof bridge.awardPoints !== 'function') {
          state.awardedForAttempt = true;
          return;
        }
        const remainingInk = remainingInkRatio();
        const points = CLEAR_BASE_POINTS
          + (state.hintUsed ? 0 : CLEAR_NO_HINT_BONUS)
          + (remainingInk >= 0.4 ? CLEAR_INK_BONUS : 0);
        bridge.awardPoints(points, {
          eventId: `clear:l${state.level.id}:${state.currentAttemptId}`,
          label: 'Level Clear',
          meta: {
            level: state.level.id,
            birdsHit: state.level.birds.length,
            hintUsed: state.hintUsed,
            remainingInkRatio: Number(remainingInk.toFixed(3)),
            clearTimeMs: Math.round(summary.clearTimeMs),
          },
        });
        state.awardedForAttempt = true;
      }

      function saveBestStats(summary) {
        const key = String(state.level.id);
        const previous = state.bestStats[key];
        if (!previous || summary.points > previous.points || (summary.points === previous.points && summary.clearTimeMs < previous.clearTimeMs)) {
          state.bestStats[key] = summary;
          saveProgress();
        }
      }

      function showPendingResult() {
        if (!state.pendingResult) return;
        const result = state.pendingResult;
        state.pendingResult = null;
        showOverlay(result);
      }

      function queueRoundResult(config) {
        state.pendingResult = config;
        if (!state.stone.active) showPendingResult();
      }

      function handleWin() {
        if (state.runEnded) return;
        refreshHud();
        state.runEnded = true;
        state.outcome = 'win';
        const clearTimeMs = Math.round(performance.now() - state.runStartAt);
        const remainingInk = remainingInkRatio();
        const points = CLEAR_BASE_POINTS
          + (state.hintUsed ? 0 : CLEAR_NO_HINT_BONUS)
          + (remainingInk >= 0.4 ? CLEAR_INK_BONUS : 0);
        const summary = {
          points,
          clearTimeMs,
          remainingInkRatio: Number(remainingInk.toFixed(3)),
        };
        summary.stars = 1 + Number(!state.hintUsed) + Number(remainingInk >= 0.4);
        saveBestStats(summary);
        createParticles(WORLD_W / 2, WORLD_H / 3, reducedMotion ? 6 : 48, ['#ffd06b', '#f48a64', '#ffffff', '#72cda1']);
        awardPointsForClear(summary);
        if (state.levelIndex + 1 < LEVELS.length) {
          state.highestUnlocked = Math.max(state.highestUnlocked, state.levelIndex + 2);
        }
        saveProgress();
        setStatus(`${birdLabel(state.level.birds.length)} cleared! Watch the stone finish its descent.`);
        playTone('win');
        announce(`Level ${state.level.id} cleared.`);

        const stats = [
          { label: 'Level time', value: fmtSeconds(clearTimeMs) },
          { label: 'Ink left', value: fmtPercent(remainingInk) },
          { label: 'Points', value: String(points) },
        ];
        const nextLevel = LEVELS[state.levelIndex + 1];
        const chapterComplete = nextLevel && nextLevel.chapter !== state.level.chapter;

        queueRoundResult({
          eyebrow: state.levelIndex === LEVELS.length - 1 ? 'Campaign Complete' : 'Level Cleared',
          title: !nextLevel ? 'The crown is yours!' : chapterComplete ? `${state.level.chapter} complete` : `Level ${state.level.id} complete`,
          body: state.levelIndex === LEVELS.length - 1
            ? 'You mastered all 18 woodland puzzles. Replay a favorite to refine your linework and earn three stars.'
            : `You cleared ${birdLabel(state.level.birds.length)} with one stone! ${chapterComplete ? `Next chapter: ${nextLevel.chapter}.` : `Up next: ${nextLevel.title}.`} Replay any stage to save ink and earn three stars.`,
          primaryLabel: state.levelIndex === LEVELS.length - 1 ? 'Play Again' : 'Next Level',
          primaryAction: state.levelIndex === LEVELS.length - 1 ? 'restart-campaign' : 'next-level',
          secondaryLabel: state.levelIndex === LEVELS.length - 1 ? 'Games' : 'Retry',
          secondaryAction: state.levelIndex === LEVELS.length - 1 ? 'home' : 'retry-level',
          stats,
        });
      }

      function handleLose(reason) {
        if (state.runEnded) return;
        state.runEnded = true;
        state.outcome = 'lose';
        setStatus(reason);
        playTone('lose');
        announce(reason);
        queueRoundResult({
          eyebrow: 'Attempt Lost',
          title: 'So close. Try a new path!',
          body: `${reason} Adjust the linework, then try the same drop again.`,
          primaryLabel: 'Retry',
          primaryAction: 'retry-level',
          secondaryLabel: 'Edit Lines',
          secondaryAction: 'edit-lines',
          stats: [
            { label: 'Birds cleared', value: `${state.level.birds.filter((bird) => !bird.alive).length}/${state.level.birds.length}` },
            { label: 'Ink used', value: fmtPercent(1 - remainingInkRatio()) },
          ],
        });
      }

      function hitBird(bird) {
        if (!bird.alive) return;
        bird.alive = false;
        createParticles(bird.x, bird.y, 16, [bird.tint[0], bird.tint[1], '#ffffff']);
        state.stone.vx *= 0.95;
        state.stone.vy = Math.min(state.stone.vy, 180);
        playTone('bird');
        refreshHud();
        if (state.level.birds.every((candidate) => !candidate.alive)) {
          handleWin();
        } else {
          setStatus(`${state.level.birds.filter((candidate) => !candidate.alive).length} of ${birdLabel(state.level.birds.length)} cleared. Keep the stone moving.`);
        }
      }

      function updateStone(dt) {
        const clawPose = getClawPose();
        if (state.stone.attached) {
          state.stone.x = clawPose.x;
          state.stone.y = clawPose.stoneY;
          state.stone.vx = 0;
          state.stone.vy = 0;
          return;
        }
        if (!state.stone.active) return;

        state.stoneTrail.push({ x: state.stone.x, y: state.stone.y });
        if (state.stoneTrail.length > (reducedMotion ? 3 : 18)) state.stoneTrail.shift();
        state.stone.onFloor = false;
        state.stone.supported = false;
        state.stone.supportMinX = Infinity;
        state.stone.supportMaxX = -Infinity;
        const subDt = dt / COLLISION_SUBSTEPS;
        for (let i = 0; i < COLLISION_SUBSTEPS; i += 1) {
          state.stone.vy += GRAVITY * subDt;
          state.stone.vx = clamp(state.stone.vx, -540, 540);
          state.stone.vy = clamp(state.stone.vy, -200, 780);
          state.stone.x += state.stone.vx * subDt;
          state.stone.y += state.stone.vy * subDt;
          resolveStoneAgainstWorld(subDt);

          if (!state.runEnded) {
            state.level.birds.forEach((bird) => {
              if (bird.alive && Math.hypot(state.stone.x - bird.x, state.stone.y - bird.y) <= state.stone.radius + bird.bodyRadius + 3) hitBird(bird);
            });
          }
          if (state.stone.y > WORLD_H + 56 || state.stone.x < -50 || state.stone.x > WORLD_W + 50) {
            state.stone.active = false;
            if (state.runEnded) showPendingResult();
            else handleLose('The stone drifted away before the flock was cleared.');
            return;
          }
        }

        if (!reducedMotion) state.stone.rotation += (state.stone.vx * .015 + state.stone.vy * .003) * dt;
        const speed = Math.hypot(state.stone.vx, state.stone.vy);
        if (speed < FAIL_SLEEP_SPEED && window.WoodlandPhysics.stableSupport(state.stone)) state.stone.sleepMs += dt * 1000;
        else state.stone.sleepMs = 0;
        const settleTime = state.stone.onFloor ? 420 : FAIL_SLEEP_MS;
        if (state.stone.sleepMs >= settleTime) {
          state.stone.active = false;
          state.stone.vx = 0;
          state.stone.vy = 0;
          state.stoneTrail = [];
          if (state.runEnded) showPendingResult();
          else handleLose(state.stone.onFloor
            ? 'The stone reached the forest floor before every bird was cleared.'
            : 'The stone settled on a runway before the last birds crossed its path.');
          return;
        }
        if (!state.runEnded && performance.now() - state.runReleasedAt >= FAIL_MAX_TIME_MS) {
          handleLose('The run lasted too long. Try a shorter route.');
        }
      }

      function drawRoundedPolyline(points, width, strokeStyle, shadowColor, shadowBlur, dash) {
        if (!points || points.length < 2) return;
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = width;
        ctx.strokeStyle = strokeStyle;
        if (shadowColor) ctx.shadowColor = shadowColor;
        if (shadowBlur) ctx.shadowBlur = shadowBlur;
        if (dash) ctx.setLineDash(dash);
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i += 1) {
          ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.stroke();
        ctx.restore();
      }

      function drawBackground() {
        ctx.fillStyle = '#b9e6df';
        ctx.fillRect(0, 0, WORLD_W, WORLD_H);
        if (scenery.complete && scenery.naturalWidth) ctx.drawImage(scenery, 0, 0, WORLD_W, WORLD_H);
        // A restrained wash keeps the interactive silhouette legible over the scenery.
        const wash = ctx.createLinearGradient(0, 0, 0, WORLD_H);
        wash.addColorStop(0, 'rgba(240,255,239,.05)');
        wash.addColorStop(.65, 'rgba(236,255,245,.20)');
        wash.addColorStop(1, 'rgba(45,102,65,.06)');
        ctx.fillStyle = wash;
        ctx.fillRect(0, 0, WORLD_W, WORLD_H);
        ctx.save();
        ctx.strokeStyle = 'rgba(255,255,255,.6)';
        ctx.lineWidth = 1.5;
        const corners = [[DRAW_LEFT, DRAW_TOP, 1, 1], [DRAW_RIGHT, DRAW_TOP, -1, 1], [DRAW_LEFT, DRAW_BOTTOM, 1, -1], [DRAW_RIGHT, DRAW_BOTTOM, -1, -1]];
        for (const [x, y, dx, dy] of corners) {
          ctx.beginPath(); ctx.moveTo(x, y + dy * 12); ctx.lineTo(x, y); ctx.lineTo(x + dx * 12, y); ctx.stroke();
        }
        if (!reducedMotion) {
          ctx.fillStyle = '#fff8c4';
          for (let i = 0; i < 9; i++) {
            const y = (i * 83 + state.elapsed * (4 + i % 3)) % WORLD_H;
            const x = i % 2 ? WORLD_W - 12 - Math.sin(y * .02 + i) * 8 : 12 + Math.sin(y * .02 + i) * 8;
            ctx.globalAlpha = .25 + Math.sin(state.elapsed + i) * .15;
            ctx.beginPath(); ctx.ellipse(x, y, 1.5, 3, .4, 0, Math.PI * 2); ctx.fill();
          }
        }
        ctx.restore();
      }

      function drawPlayBandLabels() {
        ctx.save();
        ctx.font = '800 10px Nunito, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#fffaf0e8';
        ctx.beginPath(); ctx.roundRect(WORLD_W / 2 - 48, DRAW_TOP + 5, 96, 23, 11); ctx.fill();
        ctx.fillStyle = '#245446';
        ctx.fillText(state.drawnStrokes.length ? 'YOUR FLIGHT PATH' : 'DRAW A PATH', WORLD_W / 2, DRAW_TOP + 20);
        ctx.restore();
      }

      function drawClaw() {
        dropMechanism.drawBehind(ctx);
      }

      function drawStaticLines() {
        runways.drawPlatforms(ctx, state.level.staticLines);
      }

      function drawHint() {
        if (!state.stone.attached || !state.hintVisibleUntil) return;
        const alpha = 0.42 + Math.sin(state.elapsed * 8) * 0.1;
        state.level.hintSegments.forEach((stroke) => {
          drawRoundedPolyline(
            stroke,
            DRAWN_LINE_WIDTH + 5,
            `rgba(255, 255, 255, ${alpha * 0.34})`,
            null,
            0,
            [10, 8]
          );
          drawRoundedPolyline(
            stroke,
            DRAWN_LINE_WIDTH - 1,
            `rgba(73, 106, 109, ${alpha})`,
            `rgba(255, 255, 255, ${alpha * 0.48})`,
            10,
            [10, 8]
          );
        });
      }

      function drawDrawnStrokes() {
        runways.drawLines(ctx, state.drawnStrokes, state.pointer.active ? state.pointer.points : null, DRAWN_LINE_WIDTH);
      }

      function drawGuides() {
        if (!state.stone.attached) return;
        const clawPose = getClawPose();
        ctx.save();
        ctx.strokeStyle = 'rgba(43, 36, 29, 0.18)';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 8]);
        ctx.beginPath();
        ctx.moveTo(state.stone.x, state.stone.y + 18);
        if (state.drawnStrokes.length > 0 && state.drawnStrokes[0].points.length) {
          const target = state.drawnStrokes[0].points[0];
          ctx.lineTo(target.x, target.y);
        } else {
          ctx.lineTo(clawPose.x, DRAW_TOP + 32);
        }
        ctx.stroke();
        ctx.restore();
      }

      function drawBird(bird) {
        woodlandBirds.draw(ctx, bird, state.elapsed);
      }

      function drawStone() {
        state.stoneTrail.forEach((point, index) => {
          ctx.fillStyle = `rgba(255, 226, 153, ${index / state.stoneTrail.length * .42})`;
          ctx.beginPath(); ctx.arc(point.x, point.y, state.stone.radius * index / state.stoneTrail.length * .7, 0, Math.PI * 2); ctx.fill();
        });
        dropMechanism.drawStone(ctx, state.stone);
        ctx.save();
        ctx.translate(state.stone.x, state.stone.y);
        if (state.stone.hitPulse > 0.01) {
          ctx.strokeStyle = `rgba(255, 255, 255, ${state.stone.hitPulse * 0.42})`;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(0, 0, state.stone.radius + 6 + (1 - state.stone.hitPulse) * 4, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawParticles() {
        state.particles.forEach((particle) => {
          const alpha = 1 - particle.life / particle.maxLife;
          ctx.fillStyle = withAlpha(particle.color, alpha);
          ctx.beginPath();
          ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      function drawBirdLanes() {
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 10]);
        state.level.birds.forEach((bird) => {
          ctx.beginPath();
          ctx.moveTo(28, bird.laneY);
          ctx.lineTo(WORLD_W - 28, bird.laneY);
          ctx.stroke();
        });
        ctx.restore();
      }

      function draw() {
        ctx.clearRect(0, 0, WORLD_W, WORLD_H);
        drawBackground();
        runways.drawGroundContact(ctx, state.stone);
        drawPlayBandLabels();
        drawBirdLanes();
        drawClaw();
        drawStaticLines();
        drawHint();
        drawDrawnStrokes();
        drawGuides();
        state.level.birds.forEach(drawBird);
        drawStone();
        dropMechanism.drawFront(ctx);
        drawParticles();
      }

      function useHint() {
        if (state.overlayVisible || state.rotatePaused || !state.stone.attached) return;
        state.hintUsed = true;
        state.hintVisibleUntil = Infinity;
        setClawBaseX(state.level.hintAim);
        refreshButtons();
        setStatus('Claw aligned. Trace the guide; the no-hint bonus is waived.');
        announce('Hint shown.');
        playTone('tap');
      }

      function exitToGames() {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: GAME_EXIT_TO_HOME_MESSAGE, tab: 'games' }, TARGET_ORIGIN);
            return;
          }
        } catch (_error) {
          // Fall through to history navigation.
        }
        window.history.back();
      }

      function handleOverlayPrimary() {
        hideOverlay();
        switch (state.overlayPrimaryAction) {
          case 'begin':
            state.onboardingPending = false;
            saveProgress();
            setStatus(state.level.note);
            return;
          case 'next-level':
            goToLevel(Math.min(state.levelIndex + 1, state.highestUnlocked - 1));
            return;
          case 'retry-level':
            beginAttempt(true, false);
            return;
          case 'restart-campaign':
            state.highestUnlocked = LEVELS.length;
            goToLevel(0);
            return;
          default:
            return;
        }
      }

      function handleOverlaySecondary() {
        hideOverlay();
        switch (state.overlaySecondaryAction) {
          case 'home':
            exitToGames();
            return;
          case 'retry-level':
            beginAttempt(true, false);
            return;
          case 'edit-lines':
            beginAttempt(false, true);
            setStatus('Edit your lines, then drop the stone again.');
            return;
          default:
            return;
        }
      }

      function handleHostMessage(event) {
        const data = event && event.data;
        if (!data || typeof data !== 'object') return;
        if (event.source !== window.parent || (TARGET_ORIGIN !== '*' && event.origin !== TARGET_ORIGIN)) return;

        if (data.type === SOUND_SETTINGS_MESSAGE) {
          const payload = data.payload || {};
          if (typeof payload.muted === 'boolean') setAudioMuted(payload.muted);
          if (typeof payload.sfxVolume === 'number') setSfxVolume(payload.sfxVolume);
          return;
        }

        if (data.type === HOST_LIFECYCLE_MESSAGE) {
          if (data.phase === 'pause' || data.phase === 'prepare-unload') {
            state.hostPaused = true;
            syncPauseState();
          } else if (data.phase === 'resume') {
            state.hostPaused = false;
            state.lastFrame = performance.now();
            state.accumulator = 0;
            syncPauseState();
          }
        }
      }

      function handleKeyboard(event) {
        if (state.overlayVisible && event.key === 'Tab') {
          const buttons = [dom.overlay.querySelector('.overlay-content'), dom.overlaySecondary, dom.overlayPrimary].filter((button) => !button.hidden && !button.disabled);
          const next = event.shiftKey ? buttons[0] : buttons[buttons.length - 1];
          if (document.activeElement === next) { event.preventDefault(); (event.shiftKey ? buttons[buttons.length - 1] : buttons[0]).focus(); }
          return;
        }
        if (state.overlayVisible) return;
        if (event.target instanceof Element && event.target.closest('button, input, select, textarea')) return;
        if (event.key === ' ' || event.key === 'Enter') {
          if (!state.overlayVisible && state.stone.attached) {
            event.preventDefault();
            releaseStone();
          }
          return;
        }
        if (event.key === 'r' || event.key === 'R') {
          beginAttempt(true, false);
          return;
        }
        if (event.key === 'h' || event.key === 'H') {
          useHint();
          return;
        }
        if ((event.key === 'a' || event.key === 'A' || event.key === 'd' || event.key === 'D') && state.stone.attached && !state.overlayVisible) {
          event.preventDefault();
          setClawBaseX(state.clawBaseX + ((event.key === 'a' || event.key === 'A') ? -18 : 18));
          setStatus('Angle adjusted. Draw your route, then tap the stone or Drop.');
          playTone('tap');
          return;
        }
        if (event.key === 'ArrowLeft') {
          goToLevel(state.levelIndex - 1);
          return;
        }
        if (event.key === 'ArrowRight') {
          goToLevel(state.levelIndex + 1);
        }
      }

      function update(dt) {
        if (!state.level) return;
        if (!state.hostPaused && !state.hiddenPause && !state.rotatePaused) {
          state.elapsed += dt;
        }
        state.linePreviewPulse = Math.max(0, state.linePreviewPulse - dt * 1.4);
        state.stone.hitPulse = Math.max(0, state.stone.hitPulse - dt * 2.8);
        updateBirdPositions(state.level, state.elapsed);
        updateParticles(dt);

        if (state.overlayVisible || state.hostPaused || state.hiddenPause || state.rotatePaused) {
          return;
        }

        dropMechanism.update(dt, state.clawBaseX);
        updateStone(dt);
      }

      function frame(now) {
        const delta = Math.min(0.05, (now - state.lastFrame) / 1000 || 0);
        state.lastFrame = now;
        state.accumulator += delta;
        while (state.accumulator >= STEP) {
          update(STEP);
          state.accumulator -= STEP;
        }
        draw();
        window.requestAnimationFrame(frame);
      }

      function fitCanvas() {
        const frame = dom.canvas.parentElement;
        const panel = frame.parentElement;
        const height = Math.min(panel.clientHeight, panel.clientWidth * WORLD_H / WORLD_W);
        frame.style.height = `${height}px`;
        frame.style.width = `${height * WORLD_W / WORLD_H}px`;
        const pixelScale = Math.min(2.5, Math.max(1, dom.canvas.getBoundingClientRect().width / WORLD_W * (window.devicePixelRatio || 1)));
        const w = Math.round(WORLD_W * pixelScale), h = Math.round(WORLD_H * pixelScale);
        if (dom.canvas.width !== w || dom.canvas.height !== h) { dom.canvas.width = w; dom.canvas.height = h; }
        ctx.setTransform(w / WORLD_W, 0, 0, h / WORLD_H, 0, 0);
      }

      function bindEvents() {
        dom.soundButton.addEventListener('click', () => { unlockAudio(); setAudioMuted(!state.audio.muted); });
        document.getElementById('rotateHomeButton').addEventListener('click', exitToGames);
        window.addEventListener('pagehide', (event) => { if (!event.persisted) woodlandAudio.dispose(); });
        if (window.ResizeObserver) new ResizeObserver(fitCanvas).observe(dom.canvas.parentElement.parentElement);
        fitCanvas();
        dom.canvas.addEventListener('pointerdown', handleCanvasPointerDown);
        dom.canvas.addEventListener('pointermove', handleCanvasPointerMove);
        dom.canvas.addEventListener('pointerup', handleCanvasPointerFinish);
        dom.canvas.addEventListener('pointercancel', handleCanvasPointerFinish);
        dom.canvas.addEventListener('lostpointercapture', handleCanvasPointerFinish);

        dom.homeButton.addEventListener('click', () => {
          unlockAudio();
          playTone('tap');
          exitToGames();
        });
        dom.restartButton.addEventListener('click', () => {
          unlockAudio();
          playTone('tap');
          hideOverlay();
          beginAttempt(true, false);
        });
        dom.prevLevelButton.addEventListener('click', () => {
          unlockAudio();
          playTone('tap');
          goToLevel(state.levelIndex - 1);
        });
        dom.nextLevelButton.addEventListener('click', () => {
          unlockAudio();
          playTone('tap');
          goToLevel(state.levelIndex + 1);
        });
        dom.hintButton.addEventListener('click', () => {
          unlockAudio();
          useHint();
        });
        dom.clearButton.addEventListener('click', () => {
          unlockAudio();
          playTone('tap');
          clearLines();
        });
        dom.dropButton.addEventListener('click', () => {
          unlockAudio();
          releaseStone();
        });
        dom.dropButton.addEventListener('pointerup', (event) => {
          if (event.pointerType !== 'touch' || !event.isPrimary || dom.dropButton.disabled) return;
          const bounds = dom.dropButton.getBoundingClientRect();
          if (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) return;
          // Touch can omit its compatibility click after drawing. Release remains idempotent.
          unlockAudio();
          releaseStone();
        });
        dom.overlayPrimary.addEventListener('click', () => {
          unlockAudio();
          playTone('tap');
          handleOverlayPrimary();
        });
        dom.overlaySecondary.addEventListener('click', () => {
          unlockAudio();
          playTone('tap');
          handleOverlaySecondary();
        });

        window.addEventListener('resize', updateRotateNotice, { passive: true });
        window.addEventListener('orientationchange', updateRotateNotice, { passive: true });
        window.addEventListener('keydown', handleKeyboard);
        window.addEventListener('message', handleHostMessage);
        document.addEventListener('visibilitychange', () => {
          state.hiddenPause = document.hidden;
          if (!document.hidden) {
            state.lastFrame = performance.now();
            state.accumulator = 0;
          }
          syncPauseState();
        });

        ['pointerdown', 'touchstart', 'keydown'].forEach((eventName) => {
          window.addEventListener(eventName, unlockAudio, { passive: true });
        });
      }

      function exposeHooks() {
        window.setAudioMuted = setAudioMuted;
        window.setSfxVolume = setSfxVolume;
        window.render_game_to_text = () => JSON.stringify({
          level: state.level ? state.level.id : null,
          totalLevels: LEVELS.length,
          campaignRevision: window.WoodlandCampaign.revision,
          chapter: state.level ? state.level.chapter : null,
          skill: state.level ? state.level.skill : null,
          birdTarget: state.level ? state.level.birds.length : 0,
          title: state.level ? state.level.title : null,
          elapsed: Number(state.elapsed.toFixed(4)),
          birdArt: woodlandBirds.describe(),
          overlayVisible: state.overlayVisible,
          outcome: state.outcome,
          resultPending: Boolean(state.pendingResult),
          floorY: FLOOR_Y,
          platforms: state.level ? state.level.staticLines.map(({ x1, y1, x2, y2, kind }) => ({ x1, y1, x2, y2, kind })) : [],
          attached: state.stone.attached,
          clawX: Number(state.clawBaseX.toFixed(1)),
          clawDragging: state.clawControl.active,
          mechanism: dropMechanism.describe(),
          stone: { x: +state.stone.x.toFixed(2), y: +state.stone.y.toFixed(2), radius: state.stone.radius, rotation: +state.stone.rotation.toFixed(3), onFloor: state.stone.onFloor, active: state.stone.active },
          inkLeftRatio: state.level ? Number(remainingInkRatio().toFixed(3)) : null,
          hintUsed: state.hintUsed,
          hintVisible: state.stone.attached && Boolean(state.hintVisibleUntil),
          birds: state.level
            ? state.level.birds.map((bird) => ({
              index: bird.index,
              alive: bird.alive,
              facing: bird.facing,
              flight: woodlandBirds.pose(bird, state.elapsed),
              x: Number(bird.x.toFixed(1)),
              y: Number(bird.y.toFixed(1)),
            }))
            : [],
          lines: state.drawnStrokes.map((stroke) => stroke.points.length),
          status: state.statusText,
          paused: state.hostPaused || state.hiddenPause || state.rotatePaused,
          sound: { muted: state.audio.muted, volume: state.audio.sfxVolume, loaded: [...woodlandAudio.buffers.keys()], context: woodlandAudio.context?.state || 'locked' },
        });
        window.advanceTime = (ms) => {
          const total = Math.max(0, Number(ms) || 0);
          let remaining = total / 1000;
          while (remaining > 0) {
            const slice = Math.min(STEP, remaining);
            update(slice);
            remaining -= slice;
          }
          draw();
        };
        window.__manyBirdsDebug = {
          reset(clearLines = true) {
            beginAttempt(Boolean(clearLines), false);
            return JSON.parse(window.render_game_to_text());
          },
          setLevel(index) {
            goToLevel(Number(index) || 0);
            return JSON.parse(window.render_game_to_text());
          },
          applyStroke(rawPoints) {
            if (!Array.isArray(rawPoints) || rawPoints.length < 2 || !state.stone.attached) {
              return JSON.parse(window.render_game_to_text());
            }
            const points = [];
            let nextInkUsed = state.inkUsed;
            for (let i = 0; i < rawPoints.length; i += 1) {
              const source = rawPoints[i] || {};
              const nextPoint = clampPointToDrawZone({
                x: Number(source.x) || 0,
                y: Number(source.y) || 0,
              });
              if (points.length === 0) {
                if (!pointAllowed(nextPoint)) return JSON.parse(window.render_game_to_text());
                points.push(nextPoint);
                continue;
              }
              const previousPoint = points[points.length - 1];
              const segmentLength = distance(previousPoint, nextPoint);
              if (segmentLength < 2) continue;
              const remainingInk = Math.max(0, state.level.inkBudget - nextInkUsed);
              if (remainingInk <= 0) break;
              let finalPoint = nextPoint;
              let usedLength = segmentLength;
              if (segmentLength > remainingInk) {
                const t = remainingInk / segmentLength;
                finalPoint = {
                  x: lerp(previousPoint.x, nextPoint.x, t),
                  y: lerp(previousPoint.y, nextPoint.y, t),
                };
                usedLength = remainingInk;
              }
              points.push(finalPoint);
              nextInkUsed += usedLength;
            }
            if (points.length >= 2) {
              state.drawnStrokes.push({ points, width: DRAWN_LINE_WIDTH });
              state.inkUsed = clamp(nextInkUsed, 0, state.level.inkBudget);
              rebuildDrawnColliders();
              refreshHud();
              refreshButtons();
            }
            return JSON.parse(window.render_game_to_text());
          },
          drop() {
            releaseStone();
            return JSON.parse(window.render_game_to_text());
          },
          moveClaw(x) {
            setClawBaseX(Number(x) || state.clawBaseX);
            return JSON.parse(window.render_game_to_text());
          },
          tapStone() {
            releaseStone();
            return JSON.parse(window.render_game_to_text());
          },
          forceWin() {
            state.level.birds.forEach((bird) => {
              if (bird.alive) {
                bird.alive = false;
              }
            });
            handleWin();
            return JSON.parse(window.render_game_to_text());
          },
          snapshot() {
            return JSON.parse(window.render_game_to_text());
          },
        };
      }

      function initBridge() {
        if (!window.LAHSPointsBridge) return;
        const snapshot = window.LAHSPointsBridge.init({ gameId: GAME_ID });
        state.pointsContext = snapshot;
        if (typeof window.LAHSPointsBridge.onContextChange === 'function') {
          window.LAHSPointsBridge.onContextChange((nextSnapshot) => {
            state.pointsContext = nextSnapshot;
          });
        }
      }

      function init() {
        exposeHooks();
        bindEvents();
        initBridge();
        state.levelIndex = clamp(state.levelIndex, 0, Math.min(state.highestUnlocked - 1, LEVELS.length - 1));
        beginAttempt(true, false);
        updateRotateNotice();
        saveProgress();
        if (state.onboardingPending) {
          showOverlay({
            eyebrow: 'Draw. Drop. Clear.',
            title: 'A little ink. One clever drop.',
            body: 'Start with one bird, then two, before taking on a flock of three. Draw paths, slide the claw to aim, and tap the stone or Drop.',
            primaryLabel: 'Let’s play',
            primaryAction: 'begin',
            secondaryLabel: 'Games',
            secondaryAction: 'home',
            stats: [
              { label: 'Goal', value: `${birdLabel(state.level.birds.length)}, 1 stone` },
              { label: 'Controls', value: 'Draw • Slide Claw • Drop' },
            ],
          });
        } else {
          setStatus(state.level.note);
        }
        state.lastFrame = performance.now();
        window.requestAnimationFrame(frame);
      }

      init();
    })();
  </script>
</body>
</html>
