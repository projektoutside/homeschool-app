                        piece.scale.setScalar(Math.max(0.16, 1 - openEase * 0.84));
                        const mats = Array.isArray(piece.material) ? piece.material : [piece.material];
                        mats.forEach((mat) => {
                            if (!mat) return;
                            mat.transparent = true;
                            mat.opacity = Math.max(0, 1 - openEase * 1.06);
                            mat.needsUpdate = true;
                        });
                    });
                }
                if (dustPoints && dustMaterial) {
                    dustPoints.visible = true;
                    updateMysteryDust(root, openEase, false);
                    dustMaterial.opacity = Math.min(0.92, 0.22 + openEase * 0.8);
                    dustMaterial.size = 0.1 + openEase * 0.03;
                }
                if (trailRing && trailMaterial) {
                    trailMaterial.opacity = THREE.MathUtils.lerp(0.36, 0.05, openEase);
                }

                if (openRatio >= 1) {
                    mysteryState.phase = 'revealed';
                    mysteryState.timer = 0;
                    mysteryState.openStartPressDepth = 0;
                }
                updateMysteryGroundShadows(root);
                return;
            }

            if (mysteryState.phase === 'revealed') {
                mysteryState.timer += dt;
                const dustRatio = THREE.MathUtils.clamp(
                    mysteryState.timer / Math.max(0.1, MYSTERY_BOX_CONFIG.dustFlowDuration || 0.9),
                    0,
                    1
                );

                if (!mysteryState.previewPrimed && mysteryState.rewardKey) {
                    mysteryState.previewPrimed = true;
                    if (previewState.object) {
                        previewScene.remove(previewState.object);
                        previewState.object = null;
                    }
                    previewState.open = true;
                    previewState.viewMode = 'item';
                    previewState.propKey = mysteryState.rewardKey;
                    previewState.label = mysteryState.rewardLabel;
                    previewState.rotateY = 0;
                    previewState.rotateX = 0;
                    previewState.fitCategory = propRegistry.get(mysteryState.rewardKey)?.category || null;
                    previewState.fitPropKey = mysteryState.rewardKey;
                    previewState.autoSpinPauseUntilMs = 0;
                    previewState.hasStandaloneMesh = false;
                    if (propPreviewPanel) {
                        propPreviewPanel.classList.add('open');
                    }
                    if (propPreviewOverlay) {
                        propPreviewOverlay.classList.add('open');
                    }
                    setPreviewActionButtonsDisabled(true);
                    if (propPreviewName) {
                        propPreviewName.textContent = `Mystery Reward: ${mysteryState.rewardLabel} (Added to Inventory)`;
                    }
                    setPreviewFallbackMessage('Your Mystery Item is...');
                    resizePropViewport();
                }

                if (dustPoints && dustMaterial) {
                    dustPoints.visible = true;
                    updateMysteryDust(root, dustRatio, true);
                    dustMaterial.opacity = Math.max(0, 0.88 - dustRatio * 0.86);
                    dustMaterial.size = 0.1 + dustRatio * 0.04;
                }
                if (trailMaterial) {
                    trailMaterial.opacity = 0.14 + Math.sin(mysteryState.timer * 2.1 + mysteryState.seed) * 0.06;
                }
                const rewardRevealRatio = THREE.MathUtils.clamp(
                    MYSTERY_BOX_CONFIG.rewardRevealRatio ?? 0.92,
                    0,
                    1
                );
                if (!mysteryState.rewardShown && mysteryState.rewardKey && dustRatio >= rewardRevealRatio) {
                    mysteryState.rewardShown = true;
                    const preloadedRewardPreview = takeMysteryRewardPreviewBuild(mysteryState.rewardKey);
                    setPreviewObject(
                        mysteryState.rewardKey,
                        `${mysteryState.rewardLabel} (Mystery Reward)`,
                        preloadedRewardPreview
                    );
                    if (propPreviewName) {
                        propPreviewName.textContent = `Mystery Reward: ${mysteryState.rewardLabel} (Added to Inventory)`;
                    }
                }
                if (mysteryState.timer >= MYSTERY_BOX_CONFIG.revealHoldDuration) {
                    mysteryState.phase = 'cooldown';
                    mysteryState.timer = 0;
                }
                updateMysteryGroundShadows(root);
                return;
            }

            if (mysteryState.phase === 'cooldown') {
                setContactShadowFade(1);
                mysteryState.timer += dt;
                const fade = 1 - THREE.MathUtils.clamp(mysteryState.timer / MYSTERY_BOX_CONFIG.cleanupDuration, 0, 1);
                if (trailRing && trailMaterial) {
                    trailMaterial.opacity = 0.35 * fade;
                    trailRing.scale.setScalar(0.8 + 0.2 * fade);
                }
                if (dustPoints && dustMaterial) {
                    dustMaterial.opacity *= fade;
                    if (dustMaterial.opacity <= 0.01) {
                        dustPoints.visible = false;
                    }
                }
                root.rotation.y += dt * 1.9;
                root.position.y = mysteryState.landingY + (1 - fade) * 0.03;
                root.scale.setScalar((mysteryState.baseScale || 1) * (0.95 + 0.05 * fade));
                updateMysteryGroundShadows(root);
                if (fade <= 0.04) {
                    clearMysteryBox();
                }
            }
        }

        function closePropPreview() {
            if (!propPreviewPanel) {
                return;
            }
            const wasPanelOpen = Boolean(
                previewState.open ||
                propPreviewPanel.classList.contains('open') ||
                propPreviewOverlay?.classList?.contains('open')
            );
            const mysterySignPhase = mysterySignSlingshotState?.phase;
            const mysterySignNeedsReturn =
                mysterySignPhase === 'waiting' ||
                mysterySignPhase === 'launch';

            previewState.open = false;
            previewState.viewMode = 'item';
            previewState.propKey = null;
            previewState.label = null;
            previewState.rotateY = 0;
            previewState.rotateX = 0;
            previewState.fitCategory = null;
            previewState.fitPropKey = null;
            previewState.autoSpinPauseUntilMs = 0;
            previewState.hasStandaloneMesh = false;
            previewDragState.active = false;
            previewDragState.pointerId = null;
            if (propPreviewViewport) {
                propPreviewViewport.classList.remove('is-dragging');
            }
            const oldObj = previewState.object;
            if (oldObj) {
                previewScene.remove(oldObj);
            }
            previewState.object = null;
            propPreviewPanel.classList.remove('open');
            if (propPreviewOverlay) {
                propPreviewOverlay.classList.remove('open');
            }
            setPreviewFallbackMessage('');
            setPreviewActionButtonsDisabled(true);
            if (propPreviewName) {
                propPreviewName.textContent = 'Select an item';
            }

            if (wasPanelOpen && mysterySignNeedsReturn) {
                mysterySignReturnPendingAfterPanelClose = true;
            }

            if (mysterySignReturnPendingAfterPanelClose) {
                mysterySignReturnPendingAfterPanelClose = false;
                if (mysterySignReturnAfterPanelTimer !== null) {
                    window.clearTimeout(mysterySignReturnAfterPanelTimer);
                    mysterySignReturnAfterPanelTimer = null;
                }
                mysterySignReturnAfterPanelTimer = window.setTimeout(() => {
                    mysterySignReturnAfterPanelTimer = null;
                    returnMysterySignAfterSelection();
                }, MYSTERY_SIGN_RETURN_AFTER_PANEL_CLOSE_MS);
            }
        }

        function queueMysterySignReturnAfterPanelClose() {
            mysterySignReturnPendingAfterPanelClose = true;
            if (mysterySignReturnAfterPanelTimer !== null) {
                window.clearTimeout(mysterySignReturnAfterPanelTimer);
                mysterySignReturnAfterPanelTimer = null;
            }
        }

        function previewOpenForButton(button) {
            const selected = button?.dataset?.prop;
            if (!selected) return;
            const label = getItemLabel(button);
            setPreviewObject(selected, label);
        }

        function updatePropButtonStates() {
            propButtons.forEach((btn) => {
                btn.classList.toggle('active', activeProps.has(btn.dataset.prop));
            });
            updateInventoryButtonStates();
        }

        function setActiveCategory(categoryKey) {
            activeCategory = isInventoryCategory(categoryKey) ? categoryKey : INVENTORY_CONFIG.defaultCategory;
            categoryButtons.forEach((btn) => {
                btn.classList.toggle('active', btn.dataset.category === activeCategory);
            });
            itemButtons.forEach((btn) => {
                btn.classList.toggle('hidden', btn.dataset.category !== activeCategory);
            });
            if (categoryTitle) {
                categoryTitle.textContent = getInventoryCategoryLabel(activeCategory);
            }
            if (storePanel?.classList?.contains('open')) {
                warmupStoreCategoryThumbs(activeCategory);
            }
        }

        function setActiveInventoryCategory(categoryKey) {
            const nextCategory = isInventoryCategory(categoryKey) ? categoryKey : INVENTORY_CONFIG.defaultCategory;
            const didCategoryChange = nextCategory !== activeInventoryCategory;
            activeInventoryCategory = nextCategory;
            inventoryCategoryButtons.forEach((btn) => {

        function smoothStep01(v) {

        function shortestAngleDelta(current, target) {
            let d = target - current;
            while (d > Math.PI) d -= Math.PI * 2;
            while (d < -Math.PI) d += Math.PI * 2;
            return d;
        }

        function stepSpringScalar(current, velocity, target, stiffness, damping, dt, maxSpeed, isAngle = false) {
            const delta = isAngle ? shortestAngleDelta(current, target) : (target - current);
            const accel = delta * stiffness - velocity * damping;
            let nextVel = velocity + accel * dt;
            nextVel = THREE.MathUtils.clamp(nextVel, -maxSpeed, maxSpeed);
            let nextValue = current + nextVel * dt;
            if (isAngle) {
                nextValue = THREE.MathUtils.euclideanModulo(nextValue + Math.PI, Math.PI * 2) - Math.PI;
            }
            return [nextValue, nextVel];

        function buildMysteryInspiredStuntMotion(actionKey, u, sideSign = 1, scale = 1) {

                rigYaw: 0,

            const side = sideSign || 1;
            const s = smoothStep01(u);
            const qScale = THREE.MathUtils.clamp(scale, 0.001, 8);

            if (actionKey === 'barrel360') {
                const turn = s * Math.PI * 2;
                output.rigRoll = turn * side * qScale;
                output.rigY = Math.sin(s * Math.PI) * 0.38 * qScale;
                output.rigZ = -Math.sin(s * Math.PI) * 0.5 * qScale;
                output.rigYaw = Math.sin(s * Math.PI * 2) * 0.18 * side * qScale;
                output.flapHzAdd = 0.15 * qScale;
                output.wingAmpMul = 1 + 0.2 * qScale;
                return output;
            }

            if (actionKey === 'loop') {
                const loopTurn = s * Math.PI * 2;
                output.rigPitch = loopTurn * side * qScale;
                output.rigY = Math.sin(s * Math.PI) * 0.95 * qScale;
                output.rigZ = -Math.sin(s * Math.PI) * 1.25 * qScale;
                output.rigRoll = Math.sin(s * Math.PI * 2) * 0.2 * side * qScale;
                output.flapHzAdd = 0.12 * qScale;
                output.wingAmpMul = 1 + 0.16 * qScale;
                return output;
            }

            if (actionKey === 'corkscrew') {
                const turn = s * Math.PI * 2;
                const radius = 0.52 * qScale;
                output.rigX = Math.cos(turn) * radius * side;
                output.rigY = Math.sin(s * Math.PI) * 0.62 * qScale;
                output.rigZ = -Math.sin(turn * 2) * radius * 0.58;

                output.flapHzAdd = 0.14 * qScale;
                output.wingAmpMul = 1 + 0.19 * qScale;

                const descend = smoothStep01(Math.max(0, (s - 0.34) / 0.66));
                output.rigY = (rise * 1.05 - descend * 0.95) * qScale;
                output.rigX = Math.sin(s * Math.PI) * 0.85 * side * qScale;
                output.rigYaw = Math.sin(s * Math.PI * 1.7) * 0.62 * side * qScale;
                output.rigRoll = Math.sin(s * Math.PI * 1.1) * 1.05 * side * qScale;
                output.rigPitch = -Math.sin(s * Math.PI) * 0.24 * qScale;
                output.flapHzAdd = 0.08 * qScale;
                output.wingAmpMul = 1 + 0.12 * qScale;
                return output;
            }

            if (actionKey === 'burstDive') {
                const p1 = 0.18;
                const p2 = 0.48;
                const p3 = 0.78;
                if (u < p1) {
                    const q = smoothStep01(u / p1);
                    output.rigY = q * 0.65 * qScale;
                    output.rigPitch = -q * 0.42 * qScale;
                    output.rigRoll = Math.sin(q * Math.PI) * 0.22 * side * qScale;
                    output.flapHzAdd = 0.3 * q;
                    output.wingAmpMul = 1 + 0.55 * q;
                } else if (u < p2) {
                    const q = smoothStep01((u - p1) / (p2 - p1));
                    output.rigY = (0.65 + q * 3.35) * qScale;
                    output.rigZ = -q * 2.8 * qScale;
                    output.rigPitch = (-0.55 + q * 0.22) * qScale;
                    output.rigYaw = Math.sin(q * Math.PI) * 0.2 * side * qScale;
                    output.rigRoll = Math.sin(q * Math.PI * 1.2) * 0.35 * side * qScale;
                    output.flapHzAdd = 0.18 + (1 - q) * 0.12;
                    output.wingAmpMul = 1.48 - q * 0.28;
                } else if (u < p3) {
                    const q = smoothStep01((u - p2) / (p3 - p2));
                    const spinEase = 1 - Math.pow(1 - q, 3);
                    output.rigY = (4.0 - q * 6.35) * qScale;
                    output.rigZ = (-2.8 + q * 2.55) * qScale;
                    output.rigX = Math.sin(q * Math.PI * 2.1) * 0.7 * side * qScale;
                    output.rigPitch = (0.2 + q * 0.95) * qScale;
                    output.rigYaw = Math.sin(q * Math.PI * 2.6) * 0.65 * side * qScale;
                    output.rigRoll = spinEase * (Math.PI * 3.4) * side;
                    output.flapHzAdd = 0.04 + q * 0.08;
                    output.wingAmpMul = 0.9 + q * 0.38;
                } else {
                    const q = smoothStep01((u - p3) / (1 - p3));
                    output.rigY = (-2.15 + q * 2.15) * qScale;
                    output.rigZ = (-0.15 + q * 0.15) * qScale;
                    output.rigX = Math.sin((1 - q) * Math.PI) * 0.16 * side * qScale;
                    output.rigPitch = (1.15 - q * 1.15) * qScale;
                    output.rigYaw = Math.sin((1 - q) * Math.PI) * 0.16 * side * qScale;
                    output.rigRoll = (Math.PI * 2.6) * (1 - q) * side;
                    output.flapHzAdd = 0.16 * (1 - q);
                    output.wingAmpMul = 1.28 - q * 0.28;
                }
            }

            return output;
        }

        function sampleStunt(dt) {
            const output = {
                rigX: 0,
                rigY: 0,
                rigZ: 0,
                rigPitch: 0,
                rigYaw: 0,
                rigRoll: 0,
                flapHzAdd: 0,
                wingAmpMul: 1
            };
            if (mysteryFlightCinematic.active) {
                const cfg = MYSTERY_CHARACTER_FLIGHT_CONFIG;
                const fx = mysteryFlightCinematic;
                const suppressBlend = THREE.MathUtils.clamp(
                    fx.actionSuppress / Math.max(0.001, cfg.interruptionBlendDuration ?? 0.42),
                    0,
                    1
                );
                if (stuntState.active && suppressBlend <= 0.001) {
                    stuntState.active = null;
                    stuntState.elapsed = 0;
                }
                stuntState.cooldown = Math.max(stuntState.cooldown, 3.2);

                // During Mystery cinematic, the stunt channel should only relax to neutral.
                // This prevents a second track from fighting the cinematic and causing split-cuts.
                output.rigX = 0;
                output.rigY = 0;
                output.rigZ = 0;
                output.rigPitch = 0;
                output.rigYaw = 0;
                output.rigRoll = 0;
                output.flapHzAdd = 0;
                output.wingAmpMul = 1;

                const filterSpeed = cfg.mysteryStuntSmoothing ?? 8;
                const filterAlpha = 1 - Math.exp(-filterSpeed * dt);

                if (!fx.sampleInitialized) {
                    fx.sampleRigX = Number.isFinite(stuntSim.pos.x) ? stuntSim.pos.x : 0;
                    // Keep mystery vertical path fully owned by cinematic rigOffset (prevents one-frame/downward settle).
                    fx.sampleRigY = 0;
                    fx.sampleRigZ = Number.isFinite(stuntSim.pos.z) ? stuntSim.pos.z : 0;
                    fx.sampleRigPitch = Number.isFinite(stuntSim.rot.x) ? stuntSim.rot.x : 0;
                    fx.sampleRigYaw = Number.isFinite(stuntSim.rot.y) ? stuntSim.rot.y : 0;
                    fx.sampleRigRoll = Number.isFinite(stuntSim.rot.z) ? stuntSim.rot.z : 0;
                    fx.sampleFlapHzAdd = Number.isFinite(stuntSim.flapHzAdd) ? stuntSim.flapHzAdd : 0;
                    fx.sampleWingAmpMul = Number.isFinite(stuntSim.wingAmpMul) ? stuntSim.wingAmpMul : 1;
                    fx.sampleInitialized = true;
                } else {
                    fx.sampleRigX += (output.rigX - fx.sampleRigX) * filterAlpha;
                    fx.sampleRigY += (output.rigY - fx.sampleRigY) * filterAlpha;
                    fx.sampleRigZ += (output.rigZ - fx.sampleRigZ) * filterAlpha;
                    fx.sampleRigPitch += (output.rigPitch - fx.sampleRigPitch) * filterAlpha;
                    fx.sampleRigYaw += (output.rigYaw - fx.sampleRigYaw) * filterAlpha;
                    fx.sampleRigRoll += (output.rigRoll - fx.sampleRigRoll) * filterAlpha;
                    fx.sampleFlapHzAdd += (output.flapHzAdd - fx.sampleFlapHzAdd) * filterAlpha;
                    fx.sampleWingAmpMul += (output.wingAmpMul - fx.sampleWingAmpMul) * filterAlpha;
                }

                return {
                    rigX: fx.sampleRigX,
                    rigY: fx.sampleRigY,
                    rigZ: fx.sampleRigZ,
                    rigPitch: fx.sampleRigPitch,
                    rigYaw: fx.sampleRigYaw,
                    rigRoll: fx.sampleRigRoll,
                    flapHzAdd: fx.sampleFlapHzAdd,
                    wingAmpMul: fx.sampleWingAmpMul
                };
            }

            if (!stuntState.active) {
                stuntState.cooldown -= dt;
                if (stuntState.cooldown <= 0 && !emotionState.active) {
                    startRandomStunt();
                }
                return output;
            }

            stuntState.elapsed += dt;
            const action = stuntState.active;
            const u = THREE.MathUtils.clamp(stuntState.elapsed / action.duration, 0, 1);
            const s = smoothStep01(u);
            const env = smoothEmotionEnvelope(stuntState.elapsed, action.duration, action.fadeIn, action.fadeOut);

            if (action.key === 'barrel360') {
                const turn = s * Math.PI * 2;
                output.rigRoll = turn;
                output.rigY = Math.sin(s * Math.PI) * 0.38 * env;
                output.rigZ = -Math.sin(s * Math.PI) * 0.5 * env;
                output.rigYaw = Math.sin(s * Math.PI * 2) * 0.18 * env;
                output.flapHzAdd = 0.15 * env;
                output.wingAmpMul = 1 + 0.2 * env;
            } else if (action.key === 'loop') {
                const loopTurn = s * Math.PI * 2;
                output.rigPitch = loopTurn;
                output.rigY = Math.sin(s * Math.PI) * 0.95 * env;
                output.rigZ = -Math.sin(s * Math.PI) * 1.25 * env;
                output.rigRoll = Math.sin(s * Math.PI * 2) * 0.2 * env;
                output.flapHzAdd = 0.12 * env;
                output.wingAmpMul = 1 + 0.16 * env;
            } else if (action.key === 'corkscrew') {
                const turn = s * Math.PI * 2;
                const radius = 0.52 * env;
                output.rigX = Math.cos(turn) * radius;
                output.rigY = Math.sin(s * Math.PI) * 0.62 * env;
                output.rigZ = -Math.sin(turn * 2) * radius * 0.58;
                output.rigYaw = Math.sin(turn) * 0.95 * env;
                output.rigRoll = Math.sin(turn * 1.5) * 1.2 * env;
                output.flapHzAdd = 0.14 * env;
                output.wingAmpMul = 1 + 0.19 * env;
            } else if (action.key === 'wingover') {
                const rise = smoothStep01(Math.min(1, s * 1.45));
                const descend = smoothStep01(Math.max(0, (s - 0.34) / 0.66));
                output.rigY = (rise * 1.05 - descend * 0.95) * env;
                output.rigX = Math.sin(s * Math.PI) * 0.85 * env;
                output.rigYaw = Math.sin(s * Math.PI * 1.7) * 0.62 * env;
                output.rigRoll = Math.sin(s * Math.PI * 1.1) * 1.05 * env;
                output.rigPitch = -Math.sin(s * Math.PI) * 0.24 * env;
                output.flapHzAdd = 0.08 * env;
                output.wingAmpMul = 1 + 0.12 * env;
            } else if (action.key === 'burstDive') {
                const p1 = 0.18;
                const p2 = 0.48;
                const p3 = 0.78;
                if (u < p1) {
                    const q = smoothStep01(u / p1);
                    output.rigY = q * 0.65 * env;
                    output.rigPitch = -q * 0.42;
                    output.rigRoll = Math.sin(q * Math.PI) * 0.22;
                    output.flapHzAdd = 0.3 * q;
                    output.wingAmpMul = 1 + 0.55 * q;
                } else if (u < p2) {
                    const q = smoothStep01((u - p1) / (p2 - p1));
                    output.rigY = (0.65 + q * 3.35) * env;
                    output.rigZ = -q * 2.8 * env;
                    output.rigPitch = -0.55 + q * 0.22;
                    output.rigYaw = Math.sin(q * Math.PI) * 0.2;
                    output.rigRoll = Math.sin(q * Math.PI * 1.2) * 0.35;
                    output.flapHzAdd = 0.18 + (1 - q) * 0.12;
                    output.wingAmpMul = 1.48 - q * 0.28;
                } else if (u < p3) {
                    const q = smoothStep01((u - p2) / (p3 - p2));
                    const spinEase = 1 - Math.pow(1 - q, 3);
                    output.rigY = (4.0 - q * 6.35) * env;
                    output.rigZ = (-2.8 + q * 2.55) * env;
                    output.rigX = Math.sin(q * Math.PI * 2.1) * 0.7 * env;
                    output.rigPitch = 0.2 + q * 0.95;
                    output.rigYaw = Math.sin(q * Math.PI * 2.6) * 0.65 * env;
                    output.rigRoll = spinEase * (Math.PI * 3.4);
                    output.flapHzAdd = 0.04 + q * 0.08;
                    output.wingAmpMul = 0.9 + q * 0.38;
                } else {
                    const q = smoothStep01((u - p3) / (1 - p3));
                    output.rigY = (-2.15 + q * 2.15) * env;
                    output.rigZ = (-0.15 + q * 0.15) * env;
                    output.rigX = Math.sin((1 - q) * Math.PI) * 0.16 * env;
                    output.rigPitch = (1.15 - q * 1.15);
                    output.rigYaw = Math.sin((1 - q) * Math.PI) * 0.16 * env;
                    output.rigRoll = (Math.PI * 2.6) * (1 - q);
                    output.flapHzAdd = 0.16 * (1 - q);
                    output.wingAmpMul = 1.28 - q * 0.28;
                }
            }

            if (stuntState.elapsed >= action.duration) {
                stuntState.active = null;
                stuntState.elapsed = 0;
            }

            return output;
        }

        function updateCursorFromClientPoint(clientX, clientY) {
            cursor.x = (clientX / window.innerWidth) * 2 - 1;
            cursor.y = -(clientY / window.innerHeight) * 2 + 1;
        }

        function hashNoise1D(value, seed = 0) {
            const x = Math.sin(value * 127.1 + seed * 311.7) * 43758.5453123;
            return x - Math.floor(x);
        }

        function traceCanvasPolygon(ctx, points) {
            if (!points.length) return;
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.closePath();
        }

        function buildParchmentOutlinePoints(width, height) {
            const points = [];
            const left = width * 0.035;
            const right = width * 0.965;
            const top = height * 0.03;
            const bottom = height * 0.97;
            const topSegments = 28;
            const sideSegments = 44;
            const bottomSegments = 30;

            for (let i = 0; i <= topSegments; i++) {
                const p = i / topSegments;
                const x = THREE.MathUtils.lerp(left, right, p);
                const baseWave = (hashNoise1D(i * 0.43, 1) - 0.5) * height * 0.0038;
                const fray = (i === 0 || i === topSegments)
                    ? (hashNoise1D(i * 0.77, 2) - 0.5) * height * 0.022
                    : 0;
                points.push({ x, y: top + baseWave + fray });
            }

            for (let i = 1; i <= sideSegments; i++) {
                const p = i / sideSegments;
                const y = THREE.MathUtils.lerp(top, bottom, p);
                const jitter = (hashNoise1D(i * 0.69, 6) - 0.5) * width * 0.012;
                const tear = hashNoise1D(i * 1.27, 7) > 0.63
                    ? width * (0.004 + hashNoise1D(i * 2.31, 8) * 0.012)
                    : 0;
                points.push({ x: right + jitter + tear, y });
            }

            for (let i = 1; i <= bottomSegments; i++) {
                const p = i / bottomSegments;
                const x = THREE.MathUtils.lerp(right, left, p);
                const baseWave = (hashNoise1D(i * 0.58, 12) - 0.5) * height * 0.0058;
                const tear = hashNoise1D(i * 1.64, 13) > 0.78
                    ? width * (0.008 + hashNoise1D(i * 2.47, 14) * 0.018)
                    : 0;
                points.push({ x: x - tear, y: bottom + baseWave });
            }

            for (let i = 1; i <= sideSegments; i++) {
                const p = i / sideSegments;
                const y = THREE.MathUtils.lerp(bottom, top, p);
                const jitter = (hashNoise1D(i * 0.73, 16) - 0.5) * width * 0.012;
                const tear = hashNoise1D(i * 1.39, 17) > 0.62
                    ? width * (0.004 + hashNoise1D(i * 2.13, 18) * 0.012)
                    : 0;
                points.push({ x: left + jitter - tear, y });
            }

            return {
                points,
                bounds: { left, right, top, bottom }
            };
        }

        function createMysteryScrollSheetTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1360;
            const ctx = canvas.getContext('2d', { alpha: true });
            if (!ctx) return null;

            const width = canvas.width;
            const height = canvas.height;
            const { points, bounds } = buildParchmentOutlinePoints(width, height);

            ctx.clearRect(0, 0, width, height);
            traceCanvasPolygon(ctx, points);
            ctx.save();
            ctx.clip();

            const baseGradient = ctx.createLinearGradient(0, bounds.top, 0, bounds.bottom);
            baseGradient.addColorStop(0, '#cf7f34');
            baseGradient.addColorStop(0.18, '#efc46b');
            baseGradient.addColorStop(0.52, '#ffe6a0');
            baseGradient.addColorStop(0.84, '#e8b35a');
            baseGradient.addColorStop(1, '#c5732d');
            ctx.fillStyle = baseGradient;
            ctx.fillRect(0, 0, width, height);

            const centerGlow = ctx.createRadialGradient(
                width * 0.5,
                height * 0.58,
                width * 0.08,
                width * 0.5,
                height * 0.58,
                width * 0.48
            );
            centerGlow.addColorStop(0, 'rgba(255, 248, 196, 0.95)');
            centerGlow.addColorStop(0.55, 'rgba(255, 239, 168, 0.28)');
            centerGlow.addColorStop(1, 'rgba(255, 237, 158, 0)');
            ctx.fillStyle = centerGlow;
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < 1500; i++) {
                const x = hashNoise1D(i * 1.71, 21) * width;
                const y = hashNoise1D(i * 2.39, 22) * height;
                const radius = width * (0.003 + hashNoise1D(i * 3.13, 23) * 0.012);
                const warm = hashNoise1D(i * 1.47, 24) > 0.42;
                const alpha = 0.011 + hashNoise1D(i * 2.11, 25) * 0.038;
                ctx.fillStyle = warm
                    ? `rgba(171, 108, 47, ${alpha.toFixed(4)})`
                    : `rgba(255, 243, 204, ${(alpha * 0.72).toFixed(4)})`;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.lineCap = 'round';
            for (let i = 0; i < 28; i++) {
                const startX = width * (0.26 + hashNoise1D(i * 1.13, 31) * 0.48);
                const startY = height * (0.2 + hashNoise1D(i * 1.91, 32) * 0.62);
                const endX = startX + (hashNoise1D(i * 2.41, 33) - 0.5) * width * 0.22;
                const endY = startY + (hashNoise1D(i * 2.73, 34) - 0.5) * height * 0.16;
                ctx.strokeStyle = `rgba(167, 99, 39, ${(0.022 + hashNoise1D(i * 3.05, 35) * 0.046).toFixed(4)})`;
                ctx.lineWidth = 0.8 + hashNoise1D(i * 3.67, 36) * 1.9;
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.quadraticCurveTo(
                    (startX + endX) * 0.5 + (hashNoise1D(i * 4.09, 37) - 0.5) * width * 0.05,
                    (startY + endY) * 0.5 + (hashNoise1D(i * 4.51, 38) - 0.5) * height * 0.05,
                    endX,
                    endY
                );
                ctx.stroke();
            }

            const topShade = ctx.createLinearGradient(0, bounds.top, 0, bounds.top + (bounds.bottom - bounds.top) * 0.2);
            topShade.addColorStop(0, 'rgba(101, 55, 20, 0.46)');
            topShade.addColorStop(0.52, 'rgba(101, 55, 20, 0)');
            ctx.fillStyle = topShade;
            ctx.fillRect(bounds.left, bounds.top - 8, bounds.right - bounds.left, (bounds.bottom - bounds.top) * 0.24);

            const bottomShade = ctx.createLinearGradient(0, bounds.bottom, 0, bounds.bottom - (bounds.bottom - bounds.top) * 0.23);
            bottomShade.addColorStop(0, 'rgba(93, 49, 18, 0.5)');
            bottomShade.addColorStop(0.56, 'rgba(93, 49, 18, 0)');
            ctx.fillStyle = bottomShade;
            ctx.fillRect(bounds.left, bounds.bottom - (bounds.bottom - bounds.top) * 0.26, bounds.right - bounds.left, (bounds.bottom - bounds.top) * 0.26);

            ctx.restore();

            ctx.save();
            ctx.filter = 'blur(1.6px)';
            ctx.lineJoin = 'round';
            ctx.lineWidth = Math.round(width * 0.011);
            const edgeBurn = ctx.createLinearGradient(0, bounds.top, 0, bounds.bottom);
            edgeBurn.addColorStop(0, 'rgba(133, 62, 17, 0.5)');
            edgeBurn.addColorStop(0.5, 'rgba(117, 51, 15, 0.36)');
            edgeBurn.addColorStop(1, 'rgba(128, 58, 15, 0.56)');
            ctx.strokeStyle = edgeBurn;
            traceCanvasPolygon(ctx, points);
            ctx.stroke();
            ctx.restore();

            ctx.lineJoin = 'round';
            ctx.lineWidth = Math.round(width * 0.0022);
            ctx.strokeStyle = 'rgba(89, 38, 10, 0.3)';
            traceCanvasPolygon(ctx, points);
            ctx.stroke();

            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.wrapS = THREE.ClampToEdgeWrapping;
            texture.wrapT = THREE.ClampToEdgeWrapping;
            texture.needsUpdate = true;
            return texture;
        }

        function createMysteryScrollRollTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 260;
            const ctx = canvas.getContext('2d', { alpha: true });
            if (!ctx) return null;

            const width = canvas.width;
            const height = canvas.height;
            const base = ctx.createLinearGradient(0, 0, 0, height);
            base.addColorStop(0, '#b56d2f');
            base.addColorStop(0.2, '#e9b765');
            base.addColorStop(0.5, '#ffe8a6');
            base.addColorStop(0.78, '#dfa957');
            base.addColorStop(1, '#a8652e');
            ctx.fillStyle = base;
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < 1800; i++) {
                const x = hashNoise1D(i * 0.93, 44) * width;
                const y = hashNoise1D(i * 1.41, 45) * height;
                const alpha = 0.012 + hashNoise1D(i * 2.03, 46) * 0.036;
                const radius = 0.6 + hashNoise1D(i * 2.71, 47) * 2.2;
                ctx.fillStyle = `rgba(126, 80, 34, ${alpha.toFixed(4)})`;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            const centerHighlight = ctx.createLinearGradient(0, height * 0.2, 0, height * 0.8);
            centerHighlight.addColorStop(0, 'rgba(255, 240, 185, 0)');
            centerHighlight.addColorStop(0.5, 'rgba(255, 241, 184, 0.62)');
            centerHighlight.addColorStop(1, 'rgba(255, 240, 185, 0)');
            ctx.fillStyle = centerHighlight;
            ctx.fillRect(0, 0, width, height);

            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(1, 1.2);
            texture.needsUpdate = true;
            return texture;
        }

        function createMysteryScrollFinial(direction, rollLength, goldMaterial, darkMaterial) {
            const finial = new THREE.Group();
            const dir = Math.sign(direction) || 1;
            const baseX = dir * (rollLength * 0.5);

            const rootRing = new THREE.Mesh(new THREE.TorusGeometry(0.085, 0.028, 14, 36), darkMaterial);
            rootRing.rotation.y = Math.PI * 0.5;
            rootRing.position.x = baseX + dir * 0.01;

            const innerCollar = new THREE.Mesh(new THREE.CylinderGeometry(0.067, 0.083, 0.11, 24), goldMaterial);
            innerCollar.rotation.z = Math.PI * 0.5;
            innerCollar.position.x = baseX + dir * 0.12;

            const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.11, 28, 22), goldMaterial);
            bulb.scale.set(1.06, 0.9, 0.9);
            bulb.position.x = baseX + dir * 0.235;

            const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.036, 0.043, 0.22, 20), goldMaterial);
            neck.rotation.z = Math.PI * 0.5;
            neck.position.x = baseX + dir * 0.39;

            const tip = new THREE.Mesh(new THREE.SphereGeometry(0.056, 24, 18), goldMaterial);
            tip.scale.set(1.95, 0.74, 0.74);
            tip.position.x = baseX + dir * 0.54;

            finial.add(rootRing, innerCollar, bulb, neck, tip);
            return finial;
        }

        function createMysteryScrollModel() {
            const group = new THREE.Group();
            const rollLength = 2.8;
            const sheetWidth = rollLength;
            const sheetHeight = 1.95;
            const rollRadius = 0.16;
            const topRollY = sheetHeight * 0.5 + rollRadius * 0.42;
            const bottomRollY = -sheetHeight * 0.5 - rollRadius * 0.42;

            const sheetMap = createMysteryScrollSheetTexture();
            const rollMap = createMysteryScrollRollTexture();
            const maxAnisotropy = mysteryScroll3D.renderer ? mysteryScroll3D.renderer.capabilities.getMaxAnisotropy() : 1;
            const textureAnisotropy = Math.min(8, maxAnisotropy);
            if (sheetMap) sheetMap.anisotropy = textureAnisotropy;
            if (rollMap) rollMap.anisotropy = textureAnisotropy;

            const sheetGeometry = new THREE.PlaneGeometry(sheetWidth, sheetHeight, 56, 90);
            const position = sheetGeometry.attributes.position;
            for (let i = 0; i < position.count; i++) {
                const x = position.getX(i);
                const y = position.getY(i);
                const bendX = Math.pow(Math.abs(x) / (sheetWidth * 0.5), 1.3) * 0.058;
                const centerSag = Math.pow(Math.abs(y) / (sheetHeight * 0.5), 1.75) * -0.012;
                const wrinkle = Math.sin((y / sheetHeight) * Math.PI * 5.7 + x * 2.3) * 0.008;
                position.setZ(i, bendX + centerSag + wrinkle);
            }
            sheetGeometry.computeVertexNormals();

            const sheetMaterial = new THREE.MeshStandardMaterial({
                map: sheetMap || null,
                color: 0xe7b25d,
                roughness: 0.92,
                metalness: 0.03,
                transparent: true,
                alphaTest: 0.08,
                side: THREE.DoubleSide
            });
            const sheet = new THREE.Mesh(sheetGeometry, sheetMaterial);
            sheet.position.z = 0.02;
            group.add(sheet);

            const rollGeometry = new THREE.CylinderGeometry(rollRadius, rollRadius * 1.03, rollLength, 60, 1, false);
            rollGeometry.rotateZ(Math.PI * 0.5);
            const rollMaterial = new THREE.MeshStandardMaterial({
                map: rollMap || null,
                color: 0xdda557,
                roughness: 0.84,
                metalness: 0.03
            });
            const topRoll = new THREE.Mesh(rollGeometry, rollMaterial);
            topRoll.position.set(0, topRollY, 0.095);
            const bottomRoll = new THREE.Mesh(rollGeometry, rollMaterial);
            bottomRoll.position.set(0, bottomRollY, 0.095);
            group.add(topRoll, bottomRoll);

            // Bridge strips ensure visible contact between parchment and rollers.
            const wrapMaterial = new THREE.MeshStandardMaterial({
                color: 0xdfab57,
                roughness: 0.91,
                metalness: 0.02,
                side: THREE.DoubleSide
            });
            const wrapGeometry = new THREE.PlaneGeometry(sheetWidth * 0.93, rollRadius * 0.9);
            const topWrap = new THREE.Mesh(wrapGeometry, wrapMaterial);
            topWrap.position.set(0, topRollY - rollRadius * 0.86, 0.072);
            const bottomWrap = new THREE.Mesh(wrapGeometry, wrapMaterial.clone());
            bottomWrap.position.set(0, bottomRollY + rollRadius * 0.86, 0.072);
            group.add(topWrap, bottomWrap);

            const ropeAttachMarker = new THREE.Object3D();
            ropeAttachMarker.position.set(0, topRollY + rollRadius * 0.64, 0.1);
            group.add(ropeAttachMarker);
            group.userData.attachmentNode = ropeAttachMarker;

            const goldMaterial = new THREE.MeshStandardMaterial({
                color: 0xf1bf67,
                emissive: 0x4a2a08,
                emissiveIntensity: 0.21,
                roughness: 0.26,
                metalness: 0.93
            });
            const darkMetalMaterial = new THREE.MeshStandardMaterial({
                color: 0x231209,
                emissive: 0x120804,
                emissiveIntensity: 0.08,
                roughness: 0.48,
                metalness: 0.82
            });

            const topLeftFinial = createMysteryScrollFinial(-1, rollLength, goldMaterial, darkMetalMaterial);
            const topRightFinial = createMysteryScrollFinial(1, rollLength, goldMaterial, darkMetalMaterial);
            topLeftFinial.position.y = topRollY;
            topRightFinial.position.y = topRollY;

            const bottomLeftFinial = createMysteryScrollFinial(-1, rollLength, goldMaterial, darkMetalMaterial);
            const bottomRightFinial = createMysteryScrollFinial(1, rollLength, goldMaterial, darkMetalMaterial);
            bottomLeftFinial.position.y = bottomRollY;
            bottomRightFinial.position.y = bottomRollY;
            group.add(topLeftFinial, topRightFinial, bottomLeftFinial, bottomRightFinial);

            group.position.y = 0.0;
            group.rotation.x = -0.045;
            return group;
        }

        function initMysteryScroll3D() {
            if (!mysteryScroll3D.enabled || mysteryScroll3D.renderer) return;
            try {
                const renderer = new THREE.WebGLRenderer({
                    canvas: mysteryScrollCanvas,
                    antialias: true,
                    alpha: true,
                    premultipliedAlpha: true,
                    powerPreference: 'high-performance'
                });
                renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                renderer.setClearColor(0x000000, 0);
                renderer.outputColorSpace = THREE.SRGBColorSpace;
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                renderer.toneMappingExposure = 1.15;

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 30);
                camera.position.set(0, 0.03, 5.2);

                scene.add(new THREE.AmbientLight(0xffedcc, 1.12));
                const keyLight = new THREE.DirectionalLight(0xfff1d8, 1.45);
                keyLight.position.set(1.9, 2.5, 2.4);
                const warmFillLight = new THREE.DirectionalLight(0xc57f3b, 0.58);
                warmFillLight.position.set(-2.2, -0.6, 1.8);
                const edgeLight = new THREE.DirectionalLight(0x4f2d12, 0.34);
                edgeLight.position.set(0.3, -2.5, -2.2);
                scene.add(keyLight, warmFillLight, edgeLight);

                mysteryScroll3D.renderer = renderer;
                mysteryScroll3D.scene = scene;
                mysteryScroll3D.camera = camera;
                mysteryScroll3D.group = createMysteryScrollModel();
                mysteryScroll3D.attachmentNode = mysteryScroll3D.group.userData.attachmentNode || null;
                scene.add(mysteryScroll3D.group);
                resizeMysteryScroll3D(true);
            } catch (error) {
                console.warn('Unable to initialize 3D mystery scroll renderer:', error);
            }
        }

        function updateMysteryScrollAttachmentMetrics() {
            if (!mysteryScroll3D.enabled || !mysteryScroll3D.camera || !mysteryScroll3D.group) return;
            const node = mysteryScroll3D.attachmentNode || mysteryScroll3D.group.userData.attachmentNode;
            if (!node) return;

            const worldPosition = node.getWorldPosition(new THREE.Vector3());
            const projected = worldPosition.project(mysteryScroll3D.camera);
            if (!Number.isFinite(projected.x) || !Number.isFinite(projected.y)) return;

            mysteryScroll3D.attachmentXNorm = THREE.MathUtils.clamp((projected.x + 1) * 0.5, 0, 1);
            mysteryScroll3D.attachmentYNorm = THREE.MathUtils.clamp((1 - projected.y) * 0.5, 0, 1);
        }

        function fitMysteryScrollText(force = false) {
            if (!mysteryScrollSign) return;
            const textWrap = mysteryScrollSign.querySelector('.scroll-text');
            const topLine = mysteryScrollSign.querySelector('.line-top');
            const bottomLine = mysteryScrollSign.querySelector('.line-bottom');
            if (!textWrap || !topLine || !bottomLine) return;

            const signWidth = mysteryScrollSign.offsetWidth;
            const signHeight = mysteryScrollSign.offsetHeight;
            if (!force &&
                Math.abs(signWidth - mysteryScroll3D.textFitWidth) < 1 &&
                Math.abs(signHeight - mysteryScroll3D.textFitHeight) < 1) {
                return;
            }

            mysteryScroll3D.textFitWidth = signWidth;
            mysteryScroll3D.textFitHeight = signHeight;

            const availableWidth = Math.max(72, textWrap.clientWidth - 2);
            const signScale = THREE.MathUtils.clamp(
                Math.min(signWidth / 300, signHeight / 242),
                0.65,
                1.1
            );
            const topBaseSize = signWidth * 0.178;
            const bottomBaseSize = signWidth * 0.134;
            let topSize = topBaseSize;
            let bottomSize = bottomBaseSize;
            const minTopSize = topBaseSize * 0.7;
            const minBottomSize = bottomBaseSize * 0.7;
            const topStep = 0.4 * signScale;
            const bottomStep = 0.35 * signScale;
            const topTranslateY = -THREE.MathUtils.clamp(signHeight * 0.0155, 1.8, 3.8);
            const bottomTranslateY = -THREE.MathUtils.clamp(signHeight * 0.0082, 0.9, 2.2);

            topLine.style.fontSize = `${topSize.toFixed(2)}px`;
            bottomLine.style.fontSize = `${bottomSize.toFixed(2)}px`;
            topLine.style.transform = `translateY(${topTranslateY.toFixed(2)}px) scaleX(1)`;
            bottomLine.style.transform = `translateY(${bottomTranslateY.toFixed(2)}px) scaleX(1)`;
            topLine.style.transformOrigin = '50% 50%';
            bottomLine.style.transformOrigin = '50% 50%';

            for (let i = 0; i < 90; i++) {
                const topOverflow = topLine.scrollWidth - availableWidth;
                const bottomOverflow = bottomLine.scrollWidth - availableWidth;
                if (topOverflow <= 0.5 && bottomOverflow <= 0.5) break;

                if (topOverflow > 0.5 && topSize > minTopSize) {
                    topSize -= topStep;
                }
                if (bottomOverflow > 0.5 && bottomSize > minBottomSize) {
                    bottomSize -= bottomStep;
                }

                topLine.style.fontSize = `${topSize.toFixed(2)}px`;
                bottomLine.style.fontSize = `${bottomSize.toFixed(2)}px`;
            }

            const widthNorm = THREE.MathUtils.clamp((signWidth - 154) / 146, 0, 1);
            const topLetterSpacing = THREE.MathUtils.lerp(0.01, 0.018, widthNorm);
            const bottomLetterSpacing = THREE.MathUtils.lerp(0.009, 0.015, widthNorm);
            topLine.style.letterSpacing = `${topLetterSpacing.toFixed(3)}em`;
            bottomLine.style.letterSpacing = `${bottomLetterSpacing.toFixed(3)}em`;

            const topScale = Math.min(1, availableWidth / Math.max(1, topLine.scrollWidth));
            const bottomScale = Math.min(1, availableWidth / Math.max(1, bottomLine.scrollWidth));
            topLine.style.transform = `translateY(${topTranslateY.toFixed(2)}px) scaleX(${Math.max(0.84, topScale).toFixed(3)})`;
            bottomLine.style.transform = `translateY(${bottomTranslateY.toFixed(2)}px) scaleX(${Math.max(0.86, bottomScale).toFixed(3)})`;
        }

        function resizeMysteryScroll3D(forceRender = false) {
            if (!mysteryScroll3D.enabled || !mysteryScroll3D.renderer || !mysteryScrollSign) return;
            const rect = mysteryScrollSign.getBoundingClientRect();
            const width = Math.max(160, Math.round(rect.width));
            const height = Math.max(180, Math.round(rect.height));
            const resized = width !== mysteryScroll3D.width || height !== mysteryScroll3D.height;
            if (!resized && !forceRender) return;

            mysteryScroll3D.width = width;
            mysteryScroll3D.height = height;
            mysteryScroll3D.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            mysteryScroll3D.renderer.setSize(width, height, false);
            mysteryScroll3D.camera.aspect = width / Math.max(1, height);
            const verticalFov = THREE.MathUtils.degToRad(mysteryScroll3D.camera.fov);
            const horizontalFov = 2 * Math.atan(Math.tan(verticalFov * 0.5) * mysteryScroll3D.camera.aspect);
            const targetWidth = 4.16;
            const targetHeight = 2.7;
            const padding = 1.02;
            const distanceForHeight = (targetHeight * 0.5 * padding) / Math.tan(verticalFov * 0.5);
            const distanceForWidth = (targetWidth * 0.5 * padding) / Math.tan(horizontalFov * 0.5);
            mysteryScroll3D.camera.position.set(0, 0.03, Math.max(distanceForHeight, distanceForWidth));
            mysteryScroll3D.camera.updateProjectionMatrix();
            updateMysteryScrollAttachmentMetrics();
            fitMysteryScrollText(forceRender || resized);
            renderMysteryScroll3D(0);
        }

        function renderMysteryScroll3D(t = 0) {
            if (!mysteryScroll3D.enabled || !mysteryScroll3D.renderer || !mysteryScroll3D.group) return;
            mysteryScroll3D.group.rotation.y = 0;
            mysteryScroll3D.group.rotation.x = -0.045;
            updateMysteryScrollAttachmentMetrics();
            mysteryScroll3D.renderer.render(mysteryScroll3D.scene, mysteryScroll3D.camera);
        }

        function buildMysteryHangingSignPath(points) {
            if (!points || points.length === 0) return '';
            let path = `M ${points[0].x.toFixed(2)} ${points[0].y.toFixed(2)}`;
            if (points.length === 1) return path;
            for (let i = 1; i < points.length - 1; i++) {
                const xc = (points[i].x + points[i + 1].x) * 0.5;
                const yc = (points[i].y + points[i + 1].y) * 0.5;
                path += ` Q ${points[i].x.toFixed(2)} ${points[i].y.toFixed(2)} ${xc.toFixed(2)} ${yc.toFixed(2)}`;
            }
            const last = points[points.length - 1];
            path += ` T ${last.x.toFixed(2)} ${last.y.toFixed(2)}`;
            return path;
        }

        function syncMysteryHangingSignDom() {
            if (!mysteryHangingSign.enabled) return;
            const nodes = mysteryHangingSign.nodes;
            if (!nodes.length) return;

            const signLift = Number.isFinite(mysterySignSlingshotState?.launchOffset) ? mysterySignSlingshotState.launchOffset : 0;
            let pathPoints;
            if (signLift < 0) {
                // During slingshot launch/hold above the viewport, move rope + sign together.
                pathPoints = nodes.map((node) => ({
                    x: node.x,
                    y: node.y + signLift
                }));
            } else {
                // While dragging down, keep top rope fixed and stretch toward the sign tip.
                const ropeTipPoint = {
                    x: nodes[nodes.length - 1].x,
                    y: nodes[nodes.length - 1].y + signLift
                };
                pathPoints = nodes.length > 1
                    ? nodes.slice(0, -1).concat(ropeTipPoint)
                    : [ropeTipPoint];
            }

            mysteryHangingSignPath.setAttribute('d', buildMysteryHangingSignPath(pathPoints));
            mysteryHangingSignAnchor.setAttribute('cx', mysteryHangingSign.anchorX.toFixed(2));
            mysteryHangingSignAnchor.setAttribute('cy', mysteryHangingSign.anchorY.toFixed(2));
            mysteryHangingSignAnchor.setAttribute(
                'r',
                THREE.MathUtils.clamp(window.innerWidth * 0.0044, 2.5, 4.8).toFixed(2)
            );

            const tip = pathPoints[pathPoints.length - 1];
            const knotWidth = mysterySignKnot.offsetWidth || THREE.MathUtils.clamp(window.innerWidth * 0.015, 12, 20);
            const knotHeight = mysterySignKnot.offsetHeight || THREE.MathUtils.clamp(window.innerWidth * 0.013, 10, 17);
            const signWidth = mysteryScrollSign.offsetWidth || THREE.MathUtils.clamp(window.innerWidth * 0.2267, 200, 328);
            const signHeight = mysteryScrollSign.offsetHeight || THREE.MathUtils.clamp(window.innerWidth * 0.1867, 158, 265);
            const attachXNorm = mysteryScroll3D.attachmentXNorm || 0.5;
            const attachYNorm = mysteryScroll3D.attachmentYNorm || 0.18;
            const knotLeft = tip.x - knotWidth * 0.5;
            const signLeft = tip.x - signWidth * attachXNorm;
            const signTop = tip.y - signHeight * attachYNorm;
            const knotTop = tip.y - knotHeight * 0.62;
            const swingTransform = `perspective(1400px) rotateX(${mysteryHangingSign.pitch.toFixed(4)}rad) rotateZ(${mysteryHangingSign.angle.toFixed(4)}rad)`;
            mysterySignKnot.style.left = `${knotLeft.toFixed(2)}px`;
            mysterySignKnot.style.top = `${knotTop.toFixed(2)}px`;
            mysterySignKnot.style.transform = swingTransform;
            mysteryScrollSign.style.left = `${signLeft.toFixed(2)}px`;
            mysteryScrollSign.style.top = `${signTop.toFixed(2)}px`;
            mysteryScrollSign.style.transform = swingTransform;

            const hasFinitePlacement =
                Number.isFinite(knotLeft) &&
                Number.isFinite(knotTop) &&
                Number.isFinite(signLeft) &&
                Number.isFinite(signTop) &&
                signWidth > 0 &&
                signHeight > 0;
            if (hasFinitePlacement) {
                revealMysterySignLayer();
            }
        }

        function layoutMysteryHangingSign(forceReset = false) {
            if (!mysteryHangingSign.enabled) return;

            const segmentCount = MYSTERY_HANGING_SIGN_CONFIG.segmentCount;
            const width = window.innerWidth;
            const height = window.innerHeight;
            const aspect = width / Math.max(1, height);
            const landscapeBlend = THREE.MathUtils.clamp((aspect - 1.02) / 1.0, 0, 1);
            const shortLandscapeBlend = landscapeBlend * THREE.MathUtils.clamp((560 - height) / 160, 0, 1);
            const safeTopInset = window.visualViewport?.offsetTop || 0;
            const offscreenLift = Math.max(
                MYSTERY_HANGING_SIGN_CONFIG.anchorOffscreenMin,
                height * MYSTERY_HANGING_SIGN_CONFIG.anchorOffscreenViewportRatio
            );
            const nextAnchorX = width * 0.5;
            const nextAnchorY = safeTopInset - offscreenLift;
            const ropeLengthViewportRatio = THREE.MathUtils.lerp(
                MYSTERY_HANGING_SIGN_CONFIG.ropeLengthViewportRatio,
                0.125,
                shortLandscapeBlend
            );
            const minRopeLength = THREE.MathUtils.lerp(
                MYSTERY_HANGING_SIGN_CONFIG.minRopeLength,
                72,
                shortLandscapeBlend
            );
            const maxRopeLength = THREE.MathUtils.lerp(
                MYSTERY_HANGING_SIGN_CONFIG.maxRopeLength,
                160,
                shortLandscapeBlend
            );
            const visibleRopeLength = THREE.MathUtils.clamp(
                height * ropeLengthViewportRatio,
                minRopeLength,
                maxRopeLength
            );
            const nextRopeLength = visibleRopeLength + offscreenLift;
            const nextSegmentLength = nextRopeLength / segmentCount;

            const hasNodes = mysteryHangingSign.nodes.length === segmentCount + 1 &&
                mysteryHangingSign.prevNodes.length === segmentCount + 1;
            const sizeChanged = width !== mysteryHangingSign.viewportWidth ||
                height !== mysteryHangingSign.viewportHeight ||
                Math.abs(nextSegmentLength - mysteryHangingSign.segmentLength) > 0.01;
            const needsReset = forceReset || !hasNodes || sizeChanged;

            const prevAnchorX = mysteryHangingSign.anchorX;
            const prevAnchorY = mysteryHangingSign.anchorY;

            mysteryHangingSign.anchorX = nextAnchorX;
            mysteryHangingSign.anchorY = nextAnchorY;
            mysteryHangingSign.ropeLength = nextRopeLength;
            mysteryHangingSign.segmentLength = nextSegmentLength;
            mysteryHangingSign.viewportWidth = width;
            mysteryHangingSign.viewportHeight = height;
            mysteryHangingSignSvg.setAttribute('viewBox', `0 0 ${width} ${height}`);
            mysteryHangingSignSvg.setAttribute('preserveAspectRatio', 'none');
            resizeMysteryScroll3D();

            if (!hasNodes) {
                mysteryHangingSign.nodes = Array.from({ length: segmentCount + 1 }, () => ({ x: 0, y: 0 }));
                mysteryHangingSign.prevNodes = Array.from({ length: segmentCount + 1 }, () => ({ x: 0, y: 0 }));
            }

            if (needsReset) {
                for (let i = 0; i <= segmentCount; i++) {
                    const nodeY = nextAnchorY + nextSegmentLength * i;
                    const swaySeed = Math.sin(i * 0.55) * 0.85;
                    mysteryHangingSign.nodes[i].x = nextAnchorX + swaySeed;
                    mysteryHangingSign.nodes[i].y = nodeY;
                    mysteryHangingSign.prevNodes[i].x = nextAnchorX + swaySeed;
                    mysteryHangingSign.prevNodes[i].y = nodeY;
                }
                mysteryHangingSign.angle = 0;
                mysteryHangingSign.pitch = 0;
                mysteryHangingSign.angularVelocity = 0;
            } else {
                const shiftX = nextAnchorX - prevAnchorX;
                const shiftY = nextAnchorY - prevAnchorY;
                for (let i = 0; i <= segmentCount; i++) {
                    mysteryHangingSign.nodes[i].x += shiftX;
                    mysteryHangingSign.nodes[i].y += shiftY;
                    mysteryHangingSign.prevNodes[i].x += shiftX;
                    mysteryHangingSign.prevNodes[i].y += shiftY;
                }
            }

            syncMysteryHangingSignDom();
        }

        function updateMysteryHangingSign(dt, t) {
            if (!mysteryHangingSign.enabled) return;
            if (!mysteryHangingSign.nodes.length) {
                layoutMysteryHangingSign(true);
            }

            const stepDt = Math.min(Math.max(dt, 1 / 240), 1 / 24);
            const nodes = mysteryHangingSign.nodes;
            const prevNodes = mysteryHangingSign.prevNodes;
            const segmentCount = MYSTERY_HANGING_SIGN_CONFIG.segmentCount;

            const windBase =
                Math.sin(t * 0.42 + 0.4) * 0.66 +
                Math.sin(t * 0.97 + 1.7) * 0.26 +
                Math.sin(t * 2.2 + 0.9) * 0.08;
            const gustCarrier = Math.max(0, Math.sin(t * 0.15 - 0.52));
            const gust = gustCarrier * gustCarrier * MYSTERY_HANGING_SIGN_CONFIG.windGustForce;
            const lateralAcceleration = windBase * MYSTERY_HANGING_SIGN_CONFIG.windLateralForce + gust;

            const damping = Math.pow(MYSTERY_HANGING_SIGN_CONFIG.damping, stepDt * 60);
            const gravityStep = MYSTERY_HANGING_SIGN_CONFIG.gravity * stepDt * stepDt;

            nodes[0].x = mysteryHangingSign.anchorX;
            nodes[0].y = mysteryHangingSign.anchorY;
            prevNodes[0].x = mysteryHangingSign.anchorX;
            prevNodes[0].y = mysteryHangingSign.anchorY;

            for (let i = 1; i <= segmentCount; i++) {
                const node = nodes[i];
                const previous = prevNodes[i];
                const currentX = node.x;
                const currentY = node.y;
                const velX = (node.x - previous.x) * damping;
                const velY = (node.y - previous.y) * damping;
                previous.x = currentX;
                previous.y = currentY;
                const windInfluence = 0.34 + (i / segmentCount) * 0.96;
                node.x = currentX + velX + lateralAcceleration * windInfluence * stepDt * stepDt;
                node.y = currentY + velY + gravityStep;
            }
            nodes[segmentCount].y += gravityStep * 1.35;

            for (let iteration = 0; iteration < MYSTERY_HANGING_SIGN_CONFIG.solverIterations; iteration++) {
                nodes[0].x = mysteryHangingSign.anchorX;
                nodes[0].y = mysteryHangingSign.anchorY;
                for (let i = 1; i <= segmentCount; i++) {
                    const p1 = nodes[i - 1];
                    const p2 = nodes[i];
                    const dx = p2.x - p1.x;
                    const dy = p2.y - p1.y;
                    const distance = Math.max(0.0001, Math.hypot(dx, dy));
                    const diff = (distance - mysteryHangingSign.segmentLength) / distance;

                    if (i === 1) {
                        p2.x -= dx * diff;
                        p2.y -= dy * diff;
                    } else {
                        const correctionX = dx * diff * 0.5;
                        const correctionY = dy * diff * 0.5;
                        p1.x += correctionX;
                        p1.y += correctionY;
                        p2.x -= correctionX;
                        p2.y -= correctionY;
                    }
                }
            }

            const tip = nodes[segmentCount];
            const neck = nodes[segmentCount - 1] || tip;
            const ropeLean = Math.atan2(tip.x - neck.x, tip.y - neck.y);
            const windTorque = (lateralAcceleration / Math.max(1, MYSTERY_HANGING_SIGN_CONFIG.windLateralForce)) * 0.35;
            const gravityTorque = -Math.sin(mysteryHangingSign.angle) * 7.05;
            const alignmentTorque = (ropeLean * 0.92 - mysteryHangingSign.angle) * MYSTERY_HANGING_SIGN_CONFIG.angularStiffness;
            const dampingTorque = -mysteryHangingSign.angularVelocity * MYSTERY_HANGING_SIGN_CONFIG.angularDamping;
            const angularAcceleration = gravityTorque + alignmentTorque + dampingTorque + windTorque;
            mysteryHangingSign.angularVelocity += angularAcceleration * stepDt;
            mysteryHangingSign.angularVelocity = THREE.MathUtils.clamp(mysteryHangingSign.angularVelocity, -2.4, 2.4);
            mysteryHangingSign.angle += mysteryHangingSign.angularVelocity * stepDt;
            mysteryHangingSign.angle = THREE.MathUtils.clamp(mysteryHangingSign.angle, -0.62, 0.62);

            const depthTarget = THREE.MathUtils.clamp(
                ((tip.y - neck.y) - mysteryHangingSign.segmentLength) * -0.052 +
                (tip.x - prevNodes[segmentCount].x) * 0.016,
                -0.16,
                0.12
            );
            mysteryHangingSign.pitch += (depthTarget - mysteryHangingSign.pitch) * Math.min(1, stepDt * 5.8);

            advanceMysterySignSlingshotFlight(dt);
            syncMysteryHangingSignDom();
            renderMysteryScroll3D(t);
        }

        function intersectObjectsAt(clientX, clientY, objects, recursive = true) {
            if (!objects) return [];
            const objectList = Array.isArray(objects) ? objects : [objects];
            if (!objectList.length) return [];

            pointerNdc.x = (clientX / window.innerWidth) * 2 - 1;
            pointerNdc.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(pointerNdc, camera);
            return raycaster.intersectObjects(objectList, recursive);
        }

        function intersectsCharacterAt(clientX, clientY) {
            return intersectObjectsAt(clientX, clientY, characterHitMeshes, false).length > 0;
        }

        function isPointOnMysteryScrollSign(clientX, clientY) {
            if (!mysteryScrollSign) return false;
            if (document.body.classList.contains('inventory-open')) return false;
            if (previewState?.open || propPreviewPanel?.classList?.contains('open') || propPreviewOverlay?.classList?.contains('open')) {
                return false;
            }
            if (mysteryHangingSignLayer) {
                const layerStyle = getComputedStyle(mysteryHangingSignLayer);
                if (!layerStyle || layerStyle.visibility === 'hidden' || Number(layerStyle.opacity) <= 0.01) {
                    return false;
                }
            }
            const rect = mysteryScrollSign.getBoundingClientRect();
            if (!rect || rect.width <= 0 || rect.height <= 0) {
                return false;
            }
            return (
                clientX >= rect.left &&
                clientX <= rect.right &&
                clientY >= rect.top &&
                clientY <= rect.bottom
            );
        }

        window.addEventListener('pointermove', (e) => {
            if (mysterySignSlingshotState.active && (
                mysterySignSlingshotState.pointerId === null ||
                e.pointerId === mysterySignSlingshotState.pointerId
            )) {
                updateMysterySignSlingshot(e.clientY);
            }
            updateCursorFromClientPoint(e.clientX, e.clientY);
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            if (!touch) return;
            updateCursorFromClientPoint(touch.clientX, touch.clientY);
        }, { passive: true });

        window.addEventListener('pointerdown', (e) => {
            if (e.target && e.target.closest && e.target.closest('#ui-overlay')) return;
            if (e.target && e.target.closest && (e.target.closest('#prop-preview-panel') || e.target.closest('#prop-preview-overlay'))) return;
            if (
                (e.button === undefined || e.button === 0) &&
                isPointOnMysteryScrollSign(e.clientX, e.clientY) &&
                Number.isFinite(e.pointerId)
            ) {
                e.preventDefault();
                if (beginMysterySignSlingshot(e.pointerId, e.clientY)) {
                    return;
                }
            }
            if (handleMysteryBoxPointerDown(e.clientX, e.clientY, e.pointerId)) return;
            if (!intersectsCharacterAt(e.clientX, e.clientY)) return;
            holdInput.active = true;
            holdInput.pointerId = e.pointerId ?? null;
            holdInput.startedMs = performance.now();
            holdInput.triggered = false;
        });

        window.addEventListener('pointermove', (e) => {
            if (!holdInput.active) return;
            if (holdInput.pointerId !== null && e.pointerId !== holdInput.pointerId) return;
            if (!intersectsCharacterAt(e.clientX, e.clientY)) {
                holdInput.active = false;
            }
        }, { passive: true });

        window.addEventListener('pointerup', (e) => {
            if (mysterySignSlingshotState.active) {
                endMysterySignSlingshot(e.pointerId);
            }
            if (handleMysteryBoxPointerUp(e.pointerId)) return;
            if (!holdInput.active) return;
            if (holdInput.pointerId !== null && e.pointerId !== holdInput.pointerId) return;
            const heldMs = performance.now() - holdInput.startedMs;
            const wasTriggered = holdInput.triggered;
            holdInput.active = false;
            holdInput.pointerId = null;
            holdInput.startedMs = 0;
            holdInput.triggered = false;
            if (!wasTriggered && heldMs < HOLD_TO_BURST_MS) {
                startRandomEmotionAction();
                if (!stuntState.active && Math.random() < 0.45) startRandomStunt();
            }
        });

        window.addEventListener('pointercancel', (e) => {
            if (mysterySignSlingshotState.active) {
                endMysterySignSlingshot(e.pointerId ?? mysterySignSlingshotState.pointerId);
            }
            handleMysteryBoxPointerCancel(e.pointerId ?? null);
            holdInput.active = false;
            holdInput.pointerId = null;
            holdInput.startedMs = 0;
            holdInput.triggered = false;
        });

        const responsiveViewState = {
            initialized: false,
            needsProjectionUpdate: false,
            currentFov: camera.fov,
            targetFov: camera.fov,
            currentPosition: camera.position.clone(),
            targetPosition: camera.position.clone(),
            currentScale: BASE_CREATURE_SCALE,
            targetScale: BASE_CREATURE_SCALE
        };
        let responsiveLayoutUpdateQueued = false;
        let orientationSettleTimer = null;

        function getViewportDimensions() {
            const visualViewport = window.visualViewport;
            const rawWidth = visualViewport && Number.isFinite(visualViewport.width)
                ? visualViewport.width
                : window.innerWidth;
            const rawHeight = visualViewport && Number.isFinite(visualViewport.height)
                ? visualViewport.height
                : window.innerHeight;
            const width = Math.max(1, Math.round(rawWidth || 1));
            const height = Math.max(1, Math.round(rawHeight || 1));
            return {
                width,
                height,
                aspect: width / height
            };
        }

        function computeResponsiveViewTargets(viewportWidth, viewportHeight) {
            const aspect = viewportWidth / viewportHeight;
            const portraitBlend = THREE.MathUtils.clamp((1.03 - aspect) / 0.5, 0, 1);
            const landscapeBlend = THREE.MathUtils.clamp((aspect - 1.02) / 1.06, 0, 1);
            const wideLandscapeBlend = THREE.MathUtils.clamp((aspect - 1.62) / 1.0, 0, 1);
            const compactLandscapeBlend = THREE.MathUtils.clamp((1.2 - aspect) / 0.24, 0, 1);
            const shortLandscapeBlend = landscapeBlend * THREE.MathUtils.clamp((560 - viewportHeight) / 160, 0, 1);
            const tallPortraitBlend = THREE.MathUtils.clamp((0.75 - aspect) / 0.24, 0, 1);

            const landscapeFovBase = THREE.MathUtils.lerp(48.8, 51.2, landscapeBlend);
            const landscapeFovWide = THREE.MathUtils.lerp(landscapeFovBase, 52.2, wideLandscapeBlend);
            const landscapeFov = THREE.MathUtils.lerp(landscapeFovWide, 50.4, shortLandscapeBlend);
            const portraitFov = THREE.MathUtils.lerp(53.0, 54.4, tallPortraitBlend);
            const fov = THREE.MathUtils.clamp(
                THREE.MathUtils.lerp(landscapeFov, portraitFov, portraitBlend),
                47,
                59
            );

            const landscapeYBase = THREE.MathUtils.lerp(1.9, 2.18, wideLandscapeBlend);
            const landscapeY = THREE.MathUtils.lerp(landscapeYBase, 2.46, shortLandscapeBlend);
            const portraitY = THREE.MathUtils.lerp(0.92, 0.84, tallPortraitBlend);
            const positionY = THREE.MathUtils.lerp(landscapeY, portraitY, portraitBlend);

            const landscapeZBase = THREE.MathUtils.lerp(21.8, 23.1, landscapeBlend);
            const landscapeZWide = THREE.MathUtils.lerp(landscapeZBase, 24.6, wideLandscapeBlend);
            const landscapeZShort = THREE.MathUtils.lerp(landscapeZWide, 22.8, shortLandscapeBlend);
            const landscapeZ = THREE.MathUtils.lerp(landscapeZShort, 21.9, compactLandscapeBlend);
            const portraitZ = THREE.MathUtils.lerp(22.5, 23.3, tallPortraitBlend);
            const positionZ = THREE.MathUtils.lerp(landscapeZ, portraitZ, portraitBlend);

            let scaleMultiplier = THREE.MathUtils.lerp(0.96, 0.9, landscapeBlend);
            scaleMultiplier = THREE.MathUtils.lerp(scaleMultiplier, 0.9, portraitBlend);
            scaleMultiplier = THREE.MathUtils.lerp(scaleMultiplier, 0.96, shortLandscapeBlend);
            if (viewportWidth < 420) scaleMultiplier *= 0.96;
            if (viewportHeight < 430 && aspect < 1.0) scaleMultiplier *= 0.95;
            const creatureScale = BASE_CREATURE_SCALE * THREE.MathUtils.clamp(scaleMultiplier, 0.84, 0.98);

            return {
                aspect,
                fov,
                positionY,
                positionZ,
                creatureScale
            };
        }

        function stepResponsiveViewMotion(dt, force = false) {
            if (!responsiveViewState.initialized) {
                return;
            }
            const safeDt = Number.isFinite(dt) && dt > 0 ? dt : 1 / 60;
            const blend = force ? 1 : 1 - Math.exp(-safeDt * 11);
            const previousFov = responsiveViewState.currentFov;

            responsiveViewState.currentFov = THREE.MathUtils.lerp(
                responsiveViewState.currentFov,
                responsiveViewState.targetFov,
                blend
            );
            responsiveViewState.currentPosition.lerp(responsiveViewState.targetPosition, blend);
            responsiveViewState.currentScale = THREE.MathUtils.lerp(
                responsiveViewState.currentScale,
                responsiveViewState.targetScale,
                blend
            );

            camera.fov = responsiveViewState.currentFov;
            camera.position.copy(responsiveViewState.currentPosition);
            creatureGroup.scale.setScalar(responsiveViewState.currentScale);

            if (
                force ||
                responsiveViewState.needsProjectionUpdate ||
                Math.abs(responsiveViewState.currentFov - previousFov) > 0.001
            ) {
                camera.updateProjectionMatrix();
                responsiveViewState.needsProjectionUpdate = false;
            }
        }

        function scheduleResponsiveLayout({ afterPaint = false } = {}) {
            if (responsiveLayoutUpdateQueued) {
                return;
            }
            responsiveLayoutUpdateQueued = true;
            const runLayout = () => {
                responsiveLayoutUpdateQueued = false;
                applyResponsiveLayout();
            };
            if (afterPaint) {
                window.requestAnimationFrame(() => {
                    window.requestAnimationFrame(runLayout);
                });
                return;
            }
            window.requestAnimationFrame(runLayout);
        }

        function applyResponsiveLayout() {
            const { width: w, height: h, aspect } = getViewportDimensions();
            const viewTarget = computeResponsiveViewTargets(w, h);

            camera.aspect = aspect;
            responsiveViewState.needsProjectionUpdate = true;
            responsiveViewState.targetFov = viewTarget.fov;
            responsiveViewState.targetPosition.set(0, viewTarget.positionY, viewTarget.positionZ);
            responsiveViewState.targetScale = viewTarget.creatureScale;

            if (!responsiveViewState.initialized) {
                responsiveViewState.initialized = true;
                responsiveViewState.currentFov = responsiveViewState.targetFov;
                responsiveViewState.currentPosition.copy(responsiveViewState.targetPosition);
                responsiveViewState.currentScale = responsiveViewState.targetScale;
                stepResponsiveViewMotion(1 / 60, true);
            }

            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(w, h);

            if (previewState && previewState.open) {
                resizePropViewport();
            }

            layoutMysteryHangingSign();
            resizeMysteryScroll3D();
            inventoryPanelAnchorState.initialized = false;
            scheduleInventoryPanelAnchorUpdate({ afterPaint: true });
        }

        function animate() {
            requestAnimationFrame(animate);
            const rawDelta = clock.getDelta();
            if (!homePageRouteAudioState.isActive) {
                const now = performance.now();
                if ((now - homePageAnimationState.lastInactiveRenderAtMs) >= HOME_PAGE_INACTIVE_RENDER_INTERVAL_MS) {
                    homePageAnimationState.lastInactiveRenderAtMs = now;
                    renderer.render(scene, camera);
                }
                return;
            }
            const dt = Math.min(rawDelta, 1 / 30);
            if (!Number.isFinite(dt) || dt <= 0) {
                renderer.render(scene, camera);
                return;
            }
            elapsed += dt;
            const t = elapsed;
            stepResponsiveViewMotion(dt);

            if (!mysteryFlightCinematic.active && holdInput.active && !holdInput.triggered && (performance.now() - holdInput.startedMs) >= HOLD_TO_BURST_MS) {
                holdInput.triggered = true;
                startStuntByKey('burstDive');
                startRandomEmotionAction();
            }

            const emotion = sampleEmotion(dt);
            const mysteryFlightFxRaw = updateMysteryFlightCinematic(dt, t);
            const mysteryFlightFx = sampleMysteryFlightRender(dt, mysteryFlightFxRaw);
            const stuntTarget = sampleStunt(dt);

            [stuntSim.pos.x, stuntSim.vel.x] = stepSpringScalar(
                stuntSim.pos.x,
                stuntSim.vel.x,
                stuntTarget.rigX,
                STUNT_PHYSICS.posStiffness,
                STUNT_PHYSICS.posDamping,
                dt,
                STUNT_PHYSICS.maxLinearSpeed
            );
            [stuntSim.pos.y, stuntSim.vel.y] = stepSpringScalar(
                stuntSim.pos.y,
                stuntSim.vel.y,
                stuntTarget.rigY,
                STUNT_PHYSICS.posStiffness,
                STUNT_PHYSICS.posDamping,
                dt,
                STUNT_PHYSICS.maxLinearSpeed
            );
            [stuntSim.pos.z, stuntSim.vel.z] = stepSpringScalar(
                stuntSim.pos.z,
                stuntSim.vel.z,
                stuntTarget.rigZ,
                STUNT_PHYSICS.posStiffness,
                STUNT_PHYSICS.posDamping,
                dt,
                STUNT_PHYSICS.maxLinearSpeed
            );
            [stuntSim.rot.x, stuntSim.rotVel.x] = stepSpringScalar(
                stuntSim.rot.x,
                stuntSim.rotVel.x,
                stuntTarget.rigPitch,
                STUNT_PHYSICS.rotStiffness,
                STUNT_PHYSICS.rotDamping,
                dt,
                STUNT_PHYSICS.maxAngularSpeed,
                true
            );
            [stuntSim.rot.y, stuntSim.rotVel.y] = stepSpringScalar(
                stuntSim.rot.y,
                stuntSim.rotVel.y,
                stuntTarget.rigYaw,
                STUNT_PHYSICS.rotStiffness,
                STUNT_PHYSICS.rotDamping,
                dt,
                STUNT_PHYSICS.maxAngularSpeed,
                true
            );
            [stuntSim.rot.z, stuntSim.rotVel.z] = stepSpringScalar(
                stuntSim.rot.z,
                stuntSim.rotVel.z,
                stuntTarget.rigRoll,
                STUNT_PHYSICS.rotStiffness,
                STUNT_PHYSICS.rotDamping,
                dt,
                STUNT_PHYSICS.maxAngularSpeed,
                true
            );

            if (!Number.isFinite(stuntSim.pos.x) || !Number.isFinite(stuntSim.pos.y) || !Number.isFinite(stuntSim.pos.z)) {
                stuntSim.pos.set(0, 0, 0);
                stuntSim.vel.set(0, 0, 0);
            }
