<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#5e9f33">
    <title>Aetheria: The Pet (Sunny Garden)</title>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preload" as="script" href="https://unpkg.com/three@0.160.0/build/three.module.js" crossorigin>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap');

        :root {
            --app-font-sans: 'Nunito', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --app-font-display: 'Fredoka', 'Nunito', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --app-text-main: #e2e8f0;
            --app-text-muted: rgba(226, 232, 240, 0.82);
            --app-surface: rgba(30, 41, 59, 0.84);
            --app-surface-solid: linear-gradient(180deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.88));
            --app-border: rgba(255, 255, 255, 0.18);
            --app-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
            --app-elevated-shadow: 0 10px 24px rgba(0, 0, 0, 0.36);
            --app-accent: #8b5cf6;
            --app-secondary: #6366f1;
            --app-success: #22d3ee;
            --app-btn-radius: 16px;
            --app-btn-font-weight: 700;
            --app-focus-ring: 0 0 0 2px rgba(99, 102, 241, 0.45), 0 0 0 4px rgba(125, 250, 255, 0.22);
            --app-btn-lift: -2px;
            --app-panel-radius: 16px;
            --inventory-safe-area-top: env(safe-area-inset-top, 0px);
            --inventory-safe-area-left: env(safe-area-inset-left, 0px);
            --inventory-safe-area-right: env(safe-area-inset-right, 0px);
            --inventory-safe-area-bottom: env(safe-area-inset-bottom, 0px);

            --bg-dark: transparent;
            --hud-bg: var(--app-surface);
            --hud-panel-bg: var(--app-surface-solid);
            --hud-border: var(--app-border);
            --hud-text: var(--app-text-main);
            --hud-font: var(--app-font-sans);
            --btn-font: var(--app-font-display);
            --btn-bg: linear-gradient(180deg, rgba(30, 41, 59, 0.72), rgba(15, 23, 42, 0.82));
            --btn-hover: linear-gradient(180deg, rgba(99, 102, 241, 0.96), rgba(79, 70, 229, 0.94));
            --btn-border: rgba(203, 213, 225, 0.35);
            --accent: var(--app-accent);
            --panel-shadow: var(--app-shadow);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-dark);
            font-family: var(--hud-font);
        }

        canvas {
            background: transparent !important;
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: transparent;
        }

        #gif-background,
        #gif-background-fallback {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            z-index: 0;
        }

        #gif-background {
            filter: saturate(1.1) contrast(1.06) brightness(0.92);
            opacity: 1;
            transition: opacity 220ms ease;
        }

        #gif-background-fallback {
            opacity: 0;
            transition: opacity 220ms ease;
            filter: saturate(1.1) contrast(1.06) brightness(0.92);
        }

        body.bg-use-fallback #gif-background {
            opacity: 0;
        }

        body.bg-use-fallback #gif-background-fallback {
            opacity: 1;
        }

        #gif-tint {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background:
                radial-gradient(120% 78% at 50% 62%, rgba(126, 225, 255, 0.08) 0%, rgba(0, 0, 0, 0) 58%),
                linear-gradient(180deg, rgba(2, 21, 42, 0.06) 0%, rgba(8, 19, 16, 0.03) 40%, rgba(5, 24, 15, 0.1) 100%);
        }

        #startup-fade-overlay {
            position: fixed;
            inset: 0;
            z-index: 120;
            pointer-events: none;
            background: #000;
            opacity: 1;
            visibility: visible;
            transition: opacity 780ms ease-out, visibility 0s linear 780ms;
            will-change: opacity;
        }

        #startup-fade-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 60;
            box-sizing: border-box;
            max-width: 100vw;
            padding: calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 14px calc(14px + env(safe-area-inset-left));
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
            pointer-events: none;
        }

        #mystery-hanging-sign-layer {
            position: fixed;
            inset: 0;
            z-index: 38;
            pointer-events: none;
            overflow: hidden;
            --mystery-rope-width: clamp(1.18px, calc(0.21vw / 1.5), 2.2px);
            --mystery-sign-width: clamp(182px, calc(31vw / 1.5), 300px);
            --mystery-sign-height: clamp(144px, calc(25.5vw / 1.5), 242px);
            --mystery-knot-width: clamp(11px, calc(2.05vw / 1.5), 18px);
            --mystery-knot-height: clamp(9px, calc(1.72vw / 1.5), 15px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 320ms ease-out;
        }

        #mystery-hanging-sign-layer.is-ready {
            opacity: 1;
            visibility: visible;
        }

        @media (prefers-reduced-motion: reduce) {
            #startup-fade-overlay {
                transition: opacity 120ms linear, visibility 0s linear 120ms;
            }

            #mystery-hanging-sign-layer {
                transition: none;
            }
        }

        #mystery-hanging-sign-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
        }

        #mystery-hanging-sign-string {
            fill: none;
            stroke: #dfcda4;
            stroke-width: var(--mystery-rope-width);
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.96;
            filter:
                drop-shadow(0 0 1px rgba(0, 0, 0, 0.85))
                drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5))
                drop-shadow(0 5px 9px rgba(0, 0, 0, 0.24));
        }

        #mystery-hanging-sign-anchor {
            fill: #d8c79b;
            stroke: rgba(70, 44, 16, 0.72);
            stroke-width: 1.2px;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.38));
        }

        #mystery-sign-knot {
            position: absolute;
            left: 0;
            top: 0;
            width: var(--mystery-knot-width);
            height: var(--mystery-knot-height);
            transform-origin: 50% 14%;
            pointer-events: none;
            will-change: transform, left, top;
            z-index: 1;
            filter:
                drop-shadow(0 1px 0 rgba(0, 0, 0, 0.44))
                drop-shadow(0 3px 4px rgba(0, 0, 0, 0.28));
        }

        #mystery-sign-knot::before,
        #mystery-sign-knot::after {
            content: "";
            position: absolute;
            top: 31%;
            width: 61%;
            height: 63%;
            border: clamp(1.2px, 0.15vw, 2px) solid rgba(196, 166, 122, 0.96);
            border-top-color: rgba(240, 226, 193, 0.97);
            border-right-color: rgba(176, 136, 90, 0.95);
            border-radius: 999px;
            background:
                radial-gradient(130% 110% at 36% 28%, rgba(255, 242, 209, 0.84) 0%, rgba(255, 242, 209, 0) 64%),
                linear-gradient(160deg, rgba(232, 207, 162, 0.96) 0%, rgba(193, 158, 113, 0.96) 100%);
            box-shadow:
                inset 0 1px 1px rgba(255, 246, 222, 0.7),
                inset 0 -2px 3px rgba(123, 86, 48, 0.3);
        }

        #mystery-sign-knot::before {
            left: -8%;
            transform: rotate(35deg);
        }

        #mystery-sign-knot::after {
            right: -8%;
            transform: rotate(-35deg);
        }

        #mystery-sign-knot .knot-core {
            position: absolute;
            left: 50%;
            top: 47%;
            width: 42%;
            height: 56%;
            transform: translate(-50%, -50%) rotate(45deg);
            border-radius: 4px;
            border: clamp(1px, 0.12vw, 1.8px) solid rgba(140, 102, 61, 0.8);
            background:
                radial-gradient(145% 130% at 28% 23%, rgba(255, 245, 219, 0.88) 0%, rgba(255, 245, 219, 0) 62%),
                linear-gradient(150deg, rgba(225, 196, 151, 0.96) 0%, rgba(182, 142, 96, 0.98) 100%);
            box-shadow:
                inset 0 1px 1px rgba(255, 247, 226, 0.64),
                inset 0 -2px 3px rgba(108, 74, 41, 0.28);
        }

        #mystery-sign-knot .knot-tail {
            position: absolute;
            left: 50%;
            top: 52%;
            width: calc(var(--mystery-rope-width) * 1.12);
            height: clamp(8px, 1vw, 13px);
            transform: translateX(-50%);
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(234, 214, 180, 0.98) 0%, rgba(178, 142, 96, 0.96) 100%);
            box-shadow:
                inset 0 1px 1px rgba(255, 247, 229, 0.6),
                0 1px 1px rgba(0, 0, 0, 0.24);
        }

        #mystery-scroll-sign {
            position: absolute;
            left: 0;
            top: 0;
            width: var(--mystery-sign-width);
            height: var(--mystery-sign-height);
            box-sizing: border-box;
            transform-origin: 50% 0%;
            touch-action: none;
            will-change: transform, left, top;
            overflow: visible;
            z-index: 4;
            pointer-events: auto;
            cursor: grab;
            filter: none;
            transition: filter 180ms ease;
            isolation: isolate;
        }

        #mystery-scroll-sign:active {
            cursor: grabbing;
            filter: none;
        }

        #mystery-sign-knot {
            pointer-events: none;
        }

        #mystery-scroll-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
            filter: none;
            z-index: 1;
        }

        #mystery-scroll-sign .scroll-text {
            position: relative;
            z-index: 5;
            left: 50%;
            top: 38%;
            width: 62%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(2px, 0.35vw, 5px);
            pointer-events: none;
            opacity: 1;
            visibility: visible;
        }

        #mystery-scroll-sign .scroll-chevron-row {
            position: absolute;
            left: 50%;
            bottom: clamp(14px, calc(var(--mystery-sign-height) * 0.11), 25px);
            width: clamp(58px, calc(var(--mystery-sign-width) * 0.48), 126px);
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 3;
            pointer-events: none;
        }

        #mystery-scroll-sign .scroll-chevron {
            width: clamp(16px, calc(var(--mystery-sign-width) * 0.13), 30px);
            height: auto;
            display: block;
            overflow: visible;
            filter: none;
        }

        #mystery-scroll-sign .scroll-chevron .chevron-main {
            fill: none;
            stroke: rgba(5, 20, 74, 0.98);
            stroke-width: 2.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #mystery-scroll-sign .scroll-chevron .chevron-glow {
            fill: none;
            stroke: rgba(77, 165, 255, 0.76);
            stroke-width: 1.35;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #mystery-scroll-sign .line-top,
        #mystery-scroll-sign .line-bottom {
            width: 100%;
            text-align: center;
            letter-spacing: 0.024em;
            line-height: 1.02;
            white-space: nowrap;
            font-family: var(--hud-font);
            text-shadow:
                0 1px 0 rgba(255, 242, 208, 0.65),
                0 0 4px rgba(255, 221, 126, 0.2),
                0 2px 4px rgba(40, 20, 6, 0.4);
            position: relative;
            z-index: 6;
            opacity: 1;
            visibility: visible;
        }

        #mystery-scroll-sign .line-top {
            font-size: clamp(16px, calc(var(--mystery-sign-width) * 0.178), 32px);
            font-weight: 700;
            color: #4b2b10;
            text-shadow:
                0 0 3px rgba(255, 215, 92, 0.18),
                0 1px 0 rgba(255, 242, 208, 0.65),
                0 2px 4px rgba(40, 20, 6, 0.4);
        }

        #mystery-scroll-sign .line-bottom {
            font-size: clamp(12px, calc(var(--mystery-sign-width) * 0.134), 24px);
            font-weight: 600;
            color: #5d3515;
            transform: translateY(-2px);
            text-shadow:
                0 0 2px rgba(255, 220, 120, 0.16),
                0 1px 0 rgba(255, 242, 208, 0.58),
                0 2px 4px rgba(40, 20, 6, 0.4);
        }

        .hud-box,
        .hud-btn,
        .store-panel,
        .prop-preview-panel {
            pointer-events: auto;
            box-sizing: border-box;
            border: 1px solid var(--hud-border);
            border-radius: var(--app-panel-radius);
            box-shadow: var(--panel-shadow);
            position: relative;
        }

        .hud-box {
            background: linear-gradient(165deg, rgba(30, 41, 59, 0.98), rgba(15, 23, 42, 0.9) 56%, rgba(8, 19, 39, 0.94));
            color: var(--hud-text);
            font-family: var(--hud-font);
            font-size: clamp(16px, 1.35vw, 22px);
            font-weight: 700;
            letter-spacing: 0.04em;
            padding: 10px 16px;
            min-width: clamp(120px, 18vw, 170px);
            text-align: center;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--app-panel-radius);
            border: 1px solid rgba(125, 211, 252, 0.35);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.44), inset 0 1px 0 rgba(255, 255, 255, 0.16), inset 0 -1px 0 rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(125, 211, 252, 0.2);
            position: relative;
        }

        .hud-box::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(100deg, rgba(125, 211, 252, 0.16), rgba(125, 211, 252, 0));
            opacity: 0.8;
        }

        #score-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.3ch;
            position: relative;
            z-index: 65;
            min-width: clamp(142px, 18.5vw, 214px);
            padding: clamp(10px, 1.1vw, 14px) clamp(14px, 1.45vw, 20px);
            border-radius: 18px;
            border-color: rgba(251, 191, 36, 0.52);
            font-family: var(--btn-font);
            font-size: clamp(18px, 1.55vw, 26px);
            font-weight: 700;
            letter-spacing: 0.055em;
            text-transform: uppercase;
            color: #fff2bf;
            text-shadow:
                0 1px 0 rgba(255, 248, 220, 0.7),
                0 3px 10px rgba(0, 0, 0, 0.5);
            background-image:
                linear-gradient(112deg, rgba(255, 255, 255, 0) 37%, rgba(255, 255, 255, 0.28) 49%, rgba(255, 255, 255, 0) 61%),
                radial-gradient(130% 180% at 8% 12%, rgba(125, 211, 252, 0.34) 0%, rgba(125, 211, 252, 0) 44%),
                radial-gradient(120% 190% at 95% 10%, rgba(251, 191, 36, 0.28) 0%, rgba(251, 191, 36, 0) 46%),
                linear-gradient(160deg, rgba(30, 41, 59, 0.98), rgba(17, 24, 39, 0.96) 56%, rgba(10, 18, 34, 0.98));
            background-size: 250% 100%, 100% 100%, 100% 100%, 100% 100%;
            background-position: 210% 0, 0 0, 0 0, 0 0;
            box-shadow: none;
            animation: scoreBoxShimmer 5.6s ease-in-out infinite, scoreBoxGlow 3.6s ease-in-out infinite;
        }

        #score-box::before {
            content: "✦";
            display: inline-block;
            margin-right: 0.18ch;
            color: #fcd34d;
            font-size: 0.72em;
            text-shadow:
                0 0 8px rgba(252, 211, 77, 0.72),
                0 1px 3px rgba(0, 0, 0, 0.5);
        }

        #score-box::after {
            content: none;
        }

        @keyframes scoreBoxShimmer {
            0%,
            72%,
            100% {
                background-position: 210% 0, 0 0, 0 0, 0 0;
            }
            88% {
                background-position: -120% 0, 0 0, 0 0, 0 0;
            }
        }

        @keyframes scoreBoxGlow {
            0%,
            100% {
                filter: saturate(1) brightness(1);
            }
            50% {
                filter: saturate(1.08) brightness(1.05);
            }
        }

        .hud-btn {
            background: var(--btn-bg);
            color: var(--hud-text);
            font-family: var(--btn-font);
            font-size: clamp(12px, 1.1vw, 15px);
            font-weight: var(--app-btn-font-weight);
            line-height: 1.1;
            padding: 11px 16px;
            min-width: clamp(132px, 18vw, 176px);
            min-height: 43px;
            cursor: pointer;
            transition: transform 180ms cubic-bezier(0.34, 1.56, 0.64, 1), filter 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
            text-transform: none;
            letter-spacing: 0.02em;
            justify-content: center;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            border: 1px solid var(--btn-border);
            overflow: hidden;
            border-radius: var(--app-btn-radius);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .hud-btn .btn-icon {
            font-size: 15px;
            text-shadow: 0 0 9px rgba(125, 241, 255, 0.7);
        }

        .hud-btn::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0));
            opacity: 0.12;
            pointer-events: none;
            transition: opacity 180ms ease;
        }

        .hud-btn::after {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: inherit;
            border: 1px solid rgba(255, 255, 255, 0.12);
            pointer-events: none;
        }

        .prop-preview-overlay {
            position: fixed;
            inset: 0;
            opacity: 0;
            pointer-events: none;
            z-index: 45;
            transition: opacity 170ms ease;
            overflow: hidden;
        }

        .prop-preview-overlay::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(14, 31, 61, 0.18);
            pointer-events: none;
            opacity: 0;
            transition: opacity 170ms ease;
        }

        .prop-preview-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .prop-preview-overlay.open::before {
            opacity: 1;
        }

        @supports not (backdrop-filter: blur(1px)) {
            .prop-preview-overlay {
                background: rgba(14, 31, 61, 0.32);
            }

            .prop-preview-overlay::before {
                background: rgba(14, 31, 61, 0.32);
                opacity: 0;
            }

            .prop-preview-overlay.open::before {
                opacity: 1;
            }
        }

        .hud-btn:hover,
        .hud-btn:focus-visible {
            background: var(--btn-hover);
            transform: translateY(var(--app-btn-lift));
            outline: none;
            box-shadow: 0 12px 24px rgba(79, 70, 229, 0.38);
            border-color: rgba(165, 180, 252, 0.84);
        }

        .hud-btn:hover::before,
        .hud-btn:focus-visible::before {
            opacity: 0.32;
        }

        .inventory-icon-btn {
            width: clamp(84px, 11vw, 116px);
            height: clamp(84px, 11vw, 116px);
            padding: 0;
            border: 0;
            border-radius: 14px;
            background: transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 60;
            transition: transform 160ms ease, filter 160ms ease;
            pointer-events: auto;
            isolation: isolate;
            outline: none;
            box-shadow: none;
            -webkit-tap-highlight-color: transparent;
        }

        .inventory-icon-btn::before {
            content: "";
            position: absolute;
            left: 14%;
            right: 14%;
            bottom: 12%;
            height: 28%;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.24) 0%, rgba(0, 0, 0, 0.05) 70%, rgba(0, 0, 0, 0) 100%);
            filter: blur(6px);
            transform: translateY(7px);
            pointer-events: none;
            z-index: 0;
            display: none;
        }

        .inventory-icon-btn img {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transform: scale(1.08);
            transform-origin: center;
            filter: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        .inventory-icon-btn:hover,
        .inventory-icon-btn:focus-visible {
            transform: translateY(-2px) scale(1.03);
            filter: saturate(1.07) brightness(1.05);
            outline: none;
            box-shadow: none;
        }

        .inventory-icon-btn:focus,
        .inventory-icon-btn:focus-visible {
            outline: none;
            box-shadow: none;
        }

        .inventory-icon-btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* Prevent any square focus/hover frame around the inventory icon button. */
        .inventory-icon-btn,
        .inventory-icon-btn:hover,
        .inventory-icon-btn:focus,
        .inventory-icon-btn:focus-visible,
        .inventory-icon-btn:active {
            outline: none !important;
            box-shadow: none !important;
        }

        .inventory-icon-btn::-moz-focus-inner {
            border: 0;
        }

        .store-panel {
            width: min(360px, 86vw);
            background: var(--hud-panel-bg);
            color: var(--hud-text);
            padding: 14px;
            display: none;
            gap: 8px;
            max-height: min(70vh, 500px);
            overflow: hidden;
            grid-template-columns: 1fr;
            animation: panelRevealEdge 160ms cubic-bezier(0.19, 1, 0.22, 1) forwards;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .store-panel {
            max-height: min(70vh, 500px);
        }

        .store-panel.open {
            display: grid;
        }

        .store-title {
            margin: 2px 0 4px;

        /* Reworked inventory frame: structured regions with an open central showcase around the creature. */
        .inventory-panel {
            --inventory-anchor-x: 50vw;
            --inventory-anchor-y: 50vh;
            --inventory-panel-top: 0px;
            --inventory-panel-width: min(90vw, 368px);
            --inventory-panel-height: min(84vh, 730px);
            --inventory-bottom-clearance: calc(var(--inventory-safe-area-bottom) + 84px);
            --inventory-portrait-base-lift: clamp(14px, 2.4vh, 22px);
            --inventory-bottom-safe-lift: 0px;
            --inventory-panel-edge-gap: clamp(10px, 1.7vh, 18px);
            --inventory-shell-inset-top: clamp(64px, 16%, 108px);
            --inventory-shell-inset-side: clamp(9px, 2.4vw, 14px);
            --inventory-shell-inset-bottom: clamp(10px, 2.4vh, 16px);
            --inventory-shell-gap: clamp(8px, 1.7vh, 14px);
            --inventory-showcase-min-height: clamp(140px, 37%, 310px);
            --inventory-slot-radius: 8px;
            --inventory-slot-border-width: 1px;
            --inventory-slot-gap: clamp(4px, 0.95vw, 6px);
            --inventory-slot-list-padding: clamp(3px, 0.8vw, 4px);
            --inventory-slot-inner-radius: calc(var(--inventory-slot-radius) - 2px);
            position: fixed;
            left: var(--inventory-anchor-x);
            top: var(--inventory-anchor-y);
            right: auto;
            bottom: auto;
            transform: translate(-50%, -50%);
            width: var(--inventory-panel-width);
            height: var(--inventory-panel-height);
            max-width: calc(100vw - (var(--inventory-panel-edge-gap) * 2));
            max-height: calc(100vh - var(--inventory-bottom-clearance) - (var(--inventory-panel-edge-gap) * 2));
            min-height: 0;
            padding: 0;
            border: 0;
            background: transparent;
            box-shadow: none;
            overflow: visible;
            pointer-events: none;
            isolation: isolate;
            z-index: 58;
            display: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            transition: none;
        }

        .inventory-panel.open {
            display: block;
            animation: none;
        }

        .inventory-panel>* {
            position: relative;
            z-index: 2;
            pointer-events: auto;
        }

        .inventory-hanger {
            position: absolute;
            left: 50%;
            top: calc(-1 * var(--inventory-panel-top));
            width: 3px;
            height: calc(var(--inventory-panel-top) + clamp(78px, 12.5vh, 122px));
            transform: translateX(-50%);
            border-radius: 999px;
            background:
                linear-gradient(180deg, rgba(255, 239, 201, 0.98), rgba(206, 146, 74, 0.95) 42%, rgba(107, 68, 30, 0.98));
            box-shadow:
                0 2px 0 rgba(255, 243, 214, 0.6),
                0 8px 14px rgba(0, 0, 0, 0.34);
            pointer-events: none;
            z-index: 1;
        }

        .inventory-hanger::before {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -11px;
            width: clamp(14px, 4.4vw, 18px);
            height: clamp(14px, 4.4vw, 18px);
            transform: translateX(-50%) rotate(45deg);
            border-radius: 4px;
            border: 1px solid rgba(229, 177, 88, 0.95);
            background:
                radial-gradient(circle at 36% 34%, rgba(214, 241, 255, 0.98), rgba(109, 177, 255, 0.92) 56%, rgba(61, 106, 205, 0.98) 100%);
            box-shadow:
                0 3px 8px rgba(0, 0, 0, 0.28),
                0 0 12px rgba(98, 190, 255, 0.5);
        }

        .inventory-frame-shell {
            --inventory-shell-rail-width: clamp(10px, 2.6vw, 12px);
            position: absolute;
            inset: var(--inventory-shell-inset-top) var(--inventory-shell-inset-side) var(--inventory-shell-inset-bottom);
            border-radius: clamp(20px, 5vw, 26px);
            border: clamp(3px, 0.9vw, 5px) solid rgba(189, 140, 60, 0.96);
            background:
                linear-gradient(90deg,
                    rgba(143, 98, 48, 0.98) 0 var(--inventory-shell-rail-width),
                    rgba(0, 0, 0, 0) var(--inventory-shell-rail-width) calc(100% - var(--inventory-shell-rail-width)),
                    rgba(143, 98, 48, 0.98) calc(100% - var(--inventory-shell-rail-width)) 100%),
                linear-gradient(180deg,
                    rgba(157, 111, 57, 0.98) 0 clamp(12px, 3vw, 14px),
                    rgba(0, 0, 0, 0) clamp(12px, 3vw, 14px) calc(100% - clamp(12px, 3vw, 14px)),
                    rgba(98, 62, 29, 0.98) calc(100% - clamp(12px, 3vw, 14px)) 100%);
            box-shadow:
                0 18px 34px rgba(0, 0, 0, 0.48),
                inset 0 1px 0 rgba(255, 232, 166, 0.45),
                inset 0 0 0 1px rgba(83, 52, 21, 0.72);
            display: grid;
            grid-template-rows: auto minmax(var(--inventory-showcase-min-height), 1fr) auto;
            grid-template-areas:
                "header"
                "showcase"
                "slots";
            row-gap: 0;
            padding: clamp(10px, 2.2vw, 14px);
            pointer-events: auto;
            overflow: visible;
            box-sizing: border-box;
        }

        .inventory-fill-layers::before {
            content: "";
            position: absolute;

        .inventory-focus-overlay {
            --inventory-focus-hole-top: 0px;
            --inventory-focus-hole-right: 0px;
            --inventory-focus-hole-bottom: 0px;
            --inventory-focus-hole-left: 0px;
            --inventory-focus-hole-inset: clamp(10px, 1.2vw, 14px);
            --inventory-focus-top-drop: clamp(96px, 22vh, 190px);
            --inventory-focus-band-alpha: 0.56;
            position: fixed;
            inset: 0;
            z-index: 56;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 180ms ease, visibility 0ms linear 180ms;
        }

        .inventory-focus-band {
            position: absolute;
            background: rgba(4, 9, 20, var(--inventory-focus-band-alpha));
            backdrop-filter: blur(9px) saturate(0.92);
            -webkit-backdrop-filter: blur(9px) saturate(0.92);
            pointer-events: none;
        }

        .inventory-focus-band.top {
            inset: 0 0 calc(100% - (var(--inventory-focus-hole-top) + var(--inventory-focus-hole-inset) + var(--inventory-focus-top-drop))) 0;
        }

        .inventory-focus-band.right {
            inset:
                calc(var(--inventory-focus-hole-top) + var(--inventory-focus-hole-inset) + var(--inventory-focus-top-drop))
                0
                calc(100% - (var(--inventory-focus-hole-bottom) - var(--inventory-focus-hole-inset)))
                calc(var(--inventory-focus-hole-right) - var(--inventory-focus-hole-inset));
        }

        .inventory-focus-band.bottom {
            inset: calc(var(--inventory-focus-hole-bottom) - var(--inventory-focus-hole-inset)) 0 0 0;
        }

        .inventory-focus-band.left {
            inset:
                calc(var(--inventory-focus-hole-top) + var(--inventory-focus-hole-inset) + var(--inventory-focus-top-drop))
                calc(100% - (var(--inventory-focus-hole-left) + var(--inventory-focus-hole-inset)))
                calc(100% - (var(--inventory-focus-hole-bottom) - var(--inventory-focus-hole-inset)))

    <div class="prop-preview-overlay" id="prop-preview-overlay" aria-hidden="true"></div>

    <script type="module">
        import * as THREE from 'three';
        import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
        let createLegacyInventoryAndPropDefinitions = null;
        if (window.location.protocol === 'file:') {
            createLegacyInventoryAndPropDefinitions = createLegacyInventoryAndPropDefinitionsFileFallback;
        } else {
            try {
                const adapterModule = await import('./src/compat/legacy-prop-definitions-adapter.js');
                createLegacyInventoryAndPropDefinitions = adapterModule.createLegacyInventoryAndPropDefinitions;
            } catch (error) {
                console.warn('Unable to load catalog adapter module. Falling back to inline adapter.', error);
                createLegacyInventoryAndPropDefinitions = createLegacyInventoryAndPropDefinitionsFileFallback;
            }
        }

        // --- CONSTANTS ---
        const SVG_DATA = {
            viewBox: { x: 0, y: 0, w: 200, h: 200 },
            body: { cx: 100, cy: 100, r: 28 },
            wingRight: "M110,90 Q170,40 200,70 Q160,120 115,100",
            wingLeft: "M90,90 Q30,40 0,70 Q40,120 85,100"
        };
        const SCALE = 0.1;
        const EQUIP_GLOW_PULSE_DURATION_SEC = 2.2;
        const EQUIP_PROP_REVEAL_AT_PEAK_PROGRESS = 0.5;
        const EQUIP_PROP_REVEAL_RAMP_DURATION_SEC = 0.34;
        const EQUIP_PROP_REVEAL_START_SCALE = 0.84;

        // --- SCENE SETUP ---
        const container = document.getElementById('game-container');
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const equipGlowOverlayGroup = new THREE.Group();
        equipGlowOverlayGroup.renderOrder = 8;
        scene.add(equipGlowOverlayGroup);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 140);
        camera.position.set(0, 1.2, 20);
        const raycaster = new THREE.Raycaster();
        const pointerNdc = new THREE.Vector2();

        // --- LIGHTING (Daylight palette inspired by reference) ---
        const ambientLight = new THREE.AmbientLight(0xe4ffe0, 0.9);
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0x8fd0ff, 0x6ca245, 1.2);
        scene.add(hemiLight);

        const sunLight = new THREE.DirectionalLight(0xfff6d3, 2.1);
        sunLight.position.set(20, 26, 10);
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0xe6ffd1, 0.65);
        fillLight.position.set(-16, 10, 8);
        scene.add(fillLight);

        const petRim = new THREE.PointLight(0x9de8ff, 8, 55);
        petRim.position.set(0, 2, -8);
        scene.add(petRim);

        // --- BACKGROUND WORLD ---
        const worldGroup = new THREE.Group();
        scene.add(worldGroup);

        function createSkyDome() {
            const geometry = new THREE.SphereGeometry(90, 40, 28);
            const material = new THREE.ShaderMaterial({
                side: THREE.BackSide,
                uniforms: {
                    topColor: { value: new THREE.Color(0x4da4ff) },
                    midColor: { value: new THREE.Color(0x9cdaff) },
                    bottomColor: { value: new THREE.Color(0xd8f4ff) }
                },
                vertexShader: `
                    varying vec3 vWorldPosition;
                    void main() {
                        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                        vWorldPosition = worldPosition.xyz;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec3 vWorldPosition;
                    uniform vec3 topColor;
                    uniform vec3 midColor;
                    uniform vec3 bottomColor;
                    void main() {
                        float h = normalize(vWorldPosition + vec3(0.0, 28.0, 0.0)).y;
                        vec3 colorA = mix(bottomColor, midColor, smoothstep(-0.25, 0.3, h));
                        vec3 colorB = mix(midColor, topColor, smoothstep(0.15, 0.9, h));
                        vec3 finalColor = mix(colorA, colorB, smoothstep(0.0, 1.0, h));
                        gl_FragColor = vec4(finalColor, 1.0);
                    }
                `
            });
            const dome = new THREE.Mesh(geometry, material);
            dome.position.y = 4;
            return dome;
        }
        worldGroup.add(createSkyDome());

        function createSunSprite() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            const g = ctx.createRadialGradient(256, 256, 12, 256, 256, 250);
            g.addColorStop(0, 'rgba(255,255,230,1)');
            g.addColorStop(0.2, 'rgba(255,244,200,0.9)');
            g.addColorStop(0.45, 'rgba(255,240,190,0.35)');
            g.addColorStop(1, 'rgba(255,220,170,0)');

            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 512, 512);

            const tex = new THREE.CanvasTexture(canvas);
            const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
            const sprite = new THREE.Sprite(mat);
            sprite.position.set(18, 20, -36);
            sprite.scale.set(11.5, 11.5, 1);
            return sprite;
        }
        const sunSprite = createSunSprite();
        worldGroup.add(sunSprite);

        function createCloudTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            for (let i = 0; i < 22; i++) {
                const x = Math.random() * canvas.width;
                const y = 90 + Math.random() * 320;
                const r = 45 + Math.random() * 80;
                const alpha = 0.12 + Math.random() * 0.18;
                const grad = ctx.createRadialGradient(x, y, r * 0.2, x, y, r);
                grad.addColorStop(0, `rgba(255,255,255,${alpha})`);
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.needsUpdate = true;
            return tex;
        }

        const cloudTexture = createCloudTexture();
        const cloudPlanes = [];
        for (let i = 0; i < 6; i++) {
            const cloud = new THREE.Mesh(
                new THREE.PlaneGeometry(16 + Math.random() * 10, 7 + Math.random() * 4),
                new THREE.MeshBasicMaterial({ map: cloudTexture, transparent: true, depthWrite: false, opacity: 0.68 })
            );
            cloud.position.set(-20 + i * 8 + Math.random() * 3, 12 + Math.random() * 4, -42 - i * 1.2);
            cloud.rotation.y = 0.06;
            worldGroup.add(cloud);
            cloudPlanes.push({ mesh: cloud, speed: 0.06 + Math.random() * 0.04 });
        }

        function createGroundTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            const gradient = ctx.createLinearGradient(0, 0, 0, 1024);
            gradient.addColorStop(0, '#9fd05c');
            gradient.addColorStop(0.5, '#85bf4d');
            gradient.addColorStop(1, '#6ca53c');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 1024, 1024);

            for (let i = 0; i < 1800; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 1024;
                const s = 1 + Math.random() * 3;
                ctx.fillStyle = Math.random() > 0.5 ? 'rgba(175,220,100,0.3)' : 'rgba(95,145,50,0.35)';
                ctx.fillRect(x, y, s, s);
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(6, 5);
            return tex;
        }

        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(86, 50, 1, 1),
            new THREE.MeshStandardMaterial({ map: createGroundTexture(), roughness: 0.9, metalness: 0.0 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.set(0, -3.1, -16);
        worldGroup.add(ground);

        function createBuilding() {
            const building = new THREE.Group();

            const main = new THREE.Mesh(
                new THREE.BoxGeometry(15, 4.5, 3.2),
                new THREE.MeshStandardMaterial({ color: 0xe9e4d8, roughness: 0.85 })
            );
            main.position.set(0, 0, 0);
            building.add(main);

            const center = new THREE.Mesh(
                new THREE.BoxGeometry(3.4, 5.4, 3.7),
                new THREE.MeshStandardMaterial({ color: 0xf0e8d8, roughness: 0.8 })
            );
            center.position.set(0, 0.45, 0.25);
            building.add(center);

            const roof = new THREE.Mesh(
                new THREE.ConeGeometry(2.8, 1.3, 4),
                new THREE.MeshStandardMaterial({ color: 0x9f8469, roughness: 0.75 })
            );
            roof.position.set(0, 3.7, 0.28);
            roof.rotation.y = Math.PI * 0.25;
            building.add(roof);

            for (let i = -6; i <= 6; i += 2.2) {
                const windowPane = new THREE.Mesh(
                    new THREE.PlaneGeometry(1.1, 0.75),
                    new THREE.MeshBasicMaterial({ color: 0x8cb9df, transparent: true, opacity: 0.8 })
                );
                windowPane.position.set(i, 0.8, 1.63);
                building.add(windowPane);
            }

            const path = new THREE.Mesh(
                new THREE.PlaneGeometry(4, 22),
                new THREE.MeshStandardMaterial({ color: 0xd8d2c8, roughness: 0.9 })
            );
            path.rotation.x = -Math.PI / 2;
            path.position.set(0, -2.22, 9);
            building.add(path);

            building.scale.set(1.08, 1.08, 1.08);
            building.position.set(0, -0.1, -30);
            return building;
        }
        worldGroup.add(createBuilding());

        function createTree() {
            const tree = new THREE.Group();

            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.2, 0.28, 3.5, 8),
                new THREE.MeshStandardMaterial({ color: 0x6c4b2c, roughness: 0.95 })
            );
            trunk.position.y = 1.7;
            tree.add(trunk);

            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x71b63d, roughness: 0.9 });
            const leaf1 = new THREE.Mesh(new THREE.SphereGeometry(1.25, 12, 10), leavesMat);
            const leaf2 = new THREE.Mesh(new THREE.SphereGeometry(1.15, 12, 10), leavesMat);
            const leaf3 = new THREE.Mesh(new THREE.SphereGeometry(1.0, 12, 10), leavesMat);
            leaf1.position.set(0, 3.9, 0);
            leaf2.position.set(-0.6, 3.5, 0.4);
            leaf3.position.set(0.55, 3.35, -0.25);
            tree.add(leaf1, leaf2, leaf3);

            return tree;
        }

        const treeGroup = new THREE.Group();
        worldGroup.add(treeGroup);
        const treeInstances = [];
        for (let i = 0; i < 22; i++) {
            const tree = createTree();
            const side = Math.random() > 0.5 ? 1 : -1;
            const x = side * (10 + Math.random() * 22);
            const z = -12 - Math.random() * 28;
            const s = 0.9 + Math.random() * 0.8;
            tree.position.set(x, -2.2, z);
            tree.scale.set(s, s, s);
            treeGroup.add(tree);
            treeInstances.push({
                tree,
                phase: Math.random() * Math.PI * 2,
                sway: 0.01 + Math.random() * 0.01
            });
        }

        // Moving grass blades
        const grassGroup = new THREE.Group();
        scene.add(grassGroup);
        const grassBladeGeometry = new THREE.PlaneGeometry(0.08, 0.9, 1, 4);
        grassBladeGeometry.translate(0, 0.45, 0);
        const grassMaterial = new THREE.MeshStandardMaterial({
            color: 0x5ea93f,
            roughness: 0.9,
            metalness: 0,
            side: THREE.DoubleSide
        });

        const grassBlades = [];
        for (let i = 0; i < 900; i++) {
            const blade = new THREE.Mesh(grassBladeGeometry, grassMaterial);
            const x = (Math.random() - 0.5) * 28;
            const z = -4 - Math.random() * 24;
            const y = -2.95 + (Math.random() - 0.5) * 0.08;
            blade.position.set(x, y, z);
            blade.scale.set(0.8 + Math.random() * 1.3, 0.7 + Math.random() * 1.5, 1);
            blade.rotation.y = Math.random() * Math.PI;
            grassGroup.add(blade);
            grassBlades.push({
                blade,
                phase: Math.random() * Math.PI * 2,
                speed: 0.8 + Math.random() * 1.1,
                sway: 0.08 + Math.random() * 0.06
            });
        }

        // Floating pollen / tiny light particles
        const pollenGeometry = new THREE.BufferGeometry();
        const pollenCount = 240;
        const pollenPos = new Float32Array(pollenCount * 3);
        for (let i = 0; i < pollenCount; i++) {
            pollenPos[i * 3] = (Math.random() - 0.5) * 30;
            pollenPos[i * 3 + 1] = -1 + Math.random() * 15;
            pollenPos[i * 3 + 2] = -5 - Math.random() * 36;
        }
        pollenGeometry.setAttribute('position', new THREE.BufferAttribute(pollenPos, 3));
        const pollenDotTexture = (() => {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 2, 32, 32, 30);
            grad.addColorStop(0.0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.45, 'rgba(255,255,255,0.95)');
            grad.addColorStop(0.85, 'rgba(255,255,255,0.12)');
            grad.addColorStop(1.0, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);
            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.needsUpdate = true;
            return tex;
        })();
        const pollenMaterial = new THREE.PointsMaterial({
            color: 0xfff8d8,
            map: pollenDotTexture,
            alphaMap: pollenDotTexture,
            size: 0.05,
            sizeAttenuation: true,
            transparent: true,
            alphaTest: 0.12,
            opacity: 0.55,
            depthWrite: false
        });
        const pollen = new THREE.Points(pollenGeometry, pollenMaterial);
        scene.add(pollen);

        function createSoftHaloSprite({ size = 10, inner = 'rgba(75, 225, 255, 0.42)', mid = 'rgba(65, 180, 255, 0.2)', outer = 'rgba(20, 90, 180, 0)' } = {}) {
            const glowCanvas = document.createElement('canvas');
            glowCanvas.width = 512;
            glowCanvas.height = 512;
            const ctx = glowCanvas.getContext('2d');

            const g = ctx.createRadialGradient(256, 256, 20, 256, 256, 256);
            g.addColorStop(0.0, inner);
            g.addColorStop(0.45, mid);
            g.addColorStop(1.0, outer);

            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 512, 512);

            const tex = new THREE.CanvasTexture(glowCanvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            const mat = new THREE.SpriteMaterial({
                map: tex,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(size, size, 1);
            return sprite;
        }

        // --- CREATURE OBJECTS ---
        const stuntRig = new THREE.Group();
        scene.add(stuntRig);
        const creatureGroup = new THREE.Group();
        const BASE_CREATURE_SCALE = 0.45;
        creatureGroup.scale.setScalar(BASE_CREATURE_SCALE);
        stuntRig.add(creatureGroup);

        const geometryBody = new THREE.SphereGeometry(SVG_DATA.body.r * SCALE, 64, 64);
        const materialBody = new THREE.MeshPhysicalMaterial({
            color: 0x4b2aa8,

            metalness: 0.03,
            clearcoat: 0.32,

        });
        const bodyMesh = new THREE.Mesh(geometryBody, materialBody);
        bodyMesh.userData = bodyMesh.userData || {};
        bodyMesh.userData.previewRole = 'body';
        creatureGroup.add(bodyMesh);

        const haloCore = createSoftHaloSprite({
            size: 11,
            inner: 'rgba(90, 236, 255, 0.42)',
            mid: 'rgba(60, 176, 255, 0.2)',
            outer: 'rgba(14, 70, 170, 0.0)'
        });
        haloCore.position.set(0, 0.2, -2.0);
        creatureGroup.add(haloCore);

        const haloWide = createSoftHaloSprite({
            size: 16,
            inner: 'rgba(52, 160, 255, 0.12)',
            mid: 'rgba(32, 118, 230, 0.08)',
            outer: 'rgba(8, 44, 130, 0.0)'
        });
        haloWide.position.set(0, 0.15, -2.4);
        creatureGroup.add(haloWide);

        const equipGlowCharacterCore = createSoftHaloSprite({
            size: 10.8,
            inner: 'rgba(255, 243, 182, 0.82)',
            mid: 'rgba(120, 224, 255, 0.42)',
            outer: 'rgba(36, 118, 220, 0.0)'
        });
        equipGlowCharacterCore.position.set(0, 0.28, -1.65);
        equipGlowCharacterCore.material.opacity = 0;
        equipGlowCharacterCore.material.depthTest = false;
        equipGlowCharacterCore.visible = false;
        equipGlowCharacterCore.renderOrder = 9;
        equipGlowCharacterCore.userData.baseScale = equipGlowCharacterCore.scale.x;
        creatureGroup.add(equipGlowCharacterCore);

        const equipGlowCharacterWide = createSoftHaloSprite({
            size: 17.8,
            inner: 'rgba(163, 238, 255, 0.36)',
            mid: 'rgba(108, 168, 255, 0.22)',
            outer: 'rgba(20, 84, 210, 0.0)'
        });
        equipGlowCharacterWide.position.set(0, 0.2, -2.45);
        equipGlowCharacterWide.material.opacity = 0;
        equipGlowCharacterWide.material.depthTest = false;
        equipGlowCharacterWide.visible = false;
        equipGlowCharacterWide.renderOrder = 9;
        equipGlowCharacterWide.userData.baseScale = equipGlowCharacterWide.scale.x;
        creatureGroup.add(equipGlowCharacterWide);

        const contactShadowTexture = (() => {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(256, 256, 20, 256, 256, 256);
            grad.addColorStop(0, 'rgba(0, 0, 0, 0.62)');
            grad.addColorStop(0.35, 'rgba(0, 0, 0, 0.36)');
            grad.addColorStop(0.7, 'rgba(0, 0, 0, 0.12)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 512, 512);
            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.needsUpdate = true;
            return tex;
        })();

        const shadowAnchor = new THREE.Group();
        shadowAnchor.position.set(0.3, -6.35, -5.8);
        shadowAnchor.rotation.x = -Math.PI / 2;
        shadowAnchor.renderOrder = 1;
        scene.add(shadowAnchor);

        const contactShadow = new THREE.Mesh(
            new THREE.CircleGeometry(3.0, 64),
            new THREE.MeshBasicMaterial({
                map: contactShadowTexture,
                transparent: true,
                opacity: 0.56,
                depthWrite: false,
                depthTest: true
            })
        );
        const CONTACT_SHADOW_OPACITY = 0.56;
        const CONTACT_SHADOW_SOFT_OPACITY = 0.34;
        let contactShadowSceneFade = 1;
        const CONTACT_SHADOW_ASCENT_FADE_START = 0.18;
        const CONTACT_SHADOW_ASCENT_FADE_FULL = 1.35;
        const setContactShadowFade = (fade = 1) => {
            contactShadowSceneFade = THREE.MathUtils.clamp(fade, 0, 1);
        };
        const applyContactShadowOpacity = (hoverHeight = 0, mysteryFlightFx = null) => {
            const lift = Math.max(0, Number.isFinite(hoverHeight) ? hoverHeight : 0);
            const baseCoreOpacity = Math.max(0, CONTACT_SHADOW_OPACITY - lift * 0.2);
            const baseSoftOpacity = Math.max(0, CONTACT_SHADOW_SOFT_OPACITY - lift * 0.12);
            const cinematicLift = Math.max(
                0,
                Number.isFinite(mysteryFlightFx?.rigOffset?.y) ? mysteryFlightFx.rigOffset.y : 0
            );
            const ascentFade = 1 - THREE.MathUtils.smoothstep(
                cinematicLift,
                CONTACT_SHADOW_ASCENT_FADE_START,
                CONTACT_SHADOW_ASCENT_FADE_FULL
            );
            const sceneFade = THREE.MathUtils.clamp(contactShadowSceneFade * ascentFade, 0, 1);

            contactShadow.material.opacity = baseCoreOpacity * sceneFade;
            contactShadowSoft.material.opacity = baseSoftOpacity * sceneFade;
            contactShadow.visible = contactShadow.material.opacity > 0.001;
            contactShadowSoft.visible = contactShadowSoft.material.opacity > 0.001;
        };

        contactShadow.scale.set(1.25, 0.78, 1);
        shadowAnchor.add(contactShadow);

        const contactShadowSoft = new THREE.Mesh(
            new THREE.CircleGeometry(4.4, 64),
            new THREE.MeshBasicMaterial({
                map: contactShadowTexture,

                const right = metadata.object?.userData?.right;

        function applyWingGroupPose(leftZ, rightZ, wingX, wingSweep, shoulderShift = 0, sweepAdd = 0) {
            const leftBasePosition = leftWingGroup.userData?.basePosition;

            if (leftBasePosition) {
                leftWingGroup.position.copy(leftBasePosition);
            }

                rightWingGroup.position.copy(rightBasePosition);
            }
            leftWingGroup.position.x -= shoulderShift;
            rightWingGroup.position.x += shoulderShift;
            leftWingGroup.rotation.z = leftZ;
            rightWingGroup.rotation.z = rightZ;
            leftWingGroup.rotation.x = wingX;
            rightWingGroup.rotation.x = wingX;
            leftWingGroup.rotation.y = wingSweep + sweepAdd;
            rightWingGroup.rotation.y = -wingSweep - sweepAdd;
        }

        function measureWingClearanceTargets() {
            const source = getWingClearanceSource();
            if (!source) {
                wingClearanceState.activeKey = null;
                return { shoulderShift: 0, sweepAdd: 0 };
            }

            if (wingClearanceState.activeKey !== source.key) {
                wingClearanceState.activeKey = source.key;
                wingClearanceState.shoulderShift = 0;
                wingClearanceState.sweepAdd = 0;
            }

            leftWingGroup.updateWorldMatrix(true, true);
            rightWingGroup.updateWorldMatrix(true, true);
            wingClearanceState.leftBounds.setFromObject(source.left);
            wingClearanceState.rightBounds.setFromObject(source.right);

            const leftBounds = wingClearanceState.leftBounds;
            const rightBounds = wingClearanceState.rightBounds;
            if (leftBounds.isEmpty() || rightBounds.isEmpty()) {
                return { shoulderShift: 0, sweepAdd: 0 };
            }

            const yOverlap = Math.min(leftBounds.max.y, rightBounds.max.y) - Math.max(leftBounds.min.y, rightBounds.min.y);
            const zOverlap = Math.min(leftBounds.max.z, rightBounds.max.z) - Math.max(leftBounds.min.z, rightBounds.min.z);
            if (yOverlap <= -WING_CLEARANCE_GUARD.yOverlapSlack || zOverlap <= -WING_CLEARANCE_GUARD.zOverlapSlack) {
                return { shoulderShift: 0, sweepAdd: 0 };
            }

            const leftWidth = Math.max(0.001, leftBounds.max.x - leftBounds.min.x);
            const rightWidth = Math.max(0.001, rightBounds.max.x - rightBounds.min.x);
            const leftHeight = Math.max(0.001, leftBounds.max.y - leftBounds.min.y);
            const rightHeight = Math.max(0.001, rightBounds.max.y - rightBounds.min.y);
            const wingWidth = Math.max(leftWidth, rightWidth);
            const wingHeight = Math.max(leftHeight, rightHeight);
            const aspectTallness = THREE.MathUtils.clamp(
                ((wingHeight / Math.max(wingWidth, 0.001)) - 1.05) / 0.85,
                0,
                1
            );
            const tallWingBoost = HIGH_CLEARANCE_WING_KEYS.has(source.key) ? 0.85 : 0;
            const tallFactor = Math.max(aspectTallness, tallWingBoost);
            const desiredGap = THREE.MathUtils.clamp(
                Math.min(leftWidth, rightWidth) * WING_CLEARANCE_GUARD.gapRatio * (1 + tallFactor * 0.45),
                WING_CLEARANCE_GUARD.minGap,
                WING_CLEARANCE_GUARD.maxGap
            );
            const centerlinePenetration = leftBounds.max.x + desiredGap - rightBounds.min.x;
            if (!(centerlinePenetration > 0)) {
                return { shoulderShift: 0, sweepAdd: 0 };
            }

            const normalizedPenetration = THREE.MathUtils.clamp(
                centerlinePenetration / Math.max(desiredGap, 0.001),
                0,
                2
            );
            const requiredHalfShift = centerlinePenetration * 0.5;
            const extraGapShift = desiredGap * THREE.MathUtils.lerp(
                WING_CLEARANCE_GUARD.baseExtraGapShift,
                WING_CLEARANCE_GUARD.tallExtraGapShift,
                tallFactor
            );
            const maxShoulderShift = THREE.MathUtils.lerp(
                WING_CLEARANCE_GUARD.baseMaxShoulderShift,
                WING_CLEARANCE_GUARD.tallMaxShoulderShift,
                tallFactor
            );
            const sweepAddScale = THREE.MathUtils.lerp(
                WING_CLEARANCE_GUARD.baseSweepAddScale,
                WING_CLEARANCE_GUARD.tallSweepAddScale,
                tallFactor
            );
            const maxSweepAdd = THREE.MathUtils.lerp(
                WING_CLEARANCE_GUARD.baseMaxSweepAdd,
                WING_CLEARANCE_GUARD.tallMaxSweepAdd,
                tallFactor
            );

            return {
                shoulderShift: THREE.MathUtils.clamp(
                    requiredHalfShift + extraGapShift,
                    0,
                    maxShoulderShift
                ),
                sweepAdd: THREE.MathUtils.clamp(
                    normalizedPenetration * sweepAddScale,
                    0,
                    maxSweepAdd
                )
            };
        }

        function updateWingClearanceGuard(dt) {
            const safeDt = Math.max(0, Number.isFinite(dt) ? dt : 0);
            const target = measureWingClearanceTargets();
            const alpha = 1 - Math.exp(-safeDt * WING_CLEARANCE_GUARD.responseHz);
            wingClearanceState.shoulderShift += (target.shoulderShift - wingClearanceState.shoulderShift) * alpha;

        function cloneWingMeshMaterial(material) {
            if (Array.isArray(material)) {
                return cloneWingMeshMaterial(material[0] || null);
            }
            if (!material?.clone) {
                return null;
            }
            const cloned = material.clone();
            cloned.side = THREE.DoubleSide;
            if ('shadowSide' in cloned) {
                cloned.shadowSide = THREE.DoubleSide;
            }
            cloned.needsUpdate = true;
            return cloned;
        }

        function getLargestMeshEntryFromObject(root) {
            if (!root) return null;
            let bestGeometry = null;
            let bestMaterial = null;
            let bestVertexCount = -1;
            root.traverse((node) => {
                if (!node?.isMesh || !node.geometry?.attributes?.position) {
                    return;
                }
                const vertexCount = node.geometry.attributes.position.count || 0;
                if (vertexCount <= bestVertexCount) {
                    return;
                }
                bestVertexCount = vertexCount;
                bestGeometry = node.geometry.clone();
                bestMaterial = node.material || null;
            });
            return bestGeometry
                ? {
                    geometry: bestGeometry,
                    material: bestMaterial
                }
                : null;
        }

        function getLargestMeshGeometryFromObject(root) {
            return getLargestMeshEntryFromObject(root)?.geometry || null;
        }

        function buildGeometryFromAttributeArrays(sourceAttributes, attributeArrays) {
            const geometry = new THREE.BufferGeometry();
            Object.entries(attributeArrays).forEach(([name, values]) => {
                const source = sourceAttributes[name];
                if (!source?.array || !values?.length) {
                    return;
                }
                const TypedArray = source.array.constructor || Float32Array;
                geometry.setAttribute(
                    name,
                    new THREE.BufferAttribute(new TypedArray(values), source.itemSize, source.normalized === true)
                );
            });
            if (!geometry.attributes.position) {
                return null;
            }
            return geometry;
        }

        function splitPairWingGeometry(sourceGeometry) {
            if (!sourceGeometry?.attributes?.position) {
                return null;
            }
            const nonIndexed = sourceGeometry.index ? sourceGeometry.toNonIndexed() : sourceGeometry.clone();
            const position = nonIndexed.attributes.position;
            const arr = position?.array;
            if (!arr || arr.length < 9) {
                if (nonIndexed?.dispose) nonIndexed.dispose();
                return null;
            }

            const sourceAttributes = Object.fromEntries(
                Object.entries(nonIndexed.attributes).filter(([, attribute]) => attribute?.array?.length)
            );
            const createAttributeBuckets = () => Object.fromEntries(
                Object.keys(sourceAttributes).map((name) => [name, []])
            );
            const leftAttributes = createAttributeBuckets();
            const rightAttributes = createAttributeBuckets();

            for (let triVertex = 0; triVertex <= position.count - 3; triVertex += 3) {
                const centroidX = (
                    position.getX(triVertex) +
                    position.getX(triVertex + 1) +
                    position.getX(triVertex + 2)
                ) / 3;
                const target = centroidX <= 0 ? leftAttributes : rightAttributes;
                Object.entries(sourceAttributes).forEach(([name, attribute]) => {
                    const bucket = target[name];
                    const itemSize = attribute.itemSize || 1;
                    for (let vertexOffset = 0; vertexOffset < 3; vertexOffset++) {
                        const vertexIndex = triVertex + vertexOffset;
                        for (let component = 0; component < itemSize; component++) {
                            bucket.push(attribute.array[vertexIndex * itemSize + component]);
                        }
                    }
                });
            }
            if (nonIndexed?.dispose) nonIndexed.dispose();

            if (!leftAttributes.position?.length && !rightAttributes.position?.length) {
                return null;
            }

            let leftGeometry = null;
            let rightGeometry = null;

            if (leftAttributes.position?.length) {
                leftGeometry = buildGeometryFromAttributeArrays(sourceAttributes, leftAttributes);
            }
            if (rightAttributes.position?.length) {
                rightGeometry = buildGeometryFromAttributeArrays(sourceAttributes, rightAttributes);
            }

            if (!leftGeometry && rightGeometry) {
                leftGeometry = rightGeometry.clone();
                leftGeometry.scale(-1, 1, 1);
            } else if (!rightGeometry && leftGeometry) {
                rightGeometry = leftGeometry.clone();
                rightGeometry.scale(-1, 1, 1);
            }

            return leftGeometry && rightGeometry
                ? { left: leftGeometry, right: rightGeometry }
                : null;
        }

        function normalizeWingPivotFromSeam(geometry) {
            if (!geometry?.attributes?.position) {
                return;
            }
            geometry.computeBoundingBox();
            const bounds = geometry.boundingBox;
            const pos = geometry.attributes.position;
            const spanX = Math.max(0.0001, bounds.max.x - bounds.min.x);
            const seamThreshold = Math.max(0.001, spanX * 0.1);

            let sumX = 0;
            let sumY = 0;
            let sumZ = 0;
            let count = 0;

            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                if (Math.abs(x) > seamThreshold) {
                    continue;
                }
                sumX += x;
                sumY += pos.getY(i);
                sumZ += pos.getZ(i);
                count++;
            }

            if (count < 4) {
                const relaxedThreshold = Math.max(seamThreshold, spanX * 0.24);
                for (let i = 0; i < pos.count; i++) {
                    const x = pos.getX(i);
                    if (Math.abs(x) > relaxedThreshold) {
                        continue;
                    }
                    sumX += x;
                    sumY += pos.getY(i);
                    sumZ += pos.getZ(i);
                    count++;
                }
            }

            if (count <= 0) {
                const center = bounds.getCenter(new THREE.Vector3());
                geometry.translate(-center.x * 0.06, -center.y * 0.18, -center.z);
                geometry.computeBoundingBox();
                return;
            }

            const rootX = sumX / count;
            const rootY = sumY / count;
            const rootZ = sumZ / count;
            geometry.translate(-rootX, -rootY, -rootZ);
            geometry.computeBoundingBox();
        }

        function applyWingUvAndDepthFromGeometry(geometry) {
            if (!geometry?.attributes?.position) {
                return;
            }
            geometry.computeBoundingBox();
            const bounds = geometry.boundingBox;
            const pos = geometry.attributes.position;
            const minAbsX = Math.min(Math.abs(bounds.min.x), Math.abs(bounds.max.x));
            const maxAbsX = Math.max(Math.abs(bounds.min.x), Math.abs(bounds.max.x));
            const spanAbsX = Math.max(0.001, maxAbsX - minAbsX);
            const spanY = Math.max(0.001, bounds.max.y - bounds.min.y);
            const uv = new Float32Array(pos.count * 2);

            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const y = pos.getY(i);
                const z = pos.getZ(i);
                const nx = THREE.MathUtils.clamp((Math.abs(x) - minAbsX) / spanAbsX, 0, 1);
                const ny = THREE.MathUtils.clamp((y - bounds.min.y) / spanY, 0, 1);
                const featherLift = 0.04 + Math.pow(nx, 1.28) * 0.2 + Math.pow(ny, 1.5) * 0.035;
                const wrinkle = Math.sin(nx * 12.8 + ny * 9.2) * 0.014 + Math.cos(nx * 5.3 - ny * 11.4) * 0.01;
                pos.setZ(i, z * 0.2 + featherLift + wrinkle);
                uv[i * 2] = nx;
                uv[i * 2 + 1] = 1 - ny;
            }

            geometry.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
            pos.needsUpdate = true;
            geometry.computeVertexNormals();
            geometry.computeBoundingBox();
            geometry.computeBoundingSphere();
        }

        function prepareWingGeometryForEferno(sourceGeometry) {
            if (!sourceGeometry?.attributes?.position) {
                return null;
            }
            const geometry = sourceGeometry.index ? sourceGeometry.toNonIndexed() : sourceGeometry.clone();
            normalizeWingPivotFromSeam(geometry);
            applyWingUvAndDepthFromGeometry(geometry);
            return geometry;
        }

        function prepareWingGeometryForSocketAttachment(sourceGeometry) {
            if (!sourceGeometry?.attributes?.position) {
                return null;
            }
            const geometry = sourceGeometry.index ? sourceGeometry.toNonIndexed() : sourceGeometry.clone();
            normalizeWingPivotFromSeam(geometry);
            if (!geometry.attributes.normal) {
                geometry.computeVertexNormals();
            }
            geometry.computeBoundingBox();
            geometry.computeBoundingSphere();
            return geometry;
        }

            if (position?.length === 3) {

        function createGlbWingAssetController(assetState, label) {
            const createMaterialInstance = () => cloneWingMeshMaterial(assetState.materialTemplate);
            const clonePreparedEquipped = () => ({
                left: assetState.leftGeometry?.clone() || null,
                right: assetState.rightGeometry?.clone() || null
            });

            const ensurePreparedWingPair = () => {
                if (assetState.leftGeometry && assetState.rightGeometry) {
                    return clonePreparedEquipped();
                }
                if (!assetState.previewGeometry || !assetState.materialTemplate) {
                    return {
                        left: null,
                        right: null
                    };
                }
                const sourceGeometry = assetState.previewGeometry.clone();
                const split = splitPairWingGeometry(sourceGeometry);
                if (sourceGeometry?.dispose) {
                    sourceGeometry.dispose();
                }
                if (!split?.left || !split?.right) {
                    throw new Error(`${label} GLB could not be split into left/right wings.`);
                }
                const preparedLeft = prepareWingGeometryForSocketAttachment(split.left);
                const preparedRight = prepareWingGeometryForSocketAttachment(split.right);
                if (split.left?.dispose) split.left.dispose();
                if (split.right?.dispose) split.right.dispose();
                if (!preparedLeft || !preparedRight) {
                    throw new Error(`${label} wing geometry preparation failed.`);
                }
                assetState.leftGeometry = preparedLeft;
                assetState.rightGeometry = preparedRight;
                return clonePreparedEquipped();
            };

            const loadPreviewAssets = () => {
                if (assetState.previewGeometry && assetState.materialTemplate) {
                    return Promise.resolve(true);
                }
                if (!assetState.previewLoadPromise) {
                    assetState.previewLoadPromise = new Promise((resolve, reject) => {
                        assetState.loader.load(
                            assetState.modelUrl,
                            (gltf) => {
                                const root = gltf?.scene || gltf?.scenes?.[0] || null;
                                const sourceEntry = getLargestMeshEntryFromObject(root);
                                const sourceGeometry = sourceEntry?.geometry || null;
                                const materialTemplate = cloneWingMeshMaterial(sourceEntry?.material || null);
                                if (!sourceGeometry) {
                                    reject(new Error(`${label} GLB did not contain a mesh with geometry.`));
                                    return;
                                }
                                if (!materialTemplate) {
                                    if (sourceGeometry?.dispose) sourceGeometry.dispose();
                                    reject(new Error(`${label} GLB did not contain a cloneable material.`));
                                    return;
                                }
                                assetState.previewGeometry = sourceGeometry.clone();
                                assetState.materialTemplate = materialTemplate;
                                if (sourceGeometry?.dispose) {
                                    sourceGeometry.dispose();
                                }
                                resolve(true);
                            },
                            undefined,
                            (error) => reject(error)
                        );
                    }).catch((error) => {
                        console.warn(`Unable to load ${label} GLB, leaving ${label} hidden until the asset is available.`, error);
                        return false;
                    });
                }
                return assetState.previewLoadPromise;
            };

            const loadEquippedAssets = () => {
                if (assetState.leftGeometry && assetState.rightGeometry && assetState.materialTemplate) {
                    return Promise.resolve(clonePreparedEquipped());
                }
                if (!assetState.equippedLoadPromise) {
                    assetState.equippedLoadPromise = loadPreviewAssets().then((ready) => {
                        if (!ready || !assetState.previewGeometry || !assetState.materialTemplate) {
                            return;
                        }
                        ensurePreparedWingPair();
                    }).catch((error) => {
                        console.warn(`Unable to prepare equipped ${label} geometry.`, error);
                    });
                }
                return assetState.equippedLoadPromise.then(() => clonePreparedEquipped());
            };

            const createPreviewObject = (previewTransform = null) => {
                if (previewTransform) {
                    try {
                        const pair = ensurePreparedWingPair();
                        if (pair.left && pair.right) {
                            const group = new THREE.Group();
                            const left = createDetachedWingPreviewMesh(
                                pair.left,
                                assetState.materialTemplate,
                                buildMirroredWingTransform(previewTransform, -1)
                            );
                            const right = createDetachedWingPreviewMesh(
                                pair.right,
                                assetState.materialTemplate,
                                buildMirroredWingTransform(previewTransform, 1)
                            );
                            if (left) {
                                group.add(left);
                                group.userData.left = left;
                            }
                            if (right) {
                                group.add(right);
                                group.userData.right = right;
                            }
                            if (left || right) {
                                return group;
                            }
                        }
                    } catch (error) {
                        console.warn(`Unable to prepare detached preview object for ${label}.`, error);
                    }
                }
                return createWingPairPreviewGroup(assetState.previewGeometry, assetState.materialTemplate);
            };

            return {
                createMaterialInstance,
                loadPreviewAssets,
                loadEquippedAssets,
                createPreviewObject
            };
        }

        function buildMirroredWingTransform(transform, dir) {
            const position = Array.isArray(transform?.position) ? transform.position : [0.8, -0.78, 0.22];
            const rotation = Array.isArray(transform?.rotation) ? transform.rotation : [0.024, 0.076, -0.032];
            const scaleValue = Array.isArray(transform?.scale)
                ? transform.scale
                : [transform?.scale || 19.2, transform?.scale || 19.2, transform?.scale || 19.2];
            return {
                position: [dir * position[0], position[1], position[2]],
                rotation: [rotation[0], dir * rotation[1], dir * rotation[2]],
                scale: [scaleValue[0], scaleValue[1], scaleValue[2]]
            };
        }

        function applyWingTransform(target, transform) {

            const position = Array.isArray(transform.position) ? transform.position : null;
            const rotation = Array.isArray(transform.rotation) ? transform.rotation : null;

            if (position?.length === 3) {
                target.position.set(position[0], position[1], position[2]);
            }
            if (rotation?.length === 3) {

            }
        }

            const assetState = {
