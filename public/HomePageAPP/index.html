            const floorY = -(safeSize.y * safeScale * 0.5) - (isCharacterMode ? 0.09 : 0.04);
            previewStageShadow.scale.set(stageRadius * 1.34, stageRadius * 1.34, 1);
            previewStageShadow.position.y = floorY;
            previewStageRing.scale.set(stageRadius, stageRadius, 1);
            previewStageRing.position.y = floorY + 0.004;
            if (previewStageRing.material && Number.isFinite(previewStageRing.material.opacity)) {
                previewStageRing.material.opacity = isCharacterMode ? 0.17 : 0.24;
            }
        }

        function setPreviewCameraForObjectMode(mode, size, scale = 1, forcedDistance = null, categoryKey = null) {
            const safeSize = getFiniteSizeVector(size, 1);
            const safeScale = Number.isFinite(scale) && scale > 0 ? scale : 1;
            const cfg = getPreviewFitConfig(mode, categoryKey);
            const requestedDistance = Number.isFinite(forcedDistance) && forcedDistance > 0 ? forcedDistance : null;
            const baseDistance = computePreviewCameraDistanceForScale(mode, safeSize, safeScale, categoryKey);
            const forwardDistance = Math.max(cfg.minDistance, requestedDistance ?? baseDistance);
            let orbitYaw = 0;
            let orbitPitch = 0;
            let orbitDistance = forwardDistance;
            let targetY = 0;
            if (mode === 'character') {
                const yLift = cfg.cameraLiftBase + (safeSize.y * safeScale * cfg.cameraLiftScale);
                targetY = sanitizeFiniteNumber(cfg.lookYOffset, 0);
                const relativeY = yLift - targetY;
                orbitDistance = Math.hypot(forwardDistance, relativeY);
                orbitPitch = Math.atan2(relativeY, Math.max(0.001, forwardDistance));
            }
            previewState.defaultOrbitYaw = orbitYaw;
            previewState.defaultOrbitPitch = orbitPitch;
            previewState.orbitYaw = orbitYaw;
            previewState.orbitPitch = orbitPitch;
            previewState.fitCameraDistance = orbitDistance;
            previewState.cameraDistance = orbitDistance;
            previewState.minCameraDistance = Math.max(0.52, Math.min(forwardDistance * 0.68, orbitDistance * 0.58));
            previewState.maxCameraDistance = Math.max(orbitDistance * 2.7, previewState.minCameraDistance + 1.8);
            const scaledWidth = safeSize.x * safeScale;
            const scaledHeight = safeSize.y * safeScale;
            const isWingSet = categoryKey === 'wingSet';
            const panScaleX = mode === 'character' ? 0.2 : (isWingSet ? 0.34 : 0.26);
            const panScaleY = mode === 'character' ? 0.22 : (isWingSet ? 0.42 : 0.3);
            previewState.panLimitX = Math.max(0.12, Math.min(2.1, scaledWidth * panScaleX));
            previewState.panLimitY = Math.max(0.12, Math.min(2.4, scaledHeight * panScaleY));
            previewState.defaultCameraTarget.set(0, targetY, 0);
            previewState.cameraTarget.copy(previewState.defaultCameraTarget);
            applyPreviewCameraOrbit();
        }

        function computePreviewObjectBounds(object, mode = 'item', fitCategory = null) {
            const baseBounds = computeSafeObjectBounds(object);
            if (
                !object ||
                mode === 'character' ||
                fitCategory !== 'wingSet' ||
                !baseBounds ||
                baseBounds.isEmpty()
            ) {
                return baseBounds;
            }

            const focusedBounds = computeSafeObjectBounds(object, {
                respectVisibility: true,
                includePoints: false
            });

            if (focusedBounds && !focusedBounds.isEmpty()) {
                return focusedBounds;
            }
            return baseBounds;
        }

        function placeObjectInPreviewViewport(object, options = {}) {
            const { fallbackMessage = '', mode = 'item', fitCategory = null, fitPropKey = null } = options;
            const isCharacterMode = mode === 'character';
            if (!object) {
                return false;
            }

            try {
                sanitizePreviewInvalidGeometry(object);
                object.frustumCulled = false;
                object.position.set(0, 0, 0);
                object.rotation.set(0, 0, 0);
                object.scale.set(1, 1, 1);
                object.updateMatrixWorld(true);
            } catch (error) {
                console.error('Unable to sanitize object for preview viewport:', error);
                setPreviewFallbackMessage(fallbackMessage || 'Unable to generate this preview.');
                return false;
            }

            if (!hasFiniteRenderableGeometry(object)) {
                setPreviewFallbackMessage(fallbackMessage || 'Unable to calculate preview bounds for this object.');
                return false;
            }

            const worldBox = computePreviewObjectBounds(object, mode, fitCategory);
            if (worldBox && !worldBox.isEmpty()) {
                const center = worldBox.getCenter(new THREE.Vector3());
                const rawSize = worldBox.getSize(new THREE.Vector3());
                const safeSize = getFiniteSizeVector(rawSize, 1.2);
                const safeCenter = new THREE.Vector3(
                    sanitizeFiniteNumber(center.x, 0),
                    sanitizeFiniteNumber(center.y, 0),
                    sanitizeFiniteNumber(center.z, 0)
                );
                if (
                    Number.isFinite(safeSize.x) && Number.isFinite(safeSize.y) && Number.isFinite(safeSize.z) &&
                    Number.isFinite(center.x) && Number.isFinite(center.y) && Number.isFinite(center.z)
                ) {
                    const placement = resolvePreviewPlacement(mode, safeSize, fitCategory, fitPropKey);
                    object.position.sub(safeCenter);
                    if (!isCharacterMode && (placement.yOffsetRatio !== 0 || placement.zOffsetRatio !== 0)) {
                        const scaledHeight = safeSize.y * placement.scale;
                        const scaledDepth = safeSize.z * placement.scale;
                        object.position.y += scaledHeight * placement.yOffsetRatio;
                        object.position.z += scaledDepth * placement.zOffsetRatio;
                    }
                    object.scale.setScalar(placement.scale);
                    syncPreviewObjectRotation(object);
                    setPreviewCameraForObjectMode(mode, safeSize, placement.scale, placement.distance, fitCategory);
                    updatePreviewStageForObject(mode, safeSize, placement.scale);
                    setPreviewFallbackMessage('');
                    return true;
                }
            }

            if (!hasFiniteRenderableGeometry(object)) {
                setPreviewFallbackMessage('Unable to calculate preview bounds for this object.');
                return false;
            }

            if (isCharacterMode) {
                object.position.set(0, -0.95, 0);
                object.scale.setScalar(0.43);
                syncPreviewObjectRotation(object);
                setPreviewCameraForObjectMode('character', new THREE.Vector3(1, 3.8, 1), 0.43, null, fitCategory);
                updatePreviewStageForObject('character', new THREE.Vector3(1, 3.8, 1), 0.43);
                setPreviewFallbackMessage(fallbackMessage || 'Unable to calculate character preview bounds.');
                return false;
            }

            object.position.set(0, -0.2, 0);
            object.scale.setScalar(0.55);
            syncPreviewObjectRotation(object);
            setPreviewCameraForObjectMode('item', new THREE.Vector3(1.2, 1.2, 1.2), 0.55, null, fitCategory);
            updatePreviewStageForObject('item', new THREE.Vector3(1.2, 1.2, 1.2), 0.55);
            setPreviewFallbackMessage(fallbackMessage);
            return false;
        }

        function setPreviewFallbackMessage(message) {
            if (!propPreviewFallback) {
                return;
            }
            const text = message?.trim() || '';
            propPreviewFallback.textContent = text;
            propPreviewFallback.classList.toggle('show', text.length > 0);
        }

        function resizePropViewport() {
            if (!propPreviewViewport) return;
            const viewportRect = propPreviewViewport.getBoundingClientRect();
            const width = Math.max(180, Math.floor(viewportRect.width));
            const height = Math.max(110, Math.floor(viewportRect.height));
            previewRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            previewRenderer.setSize(width, height, false);
            previewCamera.aspect = width / Math.max(1, height);
            previewCamera.updateProjectionMatrix();

            if (previewState.open && previewState.object) {
                const mode = previewState.viewMode === 'character' ? 'character' : 'item';
                placeObjectInPreviewViewport(previewState.object, {
                    mode,
                    fitCategory: previewState.fitCategory,
                    fitPropKey: previewState.fitPropKey
                });
                syncPreviewObjectRotation(previewState.object);
                applyPreviewCameraOrbit();
            }
        }

        function createPreviewFallbackModel() {
            const fallbackGroup = new THREE.Group();
            fallbackGroup.frustumCulled = false;
            const pedestal = new THREE.Mesh(
                new THREE.CylinderGeometry(0.44, 0.52, 0.09, 28),
                new THREE.MeshStandardMaterial({
                    color: 0xc7b07f,
                    roughness: 0.65,
                    metalness: 0.05,
                    emissive: 0x5a3f1a,
                    emissiveIntensity: 0.16
                })
            );
            pedestal.position.set(0, -0.34, 0);
            fallbackGroup.add(pedestal);

            return fallbackGroup;
        }

        async function setPreviewObject(propKey, label = 'Unknown item', prebuiltPreview = null) {
            const source = getItemByPropKey(propKey);
            const hasPrebuiltObject = Boolean(prebuiltPreview?.object && prebuiltPreview.propKey === propKey);
            if (!source && !hasPrebuiltObject) {
                setPreviewActionButtonsDisabled(true);
                return;
            }
            const requestToken = (previewState.requestToken || 0) + 1;
            previewState.requestToken = requestToken;
            const propCategory = source?.userData?.propCategory || propRegistry.get(propKey)?.category || null;
            const previewFitOverride = propKey ? PREVIEW_ITEM_FIT_OVERRIDES[propKey] : null;
            const initialRotateY = Number.isFinite(previewFitOverride?.initialRotationY)
                ? previewFitOverride.initialRotationY
                : 0;
            const initialMode = 'item';
            propPreviewPanel.classList.add('open');
            previewState.open = true;
            resetPreviewDragState();
            previewState.viewMode = initialMode;
            previewState.fitCategory = propCategory || null;
            previewState.fitPropKey = propKey;
            previewState.propKey = propKey;
            previewState.label = label;
            previewState.defaultObjectRotateY = initialRotateY;
            previewState.objectRotateY = initialRotateY;
            previewState.defaultOrbitYaw = 0;
            previewState.defaultOrbitPitch = 0;
            previewState.orbitYaw = 0;
            previewState.orbitPitch = 0;
            previewState.cameraDistance = sanitizeFiniteNumber(previewState.fitCameraDistance, 2.4);
            pausePreviewAutoSpin(0);
            if (propPreviewOverlay) {
                propPreviewOverlay.classList.add('open');
            }
            if (propPreviewName) {
                propPreviewName.textContent = `${label} Preview`;
            }
            focusPropPreviewViewport();
            setPreviewFallbackMessage('Loading preview…');
            setPreviewActionButtonsDisabled(true);
            if (previewState.object) {
                previewScene.remove(previewState.object);
                previewState.object = null;
            }

            if (!hasPrebuiltObject) {
                const previewReadyPromise = getPropPreviewReadyPromise(source);
                if (previewReadyPromise) {
                    await previewReadyPromise;
                    await waitForPreviewRenderTick();
                    if (previewState.requestToken !== requestToken) {
                        return;
                    }
                }
            }

            const previewBuild = hasPrebuiltObject ? prebuiltPreview : buildPreviewObject(source);
            if (previewState.requestToken !== requestToken) {
                return;
            }
            const cloned = previewBuild?.object;
            const hasRenderableMesh = previewBuild?.hasRenderableMesh ?? false;
            if (!cloned) {
                setPreviewFallbackMessage('Unable to build this prop preview.');
                setPreviewActionButtonsDisabled(true);
                return;
            }

            const hasFiniteGeometry = hasFiniteRenderableGeometry(cloned);
            const fallbackMessage = hasRenderableMesh
                ? 'Unable to calculate preview bounds.'
                : 'This prop does not yet have a standalone preview mesh. Place it on the character to see it in context.';
            if (!hasFiniteGeometry) {
                if (previewState.requestToken !== requestToken) {
                    return;
                }
                const fallback = createPreviewFallbackModel();
                fallback.position.set(0, 0, 0);
                previewState.object = fallback;
                previewState.propKey = propKey;
                previewState.label = label;
                previewState.defaultObjectRotateY = 0;
                previewState.objectRotateY = 0;
                previewState.hasStandaloneMesh = false;
                if (previewScene) {
                    previewScene.add(fallback);
                }
                placeObjectInPreviewViewport(fallback, {
                    mode: initialMode,
                    fitCategory: previewState.fitCategory,
                    fitPropKey: previewState.fitPropKey,
                    fallbackMessage
                });
                setPreviewActionButtonsDisabled(false);
                resizePropViewport();
                return;
            }

            if (previewState.requestToken !== requestToken) {
                return;
            }
            previewState.object = cloned;
            previewState.defaultObjectRotateY = initialRotateY;
            previewState.objectRotateY = initialRotateY;
            cloned.position.set(0, 0, 0);
            syncPreviewObjectRotation(cloned);
            cloned.scale.set(1, 1, 1);
            previewState.hasStandaloneMesh = placeObjectInPreviewViewport(cloned, {
                mode: initialMode,
                fitCategory: previewState.fitCategory,
                fitPropKey: previewState.fitPropKey,
                fallbackMessage
            });
            if (!previewState.hasStandaloneMesh) {
                const fallback = createPreviewFallbackModel();
                previewState.object = fallback;
                previewState.hasStandaloneMesh = false;
                if (previewScene) {
                    previewScene.remove(cloned);
                    previewScene.add(fallback);
                }
                placeObjectInPreviewViewport(fallback, {
                    mode: 'item',
                    fitCategory: previewState.fitCategory,
                    fallbackMessage
                });
            } else {
                previewScene.add(cloned);
                syncPreviewObjectRotation(cloned);
                setPreviewFallbackMessage('');
            }

            setPreviewActionButtonsDisabled(false);
            propPreviewName.textContent = `${label} Preview`;
            resizePropViewport();
        }

        function rememberMysteryMaterialDefaults(material) {
            if (!material) {
                return material;
            }
            material.userData = material.userData || {};
            if (!material.userData.mysteryDefaultsCaptured) {
                material.userData.mysteryDefaultsCaptured = true;
                material.userData.baseOpacity = Number.isFinite(material.opacity) ? material.opacity : 1;
                material.userData.baseTransparent = Boolean(material.transparent);
                if (typeof material.depthWrite === 'boolean') {
                    material.userData.baseDepthWrite = material.depthWrite;
                }
                if ('emissiveIntensity' in material && Number.isFinite(material.emissiveIntensity)) {
                    material.userData.baseEmissiveIntensity = material.emissiveIntensity;
                }
            }
            return material;
        }

        function applyMysteryPieceOpacity(piece, factor = 1) {
            if (!piece) {
                return;
            }
            const opacityFactor = THREE.MathUtils.clamp(factor, 0, 1);
            piece.visible = opacityFactor > 0.001;
            piece.traverse((node) => {
                if (!node?.material) {
                    return;
                }
                const materials = Array.isArray(node.material) ? node.material : [node.material];
                materials.forEach((material) => {
                    if (!material) {
                        return;
                    }
                    rememberMysteryMaterialDefaults(material);
                    const baseOpacity = material.userData.baseOpacity ?? 1;
                    const baseTransparent = Boolean(material.userData.baseTransparent);
                    const baseDepthWrite = material.userData.baseDepthWrite;
                    material.transparent = opacityFactor < 0.999 || baseTransparent;
                    material.opacity = baseOpacity * opacityFactor;
                    if (typeof baseDepthWrite === 'boolean') {
                        material.depthWrite = material.transparent ? false : baseDepthWrite;
                    }
                    material.needsUpdate = true;
                });
            });
        }

        function updateMysteryGlowMaterials(entries, energy = 1, pulse = 0, fade = 1) {
            if (!Array.isArray(entries) || !entries.length) {
                return;
            }
            const clampedEnergy = Math.max(0, energy);
            const clampedFade = THREE.MathUtils.clamp(fade, 0, 1.35);
            entries.forEach((entry, index) => {
                const material = rememberMysteryMaterialDefaults(entry?.material);
                if (!material) {
                    return;
                }
                const phase = entry.phase ?? index * 0.63;
                const wave = 0.5 + 0.5 * Math.sin(pulse + phase);
                const intensityScale = THREE.MathUtils.lerp(
                    entry.minScale ?? 0.92,
                    entry.maxScale ?? 1.2,
                    wave
                ) * clampedEnergy;
                if (Number.isFinite(material.userData.baseEmissiveIntensity) && 'emissiveIntensity' in material) {
                    material.emissiveIntensity = material.userData.baseEmissiveIntensity * intensityScale;
                }
                if (material.userData.mysteryAnimateOpacity) {
                    const baseOpacity = material.userData.baseOpacity ?? 1;
                    const opacityScale = THREE.MathUtils.lerp(
                        entry.minOpacityScale ?? 0.82,
                        entry.maxOpacityScale ?? 1.24,
                        wave
                    );
                    material.opacity = THREE.MathUtils.clamp(baseOpacity * opacityScale * clampedFade, 0, entry.maxOpacity ?? 1);
                }
            });
        }

        function syncMysteryShadowState(root) {
            root?.traverse((node) => {
                if (!node?.isMesh) {
                    return;
                }
                const skipShadow = Boolean(node.userData?.skipMysteryShadowPass);
                node.castShadow = !skipShadow;
                node.receiveShadow = false;
            });
        }

        const mysterySparkleTextureCache = new Map();

        function getMysterySparkleTexture(rarityKey, tint = 0xffffff) {
            const normalizedRarity = normalizeMysteryBoxRarity(rarityKey);
            const cacheKey = `${normalizedRarity}:${Number(tint) || 0xffffff}`;
            const cachedTexture = mysterySparkleTextureCache.get(cacheKey);
            if (cachedTexture) {
                return cachedTexture;
            }

            const size = 128;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            if (!ctx) {
                const fallbackTexture = new THREE.Texture();
                mysterySparkleTextureCache.set(cacheKey, fallbackTexture);
                return fallbackTexture;
            }

            const color = new THREE.Color(tint);
            const toRgba = (alpha) => `rgba(${Math.round(color.r * 255)}, ${Math.round(color.g * 255)}, ${Math.round(color.b * 255)}, ${alpha})`;
            const warmWhite = 'rgba(255, 249, 239, 1)';
            const center = size / 2;

            ctx.clearRect(0, 0, size, size);

            const glow = ctx.createRadialGradient(center, center, 0, center, center, center);
            glow.addColorStop(0, warmWhite);
            glow.addColorStop(0.14, toRgba(0.94));
            glow.addColorStop(0.34, toRgba(0.54));
            glow.addColorStop(0.72, toRgba(0.09));
            glow.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, size, size);

            ctx.save();
            ctx.translate(center, center);
            ctx.lineCap = 'round';
            ctx.strokeStyle = warmWhite;
            ctx.shadowColor = toRgba(0.95);
            ctx.shadowBlur = 14;

            ctx.beginPath();
            ctx.lineWidth = 6;
            ctx.moveTo(-28, 0);
            ctx.lineTo(28, 0);
            ctx.moveTo(0, -28);
            ctx.lineTo(0, 28);
            ctx.stroke();

            ctx.beginPath();
            ctx.lineWidth = 2.6;
            ctx.moveTo(-18, -18);
            ctx.lineTo(18, 18);
            ctx.moveTo(18, -18);
            ctx.lineTo(-18, 18);
            ctx.stroke();
            ctx.restore();

            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.wrapS = THREE.ClampToEdgeWrapping;
            texture.wrapT = THREE.ClampToEdgeWrapping;
            texture.needsUpdate = true;
            mysterySparkleTextureCache.set(cacheKey, texture);
            return texture;
        }

        function createMysteryBoxModel(rarityKey = MYSTERY_BOX_RARITY.RARE) {
            const normalizedRarity = normalizeMysteryBoxRarity(rarityKey);
            const theme = getMysteryBoxTheme(normalizedRarity);
            const boxGroup = new THREE.Group();
            boxGroup.frustumCulled = false;

            const reactiveMaterials = [];
            const registerMaterial = (material) => rememberMysteryMaterialDefaults(material);
            const registerReactiveMaterial = (material, options = {}) => {
                rememberMysteryMaterialDefaults(material);
                reactiveMaterials.push({
                    material,
                    ...options
                });
                return material;
            };
            const addMesh = (parent, geometry, material, position = [0, 0, 0], rotation = null, options = {}) => {
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(position[0], position[1], position[2]);
                if (rotation) {
                    mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
                }
                if (options.scale) {
                    mesh.scale.set(options.scale[0], options.scale[1], options.scale[2]);
                }
                if (options.skipShadow) {
                    mesh.userData.skipMysteryShadowPass = true;
                    mesh.castShadow = false;
                }
                if (typeof options.renderOrder === 'number') {
                    mesh.renderOrder = options.renderOrder;
                }
                parent.add(mesh);
                return mesh;
            };

            const shellMaterial = registerMaterial(new THREE.MeshPhysicalMaterial({
                color: theme.shellColor,
                roughness: 0.24,
                metalness: 0.16,
                clearcoat: 0.84,
                clearcoatRoughness: 0.16,
                emissive: theme.shellEmissive,
                emissiveIntensity: 0.34
            }));
            const panelMaterial = registerReactiveMaterial(new THREE.MeshPhysicalMaterial({
                color: theme.panelColor,
                roughness: 0.22,
                metalness: 0.16,
                clearcoat: 0.96,
                clearcoatRoughness: 0.12,
                emissive: theme.panelEmissive,
                emissiveIntensity: 0.42
            }), {
                phase: 0.35,
                minScale: 0.94,
                maxScale: 1.08
            });
            const brassMaterial = registerReactiveMaterial(new THREE.MeshPhysicalMaterial({
                color: theme.trimColor,
                roughness: 0.22,
                metalness: 1,
                clearcoat: 0.24,
                clearcoatRoughness: 0.18,
                emissive: theme.trimEmissive,
                emissiveIntensity: 0.42
            }), {
                phase: 1.2,
                minScale: 0.95,
                maxScale: 1.1
            });
            const steelMaterial = registerMaterial(new THREE.MeshPhysicalMaterial({
                color: theme.steelColor,
                roughness: 0.22,
                metalness: 0.72,
                clearcoat: 0.18,
                clearcoatRoughness: 0.2,
                emissive: theme.steelEmissive,
                emissiveIntensity: 0.18
            }));
            const seamMaterial = registerReactiveMaterial(new THREE.MeshPhysicalMaterial({
                color: theme.seamColor,
                roughness: 0.1,
                metalness: 0.24,
                clearcoat: 0.62,
                clearcoatRoughness: 0.1,
                emissive: theme.seamEmissive,
                emissiveIntensity: 1.12
            }), {
                phase: 2.1,
                minScale: 0.82,
                maxScale: 1.5
            });
            const runeMaterial = registerReactiveMaterial(new THREE.MeshPhysicalMaterial({
                color: theme.runeColor,
                roughness: 0.1,
                metalness: 0.12,
                clearcoat: 0.78,
                clearcoatRoughness: 0.08,
                emissive: theme.runeEmissive,
                emissiveIntensity: 1.3
            }), {
                phase: 3.2,
                minScale: 0.9,
                maxScale: 1.62
            });
            const cornerGemMaterial = registerReactiveMaterial(new THREE.MeshPhysicalMaterial({
                color: theme.gemColor,
                roughness: 0.08,
                metalness: 0.08,
                clearcoat: 0.96,
                clearcoatRoughness: 0.06,
                emissive: theme.gemEmissive,
                emissiveIntensity: 1.2
            }), {
                phase: 4.25,
                minScale: 0.94,
                maxScale: 1.32
            });
            const accentMetalMaterial = theme.accentMetalColor
                ? registerReactiveMaterial(new THREE.MeshPhysicalMaterial({
                    color: theme.accentMetalColor,
                    roughness: 0.18,
                    metalness: 0.92,
                    clearcoat: 0.32,
                    clearcoatRoughness: 0.12,
                    emissive: theme.accentMetalEmissive ?? theme.trimEmissive,
                    emissiveIntensity: 0.46
                }), {
                    phase: 2.65,
                    minScale: 0.96,
                    maxScale: 1.24
                })
                : null;
            const accentGlassMaterial = theme.accentGlassColor
                ? registerReactiveMaterial(new THREE.MeshPhysicalMaterial({
                    color: theme.accentGlassColor,
                    roughness: 0.08,
                    metalness: 0.06,
                    transmission: 0.12,
                    transparent: true,
                    opacity: 0.96,
                    clearcoat: 0.98,
                    clearcoatRoughness: 0.06,
                    emissive: theme.accentGlassEmissive ?? theme.gemEmissive,
                    emissiveIntensity: 1.2
                }), {
                    phase: 4.95,
                    minScale: 0.96,
                    maxScale: 1.34,
                    minOpacityScale: 0.86,
                    maxOpacityScale: 1.18,
                    maxOpacity: 0.98
                })
                : null;
            if (accentGlassMaterial) {
                accentGlassMaterial.userData.mysteryAnimateOpacity = true;
            }
            const bodyGroup = new THREE.Group();
            bodyGroup.position.set(0, 0, 0);
            boxGroup.add(bodyGroup);
            const ornamentEntries = [];
            const registerOrnament = (mesh, options = {}) => {
                if (!mesh) {
                    return mesh;
                }
                ornamentEntries.push({
                    mesh,
                    basePosition: mesh.position.clone(),
                    baseRotation: mesh.rotation.clone(),
                    baseScale: mesh.scale.clone(),
                    ...options
                });
                return mesh;
            };

            const bottom = new THREE.Group();
            bottom.position.set(0, 0.1, 0);
            bodyGroup.add(bottom);
            addMesh(bottom, new RoundedBoxGeometry(2.2, 0.2, 2.2, 6, 0.05), shellMaterial);
            addMesh(bottom, new RoundedBoxGeometry(1.72, 0.08, 1.72, 4, 0.035), panelMaterial, [0, 0.08, 0]);
            addMesh(bottom, new THREE.BoxGeometry(1.84, 0.08, 0.12), brassMaterial, [0, 0.08, 0.94]);
            addMesh(bottom, new THREE.BoxGeometry(1.84, 0.08, 0.12), brassMaterial, [0, 0.08, -0.94]);
            addMesh(bottom, new THREE.BoxGeometry(0.12, 0.08, 1.84), brassMaterial, [0.94, 0.08, 0]);
            addMesh(bottom, new THREE.BoxGeometry(0.12, 0.08, 1.84), brassMaterial, [-0.94, 0.08, 0]);

            const createMysteryWingCrestHalfShape = (dir = 1, scale = 1) => {
                const mx = (x) => x * dir * scale;
                const my = (y) => y * scale;
                const shape = new THREE.Shape();
                shape.moveTo(0, my(-0.016));
                shape.bezierCurveTo(mx(0.08), my(0.064), mx(0.22), my(0.126), mx(0.4), my(0.12));
                shape.quadraticCurveTo(mx(0.31), my(0.026), mx(0.14), my(0.002));
                shape.quadraticCurveTo(mx(0.34), my(-0.058), mx(0.48), my(-0.16));
                shape.quadraticCurveTo(mx(0.26), my(-0.136), mx(0.096), my(-0.072));
                shape.quadraticCurveTo(mx(0.064), my(-0.118), mx(0), my(-0.15));
                shape.quadraticCurveTo(mx(-0.024), my(-0.068), mx(0), my(-0.016));
                shape.closePath();
                return shape;
            };
            const createMysteryWingCrestGeometry = (dir = 1, scale = 1) => {
                const depth = 0.024 * scale;
                const geometry = new THREE.ExtrudeGeometry(createMysteryWingCrestHalfShape(dir, scale), {
                    steps: 1,
                    depth,
                    bevelEnabled: true,
                    bevelSegments: 2,
                    bevelSize: 0.008 * scale,
                    bevelThickness: 0.006 * scale,
                    curveSegments: 18
                });
                geometry.translate(0, 0, -depth * 0.5);
                return geometry;
            };
            const wingCrestBaseGeometryLeft = createMysteryWingCrestGeometry(-1, 1);
            const wingCrestBaseGeometryRight = createMysteryWingCrestGeometry(1, 1);
            const wingCrestInsetGeometryLeft = createMysteryWingCrestGeometry(-1, 0.72);
            const wingCrestInsetGeometryRight = createMysteryWingCrestGeometry(1, 0.72);
            const createMysteryWingCrest = (sign) => {
                const crest = new THREE.Group();
                crest.position.set(0, 0.17, sign * 0.132);
                if (sign < 0) {
                    crest.rotation.y = Math.PI;
                }
                addMesh(crest, new RoundedBoxGeometry(0.2, 0.08, 0.026, 4, 0.014), brassMaterial, [0, -0.022, -0.004]);
                addMesh(crest, wingCrestBaseGeometryLeft, brassMaterial);
                addMesh(crest, wingCrestBaseGeometryRight, brassMaterial);
                addMesh(crest, wingCrestInsetGeometryLeft, runeMaterial, [0, 0.004, 0.018], null, {
                    skipShadow: true,
                    renderOrder: 6
                });
                addMesh(crest, wingCrestInsetGeometryRight, runeMaterial, [0, 0.004, 0.018], null, {
                    skipShadow: true,
                    renderOrder: 6
                });
                addMesh(crest, new THREE.OctahedronGeometry(0.052, 0), cornerGemMaterial, [0, -0.018, 0.034], [0, Math.PI / 4, 0], {
                    scale: [0.78, 1.12, 0.7],
                    skipShadow: true,
                    renderOrder: 6
                });
                registerOrnament(crest, {
                    style: 'crest',
                    bobAmp: 0.014,
                    swayAmp: 0.04,
                    swaySpeed: 0.76,
                    phaseOffset: sign > 0 ? 0.55 : 1.35
                });
                return crest;
            };

            const createFrontBackPiece = (sign) => {
                const piece = new THREE.Group();
                piece.position.set(0, 1.1, sign * 1.1);
                addMesh(piece, new RoundedBoxGeometry(2.2, 2.0, 0.18, 6, 0.07), shellMaterial);
                addMesh(piece, new RoundedBoxGeometry(1.44, 1.24, 0.06, 4, 0.035), panelMaterial, [0, 0.02, sign * 0.095]);
                addMesh(piece, new THREE.BoxGeometry(1.7, 0.08, 0.07), brassMaterial, [0, 0.73, sign * 0.108]);
                addMesh(piece, new THREE.BoxGeometry(1.7, 0.08, 0.07), brassMaterial, [0, -0.69, sign * 0.108]);
                addMesh(piece, new THREE.BoxGeometry(0.08, 1.42, 0.07), brassMaterial, [0.77, 0.02, sign * 0.108]);
                addMesh(piece, new THREE.BoxGeometry(0.08, 1.42, 0.07), brassMaterial, [-0.77, 0.02, sign * 0.108]);
                addMesh(piece, new THREE.BoxGeometry(0.058, 0.3, 0.03), seamMaterial, [0, 0.48, sign * 0.115]);
                addMesh(piece, new THREE.BoxGeometry(0.058, 0.44, 0.03), seamMaterial, [0, -0.12, sign * 0.115]);
                piece.add(createMysteryWingCrest(sign));
                if (sign > 0) {
                    addMesh(piece, new THREE.CylinderGeometry(0.12, 0.14, 0.05, 6), brassMaterial, [0, -0.34, 0.117], [Math.PI / 2, 0, 0]);
                }
                return piece;
            };

            const createSidePiece = (sign) => {
                const piece = new THREE.Group();
                piece.position.set(sign * 1.1, 1.1, 0);
                addMesh(piece, new RoundedBoxGeometry(0.18, 2.0, 2.2, 6, 0.07), shellMaterial);
                addMesh(piece, new RoundedBoxGeometry(0.06, 1.26, 1.38, 4, 0.03), panelMaterial, [sign * 0.095, 0.02, 0]);
                addMesh(piece, new THREE.BoxGeometry(0.07, 0.08, 1.72), brassMaterial, [sign * 0.108, 0.73, 0]);
                addMesh(piece, new THREE.BoxGeometry(0.07, 0.08, 1.72), brassMaterial, [sign * 0.108, -0.69, 0]);
                addMesh(piece, new THREE.BoxGeometry(0.07, 1.42, 0.08), brassMaterial, [sign * 0.108, 0.02, 0.77]);
                addMesh(piece, new THREE.BoxGeometry(0.07, 1.42, 0.08), brassMaterial, [sign * 0.108, 0.02, -0.77]);
                addMesh(piece, new THREE.BoxGeometry(0.03, 0.9, 0.34), seamMaterial, [sign * 0.116, 0.06, 0]);
                addMesh(piece, new THREE.TorusGeometry(0.26, 0.034, 10, 24), brassMaterial, [sign * 0.16, 0.08, 0], [0, Math.PI / 2, 0]);
                addMesh(piece, new THREE.CylinderGeometry(0.028, 0.028, 0.08, 10), steelMaterial, [sign * 0.118, 0.08, 0.13], [0, 0, Math.PI / 2]);
                addMesh(piece, new THREE.CylinderGeometry(0.028, 0.028, 0.08, 10), steelMaterial, [sign * 0.118, 0.08, -0.13], [0, 0, Math.PI / 2]);
                return piece;
            };

            const left = createSidePiece(-1);
            const right = createSidePiece(1);
            const front = createFrontBackPiece(1);
            const back = createFrontBackPiece(-1);
            bodyGroup.add(left);
            bodyGroup.add(right);
            bodyGroup.add(front);
            bodyGroup.add(back);

            const lidPivot = new THREE.Group();
            lidPivot.position.set(0, 2.1, -0.85);
            bodyGroup.add(lidPivot);

            const lid = new THREE.Group();
            lid.position.set(0, 0.11, 0.85);
            lidPivot.add(lid);
            addMesh(lid, new RoundedBoxGeometry(2.4, 0.22, 2.4, 8, 0.08), shellMaterial);
            addMesh(lid, new RoundedBoxGeometry(1.68, 0.1, 1.68, 6, 0.04), panelMaterial, [0, 0.12, 0]);
            addMesh(lid, new THREE.BoxGeometry(1.9, 0.08, 0.09), brassMaterial, [0, 0.12, 0.95]);
            addMesh(lid, new THREE.BoxGeometry(1.9, 0.08, 0.09), brassMaterial, [0, 0.12, -0.95]);
            addMesh(lid, new THREE.BoxGeometry(0.09, 0.08, 1.9), brassMaterial, [0.95, 0.12, 0]);
            addMesh(lid, new THREE.BoxGeometry(0.09, 0.08, 1.9), brassMaterial, [-0.95, 0.12, 0]);
            addMesh(lid, new THREE.CylinderGeometry(0.5, 0.58, 0.08, 8), brassMaterial, [0, 0.17, 0], [0, Math.PI / 8, 0]);
            addMesh(lid, new THREE.RingGeometry(0.16, 0.45, 32), runeMaterial, [0, 0.215, 0], [Math.PI / 2, 0, 0], {
                skipShadow: true,
                renderOrder: 6
            });
            addMesh(lid, new THREE.OctahedronGeometry(0.12, 0), cornerGemMaterial, [0, 0.25, 0]);
            addMesh(lid, new RoundedBoxGeometry(0.34, 0.44, 0.08, 4, 0.03), brassMaterial, [0, -0.04, 1.08]);
            addMesh(lid, new THREE.OctahedronGeometry(0.09, 0), cornerGemMaterial, [0, 0.02, 1.16]);
            addMesh(lid, new THREE.TorusGeometry(0.1, 0.018, 10, 24), brassMaterial, [0, -0.14, 1.17], [Math.PI / 2, 0, 0]);

            const createCornerCap = (x, y, z) => {
                const piece = new THREE.Group();
                piece.position.set(x, y, z);
                addMesh(piece, new RoundedBoxGeometry(0.24, 0.24, 0.24, 4, 0.04), brassMaterial);
                addMesh(piece, new THREE.OctahedronGeometry(0.08, 0), cornerGemMaterial, [Math.sign(x) * 0.075, 0.02, Math.sign(z) * 0.075]);
                return piece;
            };

            const cornerCaps = [
                createCornerCap(-1.08, 0.28, -1.08),
                createCornerCap(1.08, 0.28, -1.08),
                createCornerCap(-1.08, 0.28, 1.08),
                createCornerCap(1.08, 0.28, 1.08),
                createCornerCap(-1.08, 2.0, -1.08),
                createCornerCap(1.08, 2.0, -1.08),
                createCornerCap(-1.08, 2.0, 1.08),
                createCornerCap(1.08, 2.0, 1.08)
            ];
            cornerCaps.forEach((piece) => bodyGroup.add(piece));

            if (theme.ornamentStyle === 'light' && accentMetalMaterial && accentGlassMaterial) {
                registerOrnament(
                    addMesh(front, new THREE.IcosahedronGeometry(0.09, 0), accentGlassMaterial, [0, 0.2, 0.14], [0, Math.PI / 4, 0], {
                        skipShadow: true,
                        renderOrder: 6
                    }),
                    { style: 'crest', bobAmp: 0.022, swayAmp: 0.08, swaySpeed: 0.9, phaseOffset: 1.4 }
                );
                [
                    { piece: left, sign: -1, phase: 0.45 },
                    { piece: right, sign: 1, phase: 1.2 }
                ].forEach(({ piece, sign, phase }) => {
                    const wingCluster = new THREE.Group();
                    wingCluster.position.set(sign * 0.08, 0.3, 0);
                    piece.add(wingCluster);
                    addMesh(wingCluster, new THREE.CylinderGeometry(0.018, 0.018, 0.36, 8), accentMetalMaterial, [sign * -0.06, 0.05, 0], [0, 0, Math.PI / 2]);
                    addMesh(wingCluster, new THREE.OctahedronGeometry(0.11, 0), accentGlassMaterial, [sign * 0.16, 0.24, 0], [0, 0, sign * 0.48], {
                        scale: [0.42, 1.7, 0.72],
                        skipShadow: true,
                        renderOrder: 6
                    });
                    addMesh(wingCluster, new THREE.OctahedronGeometry(0.1, 0), accentGlassMaterial, [sign * 0.12, 0.06, 0.18], [0.12, 0, sign * 0.3], {
                        scale: [0.4, 1.5, 0.64],
                        skipShadow: true,
                        renderOrder: 6
                    });
                    addMesh(wingCluster, new THREE.OctahedronGeometry(0.1, 0), accentGlassMaterial, [sign * 0.12, 0.06, -0.18], [-0.12, 0, sign * 0.3], {
                        scale: [0.4, 1.5, 0.64],
                        skipShadow: true,
                        renderOrder: 6
                    });
                    registerOrnament(wingCluster, {
                        style: 'wing',
                        bobAmp: 0.026,
                        swayAmp: 0.12,
                        swaySpeed: 0.86,
                        rollAmp: 0.16,
                        phaseOffset: phase
                    });
                });
            }

            if (theme.ornamentStyle === 'dark' && accentMetalMaterial && accentGlassMaterial) {
                [
                    { x: -0.78, z: -0.56, tilt: 0.3, phase: 0.1 },
                    { x: 0.78, z: -0.56, tilt: -0.3, phase: 0.9 },
                    { x: -0.78, z: 0.56, tilt: 0.18, phase: 1.7 },
                    { x: 0.78, z: 0.56, tilt: -0.18, phase: 2.5 }
                ].forEach(({ x, z, tilt, phase }) => {
                    registerOrnament(
                        addMesh(lid, new THREE.ConeGeometry(0.074, 0.34, 6), accentMetalMaterial, [x, 0.3, z], [tilt, 0, x < 0 ? 0.38 : -0.38], {
                            scale: [0.9, 1.08, 0.9]
                        }),
                        { style: 'spire', pulseAmp: 0.12, swayAmp: 0.03, swaySpeed: 0.94, phaseOffset: phase }
                    );
                    registerOrnament(
                        addMesh(lid, new THREE.OctahedronGeometry(0.07, 0), accentGlassMaterial, [x * 0.9, 0.18, z * 0.9], [0, Math.PI / 4, 0], {
                            scale: [0.72, 1.08, 0.72],
                            skipShadow: true,
                            renderOrder: 6
                        }),
                        { style: 'emberGem', bobAmp: 0.014, swayAmp: 0.055, swaySpeed: 1.04, phaseOffset: phase + 0.4 }
                    );
                });
                registerOrnament(
                    addMesh(front, new THREE.BoxGeometry(0.36, 0.05, 0.03), accentMetalMaterial, [-0.22, 0.18, 0.135], [0, 0, 0.48]),
                    { style: 'crestSlash', pulseAmp: 0.08, swayAmp: 0.025, swaySpeed: 0.9, phaseOffset: 0.6 }
                );
                registerOrnament(
                    addMesh(front, new THREE.BoxGeometry(0.36, 0.05, 0.03), accentMetalMaterial, [0.22, 0.18, 0.135], [0, 0, -0.48]),
                    { style: 'crestSlash', pulseAmp: 0.08, swayAmp: 0.025, swaySpeed: 0.9, phaseOffset: 1.3 }
                );
                [
                    { piece: left, sign: -1, phase: 0.5 },
                    { piece: right, sign: 1, phase: 1.4 }
                ].forEach(({ piece, sign, phase }) => {
                    const bladeCluster = new THREE.Group();
                    bladeCluster.position.set(sign * 0.02, 0.14, 0);
                    piece.add(bladeCluster);
                    addMesh(bladeCluster, new THREE.BoxGeometry(0.03, 0.52, 0.12), accentMetalMaterial, [sign * 0.11, 0.16, 0.24], [0, 0, sign * -0.44]);
                    addMesh(bladeCluster, new THREE.BoxGeometry(0.03, 0.58, 0.12), accentMetalMaterial, [sign * 0.14, 0.14, 0], [0, 0, sign * -0.56]);
                    addMesh(bladeCluster, new THREE.BoxGeometry(0.03, 0.52, 0.12), accentMetalMaterial, [sign * 0.11, 0.16, -0.24], [0, 0, sign * -0.44]);
                    addMesh(bladeCluster, new THREE.OctahedronGeometry(0.08, 0), accentGlassMaterial, [sign * 0.16, 0.22, 0], [0, 0, sign * 0.24], {
                        scale: [0.5, 1.28, 0.64],
                        skipShadow: true,
                        renderOrder: 6
                    });
                    registerOrnament(bladeCluster, {
                        style: 'bladeFan',
                        bobAmp: 0.018,
                        swayAmp: 0.06,
                        swaySpeed: 0.92,
                        rollAmp: 0.08,
                        phaseOffset: phase
                    });
                });
            }

            const corePedestal = addMesh(bodyGroup, new RoundedBoxGeometry(0.88, 0.12, 0.88, 4, 0.04), steelMaterial, [0, 0.28, 0]);
            corePedestal.castShadow = true;

            const innerLight = new THREE.PointLight(
                theme.innerLightColor,
                theme.innerLightBaseIntensity ?? 1.15,
                theme.innerLightBaseDistance ?? 6.4,
                1.9
            );
            innerLight.position.set(0, 1.02, 0);
            innerLight.castShadow = false;
            bodyGroup.add(innerLight);

            const dustCount = 140;
            const dustGeometry = new THREE.BufferGeometry();
            const dustPositions = new Float32Array(dustCount * 3);
            const dustBase = new Float32Array(dustCount * 3);
            const dustPhase = new Float32Array(dustCount);
            for (let i = 0; i < dustCount; i++) {
                const i3 = i * 3;
                const r = 0.3 + Math.random() * 1.2;
                const a = Math.random() * Math.PI * 2;
                const y = 0.18 + Math.random() * 1.15;
                dustBase[i3] = Math.cos(a) * r;
                dustBase[i3 + 1] = y;
                dustBase[i3 + 2] = Math.sin(a) * r;
                dustPositions[i3] = dustBase[i3];
                dustPositions[i3 + 1] = dustBase[i3 + 1];
                dustPositions[i3 + 2] = dustBase[i3 + 2];
                dustPhase[i] = Math.random() * Math.PI * 2;
            }
            dustGeometry.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
            const dustMaterial = registerMaterial(new THREE.PointsMaterial({
                color: theme.dustColor,
                size: theme.dustSize ?? 0.1,
                transparent: true,
                opacity: 0,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            }));
            const dustPoints = new THREE.Points(dustGeometry, dustMaterial);
            dustPoints.visible = false;
            dustPoints.frustumCulled = false;
            bodyGroup.add(dustPoints);

            const sparkleEntries = [];
            if (theme.sparkles?.count) {
                const sparkleTexture = getMysterySparkleTexture(normalizedRarity, theme.sparkles.textureTint ?? theme.sparkles.color);
                const sparkleAnchor = new THREE.Group();
                sparkleAnchor.position.set(0, 1.2, 0);
                sparkleAnchor.frustumCulled = false;
                bodyGroup.add(sparkleAnchor);
                for (let i = 0; i < theme.sparkles.count; i += 1) {
                    const sparkleMaterial = registerMaterial(new THREE.SpriteMaterial({
                        map: sparkleTexture,
                        color: theme.sparkles.color,
                        transparent: true,
                        opacity: 0,
                        depthWrite: false,
                        blending: THREE.AdditiveBlending
                    }));
                    const sprite = new THREE.Sprite(sparkleMaterial);
                    sprite.frustumCulled = false;
                    sprite.renderOrder = 7;
                    const baseAngle = (i / theme.sparkles.count) * Math.PI * 2 + Math.random() * 0.55;
                    const orbitRadius = THREE.MathUtils.lerp(
                        theme.sparkles.orbitRadiusMin ?? 0.78,
                        theme.sparkles.orbitRadiusMax ?? 1.42,
                        Math.random()
                    );
                    const ellipse = 0.78 + Math.random() * 0.28;
                    const baseHeight = THREE.MathUtils.lerp(
                        theme.sparkles.heightMin ?? 0.16,
                        theme.sparkles.heightMax ?? 1.52,
                        Math.random()
                    );
                    const baseScale = THREE.MathUtils.lerp(
                        theme.sparkles.scaleMin ?? 0.18,
                        theme.sparkles.scaleMax ?? 0.33,
                        Math.random()
                    );
                    sprite.position.set(
                        Math.cos(baseAngle) * orbitRadius,
                        baseHeight,
                        Math.sin(baseAngle) * orbitRadius * ellipse
                    );
                    sprite.scale.set(baseScale, baseScale, 1);
                    sparkleAnchor.add(sprite);
                    sparkleEntries.push({
                        sprite,
                        material: sparkleMaterial,
                        style: theme.sparkles.style || 'orbit',
                        baseAngle,
                        orbitRadius,
                        ellipse,
                        baseHeight,
                        baseScale,
                        baseOpacity: THREE.MathUtils.lerp(
                            theme.sparkles.opacityMin ?? 0.22,
                            theme.sparkles.opacityMax ?? 0.5,
                            Math.random()
                        ),
                        bobAmplitude: THREE.MathUtils.lerp(
                            theme.sparkles.bobMin ?? 0.04,
                            theme.sparkles.bobMax ?? 0.12,
                            Math.random()
                        ),
                        bobSpeed: 0.9 + Math.random() * 1.2,
                        orbitSpeed: 0.42 + Math.random() * 0.8,
                        flickerSpeed: 1.8 + Math.random() * 2.5,
                        drift: 0.03 + Math.random() * 0.06,
                        radiusPulse: 0.02 + Math.random() * 0.06,
                        rotationSpeed: (Math.random() < 0.5 ? -1 : 1) * (0.4 + Math.random() * 0.7),
                        phase: Math.random() * Math.PI * 2,
                        liftInfluence: 0.18 + Math.random() * 0.3
                    });
                }
            }

            const burstPieces = [bottom, left, right, front, back, lid, ...cornerCaps];
            const burstStartPos = burstPieces.map((piece) => piece.position.clone());
            const burstStartRot = burstPieces.map((piece) => piece.rotation.clone());
            const burstDirs = burstPieces.map((piece) => {
                const dir = piece.position.clone();
                if (!Number.isFinite(dir.x) || !Number.isFinite(dir.y) || !Number.isFinite(dir.z) || dir.lengthSq() < 1e-6) {
                    dir.set(0, 1, 0);
                } else {
                    dir.normalize();
                }
                return dir;
            });

            boxGroup.userData = {
                lidPivot,
                lid,
                dustPoints,
                dustBase,
                dustPhase,
                burstPieces,
                burstStartPos,
                burstStartRot,
                burstDirs,
                glowMaterials: reactiveMaterials,
                innerLight,
                rarityKey: normalizedRarity,
                rarityTheme: theme,
                ornamentEntries,
                sparkleEntries,
                dustDefaultSize: theme.dustSize ?? 0.1
            };
            sanitizePreviewInvalidGeometry(boxGroup);
            syncMysteryShadowState(boxGroup);

            return boxGroup;
        }

        function createMysteryShadowTexture() {
            const blurPx = MYSTERY_BOX_CONFIG.shadowPngBlurPx ?? 0;
            const tex = new THREE.TextureLoader().load('./Images/PerfectBoxShadow.png', (loadedTex) => {
                if (!blurPx || blurPx <= 0) {
                    return;
                }
                const source = loadedTex.image;
                if (!source || !source.width || !source.height) {
                    return;
                }

                const canvas = document.createElement('canvas');
                canvas.width = source.width;
                canvas.height = source.height;
                const ctx = canvas.getContext('2d');
                if (!ctx) {
                    return;
                }
                ctx.filter = `blur(${blurPx}px)`;
                ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
                loadedTex.image = canvas;
                loadedTex.needsUpdate = true;
            });
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.wrapS = THREE.ClampToEdgeWrapping;
            tex.wrapT = THREE.ClampToEdgeWrapping;
            tex.generateMipmaps = false;
            tex.minFilter = THREE.LinearFilter;
            tex.magFilter = THREE.LinearFilter;
            return tex;
        }

        function createMysteryGroundShadows() {
            const coreTexture = createMysteryShadowTexture();
            const tailTexture = createMysteryShadowTexture();
            const contactTexture = createMysteryShadowTexture();
            const commonMatProps = {
                transparent: true,
                alphaTest: 0,
                depthWrite: false,
                depthTest: true,
                toneMapped: false,
                side: THREE.DoubleSide,
                polygonOffset: true,
                polygonOffsetFactor: -2,
                polygonOffsetUnits: -2
            };
            const core = new THREE.Mesh(
                new THREE.PlaneGeometry(1, 1),
                new THREE.MeshBasicMaterial({
                    map: coreTexture,
                    color: 0x000000,
                    opacity: MYSTERY_BOX_CONFIG.shadowCoreOpacity || 0.54,
                    ...commonMatProps
                })
            );
            const tail = new THREE.Mesh(
                new THREE.PlaneGeometry(1, 1),
                new THREE.MeshBasicMaterial({
                    map: tailTexture,
                    color: 0x000000,
                    opacity: MYSTERY_BOX_CONFIG.shadowTailOpacity || 0.38,
                    ...commonMatProps
                })
            );
            const contact = new THREE.Mesh(
                new THREE.PlaneGeometry(1, 1),
                new THREE.MeshBasicMaterial({
                    map: contactTexture,
                    color: 0x000000,
                    opacity: MYSTERY_BOX_CONFIG.shadowContactOpacity || 0.72,
                    ...commonMatProps
                })
            );
            core.renderOrder = 3;
            tail.renderOrder = 2;
            contact.renderOrder = 4;
            core.rotation.x = -Math.PI / 2;
            tail.rotation.x = -Math.PI / 2;
            contact.rotation.x = -Math.PI / 2;
            const shadowAspect = 290 / 177;
            const coreHeight = MYSTERY_BOX_CONFIG.shadowCoreSizeZ ?? 1.55;
            const tailHeight = MYSTERY_BOX_CONFIG.shadowTailSizeZ ?? 1.95;
            const contactHeight = MYSTERY_BOX_CONFIG.shadowContactSizeZ ?? 1.3;
            const shadowPngScale = MYSTERY_BOX_CONFIG.shadowPngScale ?? 1;
            const shadowPngScaleY = MYSTERY_BOX_CONFIG.shadowPngScaleY ?? 1;
            core.scale.set(coreHeight * shadowAspect * shadowPngScale, coreHeight * shadowPngScale * shadowPngScaleY, 1);
            tail.scale.set(tailHeight * shadowAspect * shadowPngScale, tailHeight * shadowPngScale * shadowPngScaleY, 1);
            contact.scale.set(contactHeight * shadowAspect * shadowPngScale, contactHeight * shadowPngScale * shadowPngScaleY, 1);
            return { core, tail, contact };
        }

        function clearMysteryGroundShadows() {
            const meshes = [mysteryState.shadowCore, mysteryState.shadowTail, mysteryState.shadowContact];
            for (const mesh of meshes) {
                if (!mesh) continue;
                scene.remove(mesh);
                if (mesh.material?.map) mesh.material.map.dispose();
                mesh.material?.dispose?.();
                mesh.geometry?.dispose?.();
            }
            mysteryState.shadowCore = null;
            mysteryState.shadowTail = null;
            mysteryState.shadowContact = null;
        }

        function updateMysteryGroundShadows(root) {
            const core = mysteryState.shadowCore;
            const tail = mysteryState.shadowTail;
            const contact = mysteryState.shadowContact;
            if (!root || !core || !tail || !contact) return;

            const scale = mysteryState.baseScale || 1;
            const casterHeight = root.position.y + 1.12 * scale;
            const heightAboveGround = Math.max(0, casterHeight - ground.position.y);
            const effectiveHeight = Math.min(6.5, heightAboveGround);
            const landingBaseY = Number.isFinite(mysteryState.landingY) ? mysteryState.landingY : root.position.y;
            const groundY = landingBaseY + (MYSTERY_BOX_CONFIG.shadowGroundLift ?? 0.028);
            const phaseFade = mysteryState.phase === 'cooldown'
                ? 1 - THREE.MathUtils.clamp(
                    mysteryState.timer / Math.max(0.01, MYSTERY_BOX_CONFIG.cleanupDuration || 1.35),
                    0,
                    1
                )
                : 1;
            const isFalling = mysteryState.phase === 'falling';
            const fallSpan = Math.max(0.4, mysteryState.startY - mysteryState.landingY);
            const dropProgress = isFalling
                ? THREE.MathUtils.clamp((mysteryState.startY - root.position.y) / fallSpan, 0, 1)
                : 1;
            const dropStart = MYSTERY_BOX_CONFIG.shadowDropInStart ?? 0.24;
            const dropFade = isFalling
                ? THREE.MathUtils.smoothstep(
                    dropStart,
                    1,
                    THREE.MathUtils.clamp(dropProgress, 0, 1)
                ) ** (MYSTERY_BOX_CONFIG.shadowDropInPower ?? 1.45)
                : 1;
            const dropMin = MYSTERY_BOX_CONFIG.shadowDropInMin ?? 0.08;
            const shadowIntroFade = THREE.MathUtils.lerp(dropMin, 1, dropFade);
            const heightFadeStrength = MYSTERY_BOX_CONFIG.shadowHeightFadeStrength ?? 0.082;
            const heightFade = THREE.MathUtils.clamp(1 - effectiveHeight * heightFadeStrength, 0.22, 1);
            const contactHeightFade = THREE.MathUtils.clamp(1 - effectiveHeight * (heightFadeStrength * 1.12), 0.3, 1);
            const landingBoostDuration = Math.max(0.001, MYSTERY_BOX_CONFIG.shadowLandingBoostDuration ?? 0.24);
            const landingBoostRaw = mysteryState.phase === 'landed'
                ? 1 - THREE.MathUtils.clamp(mysteryState.timer / landingBoostDuration, 0, 1)
                : 0;
            const landingBoost = landingBoostRaw * landingBoostRaw;
            const shadowClickFade = THREE.MathUtils.clamp(mysteryState.shadowFade ?? 1, 0, 1);

            const toCamera = new THREE.Vector3(
                camera.position.x - root.position.x,
                0,
                camera.position.z - root.position.z
            );
            if (toCamera.lengthSq() < 1e-6) {
                toCamera.set(0, 0, 1);
            } else {
                toCamera.normalize();
            }
            const edgeAnchorDistance = (MYSTERY_BOX_CONFIG.shadowEdgeAnchorTowardCamera ?? 0.98) * scale;
            const edgeX = root.position.x + toCamera.x * edgeAnchorDistance;
            const edgeZ = root.position.z + toCamera.z * edgeAnchorDistance;

            const castDir = new THREE.Vector3(
                MYSTERY_BOX_CONFIG.shadowDirectionX ?? -0.58,
                0,
                MYSTERY_BOX_CONFIG.shadowDirectionZ ?? 0.82
            );
            if (castDir.lengthSq() < 1e-6) {
                castDir.set(-0.58, 0, 0.82);
            } else {
                castDir.normalize();
            }

            const coreOffset = MYSTERY_BOX_CONFIG.shadowCoreOffset ?? 0;
            const tailOffset = (MYSTERY_BOX_CONFIG.shadowTailOffset ?? 0.08) + effectiveHeight * (MYSTERY_BOX_CONFIG.shadowDriftPerUnit ?? 0.14);
            const contactOffset = MYSTERY_BOX_CONFIG.shadowContactOffset ?? 0;
            const landedPhase = mysteryState.phase === 'landed';
            const landedYaw = Number.isFinite(mysteryState.landedYaw) ? mysteryState.landedYaw : root.rotation.y;
            const yawWiggle = landedPhase ? (root.rotation.y - landedYaw) : 0;
            const pitchWiggle = landedPhase ? root.rotation.x : 0;
            const rollWiggle = landedPhase ? root.rotation.z : 0;
            const wigglePositionStrength = (MYSTERY_BOX_CONFIG.shadowWigglePositionStrength ?? 0.9) * scale;
            const wiggleX = (rollWiggle * 1.06 + yawWiggle * 0.46) * wigglePositionStrength;
            const wiggleZ = (-pitchWiggle * 1.06 + yawWiggle * 0.34) * wigglePositionStrength;
            const wiggleTwist = (yawWiggle + rollWiggle * 0.42 - pitchWiggle * 0.24) *
                (MYSTERY_BOX_CONFIG.shadowWiggleTwistStrength ?? 1);

            core.position.set(edgeX + castDir.x * coreOffset + wiggleX, groundY, edgeZ + castDir.z * coreOffset + wiggleZ);
            tail.position.set(edgeX + castDir.x * tailOffset + wiggleX, groundY - 0.002, edgeZ + castDir.z * tailOffset + wiggleZ);
            contact.position.set(edgeX + castDir.x * contactOffset + wiggleX, groundY + 0.001, edgeZ + castDir.z * contactOffset + wiggleZ);
            core.rotation.set(-Math.PI / 2, 0, wiggleTwist);
            tail.rotation.set(-Math.PI / 2, 0, wiggleTwist);
            contact.rotation.set(-Math.PI / 2, 0, wiggleTwist);

            const coreLandingBoost = 1 + (MYSTERY_BOX_CONFIG.shadowLandingBoostCore ?? 0.2) * landingBoost;
            const tailLandingBoost = 1 + (MYSTERY_BOX_CONFIG.shadowLandingBoostTail ?? 0.12) * landingBoost;
            const contactLandingBoost = 1 + (MYSTERY_BOX_CONFIG.shadowLandingBoostContact ?? 0.24) * landingBoost;
            core.material.opacity = (MYSTERY_BOX_CONFIG.shadowCoreOpacity ?? 0.54) * coreLandingBoost * heightFade * phaseFade * shadowIntroFade * shadowClickFade;
            tail.material.opacity = (MYSTERY_BOX_CONFIG.shadowTailOpacity ?? 0.38) * tailLandingBoost * heightFade * phaseFade * shadowIntroFade * shadowClickFade;
            contact.material.opacity = (MYSTERY_BOX_CONFIG.shadowContactOpacity ?? 0.72) * contactLandingBoost * contactHeightFade * phaseFade * shadowIntroFade * shadowClickFade;
            core.visible = core.material.opacity > 0.004;
            tail.visible = tail.material.opacity > 0.004;
            contact.visible = contact.material.opacity > 0.004;
        }

        const PRIORITY_MYSTERY_REWARD_KEYS = Object.freeze([
            'blossomissWings',
            'canvasOfNavelleWings',
            'goddessOfValleysWings',
            'honeycombBloomsWings',
            'lavalcanoWings',
            'lightOfSmilesWings',
            'moonlightAmayaWings',
            'endlessWings',
            'emeraldCoenWings',
            'xatoriWings'
        ]);
        const MYSTERY_BOX_REWARD_KEYS = Object.freeze([
            'xatoriWings',
            'lightOfSmilesWings',
            'goddessOfValleysWings',
            'honeycombBloomsWings',
            'blossomissWings',
            'moonlightAmayaWings',
            'lavalcanoWings',
            'endlessWings',
            'emeraldCoenWings',
            'canvasOfNavelleWings',
            'rainbowWings',
            'alphaWings',
            'roboticWings',
            'efernoWings'
        ]);
        const MYSTERY_REWARD_RARITY_OVERRIDES = Object.freeze({
            xatoriWings: MYSTERY_BOX_RARITY.LEGENDARY_LIGHT,
            lightOfSmilesWings: MYSTERY_BOX_RARITY.LEGENDARY_LIGHT,
            goddessOfValleysWings: MYSTERY_BOX_RARITY.LEGENDARY_LIGHT,
            honeycombBloomsWings: MYSTERY_BOX_RARITY.LEGENDARY_LIGHT,
            blossomissWings: MYSTERY_BOX_RARITY.LEGENDARY_LIGHT,
            moonlightAmayaWings: MYSTERY_BOX_RARITY.LEGENDARY_DARK,
            lavalcanoWings: MYSTERY_BOX_RARITY.LEGENDARY_DARK,
            endlessWings: MYSTERY_BOX_RARITY.LEGENDARY_DARK,
            emeraldCoenWings: MYSTERY_BOX_RARITY.LEGENDARY_DARK,
            canvasOfNavelleWings: MYSTERY_BOX_RARITY.LEGENDARY_DARK,
            rainbowWings: MYSTERY_BOX_RARITY.LEGENDARY,
            alphaWings: MYSTERY_BOX_RARITY.RARE,
            roboticWings: MYSTERY_BOX_RARITY.RARE,
            efernoWings: MYSTERY_BOX_RARITY.COMMON
        });
        const MYSTERY_RARITY_SELECTION_ORDER = Object.freeze([
            MYSTERY_BOX_RARITY.COMMON,
            MYSTERY_BOX_RARITY.RARE,
            MYSTERY_BOX_RARITY.LEGENDARY,
            MYSTERY_BOX_RARITY.LEGENDARY_LIGHT,
            MYSTERY_BOX_RARITY.LEGENDARY_DARK
        ]);
        const MYSTERY_BOX_SUMMON_WEIGHTS = Object.freeze({
            [MYSTERY_BOX_RARITY.COMMON]: 40,
            [MYSTERY_BOX_RARITY.RARE]: 30,
            [MYSTERY_BOX_RARITY.LEGENDARY]: 20,
            [MYSTERY_BOX_RARITY.LEGENDARY_LIGHT]: 5,
            [MYSTERY_BOX_RARITY.LEGENDARY_DARK]: 5
        });

        function getMysteryWingRewardKeys() {
            const allowedKeys = new Set(MYSTERY_BOX_REWARD_KEYS);
            return Array.from(propRegistry.values())
                .filter((meta) => meta?.key && meta.category === 'wingSet' && allowedKeys.has(meta.key))
                .map((meta) => meta.key)
                .sort(comparePropCatalogOrder);
        }

        function createMysteryRewardRarityState(factory) {
            const state = {};
            MYSTERY_RARITY_SELECTION_ORDER.forEach((rarityKey, index) => {
                state[rarityKey] = factory(rarityKey, index);
            });
            return state;
        }

        function getMysteryRewardKeysByRarity() {
            const keysByRarity = createMysteryRewardRarityState(() => []);
            getMysteryWingRewardKeys().forEach((rewardKey) => {
                const rarityKey = getMysteryRewardBoxRarity(rewardKey);
                if (!Array.isArray(keysByRarity[rarityKey])) {
                    keysByRarity[rarityKey] = [];
                }
                keysByRarity[rarityKey].push(rewardKey);
            });
            MYSTERY_RARITY_SELECTION_ORDER.forEach((rarityKey) => {
                keysByRarity[rarityKey].sort(comparePropCatalogOrder);
            });
            return keysByRarity;
        }

        function normalizeMysteryRewardKeyList(list, availableSet) {
            if (!Array.isArray(list) || !(availableSet instanceof Set) || availableSet.size === 0) {
                return [];
            }
            const normalized = [];
            const seenKeys = new Set();
            for (const key of list) {
                if (typeof key !== 'string' || !availableSet.has(key) || seenKeys.has(key)) {
                    continue;
                }
                seenKeys.add(key);
                normalized.push(key);
            }
            return normalized;
        }

        function getMysteryRewardBoxRarity(rewardKey) {
            if (typeof rewardKey !== 'string' || !rewardKey) {
                return MYSTERY_BOX_RARITY.RARE;
            }
            return normalizeMysteryBoxRarity(MYSTERY_REWARD_RARITY_OVERRIDES[rewardKey]);
        }

        function shuffleMysteryRewardKeys(keys, blockedFirstKey = null) {
            const shuffled = Array.isArray(keys) ? [...keys] : [];
            for (let i = shuffled.length - 1; i > 0; i -= 1) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            if (blockedFirstKey && shuffled.length > 1 && shuffled[0] === blockedFirstKey) {
                const swapIndex = shuffled.findIndex((key) => key !== blockedFirstKey);
                if (swapIndex > 0) {
                    [shuffled[0], shuffled[swapIndex]] = [shuffled[swapIndex], shuffled[0]];
                }
            }
            return shuffled;
        }

        function readStoredMysteryRewardOrderState() {
            try {
                const raw = localStorage.getItem(MYSTERY_WING_ORDER_STORAGE_KEY);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                return parsed && typeof parsed === 'object' ? parsed : null;
            } catch (_) {
                return null;
            }
        }

        function persistMysteryRewardOrderState() {
            try {
                const queuesByRarity = createMysteryRewardRarityState((rarityKey) =>
                    Array.isArray(mysteryRewardOrderState.queuesByRarity?.[rarityKey])
                        ? [...mysteryRewardOrderState.queuesByRarity[rarityKey]]
                        : []
                );
                const seenByRarity = createMysteryRewardRarityState((rarityKey) =>
                    Array.isArray(mysteryRewardOrderState.seenByRarity?.[rarityKey])
                        ? [...mysteryRewardOrderState.seenByRarity[rarityKey]]
                        : []
                );
                const lastKeyByRarity = createMysteryRewardRarityState((rarityKey) =>
                    typeof mysteryRewardOrderState.lastKeyByRarity?.[rarityKey] === 'string'
                        ? mysteryRewardOrderState.lastKeyByRarity[rarityKey]
                        : null
                );
                localStorage.setItem(MYSTERY_WING_ORDER_STORAGE_KEY, JSON.stringify({
                    version: 2,
                    queuesByRarity,
                    seenByRarity,
                    lastKeyByRarity
                }));
            } catch (_) {}
        }

        function syncMysteryRewardOrderState() {
            const availableKeysByRarity = getMysteryRewardKeysByRarity();

            if (!mysteryRewardOrderState.loaded) {
                const storedState = readStoredMysteryRewardOrderState();
                mysteryRewardOrderState.queuesByRarity = createMysteryRewardRarityState((rarityKey) => {
                    const availableSet = new Set(availableKeysByRarity[rarityKey] || []);
                    return normalizeMysteryRewardKeyList(storedState?.queuesByRarity?.[rarityKey], availableSet);
                });
                mysteryRewardOrderState.seenByRarity = createMysteryRewardRarityState((rarityKey) => {
                    const availableSet = new Set(availableKeysByRarity[rarityKey] || []);
                    return normalizeMysteryRewardKeyList(storedState?.seenByRarity?.[rarityKey], availableSet);
                });
                mysteryRewardOrderState.lastKeyByRarity = createMysteryRewardRarityState((rarityKey) => {
                    const availableSet = new Set(availableKeysByRarity[rarityKey] || []);
                    const storedLastKey = storedState?.lastKeyByRarity?.[rarityKey];
                    return typeof storedLastKey === 'string' && availableSet.has(storedLastKey)
                        ? storedLastKey
                        : null;
                });
                mysteryRewardOrderState.loaded = true;
            }

            const queuesByRarity = createMysteryRewardRarityState((rarityKey) => {
                const availableKeys = availableKeysByRarity[rarityKey] || [];
                const availableSet = new Set(availableKeys);
                const queue = normalizeMysteryRewardKeyList(
                    mysteryRewardOrderState.queuesByRarity?.[rarityKey],
                    availableSet
                );
                const queueSet = new Set(queue);
                const seen = normalizeMysteryRewardKeyList(
                    (mysteryRewardOrderState.seenByRarity?.[rarityKey] || []).filter((key) => !queueSet.has(key)),
                    availableSet
                );
                const seenSet = new Set(seen);
                const missingKeys = availableKeys.filter((key) => !queueSet.has(key) && !seenSet.has(key));

                if (missingKeys.length) {
                    queue.push(...shuffleMysteryRewardKeys(missingKeys));
                }

                const lastKey = typeof mysteryRewardOrderState.lastKeyByRarity?.[rarityKey] === 'string' &&
                    availableSet.has(mysteryRewardOrderState.lastKeyByRarity[rarityKey])
                    ? mysteryRewardOrderState.lastKeyByRarity[rarityKey]
                    : null;

                if (!queue.length && availableKeys.length) {
                    queue.push(...shuffleMysteryRewardKeys(availableKeys, lastKey));
                    seen.length = 0;
                }

                return queue;
            });
            const seenByRarity = createMysteryRewardRarityState((rarityKey) => {
                const availableKeys = availableKeysByRarity[rarityKey] || [];
                const availableSet = new Set(availableKeys);
                const queueSet = new Set(queuesByRarity[rarityKey] || []);
                return normalizeMysteryRewardKeyList(
                    (mysteryRewardOrderState.seenByRarity?.[rarityKey] || []).filter((key) => !queueSet.has(key)),
                    availableSet
                );
            });
            const lastKeyByRarity = createMysteryRewardRarityState((rarityKey) => {
                const availableSet = new Set(availableKeysByRarity[rarityKey] || []);
                const lastKey = mysteryRewardOrderState.lastKeyByRarity?.[rarityKey];
                return typeof lastKey === 'string' && availableSet.has(lastKey) ? lastKey : null;
            });

            mysteryRewardOrderState.queuesByRarity = queuesByRarity;
            mysteryRewardOrderState.seenByRarity = seenByRarity;
            mysteryRewardOrderState.lastKeyByRarity = lastKeyByRarity;
            persistMysteryRewardOrderState();
            return {
                availableKeysByRarity,
                queuesByRarity,
                seenByRarity,
                lastKeyByRarity
            };
        }

        function pickMysteryRewardRarity(availableKeysByRarity) {
            const weightedRarities = [];
            let totalWeight = 0;

            MYSTERY_RARITY_SELECTION_ORDER.forEach((rarityKey) => {
                const availableKeys = availableKeysByRarity?.[rarityKey];
                if (!Array.isArray(availableKeys) || availableKeys.length === 0) {
                    return;
                }
                const weight = Number(MYSTERY_BOX_SUMMON_WEIGHTS[rarityKey]);
                if (!Number.isFinite(weight) || weight <= 0) {
                    return;
                }
                totalWeight += weight;
                weightedRarities.push({
                    rarityKey,
                    threshold: totalWeight
                });
            });

            if (!weightedRarities.length) {
                return MYSTERY_RARITY_SELECTION_ORDER.find((rarityKey) =>
                    Array.isArray(availableKeysByRarity?.[rarityKey]) && availableKeysByRarity[rarityKey].length > 0
                ) || MYSTERY_BOX_RARITY.RARE;
            }

            const roll = Math.random() * totalWeight;
            return weightedRarities.find((entry) => roll < entry.threshold)?.rarityKey
                || weightedRarities[weightedRarities.length - 1].rarityKey;
        }

        function pickMysteryRewardSelection() {
            const {
                availableKeysByRarity,
                queuesByRarity
            } = syncMysteryRewardOrderState();
            const rarityKey = pickMysteryRewardRarity(availableKeysByRarity);
            const rewardKey = queuesByRarity?.[rarityKey]?.[0] || availableKeysByRarity?.[rarityKey]?.[0] || null;
            if (!rewardKey) {
                return null;
            }
            return {
                rewardKey,
                rarityKey
            };
        }

        function pickMysteryRewardKeyForRarity(rarityKey) {
            const normalizedRarity = normalizeMysteryBoxRarity(rarityKey);
            const {
                availableKeysByRarity,
                queuesByRarity
            } = syncMysteryRewardOrderState();
            return queuesByRarity?.[normalizedRarity]?.[0] || availableKeysByRarity?.[normalizedRarity]?.[0] || null;
        }

        function pickMysteryRewardKey() {
            return pickMysteryRewardSelection()?.rewardKey || null;
        }

        function markMysteryRewardKeySummoned(rewardKey) {
            if (typeof rewardKey !== 'string' || !rewardKey) {
                return null;
            }
            const rarityKey = getMysteryRewardBoxRarity(rewardKey);
            const availableKeys = getMysteryRewardKeysByRarity()[rarityKey] || [];
            const availableSet = new Set(availableKeys);
            if (!availableSet.has(rewardKey)) {
                return null;
            }

            syncMysteryRewardOrderState();

            const queue = normalizeMysteryRewardKeyList(mysteryRewardOrderState.queuesByRarity?.[rarityKey], availableSet);
            const seen = normalizeMysteryRewardKeyList(mysteryRewardOrderState.seenByRarity?.[rarityKey], availableSet)
                .filter((key) => key !== rewardKey);
            const rewardIndex = queue.indexOf(rewardKey);
            if (rewardIndex >= 0) {
                queue.splice(rewardIndex, 1);
            }
            seen.push(rewardKey);

            mysteryRewardOrderState.lastKeyByRarity[rarityKey] = rewardKey;
            if (queue.length === 0 && availableKeys.length) {
                mysteryRewardOrderState.queuesByRarity[rarityKey] = shuffleMysteryRewardKeys(availableKeys, rewardKey);
                mysteryRewardOrderState.seenByRarity[rarityKey] = [];
            } else {
                mysteryRewardOrderState.queuesByRarity[rarityKey] = queue;
                mysteryRewardOrderState.seenByRarity[rarityKey] = seen;
            }
            persistMysteryRewardOrderState();
            return pickMysteryRewardSelection()?.rewardKey || null;
        }

        function cacheMysteryRewardPreviewBuild(propKey) {
            if (!propKey) {
                return null;
            }
            const cached = mysteryState.preloadedPreview;
            if (cached?.propKey === propKey && cached?.object) {
                return cached;
            }
            const source = getItemByPropKey(propKey);
            if (!source) {
                mysteryState.preloadedPreview = null;
                return null;
            }
            const previewReadyPromise = getPropPreviewReadyPromise(source);
            if (previewReadyPromise) {
                void previewReadyPromise.then(async () => {
                    await waitForPreviewRenderTick();
