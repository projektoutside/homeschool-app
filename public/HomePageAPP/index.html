                applyMysteryDeviceTiltPermissionStatus(permission, {
                    listening: Boolean(data.listening),
                    resetCalibration: shouldResetCalibration
                });
                return;
            }

            if (data.type !== MYSTERY_DEVICE_TILT_SAMPLE_MESSAGE) {
                return;
            }

            const shouldResetCalibration =
                mysteryDeviceTilt.permission !== 'granted' || !mysteryDeviceTilt.listening;
            applyMysteryDeviceTiltPermissionStatus('granted', {
                listening: true,
                resetCalibration: shouldResetCalibration
            });
            applyMysteryDeviceTiltSample(data.beta, data.gamma);
        }

        function shouldRequestMysteryDeviceTiltPermissionOnTap() {
            if (mysteryDeviceTilt.listening || mysteryDeviceTilt.permission === 'denied') {
                return false;
            }

            const bridge = getMysteryDeviceTiltBridge();
            if (bridge) {
                try {
                    const bridgeState = bridge.getState();
                    if (bridgeState?.permission === 'prompt') {
                        return true;
                    }
                    if (bridgeState?.permission === 'granted') {
                        return false;
                    }
                } catch (_) {}
            }

            if (mysteryDeviceTilt.permission === 'prompt') {
                return true;
            }

            return (
                mysteryDeviceTilt.permission === 'unknown' &&
                typeof window.DeviceOrientationEvent?.requestPermission === 'function'
            );
        }

        function startMysteryDeviceTiltTracking() {
            if (typeof window.DeviceOrientationEvent === 'undefined' || mysteryDeviceTilt.listening) {
                return;
            }
            window.addEventListener('deviceorientation', handleMysteryDeviceOrientation, { passive: true });
            applyMysteryDeviceTiltPermissionStatus('granted', {
                listening: true,
                resetCalibration: true
            });
        }

        async function ensureMysteryDeviceTiltPermission({ userGesture = false } = {}) {
            const bridge = getMysteryDeviceTiltBridge();
            if (bridge) {
                const syncBridgeState = (state, fallbackListening = false) => {
                    if (!state || typeof state !== 'object') {
                        return;
                    }
                    const permission = typeof state.permission === 'string' ? state.permission : 'unknown';
                    const listening = permission === 'granted'
                        ? Boolean(state.listening || fallbackListening)
                        : false;
                    const shouldResetCalibration =
                        permission === 'granted' &&
                        (mysteryDeviceTilt.permission !== 'granted' || !mysteryDeviceTilt.listening);
                    applyMysteryDeviceTiltPermissionStatus(permission, {
                        listening,
                        resetCalibration: shouldResetCalibration
                    });
                };

                try {
                    syncBridgeState(bridge.getState());
                    const started = await bridge.ensureStarted({ userGesture });
                    syncBridgeState(bridge.getState(), started);
                    return mysteryDeviceTilt.permission === 'granted';
                } catch (_) {}
            } else if (window.parent !== window) {
                postMysteryDeviceTiltBridgeMessage(
                    userGesture
                        ? MYSTERY_DEVICE_TILT_PERMISSION_REQUEST_MESSAGE
                        : MYSTERY_DEVICE_TILT_SYNC_REQUEST_MESSAGE
                );
            }

            if (!refreshMysteryDeviceTiltSupport()) {
                mysteryDeviceTilt.permission = 'unsupported';
                return false;
            }
            if (!window.isSecureContext) {
                mysteryDeviceTilt.permission = 'blocked';
                return false;
            }
            if (mysteryDeviceTilt.permission === 'denied') {
                return false;
            }
            if (mysteryDeviceTilt.listening) {
                return true;
            }

            const deviceOrientationCtor = window.DeviceOrientationEvent;
            const requestPermission = deviceOrientationCtor?.requestPermission;
            if (typeof requestPermission === 'function') {
                if (!userGesture) {
                    mysteryDeviceTilt.permission = 'prompt';
                    return false;
                }
                try {
                    const result = await requestPermission.call(deviceOrientationCtor);
                    mysteryDeviceTilt.permission = result === 'granted' ? 'granted' : 'denied';
                } catch (_) {
                    mysteryDeviceTilt.permission = 'denied';
                    return false;
                }
            } else {
                mysteryDeviceTilt.permission = 'granted';
            }

            if (mysteryDeviceTilt.permission !== 'granted') {
                return false;
            }

            startMysteryDeviceTiltTracking();
            return true;
        }

        window.addEventListener('message', handleMysteryDeviceTiltBridgeMessage);

        function shouldApplyMysteryDeviceTilt() {
            if (!mysteryDeviceTilt.supported || mysteryDeviceTilt.permission !== 'granted') {
                return false;
            }
            const hasRecentSample =
                mysteryDeviceTilt.lastSampleAt > 0 &&
                (performance.now() - mysteryDeviceTilt.lastSampleAt) <= MYSTERY_DEVICE_TILT_CONFIG.idleTimeoutMs;
            if (!hasRecentSample || mysteryDeviceTilt.needsCalibration) {
                return false;
            }
            if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                return false;
            }
            const tiltAllowedPhase =
                mysterySignSlingshotState.phase === 'idle' ||
                mysterySignSlingshotState.phase === 'drag';
            if (!tiltAllowedPhase) {
                return false;
            }
            if (document.body.classList.contains('inventory-open')) {
                return false;
            }
            return (performance.now() - mysteryDeviceTilt.lastSampleAt) <= MYSTERY_DEVICE_TILT_CONFIG.idleTimeoutMs;
        }

        function sampleMysteryDeviceTilt(dt) {
            const safeDt = Number.isFinite(dt) && dt > 0 ? dt : (1 / 60);
            let targetRollDeg = 0;
            let targetPitchDeg = 0;
            const hasRecentSample =
                mysteryDeviceTilt.lastSampleAt > 0 &&
                (performance.now() - mysteryDeviceTilt.lastSampleAt) <= MYSTERY_DEVICE_TILT_CONFIG.idleTimeoutMs;
            if (!hasRecentSample) {
                mysteryDeviceTilt.active = false;
            }

            if (shouldApplyMysteryDeviceTilt()) {
                targetRollDeg = THREE.MathUtils.clamp(
                    mysteryDeviceTilt.rawRollDeg - mysteryDeviceTilt.baselineRollDeg,
                    -MYSTERY_DEVICE_TILT_CONFIG.maxRollDeg,
                    MYSTERY_DEVICE_TILT_CONFIG.maxRollDeg
                );
                targetPitchDeg = THREE.MathUtils.clamp(
                    mysteryDeviceTilt.rawPitchDeg - mysteryDeviceTilt.baselinePitchDeg,
                    -MYSTERY_DEVICE_TILT_CONFIG.maxPitchDeg,
                    MYSTERY_DEVICE_TILT_CONFIG.maxPitchDeg
                );
            }

            const followAlpha = 1 - Math.exp(-MYSTERY_DEVICE_TILT_CONFIG.motionSmoothing * safeDt);
            mysteryDeviceTilt.rollDeg += (targetRollDeg - mysteryDeviceTilt.rollDeg) * followAlpha;
            mysteryDeviceTilt.pitchDeg += (targetPitchDeg - mysteryDeviceTilt.pitchDeg) * followAlpha;

            return {
                rollRad: THREE.MathUtils.degToRad(mysteryDeviceTilt.rollDeg),
                pitchRad: THREE.MathUtils.degToRad(mysteryDeviceTilt.pitchDeg)
            };
        }

        function buildMysteryHangingSignPath(points) {
            if (!points || points.length === 0) return '';
            let path = `M ${points[0].x.toFixed(2)} ${points[0].y.toFixed(2)}`;
            if (points.length === 1) return path;
            for (let i = 1; i < points.length - 1; i++) {
                const xc = (points[i].x + points[i + 1].x) * 0.5;
                const yc = (points[i].y + points[i + 1].y) * 0.5;
                path += ` Q ${points[i].x.toFixed(2)} ${points[i].y.toFixed(2)} ${xc.toFixed(2)} ${yc.toFixed(2)}`;
            }
            const last = points[points.length - 1];
            path += ` T ${last.x.toFixed(2)} ${last.y.toFixed(2)}`;
            return path;
        }

        function getMysteryHangingSignDragTarget() {
            if (
                !mysteryHangingSign.enabled ||
                mysterySignSlingshotState.phase !== 'drag' ||
                !mysteryHangingSign.nodes.length
            ) {
                return null;
            }

            const segmentCount = Math.max(1, MYSTERY_HANGING_SIGN_CONFIG.segmentCount);
            const tipNode = mysteryHangingSign.nodes[segmentCount] || mysteryHangingSign.nodes[mysteryHangingSign.nodes.length - 1];
            const pullOffset = THREE.MathUtils.clamp(
                mysterySignSlingshotState.pullOffset,
                0,
                MYSTERY_SIGN_SLINGSHOT_CONFIG.maxPullPx
            );
            const tipX = Number.isFinite(mysterySignSlingshotState.dragBaseTipX)
                ? mysterySignSlingshotState.dragBaseTipX
                : (Number.isFinite(tipNode?.x) ? tipNode.x : mysteryHangingSign.anchorX);
            const baseTipY = Number.isFinite(mysterySignSlingshotState.dragBaseTipY)
                ? mysterySignSlingshotState.dragBaseTipY
                : (
                    Number.isFinite(tipNode?.y)
                        ? tipNode.y
                        : (mysteryHangingSign.anchorY + mysteryHangingSign.ropeLength)
                );

            return {
                tipX,
                tipY: baseTipY + pullOffset,
                pullOffset,
                effectiveSegmentLength: Math.max(
                    0.0001,
                    (mysteryHangingSign.ropeLength + pullOffset) / segmentCount
                )
            };
        }

        function syncMysteryHangingSignDom() {
            if (!mysteryHangingSign.enabled) return;
            const nodes = mysteryHangingSign.nodes;
            if (!nodes.length) return;

            const signLift = Number.isFinite(mysterySignSlingshotState?.launchOffset) ? mysterySignSlingshotState.launchOffset : 0;
            const pathPoints = signLift < 0
                ? nodes.map((node) => ({
                    x: node.x,
                    y: node.y + signLift
                }))
                : nodes;

            mysteryHangingSignPath.setAttribute('d', buildMysteryHangingSignPath(pathPoints));
            mysteryHangingSignAnchor.setAttribute('cx', mysteryHangingSign.anchorX.toFixed(2));
            mysteryHangingSignAnchor.setAttribute('cy', mysteryHangingSign.anchorY.toFixed(2));
            mysteryHangingSignAnchor.setAttribute(
                'r',
                THREE.MathUtils.clamp(window.innerWidth * 0.0044, 2.5, 4.8).toFixed(2)
            );

            const tip = pathPoints[pathPoints.length - 1];
            const knotWidth = mysterySignKnot.offsetWidth || THREE.MathUtils.clamp(window.innerWidth * 0.015, 12, 20);
            const knotHeight = mysterySignKnot.offsetHeight || THREE.MathUtils.clamp(window.innerWidth * 0.013, 10, 17);
            const signWidth = mysteryScrollSign.offsetWidth || THREE.MathUtils.clamp(window.innerWidth * 0.2267, 200, 328);
            const signHeight = mysteryScrollSign.offsetHeight || THREE.MathUtils.clamp(window.innerWidth * 0.1867, 158, 265);
            const attachXNorm = mysteryScroll3D.attachmentXNorm || 0.5;
            const attachYNorm = mysteryScroll3D.attachmentYNorm || 0.18;
            const knotLeft = tip.x - knotWidth * 0.5;
            const signLeft = tip.x - signWidth * attachXNorm;
            const signTop = tip.y - signHeight * attachYNorm;
            const knotTop = tip.y - knotHeight * 0.62;
            const swingTransform = `perspective(1400px) rotateX(${mysteryHangingSign.pitch.toFixed(4)}rad) rotateZ(${mysteryHangingSign.angle.toFixed(4)}rad)`;
            mysterySignKnot.style.left = `${knotLeft.toFixed(2)}px`;
            mysterySignKnot.style.top = `${knotTop.toFixed(2)}px`;
            mysterySignKnot.style.transform = swingTransform;
            mysteryScrollSign.style.left = `${signLeft.toFixed(2)}px`;
            mysteryScrollSign.style.top = `${signTop.toFixed(2)}px`;
            mysteryScrollSign.style.transform = swingTransform;

            const hasFinitePlacement =
                Number.isFinite(knotLeft) &&
                Number.isFinite(knotTop) &&
                Number.isFinite(signLeft) &&
                Number.isFinite(signTop) &&
                signWidth > 0 &&
                signHeight > 0;
            if (hasFinitePlacement) {
                revealMysterySignLayer();
            }
        }

        function layoutMysteryHangingSign(forceReset = false) {
            if (!mysteryHangingSign.enabled) return;

            const segmentCount = MYSTERY_HANGING_SIGN_CONFIG.segmentCount;
            const width = window.innerWidth;
            const height = window.innerHeight;
            const aspect = width / Math.max(1, height);
            const landscapeBlend = THREE.MathUtils.clamp((aspect - 1.02) / 1.0, 0, 1);
            const shortLandscapeBlend = landscapeBlend * THREE.MathUtils.clamp((560 - height) / 160, 0, 1);
            const safeTopInset = window.visualViewport?.offsetTop || 0;
            const offscreenLift = Math.max(
                MYSTERY_HANGING_SIGN_CONFIG.anchorOffscreenMin,
                height * MYSTERY_HANGING_SIGN_CONFIG.anchorOffscreenViewportRatio
            );
            const nextAnchorX = width * 0.5;
            const nextAnchorY = safeTopInset - offscreenLift;
            const ropeLengthViewportRatio = THREE.MathUtils.lerp(
                MYSTERY_HANGING_SIGN_CONFIG.ropeLengthViewportRatio,
                0.125,
                shortLandscapeBlend
            );
            const minRopeLength = THREE.MathUtils.lerp(
                MYSTERY_HANGING_SIGN_CONFIG.minRopeLength,
                72,
                shortLandscapeBlend
            );
            const maxRopeLength = THREE.MathUtils.lerp(
                MYSTERY_HANGING_SIGN_CONFIG.maxRopeLength,
                160,
                shortLandscapeBlend
            );
            const visibleRopeLength = THREE.MathUtils.clamp(
                height * ropeLengthViewportRatio,
                minRopeLength,
                maxRopeLength
            );
            const nextRopeLength = visibleRopeLength + offscreenLift;
            const nextSegmentLength = nextRopeLength / segmentCount;

            const hasNodes = mysteryHangingSign.nodes.length === segmentCount + 1 &&
                mysteryHangingSign.prevNodes.length === segmentCount + 1;
            const sizeChanged = width !== mysteryHangingSign.viewportWidth ||
                height !== mysteryHangingSign.viewportHeight ||
                Math.abs(nextSegmentLength - mysteryHangingSign.segmentLength) > 0.01;
            const needsReset = forceReset || !hasNodes || sizeChanged;

            const prevAnchorX = mysteryHangingSign.anchorX;
            const prevAnchorY = mysteryHangingSign.anchorY;

            mysteryHangingSign.anchorX = nextAnchorX;
            mysteryHangingSign.anchorY = nextAnchorY;
            mysteryHangingSign.ropeLength = nextRopeLength;
            mysteryHangingSign.segmentLength = nextSegmentLength;
            mysteryHangingSign.viewportWidth = width;
            mysteryHangingSign.viewportHeight = height;
            mysteryHangingSignSvg.setAttribute('viewBox', `0 0 ${width} ${height}`);
            mysteryHangingSignSvg.setAttribute('preserveAspectRatio', 'none');
            resizeMysteryScroll3D();

            if (!hasNodes) {
                mysteryHangingSign.nodes = Array.from({ length: segmentCount + 1 }, () => ({ x: 0, y: 0 }));
                mysteryHangingSign.prevNodes = Array.from({ length: segmentCount + 1 }, () => ({ x: 0, y: 0 }));
            }

            if (needsReset) {
                for (let i = 0; i <= segmentCount; i++) {
                    const nodeY = nextAnchorY + nextSegmentLength * i;
                    const swaySeed = Math.sin(i * 0.55) * 0.85;
                    mysteryHangingSign.nodes[i].x = nextAnchorX + swaySeed;
                    mysteryHangingSign.nodes[i].y = nodeY;
                    mysteryHangingSign.prevNodes[i].x = nextAnchorX + swaySeed;
                    mysteryHangingSign.prevNodes[i].y = nodeY;
                }
                mysteryHangingSign.angle = 0;
                mysteryHangingSign.pitch = 0;
                mysteryHangingSign.angularVelocity = 0;
            } else {
                const shiftX = nextAnchorX - prevAnchorX;
                const shiftY = nextAnchorY - prevAnchorY;
                for (let i = 0; i <= segmentCount; i++) {
                    mysteryHangingSign.nodes[i].x += shiftX;
                    mysteryHangingSign.nodes[i].y += shiftY;
                    mysteryHangingSign.prevNodes[i].x += shiftX;
                    mysteryHangingSign.prevNodes[i].y += shiftY;
                }
            }

            syncMysteryHangingSignDom();
        }

        function updateMysteryHangingSign(dt, t) {
            if (!mysteryHangingSign.enabled) return;
            if (!mysteryHangingSign.nodes.length) {
                layoutMysteryHangingSign(true);
            }

            const stepDt = Math.min(Math.max(dt, 1 / 240), 1 / 24);
            const nodes = mysteryHangingSign.nodes;
            const prevNodes = mysteryHangingSign.prevNodes;
            const segmentCount = MYSTERY_HANGING_SIGN_CONFIG.segmentCount;
            const dragTarget = getMysteryHangingSignDragTarget();
            const isDraggingSign = Boolean(dragTarget);
            const activeSegmentLength = dragTarget?.effectiveSegmentLength ?? mysteryHangingSign.segmentLength;
            const deviceTilt = sampleMysteryDeviceTilt(stepDt);

            const windBase =
                Math.sin(t * 0.42 + 0.4) * 0.66 +
                Math.sin(t * 0.97 + 1.7) * 0.26 +
                Math.sin(t * 2.2 + 0.9) * 0.08;
            const gustCarrier = isDraggingSign ? 0 : Math.max(0, Math.sin(t * 0.15 - 0.52));
            const gust = gustCarrier * gustCarrier * MYSTERY_HANGING_SIGN_CONFIG.windGustForce;
            const tiltGravityInfluence = isDraggingSign
                ? MYSTERY_DEVICE_TILT_CONFIG.dragGravityInfluence
                : MYSTERY_DEVICE_TILT_CONFIG.gravityInfluence;
            const tiltLateralAcceleration =
                Math.sin(deviceTilt.rollRad) *
                MYSTERY_HANGING_SIGN_CONFIG.gravity *
                tiltGravityInfluence;
            const lateralAcceleration = isDraggingSign
                ? tiltLateralAcceleration
                : (
                    windBase * MYSTERY_HANGING_SIGN_CONFIG.windLateralForce +
                    gust +
                    tiltLateralAcceleration
                );

            const damping = Math.pow(MYSTERY_HANGING_SIGN_CONFIG.damping, stepDt * 60);
            const gravityStep = MYSTERY_HANGING_SIGN_CONFIG.gravity * stepDt * stepDt;

            nodes[0].x = mysteryHangingSign.anchorX;
            nodes[0].y = mysteryHangingSign.anchorY;
            prevNodes[0].x = mysteryHangingSign.anchorX;
            prevNodes[0].y = mysteryHangingSign.anchorY;

            for (let i = 1; i <= segmentCount; i++) {
                const node = nodes[i];
                const previous = prevNodes[i];
                if (isDraggingSign && i === segmentCount) {
                    node.x = dragTarget.tipX;
                    node.y = dragTarget.tipY;
                    previous.x = dragTarget.tipX;
                    previous.y = dragTarget.tipY;
                    continue;
                }
                const currentX = node.x;
                const currentY = node.y;
                const velX = (node.x - previous.x) * damping;
                const velY = (node.y - previous.y) * damping;
                previous.x = currentX;
                previous.y = currentY;
                const windInfluence = 0.34 + (i / segmentCount) * 0.96;
                node.x = currentX + velX + lateralAcceleration * windInfluence * stepDt * stepDt;
                node.y = currentY + velY + gravityStep;
            }
            if (!isDraggingSign) {
                nodes[segmentCount].y += gravityStep * 1.35;
            }

            for (let iteration = 0; iteration < MYSTERY_HANGING_SIGN_CONFIG.solverIterations; iteration++) {
                nodes[0].x = mysteryHangingSign.anchorX;
                nodes[0].y = mysteryHangingSign.anchorY;
                if (isDraggingSign) {
                    nodes[segmentCount].x = dragTarget.tipX;
                    nodes[segmentCount].y = dragTarget.tipY;
                    prevNodes[segmentCount].x = dragTarget.tipX;
                    prevNodes[segmentCount].y = dragTarget.tipY;
                }
                for (let i = 1; i <= segmentCount; i++) {
                    const p1 = nodes[i - 1];
                    const p2 = nodes[i];
                    const dx = p2.x - p1.x;
                    const dy = p2.y - p1.y;
                    const distance = Math.max(0.0001, Math.hypot(dx, dy));
                    const diff = (distance - activeSegmentLength) / distance;

                    if (i === 1) {
                        p2.x -= dx * diff;
                        p2.y -= dy * diff;
                    } else if (isDraggingSign && i === segmentCount) {
                        p1.x += dx * diff;
                        p1.y += dy * diff;
                    } else {
                        const correctionX = dx * diff * 0.5;
                        const correctionY = dy * diff * 0.5;
                        p1.x += correctionX;
                        p1.y += correctionY;
                        p2.x -= correctionX;
                        p2.y -= correctionY;
                    }
                }
            }

            const tip = nodes[segmentCount];
            const neck = nodes[segmentCount - 1] || tip;
            const ropeLean = Math.atan2(tip.x - neck.x, tip.y - neck.y);
            if (isDraggingSign) {
                mysteryHangingSign.angularVelocity *= Math.max(0, 1 - stepDt * 12);
            }
            const windTorque = isDraggingSign
                ? 0
                : (lateralAcceleration / Math.max(1, MYSTERY_HANGING_SIGN_CONFIG.windLateralForce)) * 0.35;
            const tiltTorque = deviceTilt.rollRad * (
                isDraggingSign
                    ? MYSTERY_DEVICE_TILT_CONFIG.dragTorqueInfluence
                    : MYSTERY_DEVICE_TILT_CONFIG.torqueInfluence
            );
            const gravityTorque = -Math.sin(mysteryHangingSign.angle) * 7.05;
            const alignmentTorque =
                (ropeLean * 0.92 - mysteryHangingSign.angle) *
                (isDraggingSign
                    ? MYSTERY_HANGING_SIGN_CONFIG.angularStiffness * 1.18
                    : MYSTERY_HANGING_SIGN_CONFIG.angularStiffness);
            const dampingTorque =
                -mysteryHangingSign.angularVelocity *
                (isDraggingSign
                    ? MYSTERY_HANGING_SIGN_CONFIG.angularDamping * 2.2
                    : MYSTERY_HANGING_SIGN_CONFIG.angularDamping);
            const angularAcceleration = gravityTorque + alignmentTorque + dampingTorque + windTorque + tiltTorque;
            mysteryHangingSign.angularVelocity += angularAcceleration * stepDt;
            mysteryHangingSign.angularVelocity = THREE.MathUtils.clamp(mysteryHangingSign.angularVelocity, -2.4, 2.4);
            mysteryHangingSign.angle += mysteryHangingSign.angularVelocity * stepDt;
            mysteryHangingSign.angle = THREE.MathUtils.clamp(mysteryHangingSign.angle, -0.62, 0.62);

            const depthTarget = THREE.MathUtils.clamp(
                ((tip.y - neck.y) - activeSegmentLength) * -0.052 +
                (tip.x - prevNodes[segmentCount].x) * 0.016 -
                Math.sin(deviceTilt.pitchRad) * (
                    isDraggingSign
                        ? MYSTERY_DEVICE_TILT_CONFIG.dragPitchInfluence
                        : MYSTERY_DEVICE_TILT_CONFIG.pitchInfluence
                ),
                -0.16,
                0.12
            );
            mysteryHangingSign.pitch += (depthTarget - mysteryHangingSign.pitch) * Math.min(1, stepDt * 5.8);

            advanceMysterySignSlingshotFlight(dt);
            syncMysteryHangingSignDom();
            renderMysteryScroll3D(t);
        }

        function intersectObjectsAt(clientX, clientY, objects, recursive = true) {
            if (!objects) return [];
            const objectList = Array.isArray(objects) ? objects : [objects];
            if (!objectList.length) return [];

            pointerNdc.x = (clientX / window.innerWidth) * 2 - 1;
            pointerNdc.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(pointerNdc, camera);
            return raycaster.intersectObjects(objectList, recursive);
        }

        function intersectsCharacterAt(clientX, clientY) {
            return intersectObjectsAt(clientX, clientY, characterHitMeshes, false).length > 0;
        }

        function isPointOnMysteryScrollSign(clientX, clientY) {
            if (!mysteryScrollSign) return false;
            if (document.body.classList.contains('inventory-open')) return false;
            if (previewState?.open || propPreviewPanel?.classList?.contains('open') || propPreviewOverlay?.classList?.contains('open')) {
                return false;
            }
            if (mysteryHangingSignLayer) {
                const layerStyle = getComputedStyle(mysteryHangingSignLayer);
                if (!layerStyle || layerStyle.visibility === 'hidden' || Number(layerStyle.opacity) <= 0.01) {
                    return false;
                }
            }
            const rect = mysteryScrollSign.getBoundingClientRect();
            if (!rect || rect.width <= 0 || rect.height <= 0) {
                return false;
            }
            return (
                clientX >= rect.left &&
                clientX <= rect.right &&
                clientY >= rect.top &&
                clientY <= rect.bottom
            );
        }

        window.addEventListener('pointermove', (e) => {
            if (mysterySignSlingshotState.active && (
                mysterySignSlingshotState.pointerId === null ||
                e.pointerId === mysterySignSlingshotState.pointerId
            )) {
                updateMysterySignSlingshot(e.clientY);
            }
            handleMysteryBoxPointerMove(e.clientX, e.clientY, e.pointerId);
            updateCursorFromClientPoint(e.clientX, e.clientY);
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            if (!touch) return;
            updateCursorFromClientPoint(touch.clientX, touch.clientY);
        }, { passive: true });

        window.addEventListener('pointerdown', async (e) => {
            if (e.target && e.target.closest && e.target.closest('#ui-overlay')) return;
            if (e.target && e.target.closest && (e.target.closest('#prop-preview-panel') || e.target.closest('#prop-preview-overlay'))) return;
            if (
                (e.button === undefined || e.button === 0) &&
                isPointOnMysteryScrollSign(e.clientX, e.clientY) &&
                Number.isFinite(e.pointerId)
            ) {
                const needsPermissionTap = shouldRequestMysteryDeviceTiltPermissionOnTap();
                if (needsPermissionTap) {
                    const permissionGranted = await ensureMysteryDeviceTiltPermission({ userGesture: true });
                    if (!permissionGranted) {
                        return;
                    }
                    // Reserve the first scroll tap for the sensor permission flow on platforms like iOS.
                    return;
                }
                e.preventDefault();
                if (beginMysterySignSlingshot(e.pointerId, e.clientY)) {
                    return;
                }
            }
            if (handleMysteryBoxPointerDown(e.clientX, e.clientY, e.pointerId)) return;
            if (!intersectsCharacterAt(e.clientX, e.clientY)) return;
            holdInput.active = true;
            holdInput.pointerId = e.pointerId ?? null;
            holdInput.startedMs = performance.now();
            holdInput.triggered = false;
        });

        window.addEventListener('pointermove', (e) => {
            if (!holdInput.active) return;
            if (holdInput.pointerId !== null && e.pointerId !== holdInput.pointerId) return;
            if (!intersectsCharacterAt(e.clientX, e.clientY)) {
                holdInput.active = false;
            }
        }, { passive: true });

        window.addEventListener('pointerup', (e) => {
            if (mysterySignSlingshotState.active) {
                endMysterySignSlingshot(e.pointerId);
            }
            if (handleMysteryBoxPointerUp(e.pointerId, e.clientX, e.clientY)) return;
            if (!holdInput.active) return;
            if (holdInput.pointerId !== null && e.pointerId !== holdInput.pointerId) return;
            const heldMs = performance.now() - holdInput.startedMs;
            const wasTriggered = holdInput.triggered;
            holdInput.active = false;
            holdInput.pointerId = null;
            holdInput.startedMs = 0;
            holdInput.triggered = false;
            if (!wasTriggered && heldMs < HOLD_TO_BURST_MS) {
                startRandomEmotionAction();
                if (!stuntState.active && Math.random() < 0.45) startRandomStunt();
            }
        });

        window.addEventListener('pointercancel', (e) => {
            if (mysterySignSlingshotState.active) {
                cancelMysterySignSlingshot(e.pointerId ?? mysterySignSlingshotState.pointerId);
            }
            handleMysteryBoxPointerCancel(e.pointerId ?? null);
            holdInput.active = false;
            holdInput.pointerId = null;
            holdInput.startedMs = 0;
            holdInput.triggered = false;
        });
        window.addEventListener('blur', () => {
            cancelMysterySignSlingshot(mysterySignSlingshotState.pointerId);
            handleMysteryBoxPointerCancel(mysteryState.pressPointerId ?? null);
            holdInput.active = false;
            holdInput.pointerId = null;
            holdInput.startedMs = 0;
            holdInput.triggered = false;
        });
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') return;
            cancelMysterySignSlingshot(mysterySignSlingshotState.pointerId);
            handleMysteryBoxPointerCancel(mysteryState.pressPointerId ?? null);
            holdInput.active = false;
            holdInput.pointerId = null;
            holdInput.startedMs = 0;
            holdInput.triggered = false;
        });

        const responsiveViewState = {
            initialized: false,
            needsProjectionUpdate: false,
            currentFov: camera.fov,
            targetFov: camera.fov,
            currentPosition: camera.position.clone(),
            targetPosition: camera.position.clone(),
            currentScale: BASE_CREATURE_SCALE,
            targetScale: BASE_CREATURE_SCALE,
            baseTargetScale: BASE_CREATURE_SCALE,
            inventoryFitScale: 1,
            lastInventoryFitMeasureMs: 0
        };
        let responsiveLayoutUpdateQueued = false;
        let orientationSettleTimer = null;

        function getViewportDimensions() {
            const visualViewport = window.visualViewport;
            const rawWidth = visualViewport && Number.isFinite(visualViewport.width)
                ? visualViewport.width
                : window.innerWidth;
            const rawHeight = visualViewport && Number.isFinite(visualViewport.height)
                ? visualViewport.height
                : window.innerHeight;
            const width = Math.max(1, Math.round(rawWidth || 1));
            const height = Math.max(1, Math.round(rawHeight || 1));
            return {
                width,
                height,
                aspect: width / height
            };
        }

        function isPhoneLikeViewport(viewportWidth, viewportHeight) {
            const safeWidth = Math.max(1, Number.isFinite(viewportWidth) ? viewportWidth : window.innerWidth || 1);
            const safeHeight = Math.max(1, Number.isFinite(viewportHeight) ? viewportHeight : window.innerHeight || 1);
            const shortEdge = Math.min(safeWidth, safeHeight);
            const longEdge = Math.max(safeWidth, safeHeight);
            const coarsePointer = typeof window !== 'undefined' && typeof window.matchMedia === 'function'
                ? window.matchMedia('(pointer: coarse)').matches
                : shortEdge <= 700;

            return coarsePointer && shortEdge <= 700 && longEdge <= 980;
        }

        function getInventoryShowcaseWindowRect() {
            if (!inventoryPanel || !isInventoryPanelOpen()) {
                return null;
            }

            const viewportWindow = inventoryPanel.querySelector('.inventory-viewport-window');
            const rect = viewportWindow?.getBoundingClientRect?.();
            if (
                !rect ||
                !Number.isFinite(rect.width) ||
                !Number.isFinite(rect.height) ||
                rect.width <= 1 ||
                rect.height <= 1
            ) {
                return null;
            }

            return rect;
        }

        function computeProjectedObjectScreenBounds(object3D, activeCamera, viewportWidth, viewportHeight) {
            if (!object3D || !activeCamera) {
                return null;
            }

            const safeViewportWidth = Math.max(1, viewportWidth || 1);
            const safeViewportHeight = Math.max(1, viewportHeight || 1);
            object3D.updateMatrixWorld(true);
            activeCamera.updateMatrixWorld(true);

            const worldBounds = computeSafeObjectBounds(object3D, {
                respectVisibility: false,
                includePoints: true
            });
            if (!worldBounds || worldBounds.isEmpty()) {
                return null;
            }

            const { min, max } = worldBounds;
            const corners = [
                new THREE.Vector3(min.x, min.y, min.z),
                new THREE.Vector3(min.x, min.y, max.z),
                new THREE.Vector3(min.x, max.y, min.z),
                new THREE.Vector3(min.x, max.y, max.z),
                new THREE.Vector3(max.x, min.y, min.z),
                new THREE.Vector3(max.x, min.y, max.z),
                new THREE.Vector3(max.x, max.y, min.z),
                new THREE.Vector3(max.x, max.y, max.z)
            ];

            let left = Number.POSITIVE_INFINITY;
            let top = Number.POSITIVE_INFINITY;
            let right = Number.NEGATIVE_INFINITY;
            let bottom = Number.NEGATIVE_INFINITY;

            for (const corner of corners) {
                const projected = corner.project(activeCamera);
                if (
                    !Number.isFinite(projected.x) ||
                    !Number.isFinite(projected.y) ||
                    !Number.isFinite(projected.z)
                ) {
                    continue;
                }

                const screenX = (projected.x * 0.5 + 0.5) * safeViewportWidth;
                const screenY = ((-projected.y) * 0.5 + 0.5) * safeViewportHeight;
                left = Math.min(left, screenX);
                top = Math.min(top, screenY);
                right = Math.max(right, screenX);
                bottom = Math.max(bottom, screenY);
            }

            if (
                !Number.isFinite(left) ||
                !Number.isFinite(top) ||
                !Number.isFinite(right) ||
                !Number.isFinite(bottom)
            ) {
                return null;
            }

            return {
                left,
                top,
                right,
                bottom,
                width: Math.max(1, right - left),
                height: Math.max(1, bottom - top)
            };
        }

        function syncResponsiveTargetScale() {
            const baseTargetScale = Number.isFinite(responsiveViewState.baseTargetScale) && responsiveViewState.baseTargetScale > 0
                ? responsiveViewState.baseTargetScale
                : BASE_CREATURE_SCALE;
            const inventoryFitScale = Number.isFinite(responsiveViewState.inventoryFitScale) && responsiveViewState.inventoryFitScale > 0
                ? responsiveViewState.inventoryFitScale
                : 1;

            responsiveViewState.targetScale = baseTargetScale * inventoryFitScale;
        }

        function updateInventoryCreatureFitGuard({ force = false } = {}) {
            const { width, height } = getViewportDimensions();
            const shouldGuardInventoryFit = isInventoryPanelOpen() && !isPhoneLikeViewport(width, height);

            if (!shouldGuardInventoryFit) {
                if (Math.abs((responsiveViewState.inventoryFitScale || 1) - 1) > 0.001) {
                    responsiveViewState.inventoryFitScale = 1;
                    responsiveViewState.lastInventoryFitMeasureMs = 0;
                    syncResponsiveTargetScale();
                }
                return;
            }

            const now = performance.now();
            if (
                !force &&
                Number.isFinite(responsiveViewState.lastInventoryFitMeasureMs) &&
                (now - responsiveViewState.lastInventoryFitMeasureMs) < 120
            ) {
                return;
            }
            responsiveViewState.lastInventoryFitMeasureMs = now;

            const showcaseRect = getInventoryShowcaseWindowRect();
            if (!showcaseRect) {
                return;
            }

            const projectedBounds = computeProjectedObjectScreenBounds(creatureGroup, camera, width, height);
            if (!projectedBounds) {
                return;
            }

            const safePaddingX = THREE.MathUtils.clamp(showcaseRect.width * 0.07, 14, 28);
            const safePaddingY = THREE.MathUtils.clamp(showcaseRect.height * 0.1, 18, 42);
            const safeWidth = Math.max(1, showcaseRect.width - (safePaddingX * 2));
            const safeHeight = Math.max(1, showcaseRect.height - (safePaddingY * 2));
            const fitRatio = Math.min(
                safeWidth / Math.max(1, projectedBounds.width),
                safeHeight / Math.max(1, projectedBounds.height)
            );
            if (!Number.isFinite(fitRatio) || fitRatio <= 0) {
                return;
            }

            const baseTargetScale = Number.isFinite(responsiveViewState.baseTargetScale) && responsiveViewState.baseTargetScale > 0
                ? responsiveViewState.baseTargetScale
                : BASE_CREATURE_SCALE;
            const currentAbsoluteScale = Math.max(
                0.001,
                Number.isFinite(responsiveViewState.currentScale) && responsiveViewState.currentScale > 0
                    ? responsiveViewState.currentScale
                    : (Number.isFinite(creatureGroup.scale.x) && creatureGroup.scale.x > 0
                        ? creatureGroup.scale.x
                        : baseTargetScale)
            );
            const adjustmentCushion = fitRatio < 1 ? 0.94 : 0.985;
            const desiredAbsoluteScale = currentAbsoluteScale * fitRatio * adjustmentCushion;
            const nextInventoryFitScale = THREE.MathUtils.clamp(
                desiredAbsoluteScale / Math.max(0.001, baseTargetScale),
                0.68,
                1
            );
            const currentInventoryFitScale = Number.isFinite(responsiveViewState.inventoryFitScale) && responsiveViewState.inventoryFitScale > 0
                ? responsiveViewState.inventoryFitScale
                : 1;
            const withinStabilityBand = fitRatio >= 0.995 && fitRatio <= 1.045;

            if (withinStabilityBand && Math.abs(nextInventoryFitScale - currentInventoryFitScale) < 0.03) {
                return;
            }

            if (Math.abs(nextInventoryFitScale - currentInventoryFitScale) > 0.004) {
                responsiveViewState.inventoryFitScale = nextInventoryFitScale;
                syncResponsiveTargetScale();
                inventoryPanelAnchorState.initialized = false;
                scheduleInventoryPanelAnchorUpdate({ afterPaint: true });
            }
        }

        function computeResponsiveViewTargets(viewportWidth, viewportHeight) {
            const aspect = viewportWidth / viewportHeight;
            const portraitBlend = THREE.MathUtils.clamp((1.03 - aspect) / 0.5, 0, 1);
            const landscapeBlend = THREE.MathUtils.clamp((aspect - 1.02) / 1.06, 0, 1);
            const wideLandscapeBlend = THREE.MathUtils.clamp((aspect - 1.62) / 1.0, 0, 1);
            const compactLandscapeBlend = THREE.MathUtils.clamp((1.2 - aspect) / 0.24, 0, 1);
            const shortLandscapeBlend = landscapeBlend * THREE.MathUtils.clamp((560 - viewportHeight) / 160, 0, 1);
            const tallPortraitBlend = THREE.MathUtils.clamp((0.75 - aspect) / 0.24, 0, 1);

            const landscapeFovBase = THREE.MathUtils.lerp(48.8, 51.2, landscapeBlend);
            const landscapeFovWide = THREE.MathUtils.lerp(landscapeFovBase, 52.2, wideLandscapeBlend);
            const landscapeFov = THREE.MathUtils.lerp(landscapeFovWide, 50.4, shortLandscapeBlend);
            const portraitFov = THREE.MathUtils.lerp(53.0, 54.4, tallPortraitBlend);
            const fov = THREE.MathUtils.clamp(
                THREE.MathUtils.lerp(landscapeFov, portraitFov, portraitBlend),
                47,
                59
            );

            const landscapeYBase = THREE.MathUtils.lerp(1.9, 2.18, wideLandscapeBlend);
            const landscapeY = THREE.MathUtils.lerp(landscapeYBase, 2.46, shortLandscapeBlend);
            const portraitY = THREE.MathUtils.lerp(0.92, 0.84, tallPortraitBlend);
            const positionY = THREE.MathUtils.lerp(landscapeY, portraitY, portraitBlend);

            const landscapeZBase = THREE.MathUtils.lerp(21.8, 23.1, landscapeBlend);
            const landscapeZWide = THREE.MathUtils.lerp(landscapeZBase, 24.6, wideLandscapeBlend);
            const landscapeZShort = THREE.MathUtils.lerp(landscapeZWide, 22.8, shortLandscapeBlend);
            const landscapeZ = THREE.MathUtils.lerp(landscapeZShort, 21.9, compactLandscapeBlend);
            const portraitZ = THREE.MathUtils.lerp(22.5, 23.3, tallPortraitBlend);
            const positionZ = THREE.MathUtils.lerp(landscapeZ, portraitZ, portraitBlend);

            let scaleMultiplier = THREE.MathUtils.lerp(0.96, 0.9, landscapeBlend);
            scaleMultiplier = THREE.MathUtils.lerp(scaleMultiplier, 0.9, portraitBlend);
            scaleMultiplier = THREE.MathUtils.lerp(scaleMultiplier, 0.96, shortLandscapeBlend);
            if (viewportWidth < 420) scaleMultiplier *= 0.96;
            if (viewportHeight < 430 && aspect < 1.0) scaleMultiplier *= 0.95;
            const creatureScale = BASE_CREATURE_SCALE * THREE.MathUtils.clamp(scaleMultiplier, 0.84, 0.98);

            return {
                aspect,
                fov,
                positionY,
                positionZ,
                creatureScale
            };
        }

        function stepResponsiveViewMotion(dt, force = false) {
            if (!responsiveViewState.initialized) {
                return;
            }
            const safeDt = Number.isFinite(dt) && dt > 0 ? dt : 1 / 60;
            const blend = force ? 1 : 1 - Math.exp(-safeDt * 11);
            const previousFov = responsiveViewState.currentFov;

            responsiveViewState.currentFov = THREE.MathUtils.lerp(
                responsiveViewState.currentFov,
                responsiveViewState.targetFov,
                blend
            );
            responsiveViewState.currentPosition.lerp(responsiveViewState.targetPosition, blend);
            responsiveViewState.currentScale = THREE.MathUtils.lerp(
                responsiveViewState.currentScale,
                responsiveViewState.targetScale,
                blend
            );

            camera.fov = responsiveViewState.currentFov;
            camera.position.copy(responsiveViewState.currentPosition);
            creatureGroup.scale.setScalar(responsiveViewState.currentScale);

            if (
                force ||
                responsiveViewState.needsProjectionUpdate ||
                Math.abs(responsiveViewState.currentFov - previousFov) > 0.001
            ) {
                camera.updateProjectionMatrix();
                responsiveViewState.needsProjectionUpdate = false;
            }
        }

        function scheduleResponsiveLayout({ afterPaint = false } = {}) {
            if (responsiveLayoutUpdateQueued) {
                return;
            }
            responsiveLayoutUpdateQueued = true;
            const runLayout = () => {
                responsiveLayoutUpdateQueued = false;
                applyResponsiveLayout();
            };
            if (afterPaint) {
                window.requestAnimationFrame(() => {
                    window.requestAnimationFrame(runLayout);
                });
                return;
            }
            window.requestAnimationFrame(runLayout);
        }

        function applyResponsiveLayout() {
            const { width: w, height: h, aspect } = getViewportDimensions();
            const viewTarget = computeResponsiveViewTargets(w, h);

            camera.aspect = aspect;
            responsiveViewState.needsProjectionUpdate = true;
            responsiveViewState.targetFov = viewTarget.fov;
            responsiveViewState.targetPosition.set(0, viewTarget.positionY, viewTarget.positionZ);
            responsiveViewState.baseTargetScale = viewTarget.creatureScale;
            if (!isInventoryPanelOpen()) {
                responsiveViewState.inventoryFitScale = 1;
            }
            syncResponsiveTargetScale();

            if (!responsiveViewState.initialized) {
                responsiveViewState.initialized = true;
                responsiveViewState.currentFov = responsiveViewState.targetFov;
                responsiveViewState.currentPosition.copy(responsiveViewState.targetPosition);
                responsiveViewState.currentScale = responsiveViewState.targetScale;
                stepResponsiveViewMotion(1 / 60, true);
            }

            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(w, h);

            if (previewState && previewState.open) {
                resizePropViewport();
            }

            layoutMysteryHangingSign();
            resizeMysteryScroll3D();
            inventoryPanelAnchorState.initialized = false;
            scheduleInventoryPanelAnchorUpdate({ afterPaint: true });
        }

        function animate() {
            requestAnimationFrame(animate);
            const rawDelta = clock.getDelta();
            if (!homePageRouteAudioState.isActive) {
                const now = performance.now();
                if ((now - homePageAnimationState.lastInactiveRenderAtMs) >= HOME_PAGE_INACTIVE_RENDER_INTERVAL_MS) {
                    homePageAnimationState.lastInactiveRenderAtMs = now;
                    renderer.render(scene, camera);
                }
                return;
            }
            const dt = Math.min(rawDelta, 1 / 30);
            if (!Number.isFinite(dt) || dt <= 0) {
                renderer.render(scene, camera);
                return;
            }
            elapsed += dt;
            const t = elapsed;
            stepResponsiveViewMotion(dt);

            if (!mysteryFlightCinematic.active && holdInput.active && !holdInput.triggered && (performance.now() - holdInput.startedMs) >= HOLD_TO_BURST_MS) {
                holdInput.triggered = true;
                startStuntByKey('burstDive');
                startRandomEmotionAction();
            }

            const emotion = sampleEmotion(dt);
            const mysteryFlightFxRaw = updateMysteryFlightCinematic(dt, t);
            const mysteryFlightFx = sampleMysteryFlightRender(dt, mysteryFlightFxRaw);
            const stuntTarget = sampleStunt(dt);

            [stuntSim.pos.x, stuntSim.vel.x] = stepSpringScalar(
                stuntSim.pos.x,
                stuntSim.vel.x,
                stuntTarget.rigX,
                STUNT_PHYSICS.posStiffness,
                STUNT_PHYSICS.posDamping,
                dt,
                STUNT_PHYSICS.maxLinearSpeed
            );
            [stuntSim.pos.y, stuntSim.vel.y] = stepSpringScalar(
                stuntSim.pos.y,
                stuntSim.vel.y,
                stuntTarget.rigY,
                STUNT_PHYSICS.posStiffness,
                STUNT_PHYSICS.posDamping,
                dt,
                STUNT_PHYSICS.maxLinearSpeed
            );
            [stuntSim.pos.z, stuntSim.vel.z] = stepSpringScalar(
                stuntSim.pos.z,
                stuntSim.vel.z,
                stuntTarget.rigZ,
                STUNT_PHYSICS.posStiffness,
                STUNT_PHYSICS.posDamping,
                dt,
                STUNT_PHYSICS.maxLinearSpeed
            );
            [stuntSim.rot.x, stuntSim.rotVel.x] = stepSpringScalar(
                stuntSim.rot.x,
                stuntSim.rotVel.x,
                stuntTarget.rigPitch,
                STUNT_PHYSICS.rotStiffness,
                STUNT_PHYSICS.rotDamping,
                dt,
                STUNT_PHYSICS.maxAngularSpeed,
                true
            );
            [stuntSim.rot.y, stuntSim.rotVel.y] = stepSpringScalar(
                stuntSim.rot.y,
                stuntSim.rotVel.y,
                stuntTarget.rigYaw,
                STUNT_PHYSICS.rotStiffness,
                STUNT_PHYSICS.rotDamping,
                dt,
                STUNT_PHYSICS.maxAngularSpeed,
                true
            );
            [stuntSim.rot.z, stuntSim.rotVel.z] = stepSpringScalar(
                stuntSim.rot.z,
                stuntSim.rotVel.z,
                stuntTarget.rigRoll,
                STUNT_PHYSICS.rotStiffness,
                STUNT_PHYSICS.rotDamping,
                dt,
                STUNT_PHYSICS.maxAngularSpeed,
                true
            );

            if (!Number.isFinite(stuntSim.pos.x) || !Number.isFinite(stuntSim.pos.y) || !Number.isFinite(stuntSim.pos.z)) {
                stuntSim.pos.set(0, 0, 0);
                stuntSim.vel.set(0, 0, 0);
            }
            stuntSim.pos.x = THREE.MathUtils.clamp(stuntSim.pos.x, -3.2, 3.2);
            stuntSim.pos.y = THREE.MathUtils.clamp(stuntSim.pos.y, -2.2, 2.2);
            stuntSim.pos.z = THREE.MathUtils.clamp(stuntSim.pos.z, -4.2, 2.8);

            stuntSim.flapHzAdd += (stuntTarget.flapHzAdd - stuntSim.flapHzAdd) * Math.min(1, dt * 6.0);
            stuntSim.wingAmpMul += (stuntTarget.wingAmpMul - stuntSim.wingAmpMul) * Math.min(1, dt * 6.0);

            // Wing-driven flight model with spring damping to keep physically plausible hover.
            const flapHz = FLIGHT_TUNING.baseFlapHz + stuntSim.flapHzAdd + Math.sin(t * 0.42) * FLIGHT_TUNING.flapHzVariance;
            const flapOmega = Math.PI * 2 * flapHz;
            flightState.phase += flapOmega * dt;
            const stroke = Math.sin(flightState.phase);
            const strokeVelNorm = Math.cos(flightState.phase);
            const aeroRaw = 0.5 + 0.5 * strokeVelNorm;
            // Smoothed aerodynamic weighting: favors downstroke while keeping C1 continuity.
            flightState.aero += (aeroRaw - flightState.aero) * Math.min(1, dt * 9.0);
            const downstroke = Math.pow(flightState.aero, 1.45);
            const upstroke = Math.pow(1 - flightState.aero, 1.2);

            const wingAmplitude = 0.47 + Math.min(0.16, Math.abs(flightState.yVel) * 0.15);
            const lift = 8.35 + downstroke * 2.25 + Math.abs(strokeVelNorm) * 0.62 - upstroke * 0.24;
            const yAccel = lift - 9.1 - (flightState.y - 0.12) * 9.1 - flightState.yVel * 4.6;
            flightState.yVel += yAccel * dt;
            flightState.y += flightState.yVel * dt;
            flightState.y = THREE.MathUtils.clamp(flightState.y, -0.54, 0.86);
            creatureGroup.position.y = flightState.y + emotion.y;
            stuntRig.position.set(stuntSim.pos.x, stuntSim.pos.y, stuntSim.pos.z);
            const fxRigOffset = mysteryFlightFx.rigOffset;
            const fxRigOffsetX = Number.isFinite(fxRigOffset?.x) ? fxRigOffset.x : 0;
            const fxRigOffsetY = Number.isFinite(fxRigOffset?.y) ? fxRigOffset.y : 0;
            const fxRigOffsetZ = Number.isFinite(fxRigOffset?.z) ? fxRigOffset.z : 0;
            stuntRig.position.x += fxRigOffsetX;
            stuntRig.position.y += fxRigOffsetY;
            stuntRig.position.z += fxRigOffsetZ;

            const fxRigPitch = Number.isFinite(mysteryFlightFx.rigPitch) ? mysteryFlightFx.rigPitch : 0;
            const fxRigYaw = Number.isFinite(mysteryFlightFx.rigYaw) ? mysteryFlightFx.rigYaw : 0;
            const fxRigRoll = Number.isFinite(mysteryFlightFx.rigRoll) ? mysteryFlightFx.rigRoll : 0;

            const pitchTarget = (-cursor.y * 0.1) + (-downstroke * 0.06 + upstroke * 0.02);
            const pitchAccel = (pitchTarget - flightState.pitch) * 16.0 - flightState.pitchVel * 7.8;
            flightState.pitchVel += pitchAccel * dt;
            flightState.pitch += flightState.pitchVel * dt;

            const rollTarget = Math.sin(flightState.phase + Math.PI * 0.5) * 0.022;
            const rollAccel = (rollTarget - flightState.roll) * 14.0 - flightState.rollVel * 7.0;
            flightState.rollVel += rollAccel * dt;
            flightState.roll += flightState.rollVel * dt;
            creatureGroup.rotation.z = flightState.roll + emotion.roll + (mysteryFlightFx.bodyRoll ?? 0);
            stuntRig.rotation.set(stuntSim.rot.x, stuntSim.rot.y, stuntSim.rot.z);
            stuntRig.rotation.x += fxRigPitch;
            stuntRig.rotation.y += fxRigYaw;
            stuntRig.rotation.z += fxRigRoll;

            const hoverHeight = THREE.MathUtils.clamp((creatureGroup.position.y + stuntSim.pos.y) * 0.65, -0.2, 0.35);
            const shadowScale = 1 + Math.max(0, hoverHeight) * 0.5;
            contactShadow.scale.set(1.25 * shadowScale, 0.78 * shadowScale, 1);
            contactShadowSoft.scale.set(1.45 * shadowScale, 0.9 * shadowScale, 1);
            shadowAnchor.position.x = 0.3 + creatureGroup.rotation.y * 0.55 + stuntSim.pos.x * 0.22;
            shadowAnchor.position.z = -5.8 + creatureGroup.rotation.x * 1.1 + stuntSim.pos.z * 0.22;

            const flap = stroke * wingAmplitude * emotion.wingAmpMul * stuntSim.wingAmpMul * (mysteryFlightFx.wingBoost ?? 1);
            const strokeHarmonic = Math.sin(flightState.phase * 2 - 0.35) * 0.12;
            const leftWingRotationZ = flap + strokeHarmonic - 0.2 + (mysteryFlightFx.hardFlap ?? 0);
            const rightWingRotationZ = -flap - strokeHarmonic + 0.2 - (mysteryFlightFx.hardFlap ?? 0);

            const wingFeather = 0.07 + upstroke * 0.2 + emotion.wingFeatherAdd;
            const wingSweep = 0.03 + downstroke * 0.09 - upstroke * 0.025 + emotion.wingSweepAdd;
            const wingRotationX = wingFeather + stroke * 0.03 + strokeHarmonic * 0.25 + (mysteryFlightFx.wingLift ?? 0);
            applyWingGroupPose(
                leftWingRotationZ,
                rightWingRotationZ,
                wingRotationX,
                wingSweep,
                wingClearanceState.shoulderShift,
                wingClearanceState.sweepAdd
            );
            const wingClearance = updateWingClearanceGuard(dt);
            applyWingGroupPose(
                leftWingRotationZ,
                rightWingRotationZ,
                wingRotationX,
                wingSweep,
                wingClearance.shoulderShift,
                wingClearance.sweepAdd
            );

            if (activeProps.has('roboticWings')) {
                const roboticProp = propObjects.roboticWings;
                if (roboticProp && roboticProp.userData.emitters) {
                    const pulse = 1.2 + downstroke * 0.3 + Math.sin(t * 7.2) * 0.28;
                    for (const emitter of roboticProp.userData.emitters) {
                        emitter.material.emissiveIntensity = pulse;
                    }
                }
            }

            if (activeProps.has('alphaWings')) {
                const alphaProp = propObjects.alphaWings;
                if (alphaProp?.userData.glowMats) {
                    const cyanPulse = 1.42 + downstroke * 0.56 + Math.sin(t * 6.7) * 0.24;
                    const magentaPulse = 1.26 + downstroke * 0.48 + Math.sin(t * 5.9 + 0.72) * 0.22;
                    for (const glowMat of alphaProp.userData.glowMats) {
                        if (!glowMat) continue;
                        const channel = glowMat.userData.channel || 'cyan';
                        glowMat.emissiveIntensity = channel === 'magenta' ? magentaPulse : cyanPulse;
                    }
                }
                if (alphaProp?.userData.lightEmitters) {
                    for (let i = 0; i < alphaProp.userData.lightEmitters.length; i++) {
                        const light = alphaProp.userData.lightEmitters[i];
                        light.intensity = 0.82 + downstroke * 0.6 + Math.sin(t * 4.9 + i * 0.6) * 0.2;
                    }
                }
                if (alphaProp?.userData.sparkSystems) {
                    for (const sparkSystem of alphaProp.userData.sparkSystems) {
                        const attr = sparkSystem.points.geometry.attributes.position;
                        const arr = attr.array;
                        const base = sparkSystem.basePositions;
                        const phases = sparkSystem.phases;
                        for (let i = 0; i < phases.length; i++) {
                            const idx = i * 3;
                            const phase = phases[i];
                            arr[idx] = base[idx] + Math.sin(t * sparkSystem.speed + phase) * sparkSystem.drift;
                            arr[idx + 1] = base[idx + 1] + Math.cos(t * (sparkSystem.speed * 0.82) + phase * 1.15) * sparkSystem.drift * 0.86;
                            arr[idx + 2] = base[idx + 2] + Math.sin(t * (sparkSystem.speed * 1.26) + phase * 0.7) * sparkSystem.drift * 0.54;
                        }
                        attr.needsUpdate = true;
                        sparkSystem.points.material.opacity = 0.58 + Math.sin(t * 5.2 + sparkSystem.phaseOffset) * 0.2;
                    }
                }
            }

            if (activeProps.has('rainbowWings')) {
                const rainbowProp = propObjects.rainbowWings;
                if (rainbowProp?.userData.iridescentMats) {
                    const warmPulse = 1.04 + downstroke * 0.54 + Math.sin(t * 5.1) * 0.2;
                    const coolPulse = 0.96 + downstroke * 0.46 + Math.sin(t * 4.4 + 0.7) * 0.18;
                    for (const iridescentMat of rainbowProp.userData.iridescentMats) {
                        if (!iridescentMat) continue;
                        const channel = iridescentMat.userData.channel || 'warm';
                        iridescentMat.emissiveIntensity = channel === 'cool' ? coolPulse : warmPulse;
                    }
                }
                if (rainbowProp?.userData.wingLights) {
                    for (let i = 0; i < rainbowProp.userData.wingLights.length; i++) {
                        const light = rainbowProp.userData.wingLights[i];
                        light.intensity = 0.72 + downstroke * 0.56 + Math.sin(t * 4.1 + i * 0.65) * 0.22;
                    }
                }
                if (rainbowProp?.userData.sparkSystems) {
                    for (const sparkSystem of rainbowProp.userData.sparkSystems) {
                        const attr = sparkSystem.points.geometry.attributes.position;
                        const arr = attr.array;
                        const base = sparkSystem.basePositions;
                        const phases = sparkSystem.phases;
                        for (let i = 0; i < phases.length; i++) {
                            const idx = i * 3;
                            const phase = phases[i];
                            arr[idx] = base[idx] + Math.sin(t * sparkSystem.speed + phase) * sparkSystem.drift;
                            arr[idx + 1] = base[idx + 1] + Math.cos(t * (sparkSystem.speed * 0.86) + phase * 1.22) * sparkSystem.drift * 0.84;
                            arr[idx + 2] = base[idx + 2] + Math.sin(t * (sparkSystem.speed * 1.2) + phase * 0.76) * sparkSystem.drift * 0.52;
                        }
                        attr.needsUpdate = true;
                        sparkSystem.points.material.opacity = 0.62 + Math.sin(t * 4.9 + sparkSystem.phaseOffset) * 0.2;
                    }
                }
                if (rainbowProp?.userData.trailDrops) {
                    for (let i = 0; i < rainbowProp.userData.trailDrops.length; i++) {
                        const drop = rainbowProp.userData.trailDrops[i];
                        const bob = 0.92 + Math.sin(t * 3.4 + i * 0.8) * 0.22;
                        drop.scale.setScalar(bob);
                    }
                }
            }

            if (activeProps.has('omegaWings')) {
                const omegaProp = propObjects.omegaWings;
                if (omegaProp?.userData.fireMats) {
                    const infernoPulse = 1.28 + downstroke * 0.58 + Math.sin(t * 4.6) * 0.24;
                    for (const fireMat of omegaProp.userData.fireMats) {
                        fireMat.emissiveIntensity = infernoPulse;
                    }
                }
                if (omegaProp?.userData.fireLights) {
                    const lightPulse = 1.05 + downstroke * 0.52 + Math.sin(t * 5.3) * 0.2;
                    for (const fireLight of omegaProp.userData.fireLights) {
                        fireLight.intensity = lightPulse;
                    }
                }
                if (omegaProp?.userData.embers) {
                    for (let i = 0; i < omegaProp.userData.embers.length; i++) {
                        const ember = omegaProp.userData.embers[i];
                        const emberPulse = 0.86 + Math.sin(t * (6.5 + i * 0.7) + i * 1.2) * 0.2;
                        ember.scale.setScalar(emberPulse);
                        ember.position.z = ember.userData.baseZ + Math.sin(t * (4.2 + i * 0.45)) * 0.02;
                    }
                }
            }

            if (activeProps.has('efernoWings')) {
                const efernoProp = propObjects.efernoWings;
                if (efernoProp?.userData.fireMats) {
                    const infernoPulse = 1.34 + downstroke * 0.62 + Math.sin(t * 5.1) * 0.26;
                    for (const fireMat of efernoProp.userData.fireMats) {
                        fireMat.emissiveIntensity = infernoPulse;
                    }
                }
                if (efernoProp?.userData.glowMats) {
                    const glowPulse = 0.66 + downstroke * 0.32 + Math.sin(t * 6.2 + 0.3) * 0.16;
                    for (const glowMat of efernoProp.userData.glowMats) {
                        glowMat.opacity = THREE.MathUtils.clamp(glowPulse, 0.3, 0.95);
                    }
                }
                if (efernoProp?.userData.fireLights) {
                    const lightPulse = 1.02 + downstroke * 0.54 + Math.sin(t * 4.8 + 0.4) * 0.2;
                    for (const fireLight of efernoProp.userData.fireLights) {
                        fireLight.intensity = lightPulse;
                    }
                }
                if (efernoProp?.userData.emberSystems) {
                    for (const emberSystem of efernoProp.userData.emberSystems) {
                        const attr = emberSystem.points.geometry.attributes.position;
                        const arr = attr.array;
                        const base = emberSystem.basePositions;
                        const phases = emberSystem.phases;
                        for (let i = 0; i < phases.length; i++) {
                            const idx = i * 3;
                            const phase = phases[i];
                            arr[idx] = base[idx] + Math.sin(t * emberSystem.speed + phase) * emberSystem.drift;
                            arr[idx + 1] = base[idx + 1] + Math.abs(Math.sin(t * (emberSystem.speed * 0.74) + phase * 1.2)) * emberSystem.rise;
                            arr[idx + 2] = base[idx + 2] + Math.cos(t * (emberSystem.speed * 1.07) + phase * 0.82) * emberSystem.drift * 0.55;
                        }
                        attr.needsUpdate = true;
                        emberSystem.points.material.opacity = 0.56 + Math.sin(t * 4.9 + emberSystem.phaseOffset) * 0.22;
                    }
                }
            }


            // Head tracking
            const tx = flightState.pitch + emotion.pitch + (mysteryFlightFx.bodyPitch ?? 0);
            const ty = cursor.x * 0.14 + emotion.yaw + (mysteryFlightFx.bodyYaw ?? 0);
            creatureGroup.rotation.x += (tx - creatureGroup.rotation.x) * 0.09;
            creatureGroup.rotation.y += shortestAngleDelta(creatureGroup.rotation.y, ty) * 0.09;

            for (const propKey of activeProps) {
                const prop = propObjects[propKey];
                if (!prop?.userData.excludeFromHeadTilt) continue;
                if (!prop.userData.baseRotation) {
                    prop.userData.baseRotation = prop.rotation.clone();
                }
                prop.rotation.x = prop.userData.baseRotation.x - creatureGroup.rotation.x;
                prop.rotation.y = prop.userData.baseRotation.y - creatureGroup.rotation.y;
                prop.rotation.z = prop.userData.baseRotation.z - creatureGroup.rotation.z;
            }

            updateEquipVisualGlowPulse(dt, t);
            updateEquipPropRevealRamp(dt);

            let eyeTargetX = THREE.MathUtils.clamp(cursor.x * 0.13, -0.1, 0.1);
            let eyeTargetY = THREE.MathUtils.clamp(cursor.y * 0.1, -0.08, 0.08);
            if (mysteryFlightFx.active) {
                const eyeBlend = THREE.MathUtils.clamp(mysteryFlightFx.eyeBlend ?? 0, 0, 1);
                const fxEyeX = THREE.MathUtils.clamp(mysteryFlightFx.eyeTargetX ?? eyeTargetX, -0.1, 0.1);
                const fxEyeY = THREE.MathUtils.clamp(mysteryFlightFx.eyeTargetY ?? eyeTargetY, -0.1, 0.1);
                eyeTargetX = THREE.MathUtils.lerp(eyeTargetX, fxEyeX, eyeBlend);
                eyeTargetY = THREE.MathUtils.lerp(eyeTargetY, fxEyeY, eyeBlend);
            }
            leftEye.group.scale.setScalar(emotion.leftEyeScale);
            rightEye.group.scale.setScalar(emotion.rightEyeScale);
            bodyMesh.scale.set(emotion.bodyScaleX, emotion.bodyScaleY, emotion.bodyScaleZ);
            leftEye.update(eyeTargetX + 0.015 + emotion.leftEyeBiasX, eyeTargetY + emotion.eyeBiasY, dt);
            rightEye.update(eyeTargetX - 0.015 + emotion.rightEyeBiasX, eyeTargetY + emotion.eyeBiasY, dt);

            // Wind animation: grass + trees + clouds
            const wind = Math.sin(t * 1.7) * 0.5 + Math.sin(t * 0.37) * 0.5;
            updateMysteryHangingSign(dt, t);
            for (let i = 0; i < grassBlades.length; i++) {
                const g = grassBlades[i];
                g.blade.rotation.z = Math.sin(t * g.speed + g.phase) * g.sway + wind * 0.08;
            }

            for (let i = 0; i < treeInstances.length; i++) {
                const tr = treeInstances[i];
                tr.tree.rotation.z = Math.sin(t * 0.7 + tr.phase) * tr.sway;
            }

            for (let i = 0; i < cloudPlanes.length; i++) {
                const c = cloudPlanes[i];
                c.mesh.position.x += c.speed * dt;
                if (c.mesh.position.x > 30) c.mesh.position.x = -28;
            }

            sunSprite.material.opacity = 0.82 + Math.sin(t * 0.8) * 0.06;

            pollen.rotation.y = t * 0.04;
            pollen.position.x = Math.sin(t * 0.25) * 0.6;

            updateMysteryBox(dt);
            applyContactShadowOpacity(hoverHeight, mysteryFlightFx);

            if (previewState.open && previewState.object) {
                const canAutoSpin =
                    !previewDragState.active &&
                    performance.now() >= (previewState.autoSpinPauseUntilMs || 0);
                if (canAutoSpin) {
                    previewState.objectRotateY += dt * 0.55;
                }
                if (previewState.hasStandaloneMesh) {
                    setPreviewFallbackMessage('');
                }
                syncPreviewObjectRotation(previewState.object);
                applyPreviewCameraOrbit();
                previewRenderer.render(previewScene, previewCamera);
            }

            updateInventoryCreatureFitGuard();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            scheduleResponsiveLayout();
        }, { passive: true });
        window.addEventListener('orientationchange', () => {
            resetMysteryDeviceTiltCalibration();
            scheduleResponsiveLayout({ afterPaint: true });
            if (orientationSettleTimer) {
                window.clearTimeout(orientationSettleTimer);
            }
            orientationSettleTimer = window.setTimeout(() => {
                scheduleResponsiveLayout({ afterPaint: true });
                orientationSettleTimer = null;
            }, 220);
        }, { passive: true });
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                scheduleResponsiveLayout();
            }, { passive: true });
        }

        initMysteryScroll3D();
        layoutMysteryHangingSign(true);
        applyResponsiveLayout();
        void ensureMysteryDeviceTiltPermission();
        initHomePageMusicController();
        initBackgroundMediaController();
        scheduleStartupFadeDismiss();
        if (mysteryHangingSign.enabled && mysteryHangingSignLayer) {
            mysterySignLayerRevealFallbackTimer = window.setTimeout(() => {
                revealMysterySignLayer();
            }, 1200);
        }
        // Pre-warm prop materials so first equip does not hitch.
        // Run this work in idle slices so startup latency stays low.
        const prewarmProps = [...propRegistry.values()]
            .sort((a, b) => {
                if (b.priority !== a.priority) return b.priority - a.priority;
                return comparePropCatalogOrder(a.key, b.key);
            })
            .map(({ key, object }) => {
                const prop = object;
                const left = prop.userData.left;
                const right = prop.userData.right;
                return {
                    key,
                    prop,
                    wasVisible: prop.visible,
                    leftWasVisible: left?.visible ?? false,
                    rightWasVisible: right?.visible ?? false,
                    left,
                    right
                };
            });

        const runPropPrewarm = (deadline) => {
            const batchSize = 3;
            for (let i = 0; i < batchSize && prewarmProps.length > 0; i++) {
                const { key, prop, wasVisible, leftWasVisible, rightWasVisible, left, right } = prewarmProps.shift();

                if (left && right) {
                    left.visible = true;
                    right.visible = true;
                }

                prop.visible = true;
                try {
                    renderer.compile(scene, camera);
                    markPropMainRendererWarm(key || prop.userData?.propKey);
                } catch (_) {}
                prop.visible = wasVisible;

                if (left) left.visible = leftWasVisible;
                if (right) right.visible = rightWasVisible;

                if (deadline && !deadline.didTimeout && deadline.timeRemaining() < 2) {
                    break;
                }
            }

            if (prewarmProps.length > 0) {
                if (window.requestIdleCallback) {
                    window.requestIdleCallback(runPropPrewarm, { timeout: 800 });
                } else {
                    setTimeout(runPropPrewarm, 8);
                }
            }
        };

        if (window.requestIdleCallback) {
            window.requestIdleCallback(runPropPrewarm, { timeout: 800 });
        } else {
            setTimeout(runPropPrewarm, 8);
        }
        animate();
    </script>
</body>
