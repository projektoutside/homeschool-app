                    if (mysteryState.rewardKey && mysteryState.rewardKey !== propKey) {
                        return;
                    }
                    const settledBuild = buildPreviewObject(source);
                    if (!settledBuild?.object || !settledBuild.hasRenderableMesh || !hasFiniteRenderableGeometry(settledBuild.object)) {
                        return;
                    }
                    mysteryState.preloadedPreview = {
                        propKey,
                        object: settledBuild.object,
                        hasRenderableMesh: true
                    };
                }).catch(() => null);
            }
            const previewBuild = buildPreviewObject(source);
            if (!previewBuild?.object || !previewBuild.hasRenderableMesh || !hasFiniteRenderableGeometry(previewBuild.object)) {
                mysteryState.preloadedPreview = null;
                return null;
            }
            const prepared = {
                propKey,
                object: previewBuild.object,
                hasRenderableMesh: previewBuild.hasRenderableMesh ?? false
            };
            mysteryState.preloadedPreview = prepared;
            return prepared;
        }

        function takeMysteryRewardPreviewBuild(propKey) {
            if (!propKey) {
                return null;
            }
            const cached = mysteryState.preloadedPreview;
            if (!cached || cached.propKey !== propKey || !cached.object) {
                return null;
            }
            mysteryState.preloadedPreview = null;
            mysteryState.previewPreloadQueued = false;
            return cached;
        }

        function scheduleMysteryRewardPreviewPreload(propKey) {
            if (!propKey) {
                return;
            }
            const cached = mysteryState.preloadedPreview;
            if (cached?.propKey === propKey && cached?.object) {
                return;
            }
            if (mysteryState.previewPreloadQueued) {
                return;
            }
            mysteryState.previewPreloadQueued = true;
            const runPreload = () => {
                mysteryState.previewPreloadQueued = false;
                if (mysteryState.phase === 'idle') {
                    return;
                }
                if (mysteryState.rewardKey !== propKey) {
                    return;
                }
                const source = getItemByPropKey(propKey);
                if (!source) {
                    return;
                }
                const previewReadyPromise = getPropPreviewReadyPromise(source);
                if (previewReadyPromise) {
                    void previewReadyPromise.then(() => {
                        if (mysteryState.phase === 'idle' || mysteryState.rewardKey !== propKey) {
                            return;
                        }
                        cacheMysteryRewardPreviewBuild(propKey);
                    }).catch(() => null);
                    return;
                }
                cacheMysteryRewardPreviewBuild(propKey);
            };
            if (typeof window.requestIdleCallback === 'function') {
                window.requestIdleCallback(runPreload, { timeout: 260 });
            } else {
                setTimeout(runPreload, 16);
            }
        }

        function launchMysteryBox() {
            if (mysteryState.phase !== 'idle' && mysteryState.phase !== 'cooldown') {
                return;
            }
            clearMysteryBox();
            mysterySfxState.lastBoxShakeAtMs = -Infinity;

            const preselectedReward = pickMysteryRewardSelection();
            const preselectedRewardKey = preselectedReward?.rewardKey || null;
            const preselectedBoxRarity = preselectedReward?.rarityKey || MYSTERY_BOX_RARITY.RARE;
            const model = createMysteryBoxModel(preselectedBoxRarity);
            const boxTheme = model.userData?.rarityTheme || getMysteryBoxTheme(preselectedBoxRarity);
            const creaturePosition = new THREE.Vector3();
            creatureGroup.getWorldPosition(creaturePosition);
            const creatureQuaternion = new THREE.Quaternion();
            creatureGroup.getWorldQuaternion(creatureQuaternion);
            const rawForward = new THREE.Vector3(0, 0, 1).applyQuaternion(creatureQuaternion).setY(0);
            if (!Number.isFinite(rawForward.x) || !Number.isFinite(rawForward.z) || rawForward.lengthSq() < 1e-6) {
                rawForward.set(0, 0, -1);
            } else {
                rawForward.normalize();
            }

            const prevForward = stableMysteryForward.clone();
            const looksBackwards = prevForward.lengthSq() > 1e-6 && prevForward.dot(rawForward) < -0.22;
            if (looksBackwards && rawForward.lengthSq() > 0.5) {
                rawForward.copy(prevForward);
            }

            const towardCamera = new THREE.Vector3(
                camera.position.x - creaturePosition.x,
                0,
                camera.position.z - creaturePosition.z
            );
            let forward = rawForward.clone();
            if (towardCamera.lengthSq() > 1e-6) {
                towardCamera.normalize();
                // Keep the drop aligned with the pet in screen space.
                forward.copy(towardCamera);
            } else if (!Number.isFinite(forward.x) || !Number.isFinite(forward.z) || forward.lengthSq() < 1e-6) {
                forward.copy(stableMysteryForward);
            }
            if (!Number.isFinite(forward.x) || !Number.isFinite(forward.z) || forward.lengthSq() < 1e-6) {
                forward.set(0, 0, -1);
            } else {
                forward.normalize();
            }
            stableMysteryForward.copy(forward);
            const right = new THREE.Vector3(0, 1, 0).cross(forward).normalize();
            if (!Number.isFinite(right.x) || !Number.isFinite(right.z) || right.lengthSq() < 1e-6) {
                right.set(1, 0, 0);
            }

            const side = (Math.random() - 0.5) * MYSTERY_BOX_CONFIG.sideOffset;
            const landingTarget = creaturePosition.clone()
                .addScaledVector(forward, MYSTERY_BOX_CONFIG.frontOffset)
                .addScaledVector(right, side)
                .setY(ground.position.y + MYSTERY_BOX_CONFIG.groundOffset + (MYSTERY_BOX_CONFIG.landingHeightNudge ?? 0));
            const startOffset = MYSTERY_BOX_CONFIG.spawnHeightExtra + Math.random() * MYSTERY_BOX_CONFIG.spawnHeightSpread;
            let startY = Math.max(creaturePosition.y + startOffset, ground.position.y + 16);
            if (mysteryFlightCinematic.active) {
                startY = ground.position.y + (MYSTERY_CHARACTER_FLIGHT_CONFIG.boxDropStartHeight ?? 20.2);
            }

            model.position.copy(landingTarget);
            model.position.y = startY;
            const baseMysteryScale = MYSTERY_BOX_CONFIG.modelScale || 1;
            model.scale.setScalar(baseMysteryScale);
            model.rotation.set(
                THREE.MathUtils.degToRad(Math.random() * 20 - 10),
                Math.random() * Math.PI * 2,
                THREE.MathUtils.degToRad(Math.random() * 16 - 8)
            );
            model.userData.lidPivot?.rotation?.set(0, 0, 0);
            if (model.userData.burstPieces && model.userData.burstStartPos && model.userData.burstStartRot) {
                model.userData.burstPieces.forEach((piece, index) => {
                    const startPos = model.userData.burstStartPos[index];
                    const startRot = model.userData.burstStartRot[index];
                    if (startPos) piece.position.copy(startPos);
                    if (startRot) piece.rotation.copy(startRot);
                    piece.scale.setScalar(1);
                    applyMysteryPieceOpacity(piece, 1);
                });
            }
            if (model.userData.innerLight) {
                model.userData.innerLight.position.set(0, 1.1, 0);
                model.userData.innerLight.intensity = boxTheme.innerLightBaseIntensity ?? 1.15;
                model.userData.innerLight.distance = boxTheme.innerLightBaseDistance ?? 6.4;
            }
            if (model.userData.dustPoints?.material) {
                model.userData.dustPoints.visible = false;
                model.userData.dustPoints.material.opacity = 0;
                model.userData.dustPoints.material.size = model.userData.dustDefaultSize ?? 0.1;
            }
            if (Array.isArray(model.userData.sparkleEntries)) {
                model.userData.sparkleEntries.forEach((entry) => {
                    if (!entry?.sprite || !entry?.material) {
                        return;
                    }
                    entry.sprite.visible = true;
                    entry.material.opacity = 0;
                    entry.material.rotation = 0;
                    entry.sprite.position.set(
                        Math.cos(entry.baseAngle) * entry.orbitRadius,
                        entry.baseHeight,
                        Math.sin(entry.baseAngle) * entry.orbitRadius * entry.ellipse
                    );
                    entry.sprite.scale.set(entry.baseScale, entry.baseScale, 1);
                });
            }
            if (Array.isArray(model.userData.ornamentEntries)) {
                model.userData.ornamentEntries.forEach((entry) => {
                    if (!entry?.mesh) {
                        return;
                    }
                    entry.mesh.visible = true;
                    if (entry.basePosition) {
                        entry.mesh.position.copy(entry.basePosition);
                    }
                    if (entry.baseRotation) {
                        entry.mesh.rotation.copy(entry.baseRotation);
                    }
                    if (entry.baseScale) {
                        entry.mesh.scale.copy(entry.baseScale);
                    }
                });
            }
            if (model.userData.dustPoints?.geometry?.attributes?.position?.array && model.userData.dustBase) {
                const dustArray = model.userData.dustPoints.geometry.attributes.position.array;
                const baseArray = model.userData.dustBase;
                const len = Math.min(dustArray.length, baseArray.length);
                for (let i = 0; i < len; i++) {
                    dustArray[i] = baseArray[i];
                }
                model.userData.dustPoints.geometry.attributes.position.needsUpdate = true;
            }
            const { core: mysteryShadowCore, tail: mysteryShadowTail, contact: mysteryShadowContact } = createMysteryGroundShadows();
            scene.add(mysteryShadowTail);
            scene.add(mysteryShadowCore);
            scene.add(mysteryShadowContact);
            mysteryState.shadowCore = mysteryShadowCore;
            mysteryState.shadowTail = mysteryShadowTail;
            mysteryState.shadowContact = mysteryShadowContact;
            scene.add(model);
            mysteryState.phase = 'falling';
            mysteryState.root = model;
            mysteryState.timer = 0;
            mysteryState.startY = startY;
            mysteryState.landingY = landingTarget.y;
            mysteryState.startPoint.copy(landingTarget).setY(startY);
            mysteryState.landingPoint = landingTarget.clone();
            mysteryState.seed = Math.random() * Math.PI * 2;
            const fallDistance = Math.max(0.35, Math.abs(startY - landingTarget.y));
            const gravity = MYSTERY_BOX_CONFIG.fallGravity || 16.8;
            mysteryState.fallVelocity = -Math.sqrt(gravity * fallDistance * 2) * 0.85;
            mysteryState.spinVelX = (Math.random() * 0.58 + 0.08) * (Math.random() < 0.5 ? -1 : 1);
            mysteryState.spinVelY = (Math.random() * 1.45 + 0.35) * (Math.random() < 0.5 ? -1 : 1);
            mysteryState.spinVelZ = (Math.random() * 0.34 + 0.04) * (Math.random() < 0.5 ? -1 : 1);
            mysteryState.settled = false;
            mysteryState.rewardKey = preselectedRewardKey;
            mysteryState.rewardLabel = preselectedRewardKey ? getPropLabelByKey(preselectedRewardKey) : null;
            mysteryState.boxRarity = preselectedBoxRarity;
            mysteryState.rewardShown = false;
            mysteryState.previewPrimed = false;
            mysteryState.previewPreloadQueued = false;
            mysteryState.preloadedPreview = null;
            mysteryState.landedYaw = model.rotation.y;
            mysteryState.pressActive = false;
            mysteryState.pressPointerId = null;
            mysteryState.pressQueuedOpen = false;
            mysteryState.pressDepth = 0;
            mysteryState.openStartPressDepth = 0;
            mysteryState.rattleCooldown = 0;
            mysteryState.rattleTimer = 0;
            mysteryState.rattleSeed = Math.random() * Math.PI * 2;
            mysteryState.baseScale = baseMysteryScale;
            mysteryState.shadowFade = 1;
            updateMysteryGroundShadows(model);
            setContactShadowFade(1);
            if (preselectedRewardKey) {
                scheduleMysteryRewardPreviewPreload(preselectedRewardKey);
            }
        }

        function interruptCharacterActionScenesForMystery() {
            if (emotionState.active) {
                const fadeOut = Math.max(0.01, emotionState.active.fadeOut ?? 0.45);
                emotionState.elapsed = Math.max(emotionState.elapsed, emotionState.active.duration - fadeOut);
                emotionState.active = null;
            }
            emotionState.elapsed = 0;
            if (stuntState.active) {
                const fadeOut = Math.max(0.01, stuntState.active.fadeOut ?? 0.55);
                stuntState.elapsed = Math.max(stuntState.elapsed, stuntState.active.duration - fadeOut);
                stuntState.active = null;
            }
            stuntState.cooldown = Math.max(stuntState.cooldown, 3.2);
            // Let current stunt pose carry through, but remove residual inertial impulses.
            // This prevents sudden downward snaps when the Mystery ascent begins.
            stuntSim.vel.set(0, 0, 0);
            stuntSim.rotVel.set(0, 0, 0);
            stuntSim.flapHzAdd = 0;
            stuntSim.wingAmpMul = 1;
            holdInput.active = false;
            holdInput.pointerId = null;
            holdInput.startedMs = 0;
            holdInput.triggered = false;

            const blendDur = Math.max(0.001, MYSTERY_CHARACTER_FLIGHT_CONFIG.interruptionBlendDuration ?? 0.42);
            mysteryFlightCinematic.actionSuppress = blendDur;
        }

        function startMysteryFlightCinematic(waitForSelectionReturn = false) {

            mysteryFlightCinematic.returnStartOffset.set(0, 0, 0);
            mysteryFlightCinematic.returnStartBodyYaw = 0;
            mysteryFlightCinematic.returnStartBodyPitch = 0;

        function requestMysteryFlightReturn() {
            if (!mysteryFlightCinematic.active) {
                return;
            }
            mysteryFlightCinematic.returnQueued = true;
            if (mysteryFlightCinematic.phase === 'hold') {
                const holdDuration = Math.max(0.001, MYSTERY_CHARACTER_FLIGHT_CONFIG.holdDuration ?? 0.26);
                const carry = Math.max(0, mysteryFlightCinematic.timer - holdDuration);
                mysteryFlightCinematic.phase = 'return';
                mysteryFlightCinematic.timer = carry;
                mysteryFlightCinematic.returnStartOffset.copy(mysteryFlightCinematic.rigOffset);
                mysteryFlightCinematic.returnStartBodyYaw = mysteryFlightCinematic.bodyYaw;
                mysteryFlightCinematic.returnStartBodyPitch = mysteryFlightCinematic.bodyPitch;
                mysteryFlightCinematic.returnStartBodyRoll = mysteryFlightCinematic.bodyRoll;
                mysteryFlightCinematic.returnStartEyeY = mysteryFlightCinematic.eyeTargetY;
            }
        }

        function releaseMysteryFlightReturnAfterSelection() {
            if (!mysteryFlightCinematic.active || !mysteryFlightCinematic.returnAfterSelectionOnly) {
                return;
            }
            mysteryFlightCinematic.returnAfterSelectionOnly = false;
            requestMysteryFlightReturn();
        }

        function updateMysteryFlightCinematic(dt, t) {
            const fx = mysteryFlightCinematic;
            fx.rigOffset.set(0, 0, 0);
            fx.wingBoost = 1;
            fx.hardFlap = 0;
            fx.wingLift = 0;
            fx.bodyYaw = 0;
            fx.bodyPitch = 0;
            fx.bodyRoll = 0;
            fx.rigPitch = 0;
            fx.rigYaw = 0;
            fx.rigRoll = 0;
            fx.eyeTargetX = 0;
            fx.eyeTargetY = 0;
            fx.eyeBlend = 0;
            if (!fx.active) {
                return fx;
            }

            const cfg = MYSTERY_CHARACTER_FLIGHT_CONFIG;
            const clamp01 = (v) => THREE.MathUtils.clamp(v, 0, 1);
            const smooth01 = (v) => {
                const c = clamp01(v);
                return c * c * (3 - 2 * c);
            };
            const smoother01 = (v) => {
                const c = clamp01(v);
                return c * c * c * (c * (c * 6 - 15) + 10);
            };
            const flowing01 = (v) => THREE.MathUtils.lerp(smooth01(v), clamp01(v), 0.58);
            const flowingSoft01 = (v) => THREE.MathUtils.lerp(smoother01(v), clamp01(v), 0.62);
            const easeOutCubic = (v) => 1 - Math.pow(1 - clamp01(v), 3);
            const easeInCubic = (v) => Math.pow(clamp01(v), 3);
            const tau = Math.PI * 2;
            const advancePhaseWithCarry = (nextPhase, phaseDuration) => {
                fx.phase = nextPhase;
                fx.timer = Math.max(0, fx.timer - Math.max(0.001, phaseDuration));
            };
            const sampleFlapTiming = () => {
                const stroke = Math.sin(fx.wingPhase);
                const down = Math.max(0, stroke);
                const up = Math.max(0, -stroke);
                const downVel = Math.max(0, Math.cos(fx.wingPhase));
                const velGatedByPose = down * (0.55 + 0.45 * downVel);
                const drive = clamp01(THREE.MathUtils.lerp(down, velGatedByPose, cfg.flapDriveVelocityBlend ?? 0.42));
                // Strict kinematic gate: only non-zero while the wings are actively moving downward.
                const downstrokeStartThreshold = cfg.downstrokeStartThreshold ?? 0.08;
                const moveDrive = clamp01(
                    (downVel - downstrokeStartThreshold) / Math.max(0.001, 1 - downstrokeStartThreshold)
                );
                return { down, up, drive, moveDrive };
            };
            const getOffscreenFallbackDelay = () => Math.max(
                0.001,
                cfg.offscreenHardFailDelay ?? cfg.offscreenFallbackDelay ?? 1.85
            );
            const getOffscreenDropDelay = (clearanceState = null) => {
                const visibility = clearanceState || getMysteryFlightVisualClearanceState(cfg);
                if (visibility.fullyAboveTop) {
                    return Math.max(0.06, cfg.offscreenClearDropDelay ?? 0.14);
                }
                if (visibility.fullyOffscreen) {
                    return Math.max(0.08, cfg.offscreenDropDelay ?? 0.28);
                }
                return Math.max(0.12, cfg.offscreenFallbackDropDelay ?? cfg.offscreenDropDelay ?? 0.38);
            };

            fx.timer += dt;
            if (fx.actionSuppress > 0) {
                fx.actionSuppress = Math.max(0, fx.actionSuppress - dt);
            }

            const rawSide =
                fx.anticipationSide !== 0
                    ? fx.anticipationSide
                    : Math.sign(creatureGroup.rotation.y);
            const signedSide = rawSide !== 0 ? rawSide : 1;
            const finalSide = fx.finalSide || (-signedSide);
            const spinYawBase = fx.spinYaw || 0;

            if (fx.phase === 'backflip') {
                const dur = Math.max(0.001, cfg.backflipDuration ?? 0.52);
                const p = clamp01(fx.timer / dur);
                const e = smoother01(p);
                const side = finalSide || 1;

                const wingHz = THREE.MathUtils.lerp(
                    cfg.backflipWingHzStart ?? 3.6,
                    cfg.backflipWingHzEnd ?? 4.8,
                    e
                );
                fx.wingPhase += wingHz * tau * dt;
                const flap = sampleFlapTiming();
                const down = flap.down;
                const up = flap.up;
                const drive = flap.drive;
                const amp = THREE.MathUtils.lerp(
                    cfg.backflipWingAmpStart ?? 0.16,
                    cfg.backflipWingAmpEnd ?? 0.24,
                    e
                );

                fx.rigOffset.x = THREE.MathUtils.lerp(0, cfg.backflipTravelX ?? 0.06, e) * side;
                fx.rigOffset.y = Math.sin(Math.PI * p) * (cfg.backflipLift ?? 0.64);
                fx.rigOffset.z = THREE.MathUtils.lerp(0, cfg.backflipTravelZ ?? -0.38, e);

                fx.rigPitch = Math.PI * 2 * e;
                fx.rigYaw = spinYawBase;
                fx.rigRoll = 0;

                fx.hardFlap = -(amp * down) + amp * 0.2 * up;
                fx.wingBoost = 1.12 + amp * 1.8;
                fx.wingLift = 0.02 + drive * 0.08;

                fx.bodyYaw = spinYawBase;
                fx.bodyPitch = THREE.MathUtils.lerp(-0.18, -0.04, e);
                fx.bodyRoll = side * Math.sin(Math.PI * p) * 0.05;
                fx.eyeBlend = 0.92;
                fx.eyeTargetY = 0.06;

                if (p >= 1) {
                    fx.spinYaw = spinYawBase;
                    advancePhaseWithCarry('verticalAscent', dur);
                    fx.burstStartOffset.copy(fx.rigOffset);
                    fx.burstVelocity.set(0, 0, 0);
                }
                return fx;
            }

            if (fx.phase === 'verticalAscent') {
                const dur = Math.max(0.001, cfg.verticalAscentDuration ?? 2.12);
                const p = clamp01(fx.timer / dur);
                const e = easeOutCubic(p);
                const side = finalSide || 1;

                const wingHz = THREE.MathUtils.lerp(
                    cfg.verticalAscentWingHzStart ?? 3.5,
                    cfg.verticalAscentWingHzEnd ?? 5.6,
                    e
                );
                fx.wingPhase += wingHz * tau * dt;
                const flap = sampleFlapTiming();
                const down = flap.down;
                const up = flap.up;
                const drive = flap.drive;
                const amp = THREE.MathUtils.lerp(
                    cfg.verticalAscentWingAmpStart ?? 0.2,
                    cfg.verticalAscentWingAmpEnd ?? 0.34,
                    e
                );

                const xBlend = 1 - Math.exp(-(cfg.verticalAscentXDamp ?? 5.8) * p);
                const zBlend = 1 - Math.exp(-(cfg.verticalAscentZDamp ?? 2.1) * p);
                const clearanceState = getMysteryFlightVisualClearanceState(cfg);
                const lift = (cfg.verticalAscentHeight ?? 14.2) * Math.pow(e, cfg.verticalAscentLiftCurve ?? 1.24);
                const clearanceLift = getMysteryFlightClearanceLift(fx.timer, dur, cfg, 1.08, clearanceState);
                const y = fx.burstStartOffset.y + lift + drive * 0.16 + clearanceLift;
                const x = THREE.MathUtils.lerp(fx.burstStartOffset.x, 0, xBlend);
                const z = THREE.MathUtils.lerp(fx.burstStartOffset.z, cfg.verticalAscentZTarget ?? -0.46, zBlend);
                fx.rigOffset.set(x, y, z);

                fx.rigPitch = Math.PI * 2;
                fx.rigYaw = spinYawBase;
                fx.rigRoll = side * Math.sin(fx.wingPhase * 0.17) * 0.035;

                fx.hardFlap = -(amp * down) + amp * 0.24 * up;
                fx.wingBoost = 1.14 + amp * 1.65;
                fx.wingLift = 0.035 + drive * 0.095;

                fx.bodyYaw = spinYawBase;
                fx.bodyPitch = THREE.MathUtils.lerp(
                    cfg.verticalAscentBodyPitchStart ?? -0.12,
                    cfg.verticalAscentBodyPitchEnd ?? -0.52,
                    e
                );
                fx.bodyRoll = side * Math.sin(fx.wingPhase * 0.15) * 0.045;
                fx.eyeBlend = 1;
                fx.eyeTargetY = 0.1;

                const isOffscreen = clearanceState.fullyAboveTop || clearanceState.fullyOffscreen;
                const dropDelay = getOffscreenDropDelay(clearanceState);
                if (!fx.offscreenTriggered) {
                    if (isOffscreen) {
                        fx.offscreenTriggered = true;
                        fx.offscreenTimer = 0;
                    } else if (p >= 1) {
                        fx.offscreenTimer += dt;
                        if (fx.offscreenTimer >= getOffscreenFallbackDelay()) {
                            fx.offscreenTriggered = true;
                            fx.offscreenTimer = 0;
                        }
                    } else {
                        fx.offscreenTimer = 0;
                    }
                } else {
                    fx.offscreenTimer += dt;
                }

                const noDropWindow = THREE.MathUtils.clamp(cfg.verticalAscentNoDropWindow ?? 0.34, 0, 1);
                if (
                    !fx.dropTriggered &&
                    p >= noDropWindow &&
                    fx.offscreenTriggered &&
                    fx.offscreenTimer >= dropDelay
                ) {
                    fx.dropTriggered = true;
                    fx.spinYaw = fx.bodyYaw;
                    launchMysteryBox();
                    requestMysteryFlightReturn();
                    fx.phase = 'hold';
                    fx.timer = 0;
                    fx.returnStartOffset.copy(fx.rigOffset);
                    fx.returnStartBodyYaw = fx.bodyYaw;
                    fx.returnStartBodyPitch = fx.bodyPitch;
                    fx.returnStartBodyRoll = fx.bodyRoll;
                    fx.returnStartEyeY = fx.eyeTargetY;
                }
                return fx;
            }

            if (fx.phase === 'pivot') {
                const dur = Math.max(0.001, cfg.pivotDuration ?? 0.46);
                const p = clamp01(fx.timer / dur);
                const e = flowingSoft01(p);
                const side = finalSide || 1;

                const wingHz = THREE.MathUtils.lerp(
                    cfg.pivotWingHzStart ?? 2.5,
                    cfg.pivotWingHzEnd ?? 3.5,
                    e
                );
                fx.wingPhase += wingHz * tau * dt;
                const flap = sampleFlapTiming();
                const down = flap.down;
                const up = flap.up;
                const drive = flap.drive;
                const amp = THREE.MathUtils.lerp(
                    cfg.pivotWingAmpStart ?? 0.14,
                    cfg.pivotWingAmpEnd ?? 0.22,
                    e
                );

                fx.rigOffset.x = THREE.MathUtils.lerp(0, cfg.pivotShiftX ?? 0.24, e) * side;
                fx.rigOffset.y = (cfg.pivotLift ?? 0.42) * e + drive * 0.05;
                fx.rigOffset.z = THREE.MathUtils.lerp(cfg.backflipTravelZ ?? -0.38, cfg.pivotShiftZ ?? -0.26, e);

                const pivotYaw = spinYawBase + side * (cfg.pivotYawRight ?? 0.68);
                fx.rigPitch = Math.PI * 2;
                fx.rigYaw = THREE.MathUtils.lerp(spinYawBase, pivotYaw, e);
                fx.rigRoll = side * THREE.MathUtils.lerp(0.02, 0.08, e);

                fx.hardFlap = -(amp * down) + amp * 0.22 * up;
                fx.wingBoost = 1.08 + amp * 1.5;
                fx.wingLift = 0.02 + drive * 0.06;

                fx.bodyYaw = fx.rigYaw;
                fx.bodyPitch = THREE.MathUtils.lerp(-0.04, -0.22, e);
                fx.bodyRoll = side * THREE.MathUtils.lerp(0.04, -0.1, e);
                fx.eyeBlend = 1;
                fx.eyeTargetY = 0.08;

                if (p >= 1) {
                    fx.spinYaw = pivotYaw;
                    advancePhaseWithCarry('diagonalAscent', dur);
                    fx.burstStartOffset.copy(fx.rigOffset);
                    fx.burstVelocity.set(
                        side * (cfg.diagonalVelX ?? 1.22),
                        cfg.diagonalVelY ?? 3.8,
                        cfg.diagonalVelZ ?? -1.28
                    );
                }
                return fx;
            }

            if (fx.phase === 'diagonalAscent') {
                const dur = Math.max(0.001, cfg.diagonalAscentDuration ?? 1.02);
                const p = clamp01(fx.timer / dur);
                const e = easeOutCubic(p);
                const side = finalSide || 1;
                const tPhys = p * dur;

                const ax = side * (cfg.diagonalAccelX ?? 0.52);
                const ay = cfg.diagonalAccelY ?? 3.45;
                const az = cfg.diagonalAccelZ ?? -0.18;
                const x = fx.burstStartOffset.x + fx.burstVelocity.x * tPhys + 0.5 * ax * tPhys * tPhys;
                const clearanceState = getMysteryFlightVisualClearanceState(cfg);
                const clearanceLift = getMysteryFlightClearanceLift(fx.timer, dur, cfg, 1.18, clearanceState);
                const y = fx.burstStartOffset.y + fx.burstVelocity.y * tPhys + 0.5 * ay * tPhys * tPhys + clearanceLift;
                const z = fx.burstStartOffset.z + fx.burstVelocity.z * tPhys + 0.5 * az * tPhys * tPhys;
                fx.rigOffset.set(x, y, z);

                const wingHz = THREE.MathUtils.lerp(
                    cfg.diagonalWingHzStart ?? 3.2,
                    cfg.diagonalWingHzEnd ?? 4.6,
                    e
                );
                fx.wingPhase += wingHz * tau * dt;
                const flap = sampleFlapTiming();
                const down = flap.down;
                const up = flap.up;
                const drive = flap.drive;
                const amp = THREE.MathUtils.lerp(
                    cfg.diagonalWingAmpStart ?? 0.2,
                    cfg.diagonalWingAmpEnd ?? 0.32,
                    e
                );
                fx.hardFlap = -(amp * down) + amp * 0.24 * up;
                fx.wingBoost = 1.16 + amp * 1.6;
                fx.wingLift = 0.04 + drive * 0.09;

                fx.rigPitch = Math.PI * 2;
                fx.rigYaw = spinYawBase;
                fx.rigRoll = side * THREE.MathUtils.lerp(
                    cfg.diagonalRollStart ?? -0.05,
                    cfg.diagonalRollEnd ?? -0.2,
                    e
                );

                const yawTarget = spinYawBase + side * (cfg.diagonalYawTarget ?? 0.62);
                fx.bodyYaw = THREE.MathUtils.lerp(spinYawBase, yawTarget, e);
                fx.bodyPitch = THREE.MathUtils.lerp(
                    cfg.diagonalPitchStart ?? -0.24,
                    cfg.diagonalPitchEnd ?? -0.46,
                    e
                );
                fx.bodyRoll = fx.rigRoll;
                fx.eyeBlend = 1;
                fx.eyeTargetY = 0.09;

                if (p >= 1) {
                    fx.spinYaw = yawTarget;
                    advancePhaseWithCarry('spiralAscent', dur);
                    fx.burstStartOffset.copy(fx.rigOffset);
                }
                return fx;
            }

            if (fx.phase === 'spiralAscent') {
                const dur = Math.max(0.001, cfg.spiralAscentDuration ?? 1.84);
                const p = clamp01(fx.timer / dur);
                const e = smoother01(p);
                const side = finalSide || 1;

                const turns = cfg.spiralTurns ?? 3.15;
                const angle = side * e * Math.PI * 2 * turns;
                const radius = THREE.MathUtils.lerp(
                    cfg.spiralRadiusStart ?? 1.04,
                    cfg.spiralRadiusEnd ?? 0.24,
                    e
                );
                const ellipse = cfg.spiralEllipse ?? 0.72;
                const driftX = (cfg.spiralDriftX ?? 0.62) * e * side;
                const driftZ = (cfg.spiralDriftZ ?? -0.76) * e;
                const lift = (cfg.spiralLift ?? 4.8) * Math.pow(e, cfg.spiralLiftCurve ?? 1.4);

                fx.rigOffset.x = fx.burstStartOffset.x + driftX + Math.cos(angle) * radius;
                fx.rigOffset.z = fx.burstStartOffset.z + driftZ + Math.sin(angle) * radius * ellipse;
                fx.rigOffset.y = fx.burstStartOffset.y + lift;

                const wingHz = THREE.MathUtils.lerp(
                    cfg.spiralWingHzStart ?? 4.8,
                    cfg.spiralWingHzEnd ?? 8.4,
                    e
                );
                fx.wingPhase += wingHz * tau * dt;
                const flap = sampleFlapTiming();
                const down = flap.down;
                const up = flap.up;
                const drive = flap.drive;
                const amp = THREE.MathUtils.lerp(
                    cfg.spiralWingAmpStart ?? 0.3,
                    cfg.spiralWingAmpEnd ?? 0.5,
                    e
                );
                fx.hardFlap = -(amp * down) + amp * 0.26 * up;
                fx.wingBoost = 1.22 + amp * 1.85;
                fx.wingLift = 0.05 + drive * 0.1;

                const yawTarget = spinYawBase + side * (cfg.spiralYawTarget ?? 0.88);
                fx.bodyYaw = yawTarget;
                fx.bodyPitch = THREE.MathUtils.lerp(
                    cfg.spiralPitchStart ?? -0.42,
                    cfg.spiralPitchEnd ?? -0.6,
                    e
                );
                fx.bodyRoll = side * (
                    (cfg.spiralRollBase ?? -0.18) + Math.sin(angle) * (cfg.spiralRollOrbit ?? 0.22)
                );

                fx.rigPitch = Math.PI * 2;
                fx.rigYaw = yawTarget;
                fx.rigRoll = fx.bodyRoll;

                fx.eyeBlend = 1;
                fx.eyeTargetY = 0.1;

                if (p >= 1) {
                    fx.spinYaw = yawTarget;
                    advancePhaseWithCarry('breakout', dur);
                    fx.burstStartOffset.copy(fx.rigOffset);
                    fx.burstVelocity.set(
                        side * (cfg.breakoutVelX ?? 2.5),
                        cfg.breakoutVelY ?? 6.9,
                        cfg.breakoutVelZ ?? -2.35
                    );
                }
                return fx;
            }

            if (fx.phase === 'breakout') {
                const dur = Math.max(0.001, cfg.breakoutDuration ?? 1.34);
                const p = clamp01(fx.timer / dur);
                const e = easeOutCubic(p);
                const side = finalSide || 1;
                const tPhys = p * dur;

                const ax = side * (cfg.breakoutAccelX ?? 0.64);
                const ay = cfg.breakoutAccelY ?? 4.1;
                const az = cfg.breakoutAccelZ ?? -0.22;
                const x = fx.burstStartOffset.x + fx.burstVelocity.x * tPhys + 0.5 * ax * tPhys * tPhys;
                const y = fx.burstStartOffset.y + fx.burstVelocity.y * tPhys + 0.5 * ay * tPhys * tPhys;
                const z = fx.burstStartOffset.z + fx.burstVelocity.z * tPhys + 0.5 * az * tPhys * tPhys;
                fx.rigOffset.set(x, y, z);

                const wingHz = THREE.MathUtils.lerp(
                    cfg.breakoutWingHzStart ?? 7.2,
                    cfg.breakoutWingHzEnd ?? 5.4,
                    e
                );
                fx.wingPhase += wingHz * tau * dt;
                const flap = sampleFlapTiming();
                const down = flap.down;
                const up = flap.up;
                const drive = flap.drive;
                const amp = THREE.MathUtils.lerp(
                    cfg.breakoutWingAmpStart ?? 0.48,
                    cfg.breakoutWingAmpEnd ?? 0.24,
                    e
                );
                fx.hardFlap = -(amp * down) + amp * 0.24 * up;
                fx.wingBoost = 1.26 + amp * 1.52;
                fx.wingLift = 0.06 + drive * 0.1;

                const yawTarget = spinYawBase + side * (cfg.breakoutYawTarget ?? 0.44);
                fx.bodyYaw = THREE.MathUtils.lerp(spinYawBase, yawTarget, e);
                fx.bodyPitch = THREE.MathUtils.lerp(
                    cfg.breakoutPitchStart ?? -0.58,
                    cfg.breakoutPitchEnd ?? -0.34,
                    e
                );
                fx.bodyRoll = side * THREE.MathUtils.lerp(
                    cfg.breakoutRollStart ?? -0.24,
                    cfg.breakoutRollEnd ?? -0.08,
                    e
                );
                fx.rigPitch = Math.PI * 2;
                fx.rigYaw = fx.bodyYaw;
                fx.rigRoll = fx.bodyRoll;
                fx.eyeBlend = 1;
                fx.eyeTargetY = 0.1;

                const isOffscreen = clearanceState.fullyAboveTop || clearanceState.fullyOffscreen;
                const dropDelay = getOffscreenDropDelay(clearanceState);
                if (!fx.offscreenTriggered) {
                    if (isOffscreen) {
                        fx.offscreenTriggered = true;
                        fx.offscreenTimer = 0;
                    } else if (p >= 1) {
                        fx.offscreenTimer += dt;
                        if (fx.offscreenTimer >= getOffscreenFallbackDelay()) {
                            fx.offscreenTriggered = true;
                            fx.offscreenTimer = 0;
                        }
                    } else {
                        fx.offscreenTimer = 0;
                    }
                } else {
                    fx.offscreenTimer += dt;
                }

                const minDropProgress = THREE.MathUtils.clamp(cfg.breakoutMinDropProgress ?? 0.34, 0, 1);
                if (
                    !fx.dropTriggered &&
                    p >= minDropProgress &&
                    fx.offscreenTriggered &&
                    fx.offscreenTimer >= dropDelay
                ) {
                    fx.dropTriggered = true;
                    fx.spinYaw = fx.bodyYaw;
                    launchMysteryBox();
                    requestMysteryFlightReturn();
                    fx.phase = 'hold';
                    fx.timer = 0;
                    fx.returnStartOffset.copy(fx.rigOffset);
                    fx.returnStartBodyYaw = fx.bodyYaw;
                    fx.returnStartBodyPitch = fx.bodyPitch;
                    fx.returnStartBodyRoll = fx.bodyRoll;
                    fx.returnStartEyeY = fx.eyeTargetY;
                }
                return fx;
            }

            if (fx.phase === 'anticipation') {
                const dur = Math.max(0.001, cfg.anticipationDuration ?? 3);
                const p = clamp01(fx.timer / dur);
                const e = flowingSoft01(p);
                const env = Math.sin(Math.PI * p);

                const dip = -Math.sin(Math.PI * p) * (cfg.anticipationDip ?? 0.18);
                const anticipationMoveScale = Math.max(0.001, cfg.anticipationMovementScale ?? 1);
                const spinRise = THREE.MathUtils.lerp(
                    cfg.anticipationLiftStart ?? 0.06,
                    cfg.anticipationLiftEnd ?? 0.48,
                    e
                );
                fx.rigOffset.y = (dip * 0.48 + spinRise + (cfg.anticipationLift ?? 0.08) * e) * anticipationMoveScale;
                fx.rigOffset.z = THREE.MathUtils.lerp(cfg.anticipationBack ?? -0.56, cfg.lookUpBack ?? -1.05, e) * anticipationMoveScale;

                const wingHz = THREE.MathUtils.lerp(
                    cfg.anticipationWingHzStart ?? 1.02,
                    cfg.anticipationWingHzEnd ?? 1.55,
                    e
                );
                fx.wingPhase += wingHz * tau * dt;
                const flap = sampleFlapTiming();
                const down = flap.down;
                const up = flap.up;
                const downDrive = flap.drive;
                const amp = THREE.MathUtils.lerp(
                    cfg.anticipationWingAmpStart ?? 0.03,
                    cfg.anticipationWingAmpEnd ?? 0.07,
                    e
                );
                const anticipationExcite = Math.sin(fx.wingPhase * 1.25 + p * Math.PI * 0.8);
                const anticipationYawEnd = spinYawBase + signedSide * (cfg.anticipationOppositeYaw ?? -0.22);
                const wagYaw =
                    Math.sin(fx.wingPhase * 0.58 + p * Math.PI) *
                    (cfg.anticipationYawTurn ?? 0.34) *
                    env *
                    0.42;
                fx.bodyYaw = THREE.MathUtils.lerp(spinYawBase, anticipationYawEnd, e) + wagYaw;

                fx.rigOffset.y += downDrive * (cfg.anticipationFlapLift ?? 0.12) * anticipationMoveScale * (0.32 + 0.68 * p);
                fx.rigOffset.x =
                    signedSide *
                    (cfg.anticipationSway ?? 0.16) *
                    Math.sin(fx.wingPhase * 0.46 + p * Math.PI * 0.9) *
                    anticipationMoveScale *
                    (0.3 + 0.7 * env);
                fx.rigOffset.x += anticipationExcite * (cfg.anticipationExciteSway ?? 0.09) * anticipationMoveScale * (0.28 + 0.72 * env);
                fx.hardFlap = -(amp * down) + amp * 0.25 * up;
                fx.wingBoost = 1 + amp * 1.55;
                fx.wingLift = 0.01 + downDrive * 0.03;
                fx.bodyPitch = THREE.MathUtils.lerp(0.02, -0.1, e) + downDrive * (cfg.anticipationExcitePitch ?? 0.05) * (0.25 + 0.75 * env);
                fx.bodyRoll =
                    signedSide * (cfg.anticipationRoll ?? 0.15) * 0.22 * env +
                    anticipationExcite * (cfg.anticipationExciteRoll ?? 0.08) * (0.3 + 0.7 * env);
                fx.eyeBlend = 0.5;
                fx.eyeTargetY = 0.02 + 0.01 * e;

                if (p >= 1) {
                    fx.spinYaw = anticipationYawEnd;
                    advancePhaseWithCarry('lookUp', dur);
                }
                return fx;
            }

            if (fx.phase === 'lookUp') {
                const dur = Math.max(0.001, cfg.lookUpDuration ?? 0.78);
                const p = clamp01(fx.timer / dur);
                const e = smoother01(p);
                const env = Math.sin(Math.PI * p);

                const wingHz = THREE.MathUtils.lerp(cfg.lookUpWingHzStart ?? 1.9, cfg.lookUpWingHzEnd ?? 2.8, e);
                fx.wingPhase += wingHz * tau * dt;
                const flap = sampleFlapTiming();
                const down = flap.down;
                const up = flap.up;
                const drive = flap.drive;
                const amp = THREE.MathUtils.lerp(0.1, 0.2, e);

                const baseLift = THREE.MathUtils.lerp(0.18, cfg.lookUpLift ?? 0.98, e);
                fx.rigOffset.y = baseLift + drive * 0.14;
                fx.rigOffset.z = THREE.MathUtils.lerp(-0.28, cfg.lookUpBack ?? -1.08, e);
                fx.rigOffset.x = signedSide * Math.sin(e * Math.PI) * 0.12;
                fx.hardFlap = -(amp * down) + amp * 0.24 * up;
                fx.wingBoost = 1.12 + amp * 1.9;
                fx.wingLift = 0.03 + drive * 0.07;
                const lookUpYawEnd = spinYawBase + signedSide * (cfg.lookUpYaw ?? 0.12);
                fx.bodyYaw = THREE.MathUtils.lerp(spinYawBase, lookUpYawEnd, e);
                fx.bodyPitch = THREE.MathUtils.lerp(-0.12, cfg.lookUpPitch ?? -0.46, e);
                fx.bodyRoll = signedSide * Math.sin(e * Math.PI) * 0.032 * (0.6 + 0.4 * env);
                fx.eyeBlend = 1;
                fx.eyeTargetY = THREE.MathUtils.lerp(0.04, cfg.lookUpEyeY ?? 0.1, e);

                if (p >= 1) {
                    fx.spinYaw = lookUpYawEnd;
                    advancePhaseWithCarry('wingCharge', dur);
                }
                return fx;
            }

            if (fx.phase === 'wingCharge') {
                const dur = Math.max(0.001, cfg.wingChargeDuration ?? 0.66);
                const p = clamp01(fx.timer / dur);
                const e = smoother01(p);

                const wingHz = THREE.MathUtils.lerp(cfg.chargeWingHzStart ?? 3.1, cfg.chargeWingHzEnd ?? 4.8, e);
                fx.wingPhase += wingHz * tau * dt;
                const flap = sampleFlapTiming();
                const down = flap.down;
                const up = flap.up;
                const drive = flap.drive;
                const amp = THREE.MathUtils.lerp(0.22, 0.42, e);

                fx.rigOffset.y = THREE.MathUtils.lerp(cfg.lookUpLift ?? 0.98, cfg.chargeLift ?? 1.7, e) + drive * 0.2;
                fx.rigOffset.z = THREE.MathUtils.lerp(cfg.lookUpBack ?? -1.08, cfg.chargeBack ?? -1.86, e);
                fx.rigOffset.x = signedSide * Math.sin(fx.wingPhase * 0.28 + p * Math.PI * 0.7) * 0.08;
                fx.hardFlap = -(amp * down) + amp * 0.28 * up;
                fx.wingBoost = 1.24 + amp * 2.0;
                fx.wingLift = 0.05 + drive * 0.12;
                const chargeYawOffset = THREE.MathUtils.lerp(0, cfg.chargeYaw ?? 0.08, e);
                fx.bodyYaw = spinYawBase + signedSide * chargeYawOffset;
                fx.bodyPitch = THREE.MathUtils.lerp(cfg.lookUpPitch ?? -0.46, cfg.chargePitch ?? -0.66, e);
                fx.bodyRoll = signedSide * Math.sin(fx.wingPhase * 0.23 + 0.35) * 0.022;
                fx.eyeBlend = 1;
                fx.eyeTargetY = (cfg.lookUpEyeY ?? 0.1) + 0.008;

                if (p >= 1) {
                    fx.spinYaw = spinYawBase + signedSide * (cfg.chargeYaw ?? 0.08);
                    fx.launchFlapCount = 0;
                    fx.launchPrevDownDrive = 0;
                    advancePhaseWithCarry('powerFlap', dur);
                }
                return fx;
            }

            if (fx.phase === 'powerFlap') {
                const dur = Math.max(0.001, cfg.powerFlapDuration ?? 0.58);
                const p = clamp01(fx.timer / dur);
                const e = smoother01(p);

                const flapHz = THREE.MathUtils.lerp(
                    cfg.powerFlapQuickHzStart ?? 5.8,
                    cfg.powerFlapQuickHzEnd ?? 6.6,
                    e
                );
                fx.wingPhase += flapHz * tau * dt;

                const flap = sampleFlapTiming();
                const down = flap.down;
                const up = flap.up;
                const drive = flap.drive;
                const downStart = flap.moveDrive > 0.001 && (fx.launchPrevDownDrive ?? 0) <= 0.001;
                if (downStart) {
                    fx.launchFlapCount = (fx.launchFlapCount ?? 0) + 1;
                }
                fx.launchPrevDownDrive = flap.moveDrive;

                const amp = THREE.MathUtils.lerp(0.34, 0.68, e);
                fx.rigOffset.y = (cfg.chargeLift ?? 1.7) + 0.7 * e + drive * 0.26;
                fx.rigOffset.z = THREE.MathUtils.lerp(cfg.chargeBack ?? -1.86, cfg.powerFlapBack ?? -2.46, e);
                fx.rigOffset.x = signedSide * Math.sin(fx.wingPhase * 0.22) * 0.06 * (1 - 0.35 * e);
                fx.hardFlap = -(amp * down) + amp * 0.2 * up;
                fx.wingBoost = THREE.MathUtils.lerp(1.7, cfg.powerFlapWingBoostPeak ?? 3.1, e);
                fx.wingLift = 0.08 + drive * 0.15;
                fx.bodyPitch = THREE.MathUtils.lerp(cfg.chargePitch ?? -0.66, cfg.powerFlapPitch ?? -0.78, e);
                fx.bodyYaw = spinYawBase + signedSide * THREE.MathUtils.lerp(cfg.chargeYaw ?? 0.08, cfg.powerFlapYaw ?? 0, e);
                fx.bodyRoll = signedSide * Math.sin(fx.wingPhase * 0.19 + 0.3) * 0.018;
                fx.eyeBlend = 1;
                fx.eyeTargetY = (cfg.lookUpEyeY ?? 0.1) + 0.01;

                const shouldLaunchByFlap =
                    downStart &&
                    (fx.launchFlapCount ?? 0) >= (cfg.powerFlapLaunchFlapCount ?? 2) &&
                    p >= 0.25;
                const shouldLaunchByFallback = p >= (cfg.powerFlapLaunchFallbackTime ?? 0.82);

                if (shouldLaunchByFlap || shouldLaunchByFallback) {
                    const releaseClamp = clamp01(Math.max(0.88, e));
                    fx.spinYaw = spinYawBase + signedSide * (cfg.powerFlapYaw ?? 0);
                    advancePhaseWithCarry('ascent', dur);
                    fx.wingPhase = cfg.launchDownstrokePhase ?? (Math.PI * 0.42);
                    const downstrokeBoost = THREE.MathUtils.lerp(
                        cfg.liftoffDownstrokeMinBoost ?? 0.98,
                        cfg.liftoffDownstrokeMaxBoost ?? 1.28,
                        Math.max(0.9, drive)
                    );
                    const launchBoost = 1 + releaseClamp * (cfg.powerFlapLaunchBoost ?? 0.34);
                    fx.launchFlapBoost = downstrokeBoost * launchBoost;
                    fx.ascentDrivenTime = 0;
                    fx.ascentPrevY = fx.rigOffset.y;
                    fx.ascentBoostVel = 0;
                    fx.ascentBoostY = 0;
                    fx.launchFlapCount = 0;
                    fx.launchPrevDownDrive = 0;
                    fx.burstStartOffset.copy(fx.rigOffset);
                    fx.burstVelocity.set(
                        finalSide * (cfg.liftoffSideVelocity ?? 0.82) * (0.85 + 0.15 * releaseClamp),
                        (cfg.liftoffVerticalVelocity ?? 7.8) * fx.launchFlapBoost,
                        cfg.liftoffForwardVelocity ?? -1.9
                    );
                    fx.offscreenTriggered = false;
                    fx.offscreenTimer = 0;
                    fx.dropTriggered = false;
                }
                return fx;
            }

            if (fx.phase === 'ascent') {
                const dur = Math.max(0.001, cfg.ascentDuration ?? 1.6);
                const p = clamp01(fx.timer / dur);
                const e = easeOutCubic(p);
                const baseAy = cfg.ascentVerticalAccel ?? 4.9;
                const az = cfg.ascentForwardAccel ?? 0.3;
                const ax = cfg.ascentSideAccel ?? 0.4;

                const wingHz = THREE.MathUtils.lerp(cfg.ascentWingHzStart ?? 6.3, cfg.ascentWingHzEnd ?? 4.7, e);
                fx.wingPhase += wingHz * tau * dt;
                const flap = sampleFlapTiming();
                const down = flap.down;
                const up = flap.up;
                const drive = flap.drive;
                const moveDrive = flap.moveDrive;

                const launchBoost = fx.launchFlapBoost ?? 1;
                const ay = baseAy * THREE.MathUtils.lerp(1, launchBoost, 0.42);
                const tDrivePrev = fx.ascentDrivenTime ?? 0;
                const driveScale = cfg.ascentDriveScale ?? 1.95;
                const flapProgress = THREE.MathUtils.lerp(0.55, 1, moveDrive);
                fx.ascentDrivenTime = Math.min(dur, tDrivePrev + dt * driveScale * flapProgress);
                const tDrive = fx.ascentDrivenTime;
                const driveProgress = clamp01(tDrive / dur);
                const launchCarry = (launchBoost - 1) * Math.exp(-tDrive * (cfg.ascentLaunchBoostDecay ?? 4.0));
                const flapBoostAccel = drive * (cfg.ascentFlapBoost ?? 8.8) * (1 - 0.25 * e);
                fx.ascentBoostVel += (flapBoostAccel + launchCarry * 2.2) * dt;
                fx.ascentBoostVel *= Math.exp(-dt * (cfg.ascentFlapBoostDamping ?? 3.8));
                fx.ascentBoostY += Math.max(0, fx.ascentBoostVel) * dt * (0.35 + 0.65 * drive);

                const speedRampLift = (cfg.ascentSpeedRampLift ?? 1.2) * driveProgress * driveProgress;
                const clearanceState = getMysteryFlightVisualClearanceState(cfg);
                const clearanceLift = getMysteryFlightClearanceLift(fx.timer, dur, cfg, 1.3, clearanceState);
                const yRaw = fx.burstStartOffset.y + fx.burstVelocity.y * tDrive + 0.5 * ay * tDrive * tDrive + speedRampLift + fx.ascentBoostY + clearanceLift;
                const prevY = Number.isFinite(fx.ascentPrevY) ? fx.ascentPrevY : fx.burstStartOffset.y;
                const y = Math.max(yRaw, prevY + dt * 0.02);
                fx.ascentPrevY = y;
                const z = fx.burstStartOffset.z + fx.burstVelocity.z * tDrive + 0.5 * az * tDrive * tDrive;
                const xArc = Math.sin(driveProgress * Math.PI) * (cfg.ascentSideSway ?? 0.16) * finalSide;
                const x = fx.burstStartOffset.x + fx.burstVelocity.x * tDrive + 0.5 * ax * tDrive * tDrive + xArc;
                fx.rigOffset.set(x, y, z);

                const arrowWindow = Math.max(0.001, cfg.launchArrowWindow ?? 0.24);
                const wingDownPin = clamp01(1 - p / arrowWindow);
                const amp = THREE.MathUtils.lerp(cfg.ascentWingAmpStart ?? 0.48, cfg.ascentWingAmpEnd ?? 0.24, e);
                const naturalHardFlap = -(amp * down) + amp * 0.28 * up;
                const pinnedHardFlap = -(cfg.launchWingHardFlap ?? 1.08) * wingDownPin;
                fx.hardFlap = THREE.MathUtils.lerp(naturalHardFlap, pinnedHardFlap, wingDownPin);
                const naturalWingBoost = 1.24 + amp * 1.45;
                fx.wingBoost = THREE.MathUtils.lerp(naturalWingBoost, cfg.launchWingBoostPinned ?? 0.18, wingDownPin);
                const naturalWingLift = 0.05 + drive * 0.09;
                fx.wingLift = THREE.MathUtils.lerp(naturalWingLift, cfg.launchWingLiftPinned ?? -0.04, wingDownPin);

                const vy = Math.max(0, fx.burstVelocity.y + ay * tDrive + fx.ascentBoostVel);
                const vz = fx.burstVelocity.z + az * tDrive;
                const pitchTarget = THREE.MathUtils.clamp(-Math.atan2(vy, Math.max(0.001, Math.abs(vz)) * 0.92) * 0.68, -0.78, 0.08);
                fx.bodyPitch = THREE.MathUtils.lerp(cfg.powerFlapPitch ?? -0.78, pitchTarget, 0.56 + 0.44 * e);
                const yawEnd = cfg.ascentYawEnd ?? 0.02;
                fx.bodyYaw = spinYawBase + THREE.MathUtils.lerp(signedSide * (cfg.powerFlapYaw ?? 0), signedSide * yawEnd, e);
                fx.bodyRoll = finalSide * Math.sin(fx.wingPhase * 0.2 + 0.4) * 0.026 * (1 - 0.45 * e);
                fx.eyeBlend = 1;
                fx.eyeTargetY = cfg.lookUpEyeY ?? 0.1;

                const isOffscreen = clearanceState.fullyAboveTop || clearanceState.fullyOffscreen;
                const dropDelay = getOffscreenDropDelay(clearanceState);
                if (!fx.offscreenTriggered) {
                    if (isOffscreen) {
                        fx.offscreenTriggered = true;
                        fx.offscreenTimer = 0;
                    } else if (p >= 1) {
                        fx.offscreenTimer += dt;
                        if (fx.offscreenTimer >= getOffscreenFallbackDelay()) {
                            fx.offscreenTriggered = true;
                            fx.offscreenTimer = 0;
                        }
                    } else {
                        fx.offscreenTimer = 0;
                    }
                } else {
                    fx.offscreenTimer += dt;
                }

                if (!fx.dropTriggered && fx.offscreenTriggered && (fx.offscreenTimer >= dropDelay)) {
                    fx.dropTriggered = true;
                    fx.spinYaw = fx.bodyYaw;
                    fx.ascentDrivenTime = 0;
                    fx.ascentPrevY = 0;
                    fx.ascentBoostVel = 0;
                    fx.ascentBoostY = 0;
                    launchMysteryBox();
                    requestMysteryFlightReturn();
                    fx.phase = 'hold';
                    fx.timer = 0;
                    fx.returnStartOffset.copy(fx.rigOffset);
                    fx.returnStartBodyYaw = fx.bodyYaw;
                    fx.returnStartBodyPitch = fx.bodyPitch;
                    fx.returnStartBodyRoll = fx.bodyRoll;
                    fx.returnStartEyeY = fx.eyeTargetY;
                }
                return fx;
            }

            if (fx.phase === 'hold') {
                const holdTargetLift = Math.max(
                    cfg.holdLift ?? 20.8,
                    cfg.holdLiftMin ?? 24.6,
                    Number.isFinite(fx.returnStartOffset?.y) ? fx.returnStartOffset.y : 0
                );
                fx.rigOffset.y = holdTargetLift;
                fx.rigOffset.x = Math.sin(fx.wingPhase * 0.22) * (cfg.holdSway ?? 0.2);
                fx.rigOffset.z = Math.cos(fx.wingPhase * 0.18) * (cfg.holdSway ?? 0.2) * 0.35;

                const holdHz = cfg.holdWingHz ?? 2.55;
                fx.wingPhase += holdHz * tau * dt;
                const amp = cfg.holdWingAmp ?? 0.08;
                fx.wingBoost = 0.96;
                fx.hardFlap = Math.sin(fx.wingPhase) * amp;
                fx.wingLift = 0.03;
                const holdDuration = Math.max(0.001, cfg.holdDuration ?? 0.26);
                const holdBlend = clamp01(fx.timer / (holdDuration * 0.32));
                const holdYawTarget = Math.sin(fx.wingPhase * 0.16) * 0.1;
                fx.bodyYaw = THREE.MathUtils.lerp(
                    fx.returnStartBodyYaw,
                    holdYawTarget,
                    holdBlend
                );
                fx.bodyPitch = THREE.MathUtils.lerp(fx.returnStartBodyPitch, -0.1, holdBlend);
                fx.bodyRoll = THREE.MathUtils.lerp(
                    fx.returnStartBodyRoll,
                    Math.sin(fx.wingPhase * 0.18) * 0.045,
                    holdBlend
                );
                fx.eyeBlend = 0.5;
                fx.eyeTargetY = 0.03;
                if (fx.returnQueued && fx.timer >= holdDuration) {
                advancePhaseWithCarry('return', holdDuration);
                fx.returnStartOffset.copy(fx.rigOffset);
                fx.returnStartBodyYaw = fx.bodyYaw;
                    fx.returnStartBodyPitch = fx.bodyPitch;
                    fx.returnStartBodyRoll = fx.bodyRoll;
                    fx.returnStartEyeY = fx.eyeTargetY;
                }
                return fx;
            }

            if (fx.phase === 'return') {
                const dur = Math.max(0.001, cfg.returnDuration ?? 1.28);
                const p = THREE.MathUtils.clamp(fx.timer / dur, 0, 1);
                const e = smoother01(p);
                const glide = easeOutCubic(p);

                const start = fx.returnStartOffset.lengthSq() > 1e-8 ? fx.returnStartOffset : fx.rigOffset;
                const targetX = start.x + (cfg.returnExitDeltaX ?? -7.4);
                const targetY = start.y + (cfg.returnExitDeltaY ?? 8.6);
                const targetZ = start.z + (cfg.returnExitDeltaZ ?? -1.9);

                fx.rigOffset.x = THREE.MathUtils.lerp(start.x, targetX, glide);
                fx.rigOffset.y = THREE.MathUtils.lerp(start.y, targetY, e);
                fx.rigOffset.z = THREE.MathUtils.lerp(start.z, targetZ, glide);

                const returnHz = THREE.MathUtils.lerp(
                    cfg.returnWingHzStart ?? 4.2,
                    cfg.returnWingHzEnd ?? 5.5,
                    e
                );
                fx.wingPhase += returnHz * tau * dt;
                const flap = sampleFlapTiming();
                const down = flap.down;
                const up = flap.up;
                const drive = flap.drive;
                const returnAmp = THREE.MathUtils.lerp(cfg.returnWingAmpStart ?? 0.28, cfg.returnWingAmpEnd ?? 0.1, e);
                fx.wingBoost = THREE.MathUtils.lerp(1.24, 1.02, e);
                fx.hardFlap = -(returnAmp * down) + returnAmp * 0.22 * up;
                fx.wingLift = 0.04 + drive * 0.08;

                const dx = targetX - start.x;
                const dz = targetZ - start.z;
                const headingYaw = THREE.MathUtils.clamp(
                    Math.atan2(dx, Math.max(0.001, -dz)),
                    -1.05,
                    1.05
                );
                const yawTarget = Number.isFinite(headingYaw)
                    ? headingYaw
                    : (cfg.returnTurnYaw ?? -0.62);
                const bankSign = Math.sign(dx) || -1;
                const rollTarget = bankSign * (cfg.returnTurnRoll ?? 0.24);
                const pitchTarget = THREE.MathUtils.lerp(
                    cfg.returnClimbPitchStart ?? -0.14,
                    cfg.returnClimbPitchEnd ?? -0.58,
                    e
                );

                fx.bodyYaw = THREE.MathUtils.lerp(fx.returnStartBodyYaw, yawTarget, e);
                fx.bodyPitch = THREE.MathUtils.lerp(fx.returnStartBodyPitch, pitchTarget, e);
                fx.bodyRoll = THREE.MathUtils.lerp(fx.returnStartBodyRoll, rollTarget, e);
                fx.rigPitch = Math.PI * 2;
                fx.rigYaw = fx.bodyYaw;
                fx.rigRoll = fx.bodyRoll * 0.9;
                fx.eyeBlend = 0.82;
                fx.eyeTargetY = THREE.MathUtils.lerp(fx.returnStartEyeY, 0.1, e);

                if (p >= 1) {
                    fx.active = false;
                    fx.phase = 'idle';
                    fx.timer = 0;
                    fx.returnQueued = false;
                    fx.dropTriggered = false;
                    fx.offscreenTriggered = false;
                    fx.offscreenTimer = 0;
                    fx.rigOffset.set(0, 0, 0);
                    fx.wingBoost = 1;
                    fx.hardFlap = 0;
                    fx.wingLift = 0;
                    fx.bodyYaw = 0;
                    fx.bodyPitch = 0;
                    fx.bodyRoll = 0;
                    fx.rigPitch = 0;
                    fx.rigYaw = 0;
                    fx.rigRoll = 0;
                    fx.eyeTargetX = 0;
                    fx.eyeTargetY = 0;
                    fx.eyeBlend = 0;
                    fx.burstStartOffset.set(0, 0, 0);
                    fx.burstVelocity.set(0, 0, 0);
                    fx.ascentDrivenTime = 0;
                    fx.ascentPrevY = 0;
                    fx.ascentBoostVel = 0;
                    fx.ascentBoostY = 0;
                    fx.launchFlapBoost = 1;
                    fx.launchFlapCount = 0;
                    fx.launchPrevDownDrive = 0;
                    fx.wingPhase = 0;
                    fx.actionSuppress = 0;
                    fx.returnStartOffset.set(0, 0, 0);
                    fx.returnStartBodyYaw = 0;
                    fx.returnStartBodyPitch = 0;
                    fx.returnStartBodyRoll = 0;
                    fx.returnStartEyeY = 0;
                }
                return fx;
            }

            return fx;
        }

        function sampleMysteryFlightRender(dt, rawFx) {
            const cfg = MYSTERY_CHARACTER_FLIGHT_CONFIG;
            const render = mysteryFlightRenderState;
            const safe = (v, fallback = 0) => (Number.isFinite(v) ? v : fallback);

            const rawActive = !!rawFx?.active;
            const targetRigX = rawActive ? safe(rawFx.rigOffset?.x, 0) : 0;
            const targetRigY = rawActive ? safe(rawFx.rigOffset?.y, 0) : 0;
            const targetRigZ = rawActive ? safe(rawFx.rigOffset?.z, 0) : 0;
            const targetWingBoost = rawActive ? safe(rawFx.wingBoost, 1) : 1;
            const targetHardFlap = rawActive ? safe(rawFx.hardFlap, 0) : 0;
            const targetWingLift = rawActive ? safe(rawFx.wingLift, 0) : 0;
            const targetBodyYaw = rawActive ? safe(rawFx.bodyYaw, 0) : 0;
            const targetBodyPitch = rawActive ? safe(rawFx.bodyPitch, 0) : 0;
            const targetBodyRoll = rawActive ? safe(rawFx.bodyRoll, 0) : 0;
            const targetRigPitch = rawActive ? safe(rawFx.rigPitch, 0) : 0;
            const targetRigYaw = rawActive ? safe(rawFx.rigYaw, 0) : 0;
            const targetRigRoll = rawActive ? safe(rawFx.rigRoll, 0) : 0;
            const targetEyeX = rawActive ? safe(rawFx.eyeTargetX, 0) : 0;
            const targetEyeY = rawActive ? safe(rawFx.eyeTargetY, 0) : 0;
            const targetEyeBlend = rawActive ? THREE.MathUtils.clamp(safe(rawFx.eyeBlend, 0), 0, 1) : 0;

            const activeRate = cfg.mysteryRenderActiveSmoothing ?? 10.6;
            const posRate = rawActive ? activeRate : (cfg.mysteryRenderReleaseSmoothing ?? 15);
            const rotRate = rawActive ? activeRate : (cfg.mysteryRenderReleaseSmoothing ?? 15);
            const wingRate = rawActive ? activeRate : (cfg.mysteryRenderReleaseSmoothing ?? 15);
            const posAlpha = 1 - Math.exp(-posRate * dt);
            const rotAlpha = 1 - Math.exp(-rotRate * dt);
            const wingAlpha = 1 - Math.exp(-wingRate * dt);
            const maxRotStep = (cfg.mysteryRenderMaxRotRate ?? 7.2) * dt;
            const maxRigRotStep = (cfg.mysteryRenderMaxRigRotRate ?? 20.5) * dt;

            if (!render.initialized) {
                render.initialized = true;
            }

            render.rigOffset.x += (targetRigX - render.rigOffset.x) * posAlpha;
            render.rigOffset.y += (targetRigY - render.rigOffset.y) * posAlpha;
            render.rigOffset.z += (targetRigZ - render.rigOffset.z) * posAlpha;

            render.wingBoost += (targetWingBoost - render.wingBoost) * wingAlpha;
            render.hardFlap += (targetHardFlap - render.hardFlap) * wingAlpha;
            render.wingLift += (targetWingLift - render.wingLift) * wingAlpha;

            const yawStep = THREE.MathUtils.clamp(shortestAngleDelta(render.bodyYaw, targetBodyYaw) * rotAlpha, -maxRotStep, maxRotStep);
            const pitchStep = THREE.MathUtils.clamp(shortestAngleDelta(render.bodyPitch, targetBodyPitch) * rotAlpha, -maxRotStep, maxRotStep);
            const rollStep = THREE.MathUtils.clamp(shortestAngleDelta(render.bodyRoll, targetBodyRoll) * rotAlpha, -maxRotStep, maxRotStep);
            render.bodyYaw += yawStep;
            render.bodyPitch += pitchStep;
            render.bodyRoll += rollStep;

            const rigYawStep = THREE.MathUtils.clamp(shortestAngleDelta(render.rigYaw, targetRigYaw) * rotAlpha, -maxRigRotStep, maxRigRotStep);
            const rigRollStep = THREE.MathUtils.clamp(shortestAngleDelta(render.rigRoll, targetRigRoll) * rotAlpha, -maxRigRotStep, maxRigRotStep);
            render.rigYaw += rigYawStep;
            render.rigRoll += rigRollStep;

            if (rawActive) {
                // Keep authored cinematic rotation unwrapped so full 360° backflips remain visible.
                render.rigPitch = targetRigPitch;
            } else if (Math.abs(render.rigPitch) > Math.PI * 1.6) {
                // 2π and 0 are equivalent orientations; snap to neutral without a visible unwind.
                render.rigPitch = 0;
            } else {
                render.rigPitch += (0 - render.rigPitch) * rotAlpha;
            }

            render.eyeTargetX += (targetEyeX - render.eyeTargetX) * wingAlpha;
            render.eyeTargetY += (targetEyeY - render.eyeTargetY) * wingAlpha;
            render.eyeBlend += (targetEyeBlend - render.eyeBlend) * wingAlpha;

            const stillBlending =
                render.rigOffset.lengthSq() > 1e-6 ||
                Math.abs(render.hardFlap) > 1e-4 ||
                Math.abs(render.wingLift) > 1e-4 ||
                Math.abs(render.bodyYaw) > 1e-4 ||
                Math.abs(render.bodyPitch) > 1e-4 ||
                Math.abs(render.bodyRoll) > 1e-4 ||
                Math.abs(render.rigPitch) > 1e-4 ||
                Math.abs(render.rigYaw) > 1e-4 ||
                Math.abs(render.rigRoll) > 1e-4 ||
                Math.abs(render.eyeBlend) > 1e-4 ||
                Math.abs(render.wingBoost - 1) > 1e-4;
            render.active = rawActive || stillBlending;

            return render;
        }

        function revealMysteryReward() {
            if (!mysteryState.root || mysteryState.phase !== 'landed') return;
            const rewardKey = mysteryState.rewardKey || pickMysteryRewardKeyForRarity(mysteryState.boxRarity);
            if (!rewardKey) return;
            noteMysteryBoxOpen();
            const rewardLabel = mysteryState.rewardLabel || getPropLabelByKey(rewardKey);
            mysteryState.rewardKey = rewardKey;
            mysteryState.rewardLabel = rewardLabel;
            markMysteryRewardKeySummoned(rewardKey);
            cacheMysteryRewardPreviewBuild(rewardKey);
            schedulePropWarmForMainRenderer(rewardKey);
            const stashResult = stashPropInInventory(rewardKey, { deferRender: true });
            mysteryState.openStartPressDepth = THREE.MathUtils.clamp(mysteryState.pressDepth || 0, 0, 1);
            mysteryState.pressActive = false;
            mysteryState.pressPointerId = null;
            mysteryState.pressQueuedOpen = false;
            mysteryState.pressDepth = 0;
            mysteryState.rattleTimer = 0;
            mysteryState.rattleCooldown = MYSTERY_BOX_CONFIG.landedRattleInterval || 2.5;
            playMysteryBoxOpenSfx();
            mysteryState.phase = 'opening';
            mysteryState.timer = 0;
            mysteryState.rewardShown = false;
            mysteryState.previewPrimed = false;
            mysteryState.shadowFade = 1;
            setContactShadowFade(1);
            if (propPreviewName) {
                if (stashResult.added) {
                    if (stashResult.dropped?.length) {
                        const droppedLabel = getPropLabelByKey(stashResult.dropped[0]);
                        propPreviewName.textContent = `Mystery Reward: ${mysteryState.rewardLabel} added. ${droppedLabel} was rotated out (category limit).`;
                    } else {
                        propPreviewName.textContent = `Mystery Reward: ${mysteryState.rewardLabel} added to Inventory`;
                    }
                } else {
                    propPreviewName.textContent = `Mystery Reward: ${mysteryState.rewardLabel}`;
                }
            }
        }

        function isPointOnMysteryBox(clientX, clientY) {
            if (!mysteryState.root || !Number.isFinite(clientX) || !Number.isFinite(clientY)) {
                return false;
            }
            return intersectObjectsAt(clientX, clientY, mysteryState.root, true).length > 0;
        }

        function handleMysteryBoxPointerDown(clientX, clientY, pointerId = null) {
            if (!mysteryState.root || mysteryState.phase === 'idle') return false;
            if (!isPointOnMysteryBox(clientX, clientY)) {
                return false;
            }
            if (isMysteryInteractionLocked()) {
                return true;
            }

            if (mysteryState.phase === 'falling') {
                return true;
            }

            if (mysteryState.phase === 'opening' || mysteryState.phase === 'revealed' || mysteryState.phase === 'cooldown') {
                return true;
            }

            const now = getMysteryInteractionNowMs();
            if ((now - mysteryInteractionSafetyState.lastBoxPressAt) < MYSTERY_INTERACTION_SAFETY_CONFIG.boxPressCooldownMs) {
                return true;
            }
            mysteryInteractionSafetyState.lastBoxPressAt = now;

            mysteryState.pressActive = true;
            mysteryState.pressPointerId = Number.isFinite(pointerId) ? pointerId : null;
            mysteryState.pressQueuedOpen = true;
            mysteryState.pressDepth = 1;
            mysteryState.rattleSeed = Math.random() * Math.PI * 2;
            mysteryState.rattleTimer = Math.max(
                mysteryState.rattleTimer,
                (MYSTERY_BOX_CONFIG.landedRattleDuration || 0.44) * 0.32
            );
            playMysteryBoxShakeSfx();
            return true;
        }

        function handleMysteryBoxPointerMove(clientX, clientY, pointerId = null) {
            if (!mysteryState.pressActive) return false;
            if (mysteryState.pressPointerId !== null && pointerId !== mysteryState.pressPointerId) {
                return false;
            }
            mysteryState.pressQueuedOpen =
                mysteryState.phase === 'landed' &&
                isPointOnMysteryBox(clientX, clientY);
            return true;
        }

        function handleMysteryBoxPointerUp(pointerId = null, clientX = null, clientY = null) {
            if (!mysteryState.root || !mysteryState.pressActive) return false;
            if (mysteryState.pressPointerId !== null && pointerId !== mysteryState.pressPointerId) {
                return false;
            }
            const now = getMysteryInteractionNowMs();
            const releasedOnBox =
                Number.isFinite(clientX) &&
                Number.isFinite(clientY) &&
                isPointOnMysteryBox(clientX, clientY);
            const shouldOpen =
                mysteryState.phase === 'landed' &&
                mysteryState.pressQueuedOpen &&
                releasedOnBox &&
                !isMysteryInteractionLocked() &&
                (now - mysteryInteractionSafetyState.lastBoxOpenAt) >= MYSTERY_INTERACTION_SAFETY_CONFIG.boxOpenCooldownMs;
            mysteryState.pressActive = false;
            mysteryState.pressPointerId = null;
            mysteryState.pressQueuedOpen = false;
            if (shouldOpen) {
                revealMysteryReward();
            }
            return true;
        }

        function handleMysteryBoxPointerCancel(pointerId = null) {
            if (!mysteryState.pressActive) return false;
            if (mysteryState.pressPointerId !== null && pointerId !== mysteryState.pressPointerId) {
                return false;
            }
            mysteryState.pressActive = false;
            mysteryState.pressPointerId = null;
            mysteryState.pressQueuedOpen = false;
            return true;
        }

        function getMysteryInteractionNowMs() {
            if (typeof performance !== 'undefined' && typeof performance.now === 'function') {
                return performance.now();
            }
            return Date.now();
        }

        function lockMysteryInteractions(durationMs = 0) {
            const safeDuration = Math.max(0, Number.isFinite(durationMs) ? durationMs : 0);
            const now = getMysteryInteractionNowMs();
            mysteryInteractionSafetyState.blockedUntilMs = Math.max(
                mysteryInteractionSafetyState.blockedUntilMs || 0,
                now + safeDuration
            );
        }

        function isMysteryInteractionLocked() {
            return getMysteryInteractionNowMs() < (mysteryInteractionSafetyState.blockedUntilMs || 0);
        }

        function noteMysterySignInteractionEnd(lockMs = MYSTERY_INTERACTION_SAFETY_CONFIG.signCancelCooldownMs) {
            mysteryInteractionSafetyState.lastSignEndAt = getMysteryInteractionNowMs();
            lockMysteryInteractions(lockMs);
        }

        function noteMysteryBoxOpen() {
            mysteryInteractionSafetyState.lastBoxOpenAt = getMysteryInteractionNowMs();
            lockMysteryInteractions(MYSTERY_INTERACTION_SAFETY_CONFIG.postRevealLockMs);
        }

        function isMysteryPreviewVisible() {
            return Boolean(
                previewState?.open ||
                propPreviewPanel?.classList?.contains('open') ||
                propPreviewOverlay?.classList?.contains('open')
            );
        }

        function canStartMysterySignFlight() {
            const now = getMysteryInteractionNowMs();
            return (
                !mysteryFlightCinematic.active &&
                mysteryScrollSign &&
                mysteryState.phase === 'idle' &&
                !isMysteryPreviewVisible() &&
                !isMysteryInteractionLocked() &&
                (now - mysteryInteractionSafetyState.lastSignStartAt) >= MYSTERY_INTERACTION_SAFETY_CONFIG.signStartCooldownMs &&
                (now - mysteryInteractionSafetyState.lastSignEndAt) >= MYSTERY_INTERACTION_SAFETY_CONFIG.signStartCooldownMs
            );
        }

        function setMysteryScrollPointerCapture(pointerId) {
            if (!mysteryScrollSign?.setPointerCapture || !Number.isFinite(pointerId)) {
                return;
            }
            try {
                mysteryScrollSign.setPointerCapture(pointerId);
            } catch (_) {}
        }

        function releaseMysteryScrollPointerCapture(pointerId) {
            if (!mysteryScrollSign?.releasePointerCapture || !Number.isFinite(pointerId)) {
                return;
            }
            try {
                if (!mysteryScrollSign.hasPointerCapture || mysteryScrollSign.hasPointerCapture(pointerId)) {
                    mysteryScrollSign.releasePointerCapture(pointerId);
                }
            } catch (_) {}
        }

        function resetMysterySignSlingshotState(nextPhase = 'idle') {
            mysterySignSlingshotState.active = false;
            mysterySignSlingshotState.pointerId = null;
            mysterySignSlingshotState.startY = 0;
            mysterySignSlingshotState.pullOffset = 0;
            mysterySignSlingshotState.dragBaseTipX = NaN;
            mysterySignSlingshotState.dragBaseTipY = NaN;
            mysterySignSlingshotState.launchOffset = 0;
            mysterySignSlingshotState.launchStartOffset = 0;
            mysterySignSlingshotState.launchPeakOffset = 0;
            mysterySignSlingshotState.launchTimer = 0;
            mysterySignSlingshotState.returnTimer = 0;
            mysterySignSlingshotState.returnStartOffset = 0;
            mysterySignSlingshotState.returnVelocity = 0;
            mysterySignSlingshotState.phase = nextPhase;
            if (mysteryScrollSign) {
                mysteryScrollSign.style.cursor = 'grab';
            }
            stopMysteryScrollPullSfx(true);
        }

        function cancelMysterySignSlingshot(pointerId = null) {
            if (!mysterySignSlingshotState.active) {
                return false;
            }
            if (
                mysterySignSlingshotState.pointerId !== null &&
                pointerId !== null &&
                pointerId !== mysterySignSlingshotState.pointerId
            ) {
                return false;
            }
            releaseMysteryScrollPointerCapture(mysterySignSlingshotState.pointerId);
            resetMysterySignSlingshotState('idle');
            noteMysterySignInteractionEnd();
            return true;
        }

        function beginMysterySignSlingshot(pointerId, clientY) {
            if (!canStartMysterySignFlight()) return false;
            if (mysterySignSlingshotState.active) return false;
            mysteryInteractionSafetyState.lastSignStartAt = getMysteryInteractionNowMs();
            mysterySignSlingshotState.active = true;
            mysterySignSlingshotState.pointerId = Number.isFinite(pointerId) ? pointerId : null;
            mysterySignSlingshotState.startY = clientY;
            mysterySignSlingshotState.pullOffset = 0;
            mysterySignSlingshotState.launchOffset = 0;
            mysterySignSlingshotState.launchStartOffset = 0;
            mysterySignSlingshotState.launchPeakOffset = 0;
            mysterySignSlingshotState.launchTimer = 0;
            mysterySignSlingshotState.returnTimer = 0;
            mysterySignSlingshotState.returnStartOffset = 0;
            mysterySignSlingshotState.returnVelocity = 0;
            const currentTip = mysteryHangingSign.nodes[mysteryHangingSign.nodes.length - 1];
            mysterySignSlingshotState.dragBaseTipX = Number.isFinite(currentTip?.x)
                ? currentTip.x
                : mysteryHangingSign.anchorX;
            mysterySignSlingshotState.dragBaseTipY = Number.isFinite(currentTip?.y)
                ? currentTip.y
                : (mysteryHangingSign.anchorY + mysteryHangingSign.ropeLength);
            mysterySignSlingshotState.phase = 'drag';
            mysteryScrollSign.style.cursor = 'grabbing';
            setMysteryScrollPointerCapture(mysterySignSlingshotState.pointerId);
            startMysteryScrollPullSfx();
            return true;
        }

        function updateMysterySignSlingshot(clientY) {
            if (!mysterySignSlingshotState.active || mysterySignSlingshotState.phase !== 'drag') return;
            const drag = clientY - mysterySignSlingshotState.startY;
            mysterySignSlingshotState.pullOffset = THREE.MathUtils.clamp(drag, 0, MYSTERY_SIGN_SLINGSHOT_CONFIG.maxPullPx);
        }

        function endMysterySignSlingshot(pointerId) {
