            if (!mysterySignSlingshotState.active) return false;
            if (mysterySignSlingshotState.pointerId !== null && pointerId !== mysterySignSlingshotState.pointerId) return false;
            const didPullEnough = mysterySignSlingshotState.pullOffset >= MYSTERY_SIGN_SLINGSHOT_CONFIG.minPullPx;
            const pulledOffset = mysterySignSlingshotState.pullOffset;
            releaseMysteryScrollPointerCapture(mysterySignSlingshotState.pointerId);
            if (!didPullEnough) {
                resetMysterySignSlingshotState('idle');
                noteMysterySignInteractionEnd();
                return false;
            }
            mysterySignSlingshotState.active = false;
            mysterySignSlingshotState.pointerId = null;
            mysterySignSlingshotState.startY = 0;
            mysterySignSlingshotState.pullOffset = 0;
            mysterySignSlingshotState.dragBaseTipX = NaN;
            mysterySignSlingshotState.dragBaseTipY = NaN;
            mysteryScrollSign.style.cursor = 'grab';
            stopMysteryScrollPullSfx(true);
            const launched = launchMysterySignByPull(pulledOffset);
            if (launched) {
                playMysteryStringReleaseSfx();
                noteMysterySignInteractionEnd(MYSTERY_INTERACTION_SAFETY_CONFIG.signLaunchLockMs);
            } else {
                resetMysterySignSlingshotState('idle');
                noteMysterySignInteractionEnd();
            }
            return launched;
        }

        function getMysterySignLaunchDistance(pullOffset = 0) {
            const cfg = MYSTERY_SIGN_SLINGSHOT_CONFIG;
            const pull = THREE.MathUtils.clamp(pullOffset, 0, cfg.maxPullPx);
            const baseHeight = Math.max(
                window.innerHeight * (cfg.launchHeightMultiplier ?? 1.35),
                cfg.launchHeightMin ?? 340
            );
            const bonus = pull * (cfg.pullHeightBonus ?? 0.55);
            return baseHeight + bonus;
        }

        function launchMysterySignByPull(pullOffset) {
            const cfg = MYSTERY_SIGN_SLINGSHOT_CONFIG;
            if (!startMysteryFlightCinematic()) {
                mysterySignSlingshotState.phase = 'idle';
                mysterySignSlingshotState.launchOffset = 0;
                mysterySignSlingshotState.returnTimer = 0;
                mysterySignSlingshotState.launchTimer = 0;
                mysterySignSlingshotState.launchPeakOffset = 0;
                mysterySignSlingshotState.returnStartOffset = 0;
                mysterySignSlingshotState.returnVelocity = 0;
                mysterySignSlingshotState.launchStartOffset = 0;
                return false;
            }

            const clampedPull = THREE.MathUtils.clamp(pullOffset, 0, cfg.maxPullPx);
            mysterySignSlingshotState.phase = 'launch';
            mysterySignSlingshotState.launchOffset = clampedPull;
            mysterySignSlingshotState.launchStartOffset = clampedPull;
            mysterySignSlingshotState.launchPeakOffset = -getMysterySignLaunchDistance(clampedPull);
            mysterySignSlingshotState.launchTimer = 0;
            mysterySignSlingshotState.returnTimer = 0;
            mysterySignSlingshotState.returnStartOffset = mysterySignSlingshotState.launchPeakOffset;
            mysterySignSlingshotState.returnVelocity = 0;
            return true;
        }

        function advanceMysterySignSlingshotFlight(dt) {
            const state = mysterySignSlingshotState;
            const cfg = MYSTERY_SIGN_SLINGSHOT_CONFIG;
            const safeDt = Number.isFinite(dt) && dt > 0 ? dt : 0;

            if (state.phase === 'drag') {
                state.launchOffset = state.pullOffset;
                return;
            }

            if (state.phase === 'launch') {
                state.launchTimer += safeDt;
                const p = THREE.MathUtils.clamp(state.launchTimer / Math.max(0.001, cfg.launchDuration ?? 0.58), 0, 1);
                const e = 1 - Math.pow(1 - p, 2.45);
                state.launchOffset = THREE.MathUtils.lerp(state.launchStartOffset, state.launchPeakOffset, e);
                if (p >= 1) {
                    state.phase = 'waiting';
                    state.launchOffset = state.launchPeakOffset;
                }
                return;
            }

            if (state.phase === 'waiting') {
                state.launchOffset = state.launchPeakOffset;
                return;
            }

            if (state.phase === 'return') {
                state.returnTimer += safeDt;
                const stiffness = Math.max(1, cfg.returnSpringStiffness ?? 120);
                const damping = Math.max(0, cfg.returnSpringDamping ?? 22);
                const settleDistance = Math.max(0.05, cfg.returnSettleDistancePx ?? 0.35);
                const settleSpeed = Math.max(0.05, cfg.returnSettleSpeedPx ?? 8);
                const accel = (-state.launchOffset * stiffness) - (state.returnVelocity * damping);
                state.returnVelocity += accel * safeDt;
                state.launchOffset += state.returnVelocity * safeDt;
                if (Math.abs(state.launchOffset) <= settleDistance && Math.abs(state.returnVelocity) <= settleSpeed) {
                    state.phase = 'idle';
                    state.launchOffset = 0;
                    state.launchStartOffset = 0;
                    state.launchPeakOffset = 0;
                    state.returnStartOffset = 0;
                    state.launchTimer = 0;
                    state.returnTimer = 0;
                    state.returnVelocity = 0;
                }
            }
        }

        function returnMysterySignAfterSelection() {
            const state = mysterySignSlingshotState;
            if (state.phase !== 'waiting' && state.phase !== 'launch') {
                return;
            }
            const previewVisible = Boolean(
                previewState.open ||
                propPreviewPanel?.classList?.contains('open') ||
                propPreviewOverlay?.classList?.contains('open')
            );
            if (previewVisible) {
                mysterySignReturnPendingAfterPanelClose = true;
                return;
            }
            if (mysterySignReturnAfterPanelTimer !== null) {
                window.clearTimeout(mysterySignReturnAfterPanelTimer);
                mysterySignReturnAfterPanelTimer = null;
            }
            state.returnStartOffset = state.launchOffset;
            state.returnTimer = 0;
            state.returnVelocity = 0;
            state.phase = 'return';
            releaseMysteryFlightReturnAfterSelection();
        }

        function getMysteryPreviewPanelWorldTarget() {
            const rect = propPreviewViewport?.getBoundingClientRect?.();
            const x = rect ? rect.left + rect.width * 0.5 : window.innerWidth * 0.5;
            const y = rect ? rect.top + rect.height * 0.5 : window.innerHeight * 0.46;
            const ndc = new THREE.Vector3(
                (x / Math.max(1, window.innerWidth)) * 2 - 1,
                -(y / Math.max(1, window.innerHeight)) * 2 + 1,
                0.25
            );
            ndc.unproject(camera);
            const dir = ndc.sub(camera.position);
            if (!Number.isFinite(dir.x) || !Number.isFinite(dir.y) || !Number.isFinite(dir.z) || dir.lengthSq() < 1e-6) {
                dir.set(0, 0, -1);
            } else {
                dir.normalize();
            }
            return camera.position.clone().addScaledVector(dir, 9.8);
        }

        function updateMysteryDust(root, flowRatio, funnelToPanel = false) {
            const dustPoints = root?.userData?.dustPoints;
            const dustBase = root?.userData?.dustBase;
            const dustPhase = root?.userData?.dustPhase;
            const positionAttr = dustPoints?.geometry?.attributes?.position;
            if (!dustPoints || !dustBase || !dustPhase || !positionAttr?.array) {
                return;
            }

            const arr = positionAttr.array;
            const count = Math.min(dustPhase.length, Math.floor(arr.length / 3));
            const swirlRadius = MYSTERY_BOX_CONFIG.dustSwirlRadius || 1.28;
            const lift = MYSTERY_BOX_CONFIG.dustLift || 1.85;
            const t = THREE.MathUtils.clamp(flowRatio, 0, 1);
            const localTarget = new THREE.Vector3();
            if (funnelToPanel) {
                const worldTarget = getMysteryPreviewPanelWorldTarget();
                localTarget.copy(root.worldToLocal(worldTarget.clone()));
            }

            for (let i = 0; i < count; i++) {
                const i3 = i * 3;
                const bx = dustBase[i3];
                const by = dustBase[i3 + 1];
                const bz = dustBase[i3 + 2];
                const angle = dustPhase[i] + mysteryState.timer * 6.1 + i * 0.09;
                const swirlScale = 0.45 + (by / Math.max(0.001, lift + 1)) * 0.8;
                const swirlX = Math.cos(angle) * swirlRadius * swirlScale + bx * 0.24;
                const swirlY = by + Math.sin(angle * 1.7 + bx * 0.9) * 0.12 + t * lift * (funnelToPanel ? 0.14 : 0.38);
                const swirlZ = Math.sin(angle) * swirlRadius * swirlScale + bz * 0.24;

                if (!funnelToPanel) {
                    arr[i3] = swirlX;
                    arr[i3 + 1] = swirlY;
                    arr[i3 + 2] = swirlZ;
                    continue;
                }

                const jitterScale = 0.08 + (i % 5) * 0.012;
                const targetX = localTarget.x + bx * jitterScale;
                const targetY = localTarget.y + (by - 0.55) * jitterScale;
                const targetZ = localTarget.z + bz * jitterScale;
                arr[i3] = THREE.MathUtils.lerp(swirlX, targetX, t);
                arr[i3 + 1] = THREE.MathUtils.lerp(swirlY, targetY, t);
                arr[i3 + 2] = THREE.MathUtils.lerp(swirlZ, targetZ, t);
            }
            positionAttr.needsUpdate = true;
        }

        function updateMysteryBox(dt) {
            if (!mysteryState.root || mysteryState.phase === 'idle') {
                setContactShadowFade(1);
                return;
            }

            const root = mysteryState.root;
            setContactShadowFade(1);
            syncMysteryShadowState(root);
            const {
                lidPivot,
                dustPoints,
                burstPieces,
                burstStartPos,
                burstStartRot,
                burstDirs,
                glowMaterials,
                innerLight,
                rarityTheme,
                ornamentEntries,
                sparkleEntries
            } = root.userData || {};
            const boxTheme = rarityTheme || getMysteryBoxTheme(mysteryState.boxRarity);
            const dustMaterial = dustPoints?.material;
            const fallEase = (t) => 1 - Math.pow(1 - t, 2.75);
            const openEaseOut = (t) => 1 - Math.pow(1 - t, 2.2);
            const updateMysteryOrnaments = (energy, pulse, fade = 1) => {
                if (!Array.isArray(ornamentEntries) || !ornamentEntries.length) {
                    return;
                }
                const ornamentEnergy = Math.max(0, energy);
                ornamentEntries.forEach((entry) => {
                    const mesh = entry?.mesh;
                    if (!mesh) {
                        return;
                    }
                    const phase = pulse * (entry.swaySpeed ?? 0.8) + (entry.phaseOffset ?? 0);
                    const bob = Math.sin(phase) * (entry.bobAmp ?? 0);
                    const sway = Math.sin(phase * 1.12) * (entry.swayAmp ?? 0) * fade;
                    const roll = Math.sin(phase * 0.94 + 0.6) * (entry.rollAmp ?? 0) * fade;
                    const pulseScale = 1 + Math.sin(phase * 1.18 + 0.9) * (entry.pulseAmp ?? 0) * Math.min(1.2, ornamentEnergy);
                    mesh.visible = fade > 0.01;
                    mesh.position.copy(entry.basePosition);
                    mesh.rotation.copy(entry.baseRotation);
                    mesh.scale.copy(entry.baseScale);
                    if (entry.style === 'arc') {
                        mesh.position.y += bob;
                        mesh.rotation.z += sway;
                        mesh.rotation.x += roll * 0.2;
                    } else if (entry.style === 'halo') {
                        mesh.position.y += bob;
                        mesh.rotation.y += sway * 0.6;
                        mesh.rotation.z += roll * 0.3;
                        mesh.scale.multiplyScalar(1 + Math.max(0, ornamentEnergy - 0.9) * 0.03);
                    } else if (entry.style === 'wing' || entry.style === 'bladeFan') {
                        mesh.position.y += bob;
                        mesh.rotation.z += roll;
                        mesh.rotation.y += sway * 0.35;
                    } else if (entry.style === 'spire') {
                        mesh.rotation.x += sway;
                        mesh.rotation.z += roll * 0.5;
                        mesh.scale.y *= pulseScale;
                    } else if (entry.style === 'crest' || entry.style === 'emberGem') {
                        mesh.position.y += bob;
                        mesh.rotation.y += sway * 0.8;
                        mesh.scale.multiplyScalar(1 + Math.max(0, ornamentEnergy - 0.85) * 0.04);
                    } else if (entry.style === 'crestSlash') {
                        mesh.position.y += bob * 0.6;
                        mesh.rotation.z += sway * 0.45;
                        mesh.scale.x *= pulseScale;
                    }
                });
            };
            const updateMysterySparkles = (energy, pulse, fade = 1, lift = 0) => {
                if (!Array.isArray(sparkleEntries) || !sparkleEntries.length) {
                    return;
                }
                const sparkleFade = THREE.MathUtils.clamp(fade, 0, 1.2);
                const sparkleEnergy = Math.max(0, energy);
                sparkleEntries.forEach((entry) => {
                    const sprite = entry?.sprite;
                    const material = entry?.material;
                    if (!sprite || !material) {
                        return;
                    }
                    const shimmer = 0.5 + 0.5 * Math.sin(pulse * entry.flickerSpeed + entry.phase);
                    const twinkle = shimmer * shimmer;
                    const style = entry.style || 'orbit';
                    const orbitAngle = entry.baseAngle + pulse * entry.orbitSpeed;
                    if (style === 'ember') {
                        const riseCycle = 0.5 + 0.5 * Math.sin(pulse * entry.orbitSpeed * 0.9 + entry.phase);
                        const radius = entry.orbitRadius * (0.62 + Math.sin(pulse * 0.48 + entry.phase) * entry.radiusPulse);
                        sprite.position.set(
                            Math.cos(orbitAngle) * radius + Math.sin(pulse * 0.38 + entry.phase) * entry.drift * 0.7,
                            entry.baseHeight + riseCycle * 0.92 + Math.sin(pulse * entry.bobSpeed + entry.phase) * entry.bobAmplitude + lift * entry.liftInfluence,
                            Math.sin(orbitAngle) * radius * entry.ellipse * 0.74
                        );
                    } else if (style === 'halo') {
                        const radius = entry.orbitRadius * (1 + Math.sin(pulse * 0.52 + entry.phase) * entry.radiusPulse * 0.8);
                        sprite.position.set(
                            Math.cos(orbitAngle) * radius,
                            entry.baseHeight + Math.sin(pulse * entry.bobSpeed + entry.phase) * entry.bobAmplitude * 1.2 + lift * entry.liftInfluence,
                            Math.sin(orbitAngle) * radius * Math.max(1, entry.ellipse) + Math.cos(pulse * 0.34 + entry.phase) * entry.drift
                        );
                    } else {
                        const radius = entry.orbitRadius * (1 + Math.sin(pulse * 0.58 + entry.phase) * entry.radiusPulse);
                        sprite.position.set(
                            Math.cos(orbitAngle) * radius + Math.sin(pulse * 0.44 + entry.phase) * entry.drift,
                            entry.baseHeight + Math.sin(pulse * entry.bobSpeed + entry.phase) * entry.bobAmplitude + lift * entry.liftInfluence,
                            Math.sin(orbitAngle) * radius * entry.ellipse + Math.cos(pulse * 0.36 + entry.phase) * entry.drift * 0.55
                        );
                    }
                    const scale = entry.baseScale * (0.82 + twinkle * 0.82 + Math.max(0, sparkleEnergy - 0.9) * 0.14);
                    sprite.scale.set(scale, scale, 1);
                    material.opacity = THREE.MathUtils.clamp(
                        entry.baseOpacity * (0.24 + twinkle * 0.92) * (0.4 + sparkleEnergy * 0.26) * sparkleFade,
                        0,
                        0.84
                    );
                    material.rotation += dt * entry.rotationSpeed;
                    sprite.visible = material.opacity > 0.01;
                });
            };
            const updateMysteryCoreVisuals = (energy, pulse, fade = 1, lift = 0) => {
                const themedEnergy = energy * (boxTheme.glowEnergyScale ?? 1);
                const themedPulse = pulse * (boxTheme.pulseSpeedScale ?? 1);
                updateMysteryGlowMaterials(glowMaterials, themedEnergy, themedPulse, fade);
                if (innerLight) {
                    innerLight.intensity = (
                        (boxTheme.innerLightAmbient ?? 0.32) +
                        Math.max(0, themedEnergy - 0.55) * (boxTheme.innerLightEnergyBoost ?? 1.15) +
                        (0.5 + 0.5 * Math.sin(themedPulse + 0.4)) * (boxTheme.innerLightPulseBoost ?? 0.18)
                    ) * fade;
                    innerLight.distance = (boxTheme.innerLightBaseDistance ?? 5.2) + themedEnergy * (boxTheme.innerLightDistanceBoost ?? 1.2);
                    innerLight.position.x = Math.sin(themedPulse * 0.54) * 0.05 * themedEnergy;
                    innerLight.position.y = 1.1 + lift * 0.3;
                    innerLight.position.z = Math.cos(themedPulse * 0.47) * 0.05 * themedEnergy;
                }
                updateMysteryOrnaments(themedEnergy, themedPulse, fade);
                updateMysterySparkles(themedEnergy, themedPulse, fade, lift);
            };

            if (mysteryState.phase === 'falling') {
                mysteryState.timer += dt;
                const maxFallDelta = Math.max(0.25, mysteryState.startY - mysteryState.landingY);
                const fallRatio = 1 - THREE.MathUtils.clamp((root.position.y - mysteryState.landingY) / maxFallDelta, 0, 1);
                setContactShadowFade(1);
                const eased = fallEase(fallRatio);
                mysteryState.fallVelocity -= (MYSTERY_BOX_CONFIG.fallGravity || 16.8) * dt;
                root.position.y += mysteryState.fallVelocity * dt;

                if (eased > 0.05 && !mysteryState.settled) {
                    root.position.x = THREE.MathUtils.lerp(mysteryState.startPoint.x, mysteryState.landingPoint.x, Math.min(1, fallRatio * 1.18));
                    root.position.z = THREE.MathUtils.lerp(mysteryState.startPoint.z, mysteryState.landingPoint.z, Math.min(1, fallRatio * 1.18));
                }
                root.rotation.y += mysteryState.spinVelY * dt;
                root.rotation.x += mysteryState.spinVelX * dt;
                root.rotation.z += mysteryState.spinVelZ * dt;
                const spinDamp = MYSTERY_BOX_CONFIG.fallSpinDamp || 0.9992;
                mysteryState.spinVelY *= spinDamp;
                mysteryState.spinVelX *= spinDamp;
                mysteryState.spinVelZ *= spinDamp;
                if (dustPoints) {
                    dustPoints.visible = false;
                }
                updateMysteryCoreVisuals(
                    0.88 + fallRatio * 0.42,
                    mysteryState.timer * 6.8 + fallRatio * 7.4,
                    1,
                    fallRatio * 0.08
                );

                if (fallRatio >= 1 || root.position.y <= mysteryState.landingY) {
                    root.position.copy(mysteryState.landingPoint);
                    root.position.y = mysteryState.landingY;
                    playMysteryBoxLandingSfx();
                    mysteryState.phase = 'landed';
                    mysteryState.timer = 0;
                    mysteryState.landedYaw = root.rotation.y;
                    mysteryState.rattleCooldown = 0;
                    mysteryState.rattleTimer = 0;
                    mysteryState.rattleSeed = Math.random() * Math.PI * 2;
                    mysteryState.pressActive = false;
                    mysteryState.pressPointerId = null;
                    mysteryState.pressQueuedOpen = false;
                    mysteryState.pressDepth = 0;
                    mysteryState.spinVelX *= 0.75;
                    mysteryState.spinVelY *= 0.75;
                    mysteryState.spinVelZ *= 0.75;
                    requestMysteryFlightReturn();
                }
                updateMysteryGroundShadows(root);
                return;
            }

            if (mysteryState.phase === 'landed') {
                setContactShadowFade(1);
                mysteryState.timer += dt;
                const pressTarget = mysteryState.pressActive ? 1 : 0;
                const pressSpeed = mysteryState.pressActive
                    ? (MYSTERY_BOX_CONFIG.pressDepthInSpeed || 24)
                    : (MYSTERY_BOX_CONFIG.pressDepthOutSpeed || 14);
                const pressBlend = 1 - Math.exp(-dt * pressSpeed);
                mysteryState.pressDepth = THREE.MathUtils.lerp(mysteryState.pressDepth, pressTarget, pressBlend);

                mysteryState.rattleCooldown -= dt;
                const rattleDuration = Math.max(0.05, MYSTERY_BOX_CONFIG.landedRattleDuration || 0.44);
                if (mysteryState.rattleTimer <= 0 && mysteryState.rattleCooldown <= 0) {
                    mysteryState.rattleTimer = rattleDuration;
                    mysteryState.rattleCooldown = Math.max(
                        MYSTERY_BOX_CONFIG.landedRattleInterval || 2.5,
                        rattleDuration * 1.2
                    );
                    mysteryState.rattleSeed = Math.random() * Math.PI * 2;
                    playMysteryBoxShakeSfx();
                }
                let rattleStrength = 0;
                if (mysteryState.rattleTimer > 0) {
                    const rattleRatio = 1 - THREE.MathUtils.clamp(mysteryState.rattleTimer / rattleDuration, 0, 1);
                    const envelope = Math.sin(rattleRatio * Math.PI);
                    rattleStrength = envelope * envelope;
                    mysteryState.rattleTimer = Math.max(0, mysteryState.rattleTimer - dt);
                }
                const reactiveRattle = Math.min(1.35, rattleStrength + mysteryState.pressDepth * 0.55);
                const rattlePhase = mysteryState.timer * (MYSTERY_BOX_CONFIG.landedRattleHz || 17.8) + mysteryState.rattleSeed;
                const pressTilt = (MYSTERY_BOX_CONFIG.pressTilt || 0.032) * mysteryState.pressDepth;
                const yawWiggle = Math.sin(rattlePhase * 1.12) * (MYSTERY_BOX_CONFIG.landedRattleYaw || 0.09) * reactiveRattle;
                const pitchWiggle = Math.sin(rattlePhase + 0.4) * (MYSTERY_BOX_CONFIG.landedRattlePitch || 0.05) * reactiveRattle;
                const rollWiggle = Math.sin(rattlePhase * 1.28 + 1.35) * (MYSTERY_BOX_CONFIG.landedRattleRoll || 0.08) * reactiveRattle;
                const idlePitch = Math.sin(mysteryState.timer * 1.9 + mysteryState.seed) * 0.017;
                const idleRoll = Math.sin(mysteryState.timer * 2.25 + mysteryState.seed * 0.75) * 0.014;
                const idleBob = (MYSTERY_BOX_CONFIG.landedIdleBob || 0.016) * Math.abs(Math.sin(mysteryState.timer * 3 + mysteryState.seed));
                const pressSink = (MYSTERY_BOX_CONFIG.pressSink || 0.042) * mysteryState.pressDepth;

                root.rotation.y = mysteryState.landedYaw + yawWiggle;
                root.rotation.x = idlePitch + pitchWiggle + pressTilt;
                root.rotation.z = idleRoll + rollWiggle - pressTilt * 0.55;
                root.position.y = mysteryState.landingY + idleBob - pressSink;
                const pressSqueezeY = 1 - (MYSTERY_BOX_CONFIG.pressSqueezeY || 0.14) * mysteryState.pressDepth;
                const pressSqueezeXZ = 1 + (MYSTERY_BOX_CONFIG.pressSqueezeXZ || 0.1) * mysteryState.pressDepth;
                const baseScale = mysteryState.baseScale || 1;
                root.scale.set(baseScale * pressSqueezeXZ, baseScale * pressSqueezeY, baseScale * pressSqueezeXZ);
                updateMysteryCoreVisuals(
                    0.96 + reactiveRattle * 0.46 + mysteryState.pressDepth * 0.24,
                    mysteryState.timer * 7.4 + reactiveRattle * 3.2,
                    1,
                    mysteryState.pressDepth * 0.04
                );
                if (dustPoints) {
                    dustPoints.visible = false;
                }
                updateMysteryGroundShadows(root);
                return;
            }

            if (mysteryState.phase === 'opening') {
                mysteryState.timer += dt;
                const openRatio = THREE.MathUtils.clamp(mysteryState.timer / MYSTERY_BOX_CONFIG.openDuration, 0, 1);
                const shadowFadeDuration = Math.max(
                    0.01,
                    MYSTERY_BOX_CONFIG.shadowClickFadeDuration || (MYSTERY_BOX_CONFIG.openDuration * 0.35)
                );
                mysteryState.shadowFade = 1 - THREE.MathUtils.clamp(mysteryState.timer / shadowFadeDuration, 0, 1);
                const openEase = openEaseOut(openRatio);
                const baseScale = mysteryState.baseScale || 1;
                const openingPress = THREE.MathUtils.clamp(mysteryState.openStartPressDepth || 0, 0, 1);
                if (openingPress > 0) {
                    const releaseRecover = Math.max(0.2, MYSTERY_BOX_CONFIG.pressReleaseRecover || 1.85);
                    const releaseBlend = 1 - Math.exp(-mysteryState.timer * releaseRecover);
                    const releaseMix = THREE.MathUtils.clamp(releaseBlend, 0, 1);
                    const residual = 1 - releaseMix;
                    const rebound = Math.sin(THREE.MathUtils.clamp(openRatio, 0, 1) * Math.PI) *
                        (MYSTERY_BOX_CONFIG.pressReleaseRebound || 0.055) *
                        openingPress;
                    const pressSqueezeY = MYSTERY_BOX_CONFIG.pressSqueezeY || 0.14;
                    const pressSqueezeXZ = MYSTERY_BOX_CONFIG.pressSqueezeXZ || 0.1;
                    const pressSink = MYSTERY_BOX_CONFIG.pressSink || 0.042;
                    const scaleY = 1 - pressSqueezeY * openingPress * residual + rebound * 0.25;
                    const scaleXZ = 1 + pressSqueezeXZ * openingPress * residual + rebound;
                    root.scale.set(baseScale * scaleXZ, baseScale * scaleY, baseScale * scaleXZ);
                    root.position.y = mysteryState.landingY - pressSink * openingPress * residual;
                } else {
                    root.scale.setScalar(baseScale);
                    root.position.y = mysteryState.landingY;
                }
                if (lidPivot) {
                    lidPivot.rotation.x = THREE.MathUtils.lerp(0, -1.25, openEase);
                }
                updateMysteryCoreVisuals(
                    1.28 + openEase * 1.38,
                    mysteryState.timer * 10.8 + openEase * 4.1,
                    1,
                    0.12 + openEase * 0.22
                );
                if (Array.isArray(burstPieces) && Array.isArray(burstStartPos) && Array.isArray(burstStartRot) && Array.isArray(burstDirs)) {
                    burstPieces.forEach((piece, index) => {
                        const startPos = burstStartPos[index];
                        const startRot = burstStartRot[index];
                        const dir = burstDirs[index];
                        if (!startPos || !startRot || !dir) return;
                        const burstDistance = (MYSTERY_BOX_CONFIG.openBurstDistance || 2.7) * openEase;
                        const burstLift = (MYSTERY_BOX_CONFIG.openBurstLift || 1.9) * openEase;
                        piece.position.set(
                            startPos.x + dir.x * burstDistance,
                            startPos.y + dir.y * burstDistance + burstLift,
                            startPos.z + dir.z * burstDistance
                        );
                        const spin = (MYSTERY_BOX_CONFIG.openBurstSpin || 2.2) * openEase;
                        piece.rotation.set(
                            startRot.x + spin * ((index % 3) - 1),
                            startRot.y + spin * (((index + 1) % 3) - 1),
                            startRot.z + spin * (((index + 2) % 3) - 1)
                        );
                        piece.scale.setScalar(Math.max(0.16, 1 - openEase * 0.84));
                        applyMysteryPieceOpacity(piece, Math.max(0, 1 - openEase * 1.06));
                    });
                }
                if (dustPoints && dustMaterial) {
                    dustPoints.visible = true;
                    updateMysteryDust(root, openEase, false);
                    dustMaterial.opacity = Math.min(0.92, 0.22 + openEase * 0.8);
                    dustMaterial.size = 0.1 + openEase * 0.03;
                }

                if (openRatio >= 1) {
                    mysteryState.phase = 'revealed';
                    mysteryState.timer = 0;
                    mysteryState.openStartPressDepth = 0;
                }
                updateMysteryGroundShadows(root);
                return;
            }

            if (mysteryState.phase === 'revealed') {
                mysteryState.timer += dt;
                const dustRatio = THREE.MathUtils.clamp(
                    mysteryState.timer / Math.max(0.1, MYSTERY_BOX_CONFIG.dustFlowDuration || 0.9),
                    0,
                    1
                );

                if (!mysteryState.previewPrimed && mysteryState.rewardKey) {
                    mysteryState.previewPrimed = true;
                    if (previewState.object) {
                        previewScene.remove(previewState.object);
                        previewState.object = null;
                    }
                    previewState.open = true;
                    resetPreviewDragState();
                    previewState.viewMode = 'item';
                    previewState.propKey = mysteryState.rewardKey;
                    previewState.label = mysteryState.rewardLabel;
                    previewState.defaultObjectRotateY = 0;
                    previewState.objectRotateY = 0;
                    previewState.defaultOrbitYaw = 0;
                    previewState.defaultOrbitPitch = 0;
                    previewState.orbitYaw = 0;
                    previewState.orbitPitch = 0;
                    previewState.fitCategory = propRegistry.get(mysteryState.rewardKey)?.category || null;
                    previewState.fitPropKey = mysteryState.rewardKey;
                    pausePreviewAutoSpin(0);
                    previewState.hasStandaloneMesh = false;
                    if (propPreviewPanel) {
                        propPreviewPanel.classList.add('open');
                    }
                    if (propPreviewOverlay) {
                        propPreviewOverlay.classList.add('open');
                    }
                    focusPropPreviewViewport();
                    setPreviewActionButtonsDisabled(true);
                    if (propPreviewName) {
                        propPreviewName.textContent = `Mystery Reward: ${mysteryState.rewardLabel} (Added to Inventory)`;
                    }
                    setPreviewFallbackMessage('Your Mystery Item is...');
                    resizePropViewport();
                }

                if (dustPoints && dustMaterial) {
                    dustPoints.visible = true;
                    updateMysteryDust(root, dustRatio, true);
                    dustMaterial.opacity = Math.max(0, 0.88 - dustRatio * 0.86);
                    dustMaterial.size = 0.1 + dustRatio * 0.04;
                }
                updateMysteryCoreVisuals(
                    1.95 - dustRatio * 0.28,
                    mysteryState.timer * 8.4 + dustRatio * 3.4,
                    1,
                    0.24 - dustRatio * 0.08
                );
                const rewardRevealRatio = THREE.MathUtils.clamp(
                    MYSTERY_BOX_CONFIG.rewardRevealRatio ?? 0.92,
                    0,
                    1
                );
                if (!mysteryState.rewardShown && mysteryState.rewardKey && dustRatio >= rewardRevealRatio) {
                    mysteryState.rewardShown = true;
                    const preloadedRewardPreview = takeMysteryRewardPreviewBuild(mysteryState.rewardKey);
                    void openPropPreviewSafely(
                        mysteryState.rewardKey,
                        `${mysteryState.rewardLabel} (Mystery Reward)`,
                        preloadedRewardPreview
                    ).then(() => {
                        if (
                            propPreviewName &&
                            previewState.open &&
                            previewState.propKey === mysteryState.rewardKey
                        ) {
                            propPreviewName.textContent = `Mystery Reward: ${mysteryState.rewardLabel} (Added to Inventory)`;
                        }
                    });
                }
                if (mysteryState.timer >= MYSTERY_BOX_CONFIG.revealHoldDuration) {
                    mysteryState.phase = 'cooldown';
                    mysteryState.timer = 0;
                }
                updateMysteryGroundShadows(root);
                return;
            }

            if (mysteryState.phase === 'cooldown') {
                setContactShadowFade(1);
                mysteryState.timer += dt;
                const fade = 1 - THREE.MathUtils.clamp(mysteryState.timer / MYSTERY_BOX_CONFIG.cleanupDuration, 0, 1);
                updateMysteryCoreVisuals(
                    0.5 + fade * 0.72,
                    mysteryState.timer * 4.6 + fade * 2.2,
                    fade,
                    fade * 0.1
                );
                if (dustPoints && dustMaterial) {
                    dustMaterial.opacity *= fade;
                    if (dustMaterial.opacity <= 0.01) {
                        dustPoints.visible = false;
                    }
                }
                root.rotation.y += dt * 1.9;
                root.position.y = mysteryState.landingY + (1 - fade) * 0.03;
                root.scale.setScalar((mysteryState.baseScale || 1) * (0.95 + 0.05 * fade));
                updateMysteryGroundShadows(root);
                if (fade <= 0.04) {
                    clearMysteryBox();
                }
            }
        }

        function closePropPreview() {

        if (propPreviewViewport) {
            const endPreviewDrag = () => {

                resetPreviewDragState();
                pausePreviewAutoSpin(2200);
            };

            propPreviewViewport.addEventListener('pointerdown', (event) => {
                if (!previewState.open || !previewState.object) return;
                if (event.pointerType === 'mouse' && event.button !== 0) return;
                const pointerId = Number.isFinite(event.pointerId) ? event.pointerId : null;
                focusPropPreviewViewport();
                pausePreviewAutoSpin(5000);

                if (
                    previewDragState.active &&
                    previewDragState.pointerId !== null &&
                    previewDragState.pointerId !== pointerId &&
                    previewDragState.secondaryPointerId === null &&
                    event.pointerType !== 'mouse'
                ) {
                    previewDragState.mode = 'gesture';
                    previewDragState.secondaryPointerId = pointerId;
                    previewDragState.secondaryX = event.clientX;
                    previewDragState.secondaryY = event.clientY;
                    previewDragState.pinchStartDistance = getPreviewPointerDistance();
                    previewDragState.pinchStartCameraDistance = previewState.cameraDistance;
                    previewDragState.gestureStartMidX = (previewDragState.lastX + previewDragState.secondaryX) * 0.5;
                    previewDragState.gestureStartMidY = (previewDragState.lastY + previewDragState.secondaryY) * 0.5;
                    previewDragState.gestureStartTargetX = previewState.cameraTarget.x;
                    previewDragState.gestureStartTargetY = previewState.cameraTarget.y;
                    propPreviewViewport.classList.add('is-dragging');
                    if (pointerId !== null) {
                        try {
                            propPreviewViewport.setPointerCapture(pointerId);
                        } catch (_) {}
                    }
                    event.preventDefault();
                    event.stopPropagation();

                previewDragState.active = true;
                previewDragState.mode = 'spin';
                previewDragState.pointerId = pointerId;
                previewDragState.secondaryPointerId = null;
                previewDragState.lastX = event.clientX;
                previewDragState.lastY = event.clientY;
                previewDragState.secondaryX = 0;
                previewDragState.secondaryY = 0;
                previewDragState.pinchStartDistance = 0;
                previewDragState.pinchStartCameraDistance = previewState.cameraDistance;
                previewDragState.gestureStartMidX = 0;
                previewDragState.gestureStartMidY = 0;
                previewDragState.gestureStartTargetX = previewState.cameraTarget.x;
                previewDragState.gestureStartTargetY = previewState.cameraTarget.y;
                propPreviewViewport.classList.add('is-dragging');
                if (pointerId !== null) {
                    try {
                        propPreviewViewport.setPointerCapture(pointerId);
                    } catch (_) {}
                }
                event.preventDefault();
                event.stopPropagation();
            }, { passive: false });

            propPreviewViewport.addEventListener('pointermove', (event) => {
                if (!previewDragState.active) return;
                if (previewDragState.mode === 'gesture') {
                    if (previewDragState.pointerId === event.pointerId) {
                        previewDragState.lastX = event.clientX;
                        previewDragState.lastY = event.clientY;
                    } else if (previewDragState.secondaryPointerId === event.pointerId) {
                        previewDragState.secondaryX = event.clientX;
                        previewDragState.secondaryY = event.clientY;
                    } else {
                        return;
                    }
                    const currentDistance = getPreviewPointerDistance();
                    if (previewDragState.pinchStartDistance > 0 && currentDistance > 6) {
                        previewState.cameraDistance = clampPreviewCameraDistance(
                            previewDragState.pinchStartCameraDistance * (previewDragState.pinchStartDistance / currentDistance)
                        );
                    }
                    const midpointX = (previewDragState.lastX + previewDragState.secondaryX) * 0.5;
                    const midpointY = (previewDragState.lastY + previewDragState.secondaryY) * 0.5;
                    panPreviewCameraByPixels(
                        midpointX - previewDragState.gestureStartMidX,
                        midpointY - previewDragState.gestureStartMidY,
                        previewDragState.gestureStartTargetX,
                        previewDragState.gestureStartTargetY,
                        previewState.cameraDistance
                    );
                    pausePreviewAutoSpin(3200);
                    event.preventDefault();
                    event.stopPropagation();
                    return;
                }
                if (previewDragState.pointerId !== null && event.pointerId !== previewDragState.pointerId) return;
                const dx = event.clientX - previewDragState.lastX;
                previewDragState.lastX = event.clientX;
                previewDragState.lastY = event.clientY;

                const yawSensitivity = 0.0115;
                previewState.objectRotateY -= dx * yawSensitivity;

        document.addEventListener('keydown', (event) => {

                target instanceof HTMLElement &&
                (
                    target.isContentEditable ||
                    target.tagName === 'INPUT' ||
                    target.tagName === 'TEXTAREA' ||
                    target.tagName === 'SELECT'
                );
            if (isTypingTarget) {
                return;
            }
            if (event.key === 'Escape') {
                closePropPreview();
                return;
            }
            if (!previewState.open || !previewState.object) {
                return;
            }
            let handled = true;
            const spinStep = 0.22;
            const panStepX = Math.max(0.05, sanitizeFiniteNumber(previewState.panLimitX, 0.7) * 0.18);
            const panStepY = Math.max(0.05, sanitizeFiniteNumber(previewState.panLimitY, 0.7) * 0.18);
            const zoomFactor = 0.12;
            switch (event.key) {
                case 'ArrowLeft':
                    previewState.cameraTarget.x -= panStepX;
                    break;
                case 'ArrowRight':
                    previewState.cameraTarget.x += panStepX;
                    break;
                case 'ArrowUp':
                    previewState.cameraTarget.y += panStepY;
                    break;
                case 'ArrowDown':
                    previewState.cameraTarget.y -= panStepY;
                    break;
                case '+':
                case '=':
                case 'PageUp':
                    previewState.cameraDistance = clampPreviewCameraDistance(previewState.cameraDistance * (1 - zoomFactor));
                    break;
                case '-':
                case '_':
                case 'PageDown':
                    previewState.cameraDistance = clampPreviewCameraDistance(previewState.cameraDistance * (1 + zoomFactor));
                    break;
                case '[':
                    previewState.objectRotateY -= spinStep;
                    break;
                case ']':
                    previewState.objectRotateY += spinStep;
                    break;
                case '0':
                case 'Home':
                    resetPreviewViewToDefault();
                    break;
                default:
                    handled = false;
                    break;
            }
            if (!handled) {
                return;
            }
            focusPropPreviewViewport();
            if (event.key !== '0' && event.key !== 'Home') {
                syncPreviewObjectRotation(previewState.object);
                applyPreviewCameraOrbit();

        function warmPreviewAssetsForPropKey(propKey) {
            if (!propKey || (typeof document !== 'undefined' && document.hidden)) {
                return;

            const source = getItemByPropKey(propKey);
            const previewReadyPromise = getPropPreviewReadyPromise(source);
            if (!previewReadyPromise) {

        const schedulePriorityWingPreviewWarmup = () => {
            const runWarmup = () => {
                PRIORITY_MYSTERY_REWARD_KEYS
                    .filter((propKey) => propRegistry.has(propKey))
                    .forEach((propKey, index) => {

                output.rigRoll = turn;
                output.rigY = Math.sin(s * Math.PI) * 0.38 * env;
                output.rigZ = -Math.sin(s * Math.PI) * 0.5 * env;
                output.rigYaw = Math.sin(s * Math.PI * 2) * 0.18 * env;
                output.flapHzAdd = 0.15 * env;
                output.wingAmpMul = 1 + 0.2 * env;
            } else if (action.key === 'loop') {
                const loopTurn = s * Math.PI * 2;
                output.rigPitch = loopTurn;
                output.rigY = Math.sin(s * Math.PI) * 0.95 * env;
                output.rigZ = -Math.sin(s * Math.PI) * 1.25 * env;
                output.rigRoll = Math.sin(s * Math.PI * 2) * 0.2 * env;
                output.flapHzAdd = 0.12 * env;
                output.wingAmpMul = 1 + 0.16 * env;
            } else if (action.key === 'corkscrew') {
                const turn = s * Math.PI * 2;
                const radius = 0.52 * env;
                output.rigX = Math.cos(turn) * radius;
                output.rigY = Math.sin(s * Math.PI) * 0.62 * env;
                output.rigZ = -Math.sin(turn * 2) * radius * 0.58;
                output.rigYaw = Math.sin(turn) * 0.95 * env;
                output.rigRoll = Math.sin(turn * 1.5) * 1.2 * env;
                output.flapHzAdd = 0.14 * env;
                output.wingAmpMul = 1 + 0.19 * env;
            } else if (action.key === 'wingover') {
                const rise = smoothStep01(Math.min(1, s * 1.45));
                const descend = smoothStep01(Math.max(0, (s - 0.34) / 0.66));
                output.rigY = (rise * 1.05 - descend * 0.95) * env;
                output.rigX = Math.sin(s * Math.PI) * 0.85 * env;
                output.rigYaw = Math.sin(s * Math.PI * 1.7) * 0.62 * env;
                output.rigRoll = Math.sin(s * Math.PI * 1.1) * 1.05 * env;
                output.rigPitch = -Math.sin(s * Math.PI) * 0.24 * env;
                output.flapHzAdd = 0.08 * env;
                output.wingAmpMul = 1 + 0.12 * env;
            } else if (action.key === 'burstDive') {
                const p1 = 0.18;
                const p2 = 0.48;
                const p3 = 0.78;
                if (u < p1) {
                    const q = smoothStep01(u / p1);
                    output.rigY = q * 0.65 * env;
                    output.rigPitch = -q * 0.42;
                    output.rigRoll = Math.sin(q * Math.PI) * 0.22;
                    output.flapHzAdd = 0.3 * q;
                    output.wingAmpMul = 1 + 0.55 * q;
                } else if (u < p2) {
                    const q = smoothStep01((u - p1) / (p2 - p1));
                    output.rigY = (0.65 + q * 3.35) * env;
                    output.rigZ = -q * 2.8 * env;
                    output.rigPitch = -0.55 + q * 0.22;
                    output.rigYaw = Math.sin(q * Math.PI) * 0.2;
                    output.rigRoll = Math.sin(q * Math.PI * 1.2) * 0.35;
                    output.flapHzAdd = 0.18 + (1 - q) * 0.12;
                    output.wingAmpMul = 1.48 - q * 0.28;
                } else if (u < p3) {
                    const q = smoothStep01((u - p2) / (p3 - p2));
                    const spinEase = 1 - Math.pow(1 - q, 3);
                    output.rigY = (4.0 - q * 6.35) * env;
                    output.rigZ = (-2.8 + q * 2.55) * env;
                    output.rigX = Math.sin(q * Math.PI * 2.1) * 0.7 * env;
                    output.rigPitch = 0.2 + q * 0.95;
                    output.rigYaw = Math.sin(q * Math.PI * 2.6) * 0.65 * env;
                    output.rigRoll = spinEase * (Math.PI * 3.4);
                    output.flapHzAdd = 0.04 + q * 0.08;
                    output.wingAmpMul = 0.9 + q * 0.38;
                } else {
                    const q = smoothStep01((u - p3) / (1 - p3));
                    output.rigY = (-2.15 + q * 2.15) * env;
                    output.rigZ = (-0.15 + q * 0.15) * env;
                    output.rigX = Math.sin((1 - q) * Math.PI) * 0.16 * env;
                    output.rigPitch = (1.15 - q * 1.15);
                    output.rigYaw = Math.sin((1 - q) * Math.PI) * 0.16 * env;
                    output.rigRoll = (Math.PI * 2.6) * (1 - q);
                    output.flapHzAdd = 0.16 * (1 - q);
                    output.wingAmpMul = 1.28 - q * 0.28;
                }
            }

            if (stuntState.elapsed >= action.duration) {
                stuntState.active = null;
                stuntState.elapsed = 0;
            }

            return output;
        }

        function updateCursorFromClientPoint(clientX, clientY) {
            cursor.x = (clientX / window.innerWidth) * 2 - 1;
            cursor.y = -(clientY / window.innerHeight) * 2 + 1;
        }

        function hashNoise1D(value, seed = 0) {
            const x = Math.sin(value * 127.1 + seed * 311.7) * 43758.5453123;
            return x - Math.floor(x);
        }

        function traceCanvasPolygon(ctx, points) {
            if (!points.length) return;
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.closePath();
        }

        function buildParchmentOutlinePoints(width, height) {
            const points = [];
            const left = width * 0.035;
            const right = width * 0.965;
            const top = height * 0.03;
            const bottom = height * 0.97;
            const topSegments = 28;
            const sideSegments = 44;
            const bottomSegments = 30;

            for (let i = 0; i <= topSegments; i++) {
                const p = i / topSegments;
                const x = THREE.MathUtils.lerp(left, right, p);
                const baseWave = (hashNoise1D(i * 0.43, 1) - 0.5) * height * 0.0038;
                const fray = (i === 0 || i === topSegments)
                    ? (hashNoise1D(i * 0.77, 2) - 0.5) * height * 0.022
                    : 0;
                points.push({ x, y: top + baseWave + fray });
            }

            for (let i = 1; i <= sideSegments; i++) {
                const p = i / sideSegments;
                const y = THREE.MathUtils.lerp(top, bottom, p);
                const jitter = (hashNoise1D(i * 0.69, 6) - 0.5) * width * 0.012;
                const tear = hashNoise1D(i * 1.27, 7) > 0.63
                    ? width * (0.004 + hashNoise1D(i * 2.31, 8) * 0.012)
                    : 0;
                points.push({ x: right + jitter + tear, y });
            }

            for (let i = 1; i <= bottomSegments; i++) {
                const p = i / bottomSegments;
                const x = THREE.MathUtils.lerp(right, left, p);
                const baseWave = (hashNoise1D(i * 0.58, 12) - 0.5) * height * 0.0058;
                const tear = hashNoise1D(i * 1.64, 13) > 0.78
                    ? width * (0.008 + hashNoise1D(i * 2.47, 14) * 0.018)
                    : 0;
                points.push({ x: x - tear, y: bottom + baseWave });
            }

            for (let i = 1; i <= sideSegments; i++) {
                const p = i / sideSegments;
                const y = THREE.MathUtils.lerp(bottom, top, p);
                const jitter = (hashNoise1D(i * 0.73, 16) - 0.5) * width * 0.012;
                const tear = hashNoise1D(i * 1.39, 17) > 0.62
                    ? width * (0.004 + hashNoise1D(i * 2.13, 18) * 0.012)
                    : 0;
                points.push({ x: left + jitter - tear, y });
            }

            return {
                points,
                bounds: { left, right, top, bottom }
            };
        }

        function createMysteryScrollSheetTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1360;
            const ctx = canvas.getContext('2d', { alpha: true });
            if (!ctx) return null;

            const width = canvas.width;
            const height = canvas.height;
            const { points, bounds } = buildParchmentOutlinePoints(width, height);

            ctx.clearRect(0, 0, width, height);
            traceCanvasPolygon(ctx, points);
            ctx.save();
            ctx.clip();

            const baseGradient = ctx.createLinearGradient(0, bounds.top, 0, bounds.bottom);
            baseGradient.addColorStop(0, '#cf7f34');
            baseGradient.addColorStop(0.18, '#efc46b');
            baseGradient.addColorStop(0.52, '#ffe6a0');
            baseGradient.addColorStop(0.84, '#e8b35a');
            baseGradient.addColorStop(1, '#c5732d');
            ctx.fillStyle = baseGradient;
            ctx.fillRect(0, 0, width, height);

            const centerGlow = ctx.createRadialGradient(
                width * 0.5,
                height * 0.58,
                width * 0.08,
                width * 0.5,
                height * 0.58,
                width * 0.48
            );
            centerGlow.addColorStop(0, 'rgba(255, 248, 196, 0.95)');
            centerGlow.addColorStop(0.55, 'rgba(255, 239, 168, 0.28)');
            centerGlow.addColorStop(1, 'rgba(255, 237, 158, 0)');
            ctx.fillStyle = centerGlow;
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < 1500; i++) {
                const x = hashNoise1D(i * 1.71, 21) * width;
                const y = hashNoise1D(i * 2.39, 22) * height;
                const radius = width * (0.003 + hashNoise1D(i * 3.13, 23) * 0.012);
                const warm = hashNoise1D(i * 1.47, 24) > 0.42;
                const alpha = 0.011 + hashNoise1D(i * 2.11, 25) * 0.038;
                ctx.fillStyle = warm
                    ? `rgba(171, 108, 47, ${alpha.toFixed(4)})`
                    : `rgba(255, 243, 204, ${(alpha * 0.72).toFixed(4)})`;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.lineCap = 'round';
            for (let i = 0; i < 28; i++) {
                const startX = width * (0.26 + hashNoise1D(i * 1.13, 31) * 0.48);
                const startY = height * (0.2 + hashNoise1D(i * 1.91, 32) * 0.62);
                const endX = startX + (hashNoise1D(i * 2.41, 33) - 0.5) * width * 0.22;
                const endY = startY + (hashNoise1D(i * 2.73, 34) - 0.5) * height * 0.16;
                ctx.strokeStyle = `rgba(167, 99, 39, ${(0.022 + hashNoise1D(i * 3.05, 35) * 0.046).toFixed(4)})`;
                ctx.lineWidth = 0.8 + hashNoise1D(i * 3.67, 36) * 1.9;
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.quadraticCurveTo(
                    (startX + endX) * 0.5 + (hashNoise1D(i * 4.09, 37) - 0.5) * width * 0.05,
                    (startY + endY) * 0.5 + (hashNoise1D(i * 4.51, 38) - 0.5) * height * 0.05,
                    endX,
                    endY
                );
                ctx.stroke();
            }

            const topShade = ctx.createLinearGradient(0, bounds.top, 0, bounds.top + (bounds.bottom - bounds.top) * 0.2);
            topShade.addColorStop(0, 'rgba(101, 55, 20, 0.46)');
            topShade.addColorStop(0.52, 'rgba(101, 55, 20, 0)');
            ctx.fillStyle = topShade;
            ctx.fillRect(bounds.left, bounds.top - 8, bounds.right - bounds.left, (bounds.bottom - bounds.top) * 0.24);

            const bottomShade = ctx.createLinearGradient(0, bounds.bottom, 0, bounds.bottom - (bounds.bottom - bounds.top) * 0.23);
            bottomShade.addColorStop(0, 'rgba(93, 49, 18, 0.5)');
            bottomShade.addColorStop(0.56, 'rgba(93, 49, 18, 0)');
            ctx.fillStyle = bottomShade;
            ctx.fillRect(bounds.left, bounds.bottom - (bounds.bottom - bounds.top) * 0.26, bounds.right - bounds.left, (bounds.bottom - bounds.top) * 0.26);

            ctx.restore();

            ctx.save();
            ctx.filter = 'blur(1.6px)';
            ctx.lineJoin = 'round';
            ctx.lineWidth = Math.round(width * 0.011);
            const edgeBurn = ctx.createLinearGradient(0, bounds.top, 0, bounds.bottom);
            edgeBurn.addColorStop(0, 'rgba(133, 62, 17, 0.5)');
            edgeBurn.addColorStop(0.5, 'rgba(117, 51, 15, 0.36)');
            edgeBurn.addColorStop(1, 'rgba(128, 58, 15, 0.56)');
            ctx.strokeStyle = edgeBurn;
            traceCanvasPolygon(ctx, points);
            ctx.stroke();
            ctx.restore();

            ctx.lineJoin = 'round';
            ctx.lineWidth = Math.round(width * 0.0022);
            ctx.strokeStyle = 'rgba(89, 38, 10, 0.3)';
            traceCanvasPolygon(ctx, points);
            ctx.stroke();

            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.wrapS = THREE.ClampToEdgeWrapping;
            texture.wrapT = THREE.ClampToEdgeWrapping;
            texture.needsUpdate = true;
            return texture;
        }

        function createMysteryScrollRollTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 260;
            const ctx = canvas.getContext('2d', { alpha: true });
            if (!ctx) return null;

            const width = canvas.width;
            const height = canvas.height;
            const base = ctx.createLinearGradient(0, 0, 0, height);
            base.addColorStop(0, '#b56d2f');
            base.addColorStop(0.2, '#e9b765');
            base.addColorStop(0.5, '#ffe8a6');
            base.addColorStop(0.78, '#dfa957');
            base.addColorStop(1, '#a8652e');
            ctx.fillStyle = base;
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < 1800; i++) {
                const x = hashNoise1D(i * 0.93, 44) * width;
                const y = hashNoise1D(i * 1.41, 45) * height;
                const alpha = 0.012 + hashNoise1D(i * 2.03, 46) * 0.036;
                const radius = 0.6 + hashNoise1D(i * 2.71, 47) * 2.2;
                ctx.fillStyle = `rgba(126, 80, 34, ${alpha.toFixed(4)})`;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            const centerHighlight = ctx.createLinearGradient(0, height * 0.2, 0, height * 0.8);
            centerHighlight.addColorStop(0, 'rgba(255, 240, 185, 0)');
            centerHighlight.addColorStop(0.5, 'rgba(255, 241, 184, 0.62)');
            centerHighlight.addColorStop(1, 'rgba(255, 240, 185, 0)');
            ctx.fillStyle = centerHighlight;
            ctx.fillRect(0, 0, width, height);

            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(1, 1.2);
            texture.needsUpdate = true;
            return texture;
        }

        function createMysteryScrollFinial(direction, rollLength, goldMaterial, darkMaterial) {
            const finial = new THREE.Group();
            const dir = Math.sign(direction) || 1;
            const baseX = dir * (rollLength * 0.5);

            const rootRing = new THREE.Mesh(new THREE.TorusGeometry(0.085, 0.028, 14, 36), darkMaterial);
            rootRing.rotation.y = Math.PI * 0.5;
            rootRing.position.x = baseX + dir * 0.01;

            const innerCollar = new THREE.Mesh(new THREE.CylinderGeometry(0.067, 0.083, 0.11, 24), goldMaterial);
            innerCollar.rotation.z = Math.PI * 0.5;
            innerCollar.position.x = baseX + dir * 0.12;

            const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.11, 28, 22), goldMaterial);
            bulb.scale.set(1.06, 0.9, 0.9);
            bulb.position.x = baseX + dir * 0.235;

            const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.036, 0.043, 0.22, 20), goldMaterial);
            neck.rotation.z = Math.PI * 0.5;
            neck.position.x = baseX + dir * 0.39;

            const tip = new THREE.Mesh(new THREE.SphereGeometry(0.056, 24, 18), goldMaterial);
            tip.scale.set(1.95, 0.74, 0.74);
            tip.position.x = baseX + dir * 0.54;

            finial.add(rootRing, innerCollar, bulb, neck, tip);
            return finial;
        }

        function createMysteryScrollModel() {
            const group = new THREE.Group();
            const rollLength = 2.8;
            const sheetWidth = rollLength;
            const sheetHeight = 1.95;
            const rollRadius = 0.16;
            const topRollY = sheetHeight * 0.5 + rollRadius * 0.42;
            const bottomRollY = -sheetHeight * 0.5 - rollRadius * 0.42;

            const sheetMap = createMysteryScrollSheetTexture();
            const rollMap = createMysteryScrollRollTexture();
            const maxAnisotropy = mysteryScroll3D.renderer ? mysteryScroll3D.renderer.capabilities.getMaxAnisotropy() : 1;
            const textureAnisotropy = Math.min(8, maxAnisotropy);
            if (sheetMap) sheetMap.anisotropy = textureAnisotropy;
            if (rollMap) rollMap.anisotropy = textureAnisotropy;

            const sheetGeometry = new THREE.PlaneGeometry(sheetWidth, sheetHeight, 56, 90);
            const position = sheetGeometry.attributes.position;
            for (let i = 0; i < position.count; i++) {
                const x = position.getX(i);
                const y = position.getY(i);
                const bendX = Math.pow(Math.abs(x) / (sheetWidth * 0.5), 1.3) * 0.058;
                const centerSag = Math.pow(Math.abs(y) / (sheetHeight * 0.5), 1.75) * -0.012;
                const wrinkle = Math.sin((y / sheetHeight) * Math.PI * 5.7 + x * 2.3) * 0.008;
                position.setZ(i, bendX + centerSag + wrinkle);
            }
            sheetGeometry.computeVertexNormals();

            const sheetMaterial = new THREE.MeshStandardMaterial({
                map: sheetMap || null,
                color: 0xe7b25d,
                roughness: 0.92,
                metalness: 0.03,
                transparent: true,
                alphaTest: 0.08,
                side: THREE.DoubleSide
            });
            const sheet = new THREE.Mesh(sheetGeometry, sheetMaterial);
            sheet.position.z = 0.02;
            group.add(sheet);

            const rollGeometry = new THREE.CylinderGeometry(rollRadius, rollRadius * 1.03, rollLength, 60, 1, false);
            rollGeometry.rotateZ(Math.PI * 0.5);
            const rollMaterial = new THREE.MeshStandardMaterial({
                map: rollMap || null,
                color: 0xdda557,
                roughness: 0.84,
                metalness: 0.03
            });
            const topRoll = new THREE.Mesh(rollGeometry, rollMaterial);
            topRoll.position.set(0, topRollY, 0.095);
            const bottomRoll = new THREE.Mesh(rollGeometry, rollMaterial);
            bottomRoll.position.set(0, bottomRollY, 0.095);
            group.add(topRoll, bottomRoll);

            // Bridge strips ensure visible contact between parchment and rollers.
            const wrapMaterial = new THREE.MeshStandardMaterial({
                color: 0xdfab57,
                roughness: 0.91,
                metalness: 0.02,
                side: THREE.DoubleSide
            });
            const wrapGeometry = new THREE.PlaneGeometry(sheetWidth * 0.93, rollRadius * 0.9);
            const topWrap = new THREE.Mesh(wrapGeometry, wrapMaterial);
            topWrap.position.set(0, topRollY - rollRadius * 0.86, 0.072);
            const bottomWrap = new THREE.Mesh(wrapGeometry, wrapMaterial.clone());
            bottomWrap.position.set(0, bottomRollY + rollRadius * 0.86, 0.072);
            group.add(topWrap, bottomWrap);

            const ropeAttachMarker = new THREE.Object3D();
            ropeAttachMarker.position.set(0, topRollY + rollRadius * 0.64, 0.1);
            group.add(ropeAttachMarker);
            group.userData.attachmentNode = ropeAttachMarker;

            const goldMaterial = new THREE.MeshStandardMaterial({
                color: 0xf1bf67,
                emissive: 0x4a2a08,
                emissiveIntensity: 0.21,
                roughness: 0.26,
                metalness: 0.93
            });
            const darkMetalMaterial = new THREE.MeshStandardMaterial({
                color: 0x231209,
                emissive: 0x120804,
                emissiveIntensity: 0.08,
                roughness: 0.48,
                metalness: 0.82
            });

            const topLeftFinial = createMysteryScrollFinial(-1, rollLength, goldMaterial, darkMetalMaterial);
            const topRightFinial = createMysteryScrollFinial(1, rollLength, goldMaterial, darkMetalMaterial);
            topLeftFinial.position.y = topRollY;
            topRightFinial.position.y = topRollY;

            const bottomLeftFinial = createMysteryScrollFinial(-1, rollLength, goldMaterial, darkMetalMaterial);
            const bottomRightFinial = createMysteryScrollFinial(1, rollLength, goldMaterial, darkMetalMaterial);
            bottomLeftFinial.position.y = bottomRollY;
            bottomRightFinial.position.y = bottomRollY;
            group.add(topLeftFinial, topRightFinial, bottomLeftFinial, bottomRightFinial);

            group.position.y = 0.0;
            group.rotation.x = -0.045;
            return group;
        }

        function initMysteryScroll3D() {
            if (!mysteryScroll3D.enabled || mysteryScroll3D.renderer) return;
            try {
                const renderer = new THREE.WebGLRenderer({
                    canvas: mysteryScrollCanvas,
                    antialias: true,
                    alpha: true,
                    premultipliedAlpha: true,
                    powerPreference: 'high-performance'
                });
                renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                renderer.setClearColor(0x000000, 0);
                renderer.outputColorSpace = THREE.SRGBColorSpace;
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                renderer.toneMappingExposure = 1.15;

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 30);
                camera.position.set(0, 0.03, 5.2);

                scene.add(new THREE.AmbientLight(0xffedcc, 1.12));
                const keyLight = new THREE.DirectionalLight(0xfff1d8, 1.45);
                keyLight.position.set(1.9, 2.5, 2.4);
                const warmFillLight = new THREE.DirectionalLight(0xc57f3b, 0.58);
                warmFillLight.position.set(-2.2, -0.6, 1.8);
                const edgeLight = new THREE.DirectionalLight(0x4f2d12, 0.34);
                edgeLight.position.set(0.3, -2.5, -2.2);
                scene.add(keyLight, warmFillLight, edgeLight);

                mysteryScroll3D.renderer = renderer;
                mysteryScroll3D.scene = scene;
                mysteryScroll3D.camera = camera;
                mysteryScroll3D.group = createMysteryScrollModel();
                mysteryScroll3D.attachmentNode = mysteryScroll3D.group.userData.attachmentNode || null;
                scene.add(mysteryScroll3D.group);
                resizeMysteryScroll3D(true);
            } catch (error) {
                console.warn('Unable to initialize 3D mystery scroll renderer:', error);
            }
        }

        function updateMysteryScrollAttachmentMetrics() {
            if (!mysteryScroll3D.enabled || !mysteryScroll3D.camera || !mysteryScroll3D.group) return;
            const node = mysteryScroll3D.attachmentNode || mysteryScroll3D.group.userData.attachmentNode;
            if (!node) return;

            const worldPosition = node.getWorldPosition(new THREE.Vector3());
            const projected = worldPosition.project(mysteryScroll3D.camera);
            if (!Number.isFinite(projected.x) || !Number.isFinite(projected.y)) return;

            mysteryScroll3D.attachmentXNorm = THREE.MathUtils.clamp((projected.x + 1) * 0.5, 0, 1);
            mysteryScroll3D.attachmentYNorm = THREE.MathUtils.clamp((1 - projected.y) * 0.5, 0, 1);
        }

        function fitMysteryScrollText(force = false) {
            if (!mysteryScrollSign) return;
            const textWrap = mysteryScrollSign.querySelector('.scroll-text');
            const topLine = mysteryScrollSign.querySelector('.line-top');
            const bottomLine = mysteryScrollSign.querySelector('.line-bottom');
            if (!textWrap || !topLine || !bottomLine) return;

            // Guard against rare compositor/style glitches that can leave scroll text blank or hidden.
            if (!topLine.textContent || !topLine.textContent.trim()) {
                topLine.textContent = 'Mystery';
            }
            if (!bottomLine.textContent || !bottomLine.textContent.trim()) {
                bottomLine.textContent = '- 100 pts';
            }
            textWrap.style.opacity = '1';
            textWrap.style.visibility = 'visible';
            topLine.style.opacity = '1';
            topLine.style.visibility = 'visible';
            bottomLine.style.opacity = '1';
            bottomLine.style.visibility = 'visible';

            const signWidth = mysteryScrollSign.offsetWidth;
            const signHeight = mysteryScrollSign.offsetHeight;
            if (!force &&
                Math.abs(signWidth - mysteryScroll3D.textFitWidth) < 1 &&
                Math.abs(signHeight - mysteryScroll3D.textFitHeight) < 1) {
                return;
            }

            mysteryScroll3D.textFitWidth = signWidth;
            mysteryScroll3D.textFitHeight = signHeight;

            const availableWidth = Math.max(72, textWrap.clientWidth - 2);
            const signScale = THREE.MathUtils.clamp(
                Math.min(signWidth / 300, signHeight / 242),
                0.65,
                1.1
            );
            const topBaseSize = signWidth * 0.178;
            const bottomBaseSize = signWidth * 0.134;
            let topSize = topBaseSize;
            let bottomSize = bottomBaseSize;
            const minTopSize = topBaseSize * 0.7;
            const minBottomSize = bottomBaseSize * 0.7;
            const topStep = 0.4 * signScale;
            const bottomStep = 0.35 * signScale;
            const topTranslateY = -THREE.MathUtils.clamp(signHeight * 0.0155, 1.8, 3.8);
            const bottomTranslateY = -THREE.MathUtils.clamp(signHeight * 0.0082, 0.9, 2.2);

            topLine.style.fontSize = `${topSize.toFixed(2)}px`;
            bottomLine.style.fontSize = `${bottomSize.toFixed(2)}px`;
            topLine.style.transform = `translateY(${topTranslateY.toFixed(2)}px) scaleX(1)`;
            bottomLine.style.transform = `translateY(${bottomTranslateY.toFixed(2)}px) scaleX(1)`;
            topLine.style.transformOrigin = '50% 50%';
            bottomLine.style.transformOrigin = '50% 50%';

            for (let i = 0; i < 90; i++) {
                const topOverflow = topLine.scrollWidth - availableWidth;
                const bottomOverflow = bottomLine.scrollWidth - availableWidth;
                if (topOverflow <= 0.5 && bottomOverflow <= 0.5) break;

                if (topOverflow > 0.5 && topSize > minTopSize) {
                    topSize -= topStep;
                }
                if (bottomOverflow > 0.5 && bottomSize > minBottomSize) {
                    bottomSize -= bottomStep;
                }

                topLine.style.fontSize = `${topSize.toFixed(2)}px`;
                bottomLine.style.fontSize = `${bottomSize.toFixed(2)}px`;
            }

            const widthNorm = THREE.MathUtils.clamp((signWidth - 154) / 146, 0, 1);
            const topLetterSpacing = THREE.MathUtils.lerp(0.01, 0.018, widthNorm);
            const bottomLetterSpacing = THREE.MathUtils.lerp(0.009, 0.015, widthNorm);
            topLine.style.letterSpacing = `${topLetterSpacing.toFixed(3)}em`;
            bottomLine.style.letterSpacing = `${bottomLetterSpacing.toFixed(3)}em`;

            const topScale = Math.min(1, availableWidth / Math.max(1, topLine.scrollWidth));
            const bottomScale = Math.min(1, availableWidth / Math.max(1, bottomLine.scrollWidth));
            topLine.style.transform = `translateY(${topTranslateY.toFixed(2)}px) scaleX(${Math.max(0.84, topScale).toFixed(3)})`;
            bottomLine.style.transform = `translateY(${bottomTranslateY.toFixed(2)}px) scaleX(${Math.max(0.86, bottomScale).toFixed(3)})`;
        }

        function resizeMysteryScroll3D(forceRender = false) {
            if (!mysteryScroll3D.enabled || !mysteryScroll3D.renderer || !mysteryScrollSign) return;
            const rect = mysteryScrollSign.getBoundingClientRect();
            const width = Math.max(160, Math.round(rect.width));
            const height = Math.max(180, Math.round(rect.height));
            const resized = width !== mysteryScroll3D.width || height !== mysteryScroll3D.height;
            if (!resized && !forceRender) return;

            mysteryScroll3D.width = width;
            mysteryScroll3D.height = height;
            mysteryScroll3D.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            mysteryScroll3D.renderer.setSize(width, height, false);
            mysteryScroll3D.camera.aspect = width / Math.max(1, height);
            const verticalFov = THREE.MathUtils.degToRad(mysteryScroll3D.camera.fov);
            const horizontalFov = 2 * Math.atan(Math.tan(verticalFov * 0.5) * mysteryScroll3D.camera.aspect);
            const targetWidth = 4.16;
            const targetHeight = 2.7;
            const padding = 1.02;
            const distanceForHeight = (targetHeight * 0.5 * padding) / Math.tan(verticalFov * 0.5);
            const distanceForWidth = (targetWidth * 0.5 * padding) / Math.tan(horizontalFov * 0.5);
            mysteryScroll3D.camera.position.set(0, 0.03, Math.max(distanceForHeight, distanceForWidth));
            mysteryScroll3D.camera.updateProjectionMatrix();
            updateMysteryScrollAttachmentMetrics();
            fitMysteryScrollText(forceRender || resized);
            renderMysteryScroll3D(0);
        }

        function renderMysteryScroll3D(t = 0) {
            if (!mysteryScroll3D.enabled || !mysteryScroll3D.renderer || !mysteryScroll3D.group) return;
            mysteryScroll3D.group.rotation.y = 0;
            mysteryScroll3D.group.rotation.x = -0.045;
            updateMysteryScrollAttachmentMetrics();
            mysteryScroll3D.renderer.render(mysteryScroll3D.scene, mysteryScroll3D.camera);
        }

        function getMysteryDeviceTiltScreenAngle() {
            const orientationAngle = window.screen?.orientation?.angle;
            if (Number.isFinite(orientationAngle)) {
                return orientationAngle;
            }
            const legacyAngle = window.orientation;
            return Number.isFinite(legacyAngle) ? legacyAngle : 0;
        }

        function normalizeMysteryDeviceTilt(beta, gamma) {
            if (!Number.isFinite(beta) || !Number.isFinite(gamma)) {
                return null;
            }

            const angleRad = THREE.MathUtils.degToRad(getMysteryDeviceTiltScreenAngle());
            const rollDeg = gamma * Math.cos(angleRad) + beta * Math.sin(angleRad);
            const pitchDeg = beta * Math.cos(angleRad) - gamma * Math.sin(angleRad);
            if (!Number.isFinite(rollDeg) || !Number.isFinite(pitchDeg)) {
                return null;
            }

            return { rollDeg, pitchDeg };
        }

        function resetMysteryDeviceTiltCalibration() {
            mysteryDeviceTilt.needsCalibration = true;
            mysteryDeviceTilt.active = false;
            mysteryDeviceTilt.rawRollDeg = 0;
            mysteryDeviceTilt.rawPitchDeg = 0;
            mysteryDeviceTilt.rollDeg = 0;
            mysteryDeviceTilt.pitchDeg = 0;
            mysteryDeviceTilt.lastSampleAt = 0;
        }

        function getMysteryDeviceTiltBridge() {
            if (window.parent === window) {
                return null;
            }
            try {
                const bridge = window.parent?.__homePageTiltBridge;
                if (
                    !bridge ||
                    typeof bridge.ensureStarted !== 'function' ||
                    typeof bridge.getState !== 'function'
                ) {
                    return null;
                }
                return bridge;
            } catch (_) {
                return null;
            }
        }

        function refreshMysteryDeviceTiltSupport() {
            const bridge = getMysteryDeviceTiltBridge();
            if (bridge) {
                try {
                    const bridgeState = bridge.getState();
                    if (bridgeState?.permission === 'unsupported') {
                        mysteryDeviceTilt.supported = false;
                        return false;
                    }
                } catch (_) {}
            }
            mysteryDeviceTilt.supported = Boolean(typeof window.DeviceOrientationEvent !== 'undefined' || bridge);
            return mysteryDeviceTilt.supported;
        }

        function postMysteryDeviceTiltBridgeMessage(type) {
            if (!type || window.parent === window) {
                return false;
            }
            try {
                window.parent.postMessage({ type }, window.location.origin);
                return true;
            } catch (_) {
                return false;
            }
        }

        function applyMysteryDeviceTiltPermissionStatus(permission, { listening = false, resetCalibration = false } = {}) {
            mysteryDeviceTilt.permission = typeof permission === 'string' ? permission : 'unknown';
            mysteryDeviceTilt.listening = mysteryDeviceTilt.permission === 'granted' && Boolean(listening);
            mysteryDeviceTilt.supported = mysteryDeviceTilt.permission !== 'unsupported' && refreshMysteryDeviceTiltSupport();
            if (!mysteryDeviceTilt.listening) {
                mysteryDeviceTilt.active = false;
                mysteryDeviceTilt.lastSampleAt = 0;
            }
            if (resetCalibration) {
                resetMysteryDeviceTiltCalibration();
            }
        }

        function applyMysteryDeviceTiltSample(beta, gamma) {
            const normalizedTilt = normalizeMysteryDeviceTilt(beta, gamma);
            if (!normalizedTilt) {
                return;
            }

            if (mysteryDeviceTilt.needsCalibration) {
                mysteryDeviceTilt.baselineRollDeg = normalizedTilt.rollDeg;
                mysteryDeviceTilt.baselinePitchDeg = normalizedTilt.pitchDeg;
                mysteryDeviceTilt.needsCalibration = false;
            }

            mysteryDeviceTilt.rawRollDeg = normalizedTilt.rollDeg;
            mysteryDeviceTilt.rawPitchDeg = normalizedTilt.pitchDeg;
            mysteryDeviceTilt.active = true;
            mysteryDeviceTilt.lastSampleAt = performance.now();
        }

        function handleMysteryDeviceOrientation(event) {
            applyMysteryDeviceTiltSample(event?.beta, event?.gamma);
        }

        function handleMysteryDeviceTiltBridgeMessage(event) {
            if (window.parent === window || event.origin !== window.location.origin || event.source !== window.parent) {
                return;
            }
            const data = event?.data;
            if (!data || typeof data !== 'object') {
                return;
            }

            if (data.type === MYSTERY_DEVICE_TILT_STATUS_MESSAGE) {
                const permission = typeof data.permission === 'string' ? data.permission : 'unknown';
                const shouldResetCalibration =
                    permission === 'granted' &&
                    (mysteryDeviceTilt.permission !== 'granted' || !mysteryDeviceTilt.listening);
