        function loadEfernoWingGeometries() {
            const clonePrepared = () => ({
                left: efernoWingAssetState.leftGeometry?.clone() || null,
                right: efernoWingAssetState.rightGeometry?.clone() || null
            });
            if (efernoWingAssetState.leftGeometry && efernoWingAssetState.rightGeometry) {
                return Promise.resolve(clonePrepared());
            }
            if (!efernoWingAssetState.loadPromise) {
                efernoWingAssetState.loadPromise = new Promise((resolve, reject) => {
                    efernoWingAssetState.loader.load(
                        efernoWingAssetState.modelUrl,
                        (gltf) => {
                            const root = gltf?.scene || gltf?.scenes?.[0] || null;
                            const sourceGeometry = getLargestMeshGeometryFromObject(root);
                            if (!sourceGeometry) {
                                reject(new Error('Eferno GLB did not contain a mesh with geometry.'));
                                return;
                            }
                            const split = splitPairWingGeometry(sourceGeometry);
                            if (sourceGeometry?.dispose) {
                                sourceGeometry.dispose();
                            }
                            if (!split?.left || !split?.right) {
                                reject(new Error('Eferno GLB could not be split into left/right wings.'));
                                return;
                            }
                            const preparedLeft = prepareWingGeometryForEferno(split.left);
                            const preparedRight = prepareWingGeometryForEferno(split.right);
                            if (split.left?.dispose) split.left.dispose();
                            if (split.right?.dispose) split.right.dispose();
                            if (!preparedLeft || !preparedRight) {
                                reject(new Error('Eferno wing geometry preparation failed.'));
                                return;
                            }
                            efernoWingAssetState.leftGeometry = preparedLeft;
                            efernoWingAssetState.rightGeometry = preparedRight;
                            resolve();
                        },
                        undefined,
                        (error) => reject(error)
                    );
                }).catch((error) => {
                    console.warn('Unable to load Eferno wing GLB, falling back to procedural geometry.', error);
                });
            }

            return efernoWingAssetState.loadPromise.then(() => clonePrepared());
        }

        function makeEfernoEmberSystem(side = 'left') {
            const dir = side === 'left' ? -1 : 1;
            const count = 92;
            const positions = new Float32Array(count * 3);
            const basePositions = new Float32Array(count * 3);
            const phases = new Float32Array(count);
            let seed = side === 'left' ? 19431 : 68217;
            const rand = () => {
                seed = (seed * 1664525 + 1013904223) >>> 0;
                return seed / 4294967296;
            };

            for (let i = 0; i < count; i++) {
                const i3 = i * 3;
                const spread = 0.2 + rand() * 1.08;
                const y = -0.34 + rand() * 1.78;
                const z = 0.08 + rand() * 0.42;
                basePositions[i3] = dir * spread;
                basePositions[i3 + 1] = y;
                basePositions[i3 + 2] = z;
                positions[i3] = basePositions[i3];
                positions[i3 + 1] = basePositions[i3 + 1];
                positions[i3 + 2] = basePositions[i3 + 2];
                phases[i] = rand() * Math.PI * 2;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({
                color: 0xffb24b,
                size: 0.06,
                sizeAttenuation: true,
                transparent: true,
                opacity: 0.76,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });
            const points = new THREE.Points(geometry, material);
            points.frustumCulled = false;

            return {
                points,
                basePositions,
                phases,
                speed: 2.9 + rand() * 1.2,
                drift: 0.05 + rand() * 0.04,
                rise: 0.16 + rand() * 0.08,
                phaseOffset: rand() * Math.PI * 2
            };
        }

            const swapGeometry = (geometry) => {
                if (!geometry) return;

                glowMesh.geometry = geometry.clone();
                if (previousMain && previousMain !== geometry && previousMain !== glowMesh.geometry) {
                    previousMain.dispose();
                }
                if (previousGlow && previousGlow !== membraneMesh.geometry && previousGlow !== glowMesh.geometry) {
                    previousGlow.dispose();
                }
                membraneMesh.geometry.computeBoundingSphere();
                glowMesh.geometry.computeBoundingSphere();

        function makeAlphaWingTextures() {
            const size = 1024;
            const maxAnisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());

            function makePanelTexture({ baseA, baseB, edgeTint, stripeA, stripeB, seedBase }) {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                let seed = seedBase >>> 0;
                const rand = () => {
                    seed = (seed * 1664525 + 1013904223) >>> 0;
                    return seed / 4294967296;
                };

                const base = ctx.createLinearGradient(0, 0, size, size);
                base.addColorStop(0.0, baseA);
                base.addColorStop(0.54, baseB);
                base.addColorStop(1.0, '#0f1636');
                ctx.fillStyle = base;
                ctx.fillRect(0, 0, size, size);

                for (let i = 0; i < 3; i++) {
                    const y = size * (0.26 + i * 0.18 + rand() * 0.04);
                    const alpha = 0.2 + rand() * 0.16;
                    ctx.strokeStyle = `rgba(235,248,255,${alpha})`;
                    ctx.lineWidth = 6 + rand() * 5;
                    ctx.beginPath();
                    ctx.moveTo(size * 0.04, y);
                    ctx.lineTo(size * 0.95, y + (rand() - 0.5) * 26);
                    ctx.stroke();
                }

                for (let i = 0; i < 6; i++) {
                    const x = size * (0.04 + rand() * 0.84);
                    const y = size * (0.08 + rand() * 0.82);
                    const w = 140 + rand() * 230;
                    const h = 4 + rand() * 8;
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(-0.2 + rand() * 0.4);
                    ctx.fillStyle = i % 2 === 0 ? stripeA : stripeB;
                    ctx.fillRect(0, 0, w, h);
                    ctx.fillStyle = edgeTint;
                    ctx.fillRect(2, 2, Math.max(6, w * 0.35), Math.max(2, h * 0.38));
                    ctx.restore();
                }

                const vignette = ctx.createRadialGradient(size * 0.54, size * 0.48, 80, size * 0.54, size * 0.48, size * 0.76);
                vignette.addColorStop(0, 'rgba(0,0,0,0)');
                vignette.addColorStop(1, 'rgba(0,0,0,0.5)');
                ctx.fillStyle = vignette;
                ctx.fillRect(0, 0, size, size);

                const tex = new THREE.CanvasTexture(canvas);
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.anisotropy = maxAnisotropy;
                tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(1.0, 1.0);
                tex.needsUpdate = true;
                return tex;
            }

            const sparkCanvas = document.createElement('canvas');
            sparkCanvas.width = 128;
            sparkCanvas.height = 128;
            const sCtx = sparkCanvas.getContext('2d');
            const sparkGrad = sCtx.createRadialGradient(64, 64, 4, 64, 64, 60);
            sparkGrad.addColorStop(0.0, 'rgba(255,255,255,1)');
            sparkGrad.addColorStop(0.24, 'rgba(181,242,255,0.95)');
            sparkGrad.addColorStop(0.58, 'rgba(255,124,232,0.78)');
            sparkGrad.addColorStop(1.0, 'rgba(255,255,255,0)');
            sCtx.fillStyle = sparkGrad;
            sCtx.fillRect(0, 0, 128, 128);

            const sparkTexture = new THREE.CanvasTexture(sparkCanvas);
            sparkTexture.colorSpace = THREE.SRGBColorSpace;
            sparkTexture.needsUpdate = true;

            return {
                cyanPanel: makePanelTexture({
                    baseA: '#0f2a56',
                    baseB: '#1a417f',
                    edgeTint: 'rgba(215,251,255,0.55)',
                    stripeA: 'rgba(64,229,255,0.84)',
                    stripeB: 'rgba(153,242,255,0.72)',
                    seedBase: 9733
                }),
                magentaPanel: makePanelTexture({

                    edgeTint: 'rgba(255,214,255,0.52)',

                    stripeB: 'rgba(204,112,255,0.72)',

        function makeAlphaBladeGeometry(dir, options = {}) {
            const {
                length = 3.2,
                rootWidth = 0.58,
                tipWidth = 0.2,
                thickness = 0.07,
                camber = 0.12,
                droop = 0,
                sweep = 0.1,
                twist = 0.05
            } = options;

            const mx = (x) => x * dir;
            const shape = new THREE.Shape();
            shape.moveTo(mx(0), -rootWidth * 0.5);
            shape.bezierCurveTo(
                mx(length * 0.34),
                -rootWidth * 0.68 + sweep * 0.18,
                mx(length * 0.88),
                -tipWidth * 0.62 + sweep,
                mx(length),
                -tipWidth * 0.46 + sweep
            );
            shape.quadraticCurveTo(mx(length * 1.03), sweep * 0.82, mx(length), tipWidth * 0.48 + sweep);
            shape.bezierCurveTo(
                mx(length * 0.9),
                tipWidth * 0.72 + sweep,
                mx(length * 0.38),
                rootWidth * 0.66 + sweep * 0.14,
                mx(0),
                rootWidth * 0.5
            );
            shape.closePath();

            const geo = new THREE.ExtrudeGeometry(shape, {
                steps: 1,
                depth: thickness,
                bevelEnabled: true,
                bevelSize: 0.015,
                bevelThickness: 0.015,
                bevelSegments: 2,
                curveSegments: 42
            });
            geo.translate(0, 0, -thickness * 0.5);

            const pos = geo.attributes.position;
            const uv = new Float32Array(pos.count * 2);
            const halfRoot = Math.max(0.001, rootWidth * 0.5);
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const y = pos.getY(i);
                const z = pos.getZ(i);
                const nx = THREE.MathUtils.clamp(Math.abs(x) / Math.max(0.001, length), 0, 1);
                const ny = THREE.MathUtils.clamp(y / halfRoot, -1, 1);
                const camberOffset = Math.sin(nx * Math.PI) * camber;
                const twistOffset = ny * twist * Math.pow(nx, 1.2);
                const droopOffset = Math.pow(nx, 1.45) * droop;
                pos.setXYZ(i, x, y + droopOffset, z + camberOffset + twistOffset);
                uv[i * 2] = nx;
                uv[i * 2 + 1] = THREE.MathUtils.clamp((ny + 1) * 0.5, 0, 1);
            }
            geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
            pos.needsUpdate = true;
            geo.computeVertexNormals();
            return geo;
        }

        function makeAlphaSparkSystem(dir, sparkTexture) {
            const count = 16;
            const positions = new Float32Array(count * 3);
            const basePositions = new Float32Array(count * 3);
            const phases = new Float32Array(count);

            let seed = dir > 0 ? 13579 : 35791;
            const rand = () => {
                seed = (seed * 1103515245 + 12345) >>> 0;
                return (seed & 0x7fffffff) / 0x7fffffff;
            };

            for (let i = 0; i < count; i++) {
                const idx = i * 3;
                const x = dir * (0.56 + rand() * 3.1);
                const y = -1.2 + rand() * 3.5;
                const z = -0.06 + rand() * 0.46;
                positions[idx] = basePositions[idx] = x;
                positions[idx + 1] = basePositions[idx + 1] = y;
                positions[idx + 2] = basePositions[idx + 2] = z;
                phases[i] = rand() * Math.PI * 2;
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({
                color: 0xffc2ff,
                map: sparkTexture,
                alphaMap: sparkTexture,
                size: 0.052,
                sizeAttenuation: true,
                transparent: true,
                opacity: 0.56,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            const points = new THREE.Points(geo, mat);
            return {
                points,
                basePositions,
                phases,
                speed: 2.6 + rand() * 0.8,
                drift: 0.016 + rand() * 0.012,
                phaseOffset: rand() * Math.PI * 2
            };
        }

            for (let i = 0; i < 34; i++) {

        function makeRainbowFeatherGeometry(dir, options = {}) {
            const {
                length = 4.6,
                rootWidth = 0.86,
                tipWidth = 0.18,
                rise = 1.1,
                camber = 0.12,
                droop = 0,
                twist = 0.05,
                curl = 0.2
            } = options;

            const mx = (x) => x * dir;
            const shape = new THREE.Shape();
            shape.moveTo(mx(0), -rootWidth * 0.5);
            shape.bezierCurveTo(
                mx(length * 0.24), -rootWidth * 0.74,
                mx(length * 0.82), rise - tipWidth * 0.54,
                mx(length), rise - tipWidth * 0.14
            );
            shape.quadraticCurveTo(
                mx(length * (1.06 + curl * 0.1)),
                rise + tipWidth * (0.5 + curl * 0.8),
                mx(length * (0.94 + curl * 0.06)),
                rise + tipWidth * 1.04
            );
            shape.bezierCurveTo(
                mx(length * 0.72), rise + tipWidth * 1.2,
                mx(length * 0.24), rootWidth * 0.76,
                mx(0), rootWidth * 0.5
            );
            shape.closePath();

            const geo = new THREE.ShapeGeometry(shape, 92);
            const pos = geo.attributes.position;
            const uv = new Float32Array(pos.count * 2);
            const heightRef = rootWidth + Math.abs(rise) * 0.95;

            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const y = pos.getY(i);
                const nx = THREE.MathUtils.clamp(Math.abs(x) / Math.max(0.001, length), 0, 1);
                const ny = THREE.MathUtils.clamp((y - rise * 0.36) / Math.max(0.001, heightRef), -1, 1);
                const edgeSoft = 1 - Math.abs(ny);
                const z = Math.sin(nx * Math.PI) * camber * (0.54 + edgeSoft * 0.46)
                    + ny * twist * Math.pow(nx, 1.22)
                    + Math.pow(nx, 1.34) * droop
                    + Math.sin(nx * 11.2 + ny * 3.6) * 0.006;

                pos.setXYZ(
                    i,
                    x + dir * Math.pow(nx, 2.08) * curl * 0.24 * (0.16 + Math.abs(ny)),
                    y,
                    z
                );

                uv[i * 2] = nx;
                uv[i * 2 + 1] = THREE.MathUtils.clamp((ny + 1) * 0.5, 0, 1);
            }

            geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
            pos.needsUpdate = true;
            geo.computeVertexNormals();
            return geo;
        }

        function makeRainbowSparkSystem(dir, texture, options = {}) {
            const {
                count = 24,
                size = 0.07,
                opacity = 0.72,
                spreadMin = 0.7,
                spreadMax = 4.2,
                yOffset = 0,
                drift = 0.036
            } = options;

            const positions = new Float32Array(count * 3);
            const basePositions = new Float32Array(count * 3);
            const phases = new Float32Array(count);
            const colors = new Float32Array(count * 3);
            const palette = [0xffd2f5, 0xffe7a8, 0xb8ddff, 0xbefaff, 0xffc1df, 0xd4bbff, 0xffffff];

            let seed = dir > 0 ? 908731 : 187349;
            const rand = () => {
                seed = (seed * 1103515245 + 12345) >>> 0;
                return (seed & 0x7fffffff) / 0x7fffffff;
            };

            for (let i = 0; i < count; i++) {
                const idx = i * 3;
                const span = spreadMin + rand() * (spreadMax - spreadMin);
                const arc = -1.05 + rand() * 2.2;
                const x = dir * (0.46 + Math.cos(arc) * span);
                const y = yOffset + Math.sin(arc) * (span * 0.78) + (rand() - 0.5) * 0.64;
                const z = 0.14 + rand() * 0.5;

                positions[idx] = basePositions[idx] = x;
                positions[idx + 1] = basePositions[idx + 1] = y;
                positions[idx + 2] = basePositions[idx + 2] = z;
                phases[i] = rand() * Math.PI * 2;

                const c = new THREE.Color(palette[Math.floor(rand() * palette.length)]);
                colors[idx] = c.r;
                colors[idx + 1] = c.g;
                colors[idx + 2] = c.b;
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                map: texture,
                alphaMap: texture,
                vertexColors: true,
                size,
                sizeAttenuation: true,
                transparent: true,
                opacity,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            return {
                points: new THREE.Points(geo, mat),
                basePositions,
                phases,
                speed: 1.8 + rand() * 1.1,
                drift,
                phaseOffset: rand() * Math.PI * 2
            };
        }

        function createLegacyInventoryAndPropDefinitionsFileFallback({ factoryById, warn = console.warn } = {}) {

        const propRegistry = new Map();

        const activeProps = new Set();

        function getCategoryLimit(category) {
            return CATEGORY_EQUIP_LIMITS[category] ?? 1;
        }

        function getCategorySelection(category) {
            const selected = activeCategorySelection.get(category);
            if (!selected) {
                return [];
            }
            return Array.isArray(selected) ? selected.slice() : [selected];
        }

        function getCategoryPrimarySelection(category) {
            const selected = getCategorySelection(category);
            return selected[selected.length - 1] || null;
        }

        function hasCategorySelection(category) {
            return getCategorySelection(category).length > 0;
        }

        function setCategorySelection(category, selections) {
            const unique = [];
            for (const entry of selections) {
                if (!entry || unique.includes(entry)) {
                    continue;
                }
                unique.push(entry);
            }
            if (!unique.length) {
                activeCategorySelection.delete(category);
                return;
            }
            const limit = Math.max(1, getCategoryLimit(category));
            activeCategorySelection.set(category, unique.slice(-limit));

        function getPropCategory(propKey) {
            return propRegistry.get(propKey)?.category || null;

        function comparePropCatalogOrder(a, b) {
            const aIndex = PROP_CATALOG_ORDER.has(a) ? PROP_CATALOG_ORDER.get(a) : Number.MAX_SAFE_INTEGER;
            const bIndex = PROP_CATALOG_ORDER.has(b) ? PROP_CATALOG_ORDER.get(b) : Number.MAX_SAFE_INTEGER;
            if (aIndex !== bIndex) {
                return aIndex - bIndex;
            }
            return getPropLabelByKey(a).localeCompare(getPropLabelByKey(b));

        function getInventoryKeysByCategory(categoryKey) {
            return Array.from(playerInventory)

        function getInventoryCategoryCount(categoryKey) {

        function enforceInventoryCategoryLimit(categoryKey) {
            const limit = INVENTORY_LIMIT_PER_CATEGORY;
            const listed = getInventoryKeysByCategory(categoryKey);
            const excess = listed.length - limit;
            if (excess <= 0) {
                return [];
            }
            const removed = listed.slice(0, excess);
            removed.forEach((propKey) => {
                playerInventory.delete(propKey);
            });
            return removed;

        function enforceInventoryCategoryLimits() {

        function applyLoadout() {

        function markPropMainRendererWarm(propKey) {

        function isPropMainRendererWarm(propKey) {

        function warmPropForMainRenderer(propKey) {
            if (!propKey || isPropMainRendererWarm(propKey)) {
                return true;
            }

            const metadata = propRegistry.get(propKey);
            const prop = metadata?.object;
            if (!prop) {
                return false;
            }

            const left = prop.userData?.left;
            const right = prop.userData?.right;
            const wasVisible = prop.visible;
            const leftWasVisible = left?.visible ?? false;
            const rightWasVisible = right?.visible ?? false;

            try {
                if (left && right) {
                    left.visible = true;
                    right.visible = true;
                }
                prop.visible = true;
                renderer.compile(scene, camera);
                markPropMainRendererWarm(propKey);
                return true;
            } catch (_) {
                return false;
            } finally {
                prop.visible = wasVisible;
                if (left) left.visible = leftWasVisible;
                if (right) right.visible = rightWasVisible;
            }
        }

        function schedulePropWarmForMainRenderer(propKey) {
            if (!propKey || isPropMainRendererWarm(propKey) || scheduledMainRendererWarmups.has(propKey)) {
                return;
            }
            scheduledMainRendererWarmups.add(propKey);
            const run = () => {
                scheduledMainRendererWarmups.delete(propKey);
                warmPropForMainRenderer(propKey);

            if (window.requestIdleCallback) {
                window.requestIdleCallback(() => run(), { timeout: 360 });

        function collectEquipGlowTargets(propObject) {
            const targets = [];
            const appendTarget = (object3D) => {
                if (!object3D || !object3D.isObject3D) return;
                if (targets.includes(object3D)) return;
                targets.push(object3D);
            };

            const left = propObject?.userData?.left;
            const right = propObject?.userData?.right;
            appendTarget(left);
            appendTarget(right);

            const rootHasGeometry = propObject?.isObject3D ? hasFiniteRenderableGeometry(propObject) : false;
            if (rootHasGeometry || targets.length === 0) {
                appendTarget(propObject);
            }

            return targets.filter((object3D) => object3D?.parent);
        }

        function ensureEquipGlowAuraForTarget(targetObject) {
            if (!targetObject || !targetObject.isObject3D) {
                return null;
            }
            const existing = equipGlowAuraByTarget.get(targetObject);
            if (existing) {
                return existing;
            }

            const bounds = computeSafeObjectBounds(targetObject, { respectVisibility: false, includePoints: true });
            const worldCenter = bounds ? bounds.getCenter(new THREE.Vector3()) : new THREE.Vector3();
            const safeSize = bounds ? getFiniteSizeVector(bounds.getSize(new THREE.Vector3()), 0.72) : new THREE.Vector3(0.72, 0.72, 0.72);
            targetObject.updateMatrixWorld(true);
            const localCenter = targetObject.worldToLocal(worldCenter.clone());
            const maxSpan = Math.max(safeSize.x, safeSize.y, safeSize.z);
            const auraSize = THREE.MathUtils.clamp(maxSpan * 2.9, 0.9, 16.5);

            const auraSprite = createSoftHaloSprite({
                size: auraSize,
                inner: 'rgba(255, 247, 196, 0.94)',
                mid: 'rgba(133, 232, 255, 0.48)',
                outer: 'rgba(38, 116, 224, 0.0)'

            auraSprite.material.opacity = 0;
            auraSprite.material.depthTest = false;
            auraSprite.renderOrder = 9;
            equipGlowOverlayGroup.add(auraSprite);

            const aura = {
                target: targetObject,
                localCenter,
                baseSize: auraSize,
                sprite: auraSprite
            };
            equipGlowAuraByTarget.set(targetObject, aura);
            return aura;

        function clearEquipVisualGlowPulse() {
            equipGlowCharacterCore.visible = false;

        function clearEquipPropRevealDelay() {

        function clearEquipPropRevealRamp() {
            if (equipPropRevealState.target) {
                equipPropRevealState.target.scale.copy(equipPropRevealState.baseScale);
            }
            equipPropRevealState.active = false;
            equipPropRevealState.timer = 0;
            equipPropRevealState.propKey = null;
            equipPropRevealState.target = null;
        }

        function startEquipPropRevealRamp(propKey) {
            const metadata = propRegistry.get(propKey);
            const target = metadata?.object;
            if (!target || !target.isObject3D) {
                clearEquipPropRevealRamp();
                return;
            }

            clearEquipPropRevealRamp();
            equipPropRevealState.active = true;
            equipPropRevealState.timer = 0;
            equipPropRevealState.propKey = propKey;
            equipPropRevealState.target = target;
            equipPropRevealState.baseScale.copy(target.scale);
            target.scale.copy(equipPropRevealState.baseScale).multiplyScalar(EQUIP_PROP_REVEAL_START_SCALE);
        }

        function updateEquipPropRevealRamp(dt) {
            if (!equipPropRevealState.active) {
                return;
            }
            const target = equipPropRevealState.target;
            if (!target || !target.parent) {
                clearEquipPropRevealRamp();
                return;
            }

            equipPropRevealState.timer += dt;
            const progress = THREE.MathUtils.clamp(
                equipPropRevealState.timer / EQUIP_PROP_REVEAL_RAMP_DURATION_SEC,
                0,
                1
            );
            const easeOut = 1 - Math.pow(1 - progress, 3);
            const overshoot = Math.sin(progress * Math.PI) * 0.035;
            const revealScale = THREE.MathUtils.lerp(EQUIP_PROP_REVEAL_START_SCALE, 1, easeOut) + overshoot;
            target.scale.copy(equipPropRevealState.baseScale).multiplyScalar(revealScale);

            if (progress >= 1) {
                clearEquipPropRevealRamp();
            }
        }

        function queueEquipPropRevealAfterGlow(progress = EQUIP_PROP_REVEAL_AT_PEAK_PROGRESS) {

            equipGlowState.pendingRevealAtProgress = Number.isFinite(normalizedProgress)
                ? THREE.MathUtils.clamp(normalizedProgress, 0, 1)

        function flushEquipPropRevealIfPending() {
            if (!equipGlowState.pendingRevealLoadout) {
                return;

            const revealPropKey = equipGlowState.propKey;

        function startEquipVisualGlowPulse(propKey) {
            const metadata = propRegistry.get(propKey);

            schedulePropWarmForMainRenderer(propKey);
            clearEquipPropRevealDelay();

            const targets = collectEquipGlowTargets(metadata.object);
            equipGlowState.activeAuras = targets
                .map((targetObject) => ensureEquipGlowAuraForTarget(targetObject))
                .filter(Boolean);
            equipGlowState.active = true;
            equipGlowState.timer = 0;
            equipGlowState.propKey = propKey;
            return true;
        }

        function updateEquipVisualGlowPulse(dt, t) {
            if (!equipGlowState.active) {
                return;
            }

            equipGlowState.timer += dt;
            const progress = THREE.MathUtils.clamp(equipGlowState.timer / EQUIP_GLOW_PULSE_DURATION_SEC, 0, 1);
            const envelope = Math.sin(progress * Math.PI);
            const strength = Math.max(0, envelope);

            const coreBaseScale = equipGlowCharacterCore.userData.baseScale || 10.8;
            const wideBaseScale = equipGlowCharacterWide.userData.baseScale || 17.8;
            const characterVisible = strength > 0.006;
            equipGlowCharacterCore.visible = characterVisible;
            equipGlowCharacterWide.visible = characterVisible;
            if (characterVisible) {
                equipGlowCharacterCore.material.opacity = THREE.MathUtils.clamp(0.05 + strength * 0.92, 0, 0.98);
                equipGlowCharacterWide.material.opacity = THREE.MathUtils.clamp(0.04 + strength * 0.56, 0, 0.92);
                equipGlowCharacterCore.scale.setScalar(coreBaseScale * (1 + progress * 0.36 + strength * 0.22));
                equipGlowCharacterWide.scale.setScalar(wideBaseScale * (1 + progress * 0.48 + strength * 0.14));
            }

            if (
                equipGlowState.pendingRevealLoadout &&
                equipGlowState.propKey &&
                !isPropMainRendererWarm(equipGlowState.propKey) &&
                progress >= 0.2
            ) {
                warmPropForMainRenderer(equipGlowState.propKey);
            }

            if (equipGlowState.pendingRevealLoadout && progress >= equipGlowState.pendingRevealAtProgress) {
                flushEquipPropRevealIfPending();
            }

            for (let i = 0; i < equipGlowState.activeAuras.length; i++) {
                const aura = equipGlowState.activeAuras[i];
                const target = aura?.target;
                const sprite = aura?.sprite;
                if (!target || !sprite || !target.parent || !target.visible || strength <= 0.008) {
                    if (sprite) {
                        sprite.visible = false;
                        sprite.material.opacity = 0;
                    }
                    continue;
                }

                target.updateMatrixWorld(true);
                equipGlowScratch.copy(aura.localCenter).applyMatrix4(target.matrixWorld);
                sprite.position.copy(equipGlowScratch);
                sprite.visible = true;
                const flicker = 0.9 + Math.sin(t * 15.2 + i * 0.68) * 0.1;
                sprite.material.opacity = THREE.MathUtils.clamp((0.08 + strength * 0.86) * flicker, 0, 0.98);
                const auraScale = aura.baseSize * (1 + progress * 0.54 + Math.sin(t * 11.6 + i * 0.82) * 0.04);
                sprite.scale.set(auraScale, auraScale, 1);
            }

            if (progress >= 1) {
                clearEquipVisualGlowPulse();
            }
        }

        function toggleProp(propKey) {
            const metadata = propRegistry.get(propKey);
            if (!metadata) return;
            const propCategory = metadata.category;
            const shouldActivate = !activeProps.has(propKey);

                    while (nextForCategory.length >= limit) {
                        const removed = nextForCategory.shift();
                        if (removed && activeProps.has(removed)) {
                            activeProps.delete(removed);
                            removedForInventory.push(removed);
                        }

                    nextForCategory.push(propKey);
                    for (const replaced of removedForInventory) {
                        stashPropInInventory(replaced);
                    }
                    setCategorySelection(propCategory, nextForCategory);
                }
            }
            if (shouldActivate) {
                activeProps.add(propKey);

            if (shouldActivate) {
                const startedGlow = startEquipVisualGlowPulse(propKey);
                if (startedGlow) {

                clearEquipPropRevealRamp();
                applyLoadout();
            }
        }

            const viewportWidth = Math.max(

            const panelWidth = Math.max(1, panelRect.width);

            const desiredInset = isPortraitLikeViewport() ? 10 : 12;
            const holeInsetX = Math.min(desiredInset, Math.max(0, (panelWidth - 20) * 0.5));
            const holeInsetY = Math.min(desiredInset, Math.max(0, (panelHeight - 20) * 0.5));

            const holeLeft = THREE.MathUtils.clamp(panelRect.left + holeInsetX, 0, viewportWidth);
            const holeTop = THREE.MathUtils.clamp(panelRect.top + holeInsetY, 0, viewportHeight);
            const holeRight = THREE.MathUtils.clamp(panelRect.right - holeInsetX, holeLeft, viewportWidth);
            const holeBottom = THREE.MathUtils.clamp(panelRect.bottom - holeInsetY, holeTop, viewportHeight);

        function getInventoryBottomGuardPx(viewportHeight) {
            if (!Number.isFinite(viewportHeight) || viewportHeight <= 0) {
                return 0;

            const baseBottomGapPx = isPortraitLikeViewport() ? 100 : 82;
            const dockClearancePaddingPx = 16;
            const visualViewportInset = window.visualViewport && Number.isFinite(window.visualViewport.height)
                ? Math.max(0, window.innerHeight - window.visualViewport.height)
                : 0;
            let guardPx = Math.max(baseBottomGapPx, visualViewportInset);
            const candidates = new Set();

            INVENTORY_BOTTOM_GUARD_SELECTORS.forEach((selector) => {
                try {
                    document.querySelectorAll(selector).forEach((node) => {
                        if (node) {
                            candidates.add(node);
                        }
                    });
                } catch (_) {}
            });

            candidates.forEach((node) => {
                if (!(node instanceof Element)) {
                    return;
                }
                if (inventoryPanel && node.closest('#inventory-panel')) {
                    return;
                }
                const style = getComputedStyle(node);
                if (!style || style.display === 'none' || style.visibility === 'hidden' || Number(style.opacity) === 0) {
                    return;
                }
                const rect = node.getBoundingClientRect();
                if (!rect || rect.height < 16 || rect.width < 60) {
                    return;
                }
                const isBottomBand = rect.top >= viewportHeight * 0.52 || rect.bottom >= viewportHeight - 1;
                if (!isBottomBand) {
                    return;
                }
                const isDocked = style.position === 'fixed' || style.position === 'sticky' || rect.bottom >= viewportHeight - 1;
                if (!isDocked) {
                    return;
                }
                guardPx = Math.max(guardPx, viewportHeight - rect.top + dockClearancePaddingPx);
            });

            return THREE.MathUtils.clamp(guardPx, 0, viewportHeight * 0.42);
        }

        function updateInventoryPanelAnchor() {

            const viewportWidth = Math.max(

                (visualViewport && Number.isFinite(visualViewport.width) ? visualViewport.width : window.innerWidth) || 1
            );
            const viewportHeight = Math.max(
                1,
                (visualViewport && Number.isFinite(visualViewport.height) ? visualViewport.height : window.innerHeight) || 1
            );
            if (
                inventoryPanelAnchorState.initialized &&
                inventoryPanelAnchorState.viewportWidth === viewportWidth &&
                inventoryPanelAnchorState.viewportHeight === viewportHeight
            ) {
                return;
            }

            if (isPortraitLikeViewport()) {
                const rootStyle = getComputedStyle(document.documentElement);
                const safeAreaLeft = Number.parseFloat(rootStyle.getPropertyValue('--inventory-safe-area-left')) || 0;
                const safeAreaRight = Number.parseFloat(rootStyle.getPropertyValue('--inventory-safe-area-right')) || 0;
                const layoutViewportWidth = Math.max(1, window.innerWidth || Math.round(viewportWidth));
                const snappedPanelWidth = Math.max(1, Math.round(layoutViewportWidth - safeAreaLeft - safeAreaRight));
                const targetX = Number((viewportWidth * 0.5).toFixed(2));
                const targetY = Number((viewportHeight * 0.5).toFixed(2));
                inventoryPanelAnchorState.x = targetX;
                inventoryPanelAnchorState.y = targetY;
                inventoryPanel.style.setProperty('--inventory-anchor-x', `${targetX}px`);
                inventoryPanel.style.setProperty('--inventory-anchor-y', `${targetY}px`);
                inventoryPanel.style.setProperty('--inventory-portrait-panel-width', `${snappedPanelWidth}px`);
                inventoryPanel.style.setProperty('--inventory-panel-top', '0px');
                const bottomGuardPx = getInventoryBottomGuardPx(viewportHeight);
                inventoryPanel.style.setProperty('--inventory-bottom-clearance', `${Math.max(0, Number(bottomGuardPx.toFixed(2)))}px`);
                const bottomSafetyMarginPx = 12;
                inventoryPanel.style.setProperty('--inventory-bottom-safe-lift', '0px');
                let panelRect = inventoryPanel.getBoundingClientRect();
                const safeBottomLimit = viewportHeight - bottomGuardPx - bottomSafetyMarginPx;
                if (Number.isFinite(panelRect.bottom) && panelRect.bottom > safeBottomLimit) {
                    const requiredLiftPx = panelRect.bottom - safeBottomLimit;
                    inventoryPanel.style.setProperty('--inventory-bottom-safe-lift', `${Math.max(0, Number(requiredLiftPx.toFixed(2)))}px`);
                    panelRect = inventoryPanel.getBoundingClientRect();
                }
                const panelTop = Number.isFinite(panelRect.top) ? panelRect.top : 0;
                const baseInsetTop = Number.parseFloat(getComputedStyle(inventoryPanel).getPropertyValue('--inventory-shell-inset-top')) || 0;
                const frameShell = inventoryPanel.querySelector('.inventory-frame-shell');
                const header = inventoryPanel.querySelector('.inventory-header');
                let shellToHeaderOffset = 0;
                if (frameShell && header) {
                    const shellRect = frameShell.getBoundingClientRect();
                    const headerRect = header.getBoundingClientRect();
                    if (
                        Number.isFinite(shellRect.top) &&
                        Number.isFinite(headerRect.top) &&
                        headerRect.top >= shellRect.top - 1
                    ) {
                        shellToHeaderOffset = Math.max(0, headerRect.top - shellRect.top);
                    } else {
                        const shellStyle = getComputedStyle(frameShell);
                        const shellBorderTop = Number.parseFloat(shellStyle.borderTopWidth) || 0;
                        const shellPaddingTop = Number.parseFloat(shellStyle.paddingTop) || 0;
                        shellToHeaderOffset = Math.max(0, shellBorderTop + shellPaddingTop);

                }
                let anchoredInsetTop = baseInsetTop;
                if (scoreBox) {
                    const scoreRect = scoreBox.getBoundingClientRect();
                    if (Number.isFinite(scoreRect.bottom) && Number.isFinite(scoreRect.height) && scoreRect.height > 0) {
                        const desiredGapPx = THREE.MathUtils.clamp(viewportHeight * 0.0125, 8, 14);
                        const iconSeatDropPx = THREE.MathUtils.clamp(viewportHeight * 0.01, 8, 12);
                        const minShellGapPx = THREE.MathUtils.clamp(viewportHeight * 0.003, 2, 4);
                        const desiredHeaderTop = scoreRect.bottom + desiredGapPx + iconSeatDropPx;
                        const desiredInsetTop = desiredHeaderTop - panelTop - shellToHeaderOffset;
                        const minInsetFromShellGap = scoreRect.bottom + minShellGapPx + (iconSeatDropPx * 0.5) - panelTop;
                        anchoredInsetTop = Math.max(desiredInsetTop, minInsetFromShellGap);
                    }
                }
                const minInsetTop = 36;
                const maxInsetTop = Math.max(minInsetTop, viewportHeight * 0.24);
                const clampedInsetTop = THREE.MathUtils.clamp(anchoredInsetTop, minInsetTop, maxInsetTop);
                inventoryPanel.style.setProperty('--inventory-shell-inset-top', `${Number(clampedInsetTop.toFixed(2))}px`);
                inventoryPanelAnchorState.viewportWidth = viewportWidth;
                inventoryPanelAnchorState.viewportHeight = viewportHeight;
                inventoryPanelAnchorState.initialized = true;
                updateInventoryFocusOverlayHole();
                updateInventoryCreatureFitGuard({ force: true });
                return;
            }

            inventoryPanel.style.removeProperty('--inventory-portrait-panel-width');
            inventoryPanel.style.removeProperty('--inventory-shell-inset-top');
            creatureGroup.getWorldPosition(inventoryAnchorWorld);
            inventoryAnchorWorld.y += 0.22;
            inventoryAnchorNdc.copy(inventoryAnchorWorld).project(camera);

            let targetXRaw = viewportWidth * 0.5;
            let targetYRaw = viewportHeight * 0.51;
            if (
                Number.isFinite(inventoryAnchorNdc.x) &&
                Number.isFinite(inventoryAnchorNdc.y) &&
                Number.isFinite(inventoryAnchorNdc.z) &&
                inventoryAnchorNdc.z >= -1 &&
                inventoryAnchorNdc.z <= 1
            ) {
                targetXRaw = (inventoryAnchorNdc.x * 0.5 + 0.5) * viewportWidth;
                targetYRaw = ((-inventoryAnchorNdc.y) * 0.5 + 0.5) * viewportHeight;
            }
            const panelRect = inventoryPanel.getBoundingClientRect();
            const fallbackPanelWidth = Math.min(432, viewportWidth * 0.93);
            const fallbackPanelHeight = Math.min(760, viewportHeight * 0.86);
            const panelWidth = Number.isFinite(panelRect.width) && panelRect.width > 0
                ? panelRect.width
                : fallbackPanelWidth;
            let panelHeight = Number.isFinite(panelRect.height) && panelRect.height > 0
                ? panelRect.height
                : fallbackPanelHeight;
            const bottomGuardPx = getInventoryBottomGuardPx(viewportHeight);
            const maxPanelHeight = Math.max(300, viewportHeight - bottomGuardPx - 20);
            panelHeight = Math.min(panelHeight, maxPanelHeight);
            inventoryPanel.style.setProperty('--inventory-bottom-clearance', `${Math.max(0, Number(bottomGuardPx.toFixed(2)))}px`);

            targetYRaw = targetYRaw - Math.min(16, panelHeight * 0.024);
            const marginX = panelWidth * 0.5 + 8;
            const marginY = panelHeight * 0.5 + 8;
            const maxAnchorY = Math.max(marginY, viewportHeight - marginY - bottomGuardPx);
            const targetX = THREE.MathUtils.clamp(targetXRaw, marginX, viewportWidth - marginX);
            const targetY = THREE.MathUtils.clamp(targetYRaw, marginY, maxAnchorY);
            const panelTop = targetY - panelHeight * 0.5;
            inventoryPanelAnchorState.x = Number(targetX.toFixed(2));
            inventoryPanelAnchorState.y = Number(targetY.toFixed(2));
            inventoryPanel.style.setProperty('--inventory-anchor-x', `${inventoryPanelAnchorState.x}px`);
            inventoryPanel.style.setProperty('--inventory-anchor-y', `${inventoryPanelAnchorState.y}px`);
            inventoryPanel.style.setProperty('--inventory-panel-top', `${Math.max(0, Number(panelTop.toFixed(2)))}px`);
            inventoryPanelAnchorState.viewportWidth = viewportWidth;
            inventoryPanelAnchorState.viewportHeight = viewportHeight;
            inventoryPanelAnchorState.initialized = true;
            updateInventoryFocusOverlayHole();
            updateInventoryCreatureFitGuard({ force: true });
        }

        function scheduleInventoryRender() {
            if (!isInventoryPanelOpen()) {
                inventoryRenderDirty = true;
                return;
            }
            if (inventoryRenderQueued) {
                return;
            }
            inventoryRenderQueued = true;
            window.requestAnimationFrame(() => {
                inventoryRenderQueued = false;
                renderInventoryList();
            });
        }

        function stashPropInInventory(propKey, options = {}) {
            if (!propRegistry.has(propKey)) {
                return { added: false, dropped: [] };
            }
            const category = getPropCategory(propKey);
            if (!category) {
                return { added: false, dropped: [] };
            }
            const hasExisting = playerInventory.has(propKey);
            if (hasExisting) {
                return { added: false, dropped: [] };
            }
            playerInventory.add(propKey);
            const dropped = hasExisting ? [] : [
                ...enforceInventoryCategoryLimit(category),
                ...enforceInventoryCategoryLimits()
            ];
            if (options.deferRender) {
                scheduleInventoryRender();
            } else {
                renderInventoryList();
            }
            return {
                added: true,
                dropped
            };
        }

        function equipPropNow(propKey) {
            const metadata = propRegistry.get(propKey);
            if (!metadata) {
                return false;
            }
            const wasAlreadyEquipped = activeProps.has(propKey);
            const propCategory = metadata.category;
            if (singleEquipCategories.has(propCategory)) {
                const currentForCategory = getCategorySelection(propCategory).filter((entry) => entry !== propKey);
                const limit = getCategoryLimit(propCategory);
                const removedForInventory = [];

                while (currentForCategory.length >= limit) {
                    const removed = currentForCategory.shift();
                    if (removed && activeProps.has(removed)) {
                        activeProps.delete(removed);
                        removedForInventory.push(removed);
                    }
                }
                for (const removed of removedForInventory) {
                    stashPropInInventory(removed);
                }
                currentForCategory.push(propKey);
                setCategorySelection(propCategory, currentForCategory);
            }
            activeProps.add(propKey);
            updatePropButtonStates();
            if (!wasAlreadyEquipped) {
                const sourceObject = getItemByPropKey(propKey);
                const equippedReadyPromise = getPropEquippedReadyPromise(sourceObject);
                if (equippedReadyPromise) {
                    void equippedReadyPromise.catch(() => null);
                }
                playMysteryEquipPropSfx();
                const startedGlow = startEquipVisualGlowPulse(propKey);
                if (startedGlow) {
                    queueEquipPropRevealAfterGlow();
                } else {
                    clearEquipPropRevealRamp();
                    applyLoadout();
                }
            } else {
                clearEquipPropRevealDelay();
                clearEquipPropRevealRamp();
                applyLoadout();
            }
            return true;
        }

        function unequipPropNow(propKey) {
            const metadata = propRegistry.get(propKey);
            if (!metadata) {
                return false;
            }
            if (!activeProps.has(propKey)) {
                return false;
            }

            const propCategory = metadata.category;
            activeProps.delete(propKey);
            const currentForCategory = getCategorySelection(propCategory).filter((entry) => entry !== propKey);
            setCategorySelection(propCategory, currentForCategory);

            clearEquipPropRevealDelay();
            clearEquipPropRevealRamp();
            applyLoadout();
            updatePropButtonStates();
            return true;
        }

        function updateInventoryButtonStates() {
            if (!inventoryList) {
                return;
            }
            const cards = inventoryList.querySelectorAll('.inventory-item');
            cards.forEach((card) => {
                const propKey = card?.dataset?.prop;
                const isEquipped = !!propKey && activeProps.has(propKey);
                const itemLabel = getPropLabelByKey(propKey);
                card.classList.toggle('active', isEquipped);
                card.setAttribute('aria-pressed', String(isEquipped));
                card.setAttribute('aria-label', isEquipped ? `${itemLabel}. Tap to unequip` : `${itemLabel}. Tap to equip`);
                card.title = isEquipped ? `${itemLabel} (Equipped)` : itemLabel;
            });
        }

        function getThumbFallbackText(propKey) {
            const label = getPropLabelByKey(propKey) || propKey;
            const trimmed = label?.trim();
            if (!trimmed) {
                return '?';
            }
            return trimmed.charAt(0).toUpperCase();
        }

        function setItemThumbFallback(thumbElement, propKey) {
            if (!thumbElement) {
                return;
            }
            thumbElement.textContent = '';
            const fallback = document.createElement('span');
            fallback.className = 'item-btn-thumb-fallback';
            fallback.textContent = getThumbFallbackText(propKey);
            thumbElement.appendChild(fallback);
        }

        function applyItemThumbImage(thumbElement, src) {
            if (!thumbElement || !src) {
                return null;
            }
            const image = document.createElement('img');
            image.alt = '';
            image.loading = 'lazy';
            image.decoding = 'async';
            image.src = src;
            thumbElement.textContent = '';
            thumbElement.appendChild(image);
            return image;
        }

        function attachItemThumbImage(thumbElement, propKey) {
            setItemThumbFallback(thumbElement, propKey);

            const loadDynamicThumb = () => {
                const cachedPromise = getItemThumbDataUrl(propKey);
                if (!cachedPromise) {
                    return Promise.resolve(false);
                }
                return cachedPromise.then((dataUrl) => {
                    if (!dataUrl) {
                        return false;
                    }
                    applyItemThumbImage(thumbElement, dataUrl);
                    return true;
                }).catch(() => false);
            };

            const staticThumbPath = ITEM_THUMB_IMAGE_BY_PROP[propKey];
            if (staticThumbPath) {
                return new Promise((resolve) => {
                    const staticImage = applyItemThumbImage(thumbElement, staticThumbPath);
                    if (!staticImage) {
                        loadDynamicThumb().then(resolve);
                        return;
                    }
                    staticImage.addEventListener('load', () => resolve(true), { once: true });
                    staticImage.addEventListener('error', () => {
                        setItemThumbFallback(thumbElement, propKey);
                        loadDynamicThumb().then(resolve);
                    }, { once: true });
                });
            }

            return loadDynamicThumb();
        }

        function getPropPreviewReadyPromise(source) {
            const ensurePreviewReady = (target) => {
                if (!target?.userData) {
                    return null;
                }
                const ownPromise = target.userData.previewReadyPromise;
                if (ownPromise && typeof ownPromise.then === 'function') {
                    return ownPromise;
                }
                const ensure = target.userData.ensurePreviewReady;
                if (typeof ensure !== 'function') {
                    return null;
                }
                const nextPromise = ensure();
                if (nextPromise && typeof nextPromise.then === 'function') {
                    target.userData.previewReadyPromise = nextPromise;
                    return nextPromise;
                }
                return null;
            };

            const ownPromise = ensurePreviewReady(source);
            if (ownPromise && typeof ownPromise.then === 'function') {
                return ownPromise;
            }

            const detachedPromises = [source?.userData?.left, source?.userData?.right]
                .map((part) => ensurePreviewReady(part))
                .filter((promise) => promise && typeof promise.then === 'function');

            if (!detachedPromises.length) {
                return null;
            }

            return Promise.allSettled(detachedPromises);
        }

        function getPropEquippedReadyPromise(source) {
            const ensureEquippedReady = (target) => {
                if (!target?.userData) {
                    return null;
                }
                const ownPromise = target.userData.equippedReadyPromise;
                if (ownPromise && typeof ownPromise.then === 'function') {
                    return ownPromise;
                }
                const ensure = target.userData.ensureEquippedReady;
                if (typeof ensure !== 'function') {
                    return null;
                }
                const nextPromise = ensure();
                if (nextPromise && typeof nextPromise.then === 'function') {
                    target.userData.equippedReadyPromise = nextPromise;
                    return nextPromise;
                }
                return null;
            };

            const ownPromise = ensureEquippedReady(source);
            if (ownPromise && typeof ownPromise.then === 'function') {
                return ownPromise;
            }

            const detachedPromises = [source?.userData?.left, source?.userData?.right]
                .map((part) => ensureEquippedReady(part))
                .filter((promise) => promise && typeof promise.then === 'function');

            if (!detachedPromises.length) {
                return getPropPreviewReadyPromise(source);
            }

            return Promise.allSettled(detachedPromises);
        }

        function waitForPreviewRenderTick() {
            return new Promise((resolve) => {
                if (typeof window !== 'undefined' && typeof window.requestAnimationFrame === 'function') {
                    window.requestAnimationFrame(() => resolve());
                    return;
                }
                setTimeout(resolve, 16);
            });
        }

        function resolvePreviewPlacement(mode, safeSize, fitCategory = null, fitPropKey = null) {
            const fit = computePreviewAutoFit(mode, safeSize, fitCategory);
            const isCharacterMode = mode === 'character';
            let adjustedScale = fit.scale;
            let adjustedDistance = fit.distance;
            let yOffsetRatio = 0;
            let zOffsetRatio = 0;

            if (!isCharacterMode) {
                const normalizedPropKey = typeof fitPropKey === 'string' ? fitPropKey.trim() : '';
                const override = normalizedPropKey ? PREVIEW_ITEM_FIT_OVERRIDES[normalizedPropKey] : null;
                const lowerPropKey = normalizedPropKey.toLowerCase();
                const isWingLike = lowerPropKey.includes('wing');
                if (override && Number.isFinite(override.distanceMultiplier) && override.distanceMultiplier > 0) {
                    adjustedDistance *= override.distanceMultiplier;
                } else if (fitCategory === 'wingSet' && isWingLike) {
                    adjustedDistance *= 1.14;
                }
                if (override) {
                    yOffsetRatio = Number.isFinite(override.yOffsetRatio) ? override.yOffsetRatio : 0;
                    zOffsetRatio = Number.isFinite(override.zOffsetRatio) ? override.zOffsetRatio : 0;
                }
            }

            if (!Number.isFinite(adjustedScale) || adjustedScale <= 0) {
                adjustedScale = fit.scale;
            }
            if (!Number.isFinite(adjustedDistance) || adjustedDistance <= 0) {
                adjustedDistance = fit.distance;
            }

            return {
                scale: adjustedScale,
                distance: adjustedDistance,
                yOffsetRatio,
                zOffsetRatio
            };
        }

        function resolveItemThumbPlacement(safeSize, fitCategory = null, fitPropKey = null) {
            const basePlacement = resolvePreviewPlacement('item', safeSize, fitCategory, fitPropKey);
            const normalizedPropKey = typeof fitPropKey === 'string' ? fitPropKey.trim() : '';
            const override = normalizedPropKey ? ITEM_THUMB_FIT_OVERRIDES[normalizedPropKey] : null;
            if (!override) {
                return basePlacement;
            }

            let distance = basePlacement.distance;
            if (Number.isFinite(override.distanceMultiplier) && override.distanceMultiplier > 0) {
                distance *= override.distanceMultiplier;
            }

            return {
                scale: basePlacement.scale,
                distance,
                yOffsetRatio: Number.isFinite(override.yOffsetRatio) ? override.yOffsetRatio : basePlacement.yOffsetRatio,
                zOffsetRatio: Number.isFinite(override.zOffsetRatio) ? override.zOffsetRatio : basePlacement.zOffsetRatio
            };
        }

        function ensureItemThumbRenderContext() {
            if (itemThumbRenderState.renderer && itemThumbRenderState.scene && itemThumbRenderState.camera) {
                return itemThumbRenderState;
            }

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            const camera = new THREE.PerspectiveCamera(34, 1, 0.01, 120);
            const renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: true,
                preserveDrawingBuffer: true,
                powerPreference: 'high-performance'
            });
            renderer.setPixelRatio(1);
            renderer.setSize(ITEM_THUMB_SIZE, ITEM_THUMB_SIZE, false);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.setClearColor(0x0f172a, 1);

            const ambient = new THREE.AmbientLight(0xbecbea, 1);
            const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
            const fillLight = new THREE.DirectionalLight(0x9fc8ff, 0.6);
            const rimLight = new THREE.DirectionalLight(0x9ad9ff, 0.45);
            keyLight.position.set(1.6, 1.8, 2.2);
            fillLight.position.set(-1.1, -0.8, 1.3);
            rimLight.position.set(0, 1.0, -1.8);
            scene.add(ambient, keyLight, fillLight, rimLight);

            itemThumbRenderState.renderer = renderer;
            itemThumbRenderState.scene = scene;
            itemThumbRenderState.camera = camera;
            return itemThumbRenderState;
        }

        async function renderItemThumbImageUrl(propKey) {
            if (!propKey) {
                return null;
            }
            if (itemThumbCache.has(propKey)) {
                return itemThumbCache.get(propKey);
            }
            if (itemThumbInFlight.has(propKey)) {
                return itemThumbInFlight.get(propKey);
            }

            const prepareThumbObject = async () => {
                try {
                    const metadata = propRegistry.get(propKey);
                    if (!metadata) {
                        return null;
                    }

                    const source = metadata.object;
                    const fitCategory = metadata.category || null;
                    const previewReadyPromise = getPropPreviewReadyPromise(source);
                    if (previewReadyPromise) {
                        await previewReadyPromise;
                    }
                    let build = buildPreviewObject(source);
                    let object = build?.object;
                    if ((!object || !hasFiniteRenderableGeometry(object)) && previewReadyPromise) {
                        await waitForPreviewRenderTick();
                        build = buildPreviewObject(source);
                        object = build?.object;
                    }
                    if (!object || !hasFiniteRenderableGeometry(object)) {
                        return null;
                    }

                    return {
                        fitCategory,
                        object
                    };
                } catch (error) {
                    console.warn(`Unable to prepare thumbnail for ${propKey}`, error);
                    return null;
                }
            };

            const renderTask = async () => {
                try {
                    const prepared = await prepareThumbObject();
                    if (!prepared?.object) {
                        return null;
                    }
                    const { fitCategory, object } = prepared;

                    const size = ITEM_THUMB_SIZE;
                    const renderContext = ensureItemThumbRenderContext();
                    const thumbScene = renderContext.scene;
                    const thumbCamera = renderContext.camera;
                    const thumbRenderer = renderContext.renderer;
                    thumbRenderer.setSize(size, size, false);

                    sanitizePreviewInvalidGeometry(object);
                    object.frustumCulled = false;
                    object.position.set(0, 0, 0);
                    object.rotation.set(0, 0, 0);
                    object.scale.set(1, 1, 1);
                    object.updateMatrixWorld(true);

                    try {
                        const worldBox = computePreviewObjectBounds(object, 'item', fitCategory);
                        const center = worldBox?.getCenter(new THREE.Vector3());
                        const rawSize = worldBox?.getSize(new THREE.Vector3());
                        if (center && rawSize && !worldBox.isEmpty()) {
                            const safeSize = getFiniteSizeVector(rawSize, 1.2);
                            const safeCenter = new THREE.Vector3(
                                sanitizeFiniteNumber(center.x, 0),
                                sanitizeFiniteNumber(center.y, 0),
                                sanitizeFiniteNumber(center.z, 0)
                            );
                            const placement = resolveItemThumbPlacement(safeSize, fitCategory, propKey);
                            object.position.sub(safeCenter);
                            if (placement.yOffsetRatio !== 0 || placement.zOffsetRatio !== 0) {
                                const scaledHeight = safeSize.y * placement.scale;
                                const scaledDepth = safeSize.z * placement.scale;
                                object.position.y += scaledHeight * placement.yOffsetRatio;
                                object.position.z += scaledDepth * placement.zOffsetRatio;
                            }
                            object.scale.setScalar(placement.scale);
                            thumbCamera.position.set(
                                0,
                                0,
                                Math.max(1.05, placement.distance)
                            );
                            thumbCamera.near = Math.max(0.01, Math.min(0.06, thumbCamera.position.z * 0.03));
                            thumbCamera.far = Math.max(14, thumbCamera.position.z * 18);
                            thumbCamera.lookAt(0, 0, 0);
                            thumbCamera.updateProjectionMatrix();
                        } else {
                            object.position.set(0, -0.2, 0);
                            object.scale.setScalar(0.55);
                            thumbCamera.position.set(0, 0.2, 1.2);
                            thumbCamera.near = 0.05;
                            thumbCamera.far = 10;
                            thumbCamera.lookAt(0, 0, 0);
                            thumbCamera.updateProjectionMatrix();
                        }
                    } catch (error) {
                        object.position.set(0, -0.2, 0);
                        object.scale.setScalar(0.55);
                        thumbCamera.position.set(0, 0.2, 1.2);
                        thumbCamera.near = 0.05;
                        thumbCamera.far = 10;
                        thumbCamera.lookAt(0, 0, 0);
                        thumbCamera.updateProjectionMatrix();
                    }

                    thumbScene.add(object);
                    thumbRenderer.render(thumbScene, thumbCamera);
                    const url = thumbRenderer.domElement.toDataURL('image/png');

                    thumbScene.remove(object);
                    const detachedNodes = [];
                    object.traverse((node) => {
                        if (node?.isObject3D && node !== object && node.parent) {
                            detachedNodes.push(node);
                        }
                    });
                    for (let i = detachedNodes.length - 1; i >= 0; i -= 1) {
                        const node = detachedNodes[i];
                        if (!node?.parent) {
                            continue;
                        }
                        if (typeof node.removeFromParent === 'function') {
                            node.removeFromParent();
                        } else {
                            node.parent.remove(node);
                        }
                    }

                    return url || null;
                } catch (error) {
                    console.warn(`Unable to generate thumbnail for ${propKey}`, error);
                    return null;
                }
            };
            const task = itemThumbRenderQueue
                .then(() => renderTask())
                .finally(() => {
                    itemThumbInFlight.delete(propKey);
                });
            itemThumbRenderQueue = task.catch(() => null);

            itemThumbInFlight.set(propKey, task);
            task.then((url) => {
                if (url) {
                    itemThumbCache.set(propKey, url);
                } else {
                    itemThumbCache.delete(propKey);
                }
                return url;
            });
            return task;
        }

        function getItemThumbDataUrl(propKey) {
            if (!propKey) {
                return null;
            }
            if (itemThumbCache.has(propKey)) {
                return Promise.resolve(itemThumbCache.get(propKey) || null);
            }
            return renderItemThumbImageUrl(propKey);
        }

        function ensureStoreButtonThumb(button) {
            const propKey = button?.dataset?.prop;
            if (!propKey || button.dataset.action === 'clearAll') {
                return null;
            }
            if (button.dataset.thumbState === 'ready' || button.dataset.thumbState === 'loading') {
                return button.querySelector('.item-btn-thumb');
            }
            let thumb = button.querySelector('.item-btn-thumb');
            if (!thumb) {
                thumb = document.createElement('span');
                thumb.className = 'item-btn-thumb';
                thumb.setAttribute('aria-hidden', 'true');
                button.prepend(thumb);
            }
            button.dataset.thumbState = 'loading';
            attachItemThumbImage(thumb, propKey)
                .then((loaded) => {
                    if (loaded && thumb.querySelector('img')) {
                        button.dataset.thumbState = 'ready';
                        return;
                    }
                    delete button.dataset.thumbState;
                    window.setTimeout(() => {
                        if (!button.isConnected || button.dataset.thumbState === 'ready' || button.dataset.thumbState === 'loading') {
                            return;
                        }
                        ensureStoreButtonThumb(button);
                    }, 320);
                })
                .catch(() => {
                    delete button.dataset.thumbState;
                });
            return thumb;
        }

        function warmupStoreCategoryThumbs(categoryKey) {
            const targetCategory = isInventoryCategory(categoryKey) ? categoryKey : activeCategory;
            const buttons = itemButtons.filter((btn) => btn.dataset.prop && btn.dataset.category === targetCategory);
            if (!buttons.length) {
                return;
            }
            const token = ++storeThumbHydrateToken;
            const batchSize = 1;
            let index = 0;
            const isPreviewBusy = () => previewState.open || propPreviewPanel?.classList?.contains('open');

            const processBatch = () => {
                if (token !== storeThumbHydrateToken) {
                    return;
                }
                if (isPreviewBusy()) {
                    setTimeout(processBatch, 280);
                    return;
                }
                const next = Math.min(index + batchSize, buttons.length);
                for (; index < next; index++) {
                    ensureStoreButtonThumb(buttons[index]);
                }
                if (index < buttons.length) {
                    if (window.requestIdleCallback) {
                        window.requestIdleCallback(processBatch, { timeout: 900 });
                    } else {
                        setTimeout(processBatch, 180);
                    }
                }
            };

            if (window.requestIdleCallback) {
                window.requestIdleCallback(processBatch, { timeout: 640 });
            } else {
                setTimeout(processBatch, 140);
            }
        }

        function warmupStoreCategoryPreviews(categoryKey) {
            const targetCategory = isInventoryCategory(categoryKey) ? categoryKey : activeCategory;
            const buttons = itemButtons.filter((btn) => btn.dataset.prop && btn.dataset.category === targetCategory);
            if (!buttons.length) {
                return;
            }
            buttons
                .slice(0, 3)
                .forEach((button, index) => {
                    const delayMs = index === 0 ? 0 : 1400 + ((index - 1) * 1800);
                    window.setTimeout(() => {
                        if (previewState.open || propPreviewPanel?.classList?.contains('open')) {
                            window.setTimeout(() => warmPreviewAssetsForPropKey(button?.dataset?.prop), 360);
                            return;
                        }
                        warmPreviewAssetsForPropKey(button?.dataset?.prop);
                    }, delayMs);
                });
        }

        function createInventoryItemThumb(propKey) {
            const thumb = document.createElement('span');
            thumb.className = 'inventory-item-thumb';
            thumb.setAttribute('aria-hidden', 'true');
            attachItemThumbImage(thumb, propKey);

                return;

            inventoryRenderDirty = false;
            enforceInventoryCategoryLimits();
            inventoryCategoryButtons.forEach((btn) => {
                const category = btn.dataset.category;
                if (!isInventoryCategory(category)) {
                    return;
                }
                btn.textContent = getInventoryDisplayNameWithCount(category);
            });

            const currentInventoryCategory = isInventoryCategory(activeInventoryCategory)
                ? activeInventoryCategory
                : INVENTORY_CONFIG.defaultCategory;

            inventoryList.textContent = '';
            const stashedKeys = Array.from(playerInventory)
                .filter((propKey) => propRegistry.has(propKey))
                .filter((propKey) => getPropCategory(propKey) === currentInventoryCategory)
                .sort(comparePropCatalogOrder);

            inventoryEmpty.style.display = 'none';
            const totalSlots = Math.max(4, stashedKeys.length);
            const fragment = document.createDocumentFragment();
            for (let i = 0; i < totalSlots; i++) {
                const slotCell = document.createElement('div');
                slotCell.className = 'inventory-slot-cell';
                slotCell.setAttribute('role', 'listitem');
                const propKey = stashedKeys[i];
                if (propKey) {
                    const tile = document.createElement('button');
                    tile.type = 'button';
                    tile.className = 'inventory-item';
                    tile.dataset.prop = propKey;
                    tile.setAttribute('aria-pressed', 'false');

                    const labelText = getPropLabelByKey(propKey);
                    const thumb = createInventoryItemThumb(propKey);
                    const label = document.createElement('span');
                    label.className = 'inventory-item-label';
                    label.textContent = labelText;

                    tile.append(thumb, label);
                    slotCell.appendChild(tile);
                } else {
                    const emptySlot = document.createElement('span');
                    emptySlot.className = 'inventory-slot-empty';
                    emptySlot.setAttribute('aria-hidden', 'true');
                    slotCell.appendChild(emptySlot);

                fragment.appendChild(slotCell);

            inventoryList.appendChild(fragment);
            // Re-hydrate after insertion so inventory slot thumbnails render even when
            // an image load resolves before the slot enters the live DOM tree.
            const connectedItems = inventoryList.querySelectorAll('.inventory-item[data-prop]');
            connectedItems.forEach((tile) => {

                const thumb = tile.querySelector('.inventory-item-thumb');

                    return;
                }
                attachItemThumbImage(thumb, propKey);
            });

                cameraLiftScale: 0,
                lookYOffset: 0
            };

            if (categoryKey === 'wingSet') {
                return {
                    ...itemBase,
                    framePadding: 0.6,
                    preferredDistance: 3.45,
                    baseScale: 1.8,
                    maxScale: 2.35,
                    depthDistanceScale: 0.9,
                    depthReferenceWeight: 0.86
                };
            }
            return itemBase;
        }

        function computePreviewCameraDistanceForScale(mode, safeSize, scale, categoryKey = null) {
            const cfg = getPreviewFitConfig(mode, categoryKey);
            const aspect = Math.max(0.35, previewCamera.aspect || 1);
            const halfFov = Math.max(0.01, THREE.MathUtils.degToRad(previewCamera.fov || 34) / 2);
            const halfTan = Math.max(0.002, Math.tan(halfFov));
            const pad = Math.max(0.2, Math.min(0.98, cfg.framePadding));

            const reqHeight = (safeSize.y * scale) / (2 * halfTan * pad);
            const reqWidth = (safeSize.x * scale) / (2 * halfTan * aspect * pad);
            const reqDepth = safeSize.z * scale * (cfg.depthDistanceScale ?? 0.85);
            return Math.max(cfg.minDistance, reqHeight, reqWidth, reqDepth);
        }

        function computePreviewAutoFit(mode, size, categoryKey = null) {
            const cfg = getPreviewFitConfig(mode, categoryKey);
            const safeSize = getFiniteSizeVector(size, 1);
            const aspect = Math.max(0.35, previewCamera.aspect || 1);
            const halfFov = Math.max(0.01, THREE.MathUtils.degToRad(previewCamera.fov || 34) / 2);
            const halfTan = Math.max(0.002, Math.tan(halfFov));
            const pad = Math.max(0.2, Math.min(0.98, cfg.framePadding));

            const preferredDistance = Math.max(cfg.minDistance, cfg.preferredDistance || cfg.minDistance);
            const fitHeightAtPreferred = 2 * preferredDistance * halfTan * pad;
            const fitWidthAtPreferred = fitHeightAtPreferred * aspect;
            const fitScaleFromFrustum = Math.min(
                fitWidthAtPreferred / Math.max(0.001, safeSize.x),
                fitHeightAtPreferred / Math.max(0.001, safeSize.y)
            );

            const referenceDimension = Math.max(
                safeSize.x,
                safeSize.y,
                safeSize.z * (cfg.depthReferenceWeight ?? 0.72)
            );
            const fitScaleFromReference = cfg.baseScale / Math.max(0.001, referenceDimension);
            let scale = Math.min(fitScaleFromFrustum, fitScaleFromReference);
            if (!Number.isFinite(scale) || scale <= 0) {
                scale = 1;
            }
            scale = THREE.MathUtils.clamp(scale, cfg.minScale, cfg.maxScale);

            const distance = Math.max(
                preferredDistance * 0.9,
                computePreviewCameraDistanceForScale(mode, safeSize, scale, categoryKey)
            );

            return {
                scale,
                distance,
                size: safeSize
            };
        }

        function updatePreviewStageForObject(mode, size, scale = 1) {
            if (!PREVIEW_STAGE_ENABLED || !previewStageShadow || !previewStageRing) {
                return;
            }
            const safeSize = getFiniteSizeVector(size, 1);
            const safeScale = Number.isFinite(scale) && scale > 0 ? scale : 1;
            const isCharacterMode = mode === 'character';
            const footprint = Math.max(safeSize.x, safeSize.z) * safeScale;
            const stageRadius = THREE.MathUtils.clamp(footprint * (isCharacterMode ? 0.72 : 0.66), 0.56, 2.32);
