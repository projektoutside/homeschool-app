<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#5e9f33">
    <title>Aetheria: The Pet (Sunny Garden)</title>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preload" as="script" href="https://unpkg.com/three@0.160.0/build/three.module.js" crossorigin>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap');

        :root {
            --app-font-sans: 'Nunito', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --app-font-display: 'Fredoka', 'Nunito', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --app-text-main: #e2e8f0;
            --app-text-muted: rgba(226, 232, 240, 0.82);
            --app-surface: rgba(30, 41, 59, 0.84);
            --app-surface-solid: linear-gradient(180deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.88));
            --app-border: rgba(255, 255, 255, 0.18);
            --app-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
            --app-elevated-shadow: 0 10px 24px rgba(0, 0, 0, 0.36);
            --app-accent: #8b5cf6;
            --app-secondary: #6366f1;
            --app-success: #22d3ee;
            --app-btn-radius: 16px;
            --app-btn-font-weight: 700;
            --app-focus-ring: 0 0 0 2px rgba(99, 102, 241, 0.45), 0 0 0 4px rgba(125, 250, 255, 0.22);
            --app-btn-lift: -2px;
            --app-panel-radius: 16px;
            --inventory-safe-area-top: env(safe-area-inset-top, 0px);
            --inventory-safe-area-left: env(safe-area-inset-left, 0px);
            --inventory-safe-area-right: env(safe-area-inset-right, 0px);
            --inventory-safe-area-bottom: env(safe-area-inset-bottom, 0px);

            --bg-dark: transparent;
            --hud-bg: var(--app-surface);
            --hud-panel-bg: var(--app-surface-solid);
            --hud-border: var(--app-border);
            --hud-text: var(--app-text-main);
            --hud-font: var(--app-font-sans);
            --btn-font: var(--app-font-display);
            --btn-bg: linear-gradient(180deg, rgba(30, 41, 59, 0.72), rgba(15, 23, 42, 0.82));
            --btn-hover: linear-gradient(180deg, rgba(99, 102, 241, 0.96), rgba(79, 70, 229, 0.94));
            --btn-border: rgba(203, 213, 225, 0.35);
            --accent: var(--app-accent);
            --panel-shadow: var(--app-shadow);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-dark);
            font-family: var(--hud-font);
        }

        canvas {
            background: transparent !important;
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: transparent;
        }

        #gif-background,
        #gif-background-fallback {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            z-index: 0;
        }

        #gif-background {
            filter: saturate(1.1) contrast(1.06) brightness(0.92);
            opacity: 1;
            transition: opacity 220ms ease;
        }

        #gif-background-fallback {
            opacity: 0;
            transition: opacity 220ms ease;
            filter: saturate(1.1) contrast(1.06) brightness(0.92);
        }

        body.bg-use-fallback #gif-background {
            opacity: 0;
        }

        body.bg-use-fallback #gif-background-fallback {
            opacity: 1;
        }

        #gif-tint {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background:
                radial-gradient(120% 78% at 50% 62%, rgba(126, 225, 255, 0.08) 0%, rgba(0, 0, 0, 0) 58%),
                linear-gradient(180deg, rgba(2, 21, 42, 0.06) 0%, rgba(8, 19, 16, 0.03) 40%, rgba(5, 24, 15, 0.1) 100%);
        }

        #startup-fade-overlay {
            position: fixed;
            inset: 0;
            z-index: 120;
            pointer-events: none;
            background: #000;
            opacity: 1;
            visibility: visible;
            transition: opacity 780ms ease-out, visibility 0s linear 780ms;
            will-change: opacity;
        }

        #startup-fade-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 60;
            box-sizing: border-box;
            max-width: 100vw;
            padding: calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 14px calc(14px + env(safe-area-inset-left));
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
            pointer-events: none;
        }

        #mystery-hanging-sign-layer {
            position: fixed;
            inset: 0;
            z-index: 38;
            pointer-events: none;
            overflow: hidden;
            --mystery-rope-width: clamp(1.18px, calc(0.21vw / 1.5), 2.2px);
            --mystery-sign-width: clamp(182px, calc(31vw / 1.5), 300px);
            --mystery-sign-height: clamp(144px, calc(25.5vw / 1.5), 242px);
            --mystery-knot-width: clamp(11px, calc(2.05vw / 1.5), 18px);
            --mystery-knot-height: clamp(9px, calc(1.72vw / 1.5), 15px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 320ms ease-out;
        }

        #mystery-hanging-sign-layer.is-ready {
            opacity: 1;
            visibility: visible;
        }

        @media (prefers-reduced-motion: reduce) {
            #startup-fade-overlay {
                transition: opacity 120ms linear, visibility 0s linear 120ms;
            }

            #mystery-hanging-sign-layer {
                transition: none;
            }
        }

        #mystery-hanging-sign-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
        }

        #mystery-hanging-sign-string {
            fill: none;
            stroke: #dfcda4;
            stroke-width: var(--mystery-rope-width);
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.96;
            filter:
                drop-shadow(0 0 1px rgba(0, 0, 0, 0.85))
                drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5))
                drop-shadow(0 5px 9px rgba(0, 0, 0, 0.24));
        }

        #mystery-hanging-sign-anchor {
            fill: #d8c79b;
            stroke: rgba(70, 44, 16, 0.72);
            stroke-width: 1.2px;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.38));
        }

        #mystery-sign-knot {
            position: absolute;
            left: 0;
            top: 0;
            width: var(--mystery-knot-width);
            height: var(--mystery-knot-height);
            transform-origin: 50% 14%;
            pointer-events: none;
            will-change: transform, left, top;
            z-index: 1;
            filter:
                drop-shadow(0 1px 0 rgba(0, 0, 0, 0.44))
                drop-shadow(0 3px 4px rgba(0, 0, 0, 0.28));
        }

        #mystery-sign-knot::before,
        #mystery-sign-knot::after {
            content: "";
            position: absolute;
            top: 31%;
            width: 61%;
            height: 63%;
            border: clamp(1.2px, 0.15vw, 2px) solid rgba(196, 166, 122, 0.96);
            border-top-color: rgba(240, 226, 193, 0.97);
            border-right-color: rgba(176, 136, 90, 0.95);
            border-radius: 999px;
            background:
                radial-gradient(130% 110% at 36% 28%, rgba(255, 242, 209, 0.84) 0%, rgba(255, 242, 209, 0) 64%),
                linear-gradient(160deg, rgba(232, 207, 162, 0.96) 0%, rgba(193, 158, 113, 0.96) 100%);
            box-shadow:
                inset 0 1px 1px rgba(255, 246, 222, 0.7),
                inset 0 -2px 3px rgba(123, 86, 48, 0.3);
        }

        #mystery-sign-knot::before {
            left: -8%;
            transform: rotate(35deg);
        }

        #mystery-sign-knot::after {
            right: -8%;
            transform: rotate(-35deg);
        }

        #mystery-sign-knot .knot-core {
            position: absolute;
            left: 50%;
            top: 47%;
            width: 42%;
            height: 56%;
            transform: translate(-50%, -50%) rotate(45deg);
            border-radius: 4px;
            border: clamp(1px, 0.12vw, 1.8px) solid rgba(140, 102, 61, 0.8);
            background:
                radial-gradient(145% 130% at 28% 23%, rgba(255, 245, 219, 0.88) 0%, rgba(255, 245, 219, 0) 62%),
                linear-gradient(150deg, rgba(225, 196, 151, 0.96) 0%, rgba(182, 142, 96, 0.98) 100%);
            box-shadow:
                inset 0 1px 1px rgba(255, 247, 226, 0.64),
                inset 0 -2px 3px rgba(108, 74, 41, 0.28);
        }

        #mystery-sign-knot .knot-tail {
            position: absolute;
            left: 50%;
            top: 52%;
            width: calc(var(--mystery-rope-width) * 1.12);
            height: clamp(8px, 1vw, 13px);
            transform: translateX(-50%);
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(234, 214, 180, 0.98) 0%, rgba(178, 142, 96, 0.96) 100%);
            box-shadow:
                inset 0 1px 1px rgba(255, 247, 229, 0.6),
                0 1px 1px rgba(0, 0, 0, 0.24);
        }

        #mystery-scroll-sign {
            position: absolute;
            left: 0;
            top: 0;
            width: var(--mystery-sign-width);
            height: var(--mystery-sign-height);
            box-sizing: border-box;
            transform-origin: 50% 0%;
            touch-action: none;
            will-change: transform, left, top;
            overflow: visible;
            z-index: 4;
            pointer-events: auto;
            cursor: grab;
            filter: none;
            transition: filter 180ms ease;
        }

        #mystery-scroll-sign:active {
            cursor: grabbing;
            filter: none;
        }

        #mystery-sign-knot {
            pointer-events: none;
        }

        #mystery-scroll-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
            filter: none;
        }

        #mystery-scroll-sign .scroll-text {
            position: relative;
            z-index: 3;
            left: 50%;
            top: 38%;
            width: 62%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(2px, 0.35vw, 5px);
            pointer-events: none;
        }

        #mystery-scroll-sign .scroll-chevron-row {
            position: absolute;
            left: 50%;
            bottom: clamp(14px, calc(var(--mystery-sign-height) * 0.11), 25px);
            width: clamp(58px, calc(var(--mystery-sign-width) * 0.48), 126px);
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 3;
            pointer-events: none;
        }

        #mystery-scroll-sign .scroll-chevron {
            width: clamp(16px, calc(var(--mystery-sign-width) * 0.13), 30px);
            height: auto;
            display: block;
            overflow: visible;
            filter: none;
        }

        #mystery-scroll-sign .scroll-chevron .chevron-main {
            fill: none;
            stroke: rgba(5, 20, 74, 0.98);
            stroke-width: 2.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #mystery-scroll-sign .scroll-chevron .chevron-glow {
            fill: none;
            stroke: rgba(77, 165, 255, 0.76);
            stroke-width: 1.35;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #mystery-scroll-sign .line-top,
        #mystery-scroll-sign .line-bottom {
            width: 100%;
            text-align: center;
            letter-spacing: 0.024em;
            line-height: 1.02;
            white-space: nowrap;
            font-family: var(--hud-font);
            text-shadow:
                0 1px 0 rgba(255, 242, 208, 0.65),
                0 0 4px rgba(255, 221, 126, 0.2),
                0 2px 4px rgba(40, 20, 6, 0.4);
        }

        #mystery-scroll-sign .line-top {
            font-size: clamp(16px, calc(var(--mystery-sign-width) * 0.178), 32px);
            font-weight: 700;
            color: #4b2b10;
            text-shadow:
                0 0 3px rgba(255, 215, 92, 0.18),
                0 1px 0 rgba(255, 242, 208, 0.65),
                0 2px 4px rgba(40, 20, 6, 0.4);
        }

        #mystery-scroll-sign .line-bottom {
            font-size: clamp(12px, calc(var(--mystery-sign-width) * 0.134), 24px);
            font-weight: 600;
            color: #5d3515;
            transform: translateY(-2px);
            text-shadow:
                0 0 2px rgba(255, 220, 120, 0.16),
                0 1px 0 rgba(255, 242, 208, 0.58),
                0 2px 4px rgba(40, 20, 6, 0.4);
        }

        .hud-box,
        .hud-btn,
        .store-panel,
        .prop-preview-panel {
            pointer-events: auto;
            box-sizing: border-box;
            border: 1px solid var(--hud-border);
            border-radius: var(--app-panel-radius);
            box-shadow: var(--panel-shadow);
            position: relative;
        }

        .hud-box {
            background: linear-gradient(165deg, rgba(30, 41, 59, 0.98), rgba(15, 23, 42, 0.9) 56%, rgba(8, 19, 39, 0.94));
            color: var(--hud-text);
            font-family: var(--hud-font);
            font-size: clamp(16px, 1.35vw, 22px);
            font-weight: 700;
            letter-spacing: 0.04em;
            padding: 10px 16px;
            min-width: clamp(120px, 18vw, 170px);
            text-align: center;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--app-panel-radius);
            border: 1px solid rgba(125, 211, 252, 0.35);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.44), inset 0 1px 0 rgba(255, 255, 255, 0.16), inset 0 -1px 0 rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(125, 211, 252, 0.2);
            position: relative;
        }

        .hud-box::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(100deg, rgba(125, 211, 252, 0.16), rgba(125, 211, 252, 0));
            opacity: 0.8;
        }

        #score-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.3ch;
            position: relative;
            z-index: 65;
            min-width: clamp(142px, 18.5vw, 214px);
            padding: clamp(10px, 1.1vw, 14px) clamp(14px, 1.45vw, 20px);
            border-radius: 18px;
            border-color: rgba(251, 191, 36, 0.52);
            font-family: var(--btn-font);
            font-size: clamp(18px, 1.55vw, 26px);
            font-weight: 700;
            letter-spacing: 0.055em;
            text-transform: uppercase;
            color: #fff2bf;
            text-shadow:
                0 1px 0 rgba(255, 248, 220, 0.7),
                0 3px 10px rgba(0, 0, 0, 0.5);
            background-image:
                linear-gradient(112deg, rgba(255, 255, 255, 0) 37%, rgba(255, 255, 255, 0.28) 49%, rgba(255, 255, 255, 0) 61%),
                radial-gradient(130% 180% at 8% 12%, rgba(125, 211, 252, 0.34) 0%, rgba(125, 211, 252, 0) 44%),
                radial-gradient(120% 190% at 95% 10%, rgba(251, 191, 36, 0.28) 0%, rgba(251, 191, 36, 0) 46%),
                linear-gradient(160deg, rgba(30, 41, 59, 0.98), rgba(17, 24, 39, 0.96) 56%, rgba(10, 18, 34, 0.98));
            background-size: 250% 100%, 100% 100%, 100% 100%, 100% 100%;
            background-position: 210% 0, 0 0, 0 0, 0 0;
            box-shadow: none;
            animation: scoreBoxShimmer 5.6s ease-in-out infinite, scoreBoxGlow 3.6s ease-in-out infinite;
        }

        #score-box::before {
            content: "✦";
            display: inline-block;
            margin-right: 0.18ch;
            color: #fcd34d;
            font-size: 0.72em;
            text-shadow:
                0 0 8px rgba(252, 211, 77, 0.72),
                0 1px 3px rgba(0, 0, 0, 0.5);
        }

        #score-box::after {
            content: none;
        }

        @keyframes scoreBoxShimmer {
            0%,
            72%,
            100% {
                background-position: 210% 0, 0 0, 0 0, 0 0;
            }
            88% {
                background-position: -120% 0, 0 0, 0 0, 0 0;
            }
        }

        @keyframes scoreBoxGlow {
            0%,
            100% {
                filter: saturate(1) brightness(1);
            }
            50% {
                filter: saturate(1.08) brightness(1.05);
            }
        }

        .hud-btn {
            background: var(--btn-bg);
            color: var(--hud-text);
            font-family: var(--btn-font);
            font-size: clamp(12px, 1.1vw, 15px);
            font-weight: var(--app-btn-font-weight);
            line-height: 1.1;
            padding: 11px 16px;
            min-width: clamp(132px, 18vw, 176px);
            min-height: 43px;
            cursor: pointer;
            transition: transform 180ms cubic-bezier(0.34, 1.56, 0.64, 1), filter 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
            text-transform: none;
            letter-spacing: 0.02em;
            justify-content: center;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            border: 1px solid var(--btn-border);
            overflow: hidden;
            border-radius: var(--app-btn-radius);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .hud-btn .btn-icon {
            font-size: 15px;
            text-shadow: 0 0 9px rgba(125, 241, 255, 0.7);
        }

        .hud-btn::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0));
            opacity: 0.12;
            pointer-events: none;
            transition: opacity 180ms ease;
        }

        .hud-btn::after {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: inherit;
            border: 1px solid rgba(255, 255, 255, 0.12);
            pointer-events: none;
        }

        .prop-preview-overlay {
            position: fixed;
            inset: 0;
            opacity: 0;
            pointer-events: none;
            z-index: 45;
            transition: opacity 170ms ease;
            overflow: hidden;
        }

        .prop-preview-overlay::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(14, 31, 61, 0.18);
            pointer-events: none;
            opacity: 0;
            transition: opacity 170ms ease;
        }

        .prop-preview-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .prop-preview-overlay.open::before {
            opacity: 1;
        }

        @supports not (backdrop-filter: blur(1px)) {
            .prop-preview-overlay {
                background: rgba(14, 31, 61, 0.32);
            }

            .prop-preview-overlay::before {
                background: rgba(14, 31, 61, 0.32);
                opacity: 0;
            }

            .prop-preview-overlay.open::before {
                opacity: 1;
            }
        }

        .hud-btn:hover,
        .hud-btn:focus-visible {
            background: var(--btn-hover);
            transform: translateY(var(--app-btn-lift));
            outline: none;
            box-shadow: 0 12px 24px rgba(79, 70, 229, 0.38);
            border-color: rgba(165, 180, 252, 0.84);
        }

        .hud-btn:hover::before,
        .hud-btn:focus-visible::before {
            opacity: 0.32;
        }

        .inventory-icon-btn {
            width: clamp(84px, 11vw, 116px);
            height: clamp(84px, 11vw, 116px);
            padding: 0;
            border: 0;
            border-radius: 14px;
            background: transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 60;
            transition: transform 160ms ease, filter 160ms ease;
            pointer-events: auto;
            isolation: isolate;
            outline: none;
            box-shadow: none;
            -webkit-tap-highlight-color: transparent;
        }

        .inventory-icon-btn::before {
            content: "";
            position: absolute;
            left: 14%;
            right: 14%;
            bottom: 12%;
            height: 28%;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.24) 0%, rgba(0, 0, 0, 0.05) 70%, rgba(0, 0, 0, 0) 100%);
            filter: blur(6px);
            transform: translateY(7px);
            pointer-events: none;
            z-index: 0;
            display: none;
        }

        .inventory-icon-btn img {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transform: scale(1.08);
            transform-origin: center;
            filter: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        .inventory-icon-btn:hover,
        .inventory-icon-btn:focus-visible {
            transform: translateY(-2px) scale(1.03);
            filter: saturate(1.07) brightness(1.05);
            outline: none;
            box-shadow: none;
        }

        .inventory-icon-btn:focus,
        .inventory-icon-btn:focus-visible {
            outline: none;
            box-shadow: none;
        }

        .inventory-icon-btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* Prevent any square focus/hover frame around the inventory icon button. */
        .inventory-icon-btn,
        .inventory-icon-btn:hover,
        .inventory-icon-btn:focus,
        .inventory-icon-btn:focus-visible,
        .inventory-icon-btn:active {
            outline: none !important;
            box-shadow: none !important;
        }

        .inventory-icon-btn::-moz-focus-inner {
            border: 0;
        }

        .store-panel {
            width: min(360px, 86vw);
            background: var(--hud-panel-bg);
            color: var(--hud-text);
            padding: 14px;
            display: none;
            gap: 8px;
            max-height: min(70vh, 500px);
            overflow: hidden;
            grid-template-columns: 1fr;
            animation: panelRevealEdge 160ms cubic-bezier(0.19, 1, 0.22, 1) forwards;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .store-panel {
            max-height: min(70vh, 500px);
        }

        .store-panel.open {
            display: grid;
        }

        .store-title {
            margin: 2px 0 4px;
            font-family: var(--btn-font);
            font-size: clamp(13px, 1.4vw, 18px);
            text-transform: uppercase;
            letter-spacing: 0.06em;

        /* Reworked inventory frame: structured regions with an open central showcase around the creature. */
        .inventory-panel {
            --inventory-anchor-x: 50vw;
            --inventory-anchor-y: 50vh;
            --inventory-panel-top: 0px;
            --inventory-panel-width: min(90vw, 368px);
            --inventory-panel-height: min(84vh, 730px);
            --inventory-bottom-clearance: calc(var(--inventory-safe-area-bottom) + 84px);
            --inventory-panel-edge-gap: clamp(10px, 1.7vh, 18px);
            --inventory-shell-inset-top: clamp(64px, 16%, 108px);
            --inventory-shell-inset-side: clamp(9px, 2.4vw, 14px);
            --inventory-shell-inset-bottom: clamp(10px, 2.4vh, 16px);
            --inventory-shell-gap: clamp(8px, 1.7vh, 14px);
            --inventory-showcase-min-height: clamp(140px, 37%, 310px);
            position: fixed;
            left: var(--inventory-anchor-x);
            top: var(--inventory-anchor-y);
            right: auto;
            bottom: auto;
            transform: translate(-50%, -50%);
            width: var(--inventory-panel-width);
            height: var(--inventory-panel-height);
            max-width: calc(100vw - (var(--inventory-panel-edge-gap) * 2));
            max-height: calc(100vh - var(--inventory-bottom-clearance) - (var(--inventory-panel-edge-gap) * 2));
            min-height: 0;
            padding: 0;
            border: 0;
            background: transparent;
            box-shadow: none;
            overflow: visible;
            pointer-events: none;
            isolation: isolate;
            z-index: 58;
            display: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            transition: none;
        }

        .inventory-panel.open {
            display: block;
            animation: none;
        }

        .inventory-panel>* {
            position: relative;
            z-index: 2;
            pointer-events: auto;
        }

        .inventory-hanger {
            position: absolute;
            left: 50%;
            top: calc(-1 * var(--inventory-panel-top));
            width: 3px;
            height: calc(var(--inventory-panel-top) + clamp(78px, 12.5vh, 122px));
            transform: translateX(-50%);
            border-radius: 999px;
            background:
                linear-gradient(180deg, rgba(255, 239, 201, 0.98), rgba(206, 146, 74, 0.95) 42%, rgba(107, 68, 30, 0.98));
            box-shadow:
                0 2px 0 rgba(255, 243, 214, 0.6),
                0 8px 14px rgba(0, 0, 0, 0.34);
            pointer-events: none;
            z-index: 1;
        }

        .inventory-hanger::before {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -11px;
            width: clamp(14px, 4.4vw, 18px);
            height: clamp(14px, 4.4vw, 18px);
            transform: translateX(-50%) rotate(45deg);
            border-radius: 4px;
            border: 1px solid rgba(229, 177, 88, 0.95);
            background:
                radial-gradient(circle at 36% 34%, rgba(214, 241, 255, 0.98), rgba(109, 177, 255, 0.92) 56%, rgba(61, 106, 205, 0.98) 100%);
            box-shadow:
                0 3px 8px rgba(0, 0, 0, 0.28),
                0 0 12px rgba(98, 190, 255, 0.5);
        }

        .inventory-frame-shell {
            --inventory-shell-rail-width: clamp(10px, 2.6vw, 12px);
            position: absolute;
            inset: var(--inventory-shell-inset-top) var(--inventory-shell-inset-side) var(--inventory-shell-inset-bottom);
            border-radius: clamp(20px, 5vw, 26px);
            border: clamp(3px, 0.9vw, 5px) solid rgba(189, 140, 60, 0.96);
            background:
                linear-gradient(90deg,
                    rgba(143, 98, 48, 0.98) 0 var(--inventory-shell-rail-width),
                    rgba(0, 0, 0, 0) var(--inventory-shell-rail-width) calc(100% - var(--inventory-shell-rail-width)),
                    rgba(143, 98, 48, 0.98) calc(100% - var(--inventory-shell-rail-width)) 100%),
                linear-gradient(180deg,
                    rgba(157, 111, 57, 0.98) 0 clamp(12px, 3vw, 14px),
                    rgba(0, 0, 0, 0) clamp(12px, 3vw, 14px) calc(100% - clamp(12px, 3vw, 14px)),
                    rgba(98, 62, 29, 0.98) calc(100% - clamp(12px, 3vw, 14px)) 100%);
            box-shadow:
                0 18px 34px rgba(0, 0, 0, 0.48),
                inset 0 1px 0 rgba(255, 232, 166, 0.45),
                inset 0 0 0 1px rgba(83, 52, 21, 0.72);
            display: grid;
            grid-template-rows: auto minmax(var(--inventory-showcase-min-height), 1fr) auto;
            grid-template-areas:
                "header"
                "showcase"
                "slots";
            row-gap: 0;
            padding: clamp(10px, 2.2vw, 14px);
            pointer-events: auto;
            overflow: visible;
            box-sizing: border-box;

        .inventory-focus-overlay {
            --inventory-focus-hole-top: 0px;
            --inventory-focus-hole-right: 0px;
            --inventory-focus-hole-bottom: 0px;
            --inventory-focus-hole-left: 0px;
            --inventory-focus-hole-inset: clamp(10px, 1.2vw, 14px);
            --inventory-focus-top-drop: clamp(96px, 22vh, 190px);
            --inventory-focus-band-alpha: 0.56;
            position: fixed;
            inset: 0;
            z-index: 56;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 180ms ease, visibility 0ms linear 180ms;

        .inventory-focus-band {
            position: absolute;
            background: rgba(4, 9, 20, var(--inventory-focus-band-alpha));
            backdrop-filter: blur(9px) saturate(0.92);
            -webkit-backdrop-filter: blur(9px) saturate(0.92);
            pointer-events: none;
        }

        .inventory-focus-band.top {
            inset: 0 0 calc(100% - (var(--inventory-focus-hole-top) + var(--inventory-focus-hole-inset) + var(--inventory-focus-top-drop))) 0;
        }

        .inventory-focus-band.right {
            inset:
                calc(var(--inventory-focus-hole-top) + var(--inventory-focus-hole-inset) + var(--inventory-focus-top-drop))
                0
                calc(100% - (var(--inventory-focus-hole-bottom) - var(--inventory-focus-hole-inset)))
                calc(var(--inventory-focus-hole-right) - var(--inventory-focus-hole-inset));
        }

        .inventory-focus-band.bottom {
            inset: calc(var(--inventory-focus-hole-bottom) - var(--inventory-focus-hole-inset)) 0 0 0;
        }

        .inventory-focus-band.left {
            inset:
                calc(var(--inventory-focus-hole-top) + var(--inventory-focus-hole-inset) + var(--inventory-focus-top-drop))
                calc(100% - (var(--inventory-focus-hole-left) + var(--inventory-focus-hole-inset)))
                calc(100% - (var(--inventory-focus-hole-bottom) - var(--inventory-focus-hole-inset)))
                0;
        }

    <script type="module">
        import * as THREE from 'three';
        import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
        let createLegacyInventoryAndPropDefinitions = null;
        if (window.location.protocol === 'file:') {
            createLegacyInventoryAndPropDefinitions = createLegacyInventoryAndPropDefinitionsFileFallback;
        } else {
            try {
                const adapterModule = await import('./src/compat/legacy-prop-definitions-adapter.js');
                createLegacyInventoryAndPropDefinitions = adapterModule.createLegacyInventoryAndPropDefinitions;
            } catch (error) {
                console.warn('Unable to load catalog adapter module. Falling back to inline adapter.', error);
                createLegacyInventoryAndPropDefinitions = createLegacyInventoryAndPropDefinitionsFileFallback;
            }
        }

        // --- CONSTANTS ---
        const SVG_DATA = {
            viewBox: { x: 0, y: 0, w: 200, h: 200 },
            body: { cx: 100, cy: 100, r: 28 },
            wingRight: "M110,90 Q170,40 200,70 Q160,120 115,100",
            wingLeft: "M90,90 Q30,40 0,70 Q40,120 85,100"
        };
        const SCALE = 0.1;

        // --- SCENE SETUP ---
        const container = document.getElementById('game-container');
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 140);
        camera.position.set(0, 1.2, 20);
        const raycaster = new THREE.Raycaster();
        const pointerNdc = new THREE.Vector2();

        // --- LIGHTING (Daylight palette inspired by reference) ---
        const ambientLight = new THREE.AmbientLight(0xe4ffe0, 0.9);
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0x8fd0ff, 0x6ca245, 1.2);
        scene.add(hemiLight);

        const sunLight = new THREE.DirectionalLight(0xfff6d3, 2.1);
        sunLight.position.set(20, 26, 10);
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0xe6ffd1, 0.65);
        fillLight.position.set(-16, 10, 8);
        scene.add(fillLight);

        const petRim = new THREE.PointLight(0x9de8ff, 8, 55);
        petRim.position.set(0, 2, -8);
        scene.add(petRim);

        // --- BACKGROUND WORLD ---
        const worldGroup = new THREE.Group();
        scene.add(worldGroup);

        function createSkyDome() {
            const geometry = new THREE.SphereGeometry(90, 40, 28);
            const material = new THREE.ShaderMaterial({
                side: THREE.BackSide,
                uniforms: {
                    topColor: { value: new THREE.Color(0x4da4ff) },
                    midColor: { value: new THREE.Color(0x9cdaff) },
                    bottomColor: { value: new THREE.Color(0xd8f4ff) }
                },
                vertexShader: `
                    varying vec3 vWorldPosition;
                    void main() {
                        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                        vWorldPosition = worldPosition.xyz;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec3 vWorldPosition;
                    uniform vec3 topColor;
                    uniform vec3 midColor;
                    uniform vec3 bottomColor;
                    void main() {
                        float h = normalize(vWorldPosition + vec3(0.0, 28.0, 0.0)).y;
                        vec3 colorA = mix(bottomColor, midColor, smoothstep(-0.25, 0.3, h));
                        vec3 colorB = mix(midColor, topColor, smoothstep(0.15, 0.9, h));
                        vec3 finalColor = mix(colorA, colorB, smoothstep(0.0, 1.0, h));
                        gl_FragColor = vec4(finalColor, 1.0);
                    }
                `
            });
            const dome = new THREE.Mesh(geometry, material);
            dome.position.y = 4;
            return dome;
        }
        worldGroup.add(createSkyDome());

        function createSunSprite() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;

            const lift = Math.max(0, Number.isFinite(hoverHeight) ? hoverHeight : 0);

                CONTACT_SHADOW_ASCENT_FADE_START,
                CONTACT_SHADOW_ASCENT_FADE_FULL
            );
            const sceneFade = THREE.MathUtils.clamp(contactShadowSceneFade * ascentFade, 0, 1);

            contactShadow.material.opacity = baseCoreOpacity * sceneFade;
            contactShadowSoft.material.opacity = baseSoftOpacity * sceneFade;

                emissive: 0x4cf7ff,
                emissiveIntensity: 1.8,

            return mesh;

                const {
                    scleraColor = 0xffffff,
                    irisColor = 0x2a4ac4,

                this.irisMat.emissiveIntensity = irisEmissiveIntensity;

            }

        function makeOmegaMembraneMaps() {
            const size = 1024;
            const maxAnisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());

            const diffuseCanvas = document.createElement('canvas');
            diffuseCanvas.width = size;
            diffuseCanvas.height = size;
            const dCtx = diffuseCanvas.getContext('2d');

            const emissiveCanvas = document.createElement('canvas');
            emissiveCanvas.width = size;
            emissiveCanvas.height = size;
            const eCtx = emissiveCanvas.getContext('2d');

            const alphaCanvas = document.createElement('canvas');
            alphaCanvas.width = size;
            alphaCanvas.height = size;
            const aCtx = alphaCanvas.getContext('2d');

            let seed = 19771337;
            const rand = () => {
                seed = (seed * 1664525 + 1013904223) >>> 0;
                return seed / 4294967296;
            };

            const baseGradient = dCtx.createLinearGradient(0, 0, 0, size);
            baseGradient.addColorStop(0.0, '#12070b');
            baseGradient.addColorStop(0.28, '#241016');
            baseGradient.addColorStop(0.56, '#5f2418');
            baseGradient.addColorStop(0.85, '#b04c1f');
            baseGradient.addColorStop(1.0, '#ff952f');
            dCtx.fillStyle = baseGradient;
            dCtx.fillRect(0, 0, size, size);

            for (let i = 0; i < 260; i++) {
                const x = rand() * size;
                const y = rand() * size;
                const r = 20 + rand() * 96;
                const g = dCtx.createRadialGradient(x, y, 1, x, y, r);
                const alpha = 0.03 + rand() * 0.09;
                g.addColorStop(0, `rgba(255,185,132,${alpha})`);
                g.addColorStop(1, 'rgba(26,8,8,0)');
                dCtx.fillStyle = g;
                dCtx.beginPath();
                dCtx.arc(x, y, r, 0, Math.PI * 2);
                dCtx.fill();
            }

            dCtx.lineCap = 'round';
            for (let i = 0; i < 56; i++) {
                const startX = 120 + rand() * 250;
                const startY = 470 + rand() * 300;
                let x = startX;
                let y = startY;
                dCtx.beginPath();
                dCtx.moveTo(x, y);
                const branchCount = 6 + Math.floor(rand() * 5);
                for (let j = 0; j < branchCount; j++) {
                    x += 65 + rand() * 90;
                    y += (rand() - 0.62) * 150;
                    dCtx.quadraticCurveTo(
                        x - 30 + rand() * 60,
                        y - 20 + rand() * 40,
                        x,
                        y
                    );
                }
                dCtx.strokeStyle = `rgba(255,188,132,${0.07 + rand() * 0.12})`;
                dCtx.lineWidth = 0.7 + rand() * 2.4;
                dCtx.stroke();
            }

            const darkVignette = dCtx.createRadialGradient(size * 0.55, size * 0.45, 60, size * 0.55, size * 0.45, size * 0.95);
            darkVignette.addColorStop(0, 'rgba(0,0,0,0)');
            darkVignette.addColorStop(1, 'rgba(6,2,2,0.45)');
            dCtx.fillStyle = darkVignette;
            dCtx.fillRect(0, 0, size, size);

            eCtx.fillStyle = '#070103';
            eCtx.fillRect(0, 0, size, size);
            const lowerGlow = eCtx.createLinearGradient(0, size * 0.32, 0, size);
            lowerGlow.addColorStop(0, 'rgba(255,70,18,0.05)');
            lowerGlow.addColorStop(0.6, 'rgba(255,113,34,0.36)');
            lowerGlow.addColorStop(1, 'rgba(255,180,72,0.92)');
            eCtx.fillStyle = lowerGlow;
            eCtx.fillRect(0, 0, size, size);

            for (let i = 0; i < 22; i++) {
                const x = size * (0.46 + rand() * 0.48);
                const y = size * (0.55 + rand() * 0.37);
                const r = 24 + rand() * 95;
                const g = eCtx.createRadialGradient(x, y, 2, x, y, r);
                g.addColorStop(0, 'rgba(255,220,150,0.92)');
                g.addColorStop(0.35, 'rgba(255,124,42,0.58)');
                g.addColorStop(1, 'rgba(25,6,4,0)');
                eCtx.fillStyle = g;
                eCtx.beginPath();
                eCtx.arc(x, y, r, 0, Math.PI * 2);
                eCtx.fill();
            }

            eCtx.strokeStyle = 'rgba(255,138,52,0.25)';
            eCtx.lineCap = 'round';
            for (let i = 0; i < 34; i++) {
                const x0 = 180 + rand() * 190;
                const y0 = 520 + rand() * 260;
                const x1 = x0 + 330 + rand() * 260;
                const y1 = y0 + (rand() - 0.7) * 240;
                eCtx.beginPath();
                eCtx.moveTo(x0, y0);
                eCtx.quadraticCurveTo((x0 + x1) * 0.5, Math.min(size - 10, y0 + y1 * 0.2), x1, y1);
                eCtx.lineWidth = 1.5 + rand() * 2.2;
                eCtx.stroke();
            }

            aCtx.fillStyle = '#ffffff';
            aCtx.fillRect(0, 0, size, size);
            for (let i = 0; i < 52; i++) {
                const x = size * (0.58 + rand() * 0.42);
                const y = size * (0.58 + rand() * 0.4);
                const r = 12 + rand() * 42;
                const g = aCtx.createRadialGradient(x, y, 0, x, y, r);
                g.addColorStop(0, 'rgba(0,0,0,0.95)');
                g.addColorStop(1, 'rgba(255,255,255,0)');
                aCtx.fillStyle = g;
                aCtx.beginPath();
                aCtx.arc(x, y, r, 0, Math.PI * 2);
                aCtx.fill();
            }

            const diffuse = new THREE.CanvasTexture(diffuseCanvas);
            diffuse.colorSpace = THREE.SRGBColorSpace;
            diffuse.anisotropy = maxAnisotropy;
            diffuse.needsUpdate = true;

            const emissive = new THREE.CanvasTexture(emissiveCanvas);
            emissive.colorSpace = THREE.SRGBColorSpace;
            emissive.anisotropy = maxAnisotropy;
            emissive.needsUpdate = true;

            const alpha = new THREE.CanvasTexture(alphaCanvas);
            alpha.anisotropy = maxAnisotropy;
            alpha.needsUpdate = true;

            return { diffuse, emissive, alpha };
        }

        function makeBoneBetween(start, end, radiusStart, radiusEnd, material, radialSegments = 12) {
            const delta = new THREE.Vector3().subVectors(end, start);
            const length = Math.max(0.0001, delta.length());
            const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radiusEnd, radiusStart, length, radialSegments), material);
            mesh.position.copy(start).addScaledVector(delta, 0.5);
            mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), delta.clone().normalize());
            return mesh;
        }

        function makeOmegaWingShape(dir) {
            const shape = new THREE.Shape();
            const mx = (x) => x * dir;

            // Curved demonic wing profile tuned to match reference silhouette:
            // broader span, higher crown arc, and sharper trailing scallops.
            shape.moveTo(mx(0.05), 0.3);

            // Primary upper arc to top tip.
            shape.quadraticCurveTo(mx(0.94), 1.48, mx(2.24), 2.5);
            shape.quadraticCurveTo(mx(4.08), 3.54, mx(6.24), 3.92);
            shape.quadraticCurveTo(mx(7.52), 3.98, mx(8.32), 3.62);

            // Folded upper trailing edge toward mid structure.
            shape.quadraticCurveTo(mx(7.78), 3.16, mx(7.06), 2.52);
            shape.quadraticCurveTo(mx(6.48), 2.0, mx(6.08), 1.46);

            // Finger-led membrane scallops.
            shape.quadraticCurveTo(mx(7.26), 1.24, mx(8.08), 0.96);
            shape.quadraticCurveTo(mx(7.0), 0.48, mx(5.58), 0.14);
            shape.quadraticCurveTo(mx(7.06), -0.04, mx(7.9), -0.46);
            shape.quadraticCurveTo(mx(6.58), -1.06, mx(5.04), -1.26);
            shape.quadraticCurveTo(mx(6.32), -1.64, mx(7.0), -2.08);

            // Lower contour back to root.
            shape.quadraticCurveTo(mx(5.38), -2.36, mx(3.46), -2.36);
            shape.quadraticCurveTo(mx(2.08), -2.34, mx(1.04), -2.2);
            shape.quadraticCurveTo(mx(0.34), -1.98, mx(0.02), -1.56);
            shape.quadraticCurveTo(mx(-0.16), -1.06, mx(-0.12), -0.52);
            shape.quadraticCurveTo(mx(-0.08), -0.12, mx(0.05), 0.3);

            shape.closePath();
            return shape;
        }

            const membraneShape = makeOmegaWingShape(dir);

            membraneGeo.computeBoundingBox();
            const bounds = membraneGeo.boundingBox;
            const minAbsX = Math.min(Math.abs(bounds.min.x), Math.abs(bounds.max.x));
            const maxAbsX = Math.max(Math.abs(bounds.min.x), Math.abs(bounds.max.x));
            const spanAbsX = Math.max(0.001, maxAbsX - minAbsX);
            const spanY = Math.max(0.001, bounds.max.y - bounds.min.y);
            const pos = membraneGeo.attributes.position;
            const uv = new Float32Array(pos.count * 2);
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const y = pos.getY(i);
                const nx = THREE.MathUtils.clamp((Math.abs(x) - minAbsX) / spanAbsX, 0, 1);
                const ny = THREE.MathUtils.clamp((y - bounds.min.y) / spanY, 0, 1);
                const camber = (0.08 + nx * 0.32) - Math.pow(ny, 1.75) * 0.08;
                const wrinkle = Math.sin(nx * 10.4 + ny * 4.2) * 0.018 + Math.cos(nx * 4.6 - ny * 9.1) * 0.014;

            for (const [x, y, z, r] of knuckles) {

            for (let i = 0; i < 3; i++) {

        function makeAlphaWingTextures() {
            const size = 1024;
            const maxAnisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());

            function makePanelTexture({ baseA, baseB, edgeTint, stripeA, stripeB, seedBase }) {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                let seed = seedBase >>> 0;
                const rand = () => {
                    seed = (seed * 1664525 + 1013904223) >>> 0;
                    return seed / 4294967296;
                };

                const base = ctx.createLinearGradient(0, 0, size, size);
                base.addColorStop(0.0, baseA);
                base.addColorStop(0.54, baseB);
                base.addColorStop(1.0, '#0f1636');
                ctx.fillStyle = base;
                ctx.fillRect(0, 0, size, size);

                for (let i = 0; i < 3; i++) {
                    const y = size * (0.26 + i * 0.18 + rand() * 0.04);
                    const alpha = 0.2 + rand() * 0.16;
                    ctx.strokeStyle = `rgba(235,248,255,${alpha})`;
                    ctx.lineWidth = 6 + rand() * 5;
                    ctx.beginPath();
                    ctx.moveTo(size * 0.04, y);
                    ctx.lineTo(size * 0.95, y + (rand() - 0.5) * 26);
                    ctx.stroke();
                }

                for (let i = 0; i < 6; i++) {
                    const x = size * (0.04 + rand() * 0.84);
                    const y = size * (0.08 + rand() * 0.82);
                    const w = 140 + rand() * 230;
                    const h = 4 + rand() * 8;
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(-0.2 + rand() * 0.4);
                    ctx.fillStyle = i % 2 === 0 ? stripeA : stripeB;
                    ctx.fillRect(0, 0, w, h);
                    ctx.fillStyle = edgeTint;
                    ctx.fillRect(2, 2, Math.max(6, w * 0.35), Math.max(2, h * 0.38));
                    ctx.restore();
                }

                const vignette = ctx.createRadialGradient(size * 0.54, size * 0.48, 80, size * 0.54, size * 0.48, size * 0.76);
                vignette.addColorStop(0, 'rgba(0,0,0,0)');
                vignette.addColorStop(1, 'rgba(0,0,0,0.5)');
                ctx.fillStyle = vignette;
                ctx.fillRect(0, 0, size, size);

                const tex = new THREE.CanvasTexture(canvas);
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.anisotropy = maxAnisotropy;
                tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(1.0, 1.0);
                tex.needsUpdate = true;
                return tex;
            }

            const sparkCanvas = document.createElement('canvas');
            sparkCanvas.width = 128;
            sparkCanvas.height = 128;
            const sCtx = sparkCanvas.getContext('2d');
            const sparkGrad = sCtx.createRadialGradient(64, 64, 4, 64, 64, 60);
            sparkGrad.addColorStop(0.0, 'rgba(255,255,255,1)');
            sparkGrad.addColorStop(0.24, 'rgba(181,242,255,0.95)');
            sparkGrad.addColorStop(0.58, 'rgba(255,124,232,0.78)');
            sparkGrad.addColorStop(1.0, 'rgba(255,255,255,0)');
            sCtx.fillStyle = sparkGrad;
            sCtx.fillRect(0, 0, 128, 128);

            const sparkTexture = new THREE.CanvasTexture(sparkCanvas);
            sparkTexture.colorSpace = THREE.SRGBColorSpace;
            sparkTexture.needsUpdate = true;

            return {
                cyanPanel: makePanelTexture({
                    baseA: '#0f2a56',
                    baseB: '#1a417f',
                    edgeTint: 'rgba(215,251,255,0.55)',
                    stripeA: 'rgba(64,229,255,0.84)',
                    stripeB: 'rgba(153,242,255,0.72)',
                    seedBase: 9733
                }),
                magentaPanel: makePanelTexture({
                    baseA: '#2a1454',
                    baseB: '#4a1f7a',
                    edgeTint: 'rgba(255,214,255,0.52)',
                    stripeA: 'rgba(255,84,219,0.86)',
                    stripeB: 'rgba(204,112,255,0.72)',
                    seedBase: 48179
                }),

            };
        }

        function makeAlphaBladeGeometry(dir, options = {}) {
            const {
                length = 3.2,
                rootWidth = 0.58,
                tipWidth = 0.2,
                thickness = 0.07,
                camber = 0.12,
                droop = 0,
                sweep = 0.1,
                twist = 0.05
            } = options;

            const mx = (x) => x * dir;
            const shape = new THREE.Shape();
            shape.moveTo(mx(0), -rootWidth * 0.5);
            shape.bezierCurveTo(
                mx(length * 0.34),
                -rootWidth * 0.68 + sweep * 0.18,
                mx(length * 0.88),
                -tipWidth * 0.62 + sweep,
                mx(length),
                -tipWidth * 0.46 + sweep
            );
            shape.quadraticCurveTo(mx(length * 1.03), sweep * 0.82, mx(length), tipWidth * 0.48 + sweep);
            shape.bezierCurveTo(
                mx(length * 0.9),
                tipWidth * 0.72 + sweep,
                mx(length * 0.38),
                rootWidth * 0.66 + sweep * 0.14,
                mx(0),
                rootWidth * 0.5
            );
            shape.closePath();

            const geo = new THREE.ExtrudeGeometry(shape, {
                steps: 1,
                depth: thickness,
                bevelEnabled: true,
                bevelSize: 0.015,
                bevelThickness: 0.015,
                bevelSegments: 2,
                curveSegments: 42
            });
            geo.translate(0, 0, -thickness * 0.5);

            const pos = geo.attributes.position;
            const uv = new Float32Array(pos.count * 2);
            const halfRoot = Math.max(0.001, rootWidth * 0.5);
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const y = pos.getY(i);
                const z = pos.getZ(i);
                const nx = THREE.MathUtils.clamp(Math.abs(x) / Math.max(0.001, length), 0, 1);
                const ny = THREE.MathUtils.clamp(y / halfRoot, -1, 1);
                const camberOffset = Math.sin(nx * Math.PI) * camber;
                const twistOffset = ny * twist * Math.pow(nx, 1.2);
                const droopOffset = Math.pow(nx, 1.45) * droop;
                pos.setXYZ(i, x, y + droopOffset, z + camberOffset + twistOffset);
                uv[i * 2] = nx;
                uv[i * 2 + 1] = THREE.MathUtils.clamp((ny + 1) * 0.5, 0, 1);
            }
            geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
            pos.needsUpdate = true;
            geo.computeVertexNormals();
            return geo;
        }

        function makeAlphaSparkSystem(dir, sparkTexture) {
            const count = 16;
            const positions = new Float32Array(count * 3);
            const basePositions = new Float32Array(count * 3);
            const phases = new Float32Array(count);

            let seed = dir > 0 ? 13579 : 35791;
            const rand = () => {
                seed = (seed * 1103515245 + 12345) >>> 0;
                return (seed & 0x7fffffff) / 0x7fffffff;
            };

            for (let i = 0; i < count; i++) {
                const idx = i * 3;
                const x = dir * (0.56 + rand() * 3.1);
                const y = -1.2 + rand() * 3.5;
                const z = -0.06 + rand() * 0.46;
                positions[idx] = basePositions[idx] = x;
                positions[idx + 1] = basePositions[idx + 1] = y;
                positions[idx + 2] = basePositions[idx + 2] = z;
                phases[i] = rand() * Math.PI * 2;
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({
                color: 0xffc2ff,
                map: sparkTexture,
                alphaMap: sparkTexture,
                size: 0.052,
                sizeAttenuation: true,
                transparent: true,
                opacity: 0.56,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            const points = new THREE.Points(geo, mat);
            return {
                points,
                basePositions,
                phases,
                speed: 2.6 + rand() * 0.8,
                drift: 0.016 + rand() * 0.012,
                phaseOffset: rand() * Math.PI * 2
            };
        }

        function makeRainbowFeatherGeometry(dir, options = {}) {
            const {
                length = 4.6,
                rootWidth = 0.86,
                tipWidth = 0.18,
                rise = 1.1,
                camber = 0.12,
                droop = 0,
                twist = 0.05,
                curl = 0.2
            } = options;

            const mx = (x) => x * dir;
            const shape = new THREE.Shape();
            shape.moveTo(mx(0), -rootWidth * 0.5);
            shape.bezierCurveTo(
                mx(length * 0.24), -rootWidth * 0.74,
                mx(length * 0.82), rise - tipWidth * 0.54,
                mx(length), rise - tipWidth * 0.14
            );
            shape.quadraticCurveTo(
                mx(length * (1.06 + curl * 0.1)),
                rise + tipWidth * (0.5 + curl * 0.8),
                mx(length * (0.94 + curl * 0.06)),
                rise + tipWidth * 1.04
            );
            shape.bezierCurveTo(
                mx(length * 0.72), rise + tipWidth * 1.2,
                mx(length * 0.24), rootWidth * 0.76,
                mx(0), rootWidth * 0.5
            );
            shape.closePath();

            const geo = new THREE.ShapeGeometry(shape, 92);
            const pos = geo.attributes.position;
            const uv = new Float32Array(pos.count * 2);
            const heightRef = rootWidth + Math.abs(rise) * 0.95;

            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const y = pos.getY(i);
                const nx = THREE.MathUtils.clamp(Math.abs(x) / Math.max(0.001, length), 0, 1);
                const ny = THREE.MathUtils.clamp((y - rise * 0.36) / Math.max(0.001, heightRef), -1, 1);
                const edgeSoft = 1 - Math.abs(ny);
                const z = Math.sin(nx * Math.PI) * camber * (0.54 + edgeSoft * 0.46)
                    + ny * twist * Math.pow(nx, 1.22)
                    + Math.pow(nx, 1.34) * droop
                    + Math.sin(nx * 11.2 + ny * 3.6) * 0.006;

                pos.setXYZ(
                    i,
                    x + dir * Math.pow(nx, 2.08) * curl * 0.24 * (0.16 + Math.abs(ny)),
                    y,
                    z
                );

                uv[i * 2] = nx;
                uv[i * 2 + 1] = THREE.MathUtils.clamp((ny + 1) * 0.5, 0, 1);
            }

            geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
            pos.needsUpdate = true;
            geo.computeVertexNormals();
            return geo;
        }

        function makeRainbowSparkSystem(dir, texture, options = {}) {
            const {
                count = 24,
                size = 0.07,
                opacity = 0.72,
                spreadMin = 0.7,
                spreadMax = 4.2,
                yOffset = 0,
                drift = 0.036
            } = options;

            const positions = new Float32Array(count * 3);
            const basePositions = new Float32Array(count * 3);
            const phases = new Float32Array(count);
            const colors = new Float32Array(count * 3);
            const palette = [0xffd2f5, 0xffe7a8, 0xb8ddff, 0xbefaff, 0xffc1df, 0xd4bbff, 0xffffff];

            let seed = dir > 0 ? 908731 : 187349;
            const rand = () => {
                seed = (seed * 1103515245 + 12345) >>> 0;
                return (seed & 0x7fffffff) / 0x7fffffff;
            };

            for (let i = 0; i < count; i++) {
                const idx = i * 3;
                const span = spreadMin + rand() * (spreadMax - spreadMin);
                const arc = -1.05 + rand() * 2.2;
                const x = dir * (0.46 + Math.cos(arc) * span);
                const y = yOffset + Math.sin(arc) * (span * 0.78) + (rand() - 0.5) * 0.64;
                const z = 0.14 + rand() * 0.5;

                positions[idx] = basePositions[idx] = x;
                positions[idx + 1] = basePositions[idx + 1] = y;
                positions[idx + 2] = basePositions[idx + 2] = z;
                phases[i] = rand() * Math.PI * 2;

                const c = new THREE.Color(palette[Math.floor(rand() * palette.length)]);
                colors[idx] = c.r;
                colors[idx + 1] = c.g;
                colors[idx + 2] = c.b;
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                map: texture,
                alphaMap: texture,
                vertexColors: true,
                size,
                sizeAttenuation: true,
                transparent: true,
                opacity,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            return {
                points: new THREE.Points(geo, mat),
                basePositions,
                phases,
                speed: 1.8 + rand() * 1.1,
                drift,
                phaseOffset: rand() * Math.PI * 2
            };
        }

            if (!inventoryFocusOverlay || !inventoryPanel || !isInventoryPanelOpen()) {

            const viewportWidth = Math.max(
                1,
                (visualViewport && Number.isFinite(visualViewport.width) ? visualViewport.width : window.innerWidth) || 1
            );
            const viewportHeight = Math.max(
                1,
                (visualViewport && Number.isFinite(visualViewport.height) ? visualViewport.height : window.innerHeight) || 1
            );
            const panelRect = inventoryPanel.getBoundingClientRect();
            if (
                !Number.isFinite(panelRect.left) ||
                !Number.isFinite(panelRect.top) ||
                !Number.isFinite(panelRect.right) ||
                !Number.isFinite(panelRect.bottom)
            ) {
                return;
            }
            const panelWidth = Math.max(1, panelRect.width);
            const panelHeight = Math.max(1, panelRect.height);
            const desiredInset = isPortraitLikeViewport() ? 10 : 12;
            const holeInsetX = Math.min(desiredInset, Math.max(0, (panelWidth - 20) * 0.5));
            const holeInsetY = Math.min(desiredInset, Math.max(0, (panelHeight - 20) * 0.5));

            const holeLeft = THREE.MathUtils.clamp(panelRect.left + holeInsetX, 0, viewportWidth);
            const holeTop = THREE.MathUtils.clamp(panelRect.top + holeInsetY, 0, viewportHeight);
            const holeRight = THREE.MathUtils.clamp(panelRect.right - holeInsetX, holeLeft, viewportWidth);
            const holeBottom = THREE.MathUtils.clamp(panelRect.bottom - holeInsetY, holeTop, viewportHeight);
