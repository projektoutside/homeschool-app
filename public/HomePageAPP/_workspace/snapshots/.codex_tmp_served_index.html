<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#5e9f33">
    <title>Aetheria: The Pet (Sunny Garden)</title>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preload" as="script" href="https://unpkg.com/three@0.160.0/build/three.module.js" crossorigin>
    <link rel="preload" as="video" href="./windy_scene_loop_school_still_hyperreal_clouds.webm" type="video/webm">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap');

        :root {
            --app-font-sans: 'Nunito', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --app-font-display: 'Fredoka', 'Nunito', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --app-text-main: #e2e8f0;
            --app-text-muted: rgba(226, 232, 240, 0.82);
            --app-surface: rgba(30, 41, 59, 0.84);
            --app-surface-solid: linear-gradient(180deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.88));
            --app-border: rgba(255, 255, 255, 0.18);
            --app-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
            --app-elevated-shadow: 0 10px 24px rgba(0, 0, 0, 0.36);
            --app-accent: #8b5cf6;
            --app-secondary: #6366f1;
            --app-success: #22d3ee;
            --app-btn-radius: 16px;
            --app-btn-font-weight: 700;
            --app-focus-ring: 0 0 0 2px rgba(99, 102, 241, 0.45), 0 0 0 4px rgba(125, 250, 255, 0.22);
            --app-btn-lift: -2px;
            --app-panel-radius: 16px;

            --bg-dark: transparent;
            --hud-bg: var(--app-surface);
            --hud-panel-bg: var(--app-surface-solid);
            --hud-border: var(--app-border);
            --hud-text: var(--app-text-main);
            --hud-font: var(--app-font-sans);
            --btn-font: var(--app-font-display);
            --btn-bg: linear-gradient(180deg, rgba(30, 41, 59, 0.72), rgba(15, 23, 42, 0.82));
            --btn-hover: linear-gradient(180deg, rgba(99, 102, 241, 0.96), rgba(79, 70, 229, 0.94));
            --btn-border: rgba(203, 213, 225, 0.35);
            --accent: var(--app-accent);
            --panel-shadow: var(--app-shadow);
            --hud-left-anchor: calc(clamp(8px, 1.8vw, 24px) + env(safe-area-inset-left));
            --score-top-anchor: calc(clamp(8px, 1.4vh, 18px) + env(safe-area-inset-top));
            --score-height: clamp(40px, 5vh, 56px);
            --score-inventory-gap: clamp(8px, 1.3vh, 14px);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-dark);
            font-family: var(--hud-font);
        }

        canvas {
            background: transparent !important;
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: transparent;
        }

        #gif-background {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            filter: saturate(1.1) contrast(1.06) brightness(0.92);
        }

        #gif-tint {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(120% 78% at 50% 62%, rgba(126, 225, 255, 0.08) 0%, rgba(0, 0, 0, 0) 58%),
                linear-gradient(180deg, rgba(2, 21, 42, 0.06) 0%, rgba(8, 19, 16, 0.03) 40%, rgba(5, 24, 15, 0.1) 100%);
        }

        #ui-overlay {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 50;
            box-sizing: border-box;
            max-width: 100vw;
            padding: calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 14px 14px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            pointer-events: none;
        }

        .hud-box,
        .hud-btn,
        .store-panel,
        .inventory-panel,
        .prop-preview-panel {
            pointer-events: auto;
            box-sizing: border-box;
            border: 1px solid var(--hud-border);
            border-radius: var(--app-panel-radius);
            box-shadow: var(--panel-shadow);
            position: relative;
        }

        .hud-box {
            background: var(--hud-bg);
            color: var(--hud-text);
            font-family: var(--hud-font);
            font-size: clamp(15px, 1.4vw, 20px);
            font-weight: 700;
            letter-spacing: 0.02em;
            padding: 10px 14px;
            min-width: clamp(120px, 18vw, 170px);
            text-align: center;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--app-panel-radius);
        }

        .hud-btn {
            background: var(--btn-bg);
            color: var(--hud-text);
            font-family: var(--btn-font);
            font-size: clamp(12px, 1.1vw, 15px);
            font-weight: var(--app-btn-font-weight);
            line-height: 1.1;
            padding: 11px 16px;
            min-width: clamp(132px, 18vw, 176px);
            min-height: 43px;
            cursor: pointer;
            transition: transform 180ms cubic-bezier(0.34, 1.56, 0.64, 1), filter 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
            text-transform: none;
            letter-spacing: 0.02em;
            justify-content: center;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            border: 1px solid var(--btn-border);
            overflow: hidden;
            border-radius: var(--app-btn-radius);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .hud-btn .btn-icon {
            font-size: 15px;
            text-shadow: 0 0 9px rgba(125, 241, 255, 0.7);
        }

        .hud-btn::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0));
            opacity: 0.12;
            pointer-events: none;
            transition: opacity 180ms ease;
        }

        .hud-btn::after {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: inherit;
            border: 1px solid rgba(255, 255, 255, 0.12);
            pointer-events: none;
        }

        .prop-preview-overlay {
            position: fixed;
            inset: 0;
            opacity: 0;
            pointer-events: none;
            z-index: 45;
            transition: opacity 170ms ease;
            overflow: hidden;
        }

        .prop-preview-overlay::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(14, 31, 61, 0.18);
            pointer-events: none;
            opacity: 0;
            transition: opacity 170ms ease;
        }

        .prop-preview-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .prop-preview-overlay.open::before {
            opacity: 1;
        }

        @supports not (backdrop-filter: blur(1px)) {
            .prop-preview-overlay {
                background: rgba(14, 31, 61, 0.32);
            }

            .prop-preview-overlay::before {
                background: rgba(14, 31, 61, 0.32);
                opacity: 0;
            }

            .prop-preview-overlay.open::before {
                opacity: 1;
            }
        }

        .hud-btn:hover,
        .hud-btn:focus-visible {
            background: var(--btn-hover);
            transform: translateY(var(--app-btn-lift));
            outline: none;
            box-shadow: 0 12px 24px rgba(79, 70, 229, 0.38);
            border-color: rgba(165, 180, 252, 0.84);
        }

        .hud-btn:hover::before,
        .hud-btn:focus-visible::before {
            opacity: 0.32;
        }

        .inventory-icon-btn {
            position: fixed;
            top: calc(var(--score-top-anchor) + var(--score-height) + var(--score-inventory-gap));
            left: var(--hud-left-anchor);
            width: clamp(126px, 16.5vw, 174px);
            height: clamp(126px, 16.5vw, 174px);
            padding: 0;
            border: 0;
            border-radius: 14px;
            background: transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 60;
            transition: transform 160ms ease, filter 160ms ease, box-shadow 160ms ease;
            pointer-events: auto;
            isolation: isolate;
        }

        #score-box {
            position: fixed;
            top: var(--score-top-anchor);
            left: var(--hud-left-anchor);
            z-index: 63;
            box-sizing: border-box;
            min-width: clamp(120px, 14vw, 168px);
            height: var(--score-height);
            padding: 0 clamp(14px, 1.8vw, 22px);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: var(--btn-font);
            font-size: clamp(16px, 2vw, 23px);
            font-weight: 800;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: #fff1c9;
            -webkit-text-stroke: 1.2px rgba(74, 38, 14, 0.92);
            paint-order: stroke fill;
            text-shadow:
                0 2px 0 rgba(102, 49, 18, 0.88),
                0 0 12px rgba(255, 245, 212, 0.72),
                0 6px 12px rgba(0, 0, 0, 0.34);
            border: 2px solid #ffd89a;
            border-radius: 14px;
            background: linear-gradient(155deg, #ffd7a3 0%, #ffab61 46%, #c97a3c 100%);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.34), 0 0 0 2px #ffd08a, 0 0 0 5px rgba(98, 55, 24, 0.62), 0 18px 30px rgba(0, 0, 0, 0.24);
            pointer-events: none;
            overflow: hidden;
        }

        #score-box::before {
            content: "";
            position: absolute;
            left: 2px;
            right: 2px;
            top: 2px;
            height: 48%;
            border-radius: 12px 12px 8px 8px;
            background: linear-gradient(180deg, rgba(255, 248, 235, 0.6), rgba(255, 248, 235, 0));
            pointer-events: none;
        }

        #score-box::after {
            content: "";
            position: absolute;
            inset: 3px;
            border-radius: 11px;
            border: 1px solid rgba(255, 228, 186, 0.56);
            pointer-events: none;
        }

        .inventory-icon-btn::before {
            content: "";
            position: absolute;
            left: 14%;
            right: 14%;
            bottom: 12%;
            height: 28%;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.24) 0%, rgba(0, 0, 0, 0.05) 70%, rgba(0, 0, 0, 0) 100%);
            filter: blur(6px);
            transform: translateY(7px);
            pointer-events: none;
            z-index: 0;
        }

        .inventory-icon-btn img {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.24));
            user-select: none;
            -webkit-user-drag: none;
        }

        .inventory-icon-btn:hover,
        .inventory-icon-btn:focus-visible {
            transform: translateY(-2px) scale(1.03);
            filter: saturate(1.07) brightness(1.05);
            outline: none;
            box-shadow: 0 0 0 3px rgba(191, 219, 254, 0.58);
        }

        .inventory-icon-btn:active {
            transform: translateY(0) scale(0.98);
        }

        #mystery-toggle {
            border: 2px solid #ffe484;
            background: linear-gradient(145deg, #ff7b00, #ff3c00);
            text-shadow: 0 2px 0 rgba(130, 35, 0, 0.75);
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.42), 0 0 0 2px #ffd966, 0 0 0 4px #b45f06, 0 16px 24px rgba(0, 0, 0, 0.45);
            animation: mysteryPulse 1.65s ease-in-out infinite;
        }

        #mystery-toggle::before {
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0));
        }

        #mystery-toggle:hover,
        #mystery-toggle:focus-visible {
            transform: translateY(-2px);
            border-color: #ffeb99;
            background: linear-gradient(145deg, #ff9500, #ff4d00);
            box-shadow: 0 14px 24px rgba(0, 0, 0, 0.5), 0 0 0 4px #ffeb99, 0 0 0 8px #b45f06, 0 20px 32px rgba(0, 0, 0, 0.5);
        }

        #mystery-toggle:disabled {
            animation: none;
            filter: saturate(0.7) brightness(0.92);
        }

        @keyframes mysteryPulse {
            0% {
                box-shadow: 0 10px 18px rgba(0, 0, 0, 0.42), 0 0 0 2px #ffd966, 0 0 0 4px #b45f06, 0 16px 24px rgba(0, 0, 0, 0.45);
            }
            50% {
                box-shadow: 0 14px 24px rgba(0, 0, 0, 0.5), 0 0 0 4px #ffeb99, 0 0 0 8px #b45f06, 0 20px 32px rgba(0, 0, 0, 0.5);
            }
            100% {
                box-shadow: 0 10px 18px rgba(0, 0, 0, 0.42), 0 0 0 2px #ffd966, 0 0 0 4px #b45f06, 0 16px 24px rgba(0, 0, 0, 0.45);
            }
        }

        .store-panel,
        .inventory-panel {
            width: min(360px, 86vw);
            background: var(--hud-panel-bg);
            color: var(--hud-text);
            padding: 14px;
            display: none;
            gap: 8px;
            max-height: min(70vh, 500px);
            overflow: hidden;
            grid-template-columns: 1fr;
            animation: panelRevealEdge 160ms cubic-bezier(0.19, 1, 0.22, 1) forwards;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .store-panel {
            max-height: min(70vh, 500px);
        }

        .inventory-panel {
            position: fixed;
            top: calc(clamp(6px, 1.6vh, 20px) + env(safe-area-inset-top));
            left: calc(clamp(8px, 2vw, 32px) + env(safe-area-inset-left));
            right: calc(clamp(8px, 2vw, 32px) + env(safe-area-inset-right));
            width: auto;
            max-width: none;
            max-height: min(36vh, 380px);
            height: min(36vh, 380px);
            grid-template-rows: auto auto auto minmax(0, 1fr);
            padding: clamp(10px, 1.4vw, 16px);
            gap: 10px;
            box-shadow: none;
        }

        .store-panel.open,
        .inventory-panel.open {
            display: grid;
        }

        .store-title {
            margin: 2px 0 4px;
            font-family: var(--btn-font);
            font-size: clamp(13px, 1.4vw, 18px);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 700;
            color: #a78bfa;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .store-title::before {
            content: "✦";
            color: #ffd47d;
            font-size: 16px;
            line-height: 1;
            text-shadow: 0 0 10px rgba(255, 204, 107, 0.6);
        }

        .inventory-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .inventory-heading {
            display: grid;
            gap: 2px;
            min-width: 0;
        }

        .store-subtitle {
            margin: 2px 0 4px;
            font-family: var(--hud-font);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--app-text-muted);
        }

        .inventory-close-btn {
            border: 1px solid rgba(165, 180, 252, 0.56);
            border-radius: var(--app-btn-radius);
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.92), rgba(15, 23, 42, 0.9));
            color: #e9f7ff;
            font-family: var(--btn-font);
            min-width: 28px;
            min-height: 28px;
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            cursor: pointer;
            line-height: 1;
            padding: 0;
            margin-left: auto;
        }

        .inventory-close-btn:hover,
        .inventory-close-btn:focus-visible {
            background: linear-gradient(180deg, rgba(99, 102, 241, 0.95), rgba(79, 70, 229, 0.92));
            outline: none;
        }

        .inventory-title::before {
            content: "🎒";
            color: #9ed4ff;
            font-size: 15px;
            line-height: 1;
            text-shadow: 0 0 8px rgba(113, 216, 255, 0.48);
        }

        .inventory-list {
            display: grid;
            gap: 8px;
            min-height: 0;
            max-height: none;
            overflow-y: auto;
            padding-right: 4px;
            scrollbar-width: thin;
            scrollbar-color: rgba(120, 227, 255, 0.6) rgba(4, 15, 29, 0.4);
        }

        .inventory-category-tabs {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 6px;
            margin-bottom: 4px;
            grid-auto-rows: minmax(38px, auto);
        }

        .inventory-category-btn {
            min-height: 38px;
            font-size: 12px;
        }

        .inventory-empty {
            margin: 2px 0 0;
            font-size: 13px;
            line-height: 1.45;
            color: rgba(226, 232, 240, 0.72);
            text-align: center;
            padding: 8px 6px;
            border: 1px dashed rgba(148, 163, 184, 0.35);
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.32);
        }

        .inventory-item {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 10px;
            padding: 11px 12px;
            border: 1px solid rgba(148, 163, 184, 0.44);
            border-radius: 12px;
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.88), rgba(15, 23, 42, 0.78));
        }

        .inventory-item.active {
            border-color: rgba(186, 230, 253, 0.9);
            background: linear-gradient(180deg, rgba(59, 130, 246, 0.46), rgba(29, 78, 216, 0.36));
            box-shadow: inset 0 0 0 1px rgba(191, 219, 254, 0.5);
        }

.inventory-item-label {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #f8fafc;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.01em;
        }

.inventory-item-label-wrap {
            min-width: 0;
            display: inline-flex;
            align-items: center;
            gap: 9px;
        }

.inventory-item-thumb {
            width: 22px;
            height: 22px;
            border-radius: 7px;
            flex: 0 0 auto;
            background: linear-gradient(180deg, rgba(129, 140, 248, 0.2), rgba(79, 70, 229, 0.16));
            border: 1px solid rgba(191, 219, 254, 0.4);
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: rgba(226, 232, 240, 0.88);
            font-size: 9px;
            font-family: var(--btn-font);
            text-transform: uppercase;
            letter-spacing: 0.09em;
        }

.inventory-item-thumb img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .inventory-item-actions {
            display: inline-flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .inventory-action-btn {
            border: 1px solid rgba(148, 163, 184, 0.52);
            border-radius: 999px;
            min-height: 34px;
            padding: 5px 11px;
            font-family: var(--btn-font);
            font-size: 12px;
            font-weight: 700;
            color: #e2e8f0;
            background: linear-gradient(180deg, rgba(51, 65, 85, 0.92), rgba(15, 23, 42, 0.9));
            cursor: pointer;
            transition: transform 140ms ease, border-color 140ms ease, background-color 160ms ease;
        }

        .inventory-action-btn:hover,
        .inventory-action-btn:focus-visible {
            outline: none;
            transform: translateY(-1px);
            border-color: rgba(167, 139, 250, 0.78);
            background: linear-gradient(180deg, rgba(99, 102, 241, 0.95), rgba(79, 70, 229, 0.92));
        }

        .inventory-action-btn.equip {
            background: linear-gradient(180deg, rgba(26, 129, 125, 0.95), rgba(14, 93, 91, 0.92));
            border-color: rgba(125, 247, 255, 0.55);
        }

        .inventory-action-btn.equip:hover,
        .inventory-action-btn.equip:focus-visible {
            background: linear-gradient(180deg, rgba(34, 211, 238, 0.95), rgba(14, 165, 233, 0.9));
            border-color: rgba(186, 230, 253, 0.95);
        }

        .inventory-action-btn:disabled {
            cursor: default;
            opacity: 0.72;
            filter: saturate(0.7);
            transform: none;
        }

        .store-content {
            display: grid;
            gap: 8px;
            min-height: 0;
        }

        .category-tabs {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 6px;
            margin-bottom: 2px;
        }

        .category-btn {
            min-height: 34px;
            border: 1px solid rgba(148, 163, 184, 0.44);
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.78), rgba(15, 23, 42, 0.82));
            color: #e2e8f0;
            padding: 5px 8px;
            font-size: 11px;
            font-weight: 700;
            font-family: var(--btn-font);
            letter-spacing: 0.02em;
            border-radius: 999px;
            line-height: 1.1;
            cursor: pointer;
            text-transform: none;
            transition: transform 160ms ease, border-color 140ms ease, background-color 160ms ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .category-btn:hover,
        .category-btn:focus-visible {
            background: linear-gradient(180deg, rgba(99, 102, 241, 0.94), rgba(79, 70, 229, 0.92));
            border-color: rgba(167, 139, 250, 0.72);
            outline: none;
            transform: translateY(-1px);
        }

        .category-btn:focus-visible {
            box-shadow: 0 0 0 2px rgba(167, 139, 250, 0.5);
        }

        .category-btn.active {
            background: linear-gradient(180deg, #818cf8, #6366f1);
            border-color: rgba(199, 210, 254, 1);
            color: #f8fafc;
        }

        .item-grid {
            display: grid;
            gap: 8px;
            max-height: min(39vh, 300px);
            overflow-y: auto;
            padding-right: 4px;
            margin: 0;
        }

        .item-btn {

        function createSkyDome() {
            const geometry = new THREE.SphereGeometry(90, 40, 28);
            const material = new THREE.ShaderMaterial({
                side: THREE.BackSide,
                uniforms: {
                    topColor: { value: new THREE.Color(0x4da4ff) },
                    midColor: { value: new THREE.Color(0x9cdaff) },
                    bottomColor: { value: new THREE.Color(0xd8f4ff) }
                },
                vertexShader: `
                    varying vec3 vWorldPosition;
                    void main() {
                        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                        vWorldPosition = worldPosition.xyz;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec3 vWorldPosition;
                    uniform vec3 topColor;
                    uniform vec3 midColor;
                    uniform vec3 bottomColor;
                    void main() {
                        float h = normalize(vWorldPosition + vec3(0.0, 28.0, 0.0)).y;
                        vec3 colorA = mix(bottomColor, midColor, smoothstep(-0.25, 0.3, h));
                        vec3 colorB = mix(midColor, topColor, smoothstep(0.15, 0.9, h));
                        vec3 finalColor = mix(colorA, colorB, smoothstep(0.0, 1.0, h));
                        gl_FragColor = vec4(finalColor, 1.0);
                    }
                `
            });
            const dome = new THREE.Mesh(geometry, material);
            dome.position.y = 4;
            return dome;
        }
        worldGroup.add(createSkyDome());

        function createSunSprite() {
            const canvas = document.createElement('canvas');

            g.addColorStop(0.45, 'rgba(255,240,190,0.35)');
            g.addColorStop(1, 'rgba(255,220,170,0)');

            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 512, 512);

            const tex = new THREE.CanvasTexture(canvas);
            const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
            const sprite = new THREE.Sprite(mat);
            sprite.position.set(18, 20, -36);
            sprite.scale.set(11.5, 11.5, 1);
            return sprite;

        const sunSprite = createSunSprite();

        function createCloudTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            for (let i = 0; i < 22; i++) {
                const x = Math.random() * canvas.width;
                const y = 90 + Math.random() * 320;
                const r = 45 + Math.random() * 80;
                const alpha = 0.12 + Math.random() * 0.18;
                const grad = ctx.createRadialGradient(x, y, r * 0.2, x, y, r);
                grad.addColorStop(0, `rgba(255,255,255,${alpha})`);
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.needsUpdate = true;
            return tex;
        }

        const cloudTexture = createCloudTexture();
        const cloudPlanes = [];
        for (let i = 0; i < 6; i++) {
            const cloud = new THREE.Mesh(
                new THREE.PlaneGeometry(16 + Math.random() * 10, 7 + Math.random() * 4),

            );
            cloud.position.set(-20 + i * 8 + Math.random() * 3, 12 + Math.random() * 4, -42 - i * 1.2);
            cloud.rotation.y = 0.06;

            cloudPlanes.push({ mesh: cloud, speed: 0.06 + Math.random() * 0.04 });

        function createGroundTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            const gradient = ctx.createLinearGradient(0, 0, 0, 1024);
            gradient.addColorStop(0, '#9fd05c');
            gradient.addColorStop(0.5, '#85bf4d');
            gradient.addColorStop(1, '#6ca53c');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 1024, 1024);

            for (let i = 0; i < 1800; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 1024;
                const s = 1 + Math.random() * 3;
                ctx.fillStyle = Math.random() > 0.5 ? 'rgba(175,220,100,0.3)' : 'rgba(95,145,50,0.35)';
                ctx.fillRect(x, y, s, s);
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(6, 5);
            return tex;

        const ground = new THREE.Mesh(

        worldGroup.add(createBuilding());

        function createTree() {
            const tree = new THREE.Group();

            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.2, 0.28, 3.5, 8),
                new THREE.MeshStandardMaterial({ color: 0x6c4b2c, roughness: 0.95 })

        const treeGroup = new THREE.Group();

        const grassBlades = [];

            grassBlades.push({

        // Floating pollen / tiny light particles
        const pollenGeometry = new THREE.BufferGeometry();
        const pollenCount = 240;
        const pollenPos = new Float32Array(pollenCount * 3);
        for (let i = 0; i < pollenCount; i++) {
            pollenPos[i * 3] = (Math.random() - 0.5) * 30;

        pollenGeometry.setAttribute('position', new THREE.BufferAttribute(pollenPos, 3));
        const pollenDotTexture = (() => {
            const canvas = document.createElement('canvas');

        // --- HANGING MYSTERY SCROLL (3D clickable activator) ---

        const mysteryRopeTmpDir = new THREE.Vector3();

        const mysteryScrollHitLocalProbe = new THREE.Vector3();
