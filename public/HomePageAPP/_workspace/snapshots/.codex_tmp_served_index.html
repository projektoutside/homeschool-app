        function createMysteryScrollTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            const baseGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            baseGradient.addColorStop(0, '#ffe9b3');
            baseGradient.addColorStop(0.52, '#ffb353');
            baseGradient.addColorStop(1, '#ff5b1f');
            ctx.fillStyle = baseGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < 1900; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const s = 0.4 + Math.random() * 2.2;
                const tone = 120 + Math.floor(Math.random() * 90);
                const alpha = 0.03 + Math.random() * 0.06;
                ctx.fillStyle = `rgba(${Math.min(255, tone + 54)}, ${Math.min(255, tone + 6)}, ${Math.max(0, tone - 78)}, ${alpha})`;
                ctx.fillRect(x, y, s, s);
            }

            const edgeGradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
            edgeGradient.addColorStop(0, 'rgba(180,95,6,0.44)');
            edgeGradient.addColorStop(0.08, 'rgba(180,95,6,0)');
            edgeGradient.addColorStop(0.92, 'rgba(180,95,6,0)');
            edgeGradient.addColorStop(1, 'rgba(180,95,6,0.44)');
            ctx.fillStyle = edgeGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Layered border stack gives the scroll a stronger, raised "pop" frame.
            ctx.save();
            ctx.shadowColor = 'rgba(86, 20, 0, 0.62)';
            ctx.shadowBlur = 18;
            ctx.shadowOffsetY = 3;
            ctx.strokeStyle = 'rgba(110, 24, 0, 0.95)';
            ctx.lineWidth = 16;
            ctx.strokeRect(13, 13, canvas.width - 26, canvas.height - 26);
            ctx.restore();

            ctx.strokeStyle = 'rgba(255, 208, 102, 0.98)';
            ctx.lineWidth = 8.5;
            ctx.strokeRect(22, 22, canvas.width - 44, canvas.height - 44);

            ctx.strokeStyle = 'rgba(156, 43, 0, 0.9)';
            ctx.lineWidth = 4.8;
            ctx.strokeRect(30, 30, canvas.width - 60, canvas.height - 60);

            ctx.strokeStyle = 'rgba(255, 242, 194, 0.9)';
            ctx.lineWidth = 2.4;
            ctx.strokeRect(36, 36, canvas.width - 72, canvas.height - 72);

            const titleText = 'Mystery Box';
            const costText = ' - 100 pts ';
            const centerX = canvas.width * 0.5;
            const titleY = canvas.height * 0.4;
            const dividerY = canvas.height * 0.57;
            const costY = canvas.height * 0.73;
            const fitFontPx = (text, weight, family, maxPx, minPx, maxWidth) => {
                let px = maxPx;
                for (; px >= minPx; px--) {
                    ctx.font = `${weight} ${px}px ${family}`;
                    if (ctx.measureText(text).width <= maxWidth) break;
                }
                return Math.max(minPx, px);
            };
            const titleFontPx = fitFontPx(titleText, 700, '"Fredoka", "Nunito", sans-serif', 150, 86, 860);
            const costFontPx = fitFontPx(costText, 800, '"Nunito", "Fredoka", sans-serif', 112, 58, 760);

            ctx.save();
            ctx.strokeStyle = 'rgba(255, 217, 102, 0.72)';
            ctx.lineWidth = 3.4;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(centerX - 316, dividerY);
            ctx.lineTo(centerX - 120, dividerY);
            ctx.moveTo(centerX + 120, dividerY);
            ctx.lineTo(centerX + 316, dividerY);
            ctx.stroke();
            ctx.fillStyle = 'rgba(130, 35, 0, 0.56)';
            ctx.beginPath();
            ctx.arc(centerX - 98, dividerY, 7, 0, Math.PI * 2);
            ctx.arc(centerX + 98, dividerY, 7, 0, Math.PI * 2);
            ctx.fill();

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.lineJoin = 'round';
            ctx.miterLimit = 2;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.65)';
            ctx.shadowBlur = 16;
            ctx.shadowOffsetY = 5;

            const titleGradient = ctx.createLinearGradient(0, titleY - 42, 0, titleY + 42);
            titleGradient.addColorStop(0, '#fff8dc');
            titleGradient.addColorStop(1, '#ffe484');
            ctx.fillStyle = titleGradient;
            ctx.font = `700 ${titleFontPx}px "Fredoka", "Nunito", sans-serif`;
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.92)';
            ctx.lineWidth = Math.max(6, titleFontPx * 0.075);
            ctx.strokeText(titleText, centerX, titleY);
            ctx.strokeStyle = 'rgba(130, 35, 0, 0.9)';
            ctx.lineWidth = Math.max(3.2, titleFontPx * 0.04);
            ctx.strokeText(titleText, centerX, titleY);
            ctx.fillText(titleText, centerX, titleY);

            ctx.fillStyle = '#ffeb99';
            ctx.font = `800 ${costFontPx}px "Nunito", "Fredoka", sans-serif`;
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.92)';
            ctx.lineWidth = Math.max(4.6, costFontPx * 0.075);
            ctx.strokeText(costText, centerX, costY);
            ctx.strokeStyle = 'rgba(130, 35, 0, 0.95)';
            ctx.lineWidth = Math.max(2.4, costFontPx * 0.035);
            ctx.strokeText(costText, centerX, costY);
            ctx.fillText(costText, centerX, costY);
            ctx.restore();

            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy?.() || 1);
            tex.needsUpdate = true;
            return tex;
        }

        function createMysteryRopeTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 176;
            canvas.height = 1536;
            const ctx = canvas.getContext('2d');

            const bodyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bodyGradient.addColorStop(0, '#e7d4b3');
            bodyGradient.addColorStop(0.42, '#ccb086');
            bodyGradient.addColorStop(1, '#98714d');
            ctx.fillStyle = bodyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const widthShade = ctx.createLinearGradient(0, 0, canvas.width, 0);
            widthShade.addColorStop(0, 'rgba(58, 33, 16, 0.34)');
            widthShade.addColorStop(0.2, 'rgba(58, 33, 16, 0.08)');
            widthShade.addColorStop(0.5, 'rgba(255, 246, 224, 0.14)');
            widthShade.addColorStop(0.8, 'rgba(58, 33, 16, 0.08)');
            widthShade.addColorStop(1, 'rgba(58, 33, 16, 0.34)');
            ctx.fillStyle = widthShade;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Interleaved strands read as a woven rope body instead of a flat strip.
            const strandCount = 20;
            for (let strand = 0; strand < strandCount; strand++) {
                const phase = (strand / strandCount) * Math.PI * 2;
                const center = canvas.width * 0.5 + (strand - (strandCount - 1) * 0.5) * 3.4;
                const amp = 6.2 + (strand % 4) * 0.95;
                const highlight = strand % 2 === 0;
                ctx.strokeStyle = highlight ? 'rgba(255, 245, 224, 0.2)' : 'rgba(77, 49, 27, 0.2)';
                ctx.lineWidth = highlight ? 1.9 : 1.7;
                ctx.beginPath();
                for (let y = -3; y <= canvas.height + 3; y += 2) {
                    const u = y / canvas.height;
                    const x = center
                        + Math.sin(u * Math.PI * 14 + phase) * amp
                        + Math.sin(u * Math.PI * 33 + phase * 0.78) * 1.05;
                    if (y <= 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            // Subtle rotating helix shading keeps the rope organic without visible repeated banding.
            for (let y = 0; y <= canvas.height; y += 4) {
                const u = y / canvas.height;
                const helix = Math.sin(u * Math.PI * 30 + Math.sin(u * Math.PI * 7) * 0.5);
                const center = canvas.width * 0.5 + helix * 9.2;
                const stripWidth = 14 + Math.sin(u * Math.PI * 13 + 0.8) * 2.6;
                ctx.fillStyle = `rgba(60, 35, 17, ${0.022 + Math.max(0, helix) * 0.028})`;
                ctx.fillRect(center - stripWidth * 0.5, y, stripWidth, 3);
                ctx.fillStyle = `rgba(255, 245, 224, ${0.015 + Math.max(0, -helix) * 0.03})`;
                ctx.fillRect(center - stripWidth * 0.42, y, stripWidth * 0.84, 2);
            }

            for (let i = 0; i < 8600; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const fiber = Math.random();
                const alpha = fiber > 0.7 ? 0.08 + Math.random() * 0.08 : 0.03 + Math.random() * 0.06;
                const tone = 72 + Math.floor(Math.random() * 56);
                ctx.fillStyle = `rgba(${tone}, ${Math.max(42, tone - 14)}, ${Math.max(24, tone - 32)}, ${alpha})`;
                if (fiber > 0.76) {
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate((Math.random() - 0.5) * 0.75);
                    ctx.fillRect(-0.6, -0.4, 2.4, 0.8);
                    ctx.restore();
                } else {
                    ctx.fillRect(x, y, 1, 1);
                }
            }

            const sideVignette = ctx.createLinearGradient(0, 0, canvas.width, 0);
            sideVignette.addColorStop(0, 'rgba(32, 16, 7, 0.28)');
            sideVignette.addColorStop(0.14, 'rgba(32, 16, 7, 0.06)');
            sideVignette.addColorStop(0.5, 'rgba(0, 0, 0, 0)');
            sideVignette.addColorStop(0.86, 'rgba(32, 16, 7, 0.06)');
            sideVignette.addColorStop(1, 'rgba(32, 16, 7, 0.28)');
            ctx.fillStyle = sideVignette;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(1.12, 8.4);
            tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy?.() || 1);
            tex.needsUpdate = true;
            return tex;
        }

        function createMysteryHangingScroll() {
            const root = new THREE.Group();
            root.position.set(0, 8.1, 3.4);

            const anchorKnob = new THREE.Mesh(
                new THREE.CylinderGeometry(0.14, 0.14, 0.56, 22),
                new THREE.MeshStandardMaterial({ color: 0xd3c8b0, roughness: 0.78, metalness: 0.14 })
            );
            anchorKnob.rotation.z = Math.PI * 0.5;
            root.add(anchorKnob);

            const swayRig = new THREE.Group();
            root.add(swayRig);

            const stringBaseLength = Math.max(3.2, mysteryScrollState.stringBaseLength || 6.1);
            const ropeTexture = createMysteryRopeTexture();
            const stringMat = new THREE.MeshStandardMaterial({
                color: 0xdfc7a2,
                map: ropeTexture,
                bumpMap: ropeTexture,
                bumpScale: 0.018,
                roughness: 0.9,
                metalness: 0.0
            });
            const stringMesh = new THREE.Mesh(
                new THREE.CylinderGeometry(0.096, 0.088, stringBaseLength, 34, 26, true),
                stringMat
            );
            stringMesh.position.set(0, -stringBaseLength * 0.5, 0);
            swayRig.add(stringMesh);

            const knot = new THREE.Mesh(
                new THREE.SphereGeometry(0.088, 16, 16),
                new THREE.MeshStandardMaterial({ color: 0xd3b98f, roughness: 0.82, metalness: 0.02 })
            );
            knot.position.set(0, -stringBaseLength, 0);
            swayRig.add(knot);

            const scrollScale = mysteryScrollState.scrollScale;
            const scrollTopRollLocalY = mysteryScrollState.scrollTopRollLocalY;
            const scrollAttachGap = mysteryScrollState.scrollAttachGap;
            const scrollRig = new THREE.Group();
            scrollRig.scale.setScalar(scrollScale);
            scrollRig.position.set(0, knot.position.y - (scrollTopRollLocalY * scrollScale) - scrollAttachGap, 0);
            swayRig.add(scrollRig);

            const parchmentTexture = createMysteryScrollTexture();
            const sheetGeometry = new THREE.PlaneGeometry(4.85, 2.0, 28, 8);
            const pos = sheetGeometry.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const nx = THREE.MathUtils.clamp(x / 2.425, -1, 1);
                const edgeCurl = -Math.pow(Math.abs(nx), 1.6) * 0.18;
                const ripple = Math.sin(nx * Math.PI * 2.4) * 0.012;
                pos.setZ(i, edgeCurl + ripple);
            }
            pos.needsUpdate = true;
            sheetGeometry.computeVertexNormals();

            const sheet = new THREE.Mesh(
                sheetGeometry,
                new THREE.MeshStandardMaterial({
                    map: parchmentTexture,
                    roughness: 0.9,
                    metalness: 0.02,
                    side: THREE.DoubleSide
                })
            );
            scrollRig.add(sheet);

            const rollMaterial = new THREE.MeshStandardMaterial({
                color: 0xbf8e59,
                roughness: 0.74,
                metalness: 0.05
            });
            const topRoll = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.11, 4.92, 22), rollMaterial);
            topRoll.rotation.z = Math.PI * 0.5;
            topRoll.position.set(0, 1.03, 0.09);
            scrollRig.add(topRoll);

            const bottomRoll = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.11, 4.92, 22), rollMaterial);
            bottomRoll.rotation.z = Math.PI * 0.5;
            bottomRoll.position.set(0, -1.03, 0.09);
            scrollRig.add(bottomRoll);

            const dragHitPlane = new THREE.Mesh(
                new THREE.PlaneGeometry(5.36, 2.76),
                new THREE.MeshBasicMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0,
                    side: THREE.DoubleSide,
                    depthWrite: false
                })
            );
            dragHitPlane.position.set(0, 0, 0.16);
            dragHitPlane.renderOrder = 999;
            scrollRig.add(dragHitPlane);

            return {
                root,
                swayRig,
                scrollRig,
                dragTargets: [dragHitPlane],
                stringMesh,
                knot,
                stringBaseLength,
                scrollScale,
                scrollTopRollLocalY,
                scrollAttachGap
            };
        }

        function getMysteryScrollInventoryClearanceNdcY() {
            const inventoryIcon = document.getElementById('inventory-toggle');
            if (!inventoryIcon?.getBoundingClientRect) return null;
            const rect = inventoryIcon.getBoundingClientRect();
            if (!rect || !Number.isFinite(rect.bottom)) return null;
            const viewportH = Math.max(1, window.innerHeight);
            const clearGapPx = Math.max(8, mysteryScrollState.inventoryClearanceGapPx || 0);
            const targetScreenY = rect.bottom + clearGapPx;
            const ndcY = 1 - (targetScreenY / viewportH) * 2;
            return THREE.MathUtils.clamp(ndcY, -0.92, 0.88);
        }

        function getMysteryScrollTopScreenY() {
            const scrollRig = mysteryScrollState.scrollRig;
            if (!scrollRig?.localToWorld) return null;
            const topProbeY = (mysteryScrollState.scrollTopRollLocalY || 1.03) + 0.16;
            mysteryScrollTopProbe.set(0, topProbeY, 0);
            scrollRig.localToWorld(mysteryScrollTopProbe);
            mysteryScrollTopProbe.project(camera);
            if (!Number.isFinite(mysteryScrollTopProbe.x) || !Number.isFinite(mysteryScrollTopProbe.y) || !Number.isFinite(mysteryScrollTopProbe.z)) {
                return null;
            }
            return ((-mysteryScrollTopProbe.y + 1) * 0.5) * window.innerHeight;
        }

        function resolveMysteryScrollInventoryClearanceNdcY(ndcX, ndcY) {
            const inventoryIcon = document.getElementById('inventory-toggle');
            const root = mysteryScrollState.root;
            const scrollRig = mysteryScrollState.scrollRig;
            if (!inventoryIcon?.getBoundingClientRect || !root || !scrollRig) return ndcY;

            const rect = inventoryIcon.getBoundingClientRect();
            if (!rect || !Number.isFinite(rect.bottom)) return ndcY;

            const viewportH = Math.max(1, window.innerHeight);
            const minTopY = rect.bottom + Math.max(8, mysteryScrollState.inventoryClearanceGapPx || 0);
            mysteryScrollRootRestore.copy(root.position);
            placeMysteryScrollByNdc(ndcX, ndcY, false);
            root.updateWorldMatrix(true, true);

            let resolvedNdcY = ndcY;
            for (let i = 0; i < 2; i++) {
                const topScreenY = getMysteryScrollTopScreenY();
                if (!Number.isFinite(topScreenY) || topScreenY >= minTopY - 0.5) break;
                const deltaPx = minTopY - topScreenY;
                resolvedNdcY = THREE.MathUtils.clamp(
                    resolvedNdcY - (deltaPx / viewportH) * 2,
                    -0.92,
                    0.94
                );
                placeMysteryScrollByNdc(ndcX, resolvedNdcY, false);
                root.updateWorldMatrix(true, true);
            }

            root.position.copy(mysteryScrollRootRestore);
            root.updateWorldMatrix(true, true);
            return resolvedNdcY;
        }

        function getMysteryScrollTargetNdc() {
            const aspect = window.innerWidth / Math.max(1, window.innerHeight);
            const isPortrait = aspect < 1;
            const defaultNdcY = isPortrait ? mysteryScrollState.defaultNdcYPortrait : mysteryScrollState.defaultNdcYLandscape;
            const clearanceNdcY = getMysteryScrollInventoryClearanceNdcY();
            const loweredDefaultNdcY = Number.isFinite(clearanceNdcY)
                ? Math.min(defaultNdcY, clearanceNdcY)
                : defaultNdcY;
            const targetNdcX = mysteryScrollState.manualNdcX ?? mysteryScrollState.defaultNdcX;
            const baseNdcY = mysteryScrollState.manualNdcY ?? loweredDefaultNdcY;
            const targetNdcY = mysteryScrollState.manualNdcY === null
                ? resolveMysteryScrollInventoryClearanceNdcY(targetNdcX, baseNdcY)
                : baseNdcY;
            return {
                x: targetNdcX,
                y: targetNdcY
            };
        }

        function placeMysteryScrollByNdc(ndcX, ndcY, persist = true) {
            if (!mysteryScrollState.root) return;
            const safeNdcX = THREE.MathUtils.clamp(ndcX, -0.94, 0.94);
            const safeNdcY = THREE.MathUtils.clamp(ndcY, -0.92, 0.94);
            mysteryScrollProbe.set(safeNdcX, safeNdcY, 0.16);
            mysteryScrollProbe.unproject(camera);
            const dir = mysteryRopeTmpDir.copy(mysteryScrollProbe).sub(camera.position);
            if (!Number.isFinite(dir.x) || !Number.isFinite(dir.y) || !Number.isFinite(dir.z) || dir.lengthSq() < 1e-6) {
                dir.set(0, 0, -1);
            } else {
                dir.normalize();
            }
            const scrollWorld = camera.position.clone().addScaledVector(dir, mysteryScrollState.anchorDistance);
            const dropLength = Math.max(0, mysteryScrollState.scrollDropLength || 0);
            const anchorLift = Number.isFinite(mysteryScrollState.anchorVerticalLift)
                ? mysteryScrollState.anchorVerticalLift
                : 0;
            mysteryScrollState.root.position.set(
                scrollWorld.x,
                scrollWorld.y + dropLength + anchorLift,
                scrollWorld.z
            );
            if (persist) {
                mysteryScrollState.manualNdcX = safeNdcX;
                mysteryScrollState.manualNdcY = safeNdcY;
            }
        }

        function placeMysteryScrollByClient(clientX, clientY, persist = true) {
            const ndcX = (clientX / Math.max(1, window.innerWidth)) * 2 - 1;
            const ndcY = -(clientY / Math.max(1, window.innerHeight)) * 2 + 1;
            placeMysteryScrollByNdc(ndcX, ndcY, persist);
        }

        function getPetScreenY() {
            creatureGroup.getWorldPosition(mysteryPetScreenProbe);
            mysteryPetScreenProbe.project(camera);
            if (!Number.isFinite(mysteryPetScreenProbe.x) || !Number.isFinite(mysteryPetScreenProbe.y) || !Number.isFinite(mysteryPetScreenProbe.z)) {
                return window.innerHeight * 0.6;
            }
            return ((-mysteryPetScreenProbe.y + 1) * 0.5) * window.innerHeight;
        }

        function isClientYBelowPet(clientY, paddingPx = 0) {
            const petY = getPetScreenY();
            return clientY >= (petY + Math.max(0, paddingPx));
        }

        function getMysteryScrollScreenY() {
            if (!mysteryScrollState.scrollRig?.getWorldPosition) return null;
            mysteryScrollState.scrollRig.getWorldPosition(mysteryScrollScreenProbe);
            mysteryScrollScreenProbe.project(camera);
            if (!Number.isFinite(mysteryScrollScreenProbe.x) || !Number.isFinite(mysteryScrollScreenProbe.y) || !Number.isFinite(mysteryScrollScreenProbe.z)) {
                return null;
            }
            return ((-mysteryScrollScreenProbe.y + 1) * 0.5) * window.innerHeight;
        }

        function isMysteryScrollBelowPet(paddingPx = 0) {
            const scrollY = getMysteryScrollScreenY();
            if (!Number.isFinite(scrollY)) return false;
            return scrollY >= getPetScreenY() + Math.max(0, paddingPx);
        }

        function projectMysteryScrollDragWorld(clientX, clientY, outVec) {
            if (!mysteryScrollState.scrollRig?.getWorldPosition) return false;
            pointerNdc.x = (clientX / Math.max(1, window.innerWidth)) * 2 - 1;
            pointerNdc.y = -(clientY / Math.max(1, window.innerHeight)) * 2 + 1;
            raycaster.setFromCamera(pointerNdc, camera);
            mysteryScrollState.scrollRig.getWorldPosition(mysteryScrollScreenProbe);
            camera.getWorldDirection(mysteryScrollDragPlaneNormal);
            mysteryScrollDragPlane.setFromNormalAndCoplanarPoint(mysteryScrollDragPlaneNormal, mysteryScrollScreenProbe);
            const hit = raycaster.ray.intersectPlane(mysteryScrollDragPlane, outVec);
            if (!hit) return false;
            return Number.isFinite(outVec.x) && Number.isFinite(outVec.y) && Number.isFinite(outVec.z);
        }

        function queueMysteryScrollRollupActivation() {
            if (mysteryScrollState.visibilityPhase !== 'ready') {
                return false;
            }
            endMysteryScrollDrag();
            if (mysteryScrollState.root) {
                mysteryScrollState.rollupBaseX = mysteryScrollState.root.position.x;
                mysteryScrollState.rollupBaseY = mysteryScrollState.root.position.y;
                mysteryScrollState.rollupBaseZ = mysteryScrollState.root.position.z;
            }
            mysteryScrollState.rollupLiftCurrent = 0;
            mysteryScrollState.visibilityPhase = 'rolling_up';
            mysteryScrollState.visibilityTimer = 0;
            mysteryScrollState.activationQueued = true;
            mysteryScrollState.restoreQueued = false;
            return true;
        }

        function queueMysteryScrollReturnAfterDecision() {
            if (!mysteryScrollState.decisionPending) return;
            mysteryScrollState.decisionPending = false;
            mysteryScrollState.restoreQueued = true;
        }

        function maybeStartMysteryScrollReturn() {
            if (!mysteryScrollState.restoreQueued) return;
            if (mysteryState.phase !== 'idle') return;
            if (mysteryFlightCinematic.active) return;
            if (mysteryScrollState.visibilityPhase !== 'hidden') return;
            layoutMysteryScrollAnchor();
            if (mysteryScrollState.root) {
                mysteryScrollState.rollupBaseX = mysteryScrollState.root.position.x;
                mysteryScrollState.rollupBaseY = mysteryScrollState.root.position.y;
                mysteryScrollState.rollupBaseZ = mysteryScrollState.root.position.z;
                const returnLift = Math.max(0, mysteryScrollState.rollupLiftDistance || 0);
                mysteryScrollState.root.position.set(
                    mysteryScrollState.rollupBaseX,
                    mysteryScrollState.rollupBaseY + returnLift,
                    mysteryScrollState.rollupBaseZ
                );
                mysteryScrollState.rollupLiftCurrent = returnLift;
            }
            mysteryScrollState.restoreQueued = false;
            mysteryScrollState.visibilityPhase = 'returning';
            mysteryScrollState.visibilityTimer = 0;
            mysteryScrollState.root.visible = true;
        }

        function beginMysteryScrollDrag(clientX, clientY, pointerId = null, nowMs = performance.now(), pointerType = 'mouse') {
            if (!mysteryScrollState.root || mysteryScrollState.visibilityPhase !== 'ready') {
                return false;
            }
            if (mysteryState.phase !== 'idle' && mysteryState.phase !== 'cooldown') {
                return false;
            }
            mysteryScrollState.dragActive = true;
            mysteryScrollState.dragPointerId = pointerId;
            mysteryScrollState.dragPointerType = pointerType || null;
            mysteryScrollState.dragStartClientX = clientX;
            mysteryScrollState.dragStartClientY = clientY;
            mysteryScrollState.dragStartAbovePet = !isMysteryScrollBelowPet(4);
            mysteryScrollState.dragPassedSlop = false;
            mysteryScrollState.dragPointerOffsetNdcX = 0;
            mysteryScrollState.dragPointerOffsetNdcY = 0;
            mysteryScrollState.dragLastClientX = clientX;
            mysteryScrollState.dragLastClientY = clientY;
            mysteryScrollState.dragLastMoveMs = nowMs;
            mysteryScrollState.dragVelX = 0;
            mysteryScrollState.dragVelY = 0;
            mysteryScrollState.dragSpeedPxPerSec = 0;
            mysteryScrollState.ropePullRatio = Math.min(0.18, mysteryScrollState.ropePullRatio || 0);
            mysteryScrollState.ropeSwingTargetX = 0;
            mysteryScrollState.ropeSwingTargetZ = 0;
            return true;
        }

        function endMysteryScrollDrag() {
            const releaseVelX = Number.isFinite(mysteryScrollState.dragVelX) ? mysteryScrollState.dragVelX : 0;
            const releaseVelY = Number.isFinite(mysteryScrollState.dragVelY) ? mysteryScrollState.dragVelY : 0;
            const swingKickZ = THREE.MathUtils.clamp(-releaseVelX / Math.max(620, window.innerWidth * 0.86), -0.72, 0.72);
            const swingKickX = THREE.MathUtils.clamp(releaseVelY / Math.max(760, window.innerHeight * 1.02), -0.52, 0.62);
            mysteryScrollState.ropeSwingVelZ = THREE.MathUtils.clamp(
                (mysteryScrollState.ropeSwingVelZ || 0) + swingKickZ,
                -1.2,
                1.2
            );
            mysteryScrollState.ropeSwingVelX = THREE.MathUtils.clamp(
                (mysteryScrollState.ropeSwingVelX || 0) + swingKickX,
                -1.0,
                1.0
            );
            const downKick = THREE.MathUtils.clamp(
                releaseVelY / Math.max(860, window.innerHeight * 1.06),
                -0.4,
                1.25
            );
            if (downKick > 0) {
                mysteryScrollState.ropeStretchVel =
                    (mysteryScrollState.ropeStretchVel || 0) + downKick * Math.max(2.5, mysteryScrollState.stringBaseLength || 6.1) * 0.24;
            }
            mysteryScrollState.dragActive = false;
            mysteryScrollState.dragPointerId = null;
            mysteryScrollState.dragPointerType = null;
            mysteryScrollState.dragStartClientX = 0;
            mysteryScrollState.dragStartClientY = 0;
            mysteryScrollState.dragStartAbovePet = true;
            mysteryScrollState.dragPassedSlop = false;
            mysteryScrollState.dragPointerOffsetNdcX = 0;
            mysteryScrollState.dragPointerOffsetNdcY = 0;
            mysteryScrollState.dragLastClientX = 0;
            mysteryScrollState.dragLastClientY = 0;
            mysteryScrollState.dragLastMoveMs = 0;
            mysteryScrollState.dragVelX = 0;
            mysteryScrollState.dragVelY = 0;
            mysteryScrollState.dragSpeedPxPerSec = 0;
            mysteryScrollState.ropeSwingTargetX = 0;
            mysteryScrollState.ropeSwingTargetZ = 0;
        }

        function updateMysteryScrollDrag(clientX, clientY, nowMs = performance.now()) {
            if (!mysteryScrollState.dragActive) return false;
            if (!mysteryScrollState.dragPassedSlop) {
                const dx = clientX - mysteryScrollState.dragStartClientX;
                const dy = clientY - mysteryScrollState.dragStartClientY;
                const travel = Math.hypot(dx, dy);
                const slop = Math.max(4, mysteryScrollState.dragSlopPx || 16);
                if (travel < slop) return true;
                mysteryScrollState.dragPassedSlop = true;
            }

            const lastMoveMs = mysteryScrollState.dragLastMoveMs || nowMs;
            const dtSec = Math.max(1 / 240, (nowMs - lastMoveMs) / 1000);
            const moveX = clientX - mysteryScrollState.dragLastClientX;
            const moveY = clientY - mysteryScrollState.dragLastClientY;
            const velX = moveX / dtSec;
            const velY = moveY / dtSec;
            mysteryScrollState.dragVelX = velX;
            mysteryScrollState.dragVelY = velY;
            const dragSpeed = Math.hypot(velX, velY);
            mysteryScrollState.dragLastClientX = clientX;
            mysteryScrollState.dragLastClientY = clientY;
            mysteryScrollState.dragLastMoveMs = nowMs;
            mysteryScrollState.dragSpeedPxPerSec = THREE.MathUtils.lerp(
                mysteryScrollState.dragSpeedPxPerSec || 0,
                dragSpeed,
                0.35
            );

            let pullFromWorld = 0;
            if (projectMysteryScrollDragWorld(clientX, clientY, mysteryScrollDragWorldTarget) && mysteryScrollState.root?.getWorldPosition) {
                mysteryScrollState.root.getWorldPosition(mysteryScrollAnchorProbe);
                mysteryScrollDragRelative.copy(mysteryScrollDragWorldTarget).sub(mysteryScrollAnchorProbe);
                const downDistance = Math.max(0.16, -mysteryScrollDragRelative.y);
                const targetSwingZ = THREE.MathUtils.clamp(
                    Math.atan2(mysteryScrollDragRelative.x, downDistance),
                    -0.8,
                    0.8
                );
                const targetSwingX = THREE.MathUtils.clamp(
                    Math.atan2(-mysteryScrollDragRelative.z, downDistance),
                    -0.6,
                    0.6
                );
                mysteryScrollState.ropeSwingTargetZ = THREE.MathUtils.lerp(
                    mysteryScrollState.ropeSwingTargetZ || 0,
                    targetSwingZ,
                    0.46
                );
                mysteryScrollState.ropeSwingTargetX = THREE.MathUtils.lerp(
                    mysteryScrollState.ropeSwingTargetX || 0,
                    targetSwingX,
                    0.46
                );

                const stringBaseLength = Math.max(2, mysteryScrollState.stringBaseLength || 6.1);
                const maxStretch = stringBaseLength * 0.72;
                const scrollScale = mysteryScrollState.scrollScale || 0.5;
                const centerOffset = (mysteryScrollState.scrollTopRollLocalY || 1.03) * scrollScale + (mysteryScrollState.scrollAttachGap || 0.03);
                const desiredLength = THREE.MathUtils.clamp(
                    mysteryScrollDragRelative.length() - centerOffset,
                    stringBaseLength * 0.56,
                    stringBaseLength + maxStretch
                );
                pullFromWorld = THREE.MathUtils.clamp(
                    (desiredLength - stringBaseLength) / Math.max(1e-5, maxStretch),
                    0,
                    1
                );
            }

            const downDelta = Math.max(0, clientY - mysteryScrollState.dragStartClientY);
            const depthPullPx = Math.max(112, window.innerHeight * 0.2);
            const pullFromDepth = THREE.MathUtils.clamp(downDelta / depthPullPx, 0, 1);
            mysteryScrollState.ropePullRatio = THREE.MathUtils.clamp(
                Math.max(pullFromDepth, pullFromWorld),
                0,
                1
            );
            const minDownPx = Math.max(
                26,
                mysteryScrollState.dragActivateMinDownPx || 14,
                window.innerHeight * 0.08
            );
            const belowPaddingPx = Math.max(0, mysteryScrollState.dragActivateBelowPetPaddingPx || 12);
            const activationPullRatio = THREE.MathUtils.clamp(
                mysteryScrollState.dragActivationPullRatio || 0.76,
                0.5,
                0.98
            );
            const deepPullViewportRatio = THREE.MathUtils.clamp(
                mysteryScrollState.dragActivationDeepPullViewportRatio || 0.34,
                0.22,
                0.58
            );
            const deepPullPx = Math.max(minDownPx * 2.2, window.innerHeight * deepPullViewportRatio);
            const hardPullPx = Math.max(minDownPx * 1.6, mysteryScrollState.dragActivationHardPullPx || 82);
            const hardSpeedPxPerSec = Math.max(760, mysteryScrollState.dragActivationHardSpeedPxPerSec || 1120);
            const pulledHard = downDelta >= hardPullPx && (mysteryScrollState.dragSpeedPxPerSec || 0) >= hardSpeedPxPerSec;
            const pulledDeep = downDelta >= deepPullPx;
            const pulledEnough =
                mysteryScrollState.ropePullRatio >= activationPullRatio ||
                pulledDeep ||
                pulledHard;
            const belowPetNow =
                isMysteryScrollBelowPet(belowPaddingPx) ||
                isClientYBelowPet(clientY, belowPaddingPx);
            if (
                mysteryScrollState.dragStartAbovePet &&
                downDelta >= minDownPx &&
                pulledEnough &&
                belowPetNow
            ) {
                const started = queueMysteryScrollRollupActivation();
                return started;
            }
            return true;
        }

        function layoutMysteryScrollAnchor() {
            if (!mysteryScrollState.root) return;
            const targetNdc = getMysteryScrollTargetNdc();
            placeMysteryScrollByNdc(targetNdc.x, targetNdc.y, false);
            mysteryScrollState.rollupBaseX = mysteryScrollState.root.position.x;
            mysteryScrollState.rollupBaseY = mysteryScrollState.root.position.y;
            mysteryScrollState.rollupBaseZ = mysteryScrollState.root.position.z;
        }

        function updateMysteryScrollSway(t, dt) {
            const root = mysteryScrollState.root;
            const swayRig = mysteryScrollState.swayRig;
            const scrollRig = mysteryScrollState.scrollRig;
            const knot = mysteryScrollState.knot;
            const stringMesh = mysteryScrollState.stringMesh;
            if (!root || !swayRig || !scrollRig || !knot || !stringMesh) return;

            const safeDt = Math.min(1 / 24, Math.max(1 / 120, Number.isFinite(dt) ? dt : 1 / 60));
            if (!Number.isFinite(mysteryScrollState.visibilityTimer)) {
                mysteryScrollState.visibilityTimer = 0;
            }
            maybeStartMysteryScrollReturn();

            let retractProgress = mysteryScrollState.retractProgress || 0;
            if (!Number.isFinite(retractProgress)) {
                retractProgress = 0;
            }
            if (mysteryScrollState.visibilityPhase === 'rolling_up') {
                mysteryScrollState.visibilityTimer += safeDt;
                const rollDuration = Math.max(0.12, mysteryScrollState.rollupDuration || 0.34);
                const p = THREE.MathUtils.clamp(mysteryScrollState.visibilityTimer / rollDuration, 0, 1);
                const rollupLiftDistance = Math.max(2.5, mysteryScrollState.rollupLiftDistance || 0);
                const liftProgress = 1 - Math.pow(1 - p, 1.7);
                const lift = rollupLiftDistance * liftProgress;
                mysteryScrollState.rollupLiftCurrent = lift;
                root.position.set(
                    mysteryScrollState.rollupBaseX,
                    mysteryScrollState.rollupBaseY + lift,
                    mysteryScrollState.rollupBaseZ
                );
                retractProgress = 1 - Math.pow(1 - p, 3);
                if (p >= 1) {
                    root.visible = false;
                    mysteryScrollState.retractProgress = 1;
                    mysteryScrollState.visibilityPhase = 'hidden';
                    mysteryScrollState.visibilityTimer = 0;
                    const shouldActivate = !!mysteryScrollState.activationQueued;
                    mysteryScrollState.activationQueued = false;
                    if (shouldActivate) {
                        const started = startMysteryFlightCinematic();
                        mysteryScrollState.decisionPending = started;
                        mysteryScrollState.restoreQueued = !started;
                    } else {
                        mysteryScrollState.decisionPending = false;
                    }
                    maybeStartMysteryScrollReturn();
                    return;
                }
            } else if (mysteryScrollState.visibilityPhase === 'returning') {
                mysteryScrollState.visibilityTimer += safeDt;
                const returnDuration = Math.max(0.16, mysteryScrollState.returnDuration || 0.52);
                const p = THREE.MathUtils.clamp(mysteryScrollState.visibilityTimer / returnDuration, 0, 1);
                const returnLift = Math.max(0, mysteryScrollState.rollupLiftCurrent || mysteryScrollState.rollupLiftDistance || 0) * Math.pow(1 - p, 2);
                root.position.set(
                    mysteryScrollState.rollupBaseX,
                    mysteryScrollState.rollupBaseY + returnLift,
                    mysteryScrollState.rollupBaseZ
                );
                retractProgress = Math.pow(1 - p, 2);
                root.visible = true;
                if (p >= 1) {
                    mysteryScrollState.visibilityPhase = 'ready';
                    mysteryScrollState.visibilityTimer = 0;
                    mysteryScrollState.rollupLiftCurrent = 0;
                    root.position.set(
                        mysteryScrollState.rollupBaseX,
                        mysteryScrollState.rollupBaseY,
                        mysteryScrollState.rollupBaseZ
                    );
                    retractProgress = 0;
                }
            } else if (mysteryScrollState.visibilityPhase === 'hidden') {
                mysteryScrollState.retractProgress = 1;
                mysteryScrollState.ropePullRatio = 0;
                mysteryScrollState.ropeSwingTargetX = 0;
                mysteryScrollState.ropeSwingTargetZ = 0;
                root.visible = false;
                maybeStartMysteryScrollReturn();
                return;
            } else {
                mysteryScrollState.visibilityTimer = 0;
                mysteryScrollState.rollupLiftCurrent = 0;
                retractProgress = 0;
            }

            mysteryScrollState.retractProgress = THREE.MathUtils.clamp(retractProgress, 0, 1);
            retractProgress = mysteryScrollState.retractProgress;
            root.visible = true;

            const stringBaseLength = Math.max(2, mysteryScrollState.stringBaseLength || 6.1);
            const stringScaleY = Math.max(0.02, 1 - retractProgress * 0.98);
            const maxStretch = stringBaseLength * 0.72;
            let pullRatio = THREE.MathUtils.clamp(mysteryScrollState.ropePullRatio || 0, 0, 1);
            if (!mysteryScrollState.dragActive && pullRatio > 0) {
                pullRatio = Math.max(0, pullRatio - safeDt * 1.9);
                mysteryScrollState.ropePullRatio = pullRatio;
            }
            const dragSpeedRatio = THREE.MathUtils.clamp(
                (mysteryScrollState.dragSpeedPxPerSec || 0) / Math.max(680, window.innerHeight * 1.4),
                0,
                1
            );
            const inertialLoad = THREE.MathUtils.clamp(
                Math.abs(mysteryScrollState.ropeSwingVelX || 0) + Math.abs(mysteryScrollState.ropeSwingVelZ || 0),
                0,
                1.25
            );
            const swingStretch = inertialLoad * stringBaseLength * 0.022 * (1 - retractProgress);
            const dragStretch =
                (0.34 + dragSpeedRatio * 0.24) * pullRatio * stringBaseLength * (1 - retractProgress);
            const stretchTarget = mysteryScrollState.dragActive
                ? dragStretch + swingStretch
                : dragStretch * 0.26 + swingStretch * 0.44;
            let ropeStretch = Number.isFinite(mysteryScrollState.ropeStretch) ? mysteryScrollState.ropeStretch : 0;
            let ropeStretchVel = Number.isFinite(mysteryScrollState.ropeStretchVel) ? mysteryScrollState.ropeStretchVel : 0;
            const stretchStiffness = mysteryScrollState.dragActive ? 20.5 : 9.4;
            const stretchDamping = mysteryScrollState.dragActive ? 8.3 : 7.4;
            ropeStretchVel += (stretchTarget - ropeStretch) * stretchStiffness * safeDt;
            ropeStretchVel *= Math.exp(-stretchDamping * safeDt);
            ropeStretch += ropeStretchVel * safeDt;
            ropeStretch = THREE.MathUtils.clamp(ropeStretch, 0, maxStretch);
            mysteryScrollState.ropeStretch = ropeStretch;
            mysteryScrollState.ropeStretchVel = ropeStretchVel;

            const activeStringLength = stringBaseLength * stringScaleY + ropeStretch;
            const effectiveStringScaleY = Math.max(0.02, activeStringLength / stringBaseLength);
            const stretchRatio = maxStretch > 1e-5 ? THREE.MathUtils.clamp(ropeStretch / maxStretch, 0, 1) : 0;
            const tensionRadiusScale = Math.max(0.81, 1 - stretchRatio * 0.16);
            stringMesh.scale.set(tensionRadiusScale, effectiveStringScaleY, tensionRadiusScale);
            stringMesh.position.y = -activeStringLength * 0.5;
            knot.position.y = -activeStringLength;
            knot.visible = retractProgress < 0.998;

            const scrollScale = mysteryScrollState.scrollScale || 0.5;
            const effectiveScrollScale = Math.max(0.04, scrollScale * (1 - retractProgress * 0.94));
            const topRollY = mysteryScrollState.scrollTopRollLocalY || 1.03;
            const attachGap = mysteryScrollState.scrollAttachGap || 0.03;
            scrollRig.scale.setScalar(effectiveScrollScale);
            scrollRig.visible = retractProgress < 0.995;
            scrollRig.position.set(0, knot.position.y - topRollY * effectiveScrollScale - attachGap, 0);

            const windSeed = mysteryScrollState.windSeed || 0;
            const motionMix = 1 - retractProgress;
            const dragWindMul = mysteryScrollState.dragActive ? 0.35 : 1;
            let ropeSwingX = Number.isFinite(mysteryScrollState.ropeSwingX) ? mysteryScrollState.ropeSwingX : 0;
            let ropeSwingZ = Number.isFinite(mysteryScrollState.ropeSwingZ) ? mysteryScrollState.ropeSwingZ : 0;
            let ropeSwingVelX = Number.isFinite(mysteryScrollState.ropeSwingVelX) ? mysteryScrollState.ropeSwingVelX : 0;
            let ropeSwingVelZ = Number.isFinite(mysteryScrollState.ropeSwingVelZ) ? mysteryScrollState.ropeSwingVelZ : 0;
            const targetDragSwingX = mysteryScrollState.dragActive
                ? THREE.MathUtils.clamp(mysteryScrollState.ropeSwingTargetX || 0, -0.6, 0.6)
                : 0;
            const targetDragSwingZ = mysteryScrollState.dragActive
                ? THREE.MathUtils.clamp(mysteryScrollState.ropeSwingTargetZ || 0, -0.8, 0.8)
                : 0;
            const swingStiffness = mysteryScrollState.dragActive ? 31 : 8.6;
            const swingDamping = mysteryScrollState.dragActive ? 8.7 : 4.2;
            ropeSwingVelX += (targetDragSwingX - ropeSwingX) * swingStiffness * safeDt;
            ropeSwingVelZ += (targetDragSwingZ - ropeSwingZ) * swingStiffness * safeDt;
            ropeSwingVelX *= Math.exp(-swingDamping * safeDt);
            ropeSwingVelZ *= Math.exp(-swingDamping * safeDt);
            ropeSwingX += ropeSwingVelX * safeDt;
            ropeSwingZ += ropeSwingVelZ * safeDt;
            ropeSwingX = THREE.MathUtils.clamp(ropeSwingX, -0.66, 0.66);
            ropeSwingZ = THREE.MathUtils.clamp(ropeSwingZ, -0.84, 0.84);
            mysteryScrollState.ropeSwingX = ropeSwingX;
            mysteryScrollState.ropeSwingZ = ropeSwingZ;
            mysteryScrollState.ropeSwingVelX = ropeSwingVelX;
            mysteryScrollState.ropeSwingVelZ = ropeSwingVelZ;

            const breeze = 0.55 + 0.45 * Math.sin(t * 0.22 + windSeed * 0.31);
            const gust =
                0.54 +
                0.46 * Math.sin(t * 0.11 + windSeed * 0.73 + Math.sin(t * 0.037 + windSeed * 0.21) * 0.9);
            const windSwingZ =
                (
                    Math.sin(t * 0.62 + windSeed) * 0.02 +
                    Math.sin(t * 1.14 + windSeed * 0.58) * 0.009 +
                    Math.sin(t * 0.28 + windSeed * 1.2) * 0.012 * breeze
                ) *
                (0.76 + gust * 0.34) *
                motionMix *
                dragWindMul;
            const windSwingX =
                (
                    Math.cos(t * 0.54 + windSeed * 0.85) * 0.008 +
                    Math.sin(t * 0.34 + windSeed * 1.3) * 0.006 * breeze
                ) *
                (0.78 + gust * 0.28) *
                motionMix *
                dragWindMul;
            const targetSwingZ = THREE.MathUtils.clamp(windSwingZ + ropeSwingZ * motionMix, -0.86, 0.86);
            const targetSwingX = THREE.MathUtils.clamp(windSwingX + ropeSwingX * motionMix, -0.68, 0.68);
            const targetYaw = THREE.MathUtils.clamp(
                Math.sin(t * 0.43 + windSeed * 0.4) * 0.012 * motionMix * dragWindMul + ropeSwingZ * 0.23 * motionMix,
                -0.22,
                0.22
            );
            const rotLerp = mysteryScrollState.dragActive ? 0.27 : 0.12;
            swayRig.rotation.z += (targetSwingZ - swayRig.rotation.z) * rotLerp;
            swayRig.rotation.x += (targetSwingX - swayRig.rotation.x) * rotLerp;
            swayRig.rotation.y += (targetYaw - swayRig.rotation.y) * Math.min(0.18, rotLerp + 0.02);
            const twistTarget = THREE.MathUtils.clamp(
                Math.sin(t * 0.92 + windSeed * 1.7) * 0.04 * motionMix * dragWindMul + ropeSwingZ * 0.065 * motionMix,
                -0.2,
                0.2
            );
            stringMesh.rotation.y += (twistTarget - stringMesh.rotation.y) * 0.13;
        }

        function handleMysteryScrollPointerDown(clientX, clientY, pointerId = null, nowMs = performance.now(), pointerType = 'mouse') {
            if (mysteryScrollState.dragActive) return false;
            if (!mysteryScrollState.dragTargets?.length) return false;
            if (mysteryScrollState.visibilityPhase !== 'ready') return false;
            if (!mysteryScrollState.root?.visible || !mysteryScrollState.scrollRig?.visible) return false;
            if (propPreviewOverlay?.classList?.contains('open')) return false;
            mysteryScrollState.scrollRig.getWorldPosition(mysteryScrollScreenProbe);
            mysteryScrollScreenProbe.project(camera);
            const scrollX = ((mysteryScrollScreenProbe.x + 1) * 0.5) * window.innerWidth;
            const scrollY = ((-mysteryScrollScreenProbe.y + 1) * 0.5) * window.innerHeight;
            const hitDx = Math.max(48, Math.min(176, window.innerWidth * 0.18));
            const hitDy = Math.max(36, Math.min(136, window.innerHeight * 0.16));
            if (!Number.isFinite(scrollX) || !Number.isFinite(scrollY)) return false;
            const nearScroll = Math.abs(clientX - scrollX) <= hitDx && Math.abs(clientY - scrollY) <= hitDy;
            if (!nearScroll) return false;
            const hits = intersectObjectsAt(clientX, clientY, mysteryScrollState.dragTargets, false);
            if (!hits.length) {
                return beginMysteryScrollDrag(clientX, clientY, pointerId, nowMs, pointerType);
            }
            const hit = hits[0];
            mysteryScrollState.scrollRig.worldToLocal(mysteryScrollHitLocalProbe.copy(hit.point));
            // Final local-space guard: only accept direct hits within the visible scroll body.
            if (Math.abs(mysteryScrollHitLocalProbe.x) > 1.58 || Math.abs(mysteryScrollHitLocalProbe.y) > 1.12) {
                const nearCore =
                    Math.abs(clientX - scrollX) <= hitDx * 0.72 &&
                    Math.abs(clientY - scrollY) <= hitDy * 0.72;
                if (nearCore) {
                    return beginMysteryScrollDrag(clientX, clientY, pointerId, nowMs, pointerType);
                }
                return false;
            }
            return beginMysteryScrollDrag(clientX, clientY, pointerId, nowMs, pointerType);
        }

        const builtMysteryScroll = createMysteryHangingScroll();
        mysteryScrollState.root = builtMysteryScroll.root;
        mysteryScrollState.swayRig = builtMysteryScroll.swayRig;
        mysteryScrollState.scrollRig = builtMysteryScroll.scrollRig;
        mysteryScrollState.dragTargets = builtMysteryScroll.dragTargets || [];
        mysteryScrollState.stringMesh = builtMysteryScroll.stringMesh || null;
        mysteryScrollState.knot = builtMysteryScroll.knot;
        mysteryScrollState.stringBaseLength = Math.max(2, builtMysteryScroll.stringBaseLength || mysteryScrollState.stringBaseLength || 6.1);
        mysteryScrollState.scrollScale = builtMysteryScroll.scrollScale;
        mysteryScrollState.scrollTopRollLocalY = builtMysteryScroll.scrollTopRollLocalY;
        mysteryScrollState.scrollAttachGap = builtMysteryScroll.scrollAttachGap;
        mysteryScrollState.scrollDropLength = Math.abs(builtMysteryScroll.scrollRig?.position?.y || 0);
        scene.add(mysteryScrollState.root);
        layoutMysteryScrollAnchor();

            size = 512,

            seedBase = 12345,
            starfield = false,
            runeRing = false
        } = {}) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            let seed = seedBase >>> 0;
            const rand = () => {
                seed = (seed * 1664525 + 1013904223) >>> 0;
                return seed / 4294967296;
            };

            const center = size * 0.5;
            const baseGrad = ctx.createRadialGradient(center, center, size * 0.06, center, center, size * 0.48);
            baseGrad.addColorStop(0.0, baseInner);
            baseGrad.addColorStop(0.52, baseOuter);
            baseGrad.addColorStop(1.0, '#04060f');
            ctx.fillStyle = baseGrad;
            ctx.fillRect(0, 0, size, size);

            ctx.lineCap = 'round';
            for (let i = 0; i < 180; i++) {
                const angle = rand() * Math.PI * 2;
                const r0 = size * (0.08 + rand() * 0.08);
                const r1 = size * (0.32 + rand() * 0.14);
                const x0 = center + Math.cos(angle) * r0;
                const y0 = center + Math.sin(angle) * r0;
                const x1 = center + Math.cos(angle + (rand() - 0.5) * 0.22) * r1;
                const y1 = center + Math.sin(angle + (rand() - 0.5) * 0.22) * r1;
                ctx.strokeStyle = fiberColor;
                ctx.lineWidth = 0.6 + rand() * 1.4;
                ctx.beginPath();
                ctx.moveTo(x0, y0);
                ctx.quadraticCurveTo(
                    center + Math.cos(angle) * (r0 + r1) * 0.5,
                    center + Math.sin(angle) * (r0 + r1) * 0.5,
                    x1,
                    y1
                );
                ctx.stroke();
            }

            const limbRing = ctx.createRadialGradient(center, center, size * 0.32, center, center, size * 0.5);
            limbRing.addColorStop(0.0, 'rgba(0,0,0,0)');
            limbRing.addColorStop(1.0, limbColor);
            ctx.fillStyle = limbRing;
            ctx.fillRect(0, 0, size, size);

            if (runeRing) {
                ctx.strokeStyle = 'rgba(170, 245, 255, 0.6)';
                ctx.lineWidth = size * 0.012;
                ctx.beginPath();
                ctx.arc(center, center, size * 0.3, 0, Math.PI * 2);
                ctx.stroke();

                for (let i = 0; i < 12; i++) {
                    const a = (i / 12) * Math.PI * 2;
                    const x = center + Math.cos(a) * size * 0.3;
                    const y = center + Math.sin(a) * size * 0.3;
                    ctx.fillStyle = i % 2 === 0 ? 'rgba(143, 248, 255, 0.9)' : 'rgba(214, 152, 255, 0.9)';
                    ctx.fillRect(x - 2, y - 2, 4, 4);
                }
            }

            if (starfield) {
                for (let i = 0; i < 56; i++) {
                    const x = rand() * size;
                    const y = rand() * size;
                    const r = 0.8 + rand() * 2.2;
                    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
                    g.addColorStop(0, 'rgba(255,255,255,0.95)');
                    g.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.needsUpdate = true;
            return tex;
        }

        function makeBoneBetween(start, end, radiusStart, radiusEnd, material, radialSegments = 12) {
            const delta = new THREE.Vector3().subVectors(end, start);
            const length = Math.max(0.0001, delta.length());
            const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radiusEnd, radiusStart, length, radialSegments), material);
            mesh.position.copy(start).addScaledVector(delta, 0.5);
            mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), delta.clone().normalize());
            return mesh;
        }

        function makeOmegaWingShape(dir) {
            const shape = new THREE.Shape();
            const mx = (x) => x * dir;

            // Curved demonic wing profile tuned to match reference silhouette:
            // broader span, higher crown arc, and sharper trailing scallops.
            shape.moveTo(mx(0.05), 0.3);

            // Primary upper arc to top tip.
            shape.quadraticCurveTo(mx(0.94), 1.48, mx(2.24), 2.5);
            shape.quadraticCurveTo(mx(4.08), 3.54, mx(6.24), 3.92);
            shape.quadraticCurveTo(mx(7.52), 3.98, mx(8.32), 3.62);

            // Folded upper trailing edge toward mid structure.
            shape.quadraticCurveTo(mx(7.78), 3.16, mx(7.06), 2.52);
            shape.quadraticCurveTo(mx(6.48), 2.0, mx(6.08), 1.46);

            // Finger-led membrane scallops.
            shape.quadraticCurveTo(mx(7.26), 1.24, mx(8.08), 0.96);
            shape.quadraticCurveTo(mx(7.0), 0.48, mx(5.58), 0.14);
            shape.quadraticCurveTo(mx(7.06), -0.04, mx(7.9), -0.46);
            shape.quadraticCurveTo(mx(6.58), -1.06, mx(5.04), -1.26);
            shape.quadraticCurveTo(mx(6.32), -1.64, mx(7.0), -2.08);

            // Lower contour back to root.
            shape.quadraticCurveTo(mx(5.38), -2.36, mx(3.46), -2.36);
            shape.quadraticCurveTo(mx(2.08), -2.34, mx(1.04), -2.2);
            shape.quadraticCurveTo(mx(0.34), -1.98, mx(0.02), -1.56);
            shape.quadraticCurveTo(mx(-0.16), -1.06, mx(-0.12), -0.52);
            shape.quadraticCurveTo(mx(-0.08), -0.12, mx(0.05), 0.3);

            shape.closePath();
            return shape;
        }

        function makeAlphaWingTextures() {
            const size = 1024;
            const maxAnisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());

            function makePanelTexture({ baseA, baseB, edgeTint, stripeA, stripeB, seedBase }) {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                let seed = seedBase >>> 0;
                const rand = () => {
                    seed = (seed * 1664525 + 1013904223) >>> 0;
                    return seed / 4294967296;
                };

                const base = ctx.createLinearGradient(0, 0, size, size);
                base.addColorStop(0.0, baseA);
                base.addColorStop(0.54, baseB);
                base.addColorStop(1.0, '#0f1636');
                ctx.fillStyle = base;
                ctx.fillRect(0, 0, size, size);

                for (let i = 0; i < 3; i++) {
                    const y = size * (0.26 + i * 0.18 + rand() * 0.04);
                    const alpha = 0.2 + rand() * 0.16;
                    ctx.strokeStyle = `rgba(235,248,255,${alpha})`;
                    ctx.lineWidth = 6 + rand() * 5;
                    ctx.beginPath();
                    ctx.moveTo(size * 0.04, y);
                    ctx.lineTo(size * 0.95, y + (rand() - 0.5) * 26);
                    ctx.stroke();
                }

                for (let i = 0; i < 6; i++) {
                    const x = size * (0.04 + rand() * 0.84);
                    const y = size * (0.08 + rand() * 0.82);
                    const w = 140 + rand() * 230;
                    const h = 4 + rand() * 8;
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(-0.2 + rand() * 0.4);
                    ctx.fillStyle = i % 2 === 0 ? stripeA : stripeB;
                    ctx.fillRect(0, 0, w, h);
                    ctx.fillStyle = edgeTint;
                    ctx.fillRect(2, 2, Math.max(6, w * 0.35), Math.max(2, h * 0.38));
                    ctx.restore();
                }

                const vignette = ctx.createRadialGradient(size * 0.54, size * 0.48, 80, size * 0.54, size * 0.48, size * 0.76);
                vignette.addColorStop(0, 'rgba(0,0,0,0)');
                vignette.addColorStop(1, 'rgba(0,0,0,0.5)');
                ctx.fillStyle = vignette;
                ctx.fillRect(0, 0, size, size);

                const tex = new THREE.CanvasTexture(canvas);
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.anisotropy = maxAnisotropy;
                tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(1.0, 1.0);
                tex.needsUpdate = true;
                return tex;
            }

            const sparkCanvas = document.createElement('canvas');
            sparkCanvas.width = 128;
            sparkCanvas.height = 128;
            const sCtx = sparkCanvas.getContext('2d');
            const sparkGrad = sCtx.createRadialGradient(64, 64, 4, 64, 64, 60);
            sparkGrad.addColorStop(0.0, 'rgba(255,255,255,1)');
            sparkGrad.addColorStop(0.24, 'rgba(181,242,255,0.95)');
            sparkGrad.addColorStop(0.58, 'rgba(255,124,232,0.78)');
            sparkGrad.addColorStop(1.0, 'rgba(255,255,255,0)');
            sCtx.fillStyle = sparkGrad;
            sCtx.fillRect(0, 0, 128, 128);

            const sparkTexture = new THREE.CanvasTexture(sparkCanvas);
            sparkTexture.colorSpace = THREE.SRGBColorSpace;
            sparkTexture.needsUpdate = true;

            return {
                cyanPanel: makePanelTexture({
                    baseA: '#0f2a56',
                    baseB: '#1a417f',
                    edgeTint: 'rgba(215,251,255,0.55)',
                    stripeA: 'rgba(64,229,255,0.84)',
                    stripeB: 'rgba(153,242,255,0.72)',
                    seedBase: 9733
                }),
                magentaPanel: makePanelTexture({
                    baseA: '#2a1454',
                    baseB: '#4a1f7a',
                    edgeTint: 'rgba(255,214,255,0.52)',
                    stripeA: 'rgba(255,84,219,0.86)',
                    stripeB: 'rgba(204,112,255,0.72)',
                    seedBase: 48179
                }),
                sparkTexture
            };
        }

        function makeAlphaBladeGeometry(dir, options = {}) {
            const {
                length = 3.2,
                rootWidth = 0.58,
                tipWidth = 0.2,
                thickness = 0.07,
                camber = 0.12,
                droop = 0,
                sweep = 0.1,
                twist = 0.05
            } = options;

            const mx = (x) => x * dir;
            const shape = new THREE.Shape();
            shape.moveTo(mx(0), -rootWidth * 0.5);
            shape.bezierCurveTo(
                mx(length * 0.34),
                -rootWidth * 0.68 + sweep * 0.18,
                mx(length * 0.88),
                -tipWidth * 0.62 + sweep,
                mx(length),
                -tipWidth * 0.46 + sweep
            );
            shape.quadraticCurveTo(mx(length * 1.03), sweep * 0.82, mx(length), tipWidth * 0.48 + sweep);
            shape.bezierCurveTo(
                mx(length * 0.9),
                tipWidth * 0.72 + sweep,
                mx(length * 0.38),
                rootWidth * 0.66 + sweep * 0.14,
                mx(0),
                rootWidth * 0.5
            );
            shape.closePath();

            const geo = new THREE.ExtrudeGeometry(shape, {
                steps: 1,
                depth: thickness,
                bevelEnabled: true,
                bevelSize: 0.015,
                bevelThickness: 0.015,
                bevelSegments: 2,
                curveSegments: 42
            });
            geo.translate(0, 0, -thickness * 0.5);

            const pos = geo.attributes.position;
            const uv = new Float32Array(pos.count * 2);
            const halfRoot = Math.max(0.001, rootWidth * 0.5);
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const y = pos.getY(i);
                const z = pos.getZ(i);
                const nx = THREE.MathUtils.clamp(Math.abs(x) / Math.max(0.001, length), 0, 1);
                const ny = THREE.MathUtils.clamp(y / halfRoot, -1, 1);
                const camberOffset = Math.sin(nx * Math.PI) * camber;
                const twistOffset = ny * twist * Math.pow(nx, 1.2);
                const droopOffset = Math.pow(nx, 1.45) * droop;
                pos.setXYZ(i, x, y + droopOffset, z + camberOffset + twistOffset);
                uv[i * 2] = nx;
                uv[i * 2 + 1] = THREE.MathUtils.clamp((ny + 1) * 0.5, 0, 1);
            }
            geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
            pos.needsUpdate = true;
            geo.computeVertexNormals();
            return geo;
        }

        function makeAlphaSparkSystem(dir, sparkTexture) {
            const count = 16;
            const positions = new Float32Array(count * 3);
            const basePositions = new Float32Array(count * 3);
            const phases = new Float32Array(count);

            let seed = dir > 0 ? 13579 : 35791;
            const rand = () => {
                seed = (seed * 1103515245 + 12345) >>> 0;
                return (seed & 0x7fffffff) / 0x7fffffff;
            };

            for (let i = 0; i < count; i++) {
                const idx = i * 3;
                const x = dir * (0.56 + rand() * 3.1);
                const y = -1.2 + rand() * 3.5;
                const z = -0.06 + rand() * 0.46;
                positions[idx] = basePositions[idx] = x;
                positions[idx + 1] = basePositions[idx + 1] = y;
                positions[idx + 2] = basePositions[idx + 2] = z;
                phases[i] = rand() * Math.PI * 2;
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({
                color: 0xffc2ff,
                map: sparkTexture,
                alphaMap: sparkTexture,
                size: 0.052,
                sizeAttenuation: true,
                transparent: true,
                opacity: 0.56,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            const points = new THREE.Points(geo, mat);
            return {
                points,
                basePositions,
                phases,
                speed: 2.6 + rand() * 0.8,
                drift: 0.016 + rand() * 0.012,
                phaseOffset: rand() * Math.PI * 2
            };
        }

        function makeRainbowWingTextures() {
            const size = 1024;
            const maxAnisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());

            const membraneCanvas = document.createElement('canvas');
            membraneCanvas.width = size;
            membraneCanvas.height = size;
            const mCtx = membraneCanvas.getContext('2d');

            let seed = 17062026;
            const rand = () => {
                seed = (seed * 1664525 + 1013904223) >>> 0;
                return seed / 4294967296;
            };

            const rainbow = mCtx.createLinearGradient(0, size * 0.94, size, size * 0.06);
            rainbow.addColorStop(0.0, '#ff5fc8');
            rainbow.addColorStop(0.16, '#ff79d4');
            rainbow.addColorStop(0.34, '#5f9dff');
            rainbow.addColorStop(0.5, '#4ad8ff');
            rainbow.addColorStop(0.68, '#ffd251');
            rainbow.addColorStop(0.84, '#ff82c3');
            rainbow.addColorStop(1.0, '#8d63ff');
            mCtx.fillStyle = rainbow;
            mCtx.fillRect(0, 0, size, size);

            const innerGlow = mCtx.createRadialGradient(size * 0.16, size * 0.68, 30, size * 0.16, size * 0.68, size * 0.62);
            innerGlow.addColorStop(0, 'rgba(255,245,200,0.96)');
            innerGlow.addColorStop(0.35, 'rgba(255,224,156,0.5)');
            innerGlow.addColorStop(1, 'rgba(255,215,150,0)');

            const tipGlow = mCtx.createRadialGradient(size * 0.82, size * 0.2, 24, size * 0.82, size * 0.2, size * 0.36);
            tipGlow.addColorStop(0, 'rgba(225,240,255,0.62)');
            tipGlow.addColorStop(0.45, 'rgba(180,220,255,0.24)');
            tipGlow.addColorStop(1, 'rgba(130,186,255,0)');
            mCtx.fillStyle = tipGlow;
            mCtx.fillRect(0, 0, size, size);

            mCtx.lineCap = 'round';
            for (let i = 0; i < 34; i++) {
                const y = size * (0.08 + rand() * 0.84);
                const amp = 10 + rand() * 26;
                const alpha = 0.012 + rand() * 0.04;
                mCtx.strokeStyle = `rgba(255,255,255,${alpha})`;
                mCtx.lineWidth = 1 + rand() * 3;
                mCtx.beginPath();
                mCtx.moveTo(size * 0.02, y);
                mCtx.bezierCurveTo(
                    size * (0.24 + rand() * 0.12), y + (rand() - 0.5) * amp,

                    size * (0.92 + rand() * 0.06), y + (rand() - 0.5) * amp * 0.44

                mCtx.stroke();
            }

            for (let i = 0; i < 120; i++) {
                const x = rand() * size;

                s.addColorStop(0, 'rgba(255,255,255,0.95)');
                s.addColorStop(0.4, 'rgba(255,246,255,0.66)');
                s.addColorStop(1, 'rgba(255,255,255,0)');
                mCtx.fillStyle = s;
                mCtx.beginPath();
                mCtx.arc(x, y, r, 0, Math.PI * 2);
                mCtx.fill();
            }

            mCtx.globalCompositeOperation = 'multiply';
            const saturationPass = mCtx.createLinearGradient(0, size, size, 0);
            saturationPass.addColorStop(0.0, '#ff76cb');
            saturationPass.addColorStop(0.2, '#b66aff');
            saturationPass.addColorStop(0.4, '#5a92ff');
            saturationPass.addColorStop(0.6, '#4cdfff');

            mCtx.fillRect(0, 0, size, size);
            mCtx.globalCompositeOperation = 'source-over';

            const sparkleCanvas = document.createElement('canvas');

            sCtx.fillRect(0, 0, 128, 128);
            sCtx.strokeStyle = 'rgba(255,255,255,0.92)';

            sCtx.beginPath();
            sCtx.moveTo(16, 64);
            sCtx.lineTo(112, 64);
            sCtx.moveTo(64, 16);
            sCtx.lineTo(64, 112);

            const flowerCanvas = document.createElement('canvas');
            flowerCanvas.width = 128;

            const fCtx = flowerCanvas.getContext('2d');
            fCtx.translate(64, 64);
            for (let i = 0; i < 5; i++) {

            const membraneTex = new THREE.CanvasTexture(membraneCanvas);

            const sparkleTex = new THREE.CanvasTexture(sparkleCanvas);

            const flowerTex = new THREE.CanvasTexture(flowerCanvas);
            flowerTex.colorSpace = THREE.SRGBColorSpace;
            flowerTex.needsUpdate = true;

            return { membraneTex, sparkleTex, flowerTex };
        }

        function makeRainbowFeatherGeometry(dir, options = {}) {
            const {
                length = 4.6,
                rootWidth = 0.86,
                tipWidth = 0.18,
                rise = 1.1,
                camber = 0.12,
                droop = 0,
                twist = 0.05,
                curl = 0.2
            } = options;

            const mx = (x) => x * dir;
            const shape = new THREE.Shape();
            shape.moveTo(mx(0), -rootWidth * 0.5);
            shape.bezierCurveTo(
                mx(length * 0.24), -rootWidth * 0.74,
                mx(length * 0.82), rise - tipWidth * 0.54,
                mx(length), rise - tipWidth * 0.14
            );
            shape.quadraticCurveTo(
                mx(length * (1.06 + curl * 0.1)),
                rise + tipWidth * (0.5 + curl * 0.8),
                mx(length * (0.94 + curl * 0.06)),
                rise + tipWidth * 1.04
            );
            shape.bezierCurveTo(
                mx(length * 0.72), rise + tipWidth * 1.2,
                mx(length * 0.24), rootWidth * 0.76,
                mx(0), rootWidth * 0.5
            );
            shape.closePath();

            const geo = new THREE.ShapeGeometry(shape, 92);
            const pos = geo.attributes.position;
            const uv = new Float32Array(pos.count * 2);
            const heightRef = rootWidth + Math.abs(rise) * 0.95;

            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const y = pos.getY(i);
                const nx = THREE.MathUtils.clamp(Math.abs(x) / Math.max(0.001, length), 0, 1);
                const ny = THREE.MathUtils.clamp((y - rise * 0.36) / Math.max(0.001, heightRef), -1, 1);
                const edgeSoft = 1 - Math.abs(ny);
                const z = Math.sin(nx * Math.PI) * camber * (0.54 + edgeSoft * 0.46)
                    + ny * twist * Math.pow(nx, 1.22)
                    + Math.pow(nx, 1.34) * droop
                    + Math.sin(nx * 11.2 + ny * 3.6) * 0.006;

                pos.setXYZ(
                    i,
                    x + dir * Math.pow(nx, 2.08) * curl * 0.24 * (0.16 + Math.abs(ny)),
                    y,
                    z
                );

                uv[i * 2] = nx;
                uv[i * 2 + 1] = THREE.MathUtils.clamp((ny + 1) * 0.5, 0, 1);
            }

            geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
            pos.needsUpdate = true;
            geo.computeVertexNormals();
            return geo;
        }

        function makeRainbowSparkSystem(dir, texture, options = {}) {
            const {
                count = 24,
                size = 0.07,
                opacity = 0.72,
                spreadMin = 0.7,
                spreadMax = 4.2,
                yOffset = 0,
                drift = 0.036
            } = options;

            const positions = new Float32Array(count * 3);
            const basePositions = new Float32Array(count * 3);
            const phases = new Float32Array(count);
            const colors = new Float32Array(count * 3);

            };

                const idx = i * 3;
                const span = spreadMin + rand() * (spreadMax - spreadMin);
                const arc = -1.05 + rand() * 2.2;
                const x = dir * (0.46 + Math.cos(arc) * span);
                const y = yOffset + Math.sin(arc) * (span * 0.78) + (rand() - 0.5) * 0.64;

                positions[idx] = basePositions[idx] = x;
                positions[idx + 1] = basePositions[idx + 1] = y;

                vertexColors: true,

                sizeAttenuation: true,
                transparent: true,
                opacity,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

                points: new THREE.Points(geo, mat),

        function makeSegmentedHornChain(points, {
            material,
            radiusStart = 0.16,
            radiusEnd = 0.03,
            segments = 20,
            ridgeEvery = 2,
            ridgeMaterial = material
        } = {}) {
            const g = new THREE.Group();
            const curve = new THREE.CatmullRomCurve3(points);
            for (let i = 0; i < segments; i++) {
                const t0 = i / segments;
                const t1 = (i + 1) / segments;
                const p0 = curve.getPoint(t0);
                const p1 = curve.getPoint(t1);
                const r0 = THREE.MathUtils.lerp(radiusStart, radiusEnd, t0);
                const r1 = THREE.MathUtils.lerp(radiusStart, radiusEnd, t1);
                const section = makeBoneBetween(p0, p1, r0, r1, material, 14);
                g.add(section);

                if (ridgeEvery > 0 && i % ridgeEvery === 0 && i > 0 && i < segments - 2) {
                    const ring = new THREE.Mesh(
                        new THREE.TorusGeometry(r1 * 1.04, Math.max(0.006, r1 * 0.15), 8, 20),
                        ridgeMaterial
                    );
                    ring.position.copy(p1);
                    ring.quaternion.setFromUnitVectors(
                        new THREE.Vector3(0, 0, 1),
                        p1.clone().sub(p0).normalize()
                    );
                    g.add(ring);
                }
            }

            const tipPos = curve.getPoint(1);
            const tipDir = curve.getTangent(1).normalize();
            const tip = new THREE.Mesh(
                new THREE.ConeGeometry(Math.max(0.01, radiusEnd * 1.35), Math.max(0.04, radiusEnd * 4.8), 10),
                material
            );
            tip.position.copy(tipPos).addScaledVector(tipDir, radiusEnd * 1.2);
            tip.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tipDir);
            g.add(tip);
            return g;
        }

                const shape = new THREE.Shape();

                shape.bezierCurveTo(3.28, 3.22, 3.62, 4.06, 3.86, 4.62);

                shape.quadraticCurveTo(-0.04, 0.48, 0.0, 0.0);
                shape.closePath();

                const geo = new THREE.ShapeGeometry(shape, 84);
                geo.computeBoundingBox();
                const bounds = geo.boundingBox;
                const spanX = Math.max(0.001, bounds.max.x - bounds.min.x);
                const spanY = Math.max(0.001, bounds.max.y - bounds.min.y);
                const pos = geo.attributes.position;
                const uv = new Float32Array(pos.count * 2);
                for (let i = 0; i < pos.count; i++) {

                    const y = pos.getY(i);
                    const nx = THREE.MathUtils.clamp((x - bounds.min.x) / spanX, 0, 1);
                    const ny = THREE.MathUtils.clamp((y - bounds.min.y) / spanY, 0, 1);
                    const camber = 0.06 + nx * 0.2 - Math.pow(ny, 1.35) * 0.08;

            const unique = [];
            for (const entry of selections) {
                if (!entry || unique.includes(entry)) {
                    continue;

                unique.push(entry);
            }
            if (!unique.length) {
                activeCategorySelection.delete(category);
                return;

            const limit = Math.max(1, getCategoryLimit(category));
            activeCategorySelection.set(category, unique.slice(-limit));

                    const limit = getCategoryLimit(propCategory);

                    const nextForCategory = currentForCategory.filter((entry) => entry !== propKey);
                    while (nextForCategory.length >= limit) {
                        const removed = nextForCategory.shift();
                        if (removed && activeProps.has(removed)) {

                    setCategorySelection(propCategory, nextForCategory);

            }
            activeProps.add(propKey);

            if (!propRegistry.has(propKey)) {
                return { added: false, dropped: [] };

            const category = getPropCategory(propKey);
            if (!category) {
                return { added: false, dropped: [] };

            if (hasExisting) {

            playerInventory.add(propKey);
            const dropped = hasExisting ? [] : [

            ];
            renderInventoryList();
            return {
                added: true,

        function equipPropNow(propKey) {
            const metadata = propRegistry.get(propKey);
            if (!metadata) {
                return false;
            }
            const propCategory = metadata.category;
            if (singleEquipCategories.has(propCategory)) {
                const currentForCategory = getCategorySelection(propCategory).filter((entry) => entry !== propKey);
                const limit = getCategoryLimit(propCategory);
                const removedForInventory = [];

                while (currentForCategory.length >= limit) {
                    const removed = currentForCategory.shift();
                    if (removed && activeProps.has(removed)) {
                        activeProps.delete(removed);
                        removedForInventory.push(removed);
                    }
                }
                for (const removed of removedForInventory) {
                    stashPropInInventory(removed);
                }
                currentForCategory.push(propKey);
                setCategorySelection(propCategory, currentForCategory);
            }
            activeProps.add(propKey);
            applyLoadout();
            updatePropButtonStates();
            return true;
        }

            const metadata = propRegistry.get(propKey);
            if (!metadata) {

            if (!activeProps.has(propKey)) {

            }

            const propCategory = metadata.category;
            activeProps.delete(propKey);
            const currentForCategory = getCategorySelection(propCategory).filter((entry) => entry !== propKey);
            setCategorySelection(propCategory, currentForCategory);

            applyLoadout();
            updatePropButtonStates();
            return true;
