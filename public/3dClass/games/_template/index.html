<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Template</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #070e15;
      color: #e8f2ff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* ── Close / back button (top-right corner) ── */
    .close-btn {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 100;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(8,20,32,0.85);
      color: #e8f2ff;
      font-size: 1.1rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      transition: background 0.15s, border-color 0.15s;
    }
    .close-btn:hover { background: rgba(30,60,100,0.9); border-color: rgba(255,255,255,0.5); }

    /* ── Game container ── */
    .game-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      text-align: center;
    }

    h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.02em; color: #c8e0ff; }
    p  { font-size: 1rem; color: #7aa8d4; line-height: 1.5; }
  </style>
</head>
<body>

  <!-- Close button: sends message to parent classroom page to close this iframe -->
  <button class="close-btn" id="closeBtn" type="button" aria-label="Close game">✕</button>

  <!-- ═══════════════════════════════════════════════════════════
       YOUR GAME GOES HERE
       Replace everything inside .game-container with your game UI.
       ═══════════════════════════════════════════════════════════ -->
  <div class="game-container">
    <h1>Game Title</h1>
    <p>Your game content goes here.<br>Delete this placeholder and build your game!</p>
  </div>
  <!-- ═══════════════════════════════════════════════════════════ -->

  <script>
    // ── Close button ──────────────────────────────────────────────
    // Tells the parent classroom page to close this game iframe.
    // Works whether the game is in an iframe OR opened as a standalone page.
    function closeGame() {
      if (window.parent !== window) {
        window.parent.postMessage({ type: "LAHS_GAME_CLOSE" }, "*");
      } else {
        history.back();
      }
    }

    document.getElementById("closeBtn").addEventListener("click", closeGame);

    // Escape key also closes the game
    window.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeGame();
    });

    // Hide the in-game close button when running inside the parent classroom iframe
    // (the parent provides its own close button — two circles would appear otherwise)
    if (window.parent !== window) {
      var _cb = document.getElementById("closeBtn");
      if (_cb) _cb.hidden = true;
    }

    // ── YOUR GAME JAVASCRIPT GOES HERE ───────────────────────────
    // Delete the example above and write your game logic below.
  </script>
</body>
</html>
