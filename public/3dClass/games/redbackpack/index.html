<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backpack Game</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #070e15;
      color: #e8f2ff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .close-btn {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 100;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(8,20,32,0.85);
      color: #e8f2ff;
      font-size: 1.1rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      transition: background 0.15s, border-color 0.15s;
    }
    .close-btn:hover { background: rgba(30,60,100,0.9); border-color: rgba(255,255,255,0.5); }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      max-width: 380px;
      text-align: center;
    }

    .icon { font-size: 4rem; }

    h1 {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #c8e0ff;
    }

    p {
      font-size: 1rem;
      color: #5a8abf;
      line-height: 1.6;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 1rem;
      border-radius: 99px;
      border: 1px solid rgba(180,120,80,0.4);
      background: rgba(100,50,10,0.3);
      color: #d4905a;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <button class="close-btn" id="closeBtn" type="button" aria-label="Close">✕</button>

  <div class="card">
    <div class="icon">🎒</div>
    <h1>Backpack Game</h1>
    <div class="badge">🚧 Coming Soon</div>
    <p>This game is still being built.<br>Check back soon!</p>
  </div>

  <script>
    function closeGame() {
      if (window.parent !== window) {
        window.parent.postMessage({ type: "LAHS_GAME_CLOSE" }, "*");
      } else {
        history.back();
      }
    }
    document.getElementById("closeBtn").addEventListener("click", closeGame);
    window.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeGame();
    });

    // Hide the in-game close button when running inside the parent classroom iframe
    // (the parent provides its own close button — two circles would appear otherwise)
    if (window.parent !== window) {
      var _cb = document.getElementById("closeBtn");
      if (_cb) _cb.hidden = true;
    }
  </script>
</body>
</html>
