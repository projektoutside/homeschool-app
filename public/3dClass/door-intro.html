<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Classroom Door Intro</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: #070707;
      overflow: hidden;
    }

    body.intro-active {
      overscroll-behavior: none;
    }

    .door-intro[hidden] {
      display: none;
    }

    .door-intro {
      position: fixed;
      inset: 0;
      z-index: 380;
      overflow: hidden;
      pointer-events: auto;
      opacity: 1;
      --intro-safe-top: max(12px, env(safe-area-inset-top));
      --intro-safe-bottom: max(12px, env(safe-area-inset-bottom));
      --door-usable-height: calc(100svh - var(--intro-safe-top) - var(--intro-safe-bottom));
      --door-height: clamp(340px, calc(var(--door-usable-height) * 0.94), 2200px);
      --door-width: clamp(220px, calc(var(--door-height) * 0.48), min(92svw, 860px));
      --eye-level-offset: calc((var(--intro-safe-top) - var(--intro-safe-bottom)) * 0.16);
      background: #070707;
      perspective: none;
      transform-style: flat;
      transition: opacity 280ms ease-out;
    }

    .door-intro.is-leaving {
      opacity: 0;
      pointer-events: none;
    }

    .door-intro::before,
    .door-intro::after {
      display: none;
      content: "";
    }

    .door-intro-stage {
      position: absolute;
      inset: 0;
      background: #070707;
    }

    .door-intro-stage canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .door-intro-fade {
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      will-change: opacity;
    }
  </style>
</head>
<body>
  <div class="door-intro" id="doorIntro" aria-hidden="true" hidden>
    <div class="door-intro-stage" id="doorIntroStage" aria-hidden="true"></div>
    <div class="door-intro-fade" id="doorIntroFade"></div>
  </div>

  <script src="scripts/three.min.js"></script>
  <script src="scripts/door-intro-runtime.js?v=2026-03-09-2"></script>
  <script>
    (function () {
      const INTRO_ANIMATION_DURATION_MS = 1050;
      const INTRO_REDUCED_DURATION_MS = 280;
      const INTRO_FADE_DURATION_MS = 140;
      const SHOULD_SKIP_INTRO = false;
      const INTRO_MESSAGE_SCOPE = "classroom-main";
      const INTRO_MESSAGE_DONE = "LAHS_CLASSROOM_DOOR_INTRO_DONE";
      const SOUND_SETTINGS_STORAGE_KEY = "app_sound_settings_v1";
      const DEFAULT_SFX_VOLUME = 0.75;
      const DOOR_OPEN_AUDIO_BASE_GAIN = 0.42;
      const DOOR_OPEN_AUDIO_FILE = "audio/dooropening.mp3";
      const DOOR_OPEN_AUDIO_TRIGGER_PROGRESS = 0.015;
      const INTRO_AMBIENT_BASE_GAIN = 0.12;

      const doorIntro = document.getElementById("doorIntro");
      const doorIntroStage = document.getElementById("doorIntroStage");
      const doorIntroFade = document.getElementById("doorIntroFade");
      const scene = null;
      const hotspotLayer = null;
      const mainBackground = null;
      function waitForMs(durationMs) {
        return new Promise(function (resolve) {
          setTimeout(resolve, durationMs);
        });
      }

      function clamp01(value) {
        return Math.max(0, Math.min(1, Number(value) || 0));
      }

      function lerp(from, to, t) {
        return from + (to - from) * t;
      }

      function easeInCubic(t) {
        const x = clamp01(t);
        return x * x * x;
      }

      function easeOutCubic(t) {
        const x = clamp01(t);
        return 1 - Math.pow(1 - x, 3);
      }

      function easeInOutCubic(t) {
        const x = clamp01(t);
        if (x < 0.5) {
          return 4 * x * x * x;
        }
        return 1 - Math.pow(-2 * x + 2, 3) / 2;
      }

      function readDoorIntroSoundSettings() {
        const fallbackDoorVolume = clamp01(DEFAULT_SFX_VOLUME * DOOR_OPEN_AUDIO_BASE_GAIN);
        const fallbackAmbientVolume = clamp01(DEFAULT_SFX_VOLUME * INTRO_AMBIENT_BASE_GAIN);
        const fallback = {
          muted: false,
          doorVolume: fallbackDoorVolume,
          ambientVolume: fallbackAmbientVolume
        };
        try {
          const rawSettings = window.localStorage.getItem(SOUND_SETTINGS_STORAGE_KEY);
          if (!rawSettings) {
            return fallback;
          }
          const parsed = JSON.parse(rawSettings);
          const muted = Boolean(parsed && parsed.muted);
          const rawSfxVolume = Number(parsed && parsed.sfxVolume);
          const sfxVolume = Number.isFinite(rawSfxVolume)
            ? clamp01(rawSfxVolume / 100)
            : DEFAULT_SFX_VOLUME;
          const effectiveSfxVolume = muted ? 0 : sfxVolume;

          return {
            muted: muted,
            doorVolume: clamp01(effectiveSfxVolume * DOOR_OPEN_AUDIO_BASE_GAIN),
            ambientVolume: clamp01(effectiveSfxVolume * INTRO_AMBIENT_BASE_GAIN)
          };
        } catch {
          return fallback;
        }
      }

      function createIntroAmbientRoomToneController(soundSettings) {
        const ambientVolume = clamp01(Number(soundSettings && soundSettings.ambientVolume));
        const AudioContextRef = window.AudioContext || window.webkitAudioContext;
        if (Boolean(soundSettings && soundSettings.muted) || ambientVolume <= 0 || !AudioContextRef) {
          return {
            updateForIntroProgress: function () {},
            stop: function () {},
            dispose: function () {}
          };
        }

        let audioContext = null;
        let masterGain = null;
        let noiseSource = null;
        let humOscillatorA = null;
        let humOscillatorB = null;
        let graphInitialized = false;
        let disposed = false;
        let nextRetryAtMs = 0;

        function ensureGraph(nowMs) {
          const now = Number(nowMs) || performance.now();
          if (disposed || graphInitialized || now < nextRetryAtMs) {
            return;
          }

          try {
            audioContext = new AudioContextRef();
            masterGain = audioContext.createGain();
            masterGain.gain.value = 0;

            const noiseBuffer = audioContext.createBuffer(1, audioContext.sampleRate * 2, audioContext.sampleRate);
            const channelData = noiseBuffer.getChannelData(0);
            let filteredNoise = 0;
            for (let index = 0; index < channelData.length; index += 1) {
              const whiteNoise = (Math.random() * 2) - 1;
              filteredNoise = (filteredNoise * 0.986) + (whiteNoise * 0.14);
              channelData[index] = filteredNoise;
            }

            noiseSource = audioContext.createBufferSource();
            noiseSource.buffer = noiseBuffer;
            noiseSource.loop = true;

            const noiseHighPass = audioContext.createBiquadFilter();
            noiseHighPass.type = "highpass";
            noiseHighPass.frequency.value = 130;
            noiseHighPass.Q.value = 0.65;

            const noiseLowPass = audioContext.createBiquadFilter();
            noiseLowPass.type = "lowpass";
            noiseLowPass.frequency.value = 940;
            noiseLowPass.Q.value = 0.55;

            const noiseGain = audioContext.createGain();
            noiseGain.gain.value = 0.18;

            humOscillatorA = audioContext.createOscillator();
            humOscillatorA.type = "triangle";
            humOscillatorA.frequency.value = 156;
            humOscillatorA.detune.value = -4;

            humOscillatorB = audioContext.createOscillator();
            humOscillatorB.type = "sine";
            humOscillatorB.frequency.value = 234;
            humOscillatorB.detune.value = 3;

            const humGain = audioContext.createGain();
            humGain.gain.value = 0.038;

            noiseSource.connect(noiseHighPass);
            noiseHighPass.connect(noiseLowPass);
            noiseLowPass.connect(noiseGain);
            noiseGain.connect(masterGain);

            humOscillatorA.connect(humGain);
            humOscillatorB.connect(humGain);
            humGain.connect(masterGain);

            masterGain.connect(audioContext.destination);

            noiseSource.start(0);
            humOscillatorA.start(0);
            humOscillatorB.start(0);

            graphInitialized = true;
          } catch {
            nextRetryAtMs = now + 240;
          }
        }

        function ensurePlaybackReady(nowMs) {
          if (!audioContext || audioContext.state === "running") {
            return;
          }

          const now = Number(nowMs) || performance.now();
          if (now < nextRetryAtMs) {
            return;
          }

          nextRetryAtMs = now + 180;
          try {
            const resumePromise = audioContext.resume();
            if (resumePromise && typeof resumePromise.then === "function") {
              resumePromise.then(function () {
                nextRetryAtMs = 0;
              }).catch(function () {
                nextRetryAtMs = now + 240;
              });
            }
          } catch {
            nextRetryAtMs = now + 240;
          }
        }

        function setAmbientGain(targetGain, rampSeconds) {
          if (!audioContext || !masterGain) {
            return;
          }
          const now = audioContext.currentTime;
          masterGain.gain.cancelScheduledValues(now);
          masterGain.gain.setTargetAtTime(clamp01(targetGain), now, rampSeconds);
        }

        return {
          updateForIntroProgress: function (progress, nowMs) {
            if (disposed) {
              return;
            }

            const introProgress = clamp01(progress);
            const fadeIn = easeOutCubic(clamp01((introProgress - 0.04) / 0.24));
            const fadeOut = 1 - easeInCubic(clamp01((introProgress - 0.72) / 0.24));
            const intensity = fadeIn * fadeOut;

            if (intensity <= 0.001) {
              setAmbientGain(0, 0.08);
              return;
            }

            ensureGraph(nowMs);
            ensurePlaybackReady(nowMs);
            setAmbientGain(ambientVolume * intensity, 0.16);
          },
          stop: function () {
            setAmbientGain(0, 0.08);
          },
          dispose: function () {
            disposed = true;
            setAmbientGain(0, 0.05);

            if (noiseSource) {
              try {
                noiseSource.stop(0);
              } catch {
                // Ignore repeated stop errors.
              }
            }
            if (humOscillatorA) {
              try {
                humOscillatorA.stop(0);
              } catch {
                // Ignore repeated stop errors.
              }
            }
            if (humOscillatorB) {
              try {
                humOscillatorB.stop(0);
              } catch {
                // Ignore repeated stop errors.
              }
            }
            if (audioContext && typeof audioContext.close === "function") {
              const closePromise = audioContext.close();
              if (closePromise && typeof closePromise.catch === "function") {
                closePromise.catch(function () {
                  // Ignore context shutdown failures.
                });
              }
            }
          }
        };
      }

      function createDoorOpeningAudioController() {
        const audio = new Audio(DOOR_OPEN_AUDIO_FILE);
        audio.preload = "auto";
        audio.playsInline = true;
        const soundSettings = readDoorIntroSoundSettings();
        audio.muted = soundSettings.muted;
        audio.volume = soundSettings.doorVolume;
        const ambientRoomToneController = createIntroAmbientRoomToneController(soundSettings);

        let hasPlayed = false;
        let nextRetryAtMs = 0;

        function play(nowMs) {
          const now = Number(nowMs) || performance.now();
          if (hasPlayed || now < nextRetryAtMs) {
            return;
          }

          hasPlayed = true;
          try {
            audio.currentTime = 0;
          } catch {
            // Ignore playback positioning errors.
          }

          const playPromise = audio.play();
          if (playPromise && typeof playPromise.catch === "function") {
            playPromise.catch(function () {
              hasPlayed = false;
              nextRetryAtMs = now + 120;
            });
          }
        }

        return {
          playForDoorOpeningProgress: function (progress, nowMs) {
            if (hasPlayed || progress < DOOR_OPEN_AUDIO_TRIGGER_PROGRESS) {
              return;
            }
            play(nowMs);
          },
          updateForIntroProgress: function (progress, nowMs) {
            ambientRoomToneController.updateForIntroProgress(progress, nowMs);
          },
          stop: function () {
            hasPlayed = false;
            nextRetryAtMs = 0;
            try {
              audio.pause();
              audio.currentTime = 0;
            } catch {
              // Ignore media reset errors.
            }
            ambientRoomToneController.stop();
          },
          dispose: function () {
            hasPlayed = false;
            nextRetryAtMs = 0;
            try {
              audio.pause();
              audio.removeAttribute("src");
              audio.load();
            } catch {
              // Ignore media disposal errors.
            }
            ambientRoomToneController.dispose();
          }
        };
      }

      const doorIntroRuntimeApi = window.LAHSDoorIntroRuntime || {};
      const createThreeDoorIntroRuntime = doorIntroRuntimeApi.createThreeDoorIntroRuntime;
      const captureSceneSnapshotCanvas = doorIntroRuntimeApi.captureSceneSnapshotCanvas;

      function createDoorIntroController() {
        if (!doorIntro) {
          return {
            refreshPortalSnapshot: function () {
              return false;
            },
            complete: function () {
              return Promise.resolve();
            }
          };
        }

        if (SHOULD_SKIP_INTRO) {
          doorIntro.hidden = true;
          doorIntro.classList.remove("is-leaving");
          if (doorIntroFade) {
            doorIntroFade.style.opacity = "0";
          }
          document.body.classList.remove("intro-active");
          return {
            refreshPortalSnapshot: function () {
              return false;
            },
            complete: function () {
              return Promise.resolve();
            }
          };
        }

        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const introDurationMs = reduceMotion ? INTRO_REDUCED_DURATION_MS : INTRO_ANIMATION_DURATION_MS;
        let finished = false;
        let runtime = null;
        let doorAudioController = createDoorOpeningAudioController();
        let snapshotRetryTimerId = null;
        let snapshotRetryCount = 0;
        const SNAPSHOT_MAX_RETRIES = 18;
        const SNAPSHOT_RETRY_MS = 120;
        let introMinDurationPromise = waitForMs(introDurationMs);

        function clearSnapshotRetry() {
          if (snapshotRetryTimerId !== null) {
            clearTimeout(snapshotRetryTimerId);
            snapshotRetryTimerId = null;
          }
        }

        function refreshPortalSnapshot() {
          if (!runtime || typeof runtime.applyPortalCanvasSnapshot !== "function") {
            return false;
          }
          const snapshotCanvas = captureSceneSnapshotCanvas(scene, mainBackground, hotspotLayer);
          if (!snapshotCanvas) {
            return false;
          }
          return runtime.applyPortalCanvasSnapshot(snapshotCanvas);
        }

        function queueSnapshotRetryLoop() {
          clearSnapshotRetry();
          snapshotRetryCount = 0;
          const trySnapshot = function () {
            if (finished) {
              return;
            }
            if (refreshPortalSnapshot()) {
              return;
            }
            snapshotRetryCount += 1;
            if (snapshotRetryCount >= SNAPSHOT_MAX_RETRIES) {
              return;
            }
            snapshotRetryTimerId = setTimeout(trySnapshot, SNAPSHOT_RETRY_MS);
          };
          trySnapshot();
        }

        doorIntro.hidden = false;
        doorIntro.classList.remove("is-leaving");
        document.body.classList.add("intro-active");
        if (doorIntroFade) {
          doorIntroFade.style.opacity = "0";
        }

        try {
          runtime = createThreeDoorIntroRuntime({
            container: doorIntroStage,
            fadeLayer: doorIntroFade,
            durationMs: introDurationMs,
            reduceMotion: reduceMotion,
            doorAudioController: doorAudioController,
            textureCandidates: getBackgroundCandidates(false)
          });
          if (runtime && runtime.donePromise) {
            introMinDurationPromise = runtime.donePromise;
            queueSnapshotRetryLoop();
          }
        } catch (error) {
          console.warn("Three.js intro runtime failed; using fallback fade.", error);
        }

        return {
          refreshPortalSnapshot: refreshPortalSnapshot,
          complete: async function () {
            if (finished) {
              return;
            }
            finished = true;
            clearSnapshotRetry();
            await introMinDurationPromise;
            if (runtime && typeof runtime.dispose === "function") {
              runtime.dispose();
            }
            if (doorAudioController && typeof doorAudioController.dispose === "function") {
              doorAudioController.dispose();
              doorAudioController = null;
            }
            doorIntro.classList.add("is-leaving");
            await waitForMs(INTRO_FADE_DURATION_MS);
            if (doorIntroFade) {
              doorIntroFade.style.opacity = "0";
            }
            doorIntro.hidden = true;
            doorIntro.classList.remove("is-leaving");
            document.body.classList.remove("intro-active");
          }
        };
      }

      function isPortraitViewport() {
        return window.matchMedia("(orientation: portrait)").matches;
      }

      function getBackgroundCandidates(isPortrait = isPortraitViewport()) {
        return isPortrait
          ? [
            "NEWmainbackground.webp",
            "NEWmainbackground.png",
            "newmainbackground.png",
            "NewMainBackground.png"
          ]
          : [
            "NEWmainbackground.webp",
            "NEWmainbackground.png",
            "newmainbackground.png",
            "NewMainBackground.png"
          ];
      }


      function notifyParentIntroComplete() {
        if (!window.parent || window.parent === window) {
          return;
        }
        try {
          window.parent.postMessage(
            {
              scope: INTRO_MESSAGE_SCOPE,
              type: INTRO_MESSAGE_DONE,
              payload: {
                completedAt: Date.now()
              }
            },
            window.location.origin
          );
        } catch (error) {
          console.warn("Failed to notify parent of intro completion.", error);
        }
      }

      async function runBootstrapSequence() {
        const introController = createDoorIntroController();
        try {
          if (introController && typeof introController.refreshPortalSnapshot === "function") {
            introController.refreshPortalSnapshot();
          }
        } catch (error) {
          console.error("Classroom intro bootstrap failed.", error);
        } finally {
          await introController.complete();
          notifyParentIntroComplete();
        }
      }

      runBootstrapSequence();
    })();
  </script>
</body>
</html>
