          renderHotspots();
          refreshBackgroundRect();
          applyLayoutToAllHotspots();

          if (selectedObjectId && layoutState[selectedObjectId]) {
            setSelectedObject(selectedObjectId);
          }
          if (managerMode) {
            managerStatus.textContent = "Components auto-updated from " + COMPONENT_IMAGE_DIR + ".";
          }
          return true;
        } finally {
          componentRefreshInFlight = false;
        }
      }

      function handleComponentRefreshFocus() {
        refreshInteractiveObjects(false);
      }

      function handleComponentRefreshVisibility() {
        if (!document.hidden) {
          refreshInteractiveObjects(false);
        }
      }

      function startComponentAutoRefresh() {
        if (!MANAGER_UI_ENABLED) {
          return;
        }
        if (componentRefreshTimerId !== null) {
          clearInterval(componentRefreshTimerId);
        }
        componentRefreshTimerId = setInterval(function () {
          refreshInteractiveObjects(false);
        }, COMPONENT_AUTO_REFRESH_INTERVAL_MS);
        window.addEventListener("focus", handleComponentRefreshFocus);
        document.addEventListener("visibilitychange", handleComponentRefreshVisibility);
      }

      function stopComponentAutoRefresh() {
        if (componentRefreshTimerId !== null) {
          clearInterval(componentRefreshTimerId);
          componentRefreshTimerId = null;
        }
        window.removeEventListener("focus", handleComponentRefreshFocus);
        document.removeEventListener("visibilitychange", handleComponentRefreshVisibility);
      }

      async function initializeInteractiveObjects() {
        if (!MANAGER_UI_ENABLED) {
          const embeddedFiles = readEmbeddedComponentFiles();
          const savedFiles = readSavedComponentFiles();
          const bootstrapFiles = readBootstrapManifestComponentFiles();
          const baseFiles = mergeComponentFileSources(embeddedFiles, savedFiles, bootstrapFiles);
          componentFileCatalog = baseFiles.slice();
          componentCatalogSignature = componentFileListSignature(baseFiles);
          componentImageCacheBust = String(Date.now());
          interactiveObjects = buildInteractiveObjectsFromFiles(baseFiles, componentImageCacheBust);
          layoutState = createDefaultLayoutState();
          return;
        }
        await refreshInteractiveObjects(true);
      }

      function isEditableTarget(target) {
        if (!target) {
          return false;
        }
        const tag = target.tagName;
        return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || target.isContentEditable;
      }

      function sceneRect() {
        return scene.getBoundingClientRect();
      }

      function getComponentScale() {
        return isPortraitViewport() ? PORTRAIT_COMPONENT_SCALE : 1;
      }

      function getPortraitPanRange() {
        const minOffsetPercent = PORTRAIT_PAN_MIN_POSITION_PERCENT - PORTRAIT_BACKGROUND_POSITION_PERCENT;
        const maxOffsetPercent = PORTRAIT_PAN_MAX_POSITION_PERCENT - PORTRAIT_BACKGROUND_POSITION_PERCENT;
        return {
          minOffsetPercent: Math.min(minOffsetPercent, maxOffsetPercent),
          maxOffsetPercent: Math.max(minOffsetPercent, maxOffsetPercent),
          spanPercent: Math.abs(maxOffsetPercent - minOffsetPercent)
        };
      }

      function getPortraitObjectPositionPercent() {
        if (!isPortraitViewport()) {
          return LANDSCAPE_BACKGROUND_POSITION_PERCENT;
        }
        return clamp(
          PORTRAIT_BACKGROUND_POSITION_PERCENT + portraitPanOffsetPercent,
          PORTRAIT_PAN_MIN_POSITION_PERCENT,
          PORTRAIT_PAN_MAX_POSITION_PERCENT
        );
      }

      function refreshBackgroundRenderMetrics() {
        const stage = sceneRect();
        backgroundStageWidthPx = Math.max(stage.width, 1);
        backgroundStageHeightPx = Math.max(stage.height, 1);

        const naturalWidth = mainBackground.naturalWidth;
        const naturalHeight = mainBackground.naturalHeight;

        if (!naturalWidth || !naturalHeight) {
          backgroundRenderWidthPx = backgroundStageWidthPx;
          backgroundRenderHeightPx = backgroundStageHeightPx;
          return;
        }

        const scale = Math.max(
          backgroundStageWidthPx / naturalWidth,
          backgroundStageHeightPx / naturalHeight
        );
        backgroundRenderWidthPx = naturalWidth * scale;
        backgroundRenderHeightPx = naturalHeight * scale;
      }

      function getBackgroundRect() {
        const stage = sceneRect();
        return {
          left: stage.left + backgroundTranslateXPx,
          top: stage.top + backgroundTranslateYPx,
          width: backgroundRenderWidthPx || stage.width,
          height: backgroundRenderHeightPx || stage.height
        };
      }

      function refreshBackgroundRect() {
        refreshBackgroundRenderMetrics();
        applyPortraitPan();
        activeBackgroundRect = getBackgroundRect();
      }

      function applyLayoutToHotspotWithMetrics(hotspot, objectId, bounds, stage, componentScale) {
        const layout = layoutState[objectId];
        if (!layout || !hotspot || stage.width === 0 || stage.height === 0 || bounds.width === 0 || bounds.height === 0) {
          return;
        }

        const left = bounds.left + (layout.left / 100) * bounds.width;
        const top = bounds.top + (layout.top / 100) * bounds.height;
        const width = (layout.width / 100) * bounds.width * componentScale;

        hotspot.style.left = ((left - stage.left) / stage.width * 100) + "%";
        hotspot.style.top = ((top - stage.top) / stage.height * 100) + "%";
        hotspot.style.width = (width / stage.width) * 100 + "%";
      }

      function applyLayoutToHotspot(hotspot, objectId) {
        const bounds = activeBackgroundRect || getBackgroundRect();
        const stage = sceneRect();
        const componentScale = getComponentScale();
        applyLayoutToHotspotWithMetrics(hotspot, objectId, bounds, stage, componentScale);
      }

      function setSelectedObject(objectId) {
        if (!layoutState[objectId]) {
          return;
        }
        const previous = hotspotElementsById.get(selectedObjectId) || document.querySelector('[data-object-id="' + selectedObjectId + '"]');
        const next = hotspotElementsById.get(objectId) || document.querySelector('[data-object-id="' + objectId + '"]');
        if (previous && selectedObjectId && !hotspotElementsById.has(selectedObjectId)) {
          hotspotElementsById.set(selectedObjectId, previous);
        }
        if (next && objectId && !hotspotElementsById.has(objectId)) {
          hotspotElementsById.set(objectId, next);
        }
        if (previous) {
          previous.classList.remove("selected");
        }
        if (next) {
          next.classList.add("selected");
        }
        selectedObjectId = objectId;
        if (managerTarget) {
          managerTarget.value = objectId;
        }
        const layout = layoutState[objectId];
        const nextWidth = typeof layout.width === "number" ? layout.width : 20;
        managerSizeRange.value = String(nextWidth);
        managerSizeValue.textContent = nextWidth.toFixed(1) + "%";
      }

      function updateManagerSelectionEnabled(enabled) {
        managerTarget.disabled = !enabled;
        managerSizeRange.disabled = !enabled;
      }

      function updateManagerUi() {
        if (!MANAGER_UI_ENABLED) {
          managerMode = false;
          scene.classList.remove("manager-active");
          managerToggleBtn.hidden = true;
          managerPanel.hidden = true;
          saveLayoutBtn.hidden = true;
          resetLayoutBtn.hidden = true;
          updateManagerSelectionEnabled(false);
          stopComponentAutoRefresh();
          refreshScenePanState();
          return;
        }
        scene.classList.toggle("manager-active", managerMode);
        managerToggleBtn.hidden = false;
        managerPanel.hidden = !managerMode;
        saveLayoutBtn.hidden = !managerMode;
        resetLayoutBtn.hidden = !managerMode;
        updateManagerSelectionEnabled(managerMode);
        if (componentRefreshTimerId === null) {
          startComponentAutoRefresh();
        }
        refreshScenePanState();

        if (managerMode) {
          managerStatus.textContent = "Manager mode active. Drag hotspots, then Save & Lock.";
          return;
        }

        managerStatus.textContent = layoutLocked ? "Manager locked." : "Manager unlocked.";
      }

      function updateComponentWidth(objectId, nextWidth) {
        const layout = layoutState[objectId];
        if (!layout) {
          return;
        }
        const width = clamp(Number(nextWidth), 6, 60);
        layout.width = Number(width.toFixed(2));
        const hotspot = hotspotElementsById.get(objectId) || document.querySelector('[data-object-id="' + objectId + '"]');
        if (hotspot && !hotspotElementsById.has(objectId)) {
          hotspotElementsById.set(objectId, hotspot);
        }
        if (hotspot) {
          applyLayoutToHotspot(hotspot, objectId);
        }
        managerSizeValue.textContent = layout.width.toFixed(1) + "%";
        if (selectedObjectId) {
          managerStatus.textContent = selectedObjectId + " width: " + layout.width.toFixed(2) + "%";
        }
      }

      function applyLayoutToAllHotspots() {
        const stage = sceneRect();
        const bounds = getBackgroundRect();
        const componentScale = getComponentScale();
        activeBackgroundRect = bounds;
        interactiveObjects.forEach(function (obj) {
          const hotspot = hotspotElementsById.get(obj.id) || document.querySelector('[data-object-id="' + obj.id + '"]');
          if (hotspot && !hotspotElementsById.has(obj.id)) {
            hotspotElementsById.set(obj.id, hotspot);
          }
          if (hotspot) {
            applyLayoutToHotspotWithMetrics(hotspot, obj.id, bounds, stage, componentScale);
          }
        });
        hotspotPanAnchorOffsetPercent = portraitPanOffsetPercent;
        if (isPortraitViewport() && !managerMode) {
          hotspotPanPixelsPerOffsetPercent = (stage.width - bounds.width) / 100;
        } else {
          hotspotPanPixelsPerOffsetPercent = 0;
        }
        hotspotLayer.style.transform = "";
        hotspotPanTransformPx = 0;
      }

      function buildManagerTargets() {
        const prev = managerTarget.value;
        managerTarget.innerHTML = "";
        interactiveObjects.forEach(function (obj) {
          const option = document.createElement("option");
          option.value = obj.id;
          option.textContent = obj.label;
          managerTarget.appendChild(option);
        });
        selectedObjectId = null;
        if (prev && layoutState[prev]) {
          selectedObjectId = prev;
        } else if (interactiveObjects.length > 0) {
          selectedObjectId = interactiveObjects[0].id;
        }
        managerTarget.value = selectedObjectId || "";
        if (selectedObjectId) {
          setSelectedObject(selectedObjectId);
        } else {
          managerSizeValue.textContent = "—";
          managerSizeRange.value = "20.1";
        }
      }

      function applyPortraitPan() {
        if (
          backgroundStageWidthPx <= 0
          || backgroundStageHeightPx <= 0
          || backgroundRenderWidthPx <= 0
          || backgroundRenderHeightPx <= 0
        ) {
          refreshBackgroundRenderMetrics();
        }
        const isPortrait = isPortraitViewport();
        const objectPositionX = isPortrait
          ? getPortraitObjectPositionPercent()
          : LANDSCAPE_BACKGROUND_POSITION_PERCENT;
        const renderWidth = Math.max(backgroundRenderWidthPx, backgroundStageWidthPx);
        const renderHeight = Math.max(backgroundRenderHeightPx, backgroundStageHeightPx);
        backgroundTranslateXPx = (backgroundStageWidthPx - renderWidth) * (objectPositionX / 100);
        backgroundTranslateYPx = (backgroundStageHeightPx - renderHeight) * (LANDSCAPE_BACKGROUND_POSITION_PERCENT / 100);
        mainBackground.style.width = renderWidth.toFixed(3) + "px";
        mainBackground.style.height = renderHeight.toFixed(3) + "px";
        mainBackground.style.objectPosition = "50% 50%";
        mainBackground.style.transform = "translate3d(" + backgroundTranslateXPx.toFixed(3) + "px, " + backgroundTranslateYPx.toFixed(3) + "px, 0)";
      }

      function applyHotspotPanTransform() {
        if (!isPortraitViewport() || managerMode) {
          hotspotLayer.style.transform = "";
          hotspotPanTransformPx = 0;
          return;
        }
        const deltaOffsetPercent = portraitPanOffsetPercent - hotspotPanAnchorOffsetPercent;
        const nextShiftPx = deltaOffsetPercent * hotspotPanPixelsPerOffsetPercent;
        if (!Number.isFinite(nextShiftPx)) {
          return;
        }
        if (Math.abs(nextShiftPx - hotspotPanTransformPx) < 0.05) {
          return;
        }
        hotspotPanTransformPx = nextShiftPx;
        hotspotLayer.style.transform = "translate3d(" + nextShiftPx.toFixed(3) + "px, 0, 0)";
      }

      function stopPanMotion(cancelQueuedCommit = false) {
        if (panInertiaFrameId !== null) {
          cancelAnimationFrame(panInertiaFrameId);
          panInertiaFrameId = null;
        }
        panInertiaLastFrameMs = 0;
        panInertiaVelocityPercentPerMs = 0;
        if (cancelQueuedCommit && panCommitFrameId !== null) {
          cancelAnimationFrame(panCommitFrameId);
          panCommitFrameId = null;
          panQueuedOffsetPercent = portraitPanOffsetPercent;
        }
      }

      function commitPanOffset(nextOffsetPercent) {
        const panRange = getPortraitPanRange();
        const clampedOffsetPercent = clamp(
          nextOffsetPercent,
          panRange.minOffsetPercent,
          panRange.maxOffsetPercent
        );
        if (clampedOffsetPercent === portraitPanOffsetPercent) {
          return false;
        }
        portraitPanOffsetPercent = clampedOffsetPercent;
        applyPortraitPan();
        applyHotspotPanTransform();
        return true;
      }

      function queuePanCommit(nextOffsetPercent) {
        const panRange = getPortraitPanRange();
        panQueuedOffsetPercent = clamp(
          nextOffsetPercent,
          panRange.minOffsetPercent,
          panRange.maxOffsetPercent
        );
        if (panCommitFrameId !== null) {
          return;
        }
        panCommitFrameId = requestAnimationFrame(function () {
          panCommitFrameId = null;
          commitPanOffset(panQueuedOffsetPercent);
        });
      }

      function flushQueuedPanCommit() {
        if (panCommitFrameId !== null) {
          cancelAnimationFrame(panCommitFrameId);
          panCommitFrameId = null;
        }
        commitPanOffset(panQueuedOffsetPercent);
      }

      function stepPanInertia(timeMs) {
        if (!isPortraitViewport() || managerMode) {
          stopPanMotion(true);
          return;
        }
        if (panInertiaLastFrameMs === 0) {
          panInertiaLastFrameMs = timeMs;
          panInertiaFrameId = requestAnimationFrame(stepPanInertia);
          return;
        }
        const dtMs = Math.min(48, Math.max(0, timeMs - panInertiaLastFrameMs));
        panInertiaLastFrameMs = timeMs;
        if (dtMs <= 0) {
          panInertiaFrameId = requestAnimationFrame(stepPanInertia);
          return;
        }

        const decay = Math.exp(-PAN_INERTIA_DECAY_PER_SECOND * (dtMs / 1000));
        panInertiaVelocityPercentPerMs *= decay;
        if (Math.abs(panInertiaVelocityPercentPerMs) < PAN_INERTIA_MIN_VELOCITY_PERCENT_PER_MS) {
          stopPanMotion(true);
          return;
        }

        const nextOffsetPercent = portraitPanOffsetPercent + panInertiaVelocityPercentPerMs * dtMs;
        const moved = commitPanOffset(nextOffsetPercent);
        const panRange = getPortraitPanRange();
        const atLeftEdge = portraitPanOffsetPercent <= panRange.minOffsetPercent + PAN_EDGE_EPSILON_PERCENT;
        const atRightEdge = portraitPanOffsetPercent >= panRange.maxOffsetPercent - PAN_EDGE_EPSILON_PERCENT;
        if (!moved || atLeftEdge || atRightEdge) {
          stopPanMotion(true);
          return;
        }

        panInertiaFrameId = requestAnimationFrame(stepPanInertia);
      }

      function startPanInertia(initialVelocityPercentPerMs) {
        const clampedVelocity = clamp(
          initialVelocityPercentPerMs,
          -PAN_INERTIA_MAX_VELOCITY_PERCENT_PER_MS,
          PAN_INERTIA_MAX_VELOCITY_PERCENT_PER_MS
        );
        if (Math.abs(clampedVelocity) < PAN_FLICK_MIN_VELOCITY_PERCENT_PER_MS) {
          stopPanMotion(true);
          return;
        }
        stopPanMotion(true);
        panInertiaVelocityPercentPerMs = clampedVelocity;
        panInertiaLastFrameMs = 0;
        panInertiaFrameId = requestAnimationFrame(stepPanInertia);
      }

      function refreshScenePanState() {
        const panEnabled = isPortraitViewport() && !managerMode;
        const wasPanEnabled = scene.classList.contains("pan-enabled");
        scene.classList.toggle("pan-enabled", panEnabled);
        if (!panEnabled) {
          stopPanMotion(true);
        }
        if (!panEnabled && scenePanDrag) {
          if (scenePanDrag.captured && scene.hasPointerCapture(scenePanDrag.pointerId)) {
            scene.releasePointerCapture(scenePanDrag.pointerId);
          }
          scene.classList.remove("panning");
          scenePanDrag = null;
        }
        const shouldRebaseHotspots = (panEnabled !== wasPanEnabled)
          || (!panEnabled && hotspotPanTransformPx !== 0);
        if (shouldRebaseHotspots) {
          refreshBackgroundRect();
          applyLayoutToAllHotspots();
        }
      }

      function shouldSuppressHotspotClick() {
        return performance.now() < suppressHotspotClickUntilMs;
      }

      function beginScenePan(event) {
        if (managerMode || !isPortraitViewport()) {
          return;
        }
        if (event.button !== undefined && event.button !== 0) {
          return;
        }
        if (isEditableTarget(event.target)) {
          return;
        }
        stopPanMotion(true);
        // Ensure render metrics are current before snapshotting pixel state
        refreshBackgroundRenderMetrics();
        const nowMs = performance.now();
        const panRange = getPortraitPanRange();
        // Compute the pixel translate range (stage width minus render width — always <= 0)
        const renderWidth = Math.max(backgroundRenderWidthPx, backgroundStageWidthPx);
        const translateRangePx = backgroundStageWidthPx - renderWidth;
        scenePanDrag = {
          pointerId: event.pointerId,
          startClientX: event.clientX,
          // Snapshot background's current pixel position so we can map finger→image 1:1
          startTranslateXPx: backgroundTranslateXPx,
          translateRangePx: translateRangePx,
          liveOffsetPercent: portraitPanOffsetPercent,
          panRangeMinOffsetPercent: panRange.minOffsetPercent,
          panRangeMaxOffsetPercent: panRange.maxOffsetPercent,
          lastSampleTimeMs: nowMs,
          lastSampleOffsetPercent: portraitPanOffsetPercent,
          velocityPercentPerMs: 0,
          moved: false,
          captured: false
        };
        scene.classList.add("panning");
        try {
          scene.setPointerCapture(event.pointerId);
          scenePanDrag.captured = true;
        } catch (error) {
          scenePanDrag.captured = false;
        }
      }

      function moveScenePan(event) {
        if (!scenePanDrag || event.pointerId !== scenePanDrag.pointerId) {
          return;
        }
        if (managerMode || !isPortraitViewport()) {
          endScenePan(event);
          return;
        }

        const coalesced = typeof event.getCoalescedEvents === "function"
          ? event.getCoalescedEvents()
          : null;
        const samples = coalesced && coalesced.length ? coalesced : [event];
        let processedAny = false;

        for (let index = 0; index < samples.length; index += 1) {
          const sample = samples[index];
          // Use absolute delta from drag-start for perfect 1:1 finger→image mapping
          const totalDeltaXPx = sample.clientX - scenePanDrag.startClientX;
          if (!scenePanDrag.moved && Math.abs(totalDeltaXPx) <= PAN_DRAG_THRESHOLD_PX) {
            continue;
          }
          if (!scenePanDrag.moved) {
            scenePanDrag.moved = true;
          }

          // Map finger delta directly to background pixel position, then convert to offset %
          const translateRange = scenePanDrag.translateRangePx; // <= 0
          const rawTranslateXPx = scenePanDrag.startTranslateXPx + totalDeltaXPx;
          const nextTranslateXPx = clamp(
            rawTranslateXPx,
            Math.min(translateRange, 0),
            Math.max(translateRange, 0)
          );
          // Invert the applyPortraitPan formula to get objectPositionX
          // backgroundTranslateXPx = (stage - render) * (objectPos / 100)
          // → objectPos = translateX / (stage - render) * 100
          const nextObjectPositionX = translateRange !== 0
            ? (nextTranslateXPx / translateRange) * 100
            : PORTRAIT_BACKGROUND_POSITION_PERCENT;
          const nextOffsetPercent = clamp(
            nextObjectPositionX - PORTRAIT_BACKGROUND_POSITION_PERCENT,
            scenePanDrag.panRangeMinOffsetPercent,
            scenePanDrag.panRangeMaxOffsetPercent
          );

          if (nextOffsetPercent === scenePanDrag.liveOffsetPercent) {
            continue;
          }
          scenePanDrag.liveOffsetPercent = nextOffsetPercent;
          panQueuedOffsetPercent = nextOffsetPercent;

          const nowMs = performance.now();
          const dtMs = nowMs - scenePanDrag.lastSampleTimeMs;
          if (dtMs > 0) {
            const sampledVelocity = (nextOffsetPercent - scenePanDrag.lastSampleOffsetPercent) / dtMs;
            scenePanDrag.velocityPercentPerMs = (scenePanDrag.velocityPercentPerMs * PAN_VELOCITY_SMOOTHING)
              + (sampledVelocity * (1 - PAN_VELOCITY_SMOOTHING));
            scenePanDrag.lastSampleTimeMs = nowMs;
            scenePanDrag.lastSampleOffsetPercent = nextOffsetPercent;
          }
          processedAny = true;
        }

        if (!processedAny) {
          return;
        }
        queuePanCommit(scenePanDrag.liveOffsetPercent);
        if (event.cancelable) {
          event.preventDefault();
        }
      }

      function endScenePan(event) {
        if (!scenePanDrag || event.pointerId !== scenePanDrag.pointerId) {
          return;
        }
        if (scenePanDrag.captured && scene.hasPointerCapture(event.pointerId)) {
          scene.releasePointerCapture(event.pointerId);
        }
        if (scenePanDrag.moved) {
          flushQueuedPanCommit();
          suppressHotspotClickUntilMs = performance.now() + HOTSPOT_CLICK_SUPPRESSION_MS;
          const idleSinceLastMoveMs = performance.now() - scenePanDrag.lastSampleTimeMs;
          const releaseVelocity = idleSinceLastMoveMs > PAN_RELEASE_IDLE_MS
            ? 0
            : scenePanDrag.velocityPercentPerMs;
          startPanInertia(releaseVelocity * PAN_RELEASE_VELOCITY_BOOST);
        } else {
          stopPanMotion(true);
        }
        scene.classList.remove("panning");
        scenePanDrag = null;
      }

      function findTouchById(touchList, id) {
        if (!touchList) {
          return null;
        }
        for (let index = 0; index < touchList.length; index += 1) {
          const touch = touchList[index];
          if (touch && touch.identifier === id) {
            return touch;
          }
        }
        return null;
      }

      function beginScenePanTouch(event) {
        if (SUPPORTS_POINTER_EVENTS || fallbackTouchPointerId !== null) {
          return;
        }
        const touch = event.changedTouches && event.changedTouches[0];
        if (!touch) {
          return;
        }
        fallbackTouchPointerId = touch.identifier;
        beginScenePan({
          pointerId: touch.identifier,
          clientX: touch.clientX,
          clientY: touch.clientY,
          button: 0,
          target: event.target
        });
      }

      function moveScenePanTouch(event) {
        if (SUPPORTS_POINTER_EVENTS || fallbackTouchPointerId === null) {
          return;
        }
        const touch = findTouchById(event.touches, fallbackTouchPointerId)
          || findTouchById(event.changedTouches, fallbackTouchPointerId);
        if (!touch) {
          return;
        }
        moveScenePan({
          pointerId: fallbackTouchPointerId,
          clientX: touch.clientX,
          clientY: touch.clientY,
          target: event.target,
          cancelable: event.cancelable
        });
        if (event.cancelable) {
          event.preventDefault();
        }
      }

      function endScenePanTouch(event) {
        if (SUPPORTS_POINTER_EVENTS || fallbackTouchPointerId === null) {
          return;
        }
        const touch = findTouchById(event.changedTouches, fallbackTouchPointerId);
        if (!touch && event.type !== "touchcancel") {
          return;
        }
        endScenePan({
          pointerId: fallbackTouchPointerId,
          type: event.type
        });
        fallbackTouchPointerId = null;
      }

      function applyImageWithFallback(img, candidates) {
        let index = 0;
        const tryNext = function () {
          if (index >= candidates.length) {
            return;
          }
          img.onerror = tryNext;
          img.src = candidates[index];
          index += 1;
        };

        tryNext();
      }

      function syncBackgroundForViewport(forceLoad = false) {
        const isPortrait = isPortraitViewport();
        const mode = isPortrait ? "portrait" : "landscape";
        mainBackground.style.objectFit = "cover";
        if (!isPortrait) {
          portraitPanOffsetPercent = 0;
        }
        refreshBackgroundRenderMetrics();
        applyPortraitPan();
        refreshScenePanState();

        if (!forceLoad && mode === backgroundMode) {
          return;
        }

        backgroundMode = mode;
        applyImageWithFallback(mainBackground, getVersionedBackgroundCandidates(isPortrait));
      }

      function performViewportRefresh(forceLoad = false) {
        const nextViewportMode = isPortraitViewport() ? "portrait" : "landscape";
        const switchedViewportMode = nextViewportMode !== backgroundMode;
        syncBackgroundForViewport(forceLoad);
        refreshBackgroundRect();
        applyLayoutToAllHotspots();
        if (switchedViewportMode) {
          forceManagerLock();
        }
      }

      function scheduleViewportRefresh(forceLoad = false) {
        viewportRefreshForceLoad = viewportRefreshForceLoad || forceLoad;
        if (viewportRefreshFrameId !== null) {
          return;
        }
        viewportRefreshFrameId = requestAnimationFrame(function () {
          const shouldForceLoad = viewportRefreshForceLoad;
          viewportRefreshFrameId = null;
          viewportRefreshForceLoad = false;
          performViewportRefresh(shouldForceLoad);
        });
      }

      function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function makeQuestion() {
        const mode = randomInt(1, 3);
        if (mode === 1) {
          const a = randomInt(5, 39);
          const b = randomInt(2, 16);
          return { prompt: a + " + " + b + " = ?", answer: a + b };
        }
        if (mode === 2) {
          const a = randomInt(15, 45);
          const b = randomInt(4, 14);
          return { prompt: a + " - " + b + " = ?", answer: a - b };
        }
        const a = randomInt(3, 12);
        const b = randomInt(3, 12);
        return { prompt: a + " x " + b + " = ?", answer: a * b };
      }

      function createDefaultLayoutState() {
        const state = {};
        interactiveObjects.forEach(function (obj) {
          const fallback = genericDefaultLayout(0);
          const defaults = obj.defaultLayout || fallback;
          state[obj.id] = {
            left: Number(defaults.left),
            top: Number(defaults.top),
            width: Number(defaults.width)
          };
        });
        return state;
      }

      function sanitizeLayoutSnapshot(rawLayout, defaults) {
        const nextLayout = {};
        const source = rawLayout && typeof rawLayout === "object" ? rawLayout : {};
        interactiveObjects.forEach(function (obj) {
          const defaultEntry = defaults[obj.id];
          const rawEntry = source[obj.id];
          if (!rawEntry || typeof rawEntry !== "object") {
            nextLayout[obj.id] = {
              left: defaultEntry.left,
              top: defaultEntry.top,
              width: defaultEntry.width
            };
            return;
          }

          const left = Number(rawEntry.left);
          const top = Number(rawEntry.top);
          const width = Number(rawEntry.width);
          nextLayout[obj.id] = {
            left: Number.isFinite(left) ? clamp(left, 0, 95) : defaultEntry.left,
            top: Number.isFinite(top) ? clamp(top, 0, 95) : defaultEntry.top,
            width: Number.isFinite(width) ? clamp(width, 6, 60) : defaultEntry.width
          };
        });
        return nextLayout;
      }

      function sanitizeLooseLayout(rawLayout) {
        const source = rawLayout && typeof rawLayout === "object" ? rawLayout : {};
        const nextLayout = {};
        Object.keys(source).forEach(function (objectId) {
          const rawEntry = source[objectId];
          if (!rawEntry || typeof rawEntry !== "object") {
            return;
          }

          const left = Number(rawEntry.left);
          const top = Number(rawEntry.top);
          const width = Number(rawEntry.width);
          if (!Number.isFinite(left) || !Number.isFinite(top) || !Number.isFinite(width)) {
            return;
          }

          nextLayout[objectId] = {
            left: clamp(left, 0, 95),
            top: clamp(top, 0, 95),
            width: clamp(width, 6, 60)
          };
        });
        return nextLayout;
      }

      function buildPersistedClassroomState() {
        return {
          layout: layoutState,
          locked: layoutLocked,
          componentFiles: componentFileCatalog.slice()
        };
      }

      function stateSignature(state) {
        try {
          return JSON.stringify(state);
        } catch (error) {
          return "";
        }
      }

      function parsePersistedClassroomState(rawState) {
        if (!rawState || typeof rawState !== "object") {
          return null;
        }
        const safeLayout = sanitizeLooseLayout(rawState.layout);
        const safeComponentFiles = Array.isArray(rawState.componentFiles)
          ? normalizeComponentFiles(rawState.componentFiles)
          : [];
        const safeLocked = typeof rawState.locked === "boolean" ? rawState.locked : true;

        return {
          layout: safeLayout,
          locked: safeLocked,
          componentFiles: safeComponentFiles
        };
      }

      function getEmbeddedStateElement() {
        return document.getElementById(EMBEDDED_STATE_SCRIPT_ID);
      }

      function readEmbeddedStateSnapshot() {
        const scriptEl = getEmbeddedStateElement();
        if (!scriptEl) {
          return null;
        }
        const raw = String(scriptEl.textContent || "").trim();
        if (!raw) {
          return null;
        }
        try {
          const parsed = JSON.parse(raw);
          return parsePersistedClassroomState(parsed);
        } catch (error) {
          return null;
        }
      }

      function writeEmbeddedStateSnapshot(snapshot) {
        if (!snapshot) {
          return;
        }
        const scriptEl = getEmbeddedStateElement();
        if (!scriptEl) {
          return;
        }
        scriptEl.textContent = "\n" + JSON.stringify(snapshot, null, 2) + "\n";
      }

      async function persistSnapshotIntoIndexHtml(snapshot, reason) {
        if (!snapshot) {
          return false;
        }
        writeEmbeddedStateSnapshot(snapshot);
        try {
          const response = await fetch(EMBEDDED_STATE_SAVE_ENDPOINT, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            credentials: "same-origin",
            body: JSON.stringify({
              state: snapshot,
              reason: reason || "manager-save"
            })
          });
          if (!response.ok) {
            return false;
          }
          const payload = await response.json();
          const normalized = parsePersistedClassroomState(payload && payload.state);
          if (normalized) {
            writeEmbeddedStateSnapshot(normalized);
          }
          return true;
        } catch (error) {
          return false;
        }
      }

      function postMessageToParent(type, payload) {
        if (!window.parent || window.parent === window) {
          return;
        }
        window.parent.postMessage(
          {
            scope: CLASSROOM_SYNC_SCOPE,
            type: type,
            payload: payload || {}
          },
          window.location.origin
        );
      }

      function requestParentSync() {
        postMessageToParent(CLASSROOM_MESSAGE_READY, {
          clientId: iframeClientId
        });
        postMessageToParent(CLASSROOM_MESSAGE_AUTH_REQUEST, {
          clientId: iframeClientId
        });
        postMessageToParent(CLASSROOM_MESSAGE_STATE_REQUEST, {
          clientId: iframeClientId
        });
      }

      function resolveInitialSyncWait() {
        if (initialSyncResolved) {
          return;
        }
        initialSyncResolved = true;
        if (typeof initialSyncResolver === "function") {
          initialSyncResolver();
          initialSyncResolver = null;
        }
      }

      function waitForInitialSync() {
        return new Promise(function (resolve) {
          if (initialSyncResolved) {
            resolve();
            return;
          }
          initialSyncResolver = resolve;
          window.setTimeout(function () {
            resolveInitialSyncWait();
          }, CLASSROOM_INITIAL_SYNC_WAIT_MS);
        });
      }

      function queueRemoteStateSave(reason) {
        if (!remoteSyncEnabled || !managerAccessGranted || remoteApplyInProgress) {
          return;
        }

        if (remoteSaveTimerId !== null) {
          clearTimeout(remoteSaveTimerId);
        }

        remoteSaveTimerId = window.setTimeout(function () {
          remoteSaveTimerId = null;
          const snapshot = buildPersistedClassroomState();
          const signature = stateSignature(snapshot);
          if (!signature || signature === lastRemoteStateSignature) {
            return;
          }

          lastRemoteStateSignature = signature;
          postMessageToParent(CLASSROOM_MESSAGE_STATE_SAVE, {
            clientId: iframeClientId,
            reason: reason || "update",
            username: remoteUsername || "",
            state: snapshot
          });
        }, CLASSROOM_REMOTE_SAVE_DEBOUNCE_MS);
      }

      function applyLayoutSnapshot(savedLayout, savedLockState) {
        const defaults = createDefaultLayoutState();
        layoutState = sanitizeLayoutSnapshot(savedLayout, defaults);
        if (typeof savedLockState === "boolean") {
          layoutLocked = savedLockState;
        }
      }

      function mirrorSnapshotToLocalStorage(snapshot) {
        if (!snapshot) {
          return;
        }
        saveToStorage(STORAGE_LAYOUT_KEY, snapshot.layout);
        saveToStorage(STORAGE_LOCK_KEY, snapshot.locked);
        saveToStorage(STORAGE_COMPONENT_FILES_KEY, snapshot.componentFiles);
      }

      async function applyRemoteSnapshot(snapshot, source) {
        const parsed = parsePersistedClassroomState(snapshot);
        if (!parsed) {
          return;
        }
        parsed.componentFiles = mergeComponentFileSources(
          parsed.componentFiles,
          readBootstrapManifestComponentFiles(),
          componentFileCatalog
        );

        const nextSignature = stateSignature(parsed);
        if (nextSignature && nextSignature === lastRemoteStateSignature) {
          return;
        }

        lastRemoteStateSignature = nextSignature;
        remoteApplyInProgress = true;
        try {
          pendingRemoteState = parsed;
          mirrorSnapshotToLocalStorage(parsed);
          writeEmbeddedStateSnapshot(parsed);
          componentFileCatalog = parsed.componentFiles.slice();
          componentCatalogSignature = componentFileListSignature(componentFileCatalog);
          if (!hasUiInitialized) {
            return;
          }

          if (activeDrag) {
            endDrag({ pointerId: activeDrag.pointerId });
          }
          if (panelDrag) {
            endPanelDrag({ pointerId: panelDrag.pointerId });
          }

          componentImageCacheBust = String(Date.now());
          interactiveObjects = buildInteractiveObjectsFromFiles(componentFileCatalog, componentImageCacheBust);
          applyLayoutSnapshot(parsed.layout, parsed.locked);
          buildManagerTargets();
          renderHotspots();
          refreshBackgroundRect();
          applyLayoutToAllHotspots();
          updateManagerUi();
          if (managerMode) {
            managerStatus.textContent = "Live update received from " + (source || "cloud") + ".";
          }
        } finally {
          remoteApplyInProgress = false;
        }
      }

      function handleParentMessage(event) {
        if (event.origin !== window.location.origin) {
          return;
        }
        const message = event.data;
        if (!message || message.scope !== CLASSROOM_SYNC_SCOPE || typeof message.type !== "string") {
          return;
        }

        if (message.type === CLASSROOM_MESSAGE_NAVIGATE_ACK) {
          const payload = message.payload && typeof message.payload === "object" ? message.payload : {};
          logWorksheetDebug("classroom-navigate-ack", {
            path: typeof payload.path === "string" ? payload.path : null
          });
          clearWorksheetNavigationFallback();
          return;
        }

        if (message.type === CLASSROOM_MESSAGE_AUTH_SYNC) {
          const payload = message.payload && typeof message.payload === "object" ? message.payload : {};
          const nextUserId = payload.userId;
          const nextUsername = payload.username;
          const wasManagerAccessGranted = managerAccessGranted;
          managerAccessGranted = Boolean(payload.isManager);
          applyManagerAccessState();
          remoteSyncEnabled = typeof nextUserId === "string" && nextUserId.length > 0;
          remoteUsername = typeof nextUsername === "string" ? nextUsername : "";
          if (hasUiInitialized && wasManagerAccessGranted !== managerAccessGranted) {
            if (!MANAGER_UI_ENABLED && managerMode) {
              setManagerMode(false);
            } else if (MANAGER_UI_ENABLED && AUTO_MANAGER_MODE && !managerMode) {
              setManagerMode(true);
            }
            updateManagerUi();
            if (MANAGER_UI_ENABLED) {
              void refreshInteractiveObjects(true);
            }
          }
          resolveInitialSyncWait();
          return;
        }

        if (message.type === CLASSROOM_MESSAGE_STATE_SYNC) {
          const payload = message.payload && typeof message.payload === "object" ? message.payload : {};
          const remoteState = payload.state;
          const source = typeof payload.source === "string" ? payload.source : "cloud";
          void applyRemoteSnapshot(remoteState, source);
          resolveInitialSyncWait();
        }
      }

      window.addEventListener("message", handleParentMessage);

      function readFromStorage(key) {
        try {
          const raw = localStorage.getItem(key);
          if (!raw) {
            return null;
          }
          return JSON.parse(raw);
        } catch (error) {
          return null;
        }
      }

      function saveToStorage(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (error) {
          return;
        }
        if (
          key === STORAGE_LAYOUT_KEY
          || key === STORAGE_LOCK_KEY
          || key === STORAGE_COMPONENT_FILES_KEY
        ) {
          queueRemoteStateSave("storage-write");
        }
      }

      function hydrateLayoutFromStorage() {
        const savedLayout = readFromStorage(STORAGE_LAYOUT_KEY);
        const savedLockState = readFromStorage(STORAGE_LOCK_KEY);
        applyLayoutSnapshot(savedLayout, savedLockState);
      }

      function hydrateLayoutFromEmbeddedState() {
        const embedded = readEmbeddedStateSnapshot();
        if (!embedded) {
          return false;
        }
        applyLayoutSnapshot(embedded.layout, embedded.locked);
        const mergedComponentFiles = mergeComponentFileSources(
          embedded.componentFiles,
          readSavedComponentFiles(),
          readBootstrapManifestComponentFiles(),
          componentFileCatalog
        );
        if (mergedComponentFiles.length) {
          componentFileCatalog = mergedComponentFiles.slice();
          componentCatalogSignature = componentFileListSignature(componentFileCatalog);
        }
        mirrorSnapshotToLocalStorage({
          layout: embedded.layout,
          locked: embedded.locked,
          componentFiles: mergedComponentFiles.length ? mergedComponentFiles : embedded.componentFiles
        });
        return true;
      }


      function beginDrag(event, objectId) {
        if (!managerMode) {
          return;
        }
        if (event.button !== undefined && event.button !== 0) {
          return;
        }
        setSelectedObject(objectId);
        event.preventDefault();
        const hotspot = event.currentTarget;
        const bounds = activeBackgroundRect || getBackgroundRect();
        const hotspotRect = hotspot.getBoundingClientRect();
        const layout = layoutState[objectId];
        const currentWidthPx = (layout.width / 100) * bounds.width * getComponentScale();
        const scale = Math.max(0.001, currentWidthPx / Math.max(1, hotspotRect.width));
        const widthPx = hotspotRect.width * scale;
        const heightPx = hotspotRect.height * scale;
        const leftPx = bounds.left + (layout.left / 100) * bounds.width;
        const topPx = bounds.top + (layout.top / 100) * bounds.height;
        const stage = sceneRect();

        activeDrag = {
          objectId: objectId,
          pointerId: event.pointerId,
          hotspot: hotspot,
          widthPx: widthPx,
          heightPx: heightPx,
          pointerStart: {
            left: clamp(leftPx - event.clientX, -widthPx, widthPx),
            top: clamp(topPx - event.clientY, -heightPx, heightPx)
          },
          bgMin: {
            left: bounds.left,
            top: bounds.top
          },
          bgMax: {
            left: bounds.left + bounds.width - widthPx,
            top: bounds.top + bounds.height - heightPx
          },
          stage: stage
        };

        hotspot.classList.add("dragging");
        hotspot.setPointerCapture(event.pointerId);
      }

      function moveDrag(event) {
        if (!activeDrag || event.pointerId !== activeDrag.pointerId) {
          return;
        }
        const bounds = activeBackgroundRect || getBackgroundRect();
        const objectLayout = layoutState[activeDrag.objectId];
        if (!objectLayout) {
          return;
        }

        const leftPx = clamp(
          event.clientX + activeDrag.pointerStart.left,
          bounds.left,
          bounds.left + bounds.width - activeDrag.widthPx
        );
        const topPx = clamp(
          event.clientY + activeDrag.pointerStart.top,
          bounds.top,
          bounds.top + bounds.height - activeDrag.heightPx
        );

        const stage = activeDrag.stage || sceneRect();
        objectLayout.left = Number(((leftPx - bounds.left) / bounds.width * 100).toFixed(2));
        objectLayout.top = Number(((topPx - bounds.top) / bounds.height * 100).toFixed(2));
        objectLayout.left = clamp(objectLayout.left, 0, 100);
        objectLayout.top = clamp(objectLayout.top, 0, 100);

        applyLayoutToHotspot(activeDrag.hotspot, activeDrag.objectId);

        managerStatus.textContent = activeDrag.objectId + " position: x " + objectLayout.left.toFixed(2) + "%, y " + objectLayout.top.toFixed(2) + "%";
      }

      function endDrag(event) {
        if (!activeDrag || event.pointerId !== activeDrag.pointerId) {
          return;
        }
        if (activeDrag.hotspot.hasPointerCapture(event.pointerId)) {
          activeDrag.hotspot.releasePointerCapture(event.pointerId);
        }
        activeDrag.hotspot.classList.remove("dragging");
        activeDrag = null;
      }

      function setManagerMode(nextMode) {
        if (!MANAGER_UI_ENABLED) {
          managerMode = false;
          updateManagerUi();
          return;
        }
        managerMode = nextMode;
        if (managerMode && !selectedObjectId) {
          buildManagerTargets();
        }
        if (managerMode) {
          layoutLocked = false;
          saveToStorage(STORAGE_LOCK_KEY, layoutLocked);
        } else if (activeDrag) {
          endDrag({ pointerId: activeDrag.pointerId });
        }
        if (!managerMode && panelDrag) {
          endPanelDrag({ pointerId: panelDrag.pointerId });
        }
        updateManagerUi();
      }

      function forceManagerLock() {
        if (!managerMode && layoutLocked) {
          return;
        }
        layoutLocked = true;
        saveToStorage(STORAGE_LOCK_KEY, layoutLocked);
        if (managerMode) {
          setManagerMode(false);
          return;
        }
        updateManagerUi();
      }

      function beginPanelDrag(event) {
        if (!managerMode) {
          return;
        }
        if (event.button !== undefined && event.button !== 0) {
          return;
        }
        if (event.target && event.target.id === "closeManagerPanel") {
          return;
        }
        const panelRect = managerPanel.getBoundingClientRect();
        panelDrag = {
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          left: panelRect.left,
          top: panelRect.top,
          moved: false,
          nextLeft: panelRect.left,
          nextTop: panelRect.top,
          framePending: false
        };
        event.preventDefault();
        managerPanelHeader.style.cursor = "grabbing";
        managerPanelHeader.setPointerCapture(event.pointerId);
      }

      function movePanelDrag(event) {
        if (!panelDrag || event.pointerId !== panelDrag.pointerId) {
          return;
        }
        const dx = event.clientX - panelDrag.startX;
        const dy = event.clientY - panelDrag.startY;
        if (!panelDrag.moved && Math.abs(dx) + Math.abs(dy) < PANEL_DRAG_THRESHOLD_PX) {
          return;
        }
        panelDrag.moved = true;
        panelDrag.nextLeft = clamp(
          panelDrag.left + dx,
          0,
          Math.max(0, window.innerWidth - managerPanel.offsetWidth)
        );
        panelDrag.nextTop = clamp(
          panelDrag.top + dy,
          0,
          Math.max(0, window.innerHeight - managerPanel.offsetHeight)
        );
        if (panelDrag.framePending) {
          return;
        }
        panelDrag.framePending = true;
        requestAnimationFrame(function () {
          if (!panelDrag) {
            return;
          }
          managerPanel.style.left = panelDrag.nextLeft + "px";
          managerPanel.style.top = panelDrag.nextTop + "px";
          panelDrag.framePending = false;
        });
      }

      function endPanelDrag(event) {
        if (!panelDrag || event.pointerId !== panelDrag.pointerId) {
          return;
        }
        if (event.type !== "lostpointercapture" && managerPanelHeader.hasPointerCapture(event.pointerId)) {
          managerPanelHeader.releasePointerCapture(event.pointerId);
        }
        managerPanel.style.left = panelDrag.nextLeft + "px";
        managerPanel.style.top = panelDrag.nextTop + "px";
        panelDrag = null;
        managerPanelHeader.style.cursor = "grab";
      }

      function renderHotspots() {
        hotspotLayer.innerHTML = "";
        hotspotElementsById.clear();
        interactiveObjects.forEach(function (obj) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = obj.className || "hotspot";
          btn.id = obj.id + "Hotspot";
          btn.dataset.objectId = obj.id;
          if (obj.id === selectedObjectId) {
            btn.classList.add("selected");
          }
          btn.setAttribute("aria-label", obj.label);
          btn.title = obj.label;
          applyLayoutToHotspot(btn, obj.id);

          const sprite = document.createElement("img");
          sprite.alt = "";
          applyImageWithFallback(sprite, obj.imageCandidates);
          btn.appendChild(sprite);

          btn.addEventListener("click", function (event) {
            setSelectedObject(obj.id);
            if (managerMode) {
              event.preventDefault();
              return;
            }
            if (shouldSuppressHotspotClick()) {
              event.preventDefault();
              return;
            }
            if (isWorksheetHotspotObject(obj)) {
              event.preventDefault();
              openWorksheetViewerFromHotspot();
              return;
            }
            openGameFrame("games/" + getGameSlug(obj) + "/index.html");
          });
          btn.addEventListener("pointerdown", function (event) {
            beginDrag(event, obj.id);
          });
          btn.addEventListener("pointermove", moveDrag);
          btn.addEventListener("pointerup", endDrag);
          btn.addEventListener("pointercancel", endDrag);
          hotspotElementsById.set(obj.id, btn);
          hotspotLayer.appendChild(btn);
        });
      }

      function resetGameUi() {
        secondsLeft = 30;
        score = 0;
        currentQuestion = null;
        gameRunning = false;
        timerEl.textContent = "Time: 30s";
        scoreEl.textContent = "Score: 0";
        questionEl.textContent = "Press Start to begin.";
        resultTextEl.textContent = "";
        answerInput.value = "";
        answerInput.disabled = true;
        submitAnswerBtn.disabled = true;
        startBtn.hidden = false;
        restartBtn.hidden = true;
      }

      function nextQuestion() {
        currentQuestion = makeQuestion();
        questionEl.textContent = currentQuestion.prompt;
      }

      function finishGame() {
        gameRunning = false;
        clearInterval(timerId);
        timerId = null;
        answerInput.disabled = true;
        submitAnswerBtn.disabled = true;
        restartBtn.hidden = false;

        let grade = "Keep practicing.";
        if (score >= 10) {
          grade = "Excellent speed.";
        } else if (score >= 7) {
          grade = "Great run.";
        } else if (score >= 4) {
          grade = "Solid effort.";
        }

        questionEl.textContent = "Time is up.";
        resultTextEl.textContent = "Final score: " + score + ". " + grade;
      }

      function startGame() {
        resetGameUi();
        gameRunning = true;
        answerInput.disabled = false;
        submitAnswerBtn.disabled = false;
        startBtn.hidden = true;
        answerInput.focus();
        nextQuestion();

        timerId = setInterval(function () {
          secondsLeft -= 1;
          timerEl.textContent = "Time: " + secondsLeft + "s";
          if (secondsLeft <= 0) {
            finishGame();
          }
        }, 1000);
      }

      function openMinigame(mode) {
        if (mode !== "laptopMath") {
          return;
        }
        minigameModal.hidden = false;
        resetGameUi();
      }

      function closeMinigame() {
        clearInterval(timerId);
        timerId = null;
        minigameModal.hidden = true;
      }

      // ── Game Frame ────────────────────────────────────────────
      // Derive the games/ folder slug from a component object.
      // Convention: ComponentImages/Laptop.png → games/laptop/index.html
      //             ComponentImages/RedBackpack.png → games/redbackpack/index.html
      function getGameSlug(obj) {
        const base = obj.componentFileName
          ? obj.componentFileName.replace(/\.[^.]+$/, "")
          : obj.id;
        return base.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
      }

      function isWorksheetHotspotObject(obj) {
        if (!obj) {
          return false;
        }
        const id = String(obj.id || "").toLowerCase();
        const label = String(obj.label || "").toLowerCase();
        const fileName = String(obj.componentFileName || "").toLowerCase();
        const slug = getGameSlug(obj).toLowerCase();
        if (id === "component-worksheets" || slug === "worksheets") {
          return true;
        }
        return id.indexOf("worksheet") !== -1
          || label.indexOf("worksheet") !== -1
          || fileName.indexOf("worksheet") !== -1
          || slug.indexOf("worksheet") !== -1;
      }

      function resolveHtmlViewerPath() {
        const marker = "/3dClass/";
        const pathname = String(window.location.pathname || "");
        const markerIndex = pathname.toLowerCase().indexOf(marker.toLowerCase());
        const basePrefix = markerIndex >= 0 ? pathname.slice(0, markerIndex) : "";
        return (basePrefix || "") + "/html-viewer";
      }

      function isWorksheetDebugEnabled() {
        try {
          const params = new URLSearchParams(window.location.search || "");
          const value = String(params.get(DEBUG_WORKSHEETS_QUERY_KEY) || "").trim().toLowerCase();
          return value === "1" || value === "true" || value === "yes" || value === "on";
        } catch (_) {
          return false;
        }
      }

      function logWorksheetDebug(event, payload) {
        if (!isWorksheetDebugEnabled() || !window.console || typeof window.console.info !== "function") {
          return;
        }
        window.console.info("[WorksheetsDebug]", event, payload || {});
      }

      function buildWorksheetViewerQuery() {
        const params = new URLSearchParams();
        params.set("source", "classroom");
        if (isWorksheetDebugEnabled()) {
          params.set(DEBUG_WORKSHEETS_QUERY_KEY, "1");
        }
        const query = params.toString();
        return query ? "?" + query : "";
      }

      function clearWorksheetNavigationFallback() {
        if (worksheetNavigationFallbackTimerId !== null) {
          window.clearTimeout(worksheetNavigationFallbackTimerId);
          worksheetNavigationFallbackTimerId = null;
        }
      }

      function navigateToWorksheetViewerFallback(resolvedPath) {
        if (window.top && window.top !== window) {
          try {
            window.top.location.assign(resolvedPath);
            return;
          } catch (_) {}
        }
        window.location.assign(resolvedPath);
      }

      function openWorksheetViewerFromHotspot() {
        const worksheetViewerQuery = buildWorksheetViewerQuery();
        const targetPath = "/html-viewer" + worksheetViewerQuery;
        const resolvedPath = resolveHtmlViewerPath() + worksheetViewerQuery;
        const isEmbedded = !!window.parent && window.parent !== window;

        logWorksheetDebug("classroom-hotspot-open", {
          targetPath: targetPath,
          resolvedPath: resolvedPath,
          isEmbedded: isEmbedded
        });
        clearWorksheetNavigationFallback();

        if (!isEmbedded) {
          navigateToWorksheetViewerFallback(resolvedPath);
          return;
        }

        postMessageToParent(CLASSROOM_MESSAGE_NAVIGATE, {
          path: targetPath,
          source: "component-worksheets"
        });

        clearWorksheetNavigationFallback();
        worksheetNavigationFallbackTimerId = window.setTimeout(function () {
          logWorksheetDebug("classroom-handoff-fallback", {
            resolvedPath: resolvedPath
          });
          navigateToWorksheetViewerFallback(resolvedPath);
        }, CLASSROOM_NAVIGATE_FALLBACK_MS);
      }

      function openGameFrame(url) {
        gameFrameIframe.src = url;
        gameFrameModal.hidden = false;
        postMessageToParent(CLASSROOM_MESSAGE_IMMERSIVE_OPEN, {
          source: "game-frame",
          url: url
        });
      }

      function closeGameFrame() {
        gameFrameModal.hidden = true;
        gameFrameIframe.src = "";
        postMessageToParent(CLASSROOM_MESSAGE_IMMERSIVE_CLOSE, {
          source: "game-frame"
        });
      }

      async function persistCurrentSnapshotToIndex(reason) {
        const snapshot = buildPersistedClassroomState();
        const persisted = await persistSnapshotIntoIndexHtml(snapshot, reason);
        if (managerMode) {
          managerStatus.textContent = persisted
            ? "Saved and embedded into index.html."
            : "Saved locally, but index.html write endpoint is unavailable.";
        }
        return persisted;
      }

      async function saveAndLockLayout() {
        saveToStorage(STORAGE_LAYOUT_KEY, layoutState);
        saveComponentFiles();
        layoutLocked = true;
        saveToStorage(STORAGE_LOCK_KEY, layoutLocked);
        await persistCurrentSnapshotToIndex("save-lock");
        setManagerMode(false);
      }

      async function resetLayoutToDefault() {
        layoutState = createDefaultLayoutState();
        applyLayoutToAllHotspots();
        saveToStorage(STORAGE_LAYOUT_KEY, layoutState);
        saveComponentFiles();
        layoutLocked = true;
        saveToStorage(STORAGE_LOCK_KEY, layoutLocked);
        await persistCurrentSnapshotToIndex("reset-default");
        setManagerMode(false);
      }

      // Games can close themselves by posting: window.parent.postMessage({ type: "LAHS_GAME_CLOSE" }, "*")
      window.addEventListener("message", function (messageEvent) {
        if (messageEvent.data && messageEvent.data.type === "LAHS_GAME_CLOSE") {
          closeGameFrame();
        }
      });
      closeModalBtn.addEventListener("click", closeMinigame);
      startBtn.addEventListener("click", startGame);
      restartBtn.addEventListener("click", startGame);
      saveLayoutBtn.addEventListener("click", saveAndLockLayout);
      resetLayoutBtn.addEventListener("click", resetLayoutToDefault);
      scene.addEventListener("pointerdown", beginScenePan);
      scene.addEventListener("pointermove", moveScenePan);
      scene.addEventListener("pointerup", endScenePan);
      scene.addEventListener("pointercancel", endScenePan);
      scene.addEventListener("lostpointercapture", endScenePan);
      if (!SUPPORTS_POINTER_EVENTS) {
        scene.addEventListener("touchstart", beginScenePanTouch, { passive: true });
        scene.addEventListener("touchmove", moveScenePanTouch, { passive: false });
        scene.addEventListener("touchend", endScenePanTouch, { passive: true });
        scene.addEventListener("touchcancel", endScenePanTouch, { passive: true });
        window.addEventListener("touchmove", moveScenePanTouch, { passive: false });
        window.addEventListener("touchend", endScenePanTouch, { passive: true });
        window.addEventListener("touchcancel", endScenePanTouch, { passive: true });
      }
      managerTarget.addEventListener("change", function () {
        if (!managerMode) {
          return;
        }
        setSelectedObject(managerTarget.value);
      });
      managerSizeRange.addEventListener("input", function () {
        if (!managerMode || !selectedObjectId) {
          return;
        }
        updateComponentWidth(selectedObjectId, Number(managerSizeRange.value));
      });
      closeManagerPanelBtn.addEventListener("click", function () {
        setManagerMode(false);
      });
      managerPanelHeader.addEventListener("pointerdown", beginPanelDrag);
      managerPanelHeader.addEventListener("pointermove", movePanelDrag);
      managerPanelHeader.addEventListener("pointerup", endPanelDrag);
      managerPanelHeader.addEventListener("pointercancel", endPanelDrag);
      managerPanelHeader.addEventListener("lostpointercapture", endPanelDrag);
      window.addEventListener("pointerup", endScenePan);
      window.addEventListener("pointercancel", endScenePan);

      answerForm.addEventListener("submit", function (event) {
        event.preventDefault();
        if (!gameRunning || !currentQuestion) {
          return;
        }

        const userAnswer = Number(answerInput.value);
        if (Number.isFinite(userAnswer) && userAnswer === currentQuestion.answer) {
          score += 1;
          scoreEl.textContent = "Score: " + score;
          resultTextEl.textContent = "Correct.";
        } else {
          resultTextEl.textContent = "Not quite. Correct was " + currentQuestion.answer + ".";
        }

        answerInput.value = "";
        nextQuestion();
        answerInput.focus();
      });

      minigameModal.addEventListener("click", function (event) {
        if (event.target === minigameModal) {
          closeMinigame();
        }
      });

      function handleManagerHotkey(event) {
        if (!MANAGER_UI_ENABLED) {
          return;
        }
        if (isEditableTarget(event.target)) {
          return;
        }
        const key = event.key ? event.key.toLowerCase() : "";
        const primary = event.ctrlKey && event.shiftKey && (event.code === "KeyD" || key === "d");
        const fallback = (event.altKey && event.shiftKey && key === "d") || event.code === "F2";
        if (primary || fallback) {
          setManagerMode(!managerMode);
          event.preventDefault();
        }
      }

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && !gameFrameModal.hidden) {
          closeGameFrame();
          return;
        }
        if (event.key === "Escape" && !minigameModal.hidden) {
          closeMinigame();
          return;
        }
        if (event.key === "Escape" && managerMode) {
          setManagerMode(false);
          return;
        }
        handleManagerHotkey(event);
      });

      managerToggleBtn.addEventListener("click", function () {
        setManagerMode(!managerMode);
      });

      mainBackground.addEventListener("load", function () {
        refreshBackgroundRect();
        applyLayoutToAllHotspots();
      });

      window.addEventListener("resize", function () {
        scheduleViewportRefresh(false);
      });
      window.addEventListener("orientationchange", function () {
        scheduleViewportRefresh(true);
      });

      async function initializeApp() {
        requestParentSync();
        const initialSyncPromise = waitForInitialSync();
        await initializeInteractiveObjects();
        if (!hydrateLayoutFromEmbeddedState()) {
          hydrateLayoutFromStorage();
        }
        buildManagerTargets();
        syncBackgroundForViewport(true);
        renderHotspots();
        refreshBackgroundRect();
        applyLayoutToAllHotspots();
        updateManagerUi();
        hasUiInitialized = true;
        await initialSyncPromise;
        if (pendingRemoteState) {
          const snapshot = pendingRemoteState;
          pendingRemoteState = null;
          await applyRemoteSnapshot(snapshot, "initial");
        }
        queueRemoteStateSave("bootstrap");
        if (AUTO_MANAGER_MODE && MANAGER_UI_ENABLED) {
          setManagerMode(true);
        }
      }

      // ── Hotspot awareness glow ────────────────────────────────
      // Uses CSS drop-shadow animation on the <img> inside each
      // hotspot so the glow follows the exact alpha-channel shape
      // of the PNG — no bounding-box bleed onto nearby items.
      //
      // Triggers:
      //   • Whenever the user touches / drags the background
      //   • Every 15 s of idle (no scene interaction)

      const GLOW_IDLE_INTERVAL_MS = 15000;   // idle pulse period
      const GLOW_ANIM_DURATION_MS = 1800;    // must match CSS animation duration
      let glowIdleTimerId = null;
      let glowAnimFrameId = null;
      let glowTriggeredByMove = false;       // debounce: only fire once per drag

      function triggerHotspotGlow() {
        // Skip while manager is open — glowing during drag editing is distracting
        if (managerMode) {
          return;
        }
        // Collect all live hotspot elements
        const hotspots = hotspotLayer.querySelectorAll(".hotspot");
        if (!hotspots.length) {
          return;
        }
        // Cancel any pending re-add from a previous trigger
        if (glowAnimFrameId !== null) {
          cancelAnimationFrame(glowAnimFrameId);
          glowAnimFrameId = null;
        }
        // Remove the class first (force a clean restart if already animating)
        hotspots.forEach(function (el) {
          el.classList.remove("glow-active");
        });
        // Re-add on the next frame so the browser registers the class removal
        glowAnimFrameId = requestAnimationFrame(function () {
          glowAnimFrameId = null;
          const fresh = hotspotLayer.querySelectorAll(".hotspot");
          fresh.forEach(function (el) {
            el.classList.add("glow-active");
          });
          // Clean up the class after the animation completes so hover/focus
          // filters can operate normally again
          setTimeout(function () {
            const done = hotspotLayer.querySelectorAll(".hotspot.glow-active");
            done.forEach(function (el) {
              el.classList.remove("glow-active");
            });
          }, GLOW_ANIM_DURATION_MS + 50);
        });
      }

      function resetGlowIdleTimer() {
        if (glowIdleTimerId !== null) {
          clearTimeout(glowIdleTimerId);
        }
        glowIdleTimerId = setTimeout(function fireIdleGlow() {
          triggerHotspotGlow();
          // Re-arm for the next idle window
          glowIdleTimerId = setTimeout(fireIdleGlow, GLOW_IDLE_INTERVAL_MS);
        }, GLOW_IDLE_INTERVAL_MS);
      }

      // Hook into pan start: on every pointerdown on the scene reset the idle
      // timer and arm the "first-move" flag so we fire glow exactly once per drag.
      scene.addEventListener("pointerdown", function () {
        glowTriggeredByMove = false;
        resetGlowIdleTimer();
      }, { capture: true, passive: true });

      // Hook into pan move: fire glow the first time the finger actually moves.
      scene.addEventListener("pointermove", function (event) {
        if (glowTriggeredByMove) {
          return;
        }
        // Only respond when a drag is genuinely in progress
        if (!scenePanDrag || event.pointerId !== scenePanDrag.pointerId) {
          return;
        }
        glowTriggeredByMove = true;
        triggerHotspotGlow();
      }, { capture: true, passive: true });

      // Touch fallback (non-Pointer Events browsers)
      if (!SUPPORTS_POINTER_EVENTS) {
        scene.addEventListener("touchstart", function () {
          glowTriggeredByMove = false;
          resetGlowIdleTimer();
        }, { capture: true, passive: true });

        scene.addEventListener("touchmove", function () {
          if (glowTriggeredByMove) {
            return;
          }
          glowTriggeredByMove = true;
          triggerHotspotGlow();
        }, { capture: true, passive: true });
      }

      // Kick off the first idle timer once the page is ready
      resetGlowIdleTimer();
      // ── End hotspot awareness glow ────────────────────────────

      async function runBootstrapSequence() {
        try {
          await initializeApp();
        } catch (error) {
          console.error("Classroom initialization failed.", error);
        }
      }

      runBootstrapSequence();
    })();
  </script>
</body>
</html>
