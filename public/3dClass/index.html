<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Classroom Minigame Hub</title>
  <link rel="icon" type="image/png" href="./Laptop.png" />
  <style>
    :root {
      --bg-deep: #0f1720;
      --bg-mid: #1d2f3f;
      --panel: #122131;
      --panel-edge: #2f4d66;
      --text: #eef5ff;
      --muted: #b7c7d8;
      --accent: #ffb703;
      --accent-strong: #fb8500;
      --ok: #8ecae6;
      --focus: #e1f3ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100svh;
      display: block;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--text);
      background: #0b141e;
      padding: 0;
      overflow: hidden;
    }

    .app {
      width: 100%;
      min-height: 100%;
      height: 100%;
      display: block;
      gap: 14px;
      padding: 0;
      box-sizing: border-box;
    }

    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 14px;
      background: linear-gradient(180deg, #1a3144, #11212f);
      border: 1px solid #365269;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.35);
    }

    .hud h1 {
      margin: 0;
      font-size: clamp(1.1rem, 2vw, 1.5rem);
      letter-spacing: 0.03em;
    }

    .hud p {
      margin: 0;
      color: var(--muted);
      text-align: right;
      font-size: clamp(0.75rem, 1.5vw, 0.95rem);
    }

    .tool-btn {
      font: inherit;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      cursor: pointer;
      color: var(--text);
      background: rgba(255, 255, 255, 0.1);
      padding: 8px 10px;
      font-size: 0.9rem;
      font-weight: 700;
      transition: transform 160ms ease, background-color 160ms ease;
    }

    .tool-btn:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.18);
    }

    .tool-btn:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .tool-btn.warn {
      border-color: rgba(255, 185, 120, 0.45);
      color: #ffe9d4;
      background: rgba(251, 133, 0, 0.22);
    }

    .scene-wrap {
      border-radius: 0;
      overflow: hidden;
      border: 0;
      box-shadow: none;
      background: #0b141e;
      width: 100%;
      min-height: 0;
      height: 100%;
      align-self: stretch;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      isolation: isolate;
    }

    .scene.pan-enabled {
      cursor: grab;
      touch-action: none;
    }

    .scene.pan-enabled.panning {
      cursor: grabbing;
    }

    .scene img.scene-bg {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      will-change: transform;
      transform: translate3d(0, 0, 0);
    }

    @media (orientation: portrait) {
      .scene img.scene-bg {
        object-position: 52% 50%;
      }
    }

    .hotspot-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      will-change: transform;
    }

    .hotspot {
      position: absolute;
      border: 0;
      background: transparent;
      padding: 0;
      border-radius: 16px;
      cursor: pointer;
      pointer-events: auto;
      transition: transform 180ms ease, filter 180ms ease;
      transform-origin: center bottom;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .scene.pan-enabled .hotspot {
      touch-action: none;
    }

    .hotspot:hover {
      transform: translateY(-2px) scale(1.02);
      filter: saturate(1.06);
    }

    .hotspot:focus {
      outline: none;
    }

    .hotspot:focus-visible {
      outline: none;
      box-shadow:
        0 0 0 2px rgba(225, 243, 255, 0.72),
        0 0 14px rgba(255, 222, 145, 0.5);
    }

    .hotspot img {
      position: relative;
      z-index: 2;
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      pointer-events: none;
      -webkit-user-drag: none;
      filter:
        drop-shadow(0 4px 5px rgba(0, 0, 0, 0.35))
        drop-shadow(0 0 8px rgba(255, 222, 145, 0.34));
      transition: filter 180ms ease;
    }

    .hotspot::before {
      content: "";
      position: absolute;
      z-index: 1;
      inset: auto 12% 4% 14%;
      height: 12%;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.34);
      filter: blur(8px);
      transform: scaleX(1.03);
      pointer-events: none;
    }

    .hotspot::after {
      content: "";
      position: absolute;
      inset: 14% 9% 16% 9%;
      z-index: 0;
      border-radius: 999px;
      background: radial-gradient(
        circle at 50% 48%,
        rgba(255, 222, 145, 0.32) 0%,
        rgba(255, 222, 145, 0.14) 48%,
        rgba(255, 222, 145, 0) 78%
      );
      filter: blur(7px);
      opacity: 0.64;
      transform: scale(1);
      transition: opacity 180ms ease, transform 180ms ease;
      pointer-events: none;
    }

    .hotspot:hover::after,
    .hotspot:focus-visible::after {
      opacity: 0.84;
      transform: scale(1.05);
    }

    .hotspot:hover img,
    .hotspot:focus-visible img {
      filter:
        drop-shadow(0 5px 6px rgba(0, 0, 0, 0.38))
        drop-shadow(0 0 12px rgba(255, 222, 145, 0.56));
    }

    .hotspot-laptop {
      left: 15.9%;
      top: 59.5%;
      width: 20.1%;
    }

    .scene.manager-active .hotspot {
      cursor: grab;
      touch-action: none;
      transition: none;
    }

    .scene.manager-active .hotspot:hover {
      transform: none;
      filter: none;
    }

    .scene.manager-active .hotspot::after {
      opacity: 0.65;
    }

    .manager-panel {
      position: fixed;
      left: 18px;
      top: 18px;
      z-index: 120;
      width: 230px;
      border-radius: 12px;
      background: rgba(8, 31, 48, 0.96);
      border: 1px solid rgba(157, 206, 240, 0.4);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.36);
      backdrop-filter: blur(3px);
      user-select: none;
      will-change: left, top;
    }

    .manager-toggle-launch {
      position: fixed;
      right: 16px;
      top: 16px;
      z-index: 130;
      border: 1px solid rgba(157, 206, 240, 0.45);
      border-radius: 10px;
      background: rgba(8, 31, 48, 0.92);
      color: #e7f3ff;
      padding: 8px 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .manager-toggle-launch:hover {
      background: rgba(13, 44, 67, 0.96);
    }

    .manager-toggle-launch:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .manager-panel[hidden] {
      display: none;
    }

    .manager-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      cursor: grab;
      touch-action: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent);
    }

    .manager-panel-title {
      margin: 0;
      font-size: 0.92rem;
      color: #d7f0ff;
    }

    .manager-panel-body {
      padding: 10px;
      display: grid;
      gap: 8px;
    }

    .manager-status {
      margin: 0;
      color: #cde2f5;
      font-size: 0.8rem;
      min-height: 1.2em;
    }

    .manager-fieldset {
      display: grid;
      gap: 6px;
    }

    .manager-label {
      display: block;
      font-size: 0.77rem;
      color: #d4ecff;
    }

    .manager-panel select,
    .manager-panel input[type="range"] {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      font: inherit;
    }

    .manager-panel select {
      padding: 5px 7px;
      color: #111111;
      background: rgba(255, 255, 255, 0.92);
    }

    .manager-panel select option {
      color: #111111;
      background: #ffffff;
    }

    .manager-size-readout {
      margin: 0;
      color: #e6f2ff;
      font-size: 0.75rem;
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }

    .tiny-btn {
      font: inherit;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      cursor: pointer;
      color: var(--text);
      background: rgba(255, 255, 255, 0.1);
      padding: 5px 8px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .tiny-btn:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.16);
    }

    .tiny-btn:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .tiny-btn.warn {
      border-color: rgba(255, 185, 120, 0.45);
      color: #ffe9d4;
      background: rgba(251, 133, 0, 0.22);
    }

    .tiny-btn.close-btn {
      border-color: rgba(255, 176, 166, 0.4);
      background: rgba(255, 176, 166, 0.12);
      color: #ffe9db;
      padding: 4px 8px;
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .scene.manager-active .hotspot.dragging {
      cursor: grabbing;
      z-index: 10;
      transform: translateY(-2px) scale(1.03);
    }

    .scene.manager-active .hotspot.selected {
      outline: none;
      box-shadow:
        0 0 0 2px rgba(255, 214, 102, 0.62),
        0 0 18px rgba(255, 214, 102, 0.52);
    }

    .modal[hidden] {
      display: none;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(6, 12, 17, 0.72);
      backdrop-filter: blur(3px);
    }

    .panel {
      width: min(94vw, 560px);
      border-radius: 18px;
      background: linear-gradient(180deg, #112a3c, #0c1d2a);
      border: 1px solid var(--panel-edge);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45);
      padding: 18px;
      display: grid;
      gap: 12px;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .panel h2 {
      margin: 0;
      font-size: clamp(1.1rem, 3vw, 1.35rem);
    }

    .panel p {
      margin: 0;
      color: var(--muted);
    }

    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.09);
      padding: 8px 10px;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--ok);
    }

    .question {
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.11);
      min-height: 68px;
      display: grid;
      place-items: center;
      padding: 10px;
      text-align: center;
      font-size: clamp(1rem, 3.2vw, 1.4rem);
      letter-spacing: 0.03em;
    }

    .answer-form {
      display: flex;
      gap: 8px;
    }

    .answer-form input {
      flex: 1;
      min-width: 0;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      font-size: 1rem;
      padding: 10px;
      outline: none;
    }

    .answer-form input:focus {
      border-color: #a6d6ff;
      box-shadow: 0 0 0 2px rgba(109, 184, 255, 0.25);
    }

    button {
      font: inherit;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      color: #061322;
      background: linear-gradient(180deg, #ffd166, #ffb703);
      padding: 10px 12px;
      font-weight: 700;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .panel .ghost {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .panel .close {
      padding: 8px 10px;
      background: linear-gradient(180deg, #ffb4a2, #fb8500);
    }

    .action-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .result {
      margin: 0;
      min-height: 1.2em;
      color: #ffe7a5;
      font-weight: 700;
    }

    @media (max-width: 760px) {
      body {
        padding: 0;
      }

      .hud {
        display: grid;
        gap: 10px;
      }

      .hud p {
        width: 100%;
        text-align: left;
      }
    }

    /* ── Fullscreen Game Frame ──────────────────────────────── */
    .game-frame-modal[hidden] {
      display: none;
    }

    .game-frame-modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: #070e15;
      display: flex;
      align-items: stretch;
    }

    .game-frame-iframe {
      flex: 1;
      width: 100%;
      border: none;
      display: block;
    }

    body.intro-active {
      overscroll-behavior: none;
    }

    .door-intro[hidden] {
      display: none;
    }

    .door-intro {
      position: fixed;
      inset: 0;
      z-index: 380;
      overflow: hidden;
      pointer-events: auto;
      opacity: 1;
      --intro-safe-top: max(12px, env(safe-area-inset-top));
      --intro-safe-bottom: max(12px, env(safe-area-inset-bottom));
      --door-usable-height: calc(100svh - var(--intro-safe-top) - var(--intro-safe-bottom));
      --door-height: clamp(340px, calc(var(--door-usable-height) * 0.94), 2200px);
      --door-width: clamp(220px, calc(var(--door-height) * 0.48), min(92svw, 860px));
      --eye-level-offset: calc((var(--intro-safe-top) - var(--intro-safe-bottom)) * 0.16);
      background:
        radial-gradient(circle at 50% 9%, rgba(255, 252, 242, 0.58), rgba(255, 252, 242, 0) 42%),
        linear-gradient(180deg, #f3eee7 0%, #f0e8de 48%, #eee4d7 100%);
      transition: opacity 320ms ease-out;
      perspective: 2200px;
      transform-style: preserve-3d;
    }

    .door-intro.is-leaving {
      opacity: 0;
      pointer-events: none;
    }

    .door-intro::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 11%, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0) 66%),
        repeating-linear-gradient(
          95deg,
          rgba(122, 86, 58, 0.03) 0 3.8%,
          rgba(122, 86, 58, 0) 3.8% 9%
        );
      opacity: 0.74;
    }

    .door-intro::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 100%, rgba(0, 0, 0, 0) 28%, rgba(0, 0, 0, 0.26) 92%),
        linear-gradient(180deg, rgba(20, 17, 14, 0), rgba(20, 17, 14, 0.24));
    }

    .door-intro-camera {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    .door-intro-ceiling {
      position: absolute;
      left: -2%;
      right: -2%;
      top: -5%;
      height: 31%;
      border-radius: 0;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.74) 0% 16%,
          rgba(228, 221, 212, 0.74) 16% 32%
        ),
        linear-gradient(180deg, rgba(250, 247, 242, 0.95), rgba(223, 213, 200, 0.75));
      box-shadow: inset 0 -6px 16px rgba(0, 0, 0, 0.14);
      opacity: 0.94;
      transform: perspective(980px) rotateX(74deg);
      transform-origin: top center;
    }

    .door-intro-wall {
      position: absolute;
      top: -2%;
      bottom: -2%;
      width: clamp(18%, 24vw, 30%);
      border-radius: 0;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.2);
      background:
        linear-gradient(180deg, #f3ece3 0% 58%, #a5b9c9 58% 94%, #24303d 94% 100%);
    }

    .door-intro-wall::before {
      content: "";
      position: absolute;
      left: 12%;
      right: 12%;
      top: 18%;
      height: 24%;
      border: 4px solid #96592f;
      border-radius: 2px;
      background: #bf8754;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.28);
    }

    .door-intro-wall::after {
      content: "";
      position: absolute;
      left: 18%;
      width: 64%;
      top: 23%;
      height: 16%;
      background:
        linear-gradient(165deg, #27a9ff, #27a9ff) 0 20% / 24% 43% no-repeat,
        linear-gradient(165deg, #f7e248, #f7e248) 34% 52% / 26% 42% no-repeat,
        linear-gradient(165deg, #fd6c63, #fd6c63) 72% 58% / 24% 39% no-repeat,
        radial-gradient(circle at 8% 0%, #24d54c 0 11%, transparent 12%);
    }

    .door-intro-wall.left {
      left: -4%;
      transform: perspective(1300px) rotateY(25deg);
      transform-origin: left center;
    }

    .door-intro-wall.right {
      right: -4%;
      transform: perspective(1300px) rotateY(-25deg);
      transform-origin: right center;
    }

    .door-intro-floor {
      position: absolute;
      left: -12%;
      right: -12%;
      bottom: -24%;
      height: 56%;
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(244, 193, 142, 0.95), rgba(187, 130, 83, 0.98)),
        repeating-linear-gradient(
          90deg,
          rgba(255, 224, 177, 0.4) 0% 2.4%,
          rgba(128, 85, 51, 0.2) 2.4% 12%
        ),
        repeating-linear-gradient(
          0deg,
          rgba(255, 225, 179, 0.12) 0% 8%,
          rgba(98, 69, 40, 0.12) 8% 12%
        );
      transform: perspective(1240px) rotateX(78deg);
      transform-origin: bottom center;
      box-shadow: 0 -14px 34px rgba(0, 0, 0, 0.3);
    }

    .door-intro-doorway {
      position: absolute;
      left: 50%;
      top: calc(50% + var(--eye-level-offset));
      width: var(--door-width);
      height: var(--door-height);
      max-height: calc(100svh - var(--intro-safe-top) - var(--intro-safe-bottom));
      transform: translate(-50%, -50%);
      perspective: 2200px;
      transform-style: preserve-3d;
      filter: drop-shadow(0 22px 32px rgba(0, 0, 0, 0.45));
    }

    .door-intro-doorway::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 2px;
      border: clamp(16px, 1.6vw, 24px) solid #7b2f19;
      box-shadow:
        inset 0 0 0 1px rgba(171, 83, 45, 0.76),
        inset 0 -6px 14px rgba(61, 17, 6, 0.5);
      pointer-events: none;
    }

    .door-intro-room-sign {
      position: absolute;
      left: 50%;
      top: clamp(14px, 1.6vw, 26px);
      transform: translateX(-50%);
      width: min(72%, 420px);
      padding: clamp(6px, 0.8vw, 12px) clamp(16px, 1.6vw, 28px);
      border-radius: 4px;
      border: 1px solid #7d7f82;
      background: linear-gradient(180deg, #f3f3f4, #d8d8da);
      color: #2f2f31;
      font-size: clamp(0.9rem, 1.55vw, 2rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.55),
        0 1px 3px rgba(0, 0, 0, 0.26);
    }

    .door-intro-room-sign::before,
    .door-intro-room-sign::after {
      content: "";
      position: absolute;
      top: 50%;
      width: clamp(5px, 0.45vw, 8px);
      height: clamp(5px, 0.45vw, 8px);
      border-radius: 50%;
      background: #7a7d82;
      transform: translateY(-50%);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
    }

    .door-intro-room-sign::before {
      left: clamp(7px, 0.8vw, 12px);
    }

    .door-intro-room-sign::after {
      right: clamp(7px, 0.8vw, 12px);
    }

    .door-intro-door-glow {
      position: absolute;
      inset: clamp(18px, 1.6vw, 26px);
      border-radius: 2px;
      background:
        radial-gradient(circle at 53% 42%, rgba(247, 253, 255, 0.92), rgba(246, 224, 170, 0.7) 44%, rgba(237, 196, 128, 0.08) 76%),
        linear-gradient(180deg, rgba(252, 250, 242, 0.5), rgba(241, 219, 181, 0.3));
      opacity: 0.06;
      transform: translateZ(-18px);
    }

    .door-intro-frame {
      position: absolute;
      inset: clamp(12px, 1.1vw, 18px);
      border-radius: 1px;
      border: clamp(7px, 0.8vw, 12px) solid #66250f;
      box-shadow:
        inset 0 0 0 1px rgba(153, 64, 32, 0.7),
        0 8px 14px rgba(0, 0, 0, 0.28);
      background:
        linear-gradient(180deg, rgba(132, 58, 30, 0.84), rgba(95, 38, 17, 0.72)),
        repeating-linear-gradient(
          90deg,
          rgba(177, 94, 56, 0.2) 0% 8%,

    }

    .door-intro.is-playing .door-intro-wall.left {

    }

    .door-intro.is-playing .door-intro-wall.right {

    }

    .door-intro.is-playing .door-intro-floor {

    .door-intro.is-playing .door-intro-door-glow {

    .door-intro.is-playing .door-intro-handle {
      animation: intro-handle-turn 560ms ease-in-out 160ms;
    }

    .door-intro.is-playing .door-intro-fade {
      animation: intro-blackout 2420ms linear forwards;
    }

    .door-intro.is-reduced .door-intro-door {

    .door-intro.is-reduced .door-intro-door-glow {

    .door-intro.is-reduced .door-intro-fade {
      opacity: 0.88;
    }

    .door-intro-fade {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: #000;
      opacity: 0;
    }

    @keyframes intro-camera-dolly {
      0% {
        transform: scale(1) translate3d(0, 0, 0);
      }
      45% {
        transform: scale(1.055) translate3d(0.06svw, 0.08svh, 0);
      }
      74% {
        transform: scale(1.13) translate3d(0.02svw, 0.16svh, 0);
      }
      100% {
        transform: scale(1.23) translate3d(0, 0.24svh, 0);
      }
    }

    @keyframes intro-ceiling-pass {
      0% {
        opacity: 0.88;
        transform: perspective(980px) rotateX(74deg);
      }
      100% {
        opacity: 0.16;
        transform: perspective(980px) rotateX(74deg) translateY(-22%);
      }
    }

    @keyframes intro-wall-left-pass {
      0% {
        transform: perspective(1300px) rotateY(25deg);
      }
      100% {
        transform: perspective(1300px) rotateY(28deg) translateX(-12%);
      }
    }

    @keyframes intro-wall-right-pass {
      0% {
        transform: perspective(1300px) rotateY(-25deg);
      }
      100% {
        transform: perspective(1300px) rotateY(-28deg) translateX(12%);
      }
    }

    @keyframes intro-floor-pass {
      0% {
        transform: perspective(1240px) rotateX(78deg) translateY(0);
      }
      100% {
        transform: perspective(1240px) rotateX(78deg) translateY(12%);
      }
    }

    @keyframes intro-door-open {
      0% {
        transform: rotateY(0deg);
      }
      30% {
        transform: rotateY(-22deg);
      }
      64% {
        transform: rotateY(-86deg);
      }
      100% {
        transform: rotateY(-112deg);
      }
    }

    @keyframes intro-room-glow {
      0% {
        opacity: 0.06;
      }
      56% {
        opacity: 0.46;
      }
      100% {
        opacity: 0.98;
      }
    }

    @keyframes intro-handle-turn {
      0% {
        transform: rotate(0deg);
      }
      40% {
        transform: rotate(-18deg);
      }
      72% {
        transform: rotate(-12deg);
      }
      100% {
        transform: rotate(0deg);
      }
    }

    @keyframes intro-blackout {
      0% {
        opacity: 0;
      }
      58% {
        opacity: 0;
      }
      72% {
        opacity: 0.14;
      }
      84% {
        opacity: 0.46;
      }
      93% {
        opacity: 0.78;
      }
      100% {
        opacity: 1;
      }
    }

    @media (max-width: 760px) {
      .door-intro {
        --door-height: clamp(340px, calc(var(--door-usable-height) * 0.91), 2200px);
      }

      .door-intro-wall {
        width: clamp(16%, 22vw, 27%);

      .door-intro-room-sign {

      .door-intro-door-window {
        left: 16%;
        right: 16%;
        top: 29%;
        height: 20%;
      }
    }

    /* Three.js intro override */
    .door-intro {
      background: #070707;
      perspective: none;
      transform-style: flat;
      transition: opacity 280ms ease-out;
    }

    .door-intro::before,
    .door-intro::after {
      display: none;
    }

    .door-intro-stage {
      position: absolute;
      inset: 0;
      background: #070707;
    }

    .door-intro-stage canvas {
      display: block;
      width: 100%;
      height: 100%;

    .door-intro-fade {
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      will-change: opacity;
    }

    /* ── Shape-precise hotspot glow pulse ──────────────────────
       drop-shadow() respects PNG alpha — glow follows the exact
       outline of each image, not its bounding box.
    ─────────────────────────────────────────────────────────── */
    @keyframes hotspot-glow-pulse {
      0%   {
        transform: scale(1);
        filter:
          drop-shadow(0 4px 5px rgba(0, 0, 0, 0.35))
          drop-shadow(0 0 0px rgba(90, 200, 255, 0));
      }
      18%  {
        transform: scale(1.055);
        filter:
          drop-shadow(0 4px 5px rgba(0, 0, 0, 0.35))
          drop-shadow(0 0 7px  rgba(90, 200, 255, 0.9))
          drop-shadow(0 0 16px rgba(90, 200, 255, 0.5))
          drop-shadow(0 0 3px  rgba(255, 255, 255, 0.4));
      }
      50%  {
        transform: scale(1.01);
        filter:
          drop-shadow(0 4px 5px rgba(0, 0, 0, 0.35))
          drop-shadow(0 0 4px rgba(90, 200, 255, 0.35));
      }
      72%  {
        transform: scale(1.045);
        filter:
          drop-shadow(0 4px 5px rgba(0, 0, 0, 0.35))
          drop-shadow(0 0 8px  rgba(90, 200, 255, 0.82))
          drop-shadow(0 0 18px rgba(90, 200, 255, 0.44))
          drop-shadow(0 0 3px  rgba(255, 255, 255, 0.32));
      }
      100% {
        transform: scale(1);
        filter:
          drop-shadow(0 4px 5px rgba(0, 0, 0, 0.35))
          drop-shadow(0 0 8px rgba(255, 222, 145, 0.34))
          drop-shadow(0 0 0px rgba(90, 200, 255, 0));
      }
    }

    /* Applied programmatically; !important overrides the base
       filter AND transform for the duration of the animation  */
    .hotspot.glow-active img {
      animation: hotspot-glow-pulse 1.8s ease-in-out forwards !important;
      transform-origin: center bottom;
    }

    /* Prevent the animation from fighting hover/focus states  */
    .hotspot.glow-active:hover img,
    .hotspot.glow-active:focus-visible img {
      animation: hotspot-glow-pulse 1.8s ease-in-out forwards !important;
    }
  </style>

      function getAssetVersionToken() {
        const params = new URLSearchParams(window.location.search || "");

      function appendVersionToken(path, token) {
        const normalizedPath = String(path || "");
        if (!normalizedPath || !token) {

        const separator = normalizedPath.indexOf("?") === -1 ? "?" : "&";
        return normalizedPath + separator + "v=" + encodeURIComponent(String(token));

        if (managerUiValue === "0" || managerUiValue === "false" || managerUiValue === "no" || managerUiValue === "off") {

      function easeInCubic(t) {
        const x = clamp01(t);
        return x * x * x;

      function easeOutCubic(t) {
        const x = clamp01(t);
        return 1 - Math.pow(1 - x, 3);

      function easeInOutCubic(t) {
        const x = clamp01(t);
        if (x < 0.5) {

        return 1 - Math.pow(-2 * x + 2, 3) / 2;

      function createDoorIntroController() {
        if (!doorIntro) {
          return {

            },
            complete: function () {

            }
          };
        }

        if (SHOULD_SKIP_INTRO) {

          return {
            refreshPortalSnapshot: function () {

            complete: function () {

            }
          };
        }

        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const introDurationMs = reduceMotion ? INTRO_REDUCED_DURATION_MS : INTRO_ANIMATION_DURATION_MS;
        let finished = false;
        let runtime = null;
        let snapshotRetryTimerId = null;
        let snapshotRetryCount = 0;
        const SNAPSHOT_MAX_RETRIES = 18;
        const SNAPSHOT_RETRY_MS = 120;
        let introMinDurationPromise = waitForMs(introDurationMs);

        function clearSnapshotRetry() {
          if (snapshotRetryTimerId !== null) {
            clearTimeout(snapshotRetryTimerId);
            snapshotRetryTimerId = null;
          }
        }

        function refreshPortalSnapshot() {
          if (!runtime || typeof runtime.applyPortalCanvasSnapshot !== "function") {
            return false;

          const snapshotCanvas = captureSceneSnapshotCanvas(scene, mainBackground, hotspotLayer);
          if (!snapshotCanvas) {
            return false;

          return runtime.applyPortalCanvasSnapshot(snapshotCanvas);

        function queueSnapshotRetryLoop() {
          clearSnapshotRetry();
          snapshotRetryCount = 0;
          const trySnapshot = function () {
            if (finished) {
              return;
            }
            if (refreshPortalSnapshot()) {
              return;
            }
            snapshotRetryCount += 1;
            if (snapshotRetryCount >= SNAPSHOT_MAX_RETRIES) {
              return;
            }
            snapshotRetryTimerId = setTimeout(trySnapshot, SNAPSHOT_RETRY_MS);
          };
          trySnapshot();
        }

        doorIntro.hidden = false;
        doorIntro.classList.remove("is-leaving");
        document.body.classList.add("intro-active");
        if (doorIntroFade) {
          doorIntroFade.style.opacity = "0";

            fadeLayer: doorIntroFade,
            durationMs: introDurationMs,
            reduceMotion: reduceMotion,
            textureCandidates: getVersionedBackgroundCandidates(false)
          });
          if (runtime && runtime.donePromise) {
            introMinDurationPromise = runtime.donePromise;
            queueSnapshotRetryLoop();
          }
        } catch (error) {
          console.warn("Three.js intro runtime failed; using fallback fade.", error);
        }

        return {
          refreshPortalSnapshot: refreshPortalSnapshot,
          complete: async function () {
            if (finished) {
              return;
            }
            finished = true;
            clearSnapshotRetry();
            await introMinDurationPromise;
            if (runtime && typeof runtime.dispose === "function") {

            }
            doorIntro.classList.add("is-leaving");
            await waitForMs(INTRO_FADE_DURATION_MS);
            if (doorIntroFade) {

            }
            doorIntro.hidden = true;
            doorIntro.classList.remove("is-leaving");
            document.body.classList.remove("intro-active");
          }
        };

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function uniqueStrings(values) {
        const seen = new Set();
        const result = [];
        values.forEach(function (value) {
          if (typeof value !== "string") {
            return;
          }
          const trimmed = value.trim();
          if (!trimmed) {
            return;
          }
          const key = trimmed.toLowerCase();
          if (seen.has(key)) {
            return;
          }
          seen.add(key);
          result.push(trimmed);
        });
        return result;
      }

      function extractFileName(value) {
        if (typeof value !== "string") {
          return "";
        }
        const normalized = value
          .split("?")[0]
          .split("#")[0]
          .replace(/\\/g, "/");
        const parts = normalized.split("/");
        return (parts[parts.length - 1] || "").trim();
      }

      function stripImageExtension(fileName) {
        return String(fileName || "").replace(/\.[^.]+$/, "");
      }

      function toTitleWords(fileName) {
        const normalized = stripImageExtension(fileName)
          .replace(/[_-]+/g, " ")
          .replace(/([a-z])([A-Z])/g, "$1 $2")
          .trim();
        if (!normalized) {
          return "Component";
        }
        return normalized
          .split(/\s+/)
          .map(function (word) {
            return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
          })
          .join(" ");
      }

      function createUniqueComponentId(fileName, usedIds) {
        const slug = stripImageExtension(fileName)
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");
        const baseId = "component-" + (slug || "image");
        let id = baseId;
        let index = 2;
        while (usedIds.has(id)) {
          id = baseId + "-" + index;
          index += 1;
        }
        usedIds.add(id);
        return id;
      }

      function isBackgroundFileName(fileName) {
        const normalized = String(fileName || "").toLowerCase();
        if (!normalized) {
          return false;
        }
        const backgrounds = getBackgroundCandidates(true)
          .concat(getBackgroundCandidates(false))
          .map(function (name) {
            return String(name || "").toLowerCase();
          });
        if (backgrounds.indexOf(normalized) !== -1) {
          return true;
        }
        return /^newmainbackground\d*\.png$/i.test(normalized);
      }

      function isComponentImageFile(fileName) {
        if (!/\.png$/i.test(String(fileName || ""))) {
          return false;

        return !isBackgroundFileName(fileName);

      function componentImagePath(fileName, cacheToken) {
        const base = encodeURI(COMPONENT_IMAGE_DIR + "/" + fileName);

      function genericDefaultLayout(index) {
        const template = GENERIC_COMPONENT_LAYOUTS[index % GENERIC_COMPONENT_LAYOUTS.length];
        const row = Math.floor(index / GENERIC_COMPONENT_LAYOUTS.length);
        return {
          left: clamp(template.left + row * 2.5, 8, 88),
          top: clamp(template.top - row * 4, 25, 88),
          width: clamp(template.width, 6, 60)
        };
      }

      function createGenericComponentObject(fileName, index, usedIds, cacheToken) {
        return {
          id: createUniqueComponentId(fileName, usedIds),

      async function loadComponentManifestEntries() {
        try {
          const response = await fetch(COMPONENT_IMAGE_MANIFEST_PATH, { cache: "no-store" });
          if (!response.ok) {
            return [];
          }
          const payload = await response.json();
          return Array.isArray(payload) ? payload : [];
        } catch (error) {
          return [];
        }
      }

      async function loadComponentDirectoryEntries() {
        try {
          const response = await fetch(COMPONENT_IMAGE_DIR + "/", { cache: "no-store" });
          if (!response.ok) {
            return [];
          }
          const html = await response.text();
          if (!html) {
            return [];
          }
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, "text/html");
          const links = Array.prototype.slice.call(doc.querySelectorAll("a[href]"));
          return links
            .map(function (link) {
              return link.getAttribute("href") || "";
            })
            .filter(Boolean);
        } catch (error) {
          return [];
        }
      }

      async function discoverComponentImages() {
        const manifestEntries = await loadComponentManifestEntries();
        const listingEntries = await loadComponentDirectoryEntries();
        const bootstrapManifestEntries = readBootstrapManifestComponentFiles();
        const merged = manifestEntries
          .concat(bootstrapManifestEntries)
          .concat(listingEntries);

        return normalizeComponentFiles(merged);
      }

      function readBootstrapManifestComponentFiles() {
        const componentBootstrapManifest = Array.isArray(window.__COMPONENT_IMAGE_MANIFEST__)
          ? window.__COMPONENT_IMAGE_MANIFEST__
          : [];
        const legacyManifest = Array.isArray(window.__IMAGE_MANIFEST__) ? window.__IMAGE_MANIFEST__ : [];
        return normalizeComponentFiles(componentBootstrapManifest.concat(legacyManifest));
      }

      function normalizeComponentFiles(entries) {
        const seen = new Set();
        const files = [];
        (entries || []).forEach(function (entry) {
          const fileName = extractFileName(entry);
          const normalized = fileName.toLowerCase();
          if (!isComponentImageFile(fileName) || seen.has(normalized)) {
            return;
          }
          seen.add(normalized);
          files.push(fileName);
        });

        return files.sort(function (a, b) {
          return a.localeCompare(b, undefined, { sensitivity: "base" });
        });
      }

      function mergeComponentFileSources() {
        const merged = [];
        for (let index = 0; index < arguments.length; index += 1) {
          const source = arguments[index];
          if (!Array.isArray(source) || !source.length) {
            continue;
          }
          merged.push.apply(merged, source);
        }
        return normalizeComponentFiles(merged);
      }

      function readSavedComponentFiles() {
        const saved = readFromStorage(STORAGE_COMPONENT_FILES_KEY);
        if (!Array.isArray(saved)) {
          return [];

        return normalizeComponentFiles(saved);

      function readEmbeddedComponentFiles() {
        const embedded = readEmbeddedStateSnapshot();
        if (!embedded || !Array.isArray(embedded.componentFiles)) {

        return normalizeComponentFiles(embedded.componentFiles);

      function buildInteractiveObjectsFromFiles(files, cacheToken) {
        const builtIn = createBuiltInInteractiveObjects();
        if (!files.length) {
          return builtIn;
        }

        const byBuiltInFile = {};
        builtIn.forEach(function (obj) {
          const key = extractFileName(obj.imageCandidates[0]).toLowerCase();
          byBuiltInFile[key] = obj;
        });

        const objects = [];
        const usedIds = new Set();
        files.forEach(function (fileName, index) {
          const builtInMatch = byBuiltInFile[fileName.toLowerCase()];
          if (builtInMatch) {
            const mergedBuiltIn = {
              id: builtInMatch.id,
              label: builtInMatch.label,
              className: builtInMatch.className,
              imageCandidates: uniqueStrings(
                [componentImagePath(fileName, cacheToken), componentImagePath(fileName)].concat(builtInMatch.imageCandidates)

              minigame: builtInMatch.minigame,
              componentFileName: fileName,
              defaultLayout: {
                left: builtInMatch.defaultLayout.left,
                top: builtInMatch.defaultLayout.top,
                width: builtInMatch.defaultLayout.width
              }
            };
            if (!usedIds.has(mergedBuiltIn.id)) {
              usedIds.add(mergedBuiltIn.id);
              objects.push(mergedBuiltIn);
            }
            return;
          }
          objects.push(createGenericComponentObject(fileName, index, usedIds, cacheToken));
        });

        return objects.length ? objects : builtIn;
      }

      function componentFileListSignature(files) {
        return files
          .map(function (fileName) {
            return String(fileName || "").toLowerCase();
          })
          .join("|");

      function mergeLayoutStateWithPrevious(previousLayoutState) {
        const merged = {};
        const defaults = createDefaultLayoutState();
        interactiveObjects.forEach(function (obj) {
          const defaultsForObject = defaults[obj.id];
          const previous = previousLayoutState && previousLayoutState[obj.id];
          if (previous && typeof previous === "object") {
            const left = Number(previous.left);
            const top = Number(previous.top);
            const width = Number(previous.width);
            merged[obj.id] = {
              left: Number.isFinite(left) ? clamp(left, 0, 95) : defaultsForObject.left,
              top: Number.isFinite(top) ? clamp(top, 0, 95) : defaultsForObject.top,
              width: Number.isFinite(width) ? clamp(width, 6, 60) : defaultsForObject.width
            };
            return;
          }
          merged[obj.id] = {
            left: defaultsForObject.left,
            top: defaultsForObject.top,
            width: defaultsForObject.width
          };
        });
        return merged;
      }

      function refreshHotspotImageSources() {

      async function refreshInteractiveObjects(forceRebuild) {
        if (componentRefreshInFlight) {
          return false;
        }
        componentRefreshInFlight = true;
        try {
          const discoveredFiles = await discoverComponentImages();
          componentFileCatalog = discoveredFiles.slice();
          const nextSignature = componentFileListSignature(discoveredFiles);
          const shouldRebuild = Boolean(forceRebuild) || nextSignature !== componentCatalogSignature;
          componentImageCacheBust = String(Date.now());

          if (!shouldRebuild) {
            refreshHotspotImageSources();
            return false;
          }

          if (activeDrag) {
            endDrag({ pointerId: activeDrag.pointerId });
          }
          if (panelDrag) {
            endPanelDrag({ pointerId: panelDrag.pointerId });
          }

          const previousLayoutState = layoutState;
          const previousSelectedObjectId = selectedObjectId;

          interactiveObjects = buildInteractiveObjectsFromFiles(discoveredFiles, componentImageCacheBust);
          componentCatalogSignature = nextSignature;
          layoutState = mergeLayoutStateWithPrevious(previousLayoutState);

          buildManagerTargets();
          if (previousSelectedObjectId && layoutState[previousSelectedObjectId]) {
            selectedObjectId = previousSelectedObjectId;
