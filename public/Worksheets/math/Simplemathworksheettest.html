<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Math Worksheet Test</title>
  <style>
    :root {
      color-scheme: light;
      --sheet-width: 8.5in;
      --sheet-height: 11in;
      --ink: #1f2937;
      --muted: #475569;
      --accent: #0f766e;
      --line: #94a3b8;
      --paper: #ffffff;
      --bg: #e2e8f0;
      font-family: "Trebuchet MS", "Avenir Next", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
    }

    body {
      display: flex;
      justify-content: center;
      padding: 24px;
    }

    .worksheet {
      width: min(100%, var(--sheet-width));
      min-height: var(--sheet-height);
      background: var(--paper);
      padding: 0.65in;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.18);
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .worksheet__header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-start;
      border-bottom: 3px solid rgba(15, 118, 110, 0.2);
      padding-bottom: 18px;
    }

    .worksheet__title {
      margin: 0 0 8px;
      font-size: 26px;
      letter-spacing: 0.02em;
      color: var(--accent);
    }

    .worksheet__subtitle {
      margin: 0;
      font-size: 15px;
      color: var(--muted);
      max-width: 4.8in;
      line-height: 1.45;
    }

    .worksheet__meta {
      display: grid;
      gap: 12px;
      min-width: 2.6in;
    }

    .meta-field {
      display: grid;
      gap: 6px;
    }

    .meta-field span {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
    }

    .meta-field input {
      border: none;
      border-bottom: 2px solid var(--line);
      padding: 6px 2px;
      font: inherit;
      background: transparent;
      color: inherit;
    }

    .problem-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px 28px;
      flex: 1;
      align-content: start;
    }

    .problem {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border: 1px solid rgba(148, 163, 184, 0.38);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(241, 245, 249, 0.88));
    }

    .problem__equation {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .problem input {
      width: 100%;
      min-width: 0;
      border: none;
      border-bottom: 2px solid var(--line);
      padding: 8px 4px 6px;
      font-size: 22px;
      font-weight: 600;
      text-align: center;
      background: transparent;
      color: inherit;
    }

    .worksheet__footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid rgba(148, 163, 184, 0.35);
      padding-top: 14px;
    }

    .worksheet__footer strong {
      color: var(--accent);
    }

    input:focus {
      outline: 2px solid rgba(15, 118, 110, 0.24);
      outline-offset: 2px;
      border-bottom-color: var(--accent);
    }

    @page {
      size: letter portrait;
      margin: 0.45in;
    }

    @media print {
      html,
      body {
        background: #ffffff;
      }

      body {
        padding: 0;
      }

      .worksheet {
        width: 100%;
        min-height: 0;
        box-shadow: none;
        padding: 0;
      }

      .problem {
        break-inside: avoid;
      }
    }

    @media (max-width: 760px) {
      body {
        padding: 12px;
      }

      .worksheet {
        padding: 20px;
        min-height: auto;
      }

      .worksheet__header {
        grid-template-columns: 1fr;
        display: grid;
      }

      .worksheet__meta {
        min-width: 0;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .problem-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="worksheet">
    <header class="worksheet__header">
      <div>
        <h1 class="worksheet__title">Simple Addition Practice</h1>
        <p class="worksheet__subtitle">
          Solve each addition problem. Write each answer neatly in the blank space. Take your time and show your best work.
        </p>
      </div>
      <div class="worksheet__meta">
        <label class="meta-field">
          <span>Name</span>
          <input type="text" aria-label="Student name" />
        </label>
        <label class="meta-field">
          <span>Date</span>
          <input type="text" aria-label="Worksheet date" />
        </label>
      </div>
    </header>

    <section class="problem-grid" aria-label="Simple addition problems">
      <label class="problem"><span class="problem__equation">1. 3 + 4 =</span><input type="text" inputmode="numeric" aria-label="Answer for 3 plus 4" /></label>
      <label class="problem"><span class="problem__equation">2. 2 + 6 =</span><input type="text" inputmode="numeric" aria-label="Answer for 2 plus 6" /></label>
      <label class="problem"><span class="problem__equation">3. 5 + 1 =</span><input type="text" inputmode="numeric" aria-label="Answer for 5 plus 1" /></label>
      <label class="problem"><span class="problem__equation">4. 7 + 2 =</span><input type="text" inputmode="numeric" aria-label="Answer for 7 plus 2" /></label>
      <label class="problem"><span class="problem__equation">5. 9 + 0 =</span><input type="text" inputmode="numeric" aria-label="Answer for 9 plus 0" /></label>
      <label class="problem"><span class="problem__equation">6. 8 + 1 =</span><input type="text" inputmode="numeric" aria-label="Answer for 8 plus 1" /></label>
      <label class="problem"><span class="problem__equation">7. 6 + 3 =</span><input type="text" inputmode="numeric" aria-label="Answer for 6 plus 3" /></label>
      <label class="problem"><span class="problem__equation">8. 4 + 5 =</span><input type="text" inputmode="numeric" aria-label="Answer for 4 plus 5" /></label>
      <label class="problem"><span class="problem__equation">9. 1 + 7 =</span><input type="text" inputmode="numeric" aria-label="Answer for 1 plus 7" /></label>
      <label class="problem"><span class="problem__equation">10. 2 + 2 =</span><input type="text" inputmode="numeric" aria-label="Answer for 2 plus 2" /></label>
      <label class="problem"><span class="problem__equation">11. 5 + 4 =</span><input type="text" inputmode="numeric" aria-label="Answer for 5 plus 4" /></label>
      <label class="problem"><span class="problem__equation">12. 3 + 6 =</span><input type="text" inputmode="numeric" aria-label="Answer for 3 plus 6" /></label>
      <label class="problem"><span class="problem__equation">13. 7 + 1 =</span><input type="text" inputmode="numeric" aria-label="Answer for 7 plus 1" /></label>
      <label class="problem"><span class="problem__equation">14. 4 + 4 =</span><input type="text" inputmode="numeric" aria-label="Answer for 4 plus 4" /></label>
      <label class="problem"><span class="problem__equation">15. 6 + 2 =</span><input type="text" inputmode="numeric" aria-label="Answer for 6 plus 2" /></label>
      <label class="problem"><span class="problem__equation">16. 8 + 0 =</span><input type="text" inputmode="numeric" aria-label="Answer for 8 plus 0" /></label>
      <label class="problem"><span class="problem__equation">17. 9 + 1 =</span><input type="text" inputmode="numeric" aria-label="Answer for 9 plus 1" /></label>
      <label class="problem"><span class="problem__equation">18. 3 + 5 =</span><input type="text" inputmode="numeric" aria-label="Answer for 3 plus 5" /></label>
      <label class="problem"><span class="problem__equation">19. 2 + 7 =</span><input type="text" inputmode="numeric" aria-label="Answer for 2 plus 7" /></label>
      <label class="problem"><span class="problem__equation">20. 1 + 8 =</span><input type="text" inputmode="numeric" aria-label="Answer for 1 plus 8" /></label>
      <label class="problem"><span class="problem__equation">21. 4 + 3 =</span><input type="text" inputmode="numeric" aria-label="Answer for 4 plus 3" /></label>
      <label class="problem"><span class="problem__equation">22. 5 + 2 =</span><input type="text" inputmode="numeric" aria-label="Answer for 5 plus 2" /></label>
      <label class="problem"><span class="problem__equation">23. 6 + 1 =</span><input type="text" inputmode="numeric" aria-label="Answer for 6 plus 1" /></label>
      <label class="problem"><span class="problem__equation">24. 7 + 3 =</span><input type="text" inputmode="numeric" aria-label="Answer for 7 plus 3" /></label>
    </section>

    <footer class="worksheet__footer">
      <span><strong>Goal:</strong> Practice simple addition facts with neat handwriting.</span>
      <span>24 problems</span>
    </footer>
  </main>
</body>
</html>
